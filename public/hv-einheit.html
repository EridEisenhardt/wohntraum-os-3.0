<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einheit · Landingpage</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f7f9;--surf:#ffffff;--surf2:#f1f3f6;--line:#e4e7ec;--text:#1c2230;--muted:#6b7280;--accent:#6d4ef0;--accent2:#8266ff;--gold:#b07d1a;--green:#0f9d6b;--red:#d64550;--amber:#c7851d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.55;min-height:100vh}
a{color:var(--accent2);text-decoration:none}
.hero{position:relative;height:230px;background:var(--surf2) center/cover no-repeat;display:flex;align-items:flex-end}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#0d0e1aee 0%,#0d0e1a33 60%,#0d0e1a66 100%)}
.hero .in{position:relative;z-index:2;padding:22px 30px;width:100%}
.back{position:absolute;top:16px;left:22px;z-index:3;font-size:12.5px;color:#fff;background:#0007;padding:6px 12px;border-radius:8px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.bg{font-size:11px;font-weight:700;padding:3px 10px;border-radius:7px;background:#0008;color:#fff;border:1px solid #ffffff22}
.bg.acc{background:var(--accent)} .bg.leer{background:var(--amber)} .bg.belegt{background:var(--green)}
h1{font-size:30px;font-weight:800;line-height:1.1;color:#fff}
.hero .adr{font-size:14px;color:#d6d9ea;margin-top:3px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 30px 60px}
.tabbar{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:22px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px}
.tabbar button{font:inherit;font-size:13px;font-weight:600;padding:11px 15px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabbar button.on{color:var(--text);border-bottom-color:var(--accent)}
.sec{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2);font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fld{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.fld .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.fld .v{font-size:16px;font-weight:700;margin-top:4px}
.prog{height:9px;background:var(--surf2);border-radius:99px;overflow:hidden;margin:6px 0}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.row2{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}.kv .k{color:var(--muted)}.kv .v{font-weight:600;text-align:right}
.person{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.person .nm{font-weight:700;font-size:15px}.person .rl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.person .ct{font-size:12.5px;color:var(--muted);margin-top:6px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.pill{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff}
.empty{color:var(--muted);font-size:13px;padding:18px;text-align:center;background:var(--surf2);border:1px dashed var(--line);border-radius:11px}
.money{font-weight:700} .right{text-align:right}
#map{height:320px;border:1px solid var(--line);border-radius:12px}
.hide{display:none!important}
.mile{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13.5px}
.mile .dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto;border:2px solid var(--line)}
.mile.done .dot{background:var(--green);border-color:var(--green)} .mile .dt{margin-left:auto;color:var(--muted);font-size:12px}
.foto{width:100%;border-radius:12px;border:1px solid var(--line)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
</style></head><body>
<a class="back" href="/hausverwaltung/einheiten" target="_top">← Zurück zu Einheiten</a>
<div class="hero" id="hero"><div class="in">
  <div class="badges" id="badges"></div>
  <h1 id="title">Lädt…</h1>
  <div class="adr" id="adr"></div>
</div></div>
<div class="wrap">
  <div class="tabbar" id="tabbar"></div>
  <div id="content"></div>
</div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const eur=n=>(n==null?'—':new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n));
const dfmt=d=>d?new Date(d).toLocaleDateString('de-DE'):'—';
const KAT={APARTMENT:'Wohnung',RESIDENTIAL_UNIT:'Wohnung',COMMERCIAL:'Gewerbe',COMMERCIAL_UNIT:'Gewerbe',GARAGE:'Garage',PARKING:'Stellplatz',PARKING_SPACE:'Stellplatz',OUTDOOR_PARKING:'Stellplatz',OFFICE:'Büro',STORAGE:'Lager'};
const ZTYP={ELECTRICITY:'⚡ Strom',GAS:'🔥 Gas',WATER_COLD:'💧 Kaltwasser',WATER_HOT:'🚿 Warmwasser',WATER:'💧 Wasser',HEATING:'🔥 Heizung',HEAT:'🔥 Wärme',DISTRICT_HEATING:'🔥 Fernwärme'};
const id=new URLSearchParams(location.search).get('id');
let U,OB,CUR,HIST=[],METERS=[],mapDone=false,activeTab='ueber';
const TABS=[['ueber','Übersicht'],['fotos','Ausstattung & Fotos'],['pipeline','Pipeline'],['mieter','Mieter'],['zaehler','Zähler'],['schluessel','Schlüssel'],['vorgaenge','Vorgänge'],['dok','Dokumente'],['finanzen','Finanzen'],['lage','Lage']];

async function load(){
  if(!id){document.getElementById('title').textContent='Keine Einheit angegeben';return;}
  const {data:u}=await sb.from('nahaus_einheiten').select('*').eq('id',id).maybeSingle();
  if(!u){document.getElementById('title').textContent='Einheit nicht gefunden';return;}
  U=u;
  const [{data:ob},{data:per},{data:mt}]=await Promise.all([
    sb.from('nahaus_objekte').select('*').eq('id',u.property_id).maybeSingle(),
    sb.from('nahaus_mietverhaeltnisse').select('*').eq('unit_id',u.id),
    sb.from('nahaus_zaehler').select('*').or('unit_id.eq.'+u.id+',property_id.eq.'+u.property_id)
  ]);
  OB=ob||{};HIST=(per||[]).sort((a,b)=>(b.start_date||'').localeCompare(a.start_date||''));
  CUR=HIST.find(p=>p.is_current)||null;METERS=mt||[];
  renderHero();renderTabs();show('ueber');
}
function renderHero(){
  if(OB.bild_url)document.getElementById('hero').style.backgroundImage=`url('${OB.bild_url}')`;
  const rented=CUR&&CUR.is_rented;
  document.getElementById('badges').innerHTML=
    `<span class="bg acc">${esc(OB.h_id_text||'')} · ${esc(U.w_id_text||U.label||'')}</span>`+
    `<span class="bg">${esc(KAT[U.kategorie_typ]||U.kategorie_typ||'Einheit')}</span>`+
    `<span class="bg ${rented?'belegt':'leer'}">${rented?'Vermietet':'Leerstehend'}</span>`+
    (OB.energie?`<span class="bg">Energie ${esc(OB.energie)}</span>`:'');
  document.getElementById('title').textContent=(OB.name||U.display_address||'Einheit')+' · '+(U.label||U.w_id_text||'');
  document.getElementById('adr').textContent=[OB.plz,OB.ort].filter(Boolean).join(' ')+(U.display_address?' · '+U.display_address:'');
}
function renderTabs(){document.getElementById('tabbar').innerHTML=TABS.map(([k,l])=>`<button data-k="${k}" class="${k===activeTab?'on':''}" onclick="show('${k}')">${l}</button>`).join('');}
function show(k){activeTab=k;document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  const c=document.getElementById('content');c.innerHTML=({ueber:tUeber,fotos:tFotos,pipeline:tPipeline,mieter:tMieter,zaehler:tZaehler,schluessel:tSchluessel,vorgaenge:tVorgaenge,dok:tDok,finanzen:tFinanzen,lage:tLage}[k])();
  if(k==='lage')setTimeout(drawMap,60);}

function fld(l,v){return `<div class="fld"><div class="l">${l}</div><div class="v">${v==null||v===''?'—':v}</div></div>`;}
function tUeber(){
  const d=U.division||{};
  const stamm=`<div class="sec"><h2>🏠 Stammdaten</h2><div class="grid">
    ${fld('Wohnfläche',U.flaeche?U.flaeche+' m²':'—')}
    ${fld('Zimmer',U.zimmer||'—')}
    ${fld('Schlafzimmer',d.bedRoomsNumber)}
    ${fld('Badezimmer',d.bathRoomsNumber)}
    ${fld('Küche',d.kitchenType||(d.kitchensNumber?d.kitchensNumber+'×':''))}
    ${fld('Objektart',KAT[U.kategorie_typ]||U.kategorie_typ)}
    ${fld('Baujahr',OB.baujahr)}
    ${fld('MEA (Miteigentum)',U.mea?U.mea+' ‰':'—')}
  </div></div>`;
  const rented=CUR&&CUR.is_rented;
  const mieter=`<div class="sec"><h2>👤 Aktueller Mieter</h2>${rented?
    `<div class="person"><div class="nm">${esc(CUR.mieter_namen||'Vermietet')}</div><div class="rl">seit ${dfmt(CUR.start_date)}</div>
     <div class="ct">Kaltmiete ${eur(CUR.kaltmiete)} · Warmmiete ${eur(CUR.warmmiete)} · Kaution ${eur(CUR.kaution)}</div></div>`:
    `<div class="empty">Aktuell leerstehend — kein laufender Mietvertrag.</div>`}</div>`;
  const bet=betSec();
  return stamm+`<div class="row2">${mieter}${bet}</div>`;
}
function betSec(){
  return `<div class="sec"><h2>🤝 Beteiligte</h2><div class="cards3">
    <div class="person"><div class="rl">Eigentümer</div><div class="nm">${esc(OB.eigentuemer||'—')}</div></div>
    <div class="person"><div class="rl">Hausverwaltung</div><div class="nm">${esc(OB.hausverwaltung||'—')}</div><div class="ct">${[OB.hausverwaltung_tel,OB.hausverwaltung_email].filter(Boolean).map(esc).join('<br>')}</div></div>
  </div></div>`;
}
function tFotos(){
  const imgs=[OB.bild_url].filter(Boolean);
  const d=U.division||{},f=U.facility||{};
  return `<div class="sec"><h2>🖼 Fotos</h2>${imgs.length?`<div class="gallery">${imgs.map(u=>`<img class="foto" src="${esc(u)}">`).join('')}</div>`:'<div class="empty">Kein Objektfoto in Nahaus hinterlegt.</div>'}</div>
  <div class="sec"><h2>✨ Ausstattung</h2><div class="grid">
    ${fld('Wohnräume',d.livingRoomsNumber)}${fld('Schlafzimmer',d.bedRoomsNumber)}${fld('Badezimmer',d.bathRoomsNumber)}${fld('WC',d.wcNumber)}${fld('Küche',d.kitchenType)}
  </div></div>`;
}
function tPipeline(){return placeholder('Pipeline','Vermarktungs- & Sanierungs-Pipeline wird nicht aus Nahaus übernommen. Kann später mit OS-Daten verknüpft werden.');}
function tMieter(){
  if(!HIST.length)return `<div class="sec"><h2>👥 Mietverhältnisse</h2><div class="empty">Keine Mietverhältnisse hinterlegt.</div></div>`;
  return `<div class="sec"><h2>👥 Mietverhältnisse (${HIST.length})</h2><table><thead><tr><th>Status</th><th>Mieter</th><th>Von</th><th>Bis</th><th class="right">Kaltmiete</th><th class="right">Kaution</th><th>Kontakt</th></tr></thead><tbody>
  ${HIST.map(p=>{const t=(p.mieter||[])[0]||{};return `<tr>
    <td>${p.is_current?'<span class="pill" style="background:var(--green)">laufend</span>':'<span class="pill" style="background:#555">beendet</span>'}${p.is_rented?'':' <span class="pill" style="background:var(--amber)">leer</span>'}</td>
    <td>${esc(p.mieter_namen||'—')}</td><td>${dfmt(p.start_date)}</td><td>${dfmt(p.end_date)}</td>
    <td class="right money">${p.kaltmiete?eur(p.kaltmiete):'—'}</td><td class="right">${p.kaution?eur(p.kaution):'—'}</td>
    <td>${[t.email,t.tel].filter(Boolean).map(esc).join('<br>')||'—'}</td></tr>`;}).join('')}
  </tbody></table></div>`;
}
function tZaehler(){
  if(!METERS.length)return `<div class="sec"><h2>📟 Zähler</h2><div class="empty">Keine Zähler hinterlegt.</div></div>`;
  return `<div class="sec"><h2>📟 Zähler (${METERS.length})</h2><table><thead><tr><th>Art</th><th>Zählernr.</th><th>Beschreibung</th><th>Standort</th><th class="right">Letzter Stand</th><th>Datum</th></tr></thead><tbody>
  ${METERS.map(m=>`<tr><td>${esc(ZTYP[m.typ]||m.typ||'—')}</td><td>${esc(m.m_id||'—')}</td><td>${esc(m.beschreibung||'—')}</td><td>${esc(m.standort||(m.unit_id?'Einheit':'Allgemein'))}</td><td class="right">${m.stand_wert!=null?esc(m.stand_wert):'—'}</td><td>${dfmt(m.stand_datum)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function tSchluessel(){return placeholder('Schlüssel','Schlüsselverwaltung wird nicht aus Nahaus übernommen.');}
function tVorgaenge(){return placeholder('Vorgänge','Offene Vorgänge / Aufgaben werden nicht aus Nahaus übernommen.');}
function tDok(){return placeholder('Dokumente','Dokumente liegen in Nahaus bzw. im OS-DMS. Verknüpfung später möglich.');}
function tFinanzen(){
  const c=CUR||{};
  const soll=c.is_rented?c.kaltmiete:null;
  return `<div class="sec"><h2>💶 Mieteinnahmen (aktuell)</h2><div class="grid">
    ${fld('Kaltmiete',eur(c.kaltmiete))}${fld('Betriebskosten',eur(c.betriebskosten))}${fld('Heizkosten',eur(c.heizkosten))}${fld('Nebenkosten ges.',eur(c.nebenkosten))}${fld('Warmmiete',eur(c.warmmiete))}${fld('Kaution',eur(c.kaution))}
  </div></div>
  <div class="sec"><h2>📊 Kennzahlen</h2>
   <div class="kv"><span class="k">Soll-Kaltmiete / Monat</span><span class="v">${soll?eur(soll):'leerstehend'}</span></div>
   <div class="kv"><span class="k">Soll-Kaltmiete / Jahr</span><span class="v">${soll?eur(soll*12):'—'}</span></div>
   <div class="kv"><span class="k">Zahlungsreferenz</span><span class="v">${esc(c.zahlungsreferenz||'—')}</span></div>
   <div class="kv"><span class="k">Wohnfläche</span><span class="v">${U.flaeche?U.flaeche+' m²':'—'}</span></div>
   <div class="kv"><span class="k">Miete / m²</span><span class="v">${(soll&&U.flaeche)?eur(soll/U.flaeche)+' /m²':'—'}</span></div>
  </div>`;
}
function tLage(){
  const a=[OB.display_address||U.display_address].filter(Boolean)[0]||'';
  return `<div class="sec"><h2>📍 Lage</h2><div style="color:var(--muted);font-size:13px;margin-bottom:10px">${esc(a)}</div>${(OB.lat&&OB.lng)?'<div id="map"></div>':'<div class="empty">Keine Geokoordinaten hinterlegt.</div>'}</div>`;
}
function placeholder(t,m){return `<div class="sec"><h2>${esc(t)}</h2><div class="empty">${esc(m)}</div></div>`;}
function drawMap(){if(mapDone||!OB.lat||!OB.lng)return;const map=L.map('map').setView([OB.lat,OB.lng],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);L.marker([OB.lat,OB.lng]).addTo(map).bindPopup(esc(OB.name||'')).openPopup();mapDone=true;}
load();
</script></body></html>
