<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einheit · Landingpage</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f7f9;--surf:#ffffff;--surf2:#f1f3f6;--line:#e4e7ec;--text:#1c2230;--muted:#6b7280;--accent:#6d4ef0;--accent2:#8266ff;--gold:#b07d1a;--green:#0f9d6b;--red:#d64550;--amber:#c7851d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.55;min-height:100vh}
a{color:var(--accent2);text-decoration:none}
.hero{position:relative;height:230px;background:var(--surf2) center/cover no-repeat;display:flex;align-items:flex-end}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#0d0e1aee 0%,#0d0e1a33 60%,#0d0e1a66 100%)}
.hero .in{position:relative;z-index:2;padding:22px 30px;width:100%}
.back{position:absolute;top:16px;left:22px;z-index:3;font-size:12.5px;color:#fff;background:#0007;padding:6px 12px;border-radius:8px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.bg{font-size:11px;font-weight:700;padding:3px 10px;border-radius:7px;background:#0008;color:#fff;border:1px solid #ffffff22}
.bg.acc{background:var(--accent)} .bg.leer{background:var(--amber)} .bg.belegt{background:var(--green)}
h1{font-size:30px;font-weight:800;line-height:1.1;color:#fff}
.hero .adr{font-size:14px;color:#d6d9ea;margin-top:3px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 30px 60px}
.tabbar{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:22px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px}
.tabbar button{font:inherit;font-size:13px;font-weight:600;padding:11px 15px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabbar button.on{color:var(--text);border-bottom-color:var(--accent)}
.sec{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2);font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fld{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.fld .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.fld .v{font-size:16px;font-weight:700;margin-top:4px}
.prog{height:9px;background:var(--surf2);border-radius:99px;overflow:hidden;margin:6px 0}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.row2{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}.kv .k{color:var(--muted)}.kv .v{font-weight:600;text-align:right}
.person{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.person .nm{font-weight:700;font-size:15px}.person .rl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.person .ct{font-size:12.5px;color:var(--muted);margin-top:6px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.pill{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff}
.empty{color:var(--muted);font-size:13px;padding:18px;text-align:center;background:var(--surf2);border:1px dashed var(--line);border-radius:11px}
.frist{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:12px 15px}
.frist .fl{font-weight:600;font-size:13.5px;min-width:200px}
.frist input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;background:var(--surf)}
.noteadd{display:flex;gap:10px;margin-bottom:14px}
.noteadd textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;resize:vertical}
.noteadd button,.noteH button{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:0 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.notes{display:flex;flex-direction:column;gap:10px}
.note{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:11px 14px}
.note .nt{font-size:13.5px;line-height:1.5}
.note .nmeta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:10px}
.note .del{background:none;border:0;color:var(--red,#c0392b);cursor:pointer;font-size:11px;padding:0}
.money{font-weight:700} .right{text-align:right}
#map{height:320px;border:1px solid var(--line);border-radius:12px}
.hide{display:none!important}
.mile{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--line)}
.mile:last-child{border-bottom:none}
.mile .dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto;border:2px dashed var(--line)}
.mile.done .dot{background:var(--green);border-color:var(--green);border-style:solid} .mile .dt{margin-left:auto;color:var(--muted);font-size:11px}
.mile.done .dt{color:var(--green)}
/* Vollständigkeit */
.vhd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vpct{font-size:20px;font-weight:800;color:var(--accent)}
.vsub{font-size:12px;color:var(--muted);margin:8px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:600;background:var(--surf2);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
/* Mieter */
.mieter{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:820px){.mieter{grid-template-columns:1fr}}
.phead{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:15px}
.pnm{font-weight:700;font-size:15px}.pc{font-size:12.5px;color:var(--muted)}
.mrtitle{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:6px}
.kv.warm .v{color:var(--green);font-weight:800}.kv.warm{border-top:1px solid var(--line)}
.ghost{background:var(--surf2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--text)}
.ghost.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.ghost.sm{padding:5px 11px;font-size:12px;margin:0 6px 6px 0}
/* Termine */
.sublbl,.sfilter{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:10px 0 6px}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.trow .ti{font-size:17px}.trow .ttn{font-weight:600;font-size:14px}.trow .ttd{font-size:12px;color:var(--muted)}
.trow .tw{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
/* Beteiligte */
.betgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.betc{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.bch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.brl{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.bplus{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--surf);cursor:pointer;font-weight:700;color:var(--muted)}
.bperson{position:relative}.bpnm{font-weight:700;font-size:14.5px}.bpsub{font-size:11.5px;color:var(--muted);margin:2px 0 5px}
.bpc{font-size:12px;color:var(--muted)}
.bpdel{position:absolute;top:0;right:0;font-size:12px}
.bempty,.dlempty{font-size:12.5px;color:var(--muted);font-style:italic}
.dlhint{font-size:11.5px;color:var(--muted);margin-top:10px}
/* Transaktion */
.milebar{display:flex;align-items:center;gap:4px}
.milebar .mb{width:16px;height:5px;border-radius:3px;background:var(--line)}.milebar .mb.on{background:var(--accent)}
.milecount{font-size:11.5px;color:var(--muted);font-weight:700;margin-left:8px}
.txc{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.txh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.txicon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--surf)}
.txicon.ankauf{background:#0f9d6b22}.txicon.verkauf{background:#8266ff22}
.txttl{font-weight:800;font-size:16px;margin-right:auto}
.pbtns{margin-bottom:10px}
.stellbox{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-top:12px}
.sbtl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.sbnum{font-size:11.5px;color:var(--muted);font-weight:700}
.stellrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--accent2)}
.stellrow .dt{margin-left:auto;color:var(--muted);font-size:11.5px}
.foto{width:100%;border-radius:12px;border:1px solid var(--line)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
</style></head><body>
<a class="back" href="/hausverwaltung/einheiten" target="_top">← Zurück zu Einheiten</a>
<div class="hero" id="hero"><div class="in">
  <div class="badges" id="badges"></div>
  <h1 id="title">Lädt…</h1>
  <div class="adr" id="adr"></div>
</div></div>
<div class="wrap">
  <div class="tabbar" id="tabbar"></div>
  <div id="content"></div>
</div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const eur=n=>(n==null?'—':new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n));
const dfmt=d=>d?new Date(d).toLocaleDateString('de-DE'):'—';
const KAT={APARTMENT:'Wohnung',RESIDENTIAL_UNIT:'Wohnung',COMMERCIAL:'Gewerbe',COMMERCIAL_UNIT:'Gewerbe',GARAGE:'Garage',PARKING:'Stellplatz',PARKING_SPACE:'Stellplatz',OUTDOOR_PARKING:'Stellplatz',OFFICE:'Büro',STORAGE:'Lager'};
const ZTYP={ELECTRICITY:'⚡ Strom',GAS:'🔥 Gas',WATER_COLD:'💧 Kaltwasser',WATER_HOT:'🚿 Warmwasser',WATER:'💧 Wasser',HEATING:'🔥 Heizung',HEAT:'🔥 Wärme',DISTRICT_HEATING:'🔥 Fernwärme'};
const id=new URLSearchParams(location.search).get('id');
let U,OB,CUR,HIST=[],METERS=[],NOTES=[],BET=[],TERMINE=[],TX={},SIB=[],mapDone=false,activeTab='ueber';
const TABS=[['ueber','Übersicht'],['fotos','Ausstattung & Fotos'],['pipeline','Pipeline'],['mieter','Mieter'],['zaehler','Zähler'],['schluessel','Schlüssel'],['vorgaenge','Vorgänge'],['dok','Dokumente'],['finanzen','Finanzen'],['lage','Lage']];

async function load(){
  if(!id){document.getElementById('title').textContent='Keine Einheit angegeben';return;}
  const {data:u}=await sb.from('nahaus_einheiten').select('*').eq('id',id).maybeSingle();
  if(!u){document.getElementById('title').textContent='Einheit nicht gefunden';return;}
  U=u;
  const [{data:ob},{data:per},{data:mt},{data:nz},{data:bt},{data:tm},{data:tx},{data:sib}]=await Promise.all([
    sb.from('nahaus_objekte').select('*').eq('id',u.property_id).maybeSingle(),
    sb.from('nahaus_mietverhaeltnisse').select('*').eq('unit_id',u.id),
    sb.from('nahaus_zaehler').select('*').or('unit_id.eq.'+u.id+',property_id.eq.'+u.property_id),
    sb.from('nahaus_objekt_notizen').select('*').eq('object_id',u.property_id).order('created_at',{ascending:false}),
    sb.from('nahaus_objekt_beteiligte').select('*').eq('object_id',u.property_id),
    sb.from('nahaus_objekt_termine').select('*').eq('object_id',u.property_id).order('datum',{ascending:true}),
    sb.from('nahaus_objekt_transaktion').select('*').eq('object_id',u.property_id),
    sb.from('nahaus_einheiten').select('id,w_id_text,label,kategorie_typ,display_address').eq('property_id',u.property_id)
  ]);
  OB=ob||{};HIST=(per||[]).sort((a,b)=>(b.start_date||'').localeCompare(a.start_date||''));
  CUR=HIST.find(p=>p.is_current)||null;METERS=mt||[];NOTES=nz||[];
  BET=bt||[];TERMINE=tm||[];TX={};(tx||[]).forEach(r=>{TX[r.typ]=r;});SIB=sib||[];
  renderHero();renderTabs();show('ueber');
}
function renderHero(){
  if(OB.bild_url)document.getElementById('hero').style.backgroundImage=`url('${OB.bild_url}')`;
  const rented=CUR&&CUR.is_rented;
  document.getElementById('badges').innerHTML=
    `<span class="bg acc">${esc(OB.h_id_text||'')} · ${esc(U.w_id_text||U.label||'')}</span>`+
    `<span class="bg">${esc(KAT[U.kategorie_typ]||U.kategorie_typ||'Einheit')}</span>`+
    `<span class="bg ${rented?'belegt':'leer'}">${rented?'Vermietet':'Leerstehend'}</span>`+
    (OB.energie?`<span class="bg">Energie ${esc(OB.energie)}</span>`:'');
  document.getElementById('title').textContent=(OB.name||U.display_address||'Einheit')+' · '+(U.label||U.w_id_text||'');
  document.getElementById('adr').textContent=[OB.plz,OB.ort].filter(Boolean).join(' ')+(U.display_address?' · '+U.display_address:'');
}
function renderTabs(){document.getElementById('tabbar').innerHTML=TABS.map(([k,l])=>`<button data-k="${k}" class="${k===activeTab?'on':''}" onclick="show('${k}')">${l}</button>`).join('');}
function show(k){activeTab=k;document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  const c=document.getElementById('content');c.innerHTML=({ueber:tUeber,fotos:tFotos,pipeline:tPipeline,mieter:tMieter,zaehler:tZaehler,schluessel:tSchluessel,vorgaenge:tVorgaenge,dok:tDok,finanzen:tFinanzen,lage:tLage}[k])();
  if(k==='lage')setTimeout(drawMap,60);}

function fld(l,v){return `<div class="fld"><div class="l">${l}</div><div class="v">${v==null||v===''?'—':v}</div></div>`;}
function tUeber(){
  return vollSec()+mieterSec()+termineSec()+notizenSec()+betSec()+dienstSec()+stammSec();
}
/* ---------- Objekt-Vollständigkeit ---------- */
function areas(){
  const d=U.division||{};const txA=TX.ankauf||{};
  return [
    ['Stammdaten','🏠', !!(U.flaeche&&U.zimmer&&OB.baujahr)],
    ['Mietverhältnis','👤', !!CUR],
    ['Fotos','🖼', !!OB.bild_url],
    ['Grundbuch & Miteigentum','📜', !!U.mea],
    ['Energieausweis & Heizung','⚡', !!(OB.energie&&OB.energieausweis_gueltig_bis)],
    ['Anschaffung & Kauf','🧾', !!(txA.partner||txA.m_kaufvertrag||txA.notar)],
    ['Finanzierung','🏦', false],
    ['Laufende Kosten','💡', false],
    ['Steuer & AfA','📊', false],
    ['Schlüssel','🔑', false],
    ['Zähler','🔢', METERS.length>0]
  ];
}
function vollSec(){
  const A=areas();const done=A.filter(a=>a[2]).length;const pct=Math.round(done/A.length*100);
  const open=A.filter(a=>!a[2]);
  return `<div class="sec"><div class="vhd"><h2 style="margin:0">Objekt-Vollständigkeit</h2><div class="vpct">${pct}%</div></div>
    <div class="prog" style="margin-top:12px"><i style="width:${pct}%"></i></div>
    <div class="vsub">${open.length} Bereich(e) noch offen</div>
    <div class="chips">${open.map(a=>`<span class="chip">${a[1]} ${esc(a[0])}</span>`).join('')||'<span style="color:var(--green);font-weight:600">Alle Bereiche vollständig ✓</span>'}</div>
  </div>`;
}
/* ---------- Aktueller Mieter ---------- */
function mieterSec(){
  const rented=CUR&&CUR.is_rented;
  if(!rented)return `<div class="sec"><h2>👤 Aktueller Mieter</h2><div class="empty">Aktuell leerstehend — kein laufender Mietvertrag.</div></div>`;
  const t=(CUR.mieter||[])[0]||{};
  const nm=CUR.mieter_namen||'Vermietet';
  const ini=nm.split(/\s+/).map(x=>x[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
  const pers=CUR.personen_haushalt||t.personen||(CUR.mieter||[]).length||'—';
  const nk=CUR.nebenkosten!=null?CUR.nebenkosten:CUR.betriebskosten;
  const vrows=[['Kaltmiete',CUR.kaltmiete,false],['Nebenkosten',nk,false],['Heizkosten',CUR.heizkosten,false],['Warmmiete',CUR.warmmiete,true]];
  return `<div class="sec"><h2>👤 Aktueller Mieter</h2>
    <div class="mieter">
      <div class="ml">
        <div class="phead"><div class="avatar">${esc(ini||'–')}</div>
          <div><div class="pnm">${esc(nm)}</div>
          ${t.email?`<div class="pc"><a href="mailto:${esc(t.email)}">${esc(t.email)}</a></div>`:''}
          ${t.tel?`<div class="pc">${esc(t.tel)}</div>`:''}</div></div>
        <div class="kv"><span class="k">Personen im Haushalt</span><span class="v">${esc(pers)}</span></div>
        <div class="kv"><span class="k">Mietbeginn</span><span class="v">${dfmt(CUR.start_date)}</span></div>
        <button class="ghost" style="margin-top:14px" onclick="show('mieter')">Mieter-Tab öffnen →</button>
      </div>
      <div class="mr">
        <div class="mrtitle">Mietvertrag</div>
        ${vrows.map(r=>`<div class="kv ${r[2]?'warm':''}"><span class="k">${r[0]}</span><span class="v">${eur(r[1])}</span></div>`).join('')}
      </div>
    </div></div>`;
}
/* ---------- Anstehende Termine ---------- */
function termineSec(){
  const g=OB.energieausweis_gueltig_bis||'';
  let fr='';
  if(g){const days=Math.round((new Date(g)-new Date())/86400000);
    const w=days<0?'abgelaufen':(days<365?'in '+days+' T.':'in '+Math.round(days/365*10)/10+' J.');
    fr=`<div class="trow"><div class="ti">⚡</div><div class="tt"><div class="ttn">Energieausweis-Gültigkeit</div><div class="ttd">${dfmt(g)}</div></div><div class="tw">${w}</div></div>`;
  }else{
    fr=`<div class="trow"><div class="ti">⚡</div><div class="tt"><div class="ttn">Energieausweis-Gültigkeit</div><div class="ttd"><input type="date" onchange="saveFrist('energieausweis_gueltig_bis',this.value)" style="margin-top:3px"></div></div><div class="tw" style="color:var(--muted)">offen</div></div>`;
  }
  const custom=TERMINE.map(t=>{const days=t.datum?Math.round((new Date(t.datum)-new Date())/86400000):null;
    return `<div class="trow"><div class="ti">📌</div><div class="tt"><div class="ttn">${esc(t.titel)}</div><div class="ttd">${dfmt(t.datum)}</div></div><div class="tw">${days!=null?(days<0?'vorbei':'in '+days+' T.'):''} <button class="del" onclick="delTermin('${t.id}')">×</button></div></div>`;}).join('');
  return `<div class="sec"><div class="vhd"><h2 style="margin:0">📅 Anstehende Termine</h2><button class="ghost acc" onclick="addTermin()">+ Termin planen</button></div>
    <div class="sublbl">Fristen &amp; Ablaufdaten · automatisch</div>
    ${fr}${custom}
  </div>`;
}
async function saveFrist(col,val){await sb.from('nahaus_objekte').update({[col]:val||null}).eq('id',OB.id);OB[col]=val||null;show('ueber');}
async function addTermin(){const titel=prompt('Titel des Termins:');if(!titel)return;const datum=prompt('Datum (JJJJ-MM-TT):','');
  const {data}=await sb.from('nahaus_objekt_termine').insert({object_id:OB.id,titel:titel.trim(),datum:datum&&/^\d{4}-\d{2}-\d{2}$/.test(datum)?datum:null}).select().maybeSingle();
  if(data){TERMINE.push(data);TERMINE.sort((a,b)=>(a.datum||'').localeCompare(b.datum||''));}show('ueber');}
async function delTermin(id){await sb.from('nahaus_objekt_termine').delete().eq('id',id);TERMINE=TERMINE.filter(t=>t.id!==id);show('ueber');}
function notizenSec(){
  const list=NOTES.length?NOTES.map(n=>`<div class="note"><div class="nt">${esc(n.text).replace(/\n/g,'<br>')}</div><div class="nmeta">${dfmt(n.created_at)} <button class="del" onclick="delNote('${n.id}')">löschen</button></div></div>`).join(''):'<div class="empty">Noch keine Notizen.</div>';
  return `<div class="sec"><h2>📝 Notizen</h2>
    <div class="noteadd"><textarea id="noteInput" rows="2" placeholder="Notiz zum Objekt hinzufügen…"></textarea><button onclick="addNote()">+ Hinzufügen</button></div>
    <div class="notes">${list}</div></div>`;
}
async function addNote(){const el=document.getElementById('noteInput');const t=(el.value||'').trim();if(!t)return;
  const {data}=await sb.from('nahaus_objekt_notizen').insert({object_id:OB.id,text:t}).select().maybeSingle();
  if(data)NOTES.unshift(data);show('ueber');}
async function delNote(nid){await sb.from('nahaus_objekt_notizen').delete().eq('id',nid);NOTES=NOTES.filter(n=>n.id!==nid);show('ueber');}
/* ---------- Beteiligte ---------- */
const ROLLEN=[['vermieter','👤 Vermieter'],['hausverwaltung','🏢 Hausverwaltung'],['hausverwalter','🧑‍💼 Hausverwalter'],['objekthausmeister','🔧 Objekthausmeister']];
function betCard(roleKey,roleLbl){
  const rows=BET.filter(b=>b.rolle===roleKey);
  let seedNm='',seedSub='',seedCt='';
  if(!rows.length&&roleKey==='vermieter'&&OB.eigentuemer){seedNm=OB.eigentuemer;}
  if(!rows.length&&roleKey==='hausverwaltung'&&OB.hausverwaltung){seedNm=OB.hausverwaltung;seedCt=[OB.hausverwaltung_tel,OB.hausverwaltung_email].filter(Boolean).join(' · ');}
  let body;
  if(rows.length){
    body=rows.map(b=>`<div class="bperson"><div class="bpnm">${esc(b.name||'—')}</div>${b.sub?`<div class="bpsub">${esc(b.sub)}</div>`:''}
      ${b.tel?`<div class="bpc">📞 ${esc(b.tel)}</div>`:''}${b.email?`<div class="bpc">✉️ ${esc(b.email)}</div>`:''}
      <button class="del bpdel" onclick="delBet('${b.id}')">🗑</button></div>`).join('');
  }else if(seedNm){
    body=`<div class="bperson"><div class="bpnm">${esc(seedNm)}</div>${seedCt?`<div class="bpc">${esc(seedCt)}</div>`:''}</div>`;
  }else{
    const hint=roleKey==='hausverwalter'?'— erst Hausverwaltung wählen':'— nicht zugeordnet';
    body=`<div class="bempty">${hint}</div>`;
  }
  return `<div class="betc"><div class="bch"><span class="brl">${roleLbl}</span><button class="bplus" onclick="addBet('${roleKey}')">+</button></div>${body}</div>`;
}
function betSec(){
  return `<div class="sec"><h2>🤝 Beteiligte</h2><div class="betgrid">
    ${ROLLEN.map(r=>betCard(r[0],r[1])).join('')}
  </div></div>`;
}
async function addBet(rolle){const name=prompt('Name / Firma:');if(!name)return;
  const sub=prompt('Rolle/Zusatz (optional):','')||null;const tel=prompt('Telefon (optional):','')||null;const email=prompt('E-Mail (optional):','')||null;
  const {data}=await sb.from('nahaus_objekt_beteiligte').insert({object_id:OB.id,rolle,name:name.trim(),sub,tel,email}).select().maybeSingle();
  if(data)BET.push(data);show('ueber');}
async function delBet(id){await sb.from('nahaus_objekt_beteiligte').delete().eq('id',id);BET=BET.filter(b=>b.id!==id);show('ueber');}
/* ---------- Dienstleister ---------- */
function dienstSec(){
  const ds=BET.filter(b=>b.rolle==='dienstleister');
  const body=ds.length
    ? `<div class="betgrid">${ds.map(b=>`<div class="betc"><div class="bperson"><div class="bpnm">${esc(b.name)}</div>${b.sub?`<div class="bpsub">${esc(b.sub)}</div>`:''}${b.tel?`<div class="bpc">📞 ${esc(b.tel)}</div>`:''}${b.email?`<div class="bpc">✉️ ${esc(b.email)}</div>`:''}<button class="del bpdel" onclick="delBet('${b.id}')">🗑</button></div></div>`).join('')}</div>`
    : `<div class="dlempty">— noch keine Dienstleister. Sobald ein Auftrag, Angebot, eine Rechnung oder ein Dokument auf eine Firma zeigt, taucht sie hier automatisch auf. Wer schon vorher hierher gehört, lässt sich oben rechts von Hand verknüpfen.</div>
       <div class="dlhint">Kein beauftragbarer Dienstleister für: Sanitär · Elektro · Heizung</div>`;
  return `<div class="sec"><div class="vhd"><h2 style="margin:0">🔧 Dienstleister</h2><button class="bplus" onclick="addBet('dienstleister')">+</button></div>${body}</div>`;
}
/* ---------- Stammdaten ---------- */
function stammSec(){
  const d=U.division||{};
  const stell=SIB.filter(s=>/PARK/.test(s.kategorie_typ||''));
  const stellTxt=stell.length?stell.map(s=>KAT[s.kategorie_typ]||'Stellplatz').join(', '):(KAT[U.kategorie_typ]||'');
  const etage=U.etage||d.floor||U.lage||'—';
  return `<div class="sec"><h2>🏠 Stammdaten</h2><div class="grid">
    ${fld('Wohnfläche',U.flaeche?U.flaeche+' m²':'—')}
    ${fld('Zimmer',U.zimmer||'—')}
    ${fld('Etage',etage)}
    ${fld('WE-Nr. Hausverwaltung',U.we_nr_hv||'—')}
    ${fld('Baujahr',OB.baujahr)}
    ${fld('Objektart',KAT[U.kategorie_typ]||U.kategorie_typ)}
    ${fld('Stellplätze',stellTxt||'—')}
  </div></div>`;
}
/* ---------- Termine & Transaktion ---------- */
const MILES=[['m_kaufvertrag','Kaufvertrag'],['m_zahlung','Zahlung Kaufpreis'],['m_uebergabe','Übergabe Nutzen/Lasten'],['m_grundbuch','Eintragung Grundbuch']];
function txCard(typ,lbl,icon,parties){
  const t=TX[typ]||{};
  const rows=MILES.map(m=>`<div class="mile ${t[m[0]]?'done':''}" onclick="toggleMile('${typ}','${m[0]}')"><span class="dot"></span>${m[1]}<span class="dt">${t[m[0]]?'erledigt':'offen'}</span></div>`).join('');
  const pbtns=parties.map(p=>{const val=t[p[1]];return `<button class="ghost sm" onclick="setParty('${typ}','${p[1]}')">${val?'✓ '+esc(val):'+ '+p[0]}</button>`;}).join('');
  const anyDone=MILES.some(m=>t[m[0]]);
  return `<div class="txc"><div class="txh"><div class="txicon ${typ}">${icon}</div><div class="txttl">${lbl}</div><span class="pill" style="background:${anyDone?'var(--accent)':'#9aa0ad'}">${anyDone?'in Arbeit':'offen'}</span></div>
    <div class="pbtns">${pbtns}</div>
    ${rows}</div>`;
}
function transaktSec(){
  const done=['ankauf','verkauf'].reduce((s,ty)=>s+MILES.filter(m=>(TX[ty]||{})[m[0]]).length,0);
  const stell=SIB.filter(s=>/PARK/.test(s.kategorie_typ||''));
  const stellBlock=stell.length?`<div class="stellbox"><div class="vhd"><span class="sbtl">Stellplätze im Verkauf</span><span class="sbnum">${stell.length} von ${stell.length}</span></div>
    ${stell.map(s=>`<div class="stellrow"><span class="sdot"></span><b>${esc(s.w_id_text||s.label||'')}</b> ${esc(KAT[s.kategorie_typ]||'Stellplatz')}<span class="dt">geht mit</span></div>`).join('')}</div>`:'';
  return `<div class="sec"><div class="vhd"><h2 style="margin:0">📅 Termine &amp; Transaktion</h2><div class="milebar">${'▬'.repeat(8).split('').map((_,i)=>`<span class="mb ${i<done?'on':''}"></span>`).join('')}<span class="milecount">${done}/8 Meilensteine</span></div></div>
    <div class="row2">
      ${txCard('ankauf','Ankauf','🏠',[['Verkäufer wählen','partner'],['Notar wählen','notar']])}
      <div>${txCard('verkauf','Verkauf','💎',[['Käufer wählen','partner'],['Verkaufsmakler wählen','makler'],['Notar wählen','notar']])}${stellBlock}</div>
    </div></div>`;
}
async function toggleMile(typ,col){
  const cur=TX[typ]||{object_id:OB.id,typ};const nv=!cur[col];
  const payload={object_id:OB.id,typ,[col]:nv};
  const {data}=await sb.from('nahaus_objekt_transaktion').upsert(payload,{onConflict:'object_id,typ'}).select().maybeSingle();
  TX[typ]=data||Object.assign(cur,{[col]:nv});show('ueber');}
async function setParty(typ,col){const cur=TX[typ]||{};const val=prompt('Name:',cur[col]||'');if(val===null)return;
  const {data}=await sb.from('nahaus_objekt_transaktion').upsert({object_id:OB.id,typ,[col]:val.trim()||null},{onConflict:'object_id,typ'}).select().maybeSingle();
  TX[typ]=data||Object.assign(cur,{[col]:val});show('ueber');}
function tFotos(){
  const imgs=[OB.bild_url].filter(Boolean);
  const d=U.division||{},f=U.facility||{};
  return `<div class="sec"><h2>🖼 Fotos</h2>${imgs.length?`<div class="gallery">${imgs.map(u=>`<img class="foto" src="${esc(u)}">`).join('')}</div>`:'<div class="empty">Kein Objektfoto in Nahaus hinterlegt.</div>'}</div>
  <div class="sec"><h2>✨ Ausstattung</h2><div class="grid">
    ${fld('Wohnräume',d.livingRoomsNumber)}${fld('Schlafzimmer',d.bedRoomsNumber)}${fld('Badezimmer',d.bathRoomsNumber)}${fld('WC',d.wcNumber)}${fld('Küche',d.kitchenType)}
  </div></div>`;
}
function tPipeline(){return placeholder('Pipeline','Vermarktungs- & Sanierungs-Pipeline wird nicht aus Nahaus übernommen. Kann später mit OS-Daten verknüpft werden.');}
function tMieter(){
  if(!HIST.length)return `<div class="sec"><h2>👥 Mietverhältnisse</h2><div class="empty">Keine Mietverhältnisse hinterlegt.</div></div>`;
  return `<div class="sec"><h2>👥 Mietverhältnisse (${HIST.length})</h2><table><thead><tr><th>Status</th><th>Mieter</th><th>Von</th><th>Bis</th><th class="right">Kaltmiete</th><th class="right">Kaution</th><th>Kontakt</th></tr></thead><tbody>
  ${HIST.map(p=>{const t=(p.mieter||[])[0]||{};return `<tr>
    <td>${p.is_current?'<span class="pill" style="background:var(--green)">laufend</span>':'<span class="pill" style="background:#555">beendet</span>'}${p.is_rented?'':' <span class="pill" style="background:var(--amber)">leer</span>'}</td>
    <td>${esc(p.mieter_namen||'—')}</td><td>${dfmt(p.start_date)}</td><td>${dfmt(p.end_date)}</td>
    <td class="right money">${p.kaltmiete?eur(p.kaltmiete):'—'}</td><td class="right">${p.kaution?eur(p.kaution):'—'}</td>
    <td>${[t.email,t.tel].filter(Boolean).map(esc).join('<br>')||'—'}</td></tr>`;}).join('')}
  </tbody></table></div>`;
}
function tZaehler(){
  if(!METERS.length)return `<div class="sec"><h2>📟 Zähler</h2><div class="empty">Keine Zähler hinterlegt.</div></div>`;
  return `<div class="sec"><h2>📟 Zähler (${METERS.length})</h2><table><thead><tr><th>Art</th><th>Zählernr.</th><th>Beschreibung</th><th>Standort</th><th class="right">Letzter Stand</th><th>Datum</th></tr></thead><tbody>
  ${METERS.map(m=>`<tr><td>${esc(ZTYP[m.typ]||m.typ||'—')}</td><td>${esc(m.m_id||'—')}</td><td>${esc(m.beschreibung||'—')}</td><td>${esc(m.standort||(m.unit_id?'Einheit':'Allgemein'))}</td><td class="right">${m.stand_wert!=null?esc(m.stand_wert):'—'}</td><td>${dfmt(m.stand_datum)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function tSchluessel(){return placeholder('Schlüssel','Schlüsselverwaltung wird nicht aus Nahaus übernommen.');}
function tVorgaenge(){return placeholder('Vorgänge','Offene Vorgänge / Aufgaben werden nicht aus Nahaus übernommen.');}
function tDok(){return placeholder('Dokumente','Dokumente liegen in Nahaus bzw. im OS-DMS. Verknüpfung später möglich.');}
function tFinanzen(){
  const c=CUR||{};
  const soll=c.is_rented?c.kaltmiete:null;
  return `<div class="sec"><h2>💶 Mieteinnahmen (aktuell)</h2><div class="grid">
    ${fld('Kaltmiete',eur(c.kaltmiete))}${fld('Betriebskosten',eur(c.betriebskosten))}${fld('Heizkosten',eur(c.heizkosten))}${fld('Nebenkosten ges.',eur(c.nebenkosten))}${fld('Warmmiete',eur(c.warmmiete))}${fld('Kaution',eur(c.kaution))}
  </div></div>
  <div class="sec"><h2>📊 Kennzahlen</h2>
   <div class="kv"><span class="k">Soll-Kaltmiete / Monat</span><span class="v">${soll?eur(soll):'leerstehend'}</span></div>
   <div class="kv"><span class="k">Soll-Kaltmiete / Jahr</span><span class="v">${soll?eur(soll*12):'—'}</span></div>
   <div class="kv"><span class="k">Zahlungsreferenz</span><span class="v">${esc(c.zahlungsreferenz||'—')}</span></div>
   <div class="kv"><span class="k">Wohnfläche</span><span class="v">${U.flaeche?U.flaeche+' m²':'—'}</span></div>
   <div class="kv"><span class="k">Miete / m²</span><span class="v">${(soll&&U.flaeche)?eur(soll/U.flaeche)+' /m²':'—'}</span></div>
  </div>`;
}
function tLage(){
  const a=[OB.display_address||U.display_address].filter(Boolean)[0]||'';
  return `<div class="sec"><h2>📍 Lage</h2><div style="color:var(--muted);font-size:13px;margin-bottom:10px">${esc(a)}</div>${(OB.lat&&OB.lng)?'<div id="map"></div>':'<div class="empty">Keine Geokoordinaten hinterlegt.</div>'}</div>`;
}
function placeholder(t,m){return `<div class="sec"><h2>${esc(t)}</h2><div class="empty">${esc(m)}</div></div>`;}
function drawMap(){if(mapDone||!OB.lat||!OB.lng)return;const map=L.map('map').setView([OB.lat,OB.lng],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);L.marker([OB.lat,OB.lng]).addTo(map).bindPopup(esc(OB.name||'')).openPopup();mapDone=true;}
load();
</script></body></html>
