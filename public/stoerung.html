<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Störung melden</title>
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#18202c;--muted:#5f6b7a;--line:#e0e5eb;--soft:#eef1f5;--accent:#2f5d8a;--accent-soft:#e3ecf5;--pos:#1d7a4c;--pos-bg:#e5f4ec;--neg:#b42318;--neg-bg:#fcebe9;--warn:#946200;--warn-bg:#fff4d6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 60px}
.kopf{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.kopf .firma{font-size:12px;color:var(--muted)}.kopf h1{font-size:20px;font-weight:800;margin:2px 0}.kopf .adr{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.ch{font-weight:700;margin-bottom:8px}
.fl{display:grid;gap:3px;font-size:13px;color:var(--muted);margin-bottom:10px}
.fl input,.fl textarea{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;color:var(--ink)}
.req{color:var(--neg)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 8px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg button.on.notfall{background:var(--neg);border-color:var(--neg)}
.hinweis{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 11px;font-size:13px;margin-top:8px}
.fehler{background:var(--neg-bg);color:var(--neg);border-radius:8px;padding:9px 11px;font-size:14px;margin-bottom:10px}
.ok{background:var(--pos-bg);color:var(--pos);border-radius:12px;padding:18px;text-align:center}
.ok b{display:block;font-size:18px;margin-bottom:4px}
.btn{width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:13px;font-weight:700;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.6}
.up{display:block;border:1px dashed var(--accent);border-radius:10px;padding:14px;text-align:center;color:var(--accent);font-weight:600;cursor:pointer;background:var(--accent-soft)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative;width:78px;height:78px;border-radius:8px;overflow:hidden;background:var(--soft);border:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:2px;right:2px;border:0;background:#000a;color:#fff;border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:12px}
.thumbs a{display:block;width:100%;height:100%}
.kvr{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}.kvr:last-child{border-bottom:0}
.kvr span{color:var(--muted)}.kvr b{text-align:right;font-weight:600;overflow-wrap:anywhere}
.txt{white-space:pre-wrap;font-size:14px;margin-top:6px}
.rm{border-top:1px solid var(--line);padding:8px 0;font-size:14px}.rm .sub{font-size:12px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:15px;margin-bottom:12px}
.check input{width:20px;height:20px}
.sub{color:var(--muted);font-size:12.5px}
.mitte{text-align:center;color:var(--muted);padding:40px 0}
</style></head><body>
<div class="wrap" id="app"><div class="mitte">Lädt …</div></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o',{auth:{persistSession:false}});
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const P=new URLSearchParams(location.search),OT=P.get('o')||'',HT=P.get('h')||'';
const FOTO_URL='https://jqzxctfqvcwbctpjksvg.supabase.co/storage/v1/object/public/stoerungen/';
const KATS=['Heizung / Warmwasser','Wasser / Sanitär / Abfluss','Elektrik / Licht','Fenster / Türen / Schlösser','Dach / Fassade / Feuchtigkeit','Schimmel','Küche / Geräte','Treppenhaus / Gemeinschaftsflächen','Außenanlage / Müll','Ungeziefer','Sonstiges'];
const app=document.getElementById('app');
let F={dringlich:'Normal',dateien:[],busy:false,fehler:''},D=null;
/* Eingabefeld mit Auswahlliste: beim Hineintippen leeren, damit alle Einträge sichtbar sind */
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input[list]')){t.dataset.alt=t.value;t.value='';}});
document.addEventListener('focusout',e=>{const t=e.target;if(t.matches&&t.matches('input[list]')&&!t.value&&t.dataset.alt)t.value=t.dataset.alt;});
const val=i=>(document.getElementById(i)||{}).value||'';
/* Fotos verkleinern, damit das Hochladen auch mobil schnell geht */
function verkleinern(f){return new Promise(res=>{if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<600000)return res(f);
  const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const m=1800,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);res(b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f);},'image/jpeg',0.82);};
  img.onerror=()=>{URL.revokeObjectURL(u);res(f);};img.src=u;});}
async function hochladen(){const out=[],ordner='meldungen/'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
  for(const f0 of F.dateien){const f=await verkleinern(f0);const nm=f.name.replace(/[^\w.\-]+/g,'_').slice(-80)||'foto.jpg';const pfad=ordner+'/'+out.length+'_'+nm;
    const {error}=await sb.storage.from('stoerungen').upload(pfad,f,{contentType:f.type||undefined,upsert:false});if(error)throw new Error('Foto „'+f0.name+'“ konnte nicht hochgeladen werden: '+error.message);out.push({pfad,name:f0.name,typ:f.type||''});}
  return out;}
function fotoBox(){return `<label class="up">Fotos oder Video hinzufügen<input type="file" accept="image/*,video/*" multiple hidden onchange="dazu(this)"></label>
  <div class="thumbs">${F.dateien.map((f,i)=>`<div>${/^image\//.test(f.type)?`<img src="${URL.createObjectURL(f)}" alt="">`:esc(f.name)}<button type="button" onclick="F.dateien.splice(${i},1);zeichne()" aria-label="entfernen">x</button></div>`).join('')}</div>
  <div class="sub" style="margin-top:6px">Bis zu 10 Dateien. Fotos helfen dem Handwerker, das Problem schnell einzuschätzen.</div>`;}
function dazu(inp){const L=[...inp.files].filter(f=>f.size<=15*1024*1024);if(L.length<inp.files.length)alert('Dateien über 15 MB wurden nicht übernommen.');F.dateien=F.dateien.concat(L).slice(0,10);inp.value='';merke();zeichne();}
let MERK={};function merke(){document.querySelectorAll('#app input[id],#app textarea[id]').forEach(e=>{if(e.type!=='checkbox')MERK[e.id]=e.value;else MERK[e.id]=e.checked;});}
function setze(){for(const k in MERK){const e=document.getElementById(k);if(!e)continue;if(e.type==='checkbox')e.checked=MERK[k];else e.value=MERK[k];}}
function zeichne(){merke();(HT?zeichneHw:zeichneMeldung)();setze();}

/* ---------- Mieter: Störung melden ---------- */
async function startMeldung(){const {data,error}=await sb.rpc('stoerung_formular',{p_token:OT});
  if(error||!data){app.innerHTML='<div class="card">Dieser Link ist nicht mehr gültig. Bitte melden Sie die Störung telefonisch oder per E-Mail bei Ihrer Hausverwaltung.</div>';return;}
  D=data;document.title='Störung melden – '+D.name;zeichneMeldung();}
function zeichneMeldung(){if(F.fertig){app.innerHTML=`<div class="kopf"><div class="firma">Wohntraum Rheinhessen · Hausverwaltung</div><h1>Störung melden</h1><div class="adr">${esc(D.adresse)}</div></div>
    <div class="ok"><b>Vielen Dank, Ihre Meldung ist eingegangen.</b>Ihre Meldungsnummer: ${esc(F.fertig)}<br>Wir kümmern uns darum und melden uns bei Ihnen.</div>
    <div style="margin-top:12px"><button class="btn" style="background:var(--card);color:var(--accent);border:1px solid var(--line)" onclick="F={dringlich:'Normal',dateien:[]};MERK={};zeichneMeldung()">Weitere Störung melden</button></div>`;return;}
  app.innerHTML=`<div class="kopf"><div class="firma">Wohntraum Rheinhessen · Hausverwaltung</div><h1>Störung melden</h1><div class="adr">${esc(D.adresse)}</div></div>
  ${F.fehler?`<div class="fehler">${esc(F.fehler)}</div>`:''}
  <div class="card"><div class="ch">Wo ist die Störung?</div>
   <label class="fl">Wohnung / Bereich<input id="m-einheit" list="m-el" placeholder="Bitte auswählen oder eintippen"><datalist id="m-el">${(D.einheiten||[]).map(e=>`<option value="${esc(e.bezeichnung)}">${esc(e.lage||'')}</option>`).join('')}<option value="Gemeinschaftsfläche / Treppenhaus"><option value="Außenbereich"></datalist></label></div>
  <div class="card"><div class="ch">Was ist passiert?</div>
   <label class="fl">Art der Störung<input id="m-kat" list="m-kl" placeholder="Bitte auswählen oder eintippen"><datalist id="m-kl">${KATS.map(k=>`<option value="${esc(k)}">`).join('')}</datalist></label>
   <label class="fl">Kurz: Was ist defekt? <span class="req">Pflichtfeld</span><input id="m-titel" maxlength="160" placeholder="z. B. Heizung im Bad wird nicht warm"></label>
   <label class="fl">Beschreibung<textarea id="m-text" rows="4" placeholder="Seit wann? Was haben Sie schon versucht? Wann sind Sie erreichbar?"></textarea></label>
   <div class="fl" style="margin-bottom:0">Wie dringend ist es?</div>
   <div class="seg">${['Normal','Dringend','Notfall'].map(x=>`<button type="button" class="${F.dringlich===x?'on':''} ${x==='Notfall'?'notfall':''}" onclick="F.dringlich='${x}';zeichne()">${x}</button>`).join('')}</div>
   ${F.dringlich==='Notfall'?'<div class="hinweis">Bei Gefahr (Gasgeruch, Wasserrohrbruch, Stromausfall, Brand) bitte zusätzlich sofort telefonisch melden und im Notfall die 112 rufen.</div>':''}</div>
  <div class="card"><div class="ch">Fotos</div>${fotoBox()}</div>
  <div class="card"><div class="ch">Ihre Kontaktdaten</div>
   <label class="fl">Name <span class="req">Pflichtfeld</span><input id="m-name" autocomplete="name"></label>
   <label class="fl">Telefon oder E-Mail <span class="req">Pflichtfeld</span><input id="m-kontakt" autocomplete="tel"></label>
   <div class="sub">Ihre Angaben verwenden wir nur zur Bearbeitung dieser Meldung.</div></div>
  <button class="btn" onclick="senden()"${F.busy?' disabled':''}>${F.busy?'Wird gesendet …':'Störung melden'}</button>`;}
async function senden(){merke();F.fehler='';const titel=val('m-titel').trim(),name=val('m-name').trim(),kontakt=val('m-kontakt').trim();
  if(!titel||!name||!kontakt){F.fehler='Bitte füllen Sie die Pflichtfelder aus: was defekt ist, Ihren Namen und wie wir Sie erreichen.';zeichne();window.scrollTo(0,0);return;}
  F.busy=true;zeichne();
  try{const fotos=await hochladen();const eb=val('m-einheit').trim(),e=(D.einheiten||[]).find(x=>x.bezeichnung===eb);
    const text=(e||!eb?'':'Bereich: '+eb+'\n')+val('m-text').trim();
    const {data,error}=await sb.rpc('stoerung_melden',{p_token:OT,p_einheit:e?e.id:null,p_name:name,p_kontakt:kontakt,p_kategorie:val('m-kat').trim(),p_titel:titel,p_text:text,p_dringlich:F.dringlich,p_fotos:fotos});
    if(error)throw new Error(error.message);
    try{await fetch('/api/stoerung',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({aktion:'asana',id:data.id,token:OT})});}catch(x){}
    F.fertig=data.nr;F.busy=false;MERK={};zeichneMeldung();window.scrollTo(0,0);}
  catch(err){F.busy=false;F.fehler=err.message||String(err);zeichne();window.scrollTo(0,0);}}

/* ---------- Handwerker: Rückmeldung ---------- */
async function startHw(){const {data,error}=await sb.rpc('stoerung_hw',{p_token:HT});
  if(error||!data){app.innerHTML='<div class="card">Dieser Link ist nicht gültig.</div>';return;}D=data;document.title='Auftrag '+D.nr;zeichneHw();}
function zeichneHw(){const fotos=(D.fotos||[]);
  app.innerHTML=`<div class="kopf"><div class="firma">Wohntraum Rheinhessen · Auftrag für Handwerker</div><h1>${esc(D.titel)}</h1><div class="adr">${esc(D.kz)} · ${esc(D.adresse)}${D.einheit?' · '+esc(D.einheit):''}</div></div>
  ${F.fehler?`<div class="fehler">${esc(F.fehler)}</div>`:''}${F.fertig?'<div class="ok" style="margin-bottom:12px"><b>Danke, Ihre Rückmeldung ist angekommen.</b></div>':''}
  <div class="card"><div class="ch">Auftrag Nr. ${esc(D.nr)}</div>
   <div class="kvr"><span>Art</span><b>${esc(D.kategorie||'–')}</b></div><div class="kvr"><span>Dringlichkeit</span><b>${esc(D.dringlichkeit||'Normal')}</b></div>
   ${D.lage?`<div class="kvr"><span>Lage</span><b>${esc(D.lage)}</b></div>`:''}
   <div class="kvr"><span>Ansprechpartner vor Ort</span><b>${esc(D.melder||'–')}${D.kontakt?'<br>'+esc(D.kontakt):''}</b></div>
   <div class="kvr"><span>Stand</span><b>${D.hw_erledigt?'als erledigt gemeldet':esc(D.status)}</b></div>
   ${D.beschreibung?`<div class="txt">${esc(D.beschreibung)}</div>`:''}
   ${fotos.length?`<div class="thumbs">${fotos.map(f=>`<div><a href="${FOTO_URL+esc(f.pfad)}" target="_blank" rel="noopener">${/^image\/|\.(jpe?g|png|webp)$/i.test((f.typ||'')+f.pfad)?`<img src="${FOTO_URL+esc(f.pfad)}" alt="">`:esc(f.name||'Datei')}</a></div>`).join('')}</div>`:''}</div>
  ${(D.rueckmeldungen||[]).length?`<div class="card"><div class="ch">Bisherige Rückmeldungen</div>${D.rueckmeldungen.map(r=>`<div class="rm"><div class="sub">${esc(new Date(r.d).toLocaleString('de-DE'))} · ${esc(r.by)}${r.erledigt?' · erledigt':''}</div><div class="txt">${esc(r.t)}</div></div>`).join('')}</div>`:''}
  <div class="card"><div class="ch">Rückmeldung geben</div>
   <label class="fl">Name / Firma<input id="h-name"></label>
   <label class="fl">Was wurde gemacht, was fehlt noch?<textarea id="h-text" rows="4" placeholder="z. B. Thermostatkopf getauscht, Heizung läuft wieder"></textarea></label>
   <label class="check"><input type="checkbox" id="h-erl"> Arbeit ist erledigt</label>
   ${fotoBox()}</div>
  <button class="btn" onclick="rueckmelden()"${F.busy?' disabled':''}>${F.busy?'Wird gesendet …':'Rückmeldung senden'}</button>`;}
async function rueckmelden(){merke();F.fehler='';F.fertig=false;const text=val('h-text').trim(),erl=document.getElementById('h-erl').checked,name=val('h-name').trim();
  if(!text&&!erl){F.fehler='Bitte kurz beschreiben, was gemacht wurde.';zeichne();return;}
  F.busy=true;zeichne();
  try{const fotos=await hochladen();const {error}=await sb.rpc('stoerung_hw_rueckmelden',{p_token:HT,p_name:name,p_text:text,p_erledigt:erl,p_fotos:fotos});if(error)throw new Error(error.message);
    try{await fetch('/api/stoerung',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({aktion:'rueckmeldung',token:HT,name,text,erledigt:erl,fotos})});}catch(x){}
    F={dringlich:'Normal',dateien:[],fertig:true};MERK={'h-name':name};const r=await sb.rpc('stoerung_hw',{p_token:HT});if(r.data)D=r.data;zeichne();window.scrollTo(0,0);}
  catch(err){F.busy=false;F.fehler=err.message||String(err);zeichne();}}

if(HT)startHw();else if(OT)startMeldung();else app.innerHTML='<div class="card">Bitte den Link aus dem Aushang oder QR-Code verwenden.</div>';
</script>
</body></html>
