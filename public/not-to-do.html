<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not-To-Do &amp; Delegieren</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fff;--surf:#fff;--surf2:#f7f7f5;--line:#e9e9e7;--text:#37352f;--muted:#9b9a97;--dim:#6b6a66;--accent:#2383e2;--rot:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Inter,system-ui,sans-serif;font-size:14px;line-height:1.5}
.hdr{padding:20px 26px 6px}.hdr-title{font-size:22px;font-weight:700}.hdr-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.wrap{padding:12px 26px 70px;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1100px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--surf)}
.card h2{font-size:15px;font-weight:700;margin-bottom:2px}
.card .sub{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.row{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--surf2)}
.row input[type=checkbox]{margin-top:5px;flex:none;cursor:pointer}
.row input.tx{flex:1;font:inherit;font-size:13.5px;border:1px solid transparent;border-radius:7px;padding:6px 8px;background:transparent}
.row input.tx:hover{border-color:var(--line)}.row input.tx:focus{outline:none;border-color:var(--accent);background:#fff}
.row.done input.tx{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;opacity:0;margin-top:4px}.row:hover .x{opacity:1}.x:hover{color:var(--rot)}
.add{margin-top:10px;background:none;border:1px dashed var(--line);border-radius:9px;padding:8px 13px;color:var(--dim);cursor:pointer;font:inherit;font-weight:600;font-size:12.5px}.add:hover{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--muted);font-size:12.5px;padding:6px 2px}
.ntd{border-color:#f0d3d3}.ntd h2{color:var(--rot)}
.del2{border-color:#cfe0f7}.del2 h2{color:var(--accent)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#37352f;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}
</style></head><body>
<div class="hdr"><div class="hdr-title">🧭 Not-To-Do &amp; Delegieren</div><div class="hdr-sub">Was Eric bewusst NICHT tut · und Aufgaben, die er nicht selbst machen muss</div></div>
<div class="wrap">
  <div class="card ntd">
    <h2>🚫 Not-To-Do-Liste (Eric)</h2>
    <div class="sub">Dinge, die ich bewusst nicht (mehr) tue.</div>
    <div id="list_nicht_tun"></div>
    <button class="add" onclick="addItem('nicht_tun')">+ Eintrag</button>
  </div>
  <div class="card del2">
    <h2>🤝 Muss ich nicht selbst machen</h2>
    <div class="sub">Aufgaben zum Abgeben / Delegieren.</div>
    <div id="list_delegieren"></div>
    <button class="add" onclick="addItem('delegieren')">+ Eintrag</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);}
let ROWS=[];
function itemsOf(l){return ROWS.filter(r=>r.liste===l).sort((a,b)=>(a.pos||0)-(b.pos||0)||new Date(a.created_at)-new Date(b.created_at));}
function render(){
  ['nicht_tun','delegieren'].forEach(l=>{
    const list=itemsOf(l);
    $('list_'+l).innerHTML=list.length?list.map(r=>`<div class="row${r.erledigt?' done':''}">
      <input type="checkbox" ${r.erledigt?'checked':''} onchange="upd('${r.id}','erledigt',this.checked)">
      <input class="tx" value="${esc(r.text)}" placeholder="…" onchange="upd('${r.id}','text',this.value)">
      <button class="x" title="Löschen" onclick="del('${r.id}')">✕</button></div>`).join(''):'<div class="empty">Noch leer – mit „+ Eintrag" füllen.</div>';
  });
}
async function addItem(l){const pos=itemsOf(l).length+1;const res=await sb.from('not_to_do_liste').insert({liste:l,text:'',pos}).select();if(res.error){toast(res.error.message);return;}ROWS.push(res.data[0]);render();}
async function upd(id,field,val){const r=ROWS.find(x=>x.id===id);if(r)r[field]=val;const res=await sb.from('not_to_do_liste').update({[field]:(val===''?null:val)}).eq('id',id);if(res.error){toast(res.error.message);return;}if(field==='erledigt')render();}
async function del(id){const res=await sb.from('not_to_do_liste').delete().eq('id',id);if(res.error){toast(res.error.message);return;}ROWS=ROWS.filter(x=>x.id!==id);render();}
(async()=>{const res=await sb.from('not_to_do_liste').select('*');ROWS=res.error?[]:(res.data||[]);render();})();
</script>
</body></html>
