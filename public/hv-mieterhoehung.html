<div class="wrap">

/* Orte mit Mietspiegel und abgesenkter Kappungsgrenze (15 %): Mainz, Landau, Ludwigshafen, Speyer, Rhein-Pfalz-Kreis. Sonst 20 %. Bearbeitbar unter „Orte und Mietspiegel“. */

let O=[],E=[],MK=[],MKE={},F={},ORTE={},EINST={offen:false},ICH='',HEUTE=new Date().toISOString().slice(0,10),VOR=[],SEL=null,BUSY='';

const num=v=>{if(typeof v==='number')return v;const s=String(v==null?'':v).trim().replace(/\s|€/g,'');if(!s)return null;const n=Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s);return isNaN(n)?null:n;};
function toast(t,ms){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),ms||3500);}
/* Datum: Monate addieren, Monatserster, Monatsletzter */
function addM(d,n){const [y,m,t]=d.slice(0,10).split('-').map(Number);const dt=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0)).getUTCDate();return dt.getUTCFullYear()+'-'+String(dt.getUTCMonth()+1).padStart(2,'0')+'-'+String(Math.min(t,last)).padStart(2,'0');}
const ersterNach=(d,n)=>addM(d.slice(0,7)+'-01',n);
const letzterVon=(d,n)=>{const a=addM(d.slice(0,7)+'-01',n+1);return new Date(Date.parse(a)-864e5).toISOString().slice(0,10);};
const addD=(d,n)=>new Date(Date.parse(d)+n*864e5).toISOString().slice(0,10);
const ed=mk=>Object.assign({},mk,MKE[mk.pid]||{});
const objVon=mk=>O.find(o=>o.kz===mk.obj)||{};
const einVon=mk=>E.find(e=>e.nahaus_id===mk.unit||e.id===mk.unit||e.id===mk.einheit_id)||null;
const ortVon=o=>String(o&&o.ort||'').trim();
const ortCfg=ort=>Object.assign({mietspiegel:false,name:'',link:'',kappung:20},ORT_STD[ort]||{},ORTE[ort]||{});
const moebliert=e=>/möbl/i.test(e&&e.art||'');
const wohnraum=(mk,e)=>!mk.gewerbe&&!(e&&/gewerbe|garage|stellplatz/i.test(e.art||''));
const aktiv=mk=>{const b=ed(mk).bis||mk.bis;return (!mk.von||mk.von<=HEUTE)&&(!b||b>=HEUTE);};
function stufen(mk){return (mk.stufen||[]).filter(s=>s&&s.ab).slice().sort((a,b)=>String(a.ab).localeCompare(String(b.ab)));}
function stufeAm(mk,d){let s=null;for(const x of stufen(mk))if(x.ab<=d)s=x;return s||stufen(mk)[0]||null;}
/* Datum der letzten Änderung der Kaltmiete (Erhöhungen nach §§ 559, 560 BGB zählen nicht: nur die Kaltmiete wird betrachtet) */
function letzteKaltAenderung(mk){const S=stufen(mk).filter(s=>s.ab<=HEUTE);let d=mk.von||'',alt=null;for(const s of S){const k=r2(s.kalt);if(alt!=null&&k!==alt)d=s.ab;alt=k;}if(!d&&S.length)d=S[0].ab;return d;}
const namen=mk=>{const n=String(ed(mk).mieter||mk.mieter||'').trim();return n;};
const label=mk=>{const e=einVon(mk);return mk.obj+' · '+(e&&e.bezeichnung||mk.einheit||'')+' · '+namen(mk);};

/* ---------- Prüfung nach § 558 BGB ---------- */
/* Zugang beim Mieter → neue Miete ab Beginn des 3. Kalendermonats, Zustimmung bis Ende des 2. Kalendermonats */
function fristen(zugang,mk){const lk=letzteKaltAenderung(mk),fz=lk?addM(lk,12):'';if(fz&&fz>zugang)zugang=fz;let ab=ersterNach(zugang,3);const ab15=lk?ersterNach(addM(lk,15),0):'';const ab15m=ab15&&ab15<addM(lk,15)?ersterNach(addM(lk,15),1):ab15;
  if(ab15m&&ab15m>ab)ab=ab15m;return {ab,frist:letzterVon(zugang,2),fruehZugang:fz,zugang,lk};}
function kappung(mk,ab,proz){const b=stufeAm(mk,addM(ab,-36));const basis=r2(b?b.kalt:(stufeAm(mk,ab)||{}).kalt);return {basis,max:r2(basis*(1+proz/100)),proz};}
/* Vergleichswohnungen aus dem eigenen Bestand: gleiche Art (möbliert / unmöbliert), Fläche ±35 %, gleicher Ort zuerst. Die drei höchsten Mieten je m², die angesetzte Miete ist die niedrigste davon. */
function vergleichPool(mk){const e=einVon(mk),qm=num(e&&e.flaeche),o=objVon(mk),ort=ortVon(o);
  const L=[];for(const m of MK){if(m.pid===mk.pid||!aktiv(m))continue;const e2=einVon(m);if(!e2||!wohnraum(m,e2)||moebliert(e2)!==moebliert(e))continue;const q2=num(e2.flaeche),st=stufeAm(m,HEUTE);if(!q2||!st||!(num(st.kalt)>0))continue;
    const o2=objVon(m);L.push({pid:m.pid,obj:m.obj,einheit:e2.bezeichnung||m.einheit||'',lage:e2.lage||'',qm:q2,kalt:r2(st.kalt),qmm:r2(st.kalt/q2),adr:[o2.strasse,[o2.plz,o2.ort].filter(Boolean).join(' ')].filter(Boolean).join(', '),ort:ortVon(o2),gleichOrt:ortVon(o2)===ort,passt:qm?Math.abs(q2-qm)/qm<=0.35:true});}
  return L.sort((a,b)=>(b.gleichOrt-a.gleichOrt)||(b.passt-a.passt)||(b.qmm-a.qmm));}
function vergleichVorschlag(mk){const P=vergleichPool(mk);let L=P.filter(x=>x.gleichOrt&&x.passt);if(L.length<3)L=P.filter(x=>x.passt);if(L.length<3)L=P;
  const seen=new Set(),out=[];for(const x of L.slice().sort((a,b)=>b.qmm-a.qmm)){const k=x.obj+'|'+x.einheit;if(seen.has(k))continue;seen.add(k);out.push(x);if(out.length===3)break;}return out;}
/* Ergebnis der Prüfung für ein Mietverhältnis */
function pruefen(mk,fall){const e=einVon(mk),o=objVon(mk),ort=ortVon(o),C=ortCfg(ort),st=stufeAm(mk,HEUTE),qm=num(fall&&fall.qm)||num(e&&e.flaeche);
  const zugang=(fall&&fall.zugang)||addD(HEUTE,3),FR=fristen(zugang,mk);const kalt=r2(st?st.kalt:0);
  const grenze=[];if(!st||!(kalt>0))grenze.push('Keine Kaltmiete im Mieterkonto');if(!qm)grenze.push('Wohnfläche fehlt');
  if(stufen(mk).some(s=>s.ab>HEUTE&&!(fall&&fall.stufeAb===s.ab)))grenze.push('Künftige Mietstufe vorhanden (Staffel- oder Indexmiete?)');
  if(st&&!(num(st.bk)>0)&&!(num(st.hk)>0))grenze.push('Keine Vorauszahlungen: Pauschal- oder Inklusivmiete prüfen');
  const K=kappung(mk,FR.ab,num(fall&&fall.kappung)||C.kappung);
  let V=(fall&&Array.isArray(fall.vergleich))?fall.vergleich:[];let vqm=null,quelle='';
  if(fall&&fall.quelle==='vereinbarung'){vqm=null;quelle='vereinbarung';}else if(C.mietspiegel){vqm=num(fall&&fall.mietspiegelQm);quelle='mietspiegel';}else{vqm=V.length>=3?Math.min(...V.map(x=>x.qmm)):null;quelle='vergleich';}
  const ziel=vqm&&qm?r2(Math.floor(vqm*qm*100)/100):null;
  let neu=ziel!=null?Math.min(ziel,K.max):K.max;if(fall&&num(fall.kaltNeu)!=null)neu=num(fall.kaltNeu);neu=r2(neu);
  const plus=r2(neu-kalt);
  return {mk,e,o,ort,C,st,qm,kalt,zugang,FR,K,V,vqm,quelle,ziel,neu,plus,proz:kalt?r2(plus/kalt*100):0,grenze,zeitOk:!FR.fruehZugang||FR.fruehZugang<=addD(HEUTE,60)};}
/* Vorschläge: alle aktiven Wohnraum-Mietverhältnisse, bei denen jetzt (oder in den nächsten 2 Monaten) ein Erhöhungsverlangen möglich ist und die Miete unter Vergleichsmiete und Kappungsgrenze liegt */
function vorschlaege(){const offen=new Set(Object.values(F).filter(f=>f.status!=='erledigt'&&!(f.status==='abgelehnt'&&f.wiederAb&&f.wiederAb<=HEUTE)).map(f=>f.pid));
  const L=[];for(const mk of MK){if(!aktiv(mk)||offen.has(mk.pid))continue;const e=einVon(mk);if(!wohnraum(mk,e))continue;const erl=Object.values(F).find(f=>f.pid===mk.pid&&f.status==='erledigt'&&f.ab&&f.ab>addM(HEUTE,-12));if(erl)continue;
    const R=pruefen(mk,null);if(!R.zeitOk)continue;if(R.grenze.includes('Keine Kaltmiete im Mieterkonto'))continue;
    if(R.K.max-R.kalt<1)continue;L.push(R);}
  return L.sort((a,b)=>(a.mk.obj+a.mk.einheit).localeCompare(b.mk.obj+b.mk.einheit,'de',{numeric:true}));}

/* ---------- Laden und Speichern ---------- */
async function laden(){
  const [o,e,mk,me,f,es,u]=await Promise.all([sb.from('obj_objekte').select('id,kz,name,strasse,plz,ort,gesellschaft,baujahr').order('kz'),sb.from('obj_einheiten').select('id,objekt_id,bezeichnung,art,lage,flaeche,nahaus_id,aktiv'),

    sb.from('os_docs').select('pfad,data').eq('app','oc').like('pfad','mieterhoehung/%'),sb.from('os_docs').select('data').eq('app','oc').eq('pfad','einstellungen/mieterhoehung').maybeSingle(),sb.auth.getUser()]);
  if(mk.error){$('board').innerHTML='<div class="empty">Daten konnten nicht geladen werden. Bitte im OS angemeldet sein.</div>';return;}
  O=o.data||[];E=e.data||[];MK=(mk.data||[]).map(r=>r.data).filter(x=>x&&x.pid);MKE=(me.data&&me.data.data&&me.data.data.e)||{};
  F={};for(const r of (f.data||[]))if(r.data&&r.data.id)F[r.data.id]=r.data;ORTE=(es.data&&es.data.data&&es.data.data.orte)||{};
  const us=u&&u.data&&u.data.user;if(us){const m=String(us.email||'').toLowerCase();ICH=NUTZER[m]||us.email||'';}
  VOR=vorschlaege();render();}
function neuPruefen(){VOR=vorschlaege();render();toast(VOR.length+' Vorschläge gefunden.');}
const fallId=()=>'mh'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function fallSpeichern(f,log){f.verlauf=(f.verlauf||[]).concat(log?[{d:new Date().toISOString(),by:ICH||'OS',t:log}]:[]);f.am=new Date().toISOString();

/* ---------- Oberfläche ---------- */
function render(){const q=($('q').value||'').toLowerCase().trim(),hit=t=>!q||t.toLowerCase().includes(q);
  const FL=Object.values(F),cnt=s=>FL.filter(f=>f.status===s).length;
  $('kpis').innerHTML=[['Vorschläge',VOR.length],['In Bearbeitung',FL.filter(f=>['vergleich','anschreiben','zustimmung','miete'].includes(f.status)).length],['Warten auf Zustimmung',cnt('zustimmung')],['Erledigt',cnt('erledigt')],['Mehr Kaltmiete im Monat (erledigt)',eur(FL.filter(f=>f.status==='erledigt').reduce((a,f)=>a+(num(f.kaltNeu)-num(f.kaltAlt)||0),0))]].map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
  $('oben').innerHTML=EINST.offen?einstCard():'';
  let h='';

async function dateiHoch(inp){const f=akt(),files=[...(inp.files||[])];if(!f||!files.length)return;const mk=MK.find(m=>m.pid===f.pid),od=ed(mk).od,e=einVon(mk)||{};

  f.zustDateien=f.zustDateien||[];let i=0;
  for(const file of files){i++;toast('Lade hoch '+i+' von '+files.length+' …',20000);
    if(file.size>20*1024*1024){toast(file.name+' ist zu groß (max. 20 MB).',6000);continue;}
    const ext=(file.name.match(/\.[A-Za-z0-9]+$/)||['.pdf'])[0].toLowerCase(),name=odSafe(mk.obj+'_'+String(e.bezeichnung||mk.einheit||'').replace(/\s+/g,'')+'_'+nn+'_'+HEUTE+'_Zustimmung Mieterhöhung'+(files.length>1?' '+i:''))+ext;
    try{let d;

        else{const ss=await odApi({aktion:'sitzung',pfad,name});const r=await fetch(ss.uploadUrl,{method:'PUT',headers:{'Content-Range':'bytes 0-'+(file.size-1)+'/'+file.size},body:file});if(!r.ok)throw new Error('Hochladen nach OneDrive fehlgeschlagen ('+r.status+').');const j=await r.json();it={id:j.id,name:j.name};}
        d={od:it&&it.id,n:(it&&it.name)||name};}
      else{const pf=String(mk.obj).replace(/[^A-Za-z0-9]/g,'')+'/'+mk.pid+'/02 Vertrag und Nachtraege/'+name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ._-]/g,'_');

async function dateiOeffnen(i){const f=akt(),d=(f.zustDateien||[])[i];if(!d)return;const w=window.open('','_blank');

function vgAusBestand(el){const f=akt(),mk=MK.find(m=>m.pid===f.pid),x=vergleichPool(mk).find(p=>vgText(p)===el.value.trim());if(!x)return;const i=el.dataset.vgi;

async function zugangSetzen(v){const f=akt();if(!/^\d{4}-\d\d-\d\d$/.test(v))return;f.zugang=v;if(await fallSpeichern(f,''))fallOeffnen(f.id);}

  catch(e){toast('Nicht angelegt: '+(e.message||e),7000);}BUSY='';}

async function odApi(body){let tok='';try{const {data}=await sb.auth.getSession();tok=(data&&data.session&&data.session.access_token)||'';}catch(e){}
  const r=await fetch('/api/onedrive',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(body)});let j=null;try{j=await r.json();}catch(e){}if(!j)throw new Error('OneDrive nicht erreichbar ('+r.status+').');if(j.error)throw new Error(j.error);return j;}
const odSafe=s=>String(s||'').replace(/[\\/:*?"<>|#%]/g,'_').replace(/\s+/g,' ').trim();
function dateiName(f){const mk=MK.find(m=>m.pid===f.pid),e=einVon(mk)||{},p=String(ed(mk).mieter||'').split(/,| und /)[0].trim().split(/\s+/);const nn=p.length>1?p[p.length-1].toUpperCase()+' '+p.slice(0,-1).join(' '):(p[0]||'').toUpperCase();
  return odSafe(mk.obj+'_'+String(e.bezeichnung||mk.einheit||'').replace(/\s+/g,'')+'_'+nn+'_'+HEUTE+'_Mieterhöhung')+'.pdf';}
async function schreibenPdf(id,wie){const f=F[id];if(!f)return;let w=null;if(wie!=='akte'){w=window.open('','_blank');}
