<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Haustechnik-Guide</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--surf:#ffffff;--surf2:#f1f3f6;--line:#e4e7ec;--text:#1c2230;--muted:#6b7280;--accent:#6d4ef0;--accent2:#8266ff;--amber:#c7851d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 60px}
.kopf{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:12px;font-weight:600}
.vorschau{background:#fff7e6;border:1px solid #f0d9a8;color:#7a5410;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.karte{background:var(--surf);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.slide{position:relative;aspect-ratio:4/3;background:#dfe3ea center/cover no-repeat}
.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;color:#fff;font-weight:600;font-size:14px;background:linear-gradient(0deg,#000a,#0000)}
.slide .zahl{position:absolute;top:10px;right:10px;background:#0009;color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.slide button{position:absolute;top:50%;transform:translateY(-50%);background:#0008;color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.slide .zur{left:10px}.slide .vor{right:10px}
.adr{display:flex;align-items:center;gap:12px;padding:13px 15px}
.adr .t{margin-right:auto}.adr b{display:block;font-size:16px}.adr span{font-size:13px;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.suche{width:100%;font:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surf);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer;color:var(--text)}
.chip:hover{border-color:var(--accent)}
.ber{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:20px 0 7px}
.liste{background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.p{border-bottom:1px solid var(--line)}.p:last-child{border-bottom:0}
.ph{display:flex;align-items:center;gap:10px;padding:14px 15px;cursor:pointer}
.ph .n{font-weight:600;margin-right:auto}.ph .s{font-size:12px;color:var(--muted)}
.pb{padding:0 15px 16px}
.pb .tx{font-size:14.5px;white-space:pre-wrap;margin-bottom:10px}
.med{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.m img,.m video{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:#000;cursor:pointer}
.m .c{font-size:13.5px;font-weight:600;margin-top:5px}
.leer{background:var(--surf);border:1px dashed var(--line);border-radius:12px;padding:30px 18px;text-align:center;color:var(--muted)}
.lb{position:fixed;inset:0;background:#000e;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.fuss{text-align:center;font-size:12px;color:var(--muted);margin-top:30px}
</style></head><body>
<div class="wrap" id="app"><div class="leer">Guide wird geladen …</div></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ORDNUNG=['Außen & Umgebung','Haus','Haustechnik','Wohnung'];
const q=new URLSearchParams(location.search);
let G=null,BILDER=[],idx=0,offen={},such='';
async function laden(){
  let d=null;
  if(q.get('t')){const r=await sb.rpc('guide_oeffentlich',{p_token:q.get('t')});d=r.data;}
  else if(q.get('objekt')){
    const oid=q.get('objekt');
    const [o,p]=await Promise.all([sb.from('obj_objekte').select('name,strasse,plz,ort,lat,lng,bild_url').eq('id',oid).maybeSingle(),sb.from('objekt_guide_punkte').select('bereich,punkt,text,sort,medien').eq('object_id',oid)]);
    if(o.data&&!p.error)d={name:o.data.name,adresse:[o.data.strasse,[o.data.plz,o.data.ort].filter(Boolean).join(' ')].filter(Boolean).join(', '),lat:o.data.lat,lng:o.data.lng,bild:o.data.bild_url,punkte:p.data||[],vorschau:true};
  }
  if(!d){document.getElementById('app').innerHTML='<div class="leer">Dieser Link ist ungültig oder wurde gesperrt.<br>Bitte wenden Sie sich an die Hausverwaltung.</div>';return;}
  G=d;G.punkte=(G.punkte||[]).filter(p=>(p.medien||[]).length||(p.text||'').trim()).sort((a,b)=>(a.sort||0)-(b.sort||0));
  BILDER=[];G.punkte.forEach(p=>(p.medien||[]).forEach(m=>{if(m.typ!=='video')BILDER.push({url:m.url,text:m.text||p.punkt});}));
  if(!BILDER.length&&G.bild)BILDER.push({url:G.bild,text:'Außenansicht'});
  document.title='Guide '+(G.name||'');
  render();
}
function bereiche(){const b=[...ORDNUNG];G.punkte.forEach(p=>{if(!b.includes(p.bereich))b.push(p.bereich);});return b.filter(x=>G.punkte.some(p=>p.bereich===x));}
function trifft(p){if(!such)return true;const s=such.toLowerCase();return [p.punkt,p.text,p.bereich,...(p.medien||[]).map(m=>m.text)].join(' ').toLowerCase().includes(s);}
function kurz(n){return n.split(' / ')[0].split(' & ')[0];}
function karteUrl(){return (G.lat&&G.lng)?`https://www.google.com/maps/search/?api=1&query=${G.lat},${G.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(G.adresse||G.name||'')}`;}
function render(){
  const b=BILDER[idx];
  let h=`<div class="kopf"><span>Haustechnik-Guide</span><span>Wohntraum Rheinhessen</span></div>`;
  if(G.vorschau)h+='<div class="vorschau">Vorschau: So sehen Dienstleister den Guide. Punkte ohne Inhalt werden nicht angezeigt.</div>';
  h+=`<div class="karte">${b?`<div class="slide" style="background-image:url('${esc(b.url)}')" onclick="lb('${esc(b.url)}')"><div class="cap">${esc(b.text)}</div>${BILDER.length>1?`<div class="zahl">${idx+1} / ${BILDER.length}</div><button class="zur" onclick="event.stopPropagation();blaettern(-1)">Zurück</button><button class="vor" onclick="event.stopPropagation();blaettern(1)">Weiter</button>`:''}</div>`:''}
    <div class="adr"><div class="t"><b>${esc(G.name||'')}</b><span>${esc(G.adresse||'')}</span></div><a class="btn" href="${karteUrl()}" target="_blank" rel="noopener">Karte öffnen</a></div></div>
    <input class="suche" id="suche" placeholder="Suche: Mülltonne, Sicherung, Zähler …" value="${esc(such)}" oninput="such=this.value.trim();liste()">
    <div class="chips">${G.punkte.map((p,i)=>`<button class="chip" onclick="springe(${i})">${esc(kurz(p.punkt))}</button>`).join('')}</div>
    <div id="liste"></div><div class="fuss">Fragen? Bitte wenden Sie sich an die Hausverwaltung.</div>`;
  document.getElementById('app').innerHTML=h;liste();
}
function liste(){
  const el=document.getElementById('liste');if(!G.punkte.length){el.innerHTML='<div class="leer" style="margin-top:14px">Für dieses Objekt sind noch keine Informationen hinterlegt.</div>';return;}
  let h='';let treffer=0;
  bereiche().forEach(ber=>{
    const ps=G.punkte.map((p,i)=>({p,i})).filter(x=>x.p.bereich===ber&&trifft(x.p));if(!ps.length)return;treffer+=ps.length;
    h+=`<div class="ber">${esc(ber)}</div><div class="liste">`;
    ps.forEach(({p,i})=>{const n=(p.medien||[]).length,auf=offen[i]||(such&&ps.length<=3);
      h+=`<div class="p" id="p${i}"><div class="ph" onclick="offen[${i}]=!offen[${i}];liste()"><span class="n">${esc(p.punkt)}</span><span class="s">${n?n+(n===1?' Medium':' Medien'):''}</span><span class="s">${auf?'zuklappen':'öffnen'}</span></div>`;
      if(auf)h+=`<div class="pb">${p.text?`<div class="tx">${esc(p.text)}</div>`:''}<div class="med">${(p.medien||[]).map(m=>`<div class="m">${m.typ==='video'?`<video src="${esc(m.url)}" controls preload="metadata" playsinline></video>`:`<img src="${esc(m.url)}" loading="lazy" onclick="lb(this.src)">`}${m.text?`<div class="c">${esc(m.text)}</div>`:''}</div>`).join('')}</div></div>`;
      h+='</div>';});
    h+='</div>';
  });
  el.innerHTML=treffer?h:'<div class="leer" style="margin-top:14px">Nichts gefunden.</div>';
}
function blaettern(d){idx=(idx+d+BILDER.length)%BILDER.length;const s=document.querySelector('.slide');const b=BILDER[idx];s.style.backgroundImage=`url('${b.url}')`;s.setAttribute('onclick',`lb('${esc(b.url)}')`);s.querySelector('.cap').textContent=b.text;s.querySelector('.zahl').textContent=(idx+1)+' / '+BILDER.length;}
function springe(i){such='';document.getElementById('suche').value='';offen[i]=true;liste();const e=document.getElementById('p'+i);if(e)e.scrollIntoView({behavior:'smooth',block:'start'});}
function lb(u){const d=document.createElement('div');d.className='lb';d.innerHTML=`<img src="${esc(u)}">`;d.onclick=()=>d.remove();document.body.appendChild(d);}
laden();
</script></body></html>
