<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quartalsplanung · Eric Privat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#ffffff;--surf:#fff;--surf2:#f7f7f5;--line:#e9e9e7;--text:#37352f;--muted:#9b9a97;--dim:#6b6a66;--accent:#2383e2;--gruen:#0f7b57}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
.hdr{padding:20px 26px 6px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hdr-title{font-size:22px;font-weight:700}
.hdr-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.yr{display:inline-flex;align-items:center;gap:8px;margin-left:auto}
.yr button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 10px;cursor:pointer}
.yr b{font-size:16px;min-width:56px;text-align:center;display:inline-block}
.pb{margin-left:auto}
.wrap{padding:12px 26px 70px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
@media(max-width:1100px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.q-hd{padding:11px 13px;border-bottom:1px solid var(--line)}
.q-hd .qn{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.q-hd .qd{font-size:11px;color:var(--muted)}
.q-hd input{width:100%;font:inherit;font-size:14px;font-weight:700;border:1px solid transparent;border-radius:6px;padding:3px 5px;margin-top:3px}
.q-hd input:hover{border-color:var(--line)}.q-hd input:focus{border-color:var(--accent);outline:none}
.q-bd{padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.it{display:flex;gap:7px;align-items:flex-start;padding:3px 2px;border-radius:6px}
.it:hover{background:var(--surf2)}
.it input[type=checkbox]{margin-top:4px;flex:none;cursor:pointer}
.it textarea{flex:1;font:inherit;font-size:13px;border:1px solid transparent;border-radius:6px;padding:3px 5px;background:transparent;resize:none;overflow:hidden}
.it textarea:hover{border-color:var(--line)}.it textarea:focus{border-color:var(--accent);background:#fff;outline:none}
.it.done textarea{text-decoration:line-through;color:var(--muted)}
.it .x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;opacity:0}
.it:hover .x{opacity:1}.it .x:hover{color:#e03e3e}
.add{margin:4px 6px 10px;font:inherit;font-size:12.5px;color:var(--muted);background:none;border:none;cursor:pointer;text-align:left}
.add:hover{color:var(--accent)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#37352f;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}
</style></head><body>
<div class="hdr">
  <div><div class="hdr-title">🗓 Quartalsplanung</div><div class="hdr-sub">Themen &amp; Aufgaben je Quartal — Fokus fürs Jahr</div></div>
  <span class="yr"><button onclick="chgYear(-1)">‹</button><b id="yrLbl">2026</b><button onclick="chgYear(1)">›</button>
  <button onclick="printPlan()" title="Drucken / als PDF">🖨</button></span>
</div>
<div class="wrap"><div class="grid" id="grid"></div></div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);}
function grow(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}
const QMON={1:'Jan – Mär',2:'Apr – Jun',3:'Jul – Sep',4:'Okt – Dez'};
let JAHR=2026, ROWS=[];
function chgYear(d){JAHR+=d;$('yrLbl').textContent=JAHR;load();}
function thema(q){return ROWS.find(r=>r.quartal===q&&r.art==='thema');}
function aufg(q){return ROWS.filter(r=>r.quartal===q&&r.art==='aufgabe').sort((a,b)=>(a.pos||0)-(b.pos||0));}
function render(){
  $('grid').innerHTML=[1,2,3,4].map(function(q){
    const th=thema(q); const items=aufg(q);
    const list=items.map(function(r){
      return '<div class="it'+(r.erledigt?' done':'')+'">'
        +'<input type="checkbox" '+(r.erledigt?'checked':'')+' onchange="updItem(\''+r.id+'\',\'erledigt\',this.checked)">'
        +'<textarea rows="1" placeholder="Aufgabe / Thema …" oninput="grow(this)" onchange="updItem(\''+r.id+'\',\'text\',this.value)">'+esc(r.text)+'</textarea>'
        +'<button class="x" title="Löschen" onclick="delItem(\''+r.id+'\')">✕</button></div>';
    }).join('');
    return '<div class="q"><div class="q-hd"><div class="qn">Q'+q+' '+JAHR+' <span class="qd">· '+QMON[q]+'</span></div>'
      +'<input value="'+esc(th?th.text:'')+'" placeholder="Thema / Fokus des Quartals" onchange="setThema('+q+',this.value)"></div>'
      +'<div class="q-bd">'+(list||'')+'</div>'
      +'<button class="add" onclick="addItem('+q+')">+ Aufgabe / Thema</button></div>';
  }).join('');
  document.querySelectorAll('#grid .q-bd textarea').forEach(grow);
}
async function setThema(q,val){
  let th=thema(q);
  if(th){ th.text=val; await sb.from('quartalsplan').update({text:val}).eq('id',th.id); }
  else { const res=await sb.from('quartalsplan').insert({jahr:JAHR,quartal:q,art:'thema',text:val}).select(); if(!res.error&&res.data)ROWS.push(res.data[0]); }
}
async function addItem(q){
  const pos=aufg(q).length+1;
  const res=await sb.from('quartalsplan').insert({jahr:JAHR,quartal:q,art:'aufgabe',text:'',pos}).select();
  if(res.error){toast(res.error.message);return;} ROWS.push(res.data[0]);render();
}
async function updItem(id,field,val){
  const r=ROWS.find(x=>x.id===id);if(!r)return;r[field]=val;
  const res=await sb.from('quartalsplan').update({[field]:val}).eq('id',id);
  if(res.error){toast(res.error.message);return;}
  if(field==='erledigt')render();
}
async function delItem(id){const res=await sb.from('quartalsplan').delete().eq('id',id);if(res.error){toast(res.error.message);return;}ROWS=ROWS.filter(x=>x.id!==id);render();}
function printPlan(){
  const w=window.open('','_blank');if(!w){toast('Popup blockiert');return;}
  let body='';
  [1,2,3,4].forEach(function(q){const th=thema(q);const items=aufg(q).filter(r=>r.text&&r.text.trim());
    body+='<h2>Q'+q+' '+JAHR+' <span style="font-weight:400;color:#666;font-size:12px">'+QMON[q]+'</span></h2>';
    if(th&&th.text)body+='<div class="th">Fokus: '+esc(th.text)+'</div>';
    if(items.length){body+='<ul>'+items.map(r=>'<li>'+(r.erledigt?'☑ ':'☐ ')+esc(r.text)+'</li>').join('')+'</ul>';}
  });
  w.document.write('<html><head><title>Quartalsplanung '+JAHR+'</title><style>body{font-family:Georgia,serif;max-width:640px;margin:24px auto;padding:0 20px;color:#111}h1{font-size:18px}h2{font-size:14px;border-bottom:1.5px solid #111;padding-bottom:2px;margin:16px 0 4px}.th{font-style:italic;color:#444;margin:2px 0 4px}ul{margin:0 0 8px;padding-left:18px}li{font-size:13px;margin:3px 0}</style></head><body><h1>🗓 Quartalsplanung '+JAHR+'</h1>'+body+'<script>window.onload=function(){setTimeout(function(){window.print();},200);}<\/script></body></html>');
  w.document.close();
}
async function load(){
  const res=await sb.from('quartalsplan').select('*').eq('jahr',JAHR).order('pos');
  ROWS=res.error?[]:(res.data||[]);render();
}
load();
</script>
</body></html>
