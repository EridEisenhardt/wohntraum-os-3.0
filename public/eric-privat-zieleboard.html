<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zieleboard · Eric Privat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--surf:#fff;--surf2:#f1f3f6;--line:#e6e8ec;--text:#1c2024;--muted:#6b7280;--dim:#4b5563;--accent:#6d28d9;--green:#1f7a4d;--red:#c0392b;--warn:#b45309}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
.hdr{background:var(--surf);border-bottom:1px solid var(--line);padding:16px 24px;position:sticky;top:0;z-index:10}
.hdr-title{font-size:18px;font-weight:700}.hdr-sub{font-size:12px;color:var(--muted);margin-top:2px}
.wrap{padding:18px 20px 60px}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start}
@media(max-width:1000px){.board{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.board{grid-template-columns:1fr}}
.col{background:var(--surf2);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:120px}
.col-hd{padding:11px 14px;border-bottom:1px solid var(--line);position:sticky;top:0}
.col-hd .e{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.col-hd .t{font-size:14px;font-weight:700}
.col-bd{padding:10px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
.card.s-erreicht{border-color:#bbf7d0;background:#f2fbf5}
.card textarea{font:inherit;font-size:13.5px;font-weight:600;border:1px solid transparent;border-radius:7px;padding:5px 7px;background:transparent;resize:none;overflow:hidden;width:100%}
.card textarea:hover{border-color:var(--line)}.card textarea:focus{border-color:var(--accent);background:#fff;outline:none}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card select{font:inherit;font-size:11.5px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text)}
.card .parent{font-size:11px;color:var(--muted)}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px}
.st-offen{background:#eef0f3;color:var(--dim)}.st-inArbeit{background:#fdf1e0;color:var(--warn)}.st-erreicht{background:#e8f6ee;color:var(--green)}.st-pausiert{background:#f1f3f6;color:var(--muted)}.st-abgesagt{background:#fdecea;color:var(--red)}
.card.s-abgesagt{border-color:#f2c9c9;background:#fdf6f5;opacity:.7}
.card.s-abgesagt textarea{text-decoration:line-through}
.addbtn{margin:4px 10px 12px;font:inherit;font-size:12.5px;font-weight:600;padding:7px;border:1px dashed var(--line);border-radius:9px;background:transparent;color:var(--dim);cursor:pointer}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}
.icobtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;margin-left:auto}.icobtn:hover{color:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2024;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}
.empty{color:var(--muted);font-size:12px;padding:8px 4px;text-align:center}
.q{margin-top:2px;border-top:1px dashed var(--line);padding-top:6px}
.q>summary{font-size:11.5px;color:var(--accent);cursor:pointer;font-weight:600;list-style:none}
.q>summary::-webkit-details-marker{display:none}
.q>summary::before{content:'▸ '}.q[open]>summary::before{content:'▾ '}
.ql{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin:7px 0 2px}
.q input[type=date],.q textarea{width:100%;font:inherit;font-size:12.5px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:#fff;resize:none;overflow:hidden;min-height:32px}
.q textarea:focus,.q input:focus{outline:none;border-color:var(--accent)}
.ltbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:780px}
.ltbl th{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surf2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0}
.ltbl td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ltbl tr.grp td{background:#f5f3ff;font-weight:700;color:#6d28d9;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.ltbl select,.ltbl input[type=date]{font:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);width:100%}
.gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.gcard{background:var(--surf);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:box-shadow .12s,transform .12s;display:flex;flex-direction:column}
.gcard:hover{box-shadow:0 8px 24px rgba(0,0,0,.10);transform:translateY(-2px)}
.gcard.done{outline:2px solid #1f7a4d;outline-offset:-2px}
.gcover{position:relative;height:110px;display:flex;align-items:center;justify-content:center}
.gcov-em{font-size:44px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.gcov-done{position:absolute;top:8px;right:8px;background:#1f7a4d;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.gbody{padding:11px 13px 14px}
.gtitle{font-size:14px;font-weight:700;line-height:1.3}
</style></head><body>
<div class="hdr"><div class="hdr-title">🎯 Zieleboard</div><div class="hdr-sub">Eric Privat · Zielentwicklung über mehrere Ebenen — Big 5 → 5 Jahre → Jahr → Quartal</div></div>
<div class="wrap">
  <details id="visionWrap" style="background:linear-gradient(180deg,#faf5ff,#fff);border:1px solid #e9d5ff;border-radius:14px;padding:12px 16px;margin-bottom:14px" open>
    <summary style="cursor:pointer;font-size:15px;font-weight:700;color:#6d28d9;list-style:none">🌟 Mein Ideales Leben <span style="font-weight:500;font-size:12px;color:var(--muted)">– Vision (oberste Ebene über den Big 5)</span></summary>
    <div id="visionGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px"></div>
  </details>
  <div id="viewToggle" style="display:flex;gap:6px;margin-bottom:10px"></div>
  <div id="filterBar" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"></div>
  <div class="board" id="board"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700);}
const EBENEN=[[1,'Ebene 1','Big 5 for Life'],[2,'Ebene 2','Ziel in 5 Jahren'],[3,'Ebene 3','Jahresziel'],[4,'Ebene 4','Quartalsziel']];
const STATI=['offen','in Arbeit','erreicht','pausiert','abgesagt'];
const BEREICHE=['Fitness & Gesundheit','Business','Vermögen','Reisen','Family & Friends','Zukunfts-Ich'];
const BCOL={'Fitness & Gesundheit':'#1f7a4d','Business':'#185fa5','Vermögen':'#b45309','Reisen':'#0e7490','Family & Friends':'#be185d','Zukunfts-Ich':'#6d28d9'};
const stCls=s=>'st-'+String(s||'offen').replace(/\s+/g,'');
let ROWS=[], FBEREICH='', VIEW='board';
function setView(v){VIEW=v;render();}
function renderViewToggle(){
  const b=(v,l)=>'<button onclick="setView(\''+v+'\')" style="font:inherit;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:8px;cursor:pointer;border:1px solid '+(VIEW===v?'var(--accent)':'var(--line)')+';background:'+(VIEW===v?'var(--accent)':'#fff')+';color:'+(VIEW===v?'#fff':'var(--text)')+'">'+l+'</button>';
  $('viewToggle').innerHTML=b('galerie','🖼 Galerie')+b('board','▦ Board')+b('liste','☰ Liste');
}
const BEMOJI={'Fitness & Gesundheit':'🏃','Business':'💼','Vermögen':'💰','Reisen':'✈️','Family & Friends':'👨‍👩‍👧','Zukunfts-Ich':'🧘'};
function allEbene(e){return ROWS.filter(r=>r.ebene===e).sort((a,b)=>(a.pos||0)-(b.pos||0)||String(a.titel||'').localeCompare(String(b.titel||'')));}
function ofEbene(e){return allEbene(e).filter(r=>!FBEREICH||r.bereich===FBEREICH);}
function parentName(id){const p=ROWS.find(r=>r.id===id);return p?(p.titel||'(ohne Titel)'):'';}
function pctErreicht(list){const akt=list.filter(r=>r.status!=='abgesagt');const t=akt.length;if(!t)return null;const d=akt.filter(r=>r.status==='erreicht').length;return {pct:Math.round(d/t*100),done:d,total:t};}
function pctHtml(list){const p=pctErreicht(list);if(!p)return '';
  return '<div style="margin-top:6px"><div style="height:6px;background:var(--surf);border:1px solid var(--line);border-radius:6px;overflow:hidden"><span style="display:block;height:100%;width:'+p.pct+'%;background:#1f7a4d"></span></div>'
    +'<div style="font-size:10.5px;color:var(--muted);margin-top:2px">'+p.pct+'% erreicht · '+p.done+'/'+p.total+'</div></div>';}
function setFilter(b){FBEREICH=(FBEREICH===b?'':b);render();}
function renderFilter(){
  const cnt={};BEREICHE.forEach(b=>cnt[b]=ROWS.filter(r=>r.bereich===b).length);
  const chip=(val,label,col,n)=>'<button onclick="setFilter(\''+val.replace(/'/g,"\\'")+'\')" style="font:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;cursor:pointer;border:1px solid '+(col||'var(--line)')+';background:'+(FBEREICH===val?(col||'#1c2024'):'#fff')+';color:'+(FBEREICH===val?'#fff':(col||'var(--text)'))+'">'+esc(label)+(n!=null?' ('+n+')':'')+'</button>';
  $('filterBar').innerHTML='<button onclick="setFilter(\'\')" style="font:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;cursor:pointer;border:1px solid var(--line);background:'+(FBEREICH===''?'#1c2024':'#fff')+';color:'+(FBEREICH===''?'#fff':'var(--text)')+'">Alle Bereiche</button>'
    +BEREICHE.map(b=>chip(b,b,BCOL[b],cnt[b])).join('');
}
function render(){
  renderViewToggle();
  renderFilter();
  if(VIEW==='liste'){ renderList(); return; }
  if(VIEW==='galerie'){ renderGalerie(); return; }
  $('board').style.display='';
  $('board').innerHTML=EBENEN.map(function(E){
    const e=E[0]; const list=ofEbene(e);
    const cards=list.map(function(r){
      let par='';
      if(e>1){
        const opts=allEbene(e-1);
        par='<div class="meta"><span class="parent">↳ zu:</span><select onchange="upd(\''+r.id+'\',\'parent_id\',this.value)"><option value="">—</option>'
          +opts.map(o=>'<option value="'+o.id+'"'+(o.id===r.parent_id?' selected':'')+'>'+esc(o.titel||'(ohne Titel)')+'</option>').join('')+'</select></div>';
      }
      const bcol=BCOL[r.bereich]||'var(--line)';
      const bsel='<select onchange="upd(\''+r.id+'\',\'bereich\',this.value)" style="border-color:'+bcol+'"><option value="">— Lebensbereich —</option>'
        +BEREICHE.map(b=>'<option'+((r.bereich||'')===b?' selected':'')+'>'+esc(b)+'</option>').join('')+'</select>';
      return '<div class="card s-'+esc((r.status||'offen').replace(/\s+/g,''))+'" style="border-left:4px solid '+bcol+'">'
        +'<div style="font-size:9.5px;font-weight:700;color:'+bcol+';text-transform:uppercase;letter-spacing:.05em">HABEN – mein Ziel</div>'
        +'<textarea rows="1" placeholder="Was will ich HABEN / erreichen? …" oninput="grow(this)" onchange="upd(\''+r.id+'\',\'titel\',this.value)">'+esc(r.titel)+'</textarea>'
        +'<div class="meta">'+bsel+'</div>'
        +par
        +'<div class="meta"><select onchange="upd(\''+r.id+'\',\'status\',this.value)">'+STATI.map(s=>'<option'+((r.status||'offen')===s?' selected':'')+'>'+s+'</option>').join('')+'</select>'
        +'<span class="pill '+stCls(r.status)+'">'+esc(r.status||'offen')+'</span>'
        +'<button class="icobtn" title="Löschen" onclick="del(\''+r.id+'\')">🗑</button></div>'
        +'<details class="q"'+((r.sein||r.tun)?' open':'')+'><summary>🧭 SEIN &amp; TUN (Haben durch Sein &amp; Tun)</summary>'
          +'<label class="ql">SEIN – wer muss ich als Persönlichkeit sein?</label>'
          +'<textarea rows="2" oninput="grow(this)" onchange="upd(\''+r.id+'\',\'sein\',this.value)">'+esc(r.sein)+'</textarea>'
          +'<label class="ql">TUN – was muss ich dafür konkret tun?</label>'
          +'<textarea rows="2" oninput="grow(this)" onchange="upd(\''+r.id+'\',\'tun\',this.value)">'+esc(r.tun)+'</textarea>'
        +'</details>'
        +'<details class="q"'+((r.bis_wann||r.warum||r.veraenderung)?' open':'')+'><summary>❓ Warum &amp; bis wann</summary>'
          +'<label class="ql">Bis wann möchte ich das Ziel erreichen?</label>'
          +'<input type="date" value="'+esc(r.bis_wann||'')+'" onchange="upd(\''+r.id+'\',\'bis_wann\',this.value)">'
          +'<label class="ql">Warum ist das Erreichen für mich wichtig?</label>'
          +'<textarea rows="2" oninput="grow(this)" onchange="upd(\''+r.id+'\',\'warum\',this.value)">'+esc(r.warum)+'</textarea>'
          +'<label class="ql">Wie würde sich mein Leben verändern, wenn ich es erreiche?</label>'
          +'<textarea rows="2" oninput="grow(this)" onchange="upd(\''+r.id+'\',\'veraenderung\',this.value)">'+esc(r.veraenderung)+'</textarea>'
        +'</details>'
        +'</div>';
    }).join('')||'<div class="empty">Noch keine Ziele.</div>';
    return '<div class="col"><div class="col-hd"><div class="e">'+esc(E[1])+'</div><div class="t">'+esc(E[2])+'</div>'+pctHtml(list)+'</div>'
      +'<div class="col-bd">'+cards+'</div>'
      +'<button class="addbtn" onclick="add('+e+')">+ Ziel</button></div>';
  }).join('');
  document.querySelectorAll('#board textarea').forEach(grow);
}
const EBLBL={1:'Big 5 for Life',2:'Ziel in 5 Jahren',3:'Jahresziel',4:'Quartalsziel'};
function renderGalerie(){
  const brd=$('board'); brd.style.display='block';
  function shade(hex,a){ if(!hex||hex.indexOf('#')!==0)return 'rgba(109,40,217,'+a+')'; const n=parseInt(hex.slice(1),16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; return 'rgba('+r+','+g+','+b+','+a+')'; }
  let html='';
  EBENEN.forEach(function(E){
    const e=E[0]; const list=ofEbene(e); if(!list.length)return;
    const p=pctErreicht(list);
    html+='<div style="grid-column:1/-1;margin:8px 2px 2px;font-weight:700;font-size:13px;color:var(--text)">'+esc(E[2])+' <span style="color:var(--muted);font-weight:500">· '+list.length+'</span>'
      +(p?' <span style="color:#1f7a4d;margin-left:8px">'+p.pct+'% erreicht</span>':'')+'</div>';
    list.forEach(function(r){
      const col=BCOL[r.bereich]||'#6d28d9'; const em=BEMOJI[r.bereich]||'🎯';
      const kids=ROWS.filter(x=>x.parent_id===r.id);
      const boxes=kids.map(function(k){const done=k.status==='erreicht';return '<span title="'+esc(k.titel||'')+'" style="display:inline-block;width:15px;height:15px;border-radius:4px;border:1.5px solid '+(done?col:'var(--line)')+';background:'+(done?col:'#fff')+';color:#fff;font-size:10px;line-height:13px;text-align:center">'+(done?'✓':'')+'</span>';}).join('');
      const done=r.status==='erreicht';
      const chip='<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:'+col+';background:'+shade(BCOL[r.bereich],0.10)+';padding:2px 8px;border-radius:12px">'+em+' '+esc(r.bereich||'—')+'</span>';
      html+='<div class="gcard'+(done?' done':'')+'" onclick="openZiel(\''+r.id+'\')">'
        +'<div class="gcover" style="background:linear-gradient(135deg,'+col+','+shade(BCOL[r.bereich],0.55)+')"><span class="gcov-em">'+em+'</span>'+(done?'<span class="gcov-done">✓</span>':'')+'</div>'
        +'<div class="gbody"><div class="gtitle">'+esc(r.titel||'(ohne Titel)')+'</div>'
        +'<div style="margin:6px 0">'+chip+'</div>'
        +(boxes?'<div style="display:flex;gap:4px;flex-wrap:wrap">'+boxes+'</div><div style="font-size:10.5px;color:var(--muted);margin-top:4px">'+kids.filter(k=>k.status==='erreicht').length+'/'+kids.length+' Unterziele</div>':'')
        +'</div></div>';
    });
  });
  brd.innerHTML='<div class="gwrap">'+(html||'<div class="empty">Noch keine Ziele.</div>')+'</div>';
}
function openZiel(id){ VIEW='board'; render(); toast('Zum Bearbeiten in der Board-Ansicht'); }
function renderList(){
  const brd=$('board'); brd.style.display='block';
  let rows='';
  EBENEN.forEach(function(E){
    const e=E[0]; const list=ofEbene(e);
    const p=pctErreicht(list);
    rows+='<tr class="grp"><td colspan="6">'+esc(E[1])+' · '+esc(E[2])+' <span style="color:var(--muted);font-weight:500">('+list.length+')</span>'
      +(p?' <span style="color:#1f7a4d;font-weight:700;margin-left:8px">'+p.pct+'% erreicht · '+p.done+'/'+p.total+'</span>':'')+'</td></tr>';
    if(!list.length){ rows+='<tr><td colspan="6" style="color:var(--muted);font-size:12px;padding:6px 10px">Noch keine Ziele auf dieser Ebene.</td></tr>'; }
    list.forEach(function(r){
      const done=r.status==='erreicht';
      const bcol=BCOL[r.bereich]||'var(--line)';
      const bsel='<select onchange="upd(\''+r.id+'\',\'bereich\',this.value)" style="border-color:'+bcol+'"><option value="">—</option>'+BEREICHE.map(b=>'<option'+((r.bereich||'')===b?' selected':'')+'>'+esc(b)+'</option>').join('')+'</select>';
      let psel='<span style="color:var(--muted)">—</span>';
      if(e>1){const opts=allEbene(e-1);psel='<select onchange="upd(\''+r.id+'\',\'parent_id\',this.value)"><option value="">—</option>'+opts.map(o=>'<option value="'+o.id+'"'+(o.id===r.parent_id?' selected':'')+'>'+esc(o.titel||'(ohne Titel)')+'</option>').join('')+'</select>';}
      const ssel='<select onchange="upd(\''+r.id+'\',\'status\',this.value)">'+STATI.map(s=>'<option'+((r.status||'offen')===s?' selected':'')+'>'+s+'</option>').join('')+'</select>';
      rows+='<tr style="border-left:4px solid '+bcol+(done?';background:#f2fbf5':'')+'">'
        +'<td><input value="'+esc(r.titel)+'" placeholder="Ziel …" onchange="upd(\''+r.id+'\',\'titel\',this.value)" style="width:100%;font:inherit;font-size:13px;font-weight:600;border:1px solid transparent;border-radius:6px;padding:5px 6px;background:transparent"></td>'
        +'<td>'+bsel+'</td>'
        +'<td>'+psel+'</td>'
        +'<td>'+ssel+'</td>'
        +'<td><input type="date" value="'+esc(r.bis_wann||'')+'" onchange="upd(\''+r.id+'\',\'bis_wann\',this.value)"></td>'
        +'<td style="text-align:right"><button class="icobtn" title="Löschen" onclick="del(\''+r.id+'\')">🗑</button></td></tr>';
    });
    rows+='<tr><td colspan="6" style="padding:4px 8px"><button class="addbtn" style="margin:0" onclick="add('+e+')">+ Ziel in '+esc(E[2])+'</button></td></tr>';
  });
  brd.innerHTML='<div style="background:var(--surf);border:1px solid var(--line);border-radius:14px;overflow:auto">'
    +'<table class="ltbl"><thead><tr><th>Ziel (HABEN)</th><th style="width:150px">Lebensbereich</th><th style="width:180px">Übergeordnet</th><th style="width:120px">Status</th><th style="width:140px">Bis wann</th><th style="width:40px"></th></tr></thead><tbody>'
    +(rows||'<tr><td colspan="6" class="empty">Noch keine Ziele.</td></tr>')+'</tbody></table></div>';
}
function grow(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}
async function add(ebene){
  const pos=ROWS.filter(r=>r.ebene===ebene).length+1;
  const res=await sb.from('ziele_board').insert({ebene:ebene,titel:'',status:'offen',bereich:FBEREICH||null,pos:pos}).select();
  if(res.error){toast(res.error.message);return;}
  ROWS.push(res.data[0]);render();
}
async function upd(id,field,val){
  const v=(field==='titel')?val:(val||null);
  const res=await sb.from('ziele_board').update({[field]:v}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  const r=ROWS.find(x=>x.id===id);if(r)r[field]=v;
  if(field==='status'||field==='parent_id'||field==='titel'||field==='bereich')render();
}
async function del(id){
  if(!confirm('Ziel löschen? Verknüpfte Unterziele bleiben erhalten (ohne Übergeordnetes).'))return;
  const res=await sb.from('ziele_board').delete().eq('id',id);
  if(res.error){toast(res.error.message);return;}
  ROWS=ROWS.filter(x=>x.id!==id);
  ROWS.forEach(r=>{if(r.parent_id===id)r.parent_id=null;});
  await sb.from('ziele_board').update({parent_id:null}).eq('parent_id',id);
  render();
}
// ——— Vision „Mein Ideales Leben" ———
let VISION={};
const VFELDER=[['ablauf','🔄 Ablauf & Routinen'],['tagesplan','🗓 Tagesplan'],['umfeld','👥 Umfeld'],['faehigkeiten','🧠 Fähigkeiten']];
function renderVision(){
  $('visionGrid').innerHTML=VFELDER.map(function(f){
    var extra=f[0]==='tagesplan'?' <a href="/eric-privat/idealer-tag" target="_top" style="font-size:11px;color:var(--accent);text-decoration:none">→ Idealer Tag</a>':'';
    return '<div style="display:flex;flex-direction:column;gap:4px"><label style="font-size:11px;font-weight:700;color:var(--dim)">'+f[1]+extra+'</label>'
      +'<textarea rows="3" oninput="grow(this)" onchange="saveVision(\''+f[0]+'\',this.value)" style="font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;resize:none;overflow:hidden;min-height:60px">'+esc(VISION[f[0]])+'</textarea></div>';
  }).join('');
  document.querySelectorAll('#visionGrid textarea').forEach(grow);
}
async function saveVision(field,val){
  VISION[field]=val;
  var res=await sb.from('ideales_leben').update({[field]:val||null,updated_at:new Date().toISOString()}).eq('id',1);
  if(res.error)toast('Fehler: '+res.error.message);
}
async function load(){
  const [rb,rv]=await Promise.all([
    sb.from('ziele_board').select('*').order('ebene').order('pos'),
    sb.from('ideales_leben').select('*').eq('id',1).maybeSingle()
  ]);
  ROWS=rb.error?[]:(rb.data||[]);
  VISION=(rv&&rv.data)?rv.data:{};
  renderVision(); render();
}
load();
</script>
