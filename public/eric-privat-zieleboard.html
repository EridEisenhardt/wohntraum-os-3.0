<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zieleboard · Eric Privat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#ffffff;--surf:#fff;--surf2:#f7f7f5;--line:#e9e9e7;--text:#37352f;--muted:#9b9a97;--dim:#6b6a66;--accent:#2383e2;--grau:#9b9a97;--rot:#e03e3e;--gruen:#0f7b57}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
.hdr{padding:20px 26px 6px}
.hdr-title{font-size:22px;font-weight:700;letter-spacing:-.01em}
.hdr-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.wrap{padding:8px 26px 70px;max-width:1500px}
.sec{margin-top:22px}
.sec-hd{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;margin-bottom:10px}
.sec-hd .n{font-size:12px;color:var(--muted);font-weight:500}
.addcard{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:600;color:var(--dim);background:#fff;border:1px dashed var(--line);border-radius:9px;padding:8px 13px;cursor:pointer}
.addcard:hover{border-color:var(--accent);color:var(--accent)}
/* Big 5 */
.big5{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.b5{background:#faf7ff;border:1px solid #eaddff;border-radius:10px;padding:10px 12px;display:flex;gap:6px;align-items:flex-start}
.b5 .num{font-weight:800;color:#7a52c7}
.b5 textarea{flex:1;font:inherit;font-size:14px;font-weight:600;border:1px solid transparent;border-radius:6px;padding:2px 5px;background:transparent;resize:none;overflow:hidden}
.b5 textarea:focus{border-color:var(--accent);background:#fff;outline:none}
.b5 .x{background:none;border:none;color:var(--muted);cursor:pointer}.b5 .x:hover{color:var(--rot)}
/* Ideal */
.ideal{background:linear-gradient(180deg,#fbfbfa,#fff);border:1px solid var(--line);border-radius:12px;padding:6px 14px 12px}
.ideal>summary{cursor:pointer;font-size:15px;font-weight:700;list-style:none;padding:8px 0}
.ideal>summary::-webkit-details-marker{display:none}
.idealgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:720px){.idealgrid{grid-template-columns:1fr}}
.idealgrid label{font-size:11px;font-weight:700;color:var(--dim);display:block;margin-bottom:3px}
.idealgrid textarea{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;resize:none;overflow:hidden;min-height:56px}
/* Board tabs + horizons */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:6px 0 4px}
.tab{font:inherit;font-size:14px;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px 9px;cursor:pointer}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
.tab .n{font-size:11px;color:var(--muted);margin-left:5px}
.hblock{margin-top:16px}
.hblock-hd{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;border-left:3px solid var(--text);padding-left:8px;margin-bottom:8px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(15,15,15,.04)}
.card .bt{height:4px}
.card .in{padding:8px 12px 12px}
.ctop{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.tag.grau{background:#f1f1ef;color:#6b6a66}.tag.rot{background:#fdecec;color:var(--rot)}
.x{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}.x:hover{color:var(--rot)}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.col .lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.col .lbl .leer{color:var(--rot)}
.col textarea{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:#fff;resize:none;overflow:hidden;min-height:52px}
.col.haben textarea{font-weight:600}
.col textarea.leer{background:#fafaf9}
.col textarea:focus{border-color:var(--accent);outline:none}
.steps{display:flex;flex-direction:column;gap:3px}
.step{display:flex;gap:6px;align-items:flex-start}
.step input[type=checkbox]{margin-top:5px;flex:none;cursor:pointer}
.step textarea{flex:1;font:inherit;font-size:12.5px;border:1px solid transparent;border-radius:6px;padding:3px 5px;background:transparent;resize:none;overflow:hidden}
.step textarea:hover{border-color:var(--line)}.step textarea:focus{border-color:var(--accent);background:#fff;outline:none}
.step.done textarea{text-decoration:line-through;color:var(--muted)}
.step .sx{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;opacity:0}.step:hover .sx{opacity:1}.step .sx:hover{color:var(--rot)}
.stepadd{margin-top:4px;font:inherit;font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;text-align:left;padding:2px 0}.stepadd:hover{color:var(--accent)}
.foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:9px}
.boxes{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.bx{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.bx.on{background:var(--gruen);border-color:var(--gruen)}
.bxadd{font:inherit;font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;padding:0 3px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
.donebtn{margin-left:auto;font:inherit;font-size:12px;font-weight:600;color:var(--gruen);background:#fff;border:1px solid #bfe6ce;border-radius:7px;padding:4px 10px;cursor:pointer}
.donebtn:hover{background:#e6f6ec}
.donebtn.on{background:#e6f6ec;color:var(--dim);border-color:var(--line)}
.card.cdone{background:#f7fdf9}.card.cdone .col.haben textarea{text-decoration:line-through;color:var(--dim)}
.empty{color:var(--muted);padding:10px 2px;font-size:12.5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#37352f;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}
</style></head><body>
<div class="hdr" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
  <div><div class="hdr-title">🎯 Zieleboard</div>
  <div class="hdr-sub">Big 5 · Ideales Leben · Persönlich &amp; Unternehmerisch — je 5 Jahre / 1 Jahr / Quartal, Karten mit HABEN · TUN · SEIN</div></div>
  <button class="addcard" style="border-style:solid" onclick="printJournal()">🖨 Drucken (fürs Bulletjournal)</button>
</div>
<div class="wrap">
  <div class="sec">
    <div class="sec-hd">🌟 Big 5 for Life <span class="n">meine größten Lebensziele</span></div>
    <div class="big5" id="big5"></div>
    <div style="margin-top:8px"><button class="addcard" onclick="addBig5()">+ Big-5-Ziel</button></div>
  </div>

  <div class="sec">
    <details class="ideal" id="idealWrap" open>
      <summary>🧭 Mein Ideales Leben</summary>
      <div class="idealgrid" id="idealGrid"></div>
    </details>
  </div>

  <div class="sec">
    <div class="tabs" id="tabs"></div>
    <div id="boardArea"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
function grow(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}
const BOARDS=['Persönlich','Unternehmerisch'];
const HORIZ=['5 Jahre','1 Jahr','Quartalsziel'];
let ROWS=[], VISION={}, BOARD='Persönlich', STEPS={};
function schritteVon(id){return (STEPS[id]||[]).slice().sort((a,b)=>(a.pos||0)-(b.pos||0));}
function isRot(r){return schritteVon(r.id).length===0||!(r.sein&&r.sein.trim())||!r.asana_projekt;}

// ---------- Big 5 ----------
function renderBig5(){
  const list=ROWS.filter(r=>r.board==='Big 5 for Life').sort((a,b)=>(a.pos||0)-(b.pos||0));
  $('big5').innerHTML=list.map(function(r,i){
    return '<div class="b5"><span class="num">'+(i+1)+'</span><textarea rows="1" placeholder="Lebensziel …" oninput="grow(this)" onchange="upd(\''+r.id+'\',\'haben\',this.value)">'+esc(r.haben)+'</textarea>'
      +'<button class="x" onclick="delCard(\''+r.id+'\')">✕</button></div>';
  }).join('')||'<div class="empty">Noch keine Big 5 — anlegen.</div>';
  document.querySelectorAll('#big5 textarea').forEach(grow);
}
async function addBig5(){
  const pos=ROWS.filter(r=>r.board==='Big 5 for Life').length+1;
  const res=await sb.from('zielkarten').insert({board:'Big 5 for Life',haben:'',pos}).select();
  if(res.error){toast(res.error.message);return;} ROWS.push(res.data[0]);renderBig5();
}

// ---------- Ideales Leben ----------
const VFELDER=[['elemente','🏡 Das gehört dazu (Bestandteile)'],['ablauf','🔄 Ablauf & Routinen'],['tagesplan','🗓 Tagesplan'],['umfeld','👥 Umfeld'],['faehigkeiten','🧠 Fähigkeiten']];
function renderIdeal(){
  $('idealGrid').innerHTML=VFELDER.map(function(f){
    const extra=f[0]==='tagesplan'?' <a href="/eric-privat/idealer-tag" target="_top" style="font-size:11px;color:var(--accent);text-decoration:none">→ Idealer Tag</a>':'';
    return '<div><label>'+f[1]+extra+'</label><textarea oninput="grow(this)" onchange="saveVision(\''+f[0]+'\',this.value)">'+esc(VISION[f[0]])+'</textarea></div>';
  }).join('');
  document.querySelectorAll('#idealGrid textarea').forEach(grow);
}
async function saveVision(field,val){VISION[field]=val;const r=await sb.from('ideales_leben').update({[field]:val||null,updated_at:new Date().toISOString()}).eq('id',1);if(r.error)toast(r.error.message);}

// ---------- Boards ----------
function renderTabs(){
  $('tabs').innerHTML=BOARDS.map(function(b){const n=ROWS.filter(r=>r.board===b).length;return '<button class="tab'+(BOARD===b?' on':'')+'" onclick="setBoard(\''+b+'\')">'+esc(b)+'<span class="n">'+n+'</span></button>';}).join('');
}
function setBoard(b){BOARD=b;renderBoard();}
function renderBoard(){
  renderTabs();
  $('boardArea').innerHTML=HORIZ.map(function(h){
    const list=ROWS.filter(r=>r.board===BOARD&&(r.horizont||'1 Jahr')===h).sort((a,b)=>(a.pos||0)-(b.pos||0));
    const cards=list.map(cardHtml).join('')||'<div class="empty">Noch keine Ziele.</div>';
    return '<div class="hblock"><div class="hblock-hd">'+esc(h)+' <span style="color:var(--muted);font-weight:500">· '+list.length+'</span></div>'
      +'<div class="cards">'+cards+'</div>'
      +'<div style="margin-top:8px"><button class="addcard" onclick="addCard(\''+h+'\')">+ Ziel ('+esc(h)+')</button></div></div>';
  }).join('');
  document.querySelectorAll('#boardArea textarea').forEach(grow);
}
function cardHtml(r){
  const done=r.erledigt;
  const rot=!done&&isRot(r),grau=r.wachstumsfeld;
  const bt=done?'var(--gruen)':(rot?'var(--rot)':(grau?'var(--grau)':'var(--line)'));
  const tot=Math.max(0,r.boxes||0),bdone=Math.max(0,Math.min(r.boxes_done||0,tot));
  let boxes='';for(let i=1;i<=tot;i++){boxes+='<span class="bx'+(i<=bdone?' on':'')+'" onclick="setBoxes(\''+r.id+'\','+i+')">'+(i<=bdone?'✓':'')+'</span>';}
  boxes+='<button class="bxadd" title="+" onclick="addBox(\''+r.id+'\',1)">＋</button>'+(tot>0?'<button class="bxadd" title="−" onclick="addBox(\''+r.id+'\',-1)">－</button>':'');
  const ta=(f,cls,ph)=>'<textarea class="'+cls+(!(r[f]&&r[f].trim())?' leer':'')+'" rows="1" placeholder="'+ph+'" oninput="grow(this)" onchange="upd(\''+r.id+'\',\''+f+'\',this.value)">'+esc(r[f])+'</textarea>';
  return '<div class="card'+(done?' cdone':'')+'"><div class="bt" style="background:'+bt+'"></div><div class="in">'
    +'<div class="ctop">'+(done?'<span class="tag" style="background:#e6f6ec;color:var(--gruen)">✓ Erledigt</span>':'')+(grau?'<span class="tag grau">Wachstumsfeld</span>':'')+(rot?'<span class="tag rot">Handlungsbedarf</span>':'')+'<button class="x" title="Löschen" onclick="delCard(\''+r.id+'\')">🗑</button></div>'
    +'<div class="cols">'
      +'<div class="col haben"><div class="lbl">Ergebnis · HABEN</div>'+ta('haben','', 'Woran merke ich, dass es erreicht ist?')+'</div>'
      +'<div class="col"><div class="lbl">Schritte · TUN'+(schritteVon(r.id).length===0?' <span class="leer">(leer)</span>':'')+'</div>'+schritteHtml(r.id)+'</div>'
      +'<div class="col"><div class="lbl">Intention · SEIN'+(!(r.sein&&r.sein.trim())?' <span class="leer">(leer)</span>':'')+'</div>'+ta('sein','','Wer muss ich dafür sein?')+'</div>'
    +'</div>'
    +'<div class="foot"><span class="boxes">'+boxes+'</span>'
      +'<label class="chk"><input type="checkbox" '+(grau?'checked':'')+' onchange="upd(\''+r.id+'\',\'wachstumsfeld\',this.checked)"> Wachstumsfeld</label>'
      +'<label class="chk"><input type="checkbox" '+(r.asana_projekt?'checked':'')+' onchange="upd(\''+r.id+'\',\'asana_projekt\',this.checked)"> Asana-Projekt</label>'
      +'<button class="donebtn'+(done?' on':'')+'" onclick="toggleErledigt(\''+r.id+'\')">'+(done?'↩ Wieder öffnen':'✓ Ziel erledigt')+'</button>'
    +'</div></div></div>';
}
async function addCard(h){
  const pos=ROWS.filter(r=>r.board===BOARD&&(r.horizont||'')===h).length+1;
  const res=await sb.from('zielkarten').insert({board:BOARD,horizont:h,haben:'',tun:'',sein:'',boxes:3,boxes_done:0,pos}).select();
  if(res.error){toast(res.error.message);return;} ROWS.push(res.data[0]);renderTabs();renderBoard();
}
async function upd(id,field,val){
  const r=ROWS.find(x=>x.id===id);if(!r)return;r[field]=val;
  const res=await sb.from('zielkarten').update({[field]:(val===''?null:val)}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  if(field==='haben'&&r.board==='Big 5 for Life')return;
  if(field==='wachstumsfeld'||field==='asana_projekt'||field==='tun'||field==='sein')renderBoard();
}
async function toggleErledigt(id){const r=ROWS.find(x=>x.id===id);if(!r)return;const nv=!r.erledigt;r.erledigt=nv;r.erledigt_at=nv?new Date().toISOString():null;await sb.from('zielkarten').update({erledigt:nv,erledigt_at:r.erledigt_at}).eq('id',id);renderBoard();toast(nv?'Ziel erledigt ✓':'Ziel wieder geöffnet');}
async function setBoxes(id,n){const r=ROWS.find(x=>x.id===id);if(!r)return;const nv=(r.boxes_done===n)?n-1:n;r.boxes_done=nv;await sb.from('zielkarten').update({boxes_done:nv}).eq('id',id);renderBoard();}
async function addBox(id,d){const r=ROWS.find(x=>x.id===id);if(!r)return;r.boxes=Math.max(0,(r.boxes||0)+d);if(r.boxes_done>r.boxes)r.boxes_done=r.boxes;await sb.from('zielkarten').update({boxes:r.boxes,boxes_done:r.boxes_done}).eq('id',id);renderBoard();}
async function delCard(id){if(!confirm('Dieses Ziel löschen?'))return;const res=await sb.from('zielkarten').delete().eq('id',id);if(res.error){toast(res.error.message);return;}ROWS=ROWS.filter(x=>x.id!==id);renderBig5();renderBoard();}

function printJournal(){
  const w=window.open('','_blank'); if(!w){toast('Popup blockiert');return;}
  const esc2=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const nl=s=>esc2(s).replace(/\n/g,'<br>');
  const cell=v=>(v&&v.trim())?nl(v):'<span class="blank">&nbsp;</span>';
  let body='';
  BOARDS.forEach(function(b){
    body+='<h2>'+esc2(b)+'</h2>';
    HORIZ.forEach(function(h){
      const list=ROWS.filter(r=>r.board===b&&(r.horizont||'1 Jahr')===h&&(r.haben&&r.haben.trim())).sort((a,b)=>(a.pos||0)-(b.pos||0));
      if(!list.length)return;
      body+='<h3>'+esc2(h)+'</h3><table class="pt"><thead><tr><th style="width:40%">Ergebnis · HABEN</th><th style="width:30%">Schritte · TUN</th><th style="width:30%">Intention · SEIN</th></tr></thead><tbody>';
      list.forEach(function(r){
        const tot=Math.max(0,r.boxes||0),done=Math.max(0,Math.min(r.boxes_done||0,tot));
        const erreicht=!!r.erledigt||(tot>0&&done>=tot);
        const prog=tot?(' <span class="prog">['+done+'/'+tot+']</span>'):'';
        const st=schritteVon(r.id);
        const tunCell=st.length?('<ul class="stl">'+st.map(s=>'<li>'+(s.erledigt?'☑':'☐')+' '+nl(s.text||'')+'</li>').join('')+'</ul>'):'<span class="blank">&nbsp;</span>';
        body+='<tr class="'+(erreicht?'done':'')+'">'
          +'<td class="haben">'+(erreicht?'✅ ':'')+'<b>'+esc2(r.haben)+'</b>'+prog+'</td>'
          +'<td>'+tunCell+'</td>'
          +'<td>'+cell(r.sein)+'</td></tr>';
      });
      body+='</tbody></table>';
    });
  });
  const d=new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  w.document.write('<html><head><title>Ziele — '+d+'</title><style>'
    +'body{font-family:Georgia,serif;color:#111;max-width:640px;margin:24px auto;padding:0 20px;line-height:1.4}'
    +'h1{font-size:18px;margin-bottom:2px}.dt{color:#666;font-size:12px;margin-bottom:14px}'
    +'h2{font-size:15px;margin:18px 0 4px;border-bottom:1.5px solid #111;padding-bottom:2px}'
    +'h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#555;margin:10px 0 3px}'
    +'.prog{color:#0f7b57;font-size:11px}'
    +'table.pt{width:100%;border-collapse:collapse;margin:2px 0 10px;table-layout:fixed}'
    +'table.pt th{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:#555;text-align:left;border-bottom:1px solid #111;padding:3px 6px}'
    +'table.pt td{font-size:12px;vertical-align:top;border:1px solid #ddd;padding:5px 6px;word-wrap:break-word}'
    +'table.pt td.haben{font-size:12.5px}'
    +'.blank{display:block;min-height:34px;border-bottom:1px dotted #bbb}'
    +'ul.stl{margin:0;padding-left:2px;list-style:none}ul.stl li{font-size:11.5px;margin:2px 0}'
    +'tr.done td{background:#e6f6ec}tr.done .haben b{color:#0f7b57}'
    +'@media print{body{margin:0}tr.done td{-webkit-print-color-adjust:exact;print-color-adjust:exact}table.pt{page-break-inside:auto}tr{page-break-inside:avoid}}</style></head><body>'
    +'<h1>🎯 Meine Ziele</h1><div class="dt">Stand '+d+'</div>'+(body||'<p>Noch keine Ziele.</p>')
    +'<script>window.onload=function(){setTimeout(function(){window.print();},200);}<\/script></body></html>');
  w.document.close();
}
function schritteHtml(id){
  const list=schritteVon(id);
  const items=list.map(function(s){
    return '<div class="step'+(s.erledigt?' done':'')+'"><input type="checkbox" '+(s.erledigt?'checked':'')+' onchange="updSchritt(\''+s.id+'\',\'erledigt\',this.checked)">'
      +'<textarea rows="1" placeholder="Schritt …" oninput="grow(this)" onchange="updSchritt(\''+s.id+'\',\'text\',this.value)">'+esc(s.text)+'</textarea>'
      +'<button class="sx" title="Löschen" onclick="delSchritt(\''+s.id+'\')">✕</button></div>';
  }).join('');
  return '<div class="steps">'+items+'</div><button class="stepadd" onclick="addSchritt(\''+id+'\')">+ Schritt</button>';
}
async function addSchritt(kid){const pos=schritteVon(kid).length+1;const res=await sb.from('zielschritte').insert({karte_id:kid,text:'',pos}).select();if(res.error){toast(res.error.message);return;}(STEPS[kid]=STEPS[kid]||[]).push(res.data[0]);renderBoard();}
async function updSchritt(id,field,val){Object.keys(STEPS).forEach(k=>STEPS[k].forEach(s=>{if(s.id===id)s[field]=val;}));const res=await sb.from('zielschritte').update({[field]:val}).eq('id',id);if(res.error){toast(res.error.message);return;}if(field==='erledigt')renderBoard();}
async function delSchritt(id){Object.keys(STEPS).forEach(k=>{STEPS[k]=STEPS[k].filter(s=>s.id!==id);});const res=await sb.from('zielschritte').delete().eq('id',id);if(res.error){toast(res.error.message);return;}renderBoard();}
async function load(){
  const [rz,rv,rs]=await Promise.all([
    sb.from('zielkarten').select('*').order('pos'),
    sb.from('ideales_leben').select('*').eq('id',1).maybeSingle(),
    sb.from('zielschritte').select('*').order('pos')
  ]);
  ROWS=rz.error?[]:(rz.data||[]);
  VISION=(rv&&rv.data)?rv.data:{};
  STEPS={}; (rs.error?[]:(rs.data||[])).forEach(s=>{(STEPS[s.karte_id]=STEPS[s.karte_id]||[]).push(s);});
  renderBig5();renderIdeal();renderBoard();
}
load();
</script>
