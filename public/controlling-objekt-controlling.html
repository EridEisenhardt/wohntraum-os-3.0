<style>

  }
}

<script>
function uN(s){ s=String(s||'').trim(); let m=s.match(/^we\s*(\d+)(?:\s*[.\s]\s*(\d+)(?!\d))?(.*)$/i); if(m){ const rest=m[3].replace(/zi\s*(\d+)/gi,'Zi$1').replace(/\s+/g,' ').trim(); return 'WE'+m[1]+(m[2]?'.'+m[2]:'')+(rest?' '+rest:''); } m=s.match(/^(garage|lager|stellplatz)\s*(\d+)$/i); if(m) return m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+m[2]; return s; }

(function(){
const MS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const KATS=[['miete','Mieteinnahme'],['sonst_ein','Sonstige Einnahme'],['bk','Betriebskosten'],['inst','Instandhaltung'],['umbau','Umbau'],['darl','Darlehen'],['obj_sonst','Sonstige Objektkosten'],['verw','Verwaltung'],['intern','Umbuchung intern'],['ruecklast','Rücklastschrift (hebt sich auf)'],['ignore','Nicht relevant'],['','– ungeklärt –']];
const KATN=Object.fromEntries(KATS);
const SUBS_UM=[['lizenzen','Software / IT / Lizenzen'],['personal','Personal Verwaltung'],['gf','Geschäftsführung – Immobilienverwaltung'],['buchhaltung','Buchhaltung / Steuerberatung laufend'],['buero','Büro / Miete / Nebenkosten'],['buerobedarf','Bürobedarf / Porto / Druckkosten'],['telefon','Telefon / Internet / Kommunikation'],['bank','Bank- und Zahlungsverkehrskosten'],['objverw','Miet- und Objektverwaltung'],['forderung','Forderungsmanagement / Mahnwesen'],['bkverw','Betriebskostenverwaltung'],['vermietung','Vermietung / Inserate / Besichtigungen'],['objbetreuung','Objektbetreuung / Kontrollen / Fahrten'],['recht','Rechts- und Gerichtskosten objektbezogen'],['versicherung','Versicherungen Verwaltung'],['kfz','KFZ']];
/* nicht umgelegt */
const SUBS_NO=[['recht_sonst','Rechtskosten nicht objektbezogen'],['steuern','Steuern der Gesellschaft'],['spende','Spenden'],['fortbildung','Fortbildung / Fachliteratur Immobilienverwaltung'],['eeprivat','EE Privat'],['kauf','Kauf & Verkauf Immobilie'],['sonstige','Sonstige (nicht umgelegt)']];
const SUBS=SUBS_UM.concat(SUBS_NO);
const SUB_ALIAS={storno:'bank',leasing:'lizenzen'}; /* alte Arten */
const subNorm=x=>SUB_ALIAS[x]||x;
const SUBN=Object.fromEntries(SUBS);
const POOLS=['EE-Allgemein','WT-Allgemein','KiBo-Allgemein','EE-Instandhaltung','WT-Instandhaltung'];
const COSTK=['bk','inst','darl','obj_sonst'];
const fmt=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const fmt0=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fnum=new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=v=>fmt.format(v||0), eur0=v=>fmt0.format(Math.round(v||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Daten aus der Datenbank sind schreibgeschützt – immer mit einer Kopie arbeiten */
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const r2=v=>Math.round((v||0)*100)/100;
const $=id=>document.getElementById(id);
function parseNum(s){ if(s==null) return null; s=String(s).trim().replace(/\s|€|EUR/g,''); if(s==='') return null;
  let neg=false; if(/-$/.test(s)){neg=true;s=s.slice(0,-1);}
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const v=Number(s); return isFinite(v)?(neg?-v:v):NaN; }
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),3000);}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim();

/* ---------- Zustand ---------- */
let db=null, downloads=null, canWrite=true, dbState='wait';
let nhMap={}, nhStand='', vsMap={}; let unitCostOpen=store('oc_ucost')==='1', objCostOpen=store('oc_ocost')==='1', ovVerwOpen=store('oc_ovv')==='1', ovCostOpen=store('oc_ovc')==='1';
let vors={items:[]}, vFilter='offen', objekte=[], konten=[], regeln=[], einst={}, buch={}, plan=[], loaded={o:0,k:0,r:0,e:0,b:0};
let year=new Date().getFullYear(), month=null; // null = ganzes Jahr
let tab=store('oc_tab')||'uebersicht', selObj=store('oc_obj')||'', bFilter={status:'alle',konto:'',q:'',sub:'',obj:'',sort:''};
let pending=[]; // geparste, noch nicht importierte Dateien
let ruleOpen=null; const touched=new Set();
let kFilter={m:'',konto:'',ges:'',dir:'',ab:'',q:''}; try{ const kf=JSON.parse(store('oc_kf')||'null'); if(kf&&typeof kf==='object') kFilter=Object.assign(kFilter,kf); }catch(e){}
function setKF(k,v){ kFilter[k]=v; store('oc_kf',JSON.stringify(kFilter)); render(); }
/* Suche und Betrag filtern die Zeilen direkt, ohne die Seite neu aufzubauen – so bleibt das Eingabefeld beim Tippen ungestört */
function applyKF(){ const info=$('kf-info'); if(!info) return; const q=norm(kFilter.q), ab=parseNum(kFilter.ab);
  let n=0, sum=0, grp=null, gn=0; const fin=()=>{ if(grp){ grp.hidden=!gn; const x=grp.querySelector('.gn'); if(x) x.textContent=gn?' · '+gn+' offen':''; } };
  document.querySelectorAll('#view tr.grp, #view tr.tx').forEach(tr=>{ if(tr.classList.contains('grp')){ fin(); grp=tr; gn=0; return; }
    const b=Number(tr.dataset.b), ok=(!q||tr.dataset.q.includes(q))&&(!(ab>0)||Math.abs(b)>=ab); tr.hidden=!ok;
    if(ok&&tr.dataset.open==='1'){ n++; sum+=b; gn++; } }); fin();
  info.textContent=info.dataset.pre+' · '+n+' von '+info.dataset.all+' offenen Buchungen · Summe '+eur(sum);
  const em=$('kf-empty'); if(em) em.hidden=n>0||!!document.querySelector('#view tr.tx:not([hidden])');
  const rs=$('kf-reset'); if(rs) rs.hidden=!(kFilter.konto||kFilter.ges||kFilter.dir||kFilter.q||kFilter.ab); }
{const y=Number(store('oc_year')); if(y>2000&&y<2100) year=y; const m=store('oc_month'); if(m!==null&&m!==''&&!isNaN(Number(m))) month=Number(m);}

const chains={};
function queue(path,fn){chains[path]=(chains[path]||Promise.resolve()).then(fn).catch(e=>{console.error(e);
  toast(e&&e.code==='permission_denied'?'Nur Lesezugriff – Änderungen werden nicht gespeichert.':'Speichern fehlgeschlagen: '+(e&&e.message||e));});return chains[path];}
function saveStamm(name,data){ if(!db||!canWrite){toast('Nur Lesezugriff.');return Promise.resolve();} return queue('stamm/'+name,()=>db.doc('stamm/'+name).set(data)); }

/* ---------- Klassifizierung ---------- */
const objKz=()=>new Set(objekte.map(o=>o.kz));
function kontoTyp(k){ if(!k) return 'mix'; const o=k.obj||''; if(o==='__aus') return 'aus'; if(/-Allgemein$/.test(o)) return 'allg'; if(/-Instandhaltung$/.test(o)) return 'inst'; if(objKz().has(o)) return 'obj'; return 'mix'; }
let unitIdx=null;
function buildUnitIdx(){ unitIdx=[]; for(const o of objekte){ for(const e of (o.einheiten||[])){
  const toks=[]; const ref=norm(e.ref); if(ref.length>=6 && !/^miete\b/.test(ref)) toks.push(ref);
  for(const nm of String(e.mieter||'').split(',')){ const w=norm(nm).split(' ').filter(x=>x.length>=4 && x!=='undefined' && x!=='herr' && x!=='frau'); if(w.length&&!w.includes('eisenhardt')) toks.push(w[w.length-1]); } /* eigener Name (Eric Eisenhardt) nie als Mieter-Erkennung – sonst landen Geldtransits als Miete */
  unitIdx.push({obj:o.kz,id:e.id,toks}); } } }
function matchUnit(text,objs){ if(!unitIdx) buildUnitIdx(); const t=' '+norm(text)+' ';
  for(const u of unitIdx){ if(objs && !objs.includes(u.obj)) continue; for(const tk of u.toks){ if(t.includes(' '+tk+' ')||(tk.includes(' ')&&t.includes(tk))) return u; } } return null; }
/* Mieter-Erkennung inkl. ehemaliger Mieter 2026 (Einheit.alt = [{mieter, ref, von, bis, ibans}]) */
const SHARED_IBAN=new Set(['DE94760000000076001601']); /* Bundesagentur für Arbeit – zahlt für viele Mieter */
let tenIdx=null;
const dnum=s=>s?Date.parse(s)/864e5:null;
function inWin(d,von,bis,pre,post){ const x=dnum(d); if(von&&x<dnum(von)-pre) return false; if(bis&&x>dnum(bis)+post) return false; return true; }
function nameToks(names){ const out=[]; for(const nm of String(names||'').split(',')){ const w=norm(nm).split(' ').filter(x=>x.length>=3&&!['herr','frau','undefined','unbekannt'].includes(x)); if(w.length) out.push(w); } return out; }
function buildTenIdx(){ tenIdx={full:[],short:{},iban:[],alt:[],cur:[]};
  for(const o of objekte){ for(const e of (o.einheiten||[])){
    const add=(ref,von,bis,alt)=>{ const r=norm(ref); const m=r.match(/^(h\d+ w\d+)\b/); if(!m) return;

/* Einheiten natürlich sortieren: WE 1, WE 2 … WE 10; Garagen und Gewerbe ans Ende */
function sortedUnits(o){ const key=l=>String(l||'').replace(/\s+/g,'').toLowerCase(); const grp=l=>/^we|^efh/i.test(String(l||'').trim())?0:1;
  return (o.einheiten||[]).map((e,ei)=>({e,ei})).sort((a,b)=>grp(a.e.label)-grp(b.e.label)||key(a.e.label).localeCompare(key(b.e.label),'de',{numeric:true})); }
function kontoSort(a,b){ const isO=k=>objKz().has(k.obj)||objekte.some(o=>String(k.name||'').startsWith(o.kz+' ')||String(k.name||'')===o.kz||String(k.name||'').startsWith(o.kz+'/'))||/^Rh24\b/.test(k.name||'');
  const ga=isO(a)?0:1, gb=isO(b)?0:1; if(ga!==gb) return ga-gb; return String(a.name).localeCompare(String(b.name),'de',{numeric:true,sensitivity:'base'}); }
function kontoName(key){ if(key===MANKEY) return 'Kosten ohne Auszug'; const k=konten.find(x=>(x.key||x.iban)===key); return k?k.name:key; }
function objOptions(cur,withPools){ const opts=['<option value="">– kein Objekt –</option>'];

  return opts.join(''); }
function bCompute(){
  let list=allTx(); if(month!=null) list=list.filter(r=>r.m===month);
  const q=norm(bFilter.q);
  const UMK=new Set(SUBS_UM.map(x=>x[0]));
  const subOK=r=>{ const s=bFilter.sub; if(!s) return true; if(r.c.kat!=='verw') return false; if(s==='__um') return UMK.has(r.c.sub); if(s==='__no') return !!r.c.sub&&!UMK.has(r.c.sub); if(s==='__leer') return !r.c.sub; return r.c.sub===s; };
  const objOK=r=>{ const o=bFilter.obj; if(!o) return true; if(o==='__umlage') return r.c.kat==='verw'&&!r.c.obj&&UMK.has(r.c.sub); if(o==='__ohne') return !r.c.obj; return r.c.obj===o; };

async function readText(file){ const buf=await file.arrayBuffer(); try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^\uFEFF/,''); }catch(e){ return new TextDecoder('windows-1252').decode(buf); } }
function splitCSV(text,delim){ const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===delim){row.push(cur);cur='';} else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=ch; }
  if(cur!==''||row.length){row.push(cur);rows.push(row);} return rows; }
function parseDate(s){ s=String(s||'').trim(); let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/); if(m){ let y=Number(m[3]); if(y<100) y+=2000; return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0'); }

function parseBank(text,fname){
  const first=text.split(/\r?\n/).slice(0,40).join('\n'); const delim=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':(first.includes('\t')?'\t':',');
  const rows=splitCSV(text,delim).map(r=>r.map(c=>c.trim()));
  let hi=-1; for(let i=0;i<Math.min(rows.length,40);i++){ const l=rows[i].map(c=>c.toLowerCase()); if(l.some(c=>/buchungstag|buchungsdatum|^datum$|valuta|wertstellung/.test(c)) && l.some(c=>/betrag|umsatz|soll|haben/.test(c))){hi=i;break;} }
  if(hi<0) throw new Error('Keine Kopfzeile mit Datum und Betrag gefunden – ist das ein CSV-Umsatzexport?');
  const H=rows[hi].map(c=>c.toLowerCase());
  const find=(...res)=>{ for(const re of res){ const i=H.findIndex(c=>re.test(c)); if(i>=0) return i; } return -1; };
  const cDate=find(/^buchungstag$/,/^buchungsdatum$/,/buchungstag/,/buchungsdatum/,/^datum$/,/wertstellung/,/valuta/);
  const cAmt=find(/^betrag( \(€\)| \(eur\)|)$/,/^betrag/,/^umsatz$/);
  const cSoll=find(/^soll/), cHaben=find(/^haben/), cSH=find(/^s\/h$/);
  const cName=find(/beg(ue|ü)nstigter\/zahlungspflichtiger/,/name zahlungsbeteiligter/,/^empf(ae|ä)nger/,/^auftraggeber/,/^name$/,/zahlungsempf/);
  const cPfl=find(/zahlungspflichtige/), cEmpf=find(/zahlungsempf(ä|ae)nger/);
  const cZweck=H.map((c,i)=>/verwendungszweck|^buchungsdetails|^beschreibung/.test(c)?i:-1).filter(i=>i>=0);
  const cText=find(/^buchungstext$/,/^umsatztyp$/,/^umsatzart$/);
  const cIban=find(/iban zahlungsbeteiligter/,/^kontonummer\/iban$/,/^iban$/,/gegen.*iban/,/^kontonummer$/);
  const cOwn=find(/^auftragskonto$/,/iban auftragskonto/);

  if(cDate<0||(cAmt<0&&cSoll<0)) throw new Error('Spalten für Datum oder Betrag nicht erkannt.');
  const tx=[]; const seen={};
  for(let i=hi+1;i<rows.length;i++){ const r=rows[i]; if(r.length<3) continue; const d=parseDate(r[cDate]); if(!d) continue;
    let b; if(cAmt>=0){ b=parseNum(r[cAmt]); if(cSH>=0&&b!=null&&/^s/i.test(r[cSH]||'')) b=-Math.abs(b); } else { b=(parseNum(r[cHaben])||0)-Math.abs(parseNum(r[cSoll])||0); }
    if(b==null||isNaN(b)) continue;
    if(cOwn>=0&&!iban){ const o=String(r[cOwn]).replace(/\s/g,''); if(/^DE\d{20}$/.test(o)) iban=o; }
    let n=''; if(cPfl>=0&&cEmpf>=0) n=b<0?r[cEmpf]:r[cPfl]; else if(cName>=0) n=r[cName];
    const z=[cText>=0?r[cText]:'',...cZweck.map(c=>r[c])].filter(Boolean).join(' · ').replace(/\s+/g,' ').slice(0,300);
    const ib=cIban>=0?String(r[cIban]||'').replace(/\s/g,'').toUpperCase():'';
    const base=d+'|'+b.toFixed(2)+'|'+norm(n).slice(0,30)+'|'+norm(z).slice(0,60); seen[base]=(seen[base]||0)+1;
    const own=cOwn>=0?String(r[cOwn]||'').replace(/\s/g,'').toUpperCase():'';
    tx.push({h:hashStr(base+'#'+seen[base]),d,b:r2(b),n:String(n||'').slice(0,120),z,i:/^[A-Z]{2}\d{2}/.test(ib)?ib:'',ko:/^DE\d{20}$/.test(own)?own:''}); }

function hashStr(s){ let h1=0x811c9dc5,h2=0x1b873593; for(let i=0;i<s.length;i++){const c=s.charCodeAt(i); h1=Math.imul(h1^c,16777619); h2=Math.imul(h2^c,2246822507);} return (h1>>>0).toString(36)+(h2>>>0).toString(36); }
async function handleFiles(files){
  for(const f of files){ try{ const t=await readText(f); const p0=parseBank(t,f.name);
      const own=[...new Set(p0.tx.map(x=>x.ko).filter(Boolean))]; const parts=own.length>1?own.map(ib=>Object.assign({},p0,{iban:ib,file:p0.file+' · '+ib.slice(-4),tx:p0.tx.filter(x=>x.ko===ib)})):[p0];
      for(const p of parts){ p.tx=p.tx.map(x=>{ const y=Object.assign({},x); delete y.ko; return y; }); if(!p.tx.length) continue; p.von=p.tx[0].d.split('-').reverse().join('.'); p.bis=p.tx[p.tx.length-1].d.split('-').reverse().join('.');
        const k=p.iban?konten.find(x=>x.iban===p.iban):null; p.konto=k?(k.key||k.iban):(p.iban?'__neu':''); pending.push(p); } }catch(e){ pending.push({file:f.name,err:e.message||String(e)}); } }

}
async function doImport(i){

    key=p.iban||('K-'+norm(name).replace(/ /g,'-').slice(0,40)); const nk={key,iban:p.iban||'',name,ges:$('pg-'+i).value,obj:$('po-'+i).value};
    konten=konten.filter(k=>(k.key||k.iban)!==key).concat([nk]).sort(kontoSort); await saveStamm('konten',{konten}); }
  const byM={}; for(const t of p.tx){ (byM[t.d.slice(0,7)]=byM[t.d.slice(0,7)]||[]).push(t); }

    const tx=((old&&old.tx)||[]).concat(add).sort((a,b)=>a.d<b.d?-1:1);
    await queue('buchungen/'+id,()=>old?db.doc('buchungen/'+id).update({tx}):db.doc('buchungen/'+id).set({konto:key,monat:mk,tx})); }
  pending.splice(i,1); invalidate(); render(); toast(neu+' Buchungen importiert'+(dup?', '+dup+' waren schon vorhanden':'')+'.');
}

  konten.forEach((k,i)=>{ h+='<tr><td><input type="text" id="kn-'+i+'" data-kn="'+i+'" value="'+esc(k.name)+'" style="width:200px"'+ro+'></td><td class="mut">'+esc(k.iban||'–')+'</td><td><select data-kg="'+i+'"'+ro+'>'+['EE','WT','KiBo'].map(g=>'<option'+(g===k.ges?' selected':'')+'>'+g+'</option>').join('')+'</select></td><td><select data-ko="'+i+'"'+ro+'>'+objOptions(k.obj||'',true).replace('– kein Objekt –','gemischt (je Buchung)')+'</select></td><td><button class="ghost small wonly" data-kdel="'+i+'">Entfernen</button></td></tr>'; });
  h+='</tbody></table></div>';
  h+='<h2>Umlage der Verwaltungskosten</h2><div class="note">Gleichmäßig je Einheit umgelegt werden nur diese Verwaltungskosten-Arten: '+SUBS_UM.map(x=>esc(x[1])).join(' · ')+'. Ist bei einer Buchung ein Objekt gewählt, zählt sie direkt bei diesem Objekt. Nicht umgelegt (und keinem Objekt angerechnet): '+SUBS_NO.map(x=>esc(x[1])).join(' · ')+'.</div>';
  h+='<h2>Zuordnungsregeln</h2><div class="note">Beginnt ein Wort in Name oder Verwendungszweck mit dem Suchbegriff, wird die Buchung so zugeordnet. Die erste passende Regel gilt. Neue Regeln legst du am schnellsten unter „Buchungen“ mit dem Knopf „Regel“ an.</div>';
  h+='<div class="tablewrap"><table><thead><tr><th>Suchbegriff</th><th>Kategorie</th><th>Art</th><th>Objekt</th><th>Gilt für</th><th></th></tr></thead><tbody>';
  regeln.forEach((r,i)=>{ h+='<tr><td><b>'+esc(r.muster)+'</b></td><td>'+esc(KATN[r.kat]||r.kat)+'</td><td>'+esc(SUBN[r.sub]||'')+'</td><td>'+esc(r.obj==='__ges'?'Gesellschaft (kein Objekt)':r.obj||(r.kat==='verw'?'Umlage':'Objekt des Kontos'))+'</td><td>'+({alle:'alle Konten',allgemein:'Allgemein-Konten',objekt:'Objekt-Konten'}[r.scope]||'alle Konten')+(r.dir==='ein'?' · nur Eingänge':r.dir==='aus'?' · nur Ausgänge':r.dir==='beide'?' · auch Erstattungen':'')+(r.betrag?' · nur '+eur(r.betrag):'')+'</td><td>'+(r.vor?'<span class="pill src" title="gilt auch für Überweisungen zwischen eigenen Konten">Vorrang</span> ':'')+'<button class="ghost small wonly" data-rup="'+i+'" title="nach oben"'+(i?'':' disabled')+'>↑</button><button class="ghost small wonly" data-rdel="'+i+'">Löschen</button></td></tr>'; });
  h+='</tbody></table></div>';
  h+='<h2>Fixkosten-Positionen (aus „Monatswechsel Fixkosten“)</h2><div class="note">Passt der Betrag einer Abbuchung genau zu einer dieser Positionen auf dem Konto des Objekts (bzw. des Allgemein-Kontos), wird sie automatisch so zugeordnet – z. B. die Darlehensraten. Gezählt wird immer der tatsächliche Betrag laut Kontoauszug.</div>';
  h+='<details class="obj"><summary><b>'+plan.length+' Positionen</b><span class="sub">'+plan.filter(x=>x.kat==='darl').length+' Darlehensraten</span></summary><div class="tablewrap"><table><thead><tr><th>Objekt / Konto</th><th>Position</th><th>Kategorie</th><th class="n">Betrag</th></tr></thead><tbody>'+plan.map(x=>'<tr><td>'+esc(x.obj)+'</td><td>'+esc(x.pos)+'</td><td>'+esc(KATN[x.kat]||x.kat)+(x.sub?' · '+esc(SUBN[x.sub]||x.sub):'')+'</td><td class="n">'+eur(x.betrag)+'</td></tr>').join('')+'</tbody></table></div></details>';
  h+='<h2>Objekte &amp; Einheiten</h2><div class="note">Aus Nahaus übernommen (Kalt- und Nebenkosten-Soll der laufenden Mietverhältnisse). Hier kannst du Sollwerte anpassen und festlegen, ob eine Einheit bei der Verwaltungsumlage mitzählt.</div>';
  objekte.forEach((o,oi)=>{ h+='<details class="obj"><summary><b>'+esc(o.kz)+'</b><span>'+esc(o.name)+'</span><span class="pill src">'+esc(o.ges)+'</span><span class="sub">'+unitsOf(o)+' Einheiten · Soll '+eur(sollOf(o))+'/Monat</span><label class="sub" style="margin-left:auto;display:flex;gap:4px;align-items:center"><input type="checkbox" data-oakt="'+oi+'"'+(o.aktiv!==false?' checked':'')+ro+'> aktiv</label></summary><div class="tablewrap"><table><thead><tr><th>Einheit</th><th>Mieter</th><th class="n">Kalt</th><th class="n">NK</th><th>Umlage</th></tr></thead><tbody>';
    sortedUnits(o).forEach(({e,ei})=>{ h+='<tr><td>'+esc(uN(e.label))+'</td><td>'+esc(e.mieter||'– leer –')+'</td><td class="n"><input type="text" inputmode="decimal" class="num" id="ek-'+oi+'-'+ei+'" data-ek="'+oi+':'+ei+'" value="'+fnum.format(e.kalt||0)+'"'+ro+'></td><td class="n"><input type="text" inputmode="decimal" class="num" id="en-'+oi+'-'+ei+'" data-en="'+oi+':'+ei+'" value="'+fnum.format(e.nk||0)+'"'+ro+'></td><td><input type="checkbox" data-eu="'+oi+':'+ei+'"'+(e.umlage!==false?' checked':'')+ro+' aria-label="zählt für Umlage"></td></tr>'; });
    h+='</tbody></table></div></details>'; });
  return h;
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,tr.click'); if(!t) return;
  if(t.id==='b-nsort'){ bFilter.sort=bFilter.sort==='az'?'za':bFilter.sort==='za'?'':'az'; render(); return; }
  if(t.id==='b-bsort'){ bFilter.sort=bFilter.sort==='ab'?'auf':bFilter.sort==='auf'?'':'ab'; render(); return; }
  if(t.id==='freset'){ bFilter={status:'alle',konto:'',q:'',sub:'',obj:'',sort:''}; render(); return; }
  if(t.matches('tr.click')){ selObj=t.dataset.obj; store('oc_obj',selObj); tab='objekt'; store('oc_tab',tab); render(); window.scrollTo({top:0}); return; }
  if(t.id==='vcost'){ ovVerwOpen=!ovVerwOpen; store('oc_ovv',ovVerwOpen?'1':'0'); render(); return; }
  if(t.id==='ocost2'){ ovCostOpen=!ovCostOpen; store('oc_ovc',ovCostOpen?'1':'0'); render(); return; }
  if(t.id==='ocost'){ objCostOpen=!objCostOpen; store('oc_ocost',objCostOpen?'1':'0'); render(); return; }
  if(t.id==='ucost'){ unitCostOpen=!unitCostOpen; store('oc_ucost',unitCostOpen?'1':'0'); render(); return; }
  if(t.id==='kf-nsort'){ setKF('sort',kFilter.sort==='az'?'za':kFilter.sort==='za'?'':'az'); return; }
  if(t.id==='kf-bsort'){ setKF('sort',kFilter.sort==='ab'?'auf':kFilter.sort==='auf'?'':'ab'); return; }
  if(t.id==='kf-reset'){ kFilter={m:'',konto:'',ges:'',dir:'',ab:'',q:''}; store('oc_kf',JSON.stringify(kFilter)); render(); return; }
  if(t.id==='yprev'||t.id==='ynext'){ year+=t.id==='yprev'?-1:1; store('oc_year',year); invalidate(); render(); return; }
  if(t.id==='xls'){ exportXLS(); return; }
  if(t.dataset.m!==undefined){ month=t.dataset.m===''?null:Number(t.dataset.m); store('oc_month',month==null?'':month); render(); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; store('oc_tab',tab); ruleOpen=null; touched.clear(); render(); return; }
  if(t.dataset.goto){ tab=t.dataset.goto; touched.clear(); store('oc_tab',tab); render(); return; }
  if(t.dataset.rule){ ruleOpen=ruleOpen===t.dataset.rule?null:t.dataset.rule; render(); return; }
  if(t.dataset.rcancel){ ruleOpen=null; render(); return; }
  if(t.dataset.rsave){ const m=($('rf-m').value||'').trim(); if(m.length<3){toast('Der Suchbegriff braucht mindestens 3 Zeichen.');return;}
    const r={id:'r'+Date.now().toString(36),muster:m,kat:$('rf-k').value,sub:$('rf-k').value==='verw'?$('rf-s').value:'',obj:$('rf-o').value,scope:$('rf-sc').value};
    regeln=[r].concat(regeln); ruleOpen=null; invalidate(); saveStamm('regeln',{regeln}).then(()=>toast('Regel gespeichert – gilt ab sofort für alle passenden Buchungen.')); render(); return; }
  if(t.dataset.rdel!==undefined){ const i=Number(t.dataset.rdel); if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Wirklich?';return;} regeln=regeln.filter((_,j)=>j!==i); invalidate(); saveStamm('regeln',{regeln}); render(); return; }
  if(t.dataset.rup!==undefined){ const i=Number(t.dataset.rup); if(i<1) return; const a=regeln.slice(); [a[i-1],a[i]]=[a[i],a[i-1]]; regeln=a; invalidate(); saveStamm('regeln',{regeln}); render(); return; }
  if(t.dataset.kdel!==undefined){ const i=Number(t.dataset.kdel); if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Wirklich?';return;} konten=konten.filter((_,j)=>j!==i); invalidate(); saveStamm('konten',{konten}); render(); return; }
  if(t.id==='mn-add'){ addManual(); return; }
  if(t.dataset.vok){ acceptVors([t.dataset.vok]); return; }
  if(t.dataset.vlink){ linkVors(t.dataset.vlink); return; }
  if(t.dataset.vno){ setVors(t.dataset.vno,{st:'verworfen'}); return; }
  if(t.dataset.vall){ const k=t.dataset.vall; if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Wirklich alle?';return;} acceptVors(vors.items.filter(v=>v.st==='offen'&&v.k===k).map(v=>v.id)); return; }
  if(t.dataset.mdel!==undefined){ if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Wirklich?';return;} delManual(t.dataset.mdel); return; }
  if(t.dataset.pimp!==undefined){ doImport(Number(t.dataset.pimp)); return; }
  if(t.dataset.pdrop!==undefined){ pending.splice(Number(t.dataset.pdrop),1); render(); return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='file'){ handleFiles([...t.files]); t.value=''; return; }
  if(t.id==='vfilter'){ vFilter=t.value; render(); return; }
  if(t.dataset.vk){ setVors(t.dataset.vk,{k:t.value}); return; }
  if(t.id==='mn-o'){ manDraft.o=t.value; return; }
  if(t.id==='mn-k'){ manDraft.k=t.value; render(); return; }
  if(t.id==='mn-s'){ manDraft.s=t.value; return; }
  if(t.id==='objsel'){ selObj=t.value; store('oc_obj',selObj); render(); return; }
  if(t.id==='fstatus'){ bFilter.status=t.value; render(); return; }
  if(t.id==='fkonto'){ bFilter.konto=t.value; render(); return; }
  if(t.id==='fsub'){ bFilter.sub=t.value; if(t.value&&bFilter.status!=='alle'&&bFilter.status!=='verw'&&bFilter.status!=='offen'&&bFilter.status!=='auto') bFilter.status='verw'; render(); return; }
  if(t.id==='fobj'){ bFilter.obj=t.value; render(); return; }
  if(t.id==='fsort'){ bFilter.sort=t.value; render(); return; }
  if(t.id==='kf-m'){ setKF('m',t.value); return; } if(t.id==='kf-konto'){ setKF('konto',t.value); return; } if(t.id==='kf-ges'){ setKF('ges',t.value); return; } if(t.id==='kf-dir'){ setKF('dir',t.value); return; } if(t.id==='kf-sort'){ setKF('sort',t.value); return; }
  if(t.dataset.set){ touched.add(t.dataset.id); setTx(t.dataset.id,t.dataset.set,t.value); return; }
  if(t.dataset.pk!==undefined){ const p=pending[Number(t.dataset.pk)]; p.konto=t.value; render(); return; }
  if(t.id==='sonstUm'){ einst=Object.assign({},einst,{sonstigeUmlegen:t.checked}); saveStamm('einstellungen',einst); render(); return; }
  if(t.dataset.kn!==undefined){ clearTimeout(knTimer); konten[Number(t.dataset.kn)].name=t.value.trim(); saveStamm('konten',{konten}); return; }
  if(t.dataset.kg!==undefined){ konten[Number(t.dataset.kg)].ges=t.value; saveStamm('konten',{konten}); return; }
  if(t.dataset.ko!==undefined){ konten[Number(t.dataset.ko)].obj=t.value; invalidate(); saveStamm('konten',{konten}); render(); return; }
  const oe=(attr)=>t.dataset[attr].split(':').map(Number);
  if(t.dataset.oakt!==undefined){ objekte[Number(t.dataset.oakt)].aktiv=t.checked; saveObj(); return; }
  if(t.dataset.ek!==undefined||t.dataset.en!==undefined){ const [oi,ei]=oe(t.dataset.ek!==undefined?'ek':'en'); const v=parseNum(t.value); if(v==null||isNaN(v)){toast('Bitte einen Betrag eingeben.');return;}
    objekte[oi].einheiten[ei][t.dataset.ek!==undefined?'kalt':'nk']=v; saveObj(); return; }
  if(t.dataset.eu!==undefined){ const [oi,ei]=oe('eu'); objekte[oi].einheiten[ei].umlage=t.checked; saveObj(); return; }
});
let qTimer=null;
/* Eingaben nicht durch Datenbank-Updates überschreiben: solange ein Textfeld aktiv ist, wird erst nach dem Verlassen neu gezeichnet */
let pendingRender=false;
function editing(){ const a=document.activeElement; return !!(a&&$('view').contains(a)&&a.matches('input[type=text],input[type=number]')&&!['fq','kf-q','kf-ab'].includes(a.id)); }
function softRender(){ if(editing()){ pendingRender=true; return; } render(); }
document.addEventListener('focusout',()=>{ if(!pendingRender) return; setTimeout(()=>{ if(!editing()){ pendingRender=false; render(); } },0); });
let knTimer=null;
document.addEventListener('input',e=>{ const t=e.target;
  if(t.dataset&&t.dataset.kn!==undefined){ const i=Number(t.dataset.kn); if(konten[i]){ konten[i].name=t.value.trim(); clearTimeout(knTimer); knTimer=setTimeout(()=>saveStamm('konten',{konten}),700); } return; } });
document.addEventListener('input',e=>{ const id=e.target.id; if(/^mn-[dnrbz]$/.test(id)) manDraft[id.slice(3)]=e.target.value; });
document.addEventListener('input',e=>{ if(e.target.id==='kf-q'||e.target.id==='kf-ab'){ clearTimeout(qTimer); const v=e.target.value, k=e.target.id==='kf-q'?'q':'ab'; kFilter[k]=v; store('oc_kf',JSON.stringify(kFilter)); qTimer=setTimeout(applyKF,120); return; } if(e.target.id==='fq'){ clearTimeout(qTimer); bFilter.q=e.target.value; qTimer=setTimeout(applyBQ,200); } });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.matches('input[type=text]')&&!['fq','kf-q','kf-ab'].includes(e.target.id)) e.target.blur(); });
function saveObj(){ invalidate(); saveStamm('objekte',{objekte,quelle:objQuelle}); render(); }
let objQuelle='';
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{ const d=e.target.closest&&e.target.closest('#drop'); if(e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files')){ e.preventDefault(); if(d) d.classList.add('over'); } }));
document.addEventListener('dragleave',e=>{ const d=e.target.closest&&e.target.closest('#drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop',e=>{ if(!e.dataTransfer||!e.dataTransfer.files.length) return; e.preventDefault(); const d=$('drop'); if(d) d.classList.remove('over'); handleFiles([...e.dataTransfer.files]); });

/* ---------- Excel ---------- */
function loadXLSX(){ if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error('Excel-Bibliothek konnte nicht geladen werden'));document.head.appendChild(s);}); }
async function exportXLS(){
  const btn=$('xls'); btn.disabled=true; btn.textContent='Erstelle …';
  try{ const X=await loadXLSX(); const C=compute(); const wb=X.utils.book_new(); const E='#,##0.00 "€";[Red]-#,##0.00 "€"';
    const sheet=(aoa,w)=>{const ws=X.utils.aoa_to_sheet(aoa); ws['!cols']=w.map(x=>({wch:x})); for(const k in ws){const c=ws[k]; if(c&&c.t==='n'&&!/^A/.test(k)) c.z=E;} return ws;};
    const a=[['Objekt-Controlling – '+periodLabel()],[],['Gesellschaft','Objekt','Einheiten','Erlöse Ist','Betriebskosten','Instandhaltung','Darlehen','Verwaltung','Sonstige','Kosten gesamt','Ergebnis','Umbau','Ergebnis inkl. Umbau','Kosten je Einheit','Soll-Miete je Einheit','Deckung %']];
    for(const x of Object.values(C.res)){ const r=objRow(x); a.push([x.o.ges,x.o.kz+' '+x.o.name,x.units,r2(r.ein),r2(r.bk),r2(r.inst),r2(r.darl),r2(r.verw),r2(r.os),r2(r.kosten),r2(r.erg),r2(r.umbau),r2(r.ergU),r2(r.proE),r2(r.sollProE),r.deck==null?null:Math.round(r.deck*100)]); }
    const ws=sheet(a,[12,36,10,14,14,14,14,14,12,14,14,12,18,16,18,10]); for(const k in ws){ if(/^[CP]\d/.test(k)&&ws[k].t==='n') delete ws[k].z; } X.utils.book_append_sheet(wb,ws,'Übersicht');
    const m=[['Ergebnis je Monat '+year],[],['Objekt',...MS,'Jahr']];
    for(const x of Object.values(C.res)){ const e=MS.map((_,i)=>r2(x.ein[i]-x.bk[i]-x.inst[i]-x.darl[i]-x.obj_sonst[i]-x.verwD[i]-x.verwU[i])); m.push([x.o.kz,...e,r2(e.reduce((p,q)=>p+q,0))]); }
    X.utils.book_append_sheet(wb,sheet(m,[10,...MS.map(()=>11),12]),'Monate');
    const b=[['Datum','Konto','Gegenpartei','Verwendungszweck','Betrag','Kategorie','Art','Objekt','Einheit','Status']];
    for(const r of allTx()){ if(month!=null&&r.m!==month) continue; const o=objekte.find(x=>x.kz===r.c.obj), u=o&&(o.einheiten||[]).find(x=>x.id===r.c.unit);
      b.push([r.tx.d.split('-').reverse().join('.'),kontoName(r.kkey),r.tx.n,r.tx.z,r.tx.b,KATN[r.c.kat]||'ungeklärt',SUBN[r.c.sub]||'',r.c.obj||'',u?u.label:'',isOpen(r.c)?'offen':r.c.src]); }
    X.utils.book_append_sheet(wb,sheet(b,[11,22,30,60,12,20,20,10,12,10]),'Buchungen');
    const buf=X.write(wb,{bookType:'xlsx',type:'array'});
    await downloads.save({filename:'WT_Objekt-Controlling_'+(month==null?year:year+'-'+String(month+1).padStart(2,'0'))+'.xlsx',data:buf}); toast('Excel gespeichert.');
  }catch(e){ const c=e&&e.code; toast(c==='declined'?'Download abgebrochen.':'Export fehlgeschlagen: '+(e&&e.message||e)); }
  finally{ btn.disabled=false; btn.textContent='Excel-Export'; }
}

/* ---------- Start ---------- */
render();
(async()=>{
  try{ const user=await claude.use('user'); if(user&&typeof user.can==='function'){ const c=await user.can('data.write'); if(c===false) canWrite=false; } }catch(e){}
  try{ downloads=await claude.use('downloads'); }catch(e){ downloads=null; }
  try{ db=await claude.use('db'); }catch(e){ db=null; }
  if(!db){ dbState='none'; render(); return; }
  const done=(k)=>{loaded[k]=1; invalidate(); softRender();};
  db.doc('stamm/objekte').onSnapshot(s=>{ const d=s.exists?clone(s.data()):{}; objekte=d.objekte||[]; objQuelle=d.quelle||''; done('o'); },()=>done('o'));
  db.doc('stamm/konten').onSnapshot(s=>{ konten=(s.exists?clone(s.data()).konten:null)||[]; done('k'); },()=>done('k'));
  db.doc('stamm/regeln').onSnapshot(s=>{ regeln=(s.exists?clone(s.data()).regeln:null)||[]; done('r'); },()=>done('r'));
  db.doc('vorschlaege/ordner-2026').onSnapshot(s=>{ vors=s.exists?clone(s.data()):{items:[]}; if(!vors.items) vors.items=[]; softRender(); },()=>{});
  db.doc('stamm/fixkosten').onSnapshot(s=>{ plan=(s.exists?clone(s.data()).plan:null)||[]; invalidate(); softRender(); },()=>{});
  db.doc('stamm/verwsub').onSnapshot(s=>{ vsMap=(s.exists?clone(s.data()).map:null)||{}; invalidate(); softRender(); },()=>{});
  db.doc('stamm/nahaus').onSnapshot(s=>{ const d=s.exists?clone(s.data()):{}; nhMap=d.map||{}; nhStand=d.stand||''; invalidate(); softRender(); },()=>{});
  db.doc('stamm/einstellungen').onSnapshot(s=>{ einst=s.exists?clone(s.data()):{}; done('e'); },()=>done('e'));
  db.collection('buchungen').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{m[d.id]=clone(d.data());}); buch=m; done('b'); },e=>{toast('Buchungen nicht lesbar: '+e.message); done('b');});
})();
})();
