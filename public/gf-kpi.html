<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI GF Kennzahlen</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--surf:#fff;--surf2:#f1f3f6;--line:#e6e8ec;--text:#1c2024;--muted:#6b7280;--dim:#4b5563;--accent:#185fa5;--green:#1f7a4d;--red:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
.hdr{background:var(--surf);border-bottom:1px solid var(--line);padding:14px 22px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hdr-title{font-size:17px;font-weight:700}.hdr-sub{font-size:11.5px;color:var(--muted)}
.wrap{max-width:1280px;margin:10px auto;padding:0 14px 16px}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.tk{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.tk .l{font-size:9.5px;text-transform:uppercase;color:var(--muted)}.tk .v{font-size:17px;font-weight:700;margin-top:2px}
.tk.cf{background:linear-gradient(135deg,#185fa5,#124a80);color:#fff;border:none}.tk.cf .l{color:rgba(255,255,255,.85)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card .nm{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card .nm input{flex:1;font:inherit;font-size:15px;font-weight:700;border:1px solid transparent;border-radius:7px;padding:5px 7px;background:transparent}
.card .nm input:hover{border-color:var(--line)}.card .nm input:focus{outline:none;border-color:var(--accent);background:var(--surf2)}
.line{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.line .lbl{font-size:12.5px;color:var(--dim)}
.line input{width:130px;text-align:right;font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surf2)}
.line input:focus{outline:none;border-color:var(--accent);background:var(--surf)}
.cfrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px}
.cfrow .lbl{font-size:12.5px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.cfrow .val{font-size:19px;font-weight:700}
.pos{color:var(--green)}.neg{color:var(--red)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
table.kpitbl{border-collapse:collapse;font-size:13px;width:100%;min-width:640px}
table.kpitbl th,table.kpitbl td{padding:9px 12px;border-bottom:1px solid var(--line);border-right:1px solid #f0f1f3;text-align:right;white-space:nowrap}
table.kpitbl th{background:var(--surf2);font-size:11px;font-weight:700;color:var(--dim)}
table.kpitbl td.rowlbl,table.kpitbl th.rowlbl{text-align:left;font-weight:600;color:var(--dim);position:sticky;left:0;background:var(--surf);z-index:1}
table.kpitbl th.rowlbl{background:var(--surf2)}
table.kpitbl td.num input{width:120px;text-align:right;font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surf2)}
table.kpitbl td.num input:focus{outline:none;border-color:var(--accent);background:var(--surf)}
table.kpitbl th input{width:150px;font:inherit;font-size:13.5px;font-weight:700;padding:4px 6px;border:1px solid transparent;border-radius:6px;background:transparent;text-align:left}
table.kpitbl th input:hover{border-color:var(--line)}table.kpitbl th input:focus{outline:none;border-color:var(--accent);background:var(--surf)}
table.kpitbl tr.cfr td{font-weight:700;font-size:14px;border-top:2px solid var(--accent);background:#f7fafd}
table.kpitbl .tot{font-weight:700;background:#eef4fb}
.abtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}.abtn:hover{color:var(--red)}
.abtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px}.abtn:hover{color:var(--red)}
.btn{font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surf2);color:var(--text);cursor:pointer}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2024;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:50}.toast.show{opacity:1}
</style></head><body>
<div class="hdr">
  <div><div class="hdr-title">📊 KPI GF · Cashflow je Struktur</div><div class="hdr-sub">Einnahmen − Ausgaben je Firma/Struktur · p.a.</div></div>
  <button class="btn btn-accent" onclick="addRow()">+ Struktur</button>
</div>
<div class="wrap">
  <div class="tot" id="head"></div>
  <div class="tot" id="tot"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nf=new Intl.NumberFormat('de-DE',{maximumFractionDigits:0});
const eur=v=>(v==null||isNaN(v)?'0':nf.format(Math.round(v)))+' €';
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
let ROWS=[], OFFEN=0, BANK=0;
async function saveKpi(key,val){const v=(val===''||val==null)?0:Number(String(val).replace(/\./g,'').replace(',','.'));const num=isNaN(v)?0:v;
  if(key==='offene_mieten')OFFEN=num;else BANK=num;
  await sb.from('gf_kpi_werte').update({wert:num,updated_at:new Date().toISOString()}).eq('schluessel',key);render();toast('Gespeichert ✓');}
async function save(id,field,val,num){let v;if(num){v=(val===''||val==null)?null:Number(String(val).replace(/\./g,'').replace(',','.'));if(isNaN(v))v=null;}else v=(val&&val.trim())?val.trim():null;
  const res=await sb.from('gf_cashflow').update({[field]:v}).eq('id',id);if(res.error){toast('Fehler: '+res.error.message);return;}
  const r=ROWS.find(x=>x.id===id);if(r)r[field]=v;render();}
async function addRow(){const r=await sb.from('gf_cashflow').insert({struktur:'Neue Struktur',einnahmen:0,ausgaben:0,pos:ROWS.length}).select();if(r.error)return toast(r.error.message);ROWS.push(r.data[0]);render();toast('Struktur angelegt');}
async function del(id){if(!confirm('Struktur löschen?'))return;const res=await sb.from('gf_cashflow').delete().eq('id',id);if(res.error)return toast(res.error.message);ROWS=ROWS.filter(x=>x.id!==id);render();}
function renderHead(se,sa){
  const cf=se-sa;
  $('head').innerHTML=[
    ['Offene Mieten',kpiInput('offene_mieten',OFFEN),''],
    ['Liquidität · Bankguthaben',kpiInput('bankguthaben',BANK),''],
    ['Σ Einnahmen p.a.',eur(se),''],
    ['Σ Ausgaben p.a.',eur(sa),''],
    ['Σ Cashflow p.a.',eur(cf),'cf'],
    ['Strukturen',ROWS.length,'']
  ].map(x=>'<div class="tk '+(x[2]||'')+'"><div class="l">'+esc(x[0])+'</div><div class="v">'+x[1]+'</div></div>').join('');
  $('tot').innerHTML='';
}
function render(){
  if(!ROWS.length){$('grid').innerHTML='<div style="color:var(--muted);padding:20px">Noch keine Struktur. Mit „+ Struktur" anlegen.</div>';renderHead(0,0);return;}
  let se=0,sa=0;
  const cols=ROWS.map(r=>{const e=Number(r.einnahmen)||0,a=Number(r.ausgaben)||0;se+=e;sa+=a;return {r:r,e:e,a:a,cf:e-a};});
  const inp=(r,f)=>'<td class="num"><input inputmode="decimal" value="'+(r[f]!=null?r[f]:'')+'" onchange="save(\''+r.id+'\',\''+f+'\',this.value,1)"></td>';
  let h='<div class="scroll"><table class="kpitbl"><thead><tr><th class="rowlbl">Kennzahl</th>'
    +cols.map(c=>'<th><div style="display:flex;gap:6px;align-items:center"><input value="'+esc(c.r.struktur)+'" onchange="save(\''+c.r.id+'\',\'struktur\',this.value)"><button class="abtn" onclick="del(\''+c.r.id+'\')" title="Struktur löschen">✕</button></div></th>').join('')
    +'<th class="tot">Gesamt</th></tr></thead><tbody>';
  h+='<tr><td class="rowlbl">Summe Einnahmen p.a.</td>'+cols.map(c=>inp(c.r,'einnahmen')).join('')+'<td class="num tot">'+eur(se)+'</td></tr>';
  h+='<tr><td class="rowlbl">Summe Ausgaben p.a.</td>'+cols.map(c=>inp(c.r,'ausgaben')).join('')+'<td class="num tot">'+eur(sa)+'</td></tr>';
  h+='<tr class="cfr"><td class="rowlbl">Cashflow p.a.</td>'+cols.map(c=>'<td class="num '+(c.cf>=0?'pos':'neg')+'">'+eur(c.cf)+'</td>').join('')+'<td class="num tot '+((se-sa)>=0?'pos':'neg')+'">'+eur(se-sa)+'</td></tr>';
  h+='</tbody></table></div>';
  $('grid').innerHTML=h;
  renderHead(se,sa);
}
function kpiInput(key,val){return '<input inputmode="decimal" value="'+(val||0)+'" onchange="saveKpi(\''+key+'\',this.value)" style="width:130px;text-align:right;font:inherit;font-size:16px;font-weight:700;border:1px solid var(--line);border-radius:7px;padding:3px 7px;background:var(--surf2)"> €';}
async function load(){
  const [cf,kv]=await Promise.all([
    sb.from('gf_cashflow').select('*').order('pos',{nullsFirst:false}),
    sb.from('gf_kpi_werte').select('*')
  ]);
  ROWS=cf.error?[]:(cf.data||[]);
  const m={};(kv.data||[]).forEach(r=>m[r.schluessel]=Number(r.wert)||0);
  OFFEN=m.offene_mieten||0;BANK=m.bankguthaben||0;
  render();
}
load();
</script>
</body></html>
