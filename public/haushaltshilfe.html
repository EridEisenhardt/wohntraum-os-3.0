<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haushaltshilfe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--surf:#fff;--surf2:#f1f3f6;--line:#e6e8ec;--text:#1c2024;--muted:#6b7280;--dim:#4b5563;--accent:#185fa5;--green:#1f7a4d;--amber:#e08a1e;--red:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
.hdr{background:var(--surf);border-bottom:1px solid var(--line);padding:14px 22px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hdr-title{font-size:17px;font-weight:700}.hdr-sub{font-size:11.5px;color:var(--muted)}
.wrap{max-width:1100px;margin:14px auto;padding:0 16px 60px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{font:inherit;font-size:13.5px;font-weight:600;padding:8px 16px;border:1px solid var(--line);border-radius:9px;background:var(--surf);color:var(--dim);cursor:pointer}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab .n{font-size:11px;opacity:.85;margin-left:5px}
.intro{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar input[type=text],.bar select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surf)}
.bar input[type=text]{min-width:200px}
.btn{font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surf2);color:var(--text);cursor:pointer}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card .top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.card input.thema{flex:1;font:inherit;font-size:15px;font-weight:600;border:1px solid transparent;border-radius:7px;padding:5px 7px;background:transparent}
.card input.thema:hover{border-color:var(--line)}.card input.thema:focus{outline:none;border-color:var(--accent);background:var(--surf2)}
.pill{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);background:var(--surf2);color:var(--dim)}
select.kat,select.st,select.pr,select.zu{font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:20px;background:var(--surf2);color:var(--dim);cursor:pointer}
textarea{width:100%;font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surf2);color:var(--text);resize:none;overflow:hidden;line-height:1.5}
textarea:focus{outline:none;border-color:var(--accent);background:var(--surf)}
.lbl{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:8px 0 3px}
.abtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px}.abtn:hover{color:var(--red)}
.st-Offen{color:var(--red)!important;border-color:#f0c4bd!important;background:#fdeeec!important}
.st-InKlärung{color:var(--amber)!important;border-color:#f0dcbd!important;background:#fdf6ec!important}
.st-Geklärt,.st-Erledigt{color:var(--green)!important;border-color:#bfe0cd!important;background:#eef8f2!important}
.empty{text-align:center;color:var(--muted);padding:26px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2024;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:50}.toast.show{opacity:1}
</style></head><body>
<div class="hdr">
  <div><div class="hdr-title">🏠 Haushaltshilfe</div><div class="hdr-sub">Einarbeitung & Kommunikation · für aktuelle Hilfe und Nachfolge</div></div>
  <button class="btn btn-accent" onclick="addRow()">+ Neu</button>
</div>
<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-t="auf" onclick="setTab('auf')">Aufgaben & Botengänge<span class="n" id="n_auf"></span></button>
    <button class="tab" data-t="eink" onclick="setTab('eink')">Einkaufsliste<span class="n" id="n_eink"></span></button>
    <button class="tab" data-t="kat" onclick="setTab('kat')">Standard-Sortiment<span class="n" id="n_kat"></span></button>
    <button class="tab" data-t="wis" onclick="setTab('wis')">Einarbeitung & Wissen<span class="n" id="n_wis"></span></button>
  </div>
  <div class="intro" id="intro"></div>
  <div class="bar" id="bar"></div>
  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>
<div id="scanBox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:60;align-items:center;justify-content:center;flex-direction:column;gap:12px">
  <video id="scanVid" playsinline style="max-width:92vw;max-height:70vh;border-radius:12px;border:2px solid #fff"></video>
  <div style="color:#fff;font-size:13px">Barcode vor die Kamera halten…</div>
  <button class="btn" onclick="stopScan()">Abbrechen</button>
</div>
<datalist id="katDL"></datalist>
<datalist id="geschDL"></datalist>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
function grow(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';}
let TAB='auf', AUF=[], WIS=[], EINK=[], KAT=[];
const STATI=['Offen','In Klärung','Geklärt','Erledigt'];
const PRIO=['Hoch','Mittel','Niedrig'];
const ZUST=['Haushaltshilfe','Eric'];
const ART=['Aufgabe','Botengang','Kleine Aufgabe','Frage'];
const KAT=['Küche','Wäsche','Einkauf','Reinigung','Pflanzen & Tiere','Termine','Post','Schlüssel & Zugang','Sonstiges'];
const EKAT=['Obst & Gemüse','Molkerei','Fleisch & Fisch','Trocken & Konserven','Getränke','Tiefkühl','Haushalt & Drogerie','Sonstiges'];
const TBL={auf:'haushaltshilfe_aufgaben',wis:'haushaltshilfe_wissen',eink:'haushaltshilfe_einkauf',kat:'haushaltshilfe_katalog'};
const INTRO={auf:'Aufgaben, Botengänge, kleine Aufgaben und offene Fragen. Art wählen (Aufgabe/Botengang/…). Eric stellt eine Frage/Aufgabe, die Haushaltshilfe kann direkt darunter antworten. Status auf „Geklärt/Erledigt" setzen.',
 eink:'Einkaufsliste: Positionen aus dem Essensplaner (Wunschwoche) landen hier automatisch. Zusätzlich eigene Einkaufswünsche mit „+ Neu" ergänzen. Haken = gekauft.',
 kat:'Standard-Sortiment: häufig benötigte Produkte. Menge wählen und „+ Liste" tippen – der Artikel wandert in die Einkaufsliste. Neue Produkte per Barcode-Scan (Daten aus dem Internet) oder manuell anlegen. Wichtig: Geschäft · Firma · Produkt.',
 wis:'Anleitungen und Wissen für die Einarbeitung – so findet sich auch eine Nachfolge schnell zurecht. Ein Thema pro Karte, Kategorie wählen, Inhalt frei beschreiben.'};

function setTab(t){TAB=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.t===t));render();}
function arrOf(t){return t==='auf'?AUF:t==='wis'?WIS:t==='kat'?KAT:EINK;}
async function save(id,field,val){const arr=arrOf(TAB);const v=(val&&val.trim())?val.trim():null;
  const res=await sb.from(TBL[TAB]).update({[field]:v}).eq('id',id);if(res.error){toast('Fehler: '+res.error.message);return;}
  const r=arr.find(x=>x.id===id);if(r)r[field]=v;if(field==='status'||field==='prioritaet'||field==='kategorie')render();else toast('Gespeichert ✓');}
async function toggleGekauft(id,checked){const res=await sb.from('haushaltshilfe_einkauf').update({gekauft:checked}).eq('id',id);if(res.error){toast('Fehler: '+res.error.message);return;}const r=EINK.find(x=>x.id===id);if(r)r.gekauft=checked;render();}
async function resetGekauft(){if(!confirm('Alle Haken zurücksetzen?'))return;await sb.from('haushaltshilfe_einkauf').update({gekauft:false}).gt('created_at','1900-01-01');EINK.forEach(x=>x.gekauft=false);render();}
async function clearGekauft(){if(!confirm('Alle gekauften Positionen entfernen?'))return;await sb.from('haushaltshilfe_einkauf').delete().eq('gekauft',true);EINK=EINK.filter(x=>!x.gekauft);render();}
async function addRow(){
  if(TAB==='auf'){const r=await sb.from('haushaltshilfe_aufgaben').insert({titel:'Neue Aufgabe',art:'Aufgabe',status:'Offen',prioritaet:'Mittel',zustaendig:'Haushaltshilfe',pos:AUF.length}).select();if(r.error)return toast(r.error.message);AUF.unshift(r.data[0]);}
  else if(TAB==='eink'){const r=await sb.from('haushaltshilfe_einkauf').insert({artikel:'Neuer Wunsch',quelle:'Wunsch',kategorie:'Sonstiges',pos:EINK.length}).select();if(r.error)return toast(r.error.message);EINK.unshift(r.data[0]);}
  else if(TAB==='kat'){const r=await sb.from('haushaltshilfe_katalog').insert({produkt:'Neues Produkt',kategorie:'Sonstiges',einheit:'Stück',pos:KAT.length}).select();if(r.error)return toast(r.error.message);KAT.unshift(r.data[0]);}
  else{const r=await sb.from('haushaltshilfe_wissen').insert({thema:'Neues Thema',kategorie:'Sonstiges',pos:WIS.length}).select();if(r.error)return toast(r.error.message);WIS.unshift(r.data[0]);}
  render();toast('Angelegt');}
async function del(id){if(!confirm('Eintrag löschen?'))return;const res=await sb.from(TBL[TAB]).delete().eq('id',id);if(res.error)return toast(res.error.message);
  const t=TAB;if(t==='auf')AUF=AUF.filter(x=>x.id!==id);else if(t==='eink')EINK=EINK.filter(x=>x.id!==id);else if(t==='kat')KAT=KAT.filter(x=>x.id!==id);else WIS=WIS.filter(x=>x.id!==id);render();}

function opt(list,sel){return list.map(v=>'<option'+(v===sel?' selected':'')+'>'+esc(v)+'</option>').join('');}
function cardAuf(r){return `<div class="card">
  <div class="top">
    <input class="thema" value="${esc(r.titel)}" onchange="save('${r.id}','titel',this.value)">
    <select class="kat" onchange="save('${r.id}','art',this.value)" title="Art">${opt(ART,r.art)}</select>
    <select class="st st-${(r.status||'').replace(/\\s/g,'')}" onchange="save('${r.id}','status',this.value)">${opt(STATI,r.status)}</select>
    <select class="pr" onchange="save('${r.id}','prioritaet',this.value)">${opt(PRIO,r.prioritaet)}</select>
    <select class="zu" onchange="save('${r.id}','zustaendig',this.value)">${opt(ZUST,r.zustaendig)}</select>
    <button class="abtn" onclick="del('${r.id}')">✕</button>
  </div>
  <div class="lbl">Frage / Aufgabe (von Eric)</div>
  <textarea oninput="grow(this)" onchange="save('${r.id}','frage',this.value)" placeholder="Was ist zu klären / zu tun?">${esc(r.frage)}</textarea>
  <div class="lbl">Antwort / Rückmeldung (Haushaltshilfe)</div>
  <textarea oninput="grow(this)" onchange="save('${r.id}','antwort',this.value)" placeholder="Antwort, Rückfrage oder Erledigt-Vermerk…">${esc(r.antwort)}</textarea>
</div>`;}
function cardWis(r){return `<div class="card">
  <div class="top">
    <input class="thema" value="${esc(r.thema)}" onchange="save('${r.id}','thema',this.value)">
    <input class="kat" list="katDL" value="${esc(r.kategorie)}" style="width:150px;font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:20px;background:var(--surf2)" onchange="save('${r.id}','kategorie',this.value)">
    <button class="abtn" onclick="del('${r.id}')">✕</button>
  </div>
  <textarea oninput="grow(this)" onchange="save('${r.id}','inhalt',this.value)" placeholder="Anleitung / Ablauf / Hinweise …">${esc(r.inhalt)}</textarea>
</div>`;}

/* ---- Standard-Sortiment / Katalog ---- */
function lineKat(r){
  const i='margin:0;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--surf2)';
  return `<div class="card" style="padding:10px 12px;margin-bottom:8px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input value="${esc(r.produkt)}" placeholder="Produkt" style="flex:2;min-width:150px;font-weight:600;${i}" onchange="save('${r.id}','produkt',this.value)">
      <input value="${esc(r.firma)}" placeholder="Firma / Marke" style="flex:1;min-width:110px;${i}" onchange="save('${r.id}','firma',this.value)">
      <input list="geschDL" value="${esc(r.geschaeft)}" placeholder="Geschäft" style="flex:1;min-width:110px;${i}" onchange="save('${r.id}','geschaeft',this.value)">
      <select style="${i};min-width:150px" onchange="save('${r.id}','kategorie',this.value)">${EKAT.map(k=>'<option'+(k===r.kategorie?' selected':'')+'>'+esc(k)+'</option>').join('')}</select>
      <input value="${esc(r.einheit)}" placeholder="Einheit" style="width:80px;${i}" onchange="save('${r.id}','einheit',this.value)">
      <span style="flex:1"></span>
      <input id="q_${r.id}" type="number" min="1" value="1" style="width:64px;text-align:right;${i}">
      <button class="btn btn-accent" style="padding:6px 12px" onclick="addToList('${r.id}')">+ Liste</button>
      <button class="abtn" onclick="del('${r.id}')">✕</button>
    </div>
  </div>`;
}
async function addToList(katId){
  const k=KAT.find(x=>x.id===katId);if(!k)return;
  const qEl=document.getElementById('q_'+katId);const q=qEl?(qEl.value||'1'):'1';
  const menge=(q+' '+(k.einheit||'')).trim();
  const ex=EINK.find(x=>!x.gekauft&&(x.artikel||'').toLowerCase()===(k.produkt||'').toLowerCase());
  if(ex){await sb.from('haushaltshilfe_einkauf').update({menge:menge,firma:k.firma||null,einkaufsort:k.geschaeft||null,kategorie:k.kategorie||null}).eq('id',ex.id);ex.menge=menge;ex.firma=k.firma;ex.einkaufsort=k.geschaeft;}
  else{const r=await sb.from('haushaltshilfe_einkauf').insert({artikel:k.produkt,firma:k.firma||null,menge:menge,kategorie:k.kategorie||'Sonstiges',einkaufsort:k.geschaeft||null,quelle:'Standard',pos:EINK.length}).select();if(r.error){toast(r.error.message);return;}EINK.push(r.data[0]);}
  toast('„'+(k.produkt||'')+'" zur Einkaufsliste ✓');
}
async function lookupBarcode(ean){
  ean=(ean||'').trim();if(!ean)return null;
  try{const r=await fetch('https://world.openfoodfacts.org/api/v0/product/'+encodeURIComponent(ean)+'.json');const j=await r.json();
    if(j&&j.status===1&&j.product){const p=j.product;return {produkt:p.product_name||p.generic_name||('EAN '+ean),firma:((p.brands||'').split(',')[0]||'').trim(),einheit:p.quantity||'Stück'};}
  }catch(e){}
  return null;
}
async function doLookup(ean){
  ean=(ean||'').trim();if(!ean){toast('Barcode eingeben');return;}
  toast('Suche Produkt …');
  const d=await lookupBarcode(ean);
  const rec=d?{produkt:d.produkt,firma:d.firma,einheit:d.einheit,kategorie:'Sonstiges',pos:KAT.length}:{produkt:'EAN '+ean,einheit:'Stück',kategorie:'Sonstiges',pos:KAT.length};
  const r=await sb.from('haushaltshilfe_katalog').insert(rec).select();if(r.error){toast(r.error.message);return;}
  KAT.unshift(r.data[0]);const bc=document.getElementById('bcInput');if(bc)bc.value='';render();
  toast(d?('„'+d.produkt+'" gespeichert ✓'):('Kein Online-Treffer – Produkt manuell ergänzen'));
}
let scanStream=null,scanRAF=null;
async function startScan(){
  if(!('BarcodeDetector' in window)){toast('Scanner in diesem Browser nicht verfügbar – EAN manuell eingeben');return;}
  try{
    const det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=document.getElementById('scanVid');v.srcObject=scanStream;await v.play();
    document.getElementById('scanBox').style.display='flex';
    const tick=async()=>{try{const codes=await det.detect(v);if(codes&&codes.length){const ean=codes[0].rawValue;stopScan();const bc=document.getElementById('bcInput');if(bc)bc.value=ean;doLookup(ean);return;}}catch(e){}scanRAF=requestAnimationFrame(tick);};
    tick();
  }catch(e){toast('Kamera nicht verfügbar');stopScan();}
}
function stopScan(){if(scanRAF)cancelAnimationFrame(scanRAF);scanRAF=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}const b=document.getElementById('scanBox');if(b)b.style.display='none';}
function lineEink(r){
  const src=r.quelle==='Essensplaner'?'<span class="pill" style="background:#eef4fb;color:#185fa5;border-color:#cfe0f2">Essensplaner'+(r.woche?' · '+esc(r.woche):'')+'</span>':'<span class="pill" style="background:#eef8f2;color:#1f7a4d;border-color:#bfe0cd">Wunsch</span>';
  return `<div class="card" style="padding:8px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <input type="checkbox" ${r.gekauft?'checked':''} onchange="toggleGekauft('${r.id}',this.checked)" style="width:17px;height:17px">
    <input value="${esc(r.artikel)}" style="flex:1;min-width:140px;font:inherit;font-size:14px;border:1px solid transparent;border-radius:6px;padding:4px 6px;background:transparent${r.gekauft?';text-decoration:line-through;color:var(--muted)':''}" onchange="save('${r.id}','artikel',this.value)">
    <input value="${esc(r.menge)}" placeholder="Menge" style="width:80px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surf2)" onchange="save('${r.id}','menge',this.value)">
    <input value="${esc(r.firma)}" placeholder="Firma" style="width:100px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surf2)" onchange="save('${r.id}','firma',this.value)">
    <input value="${esc(r.einkaufsort)}" placeholder="Geschäft" style="width:110px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surf2)" onchange="save('${r.id}','einkaufsort',this.value)">
    ${src}
    <button class="abtn" onclick="del('${r.id}')">✕</button>
  </div>`;
}
function render(){
  $('n_auf').textContent=AUF.length;$('n_wis').textContent=WIS.length;$('n_eink').textContent=EINK.filter(x=>!x.gekauft).length;$('n_kat').textContent=KAT.length;
  $('intro').textContent=INTRO[TAB];
  $('katDL').innerHTML=KAT.map(k=>'<option value="'+esc(k)+'">').join('');
  if(TAB==='auf'){
    $('bar').innerHTML='<input type="text" id="q" placeholder="🔍 Suchen…" oninput="render()"><select id="fS" onchange="render()"><option value="">Alle Status</option>'+STATI.map(s=>'<option'+(fs()===s?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select><span style="font-size:12px;color:var(--muted)">'+AUF.filter(a=>a.status==='Offen').length+' offen</span>';
    const q=(($('q')&&$('q').value)||'').toLowerCase(), f=fs();
    const list=AUF.filter(r=>(!f||r.status===f)&&(!q||((r.titel||'')+' '+(r.frage||'')+' '+(r.antwort||'')).toLowerCase().includes(q)));
    $('list').innerHTML=list.map(cardAuf).join('')||'<div class="empty">Keine Aufgaben. Mit „+ Neu" die erste anlegen.</div>';
  } else if(TAB==='eink'){
    const offen=EINK.filter(x=>!x.gekauft).length, gek=EINK.filter(x=>x.gekauft).length;
    $('bar').innerHTML='<input type="text" id="q" placeholder="🔍 Suchen…" oninput="render()"><label style="font-size:12.5px;color:var(--dim)"><input type="checkbox" id="hideG" '+(_hideG?'checked':'')+' onchange="_hideG=this.checked;render()"> gekaufte ausblenden</label><button class="btn" onclick="resetGekauft()">Haken zurücksetzen</button><button class="btn" onclick="clearGekauft()">Gekaufte entfernen</button><span style="font-size:12px;color:var(--muted)">'+offen+' offen · '+gek+' gekauft</span>';
    const q=(($('q')&&$('q').value)||'').toLowerCase();
    let list=EINK.filter(r=>(!_hideG||!r.gekauft)&&(!q||((r.artikel||'')+' '+(r.einkaufsort||'')).toLowerCase().includes(q)));
    const byCat={};list.forEach(r=>{const c=r.kategorie||'Sonstiges';(byCat[c]=byCat[c]||[]).push(r);});
    const cats=EKAT.filter(c=>byCat[c]).concat(Object.keys(byCat).filter(c=>!EKAT.includes(c)));
