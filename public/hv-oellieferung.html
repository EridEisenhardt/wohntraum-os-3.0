<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hausverwaltung · Öllieferung – Wohntraum OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--surf:#fff;--surf2:#f1f3f6;--line:#e6e8ec;--text:#1c2024;--muted:#6b7280;--accent:#185fa5;--accent2:#2f5d8a;--green:#1f7a4d;--red:#c0392b;--warn:#b7791f;--r:8px;--rl:12px}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.hdr{background:var(--surf);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.hdr-title{font-size:18px;font-weight:700}.hdr-sub{font-size:12px;color:var(--muted)}
.main{padding:18px 24px 60px}
.inp{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--text);min-width:0;width:100%}
textarea.inp{resize:vertical}
.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.zw{background:var(--surf);color:var(--text);border:1px solid var(--line)}.btn.kl{padding:5px 10px;font-size:12px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.kpi{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:150px}.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--muted)}
.hinweis{background:#fdf3e1;border:1px solid #f0d9a8;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.hinweis.rot{background:#fbeaea;border-color:#efc4c0}
details.obj{background:var(--surf);border:1px solid var(--line);border-radius:var(--rl);margin-bottom:10px;overflow:hidden}
details.obj>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}details.obj>summary::-webkit-details-marker{display:none}
details.obj>summary::before{content:'+';width:14px;color:var(--muted);font-weight:700}details.obj[open]>summary::before{content:'−'}
.obj .kz{font-weight:800;font-size:15px}.obj .adr{color:var(--muted);font-size:13px}.obj .rechts{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--surf2);color:var(--muted)}
.pill.rot{background:#fbeaea;color:var(--red)}.pill.gelb{background:#fdf3e1;color:var(--warn)}.pill.gruen{background:#e6f4ec;color:var(--green)}
.inner{padding:0 16px 16px}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2);font-weight:800;margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.grid label,.fl{display:flex;flex-direction:column;gap:4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.prog div{background:var(--surf2);border-radius:10px;padding:10px 12px}.prog b{display:block;font-size:17px}.prog span{font-size:12px;color:var(--muted)}
.balken{height:10px;background:var(--surf2);border-radius:6px;overflow:hidden;margin:10px 0 2px}.balken i{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}td.n,th.n{text-align:right;white-space:nowrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.mut{color:var(--muted);font-size:12px}.warn{color:var(--warn)}.ok{color:var(--green)}.neg{color:var(--red)}
.lnk{color:var(--accent2);cursor:pointer;background:none;border:0;font:inherit;font-size:12px;padding:0;text-decoration:underline}
.empty{padding:30px;text-align:center;color:var(--muted)}
.ovl{position:fixed;inset:0;background:#0d0e1a99;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--surf);border-radius:var(--rl);padding:20px;width:min(640px,100%);max-height:92vh;overflow:auto}.dlg h3{margin-bottom:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c2024;color:#fff;border-radius:var(--r);padding:10px 20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:60}.toast.show{opacity:1}
@media (max-width:700px){.main{padding:12px}.hdr{padding:12px}}
</style></head><body>
<div class="hdr"><div><div class="hdr-title">Öllieferung</div><div class="hdr-sub">Ölstand je Objekt mit Foto · Lieferungen und Rechnungen · Bestellung per Mail · Vorauskalkulation mit Meldung, wann bestellt werden muss</div></div>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center"><input class="inp" id="neuObj" list="dlObj" placeholder="Objekt hinzufügen, z. B. S58" style="width:240px" onchange="tankNeu(this.value);this.value=''"></div></div>
<div class="main" id="main"><div class="empty">Lade Öltanks …</div></div>
<div class="toast" id="toast"></div>
<datalist id="dlObj"></datalist>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const heute=()=>new Date().toISOString().slice(0,10);
const dfmt=d=>{const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'.'+m[2]+'.'+m[1]:'–';};
const dIso=v=>{v=String(v||'').trim();let m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);if(!m)return '';const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');};
const zahl=v=>{v=String(v==null?'':v).trim().replace(/\s|€|l$/gi,'');if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');return v===''||isNaN(Number(v))?null:Number(v);};
const lit=n=>n==null||isNaN(n)?'–':Math.round(n).toLocaleString('de-DE')+' l';
const eur=n=>n==null||isNaN(n)?'–':Number(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const nat=(a,b)=>String(a||'').localeCompare(String(b||''),'de',{numeric:true,sensitivity:'base'});
const rnd=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const addT=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
function toast(m,ms){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),ms||2600);}
const NUTZER={'ramona@andersmacher.info':'Ramona','juergen@andersmacher.info':'Jürgen','eric@andersmacher.info':'Eric'};
const GES={WT:{name:'Wohn(T)raum Rheinhessen GmbH',strasse:'Dalheimer Straße 70',ort:'55278 Dexheim'},EE:{name:'Eric Eisenhardt',strasse:'Dalheimer Straße 70',ort:'55278 Dexheim'}};
const MAIL_SIG='Mit freundlichen Grüßen\n\nWohn(T)raum Rheinhessen GmbH\nbewusst sozial engagiert\nE-Mail: hausverwaltung@andersmacher.info\nTelefon: 06133-9382937\nDalheimer Str. 70, 55278 Dexheim\nHRB 45997, Amtsgericht Mainz\nGeschäftsführer: Eric Eisenhardt';
/* Verteilung des Jahresverbrauchs auf die Monate (Gradtagszahlen nach VDI 2067, Promille) */
const MONAT=[170,150,130,80,40,13.3,13.3,13.3,30,80,120,160];
const tagAnteil=d=>{const x=new Date(d+'T12:00:00'),m=x.getMonth(),t=new Date(x.getFullYear(),m+1,0).getDate();return MONAT[m]/1000/t;};
function anteil(von,bis){let s=0,d=von;while(d<bis){s+=tagAnteil(d);d=addT(d,1);}return s;}

let OBJ=[],T={},ICH='',OFFEN={},ENTW={};

/* ---------- Laden und Speichern ---------- */
async function laden(){
  const [o,d]=await Promise.all([sb.from('obj_objekte').select('id,kz,strasse,plz,ort,status,gesellschaft'),sb.from('os_docs').select('pfad,data').eq('app','oc').like('pfad','oel/%')]);
  if(o.error||d.error){$('main').innerHTML='<div class="empty">Daten konnten nicht geladen werden: '+esc((o.error||d.error).message)+'</div>';return;}
  OBJ=(o.data||[]).filter(x=>x.status!=='Verkauft').sort((a,b)=>nat(a.kz,b.kz)); T={};
  for(const r of d.data||[]){ if(r.data&&r.data.obj) T[r.data.obj]=r.data; }
  $('dlObj').innerHTML=OBJ.filter(x=>!T[x.id]).map(x=>'<option value="'+esc(x.kz+' – '+(x.strasse||''))+'">').join('');
  render(); }
async function speichern(t,msg){ t.geaendert=new Date().toISOString(); t.geaendertVon=ICH;
  const {error}=await sb.from('os_docs').upsert({app:'oc',pfad:'oel/'+t.obj,data:t,updated_at:new Date().toISOString()},{onConflict:'app,pfad'});
  if(error){toast('Nicht gespeichert: '+error.message,5000);return false;} T[t.obj]=t; if(msg)toast(msg); render(); return true; }
const objVon=id=>OBJ.find(o=>String(o.id)===String(id))||{};
const objAdr=o=>[o.strasse,[o.plz,o.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ');
async function tankNeu(v){ v=String(v||'').trim(); if(!v)return; const kz=v.split(' – ')[0].trim().toLowerCase(); const o=OBJ.find(x=>String(x.kz).toLowerCase()===kz);
  if(!o){toast('Objekt nicht gefunden. Bitte aus der Liste wählen.');return;} if(T[o.id]){OFFEN[o.id]=true;render();return;}
  const t={obj:o.id,kz:o.kz,volumen:null,mindest:null,vorlaufWochen:4,jahresverbrauch:null,lieferadresse:objAdr(o),zufahrt:'',lieferant:{name:'',mail:''},peil:'',ablesungen:[],lieferungen:[],bestellungen:[],angelegt:heute(),angelegtVon:ICH};
  OFFEN[o.id]=true; if(await speichern(t,'Öltank für '+o.kz+' angelegt. Bitte Tankvolumen und Mindestbestand eintragen.')) $('dlObj').innerHTML=OBJ.filter(x=>!T[x.id]).map(x=>'<option value="'+esc(x.kz+' – '+(x.strasse||''))+'">').join(''); }


/* ---------- Vorauskalkulation ---------- */
function prognose(t){
  const A=(t.ablesungen||[]).filter(a=>a.l!=null&&a.d).slice().sort((a,b)=>a.d.localeCompare(b.d)), Lf=(t.lieferungen||[]).filter(x=>x.l!=null&&x.d);
  const lzw=(v,b)=>Lf.filter(x=>x.d>v&&x.d<=b).reduce((s,x)=>s+Number(x.l),0);
  let ver=0,gew=0; const ab=addT(heute(),-730);
  for(let i=1;i<A.length;i++){ const a=A[i-1],b=A[i]; if(b.d<ab) continue; const c=Number(a.l)+lzw(a.d,b.d)-Number(b.l), w=anteil(a.d,b.d); if(c>=0&&w>0){ ver+=c; gew+=w; } }
  let jahr=null,quelle='';
  if(gew>=0.15){ jahr=ver/gew; quelle='aus den Ablesungen berechnet'; } else if(t.jahresverbrauch){ jahr=Number(t.jahresverbrauch); quelle='geschätzt (Einstellung)'; } else if(gew>0){ jahr=ver/gew; quelle='aus wenigen Ablesungen, noch ungenau'; }
  const R={jahr,quelle,letzte:A[A.length-1]||null};
  if(!R.letzte) return Object.assign(R,{status:'leer',text:'Noch kein Ölstand eingetragen'});
  const h=heute(); let stand=Number(R.letzte.l)+lzw(R.letzte.d,h); if(jahr) stand-=jahr*anteil(R.letzte.d,h); stand=Math.max(0,stand); R.stand=stand;
  const vol=Number(t.volumen)||null, min=Number(t.mindest)||0, vl=(Number(t.vorlaufWochen)||0)*7;
  R.menge=vol?Math.max(0,Math.floor((vol*0.95-stand)/100)*100):null;
  if(!jahr) return Object.assign(R,{status:stand<=min&&min?'rot':'leer',text:stand<=min&&min?'Mindestbestand erreicht':'Verbrauch noch unbekannt'});
  let s=stand,d=h,dMin=stand<=min?h:null,dLeer=null; for(let i=0;i<1095&&!(dMin&&dLeer);i++){ s-=jahr*tagAnteil(d); d=addT(d,1); if(!dMin&&s<=min) dMin=d; if(!dLeer&&s<=0) dLeer=d; }
  R.dMin=dMin; R.dLeer=dLeer; R.bestellenAb=dMin?addT(dMin,-vl):null;
  if(min&&stand<=min){R.status='rot';R.text='Mindestbestand erreicht, jetzt bestellen';}
  else if(R.bestellenAb&&R.bestellenAb<=h){R.status='rot';R.text='Jetzt bestellen';}
  else if(R.bestellenAb&&R.bestellenAb<=addT(h,14)){R.status='gelb';R.text='Bald bestellen, ab '+dfmt(R.bestellenAb);}
  else {R.status='gruen';R.text=dMin?'Ausreichend, bestellen ab ca. '+dfmt(R.bestellenAb):'Ausreichend';}
  const off=(t.bestellungen||[]).filter(b=>!b.geliefert&&b.am>=addT(h,-60)); if(off.length&&R.status!=='gruen'){R.status='gelb';R.text='Bestellt am '+dfmt(off[off.length-1].am)+', Lieferung offen';}
  return R; }

/* ---------- Anzeige ---------- */
function render(){
  const L=Object.values(T).sort((a,b)=>nat(objVon(a.obj).kz||a.kz,objVon(b.obj).kz||b.kz));
  if(!L.length){$('main').innerHTML='<div class="empty">Noch kein Öltank angelegt. Oben rechts ein Objekt hinzufügen.</div>';return;}
  const P={}; L.forEach(t=>P[t.obj]=prognose(t));
  const rot=L.filter(t=>P[t.obj].status==='rot'), gelb=L.filter(t=>P[t.obj].status==='gelb');
  let h='';
  if(rot.length) h+='<div class="hinweis rot"><b>Öl bestellen:</b> '+rot.map(t=>esc((objVon(t.obj).kz||t.kz)+' ('+P[t.obj].text+')')).join(', ')+'</div>';
  if(gelb.length) h+='<div class="hinweis"><b>Demnächst:</b> '+gelb.map(t=>esc((objVon(t.obj).kz||t.kz)+' ('+P[t.obj].text+')')).join(', ')+'</div>';
  const jahr=new Date().getFullYear()+'', lj=L.flatMap(t=>(t.lieferungen||[]).filter(x=>String(x.d).startsWith(jahr)));
  h+='<div class="kpis"><div class="kpi"><b>'+L.length+'</b><span>Öltanks</span></div><div class="kpi"><b class="'+(rot.length?'neg':'')+'">'+rot.length+'</b><span>jetzt bestellen</span></div><div class="kpi"><b class="'+(gelb.length?'warn':'')+'">'+gelb.length+'</b><span>in den nächsten 14 Tagen</span></div><div class="kpi"><b>'+lit(lj.reduce((s,x)=>s+Number(x.l||0),0))+'</b><span>geliefert '+jahr+'</span></div><div class="kpi"><b>'+eur(lj.reduce((s,x)=>s+Number(x.betrag||0),0))+'</b><span>Kosten '+jahr+'</span></div></div>';
  for(const t of L){ const o=objVon(t.obj), p=P[t.obj], auf=!!OFFEN[t.obj];
    h+='<details class="obj"'+(auf?' open':'')+' ontoggle="OFFEN[\''+t.obj+'\']=this.open;if(this.open&&!this.querySelector(\'.inner\'))render()"><summary><span class="kz">'+esc(o.kz||t.kz)+'</span><span class="adr">'+esc(objAdr(o))+'</span><span class="rechts">'+(p.stand!=null?'<span>ca. '+lit(p.stand)+(t.volumen?' von '+lit(t.volumen):'')+'</span>':'')+'<span class="pill '+(p.status==='leer'?'':p.status)+'">'+esc(p.text)+'</span></span></summary>';
    if(auf) h+='<div class="inner">'+tankHtml(t,o,p)+'</div>';
    h+='</details>'; }
  $('main').innerHTML=h; }
function tankHtml(t,o,p){ const id=t.obj, E=ENTW[id]=ENTW[id]||{}; let h='';
  /* Vorauskalkulation */
  h+='<div class="sec">Vorauskalkulation</div>';
  if(!t.volumen||t.mindest==null) h+='<div class="hinweis">Bitte unten bei den Einstellungen Tankvolumen und Mindestbestand eintragen.</div>';
  if(t.volumen&&p.stand!=null) h+='<div class="balken"><i style="width:'+Math.min(100,Math.round(p.stand/t.volumen*100))+'%;background:'+(p.status==='rot'?'var(--red)':p.status==='gelb'?'var(--warn)':'var(--accent)')+'"></i></div><div class="mut">'+Math.round(p.stand/t.volumen*100)+' % gefüllt (geschätzt)</div>';
  h+='<div class="prog" style="margin-top:10px">'
    +'<div><b>'+lit(p.stand)+'</b><span>Stand heute, geschätzt'+(p.letzte?' (abgelesen '+dfmt(p.letzte.d)+': '+lit(p.letzte.l)+')':'')+'</span></div>'
    +'<div><b>'+(p.jahr?lit(p.jahr):'–')+'</b><span>Verbrauch pro Jahr'+(p.quelle?', '+esc(p.quelle):'')+'</span></div>'
    +'<div><b>'+(p.dMin?dfmt(p.dMin):'–')+'</b><span>Mindestbestand ('+lit(t.mindest)+') erreicht ca.</span></div>'
    +'<div><b class="'+(p.status==='rot'?'neg':p.status==='gelb'?'warn':'')+'">'+(p.bestellenAb?dfmt(p.bestellenAb):'–')+'</b><span>bestellen spätestens ('+(Number(t.vorlaufWochen)||0)+' Wochen Vorlauf)</span></div>'
    +'<div><b>'+(p.dLeer?dfmt(p.dLeer):'–')+'</b><span>Tank leer ca.</span></div>'
    +'<div><b>'+(p.menge!=null?lit(p.menge):'–')+'</b><span>Vorschlag Bestellmenge (auf 95 % füllen)</span></div></div>';
  h+='<div class="mut" style="margin-top:6px">Die Kalkulation verteilt den Jahresverbrauch nach der Heizperiode auf die Monate (im Winter mehr, im Sommer wenig) und rechnet ab der letzten Ablesung weiter. Je mehr Ölstände eingetragen werden, desto genauer wird sie.</div>';
  /* Ölstand */
  h+='<div class="sec">Ölstand eintragen</div><div class="grid">'
    +'<label>Datum<input class="inp" id="ad-'+id+'" value="'+esc(E.ad||dfmt(heute()))+'" placeholder="TT.MM.JJJJ" oninput="ENTW[\''+id+'\'].ad=this.value"></label>'
    +'<label>Liter<input class="inp" id="al-'+id+'" inputmode="decimal" value="'+esc(E.al||'')+'" placeholder="z. B. 2.400" oninput="ENTW[\''+id+'\'].al=this.value"></label>'
    +'<label>Notiz<input class="inp" id="an-'+id+'" value="'+esc(E.an||'')+'" oninput="ENTW[\''+id+'\'].an=this.value"></label></div>'
    +'<div class="acts"><label class="btn zw" style="cursor:pointer">'+(E.foto?'Foto ändern':'Foto hochladen')+'<input type="file" accept="image/*" capture="environment" hidden onchange="fotoWahl(\''+id+'\',this)"></label>'+(E.foto?'<span class="mut">'+esc(E.foto.name||'Foto')+' <button class="lnk" onclick="ENTW[\''+id+'\'].foto=null;render()">entfernen</button></span>':'')+'<button class="btn" id="as-'+id+'" onclick="ablesungSpeichern(\''+id+'\')">Ölstand speichern</button></div>';
  const A=(t.ablesungen||[]).slice().sort((a,b)=>b.d.localeCompare(a.d));
  if(A.length) h+='<table><thead><tr><th>Datum</th><th class="n">Liter</th><th>Foto</th><th>Erfasst von</th><th>Notiz</th><th></th></tr></thead><tbody>'+A.map(a=>'<tr><td>'+dfmt(a.d)+'</td><td class="n">'+lit(a.l)+'</td><td>'+(a.foto?'<button class="lnk" onclick="dateiOeffnen(\''+esc(a.foto)+'\')">Foto ansehen</button>':'<span class="mut">kein Foto</span>')+'</td><td>'+esc(a.von||'')+'</td><td>'+esc(a.notiz||'')+'</td><td class="n"><button class="lnk" onclick="eintragWeg(\''+id+'\',\'ablesungen\',\''+a.id+'\')">entfernen</button></td></tr>').join('')+'</tbody></table>';
  /* Lieferungen und Rechnungen */
  h+='<div class="sec">Lieferungen und Rechnungen</div>'
    +'<div class="acts" style="margin-top:0"><label class="btn zw kl" style="cursor:pointer">Rechnung hochladen<input type="file" accept="application/pdf,image/*" hidden onchange="rechnungDatei(\''+id+'\',this)"></label><button class="btn zw kl" onclick="lieferungForm(\''+id+'\',null)">Lieferung ohne Rechnung eintragen</button>'+(E.lstat?'<span class="mut">'+esc(E.lstat)+'</span>':'')+'</div>';
  if(E.lf) h+=lieferFormHtml(id,E.lf);
  const Lf=(t.lieferungen||[]).slice().sort((a,b)=>b.d.localeCompare(a.d));
  if(Lf.length) h+='<table><thead><tr><th>Lieferdatum</th><th>Lieferant</th><th class="n">Liter</th><th class="n">Betrag</th><th class="n">Preis je 100 l</th><th>Rechnung</th><th></th></tr></thead><tbody>'+Lf.map(x=>'<tr><td>'+dfmt(x.d)+'</td><td>'+esc(x.lieferant||'')+(x.notiz?'<div class="mut">'+esc(x.notiz)+'</div>':'')+'</td><td class="n">'+lit(x.l)+'</td><td class="n">'+eur(x.betrag)+'</td><td class="n">'+(x.betrag&&x.l?eur(x.betrag/x.l*100):'–')+'</td><td>'+(x.datei&&x.datei.pfad?'<button class="lnk" onclick="dateiOeffnen(\''+esc(x.datei.pfad)+'\')">'+esc(x.datei.name||'öffnen')+'</button>':'<span class="mut">keine</span>')+'</td><td class="n"><button class="lnk" onclick="eintragWeg(\''+id+'\',\'lieferungen\',\''+x.id+'\')">entfernen</button></td></tr>').join('')+'</tbody></table>';
  /* Bestellung */
  h+='<div class="sec">Bestellung per Mail</div>';
  if(E.bs) h+=bestellFormHtml(t,o,id,E.bs); else h+='<div class="acts" style="margin-top:0"><button class="btn" onclick="bestellungStart(\''+id+'\')">Bestellung vorbereiten</button><span class="mut">'+(t.lieferant&&t.lieferant.mail?'An '+esc(t.lieferant.name||t.lieferant.mail)+' ('+esc(t.lieferant.mail)+')':'Noch kein Lieferant hinterlegt, bitte unten bei den Einstellungen eintragen')+'</span></div>';
  const B=(t.bestellungen||[]).slice().sort((a,b)=>b.am.localeCompare(a.am));
  if(B.length) h+='<table><thead><tr><th>Bestellt am</th><th>An</th><th class="n">Menge</th><th>Wunschtermin</th><th>Von</th><th>Stand</th></tr></thead><tbody>'+B.map(b=>'<tr><td>'+dfmt(b.am)+'</td><td>'+esc(b.an||'')+'</td><td class="n">'+lit(b.menge)+'</td><td>'+esc(b.termin||'')+'</td><td>'+esc(b.von||'')+'</td><td>'+(b.geliefert?'<span class="ok">geliefert</span>':'<span class="warn">offen</span> <button class="lnk" onclick="bestGeliefert(\''+id+'\',\''+b.id+'\')">als geliefert markieren</button>')+'</td></tr>').join('')+'</tbody></table>';
  /* Einstellungen */
  h+='<div class="sec">Einstellungen</div><div class="grid">'
    +feld(id,'volumen','Tankvolumen (Liter)',t.volumen,'z. B. 5.000')
    +feld(id,'mindest','Mindestbestand (Liter)',t.mindest,'z. B. 800')
    +feld(id,'vorlaufWochen','Vorlauf für Bestellung (Wochen)',t.vorlaufWochen,'z. B. 4')
    +feld(id,'jahresverbrauch','Jahresverbrauch geschätzt (Liter)',t.jahresverbrauch,'nur bis genug Ablesungen da sind')
    +feld(id,'lieferant.name','Lieferant',t.lieferant&&t.lieferant.name,'Name des Öllieferanten')
    +feld(id,'lieferant.mail','E-Mail Lieferant',t.lieferant&&t.lieferant.mail,'bestellung@…')
    +feld(id,'lieferadresse','Lieferadresse',t.lieferadresse,objAdr(o))
    +feld(id,'zufahrt','Zufahrt / Ansprechpartner vor Ort',t.zufahrt,'z. B. Tank im Keller, Schlauchlänge 30 m')
    +'</div>';
  return h; }
function feld(id,k,lab,v,ph){ return '<label>'+esc(lab)+'<input class="inp" value="'+esc(v==null?'':(typeof v==='number'?String(v).replace('.',','):v))+'" placeholder="'+esc(ph||'')+'" onchange="setzen(\''+id+'\',\''+k+'\',this.value)"></label>'; }
async function setzen(id,k,v){ const t=JSON.parse(JSON.stringify(T[id])); v=String(v||'').trim();
  const num=['volumen','mindest','vorlaufWochen','jahresverbrauch'].includes(k);
  if(num){ const n=zahl(v); if(v&&n==null){toast('Bitte eine Zahl eintragen.');render();return;} t[k]=n; }
  else if(k.startsWith('lieferant.')){ t.lieferant=Object.assign({},t.lieferant||{}); t.lieferant[k.split('.')[1]]=v; }
  else t[k]=v;
  await speichern(t,'Gespeichert.'); }
function fotoWahl(id,inp){ const f=inp.files&&inp.files[0]; if(!f)return; ENTW[id]=ENTW[id]||{}; ENTW[id].ad=$('ad-'+id).value; ENTW[id].al=$('al-'+id).value; ENTW[id].an=$('an-'+id).value; ENTW[id].foto=f; render(); }
function bildKlein(file,max){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const f=Math.min(1,max/Math.max(w,h));w=Math.round(w*f);h=Math.round(h*f);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>b?res(b):rej(new Error('Bild konnte nicht gelesen werden')),'image/jpeg',.85);URL.revokeObjectURL(img.src);};img.onerror=()=>rej(new Error('Bild konnte nicht gelesen werden'));img.src=URL.createObjectURL(file);});}
async function ablesungSpeichern(id){ const t=JSON.parse(JSON.stringify(T[id])), E=ENTW[id]||{}, d=dIso($('ad-'+id).value), l=zahl($('al-'+id).value);
  if(!d){toast('Bitte ein gültiges Datum eintragen.');return;}
  if(l==null){toast('Bitte die Liter eintragen.');return;}
  if(t.volumen&&l>t.volumen*1.02){toast('Mehr Liter als das Tankvolumen, bitte prüfen.');return;}
  const btn=$('as-'+id); if(btn){btn.disabled=true;btn.textContent='Wird gespeichert …';}
  let foto=null;
  if(E.foto){ try{ const blob=await bildKlein(E.foto,1600), pf='oel/'+id+'/stand_'+d+'_'+rnd()+'.jpg', up=await sb.storage.from('objekt-zaehler').upload(pf,blob,{contentType:'image/jpeg'}); if(up.error) throw new Error(up.error.message); foto=pf; }
    catch(e){ if(btn){btn.disabled=false;btn.textContent='Ölstand speichern';} toast('Foto konnte nicht hochgeladen werden: '+(e.message||e),5000); return; } }
  t.ablesungen=(t.ablesungen||[]).concat([{id:rnd(),d,l:Math.round(l),foto,notiz:String($('an-'+id).value||'').trim(),von:ICH,am:new Date().toISOString()}]);
  ENTW[id]={}; await speichern(t,'Ölstand gespeichert.'); }
async function eintragWeg(id,feldname,eid){ if(!confirm('Diesen Eintrag entfernen?'))return; const t=JSON.parse(JSON.stringify(T[id])); t[feldname]=(t[feldname]||[]).filter(x=>x.id!==eid); await speichern(t,'Entfernt.'); }

/* ---------- Lieferungen und Rechnungen ---------- */
async function tok(){const {data}=await sb.auth.getSession();return data&&data.session?data.session.access_token:'';}
async function apiPost(pfad,body){const r=await fetch(pfad,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await tok()},body:JSON.stringify(body)});let j=null;try{j=await r.json();}catch(e){}if(!j)throw new Error('Dienst nicht erreichbar ('+r.status+').');if(j.error)throw new Error(j.error);return j;}
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(f);});
function lieferungForm(id,vor){ const t=T[id]; ENTW[id]=ENTW[id]||{}; ENTW[id].lf=Object.assign({d:dfmt(heute()),l:'',betrag:'',lieferant:(t.lieferant&&t.lieferant.name)||'',notiz:'',datei:null},vor||{}); render(); }
function lieferFormHtml(id,F){ return '<div style="background:var(--surf2);border-radius:10px;padding:12px;margin-top:10px"><div class="grid">'
  +'<label>Lieferdatum<input class="inp" value="'+esc(F.d)+'" oninput="ENTW[\''+id+'\'].lf.d=this.value"></label>'
  +'<label>Liter<input class="inp" inputmode="decimal" value="'+esc(F.l)+'" oninput="ENTW[\''+id+'\'].lf.l=this.value"></label>'
  +'<label>Betrag brutto (Euro)<input class="inp" inputmode="decimal" value="'+esc(F.betrag)+'" oninput="ENTW[\''+id+'\'].lf.betrag=this.value"></label>'
  +'<label>Lieferant<input class="inp" value="'+esc(F.lieferant)+'" oninput="ENTW[\''+id+'\'].lf.lieferant=this.value"></label>'
  +'<label>Notiz<input class="inp" value="'+esc(F.notiz)+'" oninput="ENTW[\''+id+'\'].lf.notiz=this.value"></label></div>'
  +(F.datei?'<div class="mut" style="margin-top:6px">Rechnung: '+esc(F.datei.name)+'</div>':'')
  +'<div class="acts"><button class="btn" onclick="lieferungSpeichern(\''+id+'\')">Lieferung speichern</button><button class="btn zw" onclick="ENTW[\''+id+'\'].lf=null;ENTW[\''+id+'\'].lstat=\'\';render()">Abbrechen</button><span class="mut">Bitte die gelesenen Werte prüfen.</span></div></div>'; }
async function rechnungDatei(id,inp){ const f=inp.files&&inp.files[0]; if(!f)return; const t=T[id]; ENTW[id]=ENTW[id]||{}; ENTW[id].lstat='Rechnung wird hochgeladen und gelesen …'; render();
  try{ const pf='oel/'+id+'/'+rnd()+'_'+String(f.name||'Rechnung').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9._-]+/g,'_');
    const up=await sb.storage.from('objekt-zaehler').upload(pf,f,{contentType:f.type||'application/pdf'}); if(up.error) throw new Error('Hochladen fehlgeschlagen: '+up.error.message);
    const datei={pfad:pf,name:f.name}; let vor={datei};
    try{ const pdf=/pdf/i.test(f.type||f.name); if(pdf&&f.size>3*1024*1024) throw new Error('zu groß');
      const prompt='Das ist eine Rechnung oder ein Lieferschein über Heizöl. Gib ausschließlich dieses JSON zurück: {"lieferant":"Name des Lieferanten","lieferdatum":"Lieferdatum als JJJJ-MM-TT, sonst Rechnungsdatum","liter":Liefermenge in Litern als Zahl,"brutto":Rechnungsbetrag brutto in Euro als Zahl,"rechnungsnummer":""}. Nur Angaben aus dem Dokument, nichts erfinden.';
      const daten=await b64(f); const j=await apiPost('/api/ki',pdf?{aufgabe:'beleg_json',text:prompt,pdf:{daten}}:{aufgabe:'beleg_json',text:prompt,bild:{daten,typ:f.type||'image/jpeg'}}), J=j.json||{};
      vor={datei,d:J.lieferdatum?dfmt(J.lieferdatum):dfmt(heute()),l:J.liter!=null?String(J.liter).replace('.',','):'',betrag:J.brutto!=null?String(J.brutto).replace('.',','):'',lieferant:J.lieferant||((t.lieferant&&t.lieferant.name)||''),notiz:J.rechnungsnummer?'Rechnung '+J.rechnungsnummer:''};
      ENTW[id].lstat='Rechnung gelesen.'; }
    catch(e){ ENTW[id].lstat='Rechnung hochgeladen, konnte aber nicht gelesen werden. Bitte die Werte eintragen.'; }
    lieferungForm(id,vor); }
  catch(e){ ENTW[id].lstat=e.message||String(e); render(); } }
async function lieferungSpeichern(id){ const F=ENTW[id]&&ENTW[id].lf; if(!F)return; const d=dIso(F.d), l=zahl(F.l), b=zahl(F.betrag);
  if(!d){toast('Bitte ein gültiges Lieferdatum eintragen.');return;} if(l==null||l<=0){toast('Bitte die gelieferten Liter eintragen.');return;}
  const t=JSON.parse(JSON.stringify(T[id])); t.lieferungen=(t.lieferungen||[]).concat([{id:rnd(),d,l,betrag:b,lieferant:String(F.lieferant||'').trim(),notiz:String(F.notiz||'').trim(),datei:F.datei||null,von:ICH,am:new Date().toISOString()}]);
  const off=(t.bestellungen||[]).filter(x=>!x.geliefert&&x.am<=d); if(off.length) off.forEach(x=>{x.geliefert=d;});
  ENTW[id].lf=null; ENTW[id].lstat=''; await speichern(t,'Lieferung gespeichert. Bitte nach der Lieferung auch den neuen Ölstand eintragen.'); }
async function dateiOeffnen(p){ const w=window.open('','_blank'); const {data,error}=await sb.storage.from('objekt-zaehler').createSignedUrl(p,600); if(error||!data){if(w)w.close();toast('Datei konnte nicht geöffnet werden.');return;} if(w)w.location.href=data.signedUrl; else window.open(data.signedUrl,'_blank'); }

/* ---------- Bestellung per Mail ---------- */
function bestellungStart(id){ const t=T[id], o=objVon(id), p=prognose(t), g=GES[o.gesellschaft]||GES.WT, menge=p.menge?String(p.menge):'';
  const text='Guten Tag,\n\nhiermit bestellen wir Heizöl für folgende Lieferadresse:\n\n'
    +'Lieferadresse: '+(t.lieferadresse||objAdr(o))+'\n'
    +'Menge: '+(menge?Number(menge).toLocaleString('de-DE')+' Liter':'… Liter')+'\n'
    +'Heizöl: EL schwefelarm\n'
    +'Wunschtermin: \n'
    +(t.volumen?'Tankvolumen: '+Number(t.volumen).toLocaleString('de-DE')+' Liter\n':'')
    +(t.zufahrt?'Hinweis zur Lieferung: '+t.zufahrt+'\n':'')
    +'\nRechnungsadresse:\n'+g.name+'\n'+g.strasse+'\n'+g.ort+'\n\n'
    +'Bitte bestätigen Sie uns die Bestellung mit Preis und Liefertermin.\n\n'+MAIL_SIG;
  ENTW[id]=ENTW[id]||{}; ENTW[id].bs={an:(t.lieferant&&t.lieferant.mail)||'',betreff:'Heizölbestellung – '+(t.lieferadresse||objAdr(o)),menge,termin:'',text}; render(); }
function bestellFormHtml(t,o,id,B){ return '<div style="background:var(--surf2);border-radius:10px;padding:12px"><div class="grid">'
  +'<label>An<input class="inp" value="'+esc(B.an)+'" placeholder="E-Mail des Lieferanten" oninput="ENTW[\''+id+'\'].bs.an=this.value"></label>'
  +'<label>Menge (Liter)<input class="inp" inputmode="decimal" value="'+esc(B.menge)+'" onchange="bestMenge(\''+id+'\',this.value)"></label>'
  +'<label>Wunschtermin<input class="inp" value="'+esc(B.termin)+'" placeholder="z. B. KW 50 oder TT.MM.JJJJ" onchange="bestTermin(\''+id+'\',this.value)"></label></div>'
  +'<label class="fl" style="margin-top:10px">Betreff<input class="inp" value="'+esc(B.betreff)+'" oninput="ENTW[\''+id+'\'].bs.betreff=this.value"></label>'
  +'<label class="fl" style="margin-top:10px">Text<textarea class="inp" rows="16" oninput="ENTW[\''+id+'\'].bs.text=this.value">'+esc(B.text)+'</textarea></label>'
  +'<div class="acts"><button class="btn" id="bs-'+id+'" onclick="bestellungSenden(\''+id+'\')">Bestellung senden</button><button class="btn zw" onclick="ENTW[\''+id+'\'].bs=null;render()">Verwerfen</button><span class="mut">Gesendet wird von hausverwaltung@andersmacher.info.</span></div></div>'; }
function bestMenge(id,v){ const B=ENTW[id].bs, n=zahl(v); B.menge=v; B.text=B.text.replace(/^Menge: .*$/m,'Menge: '+(n?n.toLocaleString('de-DE')+' Liter':'… Liter')); render(); }
function bestTermin(id,v){ const B=ENTW[id].bs; B.termin=String(v||'').trim(); B.text=B.text.replace(/^Wunschtermin: .*$/m,'Wunschtermin: '+B.termin); render(); }
async function bestellungSenden(id){ const B=ENTW[id]&&ENTW[id].bs; if(!B)return; const an=String(B.an||'').trim();
  if(!/@/.test(an)){toast('Bitte die E-Mail-Adresse des Lieferanten eintragen.');return;} if(!zahl(B.menge)){toast('Bitte die Menge eintragen.');return;}
  if(!confirm('Bestellung über '+zahl(B.menge).toLocaleString('de-DE')+' Liter an '+an+' senden?'))return;
  const btn=$('bs-'+id); if(btn){btn.disabled=true;btn.textContent='Wird gesendet …';}
  try{ await apiPost('/api/postfach',{aktion:'senden',modus:'neu',an,betreff:B.betreff,text:B.text});
    const t=JSON.parse(JSON.stringify(T[id])); t.bestellungen=(t.bestellungen||[]).concat([{id:rnd(),am:heute(),an,menge:zahl(B.menge),termin:B.termin,betreff:B.betreff,von:ICH}]);
    if(!(t.lieferant&&t.lieferant.mail)) t.lieferant=Object.assign({},t.lieferant||{},{mail:an});
    ENTW[id].bs=null; await speichern(t,'Bestellung an '+an+' gesendet.'); }
  catch(e){ if(btn){btn.disabled=false;btn.textContent='Bestellung senden';} toast('Nicht gesendet: '+(e.message||e),6000); } }
async function bestGeliefert(id,bid){ const t=JSON.parse(JSON.stringify(T[id])); (t.bestellungen||[]).forEach(b=>{if(b.id===bid)b.geliefert=heute();}); await speichern(t,'Als geliefert markiert.'); }

/* Auswahlfelder: beim Anklicken leeren, damit alle Optionen sichtbar sind */
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input[list]')){t.dataset.alt=t.value;t.value='';}});
document.addEventListener('focusout',e=>{const t=e.target;if(t.matches&&t.matches('input[list]')&&t.value===''&&t.dataset.alt){t.value=t.dataset.alt;}});
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){$('main').innerHTML='<div class="empty">Bitte im OS anmelden.</div>';return;}
  const m=String(session.user&&session.user.email||'').toLowerCase(); ICH=NUTZER[m]||m.split('@')[0];
  const p=new URLSearchParams(location.search); if(p.get('objekt')) OFFEN[p.get('objekt')]=true;
  laden();})();
</script></body></html>
