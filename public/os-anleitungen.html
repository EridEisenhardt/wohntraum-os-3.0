<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anleitungen</title>
<style>
:root{--bg:#f3f5f8;--card:#ffffff;--ink:#18202c;--muted:#5f6b7a;--line:#e0e5eb;--soft:#eef1f5;--accent:#2f5d8a;--accent-soft:#e3ecf5;--warn:#946200;--warn-bg:#fff4d6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:var(--ink)}
.wrap{max-width:1200px;margin:0 auto;padding:16px 20px 60px}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px}
.kopf{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.inp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 11px;flex:1;min-width:240px}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
.gruppe{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
details.sec>summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline;font-weight:700}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:'▸';color:var(--muted)}details.sec[open]>summary::before{content:'▾'}
details.sec>summary .sub{font-weight:400;margin-left:auto;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
details.sec[open]>summary{margin-bottom:10px}
.inhalt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
.wofuer{font-size:14px;margin-bottom:10px}
.rh{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
ol,ul{padding-left:20px;font-size:13.5px}ol li,ul li{margin:3px 0}
video{width:100%;border-radius:10px;border:1px solid var(--line);background:#000;display:block}
.ohne{border:1px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted);font-size:13px;background:var(--soft)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600;background:var(--warn-bg);color:var(--warn)}
.leer{color:var(--muted);text-align:center;padding:30px}
@media(max-width:860px){.inhalt{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body>
<div class="wrap">
  <div class="kopf"><div><h1>Anleitungen</h1><div class="sub">So funktionieren die Bereiche in Verwalto: kurze Beschreibung, die wichtigsten Schritte und ein Video. Die Videos zeigen erfundene Beispieldaten.</div></div>
    <div class="acts" style="margin-top:0"><button onclick="alle(true)">Alle aufklappen</button><button onclick="alle(false)">Alle zuklappen</button></div></div>
  <div class="bar"><input class="inp" id="q" placeholder="Suche, z. B. Mahnung, Kaution, Asana, Fixkosten …" oninput="zeichne()"></div>
  <div id="liste"><div class="leer">Lädt …</div></div>
</div>
<script>
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const V='?v=20261020p';
let A=[],OFFEN={};
try{OFFEN=JSON.parse(localStorage.getItem('anl_offen')||'{}')||{};}catch(e){}
const merke=()=>{try{localStorage.setItem('anl_offen',JSON.stringify(OFFEN));}catch(e){}};
function seite(href){(window.top||window).location.href=href;}
function karte(a){
  const rechts=a.video?`<video controls preload="none" playsinline poster="/anleitungen/${esc(a.video.replace(/\.mp4$/,'.jpg'))}${V}" src="/anleitungen/${esc(a.video)}${V}"></video>`:`<div class="ohne">${a.aufbau?'Dieser Bereich ist noch im Aufbau.':'Ein Video für diesen Bereich folgt.'}</div>`;
  const links=`<div class="wofuer">${esc(a.wofuer)}</div>`
    +(a.schritte&&a.schritte.length?`<div class="rh">So arbeitest du damit</div><ol>${a.schritte.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'')
    +(a.tipps&&a.tipps.length?`<div class="rh">Gut zu wissen</div><ul>${a.tipps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'')
    +(a.aufbau?'':`<div class="acts"><button class="primary" onclick="seite('${esc(a.href)}')">Seite öffnen</button></div>`);
  return `<details class="card sec" data-slug="${esc(a.slug)}"${OFFEN[a.slug]?' open':''}><summary>${esc(a.titel)}${a.aufbau?' <span class="pill">im Aufbau</span>':''}<span class="sub">${esc(a.wofuer.split(/(?<=\.)\s/)[0])}</span></summary><div class="inhalt"><div>${links}</div><div>${rechts}</div></div></details>`;}
function zeichne(){const q=document.getElementById('q').value.trim().toLowerCase();
  const L=A.filter(a=>!q||[a.titel,a.gruppe,a.wofuer].concat(a.schritte||[],a.tipps||[]).join(' ').toLowerCase().includes(q));
  if(!L.length){document.getElementById('liste').innerHTML='<div class="leer">Nichts gefunden.</div>';return;}
  const G=[...new Set(L.map(a=>a.gruppe))].sort((a,b)=>a.localeCompare(b,'de'));
  document.getElementById('liste').innerHTML=G.map(g=>`<div class="gruppe">${esc(g)}</div>`+L.filter(a=>a.gruppe===g).sort((a,b)=>a.titel.localeCompare(b.titel,'de')).map(karte).join('')).join('');
  if(q)document.querySelectorAll('#liste details').forEach(d=>d.open=true);}
function alle(w){document.querySelectorAll('#liste details').forEach(d=>{d.open=w;OFFEN[d.dataset.slug]=w;});merke();}
document.addEventListener('toggle',e=>{const d=e.target;if(!d.matches||!d.matches('details[data-slug]'))return;if(!document.getElementById('q').value){OFFEN[d.dataset.slug]=d.open;merke();}
  if(!d.open){const v=d.querySelector('video');if(v)v.pause();}},true);
fetch('/anleitungen/anleitungen.json'+V).then(r=>r.json()).then(j=>{A=j;const b=new URLSearchParams(location.search).get('bereich');
  if(b){OFFEN[b]=true;}zeichne();if(b){const d=document.querySelector(`details[data-slug="${CSS.escape(b)}"]`);if(d)d.scrollIntoView({block:'start'});}})
 .catch(()=>{document.getElementById('liste').innerHTML='<div class="leer">Anleitungen konnten nicht geladen werden.</div>';});
</script></body></html>
