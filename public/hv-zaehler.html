<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hausverwaltung · Zähler – Wohntraum OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--surf:#fff;--surf2:#f1f3f6;--line:#e6e8ec;--text:#1c2024;--muted:#6b7280;--accent:#185fa5;--accent2:#2f5d8a;--green:#1f7a4d;--red:#c0392b;--warn:#b7791f;--r:8px;--rl:12px}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.hdr{background:var(--surf);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.hdr-title{font-size:18px;font-weight:700}.hdr-sub{font-size:12px;color:var(--muted)}
.tabs{margin-left:auto;display:flex;gap:4px;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{background:none;border:0;border-radius:7px;padding:8px 16px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}.tabs button.on{background:var(--accent);color:#fff}
.main{padding:18px 24px 60px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.bar label{display:flex;flex-direction:column;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;gap:4px}
.bar label.cb{flex-direction:row;align-items:center;gap:6px;text-transform:none;font-size:13px;color:var(--text);font-weight:600;padding-bottom:8px}
.inp{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--text);min-width:0}
.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.zw{background:var(--surf);color:var(--text);border:1px solid var(--line)}.btn.kl{padding:5px 10px;font-size:12px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.kpi{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:150px}.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--muted)}
details.obj{background:var(--surf);border:1px solid var(--line);border-radius:var(--rl);margin-bottom:10px;overflow:hidden}
details.obj>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}details.obj>summary::-webkit-details-marker{display:none}
details.obj>summary::before{content:'+';width:14px;color:var(--muted);font-weight:700}details.obj[open]>summary::before{content:'−'}
.obj .kz{font-weight:800;font-size:15px}.obj .adr{color:var(--muted);font-size:13px}.obj .rechts{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.inner{padding:0 16px 14px;overflow-x:auto}
.grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2);font-weight:800;margin:14px 0 4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.aus td{color:var(--muted)}
.mut{color:var(--muted);font-size:12px}.warn{color:var(--warn)}.ok{color:var(--green)}
.lnk{color:var(--accent2);cursor:pointer;background:none;border:0;font:inherit;padding:0;text-decoration:underline}
.verl{background:var(--surf2);border-radius:8px;padding:8px 10px}.verl .vz{display:flex;gap:14px;flex-wrap:wrap;padding:4px 0;border-bottom:1px solid var(--line);font-size:12.5px}.verl .vz:last-child{border-bottom:0}
.empty{padding:30px;text-align:center;color:var(--muted)}
table.zt{table-layout:fixed}tr.zr{cursor:pointer}tr.zr:hover td{background:var(--surf2)}tr.zr.auf td{background:var(--surf2);border-bottom:0}.pm{display:inline-block;width:18px;color:var(--muted);font-weight:700}
tr.dz td{background:var(--surf2);padding:4px 12px 14px}
.det{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px}
.det h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent2);margin:4px 0 8px}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px;margin-bottom:12px}
.dg .fl .btn{text-transform:none;letter-spacing:0;font-size:12px}.dg label,.dg .fl{display:flex;flex-direction:column;gap:4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.dg label.cb{flex-direction:row;align-items:center;gap:6px;text-transform:none;font-size:13px;color:var(--text);font-weight:600}
.dakt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.dlg{background:var(--surf);border-radius:var(--rl);padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}.dlg h3{margin-bottom:12px}
/* Tablet-Ablesung */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.obtn{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px 16px;text-align:left;cursor:pointer;font:inherit}
.obtn b{display:block;font-size:20px}.obtn span{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}.chip{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:9px 16px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.kart{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px}
.kart.fertig{border-color:var(--green);box-shadow:inset 4px 0 0 var(--green)}
.kart h3{font-size:17px;margin-bottom:2px}.kart .znr{font-size:15px;color:var(--muted);margin-bottom:4px}.kart .znr b{font-size:24px;color:var(--text,#111);letter-spacing:.5px;font-family:ui-monospace,Menlo,monospace}.kart .znr.leer{color:var(--red);font-weight:600}.kart .info{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.kart .wert{font-size:24px;padding:12px;width:100%;border:1px solid var(--line);border-radius:10px;font-family:inherit}
.kart .reihe{display:flex;gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap}
.foto{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--surf2);font-size:15px}
.foto input{display:none}.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.kart .save{font-size:16px;padding:12px 20px;margin-left:auto}
.hinw{font-size:12.5px;margin-top:8px}
.ovl{position:fixed;inset:0;background:#0d0e1a99;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c2024;color:#fff;border-radius:var(--r);padding:10px 20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:60}.toast.show{opacity:1}
@media (max-width:700px){.main{padding:12px}.hdr{padding:12px}.tabs{margin-left:0}.kgrid{grid-template-columns:1fr}}
</style></head><body>
<div class="hdr"><div><div class="hdr-title">Zähler</div><div class="hdr-sub">Alle Zähler der Objekte · Zählerstände mit Foto · Stände aus Übergabeprotokollen</div></div>
  <div class="tabs"><button data-t="liste" class="on">Übersicht</button><button data-t="ablesen">Ablesen</button></div></div>
<div class="main" id="main"><div class="empty">Lade Zähler …</div></div>
<div class="toast" id="toast"></div>
<datalist id="dlObj"></datalist><datalist id="dlVers"></datalist><datalist id="dlTyp"></datalist><datalist id="dlAnl"></datalist>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const heute=()=>new Date().toISOString().slice(0,10);
const dfmt=d=>{const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'.'+m[2]+'.'+m[1]:'—';};
const zfmt=n=>n==null?'—':Number(n).toLocaleString('de-DE',{maximumFractionDigits:3});
const zahl=v=>{v=String(v==null?'':v).trim();if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return v===''||isNaN(Number(v))?null:Number(v);};
const nat=(a,b)=>String(a||'').localeCompare(String(b||''),'de',{numeric:true,sensitivity:'base'});
const rnd=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),2400);}
const ZTYPEN=['Stromzähler allgemein','Stromzähler WE','Stromzähler Zwischenzähler','Gaszähler','Heizölstand','Wasserzähler allgemein','Wasserzähler WE Kaltwasser','Wasserzähler WE Warmwasser','Heizungsablesung'];
const ANLAESSE=['Ablesung','Jahresende','Jahresanfang','Zwischenablesung','Einzug','Auszug'];
let OBJ=[],EIN=[],Z=[],ZS=[],ICH='',TAB='liste';
const F={obj:'',typ:'',q:'',jahr:false,aus:false,fehlt:false};
let OFFEN={},VERL={},DET={};
const A={obj:'',einh:'__alle',datum:heute(),anlass:'Ablesung',fotos:{},fertig:{}};

/* ---------- Laden ---------- */
async function laden(){
  const [o,e,z]=await Promise.all([sb.from('obj_objekte').select('id,kz,strasse,plz,ort,status'),sb.from('obj_einheiten').select('id,objekt_id,bezeichnung,sort'),sb.from('objekt_zaehler').select('*')]);
  if(o.error||z.error){$('main').innerHTML='<div class="empty">Zähler konnten nicht geladen werden: '+esc((o.error||z.error).message)+'</div>';return;}
  OBJ=o.data||[];EIN=e.data||[];Z=z.data||[];ZS=[];
  const ids=Z.map(x=>x.id);for(let i=0;i<ids.length;i+=150){const {data}=await sb.from('objekt_zaehlerstaende').select('*').in('zaehler_id',ids.slice(i,i+150)).order('datum',{ascending:false}).order('created_at',{ascending:false});ZS=ZS.concat(data||[]);}
  $('dlObj').innerHTML=objListe().map(x=>'<option value="'+esc(objLabel(x))+'">').join('');
  $('dlTyp').innerHTML=[...new Set(ZTYPEN.concat(Z.map(x=>x.typ).filter(Boolean)))].map(t=>'<option value="'+esc(t)+'">').join('');
  versListe(); if(window.__objP){const o=objVon(window.__objP);if(o){F.obj=objLabel(o);OFFEN[o.id]=true;}window.__objP='';}
  $('dlAnl').innerHTML=ANLAESSE.map(t=>'<option value="'+esc(t)+'">').join('');
  render();
}
const objVon=id=>OBJ.find(o=>String(o.id)===String(id))||null;
const objLabel=o=>o.kz+' – '+(o.strasse||'')+(o.ort?', '+o.ort:'');
const objListe=()=>OBJ.filter(o=>Z.some(z=>String(z.object_id)===String(o.id))||o.status!=='Verkauft').sort((a,b)=>nat(a.kz,b.kz));
const einVon=id=>EIN.find(e=>String(e.id)===String(id))||null;
const einLabel=id=>{if(!id)return 'Allgemein';const e=einVon(id);return e?e.bezeichnung:'Einheit (unbekannt)';};
const staende=zid=>ZS.filter(s=>s.zaehler_id===zid);
const letzter=zid=>staende(zid)[0]||null;
function quelle(s){if(!s)return '';if(s.uebergabe_id)return '<a class="lnk" href="/hausverwaltung/uebergaben?id='+encodeURIComponent(s.uebergabe_id)+'" target="_top">'+esc(s.anlass||'Übergabe')+'</a>'+(s.notiz?'<div class="mut">'+esc(s.notiz)+'</div>':'');return esc(s.anlass||'');}
const alt=s=>!s||(Date.now()-new Date(s.datum).getTime())>365*864e5;

/* ---------- Übersicht ---------- */
function gefiltert(){const q=F.q.trim().toLowerCase();
  return Z.filter(z=>(F.aus||z.aktiv!==false)&&(!F.typ||z.typ===F.typ)&&(!F.jahr||z.jahresablesung)&&(!F.fehlt||alt(letzter(z.id)))
    &&(!q||[z.nummer,z.typ,z.standort,z.kundennummer,z.versorger,einLabel(z.unit_id),(objVon(z.object_id)||{}).kz].join(' ').toLowerCase().includes(q)));}
function renderListe(){
  const L=gefiltert(), oSel=F.obj?OBJ.find(o=>objLabel(o)===F.obj||o.kz===F.obj):null;
  let h='<div class="bar"><label>Objekt<input class="inp" list="dlObj" value="'+esc(F.obj)+'" placeholder="Alle Objekte" onchange="F.obj=this.value.trim();render()" style="width:260px"></label>'
    +'<label>Zählertyp<input class="inp" list="dlTyp" value="'+esc(F.typ)+'" placeholder="Alle Typen" onchange="F.typ=this.value.trim();render()" style="width:220px"></label>'
    +'<label>Suche<input class="inp" id="q" value="'+esc(F.q)+'" placeholder="Nummer, Einheit, Standort …" oninput="F.q=this.value;clearTimeout(window.__qt);window.__qt=setTimeout(render,250)" style="width:220px"></label>'
    +'<label class="cb"><input type="checkbox" '+(F.jahr?'checked':'')+' onchange="F.jahr=this.checked;render()"> nur Jahresablesung</label>'
    +'<label class="cb"><input type="checkbox" '+(F.fehlt?'checked':'')+' onchange="F.fehlt=this.checked;render()"> Ablesung fehlt oder älter als 12 Monate</label>'
    +'<label class="cb"><input type="checkbox" '+(F.aus?'checked':'')+' onchange="F.aus=this.checked;render()"> ausgebaute zeigen</label>'+(F.obj||F.typ||F.q||F.jahr||F.fehlt||F.aus?'<button class="btn zw kl" style="margin-bottom:8px" onclick="Object.assign(F,{obj:\'\',typ:\'\',q:\'\',jahr:false,fehlt:false,aus:false});render()">Zurücksetzen</button>':'')+'</div>';
  const akt=Z.filter(z=>z.aktiv!==false), jahr=String(new Date().getFullYear());
  h+='<div class="kpis"><div class="kpi"><b>'+akt.length+'</b><span>eingebaute Zähler</span></div><div class="kpi"><b>'+akt.filter(z=>(letzter(z.id)||{}).datum&&letzter(z.id).datum.startsWith(jahr)).length+'</b><span>mit Ablesung '+jahr+'</span></div><div class="kpi"><b class="warn">'+akt.filter(z=>alt(letzter(z.id))).length+'</b><span>ohne Ablesung oder älter als 12 Monate</span></div><div class="kpi"><b>'+ZS.filter(s=>s.uebergabe_id).length+'</b><span>Stände aus Übergabeprotokollen</span></div></div>';
  const objs=objListe().filter(o=>!oSel||o.id===oSel.id).filter(o=>L.some(z=>String(z.object_id)===String(o.id)));
  if(!objs.length){$('main').innerHTML=h+'<div class="empty">Keine Zähler für diesen Filter.</div>';return;}
  const auf=objs.length===1||!!F.q.trim();
  objs.forEach(o=>{const zs=L.filter(z=>String(z.object_id)===String(o.id));const offen=OFFEN[o.id]!=null?OFFEN[o.id]:auf;
    const fehlt=zs.filter(z=>z.aktiv!==false&&alt(letzter(z.id))).length;
    h+='<details class="obj"'+(offen?' open':'')+' ontoggle="OFFEN[\''+o.id+'\']=this.open;if(this.open&&!this.querySelector(\'table\'))render()"><summary><span class="kz">'+esc(o.kz)+'</span><span class="adr">'+esc((o.strasse||'')+(o.ort?', '+o.ort:''))+'</span><span class="rechts">'+zs.length+' Zähler'+(fehlt?' · <span class="warn">'+fehlt+' ohne aktuelle Ablesung</span>':'')
      +' <button class="btn zw kl" onclick="event.preventDefault();neuDialog(\''+o.id+'\')">Zähler anlegen</button> <button class="btn kl" onclick="event.preventDefault();ablesenStart(\''+o.id+'\')">Ablesen</button><a class="btn zw kl" href="/verwalto/objekt?id='+encodeURIComponent(o.id)+'&tab=zaehler" target="_top" onclick="event.stopPropagation()" style="text-decoration:none">Objekt öffnen</a></span></summary><div class="inner">';
    if(offen){const gr=[...new Set(zs.map(z=>z.unit_id||''))].sort((a,b)=>a===''?-1:b===''?1:nat(einLabel(a),einLabel(b)));
      gr.forEach(g=>{const zz=zs.filter(z=>(z.unit_id||'')===g).sort((a,b)=>nat(a.typ,b.typ)||nat(a.nummer,b.nummer));
        h+='<div class="grp">'+esc(einLabel(g))+'</div><table class="zt"><colgroup><col style="width:34%"><col style="width:24%"><col style="width:16%"><col style="width:14%"><col style="width:12%"></colgroup><thead><tr><th>Zählertyp</th><th>Zählernummer</th><th>Letzter Stand</th><th>Datum</th><th></th></tr></thead><tbody>';
        zz.forEach(z=>{const s=letzter(z.id);
          h+='<tr class="zr'+(z.aktiv===false?' aus':'')+(DET[z.id]?' auf':'')+'" onclick="DET[\''+z.id+'\']=!DET[\''+z.id+'\'];render()"><td><span class="pm">'+(DET[z.id]?'−':'+')+'</span><b>'+esc(z.typ||'')+'</b>'+(z.aktiv===false?' (ausgebaut)':'')+(z.bemerkung?'<div class="mut" style="margin-left:18px">'+esc(z.bemerkung)+'</div>':'')+'</td><td>'+esc(z.nummer||'—')+'</td>'
            +'<td>'+(s?'<b>'+zfmt(s.wert)+'</b>':'<span class="warn">keine</span>')+'</td><td class="'+(s&&alt(s)?'warn':'')+'">'+(s?dfmt(s.datum):'')+'</td>'
            +'<td style="white-space:nowrap;text-align:right" onclick="event.stopPropagation()">'+(z.aktiv!==false?'<button class="btn kl" onclick="ablesenEinzeln(\''+z.id+'\')">Ablesen</button>':'')+'</td></tr>';
          if(DET[z.id]) h+='<tr class="dz"><td colspan="5">'+detail(z)+'</td></tr>';
        });
        h+='</tbody></table>';});
    }
    h+='</div></details>';});
  $('main').innerHTML=h;
  if(document.activeElement&&document.activeElement.id!=='q'){} const q=$('q'); if(q&&window.__qfocus){q.focus();q.setSelectionRange(q.value.length,q.value.length);}
}
document.addEventListener('focusin',e=>{window.__qfocus=e.target&&e.target.id==='q';});

/* ---------- Zähler-Details ---------- */
const VERS=()=>[...new Set(Z.map(z=>z.versorger).filter(Boolean))].sort(nat);
const einOpts=oid=>['Allgemein'].concat(EIN.filter(e=>String(e.objekt_id)===String(oid)).sort((a,b)=>nat(a.bezeichnung,b.bezeichnung)).map(e=>e.bezeichnung));
function einIdVon(oid,txt){txt=String(txt||'').trim();if(!txt||txt==='Allgemein')return null;const e=EIN.find(x=>String(x.objekt_id)===String(oid)&&x.bezeichnung===txt);return e?e.id:undefined;}
const dlist=(id,arr)=>'<datalist id="'+id+'">'+arr.map(v=>'<option value="'+esc(v)+'">').join('')+'</datalist>';
function detail(z){const i=z.id, v=staende(i);
  return '<div class="det" onclick="event.stopPropagation()"><h4>Vertrag</h4><div class="dg">'
    +'<label>Versorger<input class="inp" id="dV-'+i+'" list="dlVers" value="'+esc(z.versorger||'')+'" placeholder="z. B. Stadtwerke"></label>'
    +'<label>Kundennummer<input class="inp" id="dK-'+i+'" value="'+esc(z.kundennummer||'')+'"></label>'
    +'<div class="fl">Vertrag<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;text-transform:none;letter-spacing:0;font-weight:500;font-size:13px">'+(z.vertrag_pfad?'<button class="lnk" onclick="vertragOeffnen(\''+i+'\')">'+esc(z.vertrag_name||'Vertrag öffnen')+'</button>':'<span class="mut">noch kein Vertrag</span>')
      +'<label class="btn zw kl" style="cursor:pointer">'+(z.vertrag_pfad?'Ersetzen':'Hochladen')+'<input type="file" accept=".pdf,image/*" style="display:none" onchange="vertragHoch(\''+i+'\',this)"></label></span></div></div>'
    +'<h4>Zählerdaten</h4><div class="dg">'
    +'<label>Zählertyp<input class="inp" id="dT-'+i+'" list="dlTyp" value="'+esc(z.typ||'')+'"></label>'
    +'<label>Zählernummer<input class="inp" id="dN-'+i+'" value="'+esc(z.nummer||'')+'"></label>'
    +'<label>Einheit<input class="inp" id="dE-'+i+'" list="dlE-'+i+'" value="'+esc(einLabel(z.unit_id))+'"></label>'+dlist('dlE-'+i,einOpts(z.object_id))
    +'<label>Standort<input class="inp" id="dS-'+i+'" value="'+esc(z.standort||'')+'"></label>'
    +'<label>Bemerkung<input class="inp" id="dB-'+i+'" value="'+esc(z.bemerkung||'')+'"></label>'
    +'<label class="cb"><input type="checkbox" id="dJ-'+i+'" '+(z.jahresablesung?'checked':'')+'> Jahresablesung</label>'
    +'<label class="cb"><input type="checkbox" id="dA-'+i+'" '+(z.aktiv!==false?'checked':'')+'> Zähler ist eingebaut</label></div>'
    +'<div class="dakt"><button class="btn" onclick="detSpeichern(\''+i+'\',this)">Speichern</button>'+(z.aktiv!==false?'<button class="btn zw" onclick="wechselDialog(\''+i+'\')">Zählerwechsel</button>':'')+'<span class="mut" id="dH-'+i+'"></span></div>'
    +'<h4 style="margin-top:14px">Ablesungen ('+v.length+')</h4><div class="verl">'+(v.length?v.map(x=>'<div class="vz"><b style="min-width:90px">'+dfmt(x.datum)+'</b><span style="min-width:100px">'+zfmt(x.wert)+'</span><span style="min-width:150px">'+quelle(x)+'</span>'+(x.notiz&&!x.uebergabe_id?'<span>'+esc(x.notiz)+'</span>':'')+(x.bild_pfad?'<button class="lnk" onclick="foto(\''+esc(x.bild_pfad)+'\')">Foto</button>':'')+'<span class="mut" style="margin-left:auto">'+esc(x.erfasst_von||'')+'</span></div>').join(''):'<span class="mut">Noch keine Ablesungen.</span>')+'</div></div>';}
const dv=id=>(($(id)||{}).value||'').trim();
async function detSpeichern(i,btn){const z=Z.find(x=>x.id===i);const h=$('dH-'+i);
  const uid=einIdVon(z.object_id,dv('dE-'+i));if(uid===undefined){h.innerHTML='<span class="warn">Diese Einheit gibt es im Objekt nicht. Bitte aus der Liste wählen.</span>';return;}
  const typ=dv('dT-'+i);if(!typ){h.innerHTML='<span class="warn">Bitte den Zählertyp angeben.</span>';return;}
  const rec={versorger:dv('dV-'+i)||null,kundennummer:dv('dK-'+i)||null,typ,nummer:dv('dN-'+i)||null,unit_id:uid,standort:dv('dS-'+i)||null,bemerkung:dv('dB-'+i)||null,jahresablesung:$('dJ-'+i).checked,aktiv:$('dA-'+i).checked,updated_at:new Date().toISOString()};
  btn.disabled=true;h.textContent='Wird gespeichert …';
  const {error}=await sb.from('objekt_zaehler').update(rec).eq('id',i);btn.disabled=false;
  if(error){h.innerHTML='<span class="warn">Fehler: '+esc(error.message)+'</span>';return;}
  Object.assign(z,rec);versListe();render();toast('Zähler gespeichert.');}
function versListe(){$('dlVers').innerHTML=VERS().map(v=>'<option value="'+esc(v)+'">').join('');}
async function vertragHoch(i,inp){const f=inp.files&&inp.files[0];if(!f)return;const z=Z.find(x=>x.id===i);const h=$('dH-'+i);if(h)h.textContent='Vertrag wird hochgeladen …';
  const name=f.name.replace(/[^\w.\-]+/g,'_');const pfad=z.object_id+'/'+i+'/vertrag-'+rnd()+'-'+name;
  const up=await sb.storage.from('objekt-zaehler').upload(pfad,f,{contentType:f.type||'application/pdf'});if(up.error){if(h)h.innerHTML='<span class="warn">Upload fehlgeschlagen: '+esc(up.error.message)+'</span>';return;}
  const {error}=await sb.from('objekt_zaehler').update({vertrag_pfad:pfad,vertrag_name:f.name,updated_at:new Date().toISOString()}).eq('id',i);if(error){if(h)h.innerHTML='<span class="warn">Fehler: '+esc(error.message)+'</span>';return;}
  z.vertrag_pfad=pfad;z.vertrag_name=f.name;render();toast('Vertrag gespeichert.');}
async function vertragOeffnen(i){const z=Z.find(x=>x.id===i);if(z&&z.vertrag_pfad)foto(z.vertrag_pfad);}
function dialog(html){zu();const d=document.createElement('div');d.className='ovl';d.id='ovl';d.innerHTML='<div class="dlg">'+html+'</div>';d.onclick=e=>{if(e.target===d)zu();};document.body.appendChild(d);}
function zu(){const d=$('ovl');if(d)d.remove();}
function neuDialog(oid){const o=objVon(oid)||{};
  dialog('<h3>Zähler anlegen – '+esc(o.kz||'')+'</h3><div class="dg">'
   +'<label>Einheit<input class="inp" id="nE" list="dlNE" value="Allgemein"></label>'+dlist('dlNE',einOpts(oid))
   +'<label>Zählertyp<input class="inp" id="nT" list="dlTyp" placeholder="z. B. Gaszähler"></label>'
   +'<label>Zählernummer<input class="inp" id="nN"></label><label>Standort<input class="inp" id="nS" placeholder="z. B. Keller links"></label>'
   +'<label>Versorger<input class="inp" id="nV" list="dlVers"></label><label>Kundennummer<input class="inp" id="nK"></label>'
   +'<label>Anfangsstand (optional)<input class="inp" id="nW" inputmode="decimal"></label><label>Datum<input class="inp" type="date" id="nD" value="'+heute()+'"></label>'
   +'<label class="cb"><input type="checkbox" id="nJ"> Jahresablesung</label></div><div class="mut" id="nH"></div>'
   +'<div class="dakt" style="justify-content:flex-end"><button class="btn zw" onclick="zu()">Abbrechen</button><button class="btn" id="nOk">Speichern</button></div>');
  $('nOk').onclick=async function(){const uid=einIdVon(oid,dv('nE'));if(uid===undefined){$('nH').innerHTML='<span class="warn">Diese Einheit gibt es im Objekt nicht.</span>';return;}
    const typ=dv('nT');if(!typ){$('nH').innerHTML='<span class="warn">Bitte den Zählertyp angeben.</span>';return;}
    this.disabled=true;const rec={object_id:String(oid),unit_id:uid,typ,nummer:dv('nN')||null,standort:dv('nS')||null,versorger:dv('nV')||null,kundennummer:dv('nK')||null,jahresablesung:$('nJ').checked,aktiv:true};
    const {data,error}=await sb.from('objekt_zaehler').insert(rec).select().single();if(error){this.disabled=false;$('nH').innerHTML='<span class="warn">Fehler: '+esc(error.message)+'</span>';return;}
    Z.push(data);const w=zahl(dv('nW'));if(w!=null){const r=await sb.from('objekt_zaehlerstaende').insert({zaehler_id:data.id,datum:dv('nD')||heute(),wert:w,anlass:'Einbau',erfasst_von:ICH||null}).select().single();if(r.data)ZS.unshift(r.data);}
    zu();OFFEN[oid]=true;DET[data.id]=true;versListe();render();toast('Zähler angelegt.');};}
function wechselDialog(i){const z=Z.find(x=>x.id===i);
  dialog('<h3>Zählerwechsel</h3><div class="mut" style="margin-bottom:12px">'+esc(z.typ)+' · '+esc(einLabel(z.unit_id))+(z.standort?' · '+esc(z.standort):'')+'</div><div class="dg">'
   +'<label>Datum des Wechsels<input class="inp" type="date" id="wD" value="'+heute()+'"></label><span></span>'
   +'<label>Endstand alter Zähler ('+esc(z.nummer||'ohne Nummer')+')<input class="inp" id="wW1" inputmode="decimal"></label><label>Foto alter Zähler<input class="inp" type="file" id="wF1" accept="image/*" capture="environment"></label>'
   +'<label>Neue Zählernummer<input class="inp" id="wN"></label><label>Anfangsstand neuer Zähler<input class="inp" id="wW2" inputmode="decimal"></label>'
   +'<label>Foto neuer Zähler<input class="inp" type="file" id="wF2" accept="image/*" capture="environment"></label></div>'
   +'<div class="mut" id="wH">Der alte Zähler wird als ausgebaut markiert und bleibt mit allen Ablesungen erhalten. Versorger, Kundennummer und Vertrag werden übernommen.</div>'
   +'<div class="dakt" style="justify-content:flex-end;margin-top:12px"><button class="btn zw" onclick="zu()">Abbrechen</button><button class="btn" id="wOk">Wechsel speichern</button></div>');
  $('wOk').onclick=async function(){const d=dv('wD')||heute(),nr=dv('wN');if(!nr){$('wH').innerHTML='<span class="warn">Bitte die neue Zählernummer angeben.</span>';return;}
    this.disabled=true;$('wH').textContent='Wird gespeichert …';
    const hoch=async(zid,f)=>{if(!f)return null;const blob=await bildKlein(f,1600);const p=z.object_id+'/'+zid+'/'+rnd()+'.jpg';const u=await sb.storage.from('objekt-zaehler').upload(p,blob,{contentType:'image/jpeg'});if(u.error)throw new Error('Foto-Upload fehlgeschlagen: '+u.error.message);return p;};
    try{let r=await sb.from('objekt_zaehlerstaende').insert({zaehler_id:i,datum:d,wert:zahl(dv('wW1')),anlass:'Zählerwechsel alt',bild_pfad:await hoch(i,$('wF1').files[0]),erfasst_von:ICH||null});if(r.error)throw r.error;
      r=await sb.from('objekt_zaehler').update({aktiv:false,updated_at:new Date().toISOString()}).eq('id',i);if(r.error)throw r.error;
      const n=await sb.from('objekt_zaehler').insert({object_id:z.object_id,unit_id:z.unit_id,typ:z.typ,nummer:nr,standort:z.standort,versorger:z.versorger||null,kundennummer:z.kundennummer||null,vertrag_pfad:z.vertrag_pfad||null,vertrag_name:z.vertrag_name||null,jahresablesung:z.jahresablesung,aktiv:true,bemerkung:'ersetzt Zähler '+(z.nummer||'ohne Nummer')+' am '+dfmt(d)}).select().single();if(n.error)throw n.error;
      r=await sb.from('objekt_zaehlerstaende').insert({zaehler_id:n.data.id,datum:d,wert:zahl(dv('wW2')),anlass:'Zählerwechsel neu',bild_pfad:await hoch(n.data.id,$('wF2').files[0]),erfasst_von:ICH||null});if(r.error)throw r.error;
      zu();toast('Zählerwechsel gespeichert.');DET={};DET[n.data.id]=true;laden();}catch(e){this.disabled=false;$('wH').innerHTML='<span class="warn">Fehler: '+esc(e.message||e)+'</span>';}};}

/* ---------- Ablesen (Tablet) ---------- */
function ablesenStart(oid){A.obj=oid;A.einh='__alle';TAB='ablesen';tabsSetzen();render();window.scrollTo(0,0);}
function ablesenEinzeln(zid){const z=Z.find(x=>x.id===zid);if(!z)return;A.obj=z.object_id;A.einh=z.unit_id||'';A.nur=zid;TAB='ablesen';tabsSetzen();render();window.scrollTo(0,0);}
function renderAblesen(){
  if(!A.obj){let h='<div class="mut" style="margin-bottom:12px;font-size:15px">Objekt wählen</div><div class="ogrid">';
    objListe().filter(o=>Z.some(z=>String(z.object_id)===String(o.id)&&z.aktiv!==false)).forEach(o=>{const n=Z.filter(z=>String(z.object_id)===String(o.id)&&z.aktiv!==false).length;const d=Z.filter(z=>String(z.object_id)===String(o.id)&&z.aktiv!==false&&(letzter(z.id)||{}).datum===heute()).length;
      h+='<button class="obtn" onclick="A.obj=\''+o.id+'\';A.einh=\'__alle\';A.nur=\'\';render()"><b>'+esc(o.kz)+'</b><span>'+esc(o.strasse||'')+'</span><br><span>'+n+' Zähler'+(d?' · heute '+d+' erfasst':'')+'</span></button>';});
    $('main').innerHTML=h+'</div>';return;}
  const o=objVon(A.obj)||{};const zs=Z.filter(z=>String(z.object_id)===String(A.obj)&&z.aktiv!==false);
  const gr=[...new Set(zs.map(z=>z.unit_id||''))].sort((a,b)=>a===''?-1:b===''?1:nat(einLabel(a),einLabel(b)));
  let h='<div class="bar"><button class="btn zw" onclick="A.obj=\'\';A.nur=\'\';render()">Anderes Objekt</button><div style="font-size:20px;font-weight:800">'+esc(o.kz||'')+' <span class="mut" style="font-size:14px;font-weight:400">'+esc(o.strasse||'')+'</span></div>'
    +'<label style="margin-left:auto">Datum<input class="inp" type="date" value="'+esc(A.datum)+'" onchange="A.datum=this.value||heute()"></label><label>Anlass<input class="inp" list="dlAnl" value="'+esc(A.anlass)+'" onchange="A.anlass=this.value.trim()"></label></div>';
  h+='<div class="chips"><button class="chip'+(A.einh==='__alle'&&!A.nur?' on':'')+'" onclick="A.einh=\'__alle\';A.nur=\'\';render()">Alle</button>'+gr.map(g=>'<button class="chip'+(A.einh===g&&!A.nur?' on':'')+'" onclick="A.einh=\''+g+'\';A.nur=\'\';render()">'+esc(einLabel(g))+'</button>').join('')+'</div>';
  let L=zs.filter(z=>A.nur?z.id===A.nur:(A.einh==='__alle'||(z.unit_id||'')===A.einh));
  L.sort((a,b)=>{const ga=a.unit_id?einLabel(a.unit_id):'',gb=b.unit_id?einLabel(b.unit_id):'';return (ga===''?-1:gb===''?1:nat(ga,gb))||nat(a.typ,b.typ)||nat(a.nummer,b.nummer);});
  if(A.nur) h+='<div style="margin-bottom:10px"><button class="lnk" onclick="A.nur=\'\';render()">alle Zähler dieses Objekts zeigen</button></div>';
  h+='<div class="kgrid">';
  L.forEach(z=>{const s=letzter(z.id), f=A.fertig[z.id], ft=A.fotos[z.id];
    h+='<div class="kart'+(f?' fertig':'')+'" id="k-'+z.id+'"><div class="znr'+(z.nummer?'':' leer')+'">'+(z.nummer?'Zählernummer <b>'+esc(z.nummer)+'</b>':'Ohne Zählernummer')+'</div><h3>'+esc(z.typ||'Zähler')+' · '+esc(einLabel(z.unit_id))+'</h3><div class="info">'+(z.standort?'Standort: '+esc(z.standort)+'<br>':'')+'Letzter Stand: '+(s?'<b>'+zfmt(s.wert)+'</b> am '+dfmt(s.datum):'keiner')+'</div>'
      +(f?'<div class="ok" style="font-weight:700;font-size:15px">Erfasst: '+zfmt(f.wert)+(f.foto?' mit Foto':'')+'</div><div class="reihe"><button class="btn zw" onclick="delete A.fertig[\''+z.id+'\'];render()">Noch einmal erfassen</button></div>'
       :'<input class="wert" id="w-'+z.id+'" inputmode="decimal" placeholder="Zählerstand" autocomplete="off">'
        +'<div class="reihe"><label class="foto">'+(ft?'Foto ändern':'Foto aufnehmen')+'<input type="file" accept="image/*" capture="environment" onchange="fotoWahl(\''+z.id+'\',this)"></label>'+(ft?'<img class="thumb" src="'+ft.url+'">':'')
        +'<input class="inp" id="n-'+z.id+'" placeholder="Notiz (optional)" style="flex:1;min-width:120px"><button class="btn save" onclick="speichern(\''+z.id+'\',this)">Speichern</button></div><div class="hinw" id="h-'+z.id+'"></div>')
      +'</div>';});
  if(!L.length) h+='<div class="empty">Keine eingebauten Zähler.</div>';
  $('main').innerHTML=h+'</div>';
}
function fotoWahl(zid,inp){const f=inp.files&&inp.files[0];if(!f)return;const w=$('w-'+zid),n=$('n-'+zid);const wv=w?w.value:'',nv=n?n.value:'';
  A.fotos[zid]={file:f,url:URL.createObjectURL(f)};render();const w2=$('w-'+zid),n2=$('n-'+zid);if(w2)w2.value=wv;if(n2)n2.value=nv;}
function bildKlein(file,max){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const f=Math.min(1,max/Math.max(w,h));w=Math.round(w*f);h=Math.round(h*f);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>b?res(b):rej(new Error('Bild konnte nicht gelesen werden')),'image/jpeg',.85);URL.revokeObjectURL(img.src);};img.onerror=()=>rej(new Error('Bild konnte nicht gelesen werden'));img.src=URL.createObjectURL(file);});}
async function speichern(zid,btn){const z=Z.find(x=>x.id===zid);const w=zahl(($('w-'+zid)||{}).value);const ft=A.fotos[zid];const hint=$('h-'+zid);
  if(w==null&&!ft){hint.innerHTML='<span class="warn">Bitte Zählerstand eintragen oder ein Foto aufnehmen.</span>';return;}
  const s=letzter(zid); if(w!=null&&s&&s.wert!=null&&w<Number(s.wert)&&!btn.dataset.ok){btn.dataset.ok='1';hint.innerHTML='<span class="warn">Der Stand ist kleiner als der letzte ('+zfmt(s.wert)+'). Bitte prüfen und noch einmal auf Speichern tippen.</span>';return;}
  btn.disabled=true;hint.textContent='Wird gespeichert …';
  try{let pfad=null;if(ft){const blob=await bildKlein(ft.file,1600);pfad=z.object_id+'/'+zid+'/'+rnd()+'.jpg';const up=await sb.storage.from('objekt-zaehler').upload(pfad,blob,{contentType:'image/jpeg'});if(up.error)throw new Error('Foto-Upload fehlgeschlagen: '+up.error.message);}
    const rec={zaehler_id:zid,datum:A.datum||heute(),wert:w,anlass:A.anlass||'Ablesung',notiz:(($('n-'+zid)||{}).value||'').trim()||null,bild_pfad:pfad,erfasst_von:ICH||null};
    const {data,error}=await sb.from('objekt_zaehlerstaende').insert(rec).select().single();if(error)throw error;
    ZS.unshift(data||rec);ZS.sort((a,b)=>String(b.datum).localeCompare(String(a.datum)));A.fertig[zid]={wert:w,foto:!!pfad};delete A.fotos[zid];render();toast('Zählerstand gespeichert.');
  }catch(e){btn.disabled=false;hint.innerHTML='<span class="warn">Fehler: '+esc(e.message||e)+'</span>';}}
async function foto(p){let b='objekt-zaehler',pf=p;if(/^uebergaben\//.test(p)){b='uebergaben';pf=p.slice('uebergaben/'.length);}
  const w=window.open('','_blank');const {data,error}=await sb.storage.from(b).createSignedUrl(pf,600);if(error||!data){if(w)w.close();toast('Foto konnte nicht geöffnet werden.');return;}if(w)w.location.href=data.signedUrl;else window.open(data.signedUrl,'_blank');}

/* ---------- Rahmen ---------- */
function tabsSetzen(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;if(TAB==='ablesen'){A.nur='';}tabsSetzen();render();});
function render(){if(TAB==='ablesen')renderAblesen();else renderListe();}
/* Auswahlfelder: beim Anklicken leeren, damit alle Optionen sichtbar sind */
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input[list]')){t.dataset.alt=t.value;t.value='';}});
document.addEventListener('focusout',e=>{const t=e.target;if(t.matches&&t.matches('input[list]')&&t.value===''&&t.dataset.alt){t.value=t.dataset.alt;}});
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){$('main').innerHTML='<div class="empty">Bitte im OS anmelden.</div>';return;}
  ICH=String(session.user&&session.user.email||'').split('@')[0];
  const p=new URLSearchParams(location.search);if(p.get('ablesen')!=null){TAB='ablesen';tabsSetzen();}if(p.get('objekt')){if(TAB==='ablesen')A.obj=p.get('objekt');else window.__objP=p.get('objekt');}
  laden();})();
</script></body></html>
