<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Objekt</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f5f8;--card:#ffffff;--ink:#18202c;--muted:#5f6b7a;--line:#e0e5eb;--soft:#eef1f5;--accent:#2f5d8a;--accent-ink:#ffffff;--accent-soft:#e3ecf5;
  --pos:#1d7a4c;--pos-bg:#e5f4ec;--neg:#b42318;--neg-bg:#fcebe9;--warn:#946200;--warn-bg:#fff4d6;--chip:#edf1f6;
  --surf:var(--card);--surf2:var(--soft);--text:var(--ink);--accent2:var(--accent);--amber:var(--warn);--red:var(--neg);--green:var(--pos)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:1200px;margin:0 auto;padding:16px 20px 60px}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.dleft{display:flex;gap:14px;align-items:flex-start;min-width:0}
.foto{width:96px;height:72px;border-radius:8px;background:var(--soft) center/cover no-repeat;flex:0 0 auto;border:1px solid var(--line)}
.dname{font-size:22px;font-weight:800;line-height:1.2}
.sub{color:var(--muted);font-size:12px}
.hgrid{display:grid;grid-template-columns:repeat(4,max-content);gap:4px 36px;margin-top:8px}
.hf{display:flex;flex-direction:column}.hf span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}.hf b{font-size:14px;font-weight:600}
.dacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary,.btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{border:1px solid var(--accent);border-radius:8px;padding:6px 12px;font-weight:600;white-space:nowrap}
.btn.zw{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.kl,button.small{font-size:12px;padding:3px 8px}
.btn.rot{background:var(--card);color:var(--neg);border-color:var(--line)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:3px 6px}
.lnk{color:var(--accent);cursor:pointer;background:none;border:0;padding:0;text-align:left;font-weight:600}
.lnk:hover{text-decoration:underline}
.reiter{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;position:sticky;top:0;background:var(--bg);z-index:5}
.reiter button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:9px 12px;color:var(--muted)}
.reiter button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-bottom:12px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.ch{font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.kvr{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kvr:last-child{border-bottom:0}
.kvr span{color:var(--muted);white-space:nowrap}.kvr b{text-align:right;font-weight:600;overflow-wrap:anywhere}
.kvr .q{font-size:11px;color:var(--accent);background:none;border:0;padding:0 0 0 6px;cursor:pointer;font-weight:500}
.fl{display:grid;gap:2px;font-size:12px;color:var(--muted);margin-bottom:6px}
.fl input,.fl select,.fl textarea,.inp{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.inp{width:auto}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi .l{font-size:12px;font-weight:700;color:var(--muted)}.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.note{background:var(--warn-bg);border:1px solid #efdca2;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.note .ch{margin-bottom:4px}
.hinw{display:flex;gap:10px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed #e8d48f}.hinw:last-child{border-bottom:0}.hinw span{flex:1}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap;background:var(--chip);color:var(--muted)}
.pill.ok,.p-ok{background:var(--pos-bg);color:var(--pos)}.pill.mid,.p-leer{background:var(--warn-bg);color:var(--warn)}.p-bald{background:var(--accent-soft);color:var(--accent)}
.muted,.mut{color:var(--muted)}.warn{color:var(--warn);font-weight:600}.rotx{color:var(--neg);font-weight:700}
.empty{color:var(--muted);font-size:13px;padding:24px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:12px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.sec h2{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.sec h2 .rechts{margin-left:auto;font-weight:400}
.tab{width:100%;border-collapse:collapse;font-size:13px}
.tab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tab td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tab tr.kl td{cursor:pointer}.tab tr.kl:hover td{background:var(--accent-soft)}
.tab tr.auf td{background:var(--accent-soft)}
.tab td.det{background:var(--soft);padding:12px}
.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.vgrp{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.vk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.vk:hover{border-color:var(--accent);background:var(--accent-soft)}
.vk .k{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.vk .k b{margin-right:auto}
.vk .d{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.vk .n{font-size:12.5px;margin-top:4px;color:var(--muted)}
.od{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.od .z{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.od .z:last-child{border-bottom:0}.od .z:hover{background:var(--accent-soft)}
.od .z .typ{font-size:10.5px;font-weight:700;color:var(--muted);width:56px;text-transform:uppercase}
.od .z .dt{margin-left:auto;color:var(--muted);font-size:12px}
.krume{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.krume button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
@media(max-width:800px){.wrap{padding:12px}.hgrid{grid-template-columns:repeat(2,max-content)}.dtop{flex-direction:column}.cards{grid-template-columns:1fr}}
</style></head><body>
<div class="wrap">
<div class="dtop"><div class="dleft"><div class="foto" id="foto" hidden></div><div><div class="dname" id="titel">Objekt lädt …</div><div class="sub" id="dsub"></div><div class="hgrid" id="hgrid"></div></div></div><div class="dacts"><button onclick="(window.top||window).location.href='/verwalto/objekte'">Zurück zu Objekte</button><button onclick="wechsel('guide')">Guide</button><button class="primary" onclick="guideTeilen()">QR / Link</button></div></div>
  <div class="reiter" id="reiter">
    <button data-t="uebersicht" class="on">Übersicht</button><button data-t="einheiten">Einheiten &amp; Mieter</button><button data-t="zaehler">Zähler</button><button data-t="guide">Guide</button><button data-t="vertraege">Verträge</button><button data-t="dokumente">Dokumente</button>
  </div>
  <div class="pane" data-p="uebersicht" id="pUeb"></div>
  <div class="pane" data-p="einheiten" id="pEin" hidden></div>
  <div class="pane" data-p="zaehler" hidden><div class="sec"><h2>Zähler &amp; Verbrauchsdaten</h2><div id="zaehlerBox"></div></div></div>
  <div class="pane" data-p="guide" hidden><div class="sec"><h2>Guide Haustechnik</h2><div id="guideBox"></div></div></div>
  <div class="pane" data-p="vertraege" id="pVer" hidden></div>
  <div class="pane" data-p="dokumente" id="pDok" hidden></div>
</div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const eur=n=>(n==null||n===''||isNaN(n))?'—':new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:2}).format(n);
const dfmt=d=>d?new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const zahlF=n=>n==null||n===''?'—':Number(n).toLocaleString('de-DE');
const HEUTE=new Date().toISOString().slice(0,10);
const ROOT='Prozesslandkarte 3.0';
const id=new URLSearchParams(location.search).get('id');
let OB={},UNITS=[],EIN=[],MV=[],EDIT=false,offenWE={},geladen={};

async function laden(){
  if(!id){document.getElementById('titel').textContent='Kein Objekt angegeben';return;}
  const {data:o,error}=await sb.from('obj_objekte').select('*').eq('id',id).maybeSingle();
  if(error||!o){document.getElementById('titel').textContent=error?'Bitte im OS anmelden':'Objekt nicht gefunden';return;}
  OB=o;OB.display_address=[o.strasse,[o.plz,o.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  const [e,mk,me,vt]=await Promise.all([sb.from('obj_einheiten').select('*').eq('objekt_id',id).order('sort'),
    sb.from('os_docs').select('pid:data->>pid,unit:data->>unit,von:data->>von,bis:data->>bis,mieter:data->>mieter,namen:data->namen,kontakte:data->kontakte,stufen:data->stufen,kaution:data->kaution,ref:data->>ref,gewerbe:data->gewerbe').eq('app','oc').like('pfad','mietkonten/%').eq('data->>obj',OB.kz),
    sb.from('os_docs').select('data').eq('app','oc').eq('pfad','stamm/mietkonten-edit').maybeSingle(),
    sb.from('os_docs').select('data').eq('app','oc').eq('pfad','stamm/vertraege').maybeSingle()]);
  EIN=e.data||[];MK=mk.data||[];MKE=(me.data&&me.data.data&&me.data.data.e)||{};
  VL=((vt.data&&vt.data.data&&vt.data.data.liste)||[]).filter(v=>v.obj===OB.kz);
  UNITS=EIN.map(u=>({id:u.id,label:u.bezeichnung}));
  const ids=EIN.map(u=>u.id);MV=[];
  if(ids.length){const {data:m}=await sb.from('obj_mietverhaeltnisse').select('*').in('einheit_id',ids).order('beginn',{ascending:false,nullsFirst:false});MV=m||[];}
  baueTen();
  document.title=OB.kz+' '+OB.name;
  renderHero();renderUeb();renderEin();renderVer();
  const t=new URLSearchParams(location.search).get('tab');if(t)wechsel(t);
}
function renderHero(){
  const f=document.getElementById('foto');
  if(OB.bild_url){f.style.backgroundImage=`url('${OB.bild_url}')`;f.hidden=false;}else f.hidden=true;
  document.getElementById('titel').textContent=OB.name;
  const hf=(l,v)=>`<div class="hf"><span>${l}</span><b>${v}</b></div>`;
  document.getElementById('hgrid').innerHTML=hf('Kürzel',esc(OB.kz))+hf('Adresse',esc(OB.display_address||'—'))+hf('Gesellschaft',esc(OB.gesellschaft||'—'))
    +hf('Status',esc(OB.status)+(OB.status==='Verkauft'&&OB.verkaufsdatum?' '+dfmt(OB.verkaufsdatum):''));
  document.getElementById('dsub').textContent=[OB.typ,OB.eigentuemer].filter(Boolean).join(' · ');
}
function wechsel(t){
  document.querySelectorAll('#reiter button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.pane').forEach(p=>p.hidden=p.dataset.p!==t);
  try{const u=new URL(location.href);u.searchParams.set('tab',t);history.replaceState(null,'',u);}catch(e){}
  if(t==='zaehler')zLaden();if(t==='guide')gLaden();if(t==='dokumente'&&!geladen.dok){geladen.dok=1;dokLaden(OB.onedrive_pfad);}
}
document.querySelectorAll('#reiter button').forEach(b=>b.onclick=()=>wechsel(b.dataset.t));

/* ---------- Übersicht ---------- */
const FELDER=[
 ['Stammdaten',[['kz','Kürzel'],['name','Bezeichnung'],['strasse','Straße'],['plz','PLZ'],['ort','Ort'],['gesellschaft','Gesellschaft','dlGes'],['eigentuemer','Eigentümer'],['typ','Objektart','dlTyp'],['status','Status','dlStatus'],['hausverwaltung','Hausverwaltung'],['baujahr','Baujahr'],['wohnflaeche','Wohnfläche m²','zahl'],['grundstueck','Grundstück m²','zahl'],['heizung','Heizung']]],
 ['Kauf & Verkauf',[['kaufdatum','Kaufdatum','datum'],['besitzuebergang','Besitzübergang','datum'],['kaufpreis','Kaufpreis','eur'],['kaufnebenkosten','Kaufnebenkosten','eur'],['verkaufsdatum','Verkaufsdatum','datum'],['verkauf_uebergabe','Übergabe an Käufer','datum'],['verkaufspreis','Verkaufspreis','eur'],['kaeufer','Käufer']]],
 ['Grundbuch',[['amtsgericht','Amtsgericht'],['grundbuch_von','Grundbuch von'],['grundbuch_blatt','Blatt'],['gemarkung','Gemarkung'],['flur','Flur'],['flurstueck','Flurstück']]],
 ['Energieausweis',[['energie_klasse','Energieklasse'],['energie_gueltig_bis','Gültig bis','datum'],['energie_datei','Ausweis','datei']]],
 ['Konten',[['mietkonto_iban','Mietkonto IBAN'],['mietkonto_bank','Bank Mietkonto'],['finanzierung_bank','Finanzierende Bank']]]
];
function wert(f,typ){const v=OB[f];if(v==null||v==='')return '<span class="mut">–</span>';
  if(typ==='datum'){let s=dfmt(v);if(f==='energie_gueltig_bis'&&v<HEUTE)s+=' <span class="pill mid">abgelaufen</span>';return s;}
  if(typ==='eur')return eur(v);if(typ==='zahl')return zahlF(v);
  if(typ==='datei')return `<button class="lnk" onclick="odOeffne('${esc(v).replace(/'/g,"\\'")}')">öffnen</button>`;
  return esc(v);}
let EDITK=-1;
function renderUeb(){
  const we=EIN.filter(u=>u.aktiv);const verm=we.filter(u=>mvAkt(u.id).length).length;
  const soll=we.reduce((s,u)=>s+mvAkt(u.id).reduce((a,m)=>a+Number(m.kaltmiete||0),0),0);
  const kaut=we.reduce((s,u)=>s+mvAkt(u.id).reduce((a,m)=>a+Number(m.kaution||0),0),0);
  let h=OB.status==='Verkauft'?'':`<div class="kpis">${[['Einheiten',we.length],['Vermietet',verm],['Leerstand',we.length-verm],['Soll-Kaltmiete / Monat',eur(soll)],['Kautionen vereinbart',eur(kaut)]].map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('')}</div>`;
  const ph=(OB.pruefhinweise||[]);
  if(ph.length)h+=`<div class="note"><div class="ch">Bitte prüfen <span class="sub">Hinweise aus der Datenübernahme</span></div>${ph.map((t,i)=>`<div class="hinw"><span>${esc(t)}</span><button class="small" onclick="hinwErledigt(${i})">Erledigt</button></div>`).join('')}</div>`;
  h+='<div class="cards">';
  FELDER.forEach(([titel,fs],gi)=>{
    const ed=EDITK===gi;
    h+=`<div class="card"><div class="ch">${titel}${ed?'':`<button class="ghost small" onclick="EDITK=${gi};renderUeb()">Bearbeiten</button>`}</div>`;
    if(ed){h+=fs.filter(x=>x[2]!=='datei').map(([f,l,t])=>`<label class="fl">${l}<input ${t==='datum'?'type="date"':''} ${t&&t.startsWith('dl')?`list="${t}"`:''} data-f="${f}" data-t="${t||''}" value="${esc(OB[f]==null?'':String(OB[f]))}"></label>`).join('')
      +`<div class="acts"><button class="btn kl" onclick="karteSpeichern(this)">Speichern</button><button class="ghost small" onclick="EDITK=-1;renderUeb()">Abbrechen</button></div>`;}
    else h+=fs.map(([f,l,t])=>{const q=OB.quellen&&OB.quellen[f];
      return `<div class="kvr"><span>${l}${q?`<button class="q" title="${esc(q)}" onclick="odOeffne('${esc(q).replace(/'/g,"\\'")}')">Quelle</button>`:''}</span><b>${wert(f,t)}</b></div>`;}).join('');
    h+='</div>';
  });
  h+=`<div class="card"><div class="ch">Notizen</div><textarea class="inp" style="width:100%;min-height:110px" placeholder="Notizen zum Objekt" onchange="feldSpeichern('notizen',this.value)">${esc(OB.notizen||'')}</textarea></div>`;
  h+='</div>';
  h+=`<datalist id="dlGes"><option value="EE"><option value="WT"><option value="KiBo"></datalist><datalist id="dlTyp">${['Mehrfamilienhaus','Einfamilienhaus','Reihenhaus','Eigentumswohnung','Wohn- und Geschäftshaus','Gewerbeobjekt','Grundstück','Angemietete Wohnung (Untervermietung)'].map(x=>`<option value="${x}">`).join('')}</datalist><datalist id="dlStatus"><option value="Bestand"><option value="In Ankauf"><option value="Im Verkauf"><option value="Verkauft"></datalist>`;
  document.getElementById('pUeb').innerHTML=h;
}
async function karteSpeichern(btn){
  const card=btn.closest('.card');const patch={};
  for(const i of card.querySelectorAll('input[data-f]')){let v=i.value.trim(),t=i.dataset.t,w=v===''?null:v;
    if((t==='zahl'||t==='eur')&&w!=null){w=Number(w.replace(/\./g,'').replace(',','.'));if(isNaN(w)){alert('Bitte eine Zahl eingeben: '+i.parentElement.firstChild.textContent);return;}}
    if(String(OB[i.dataset.f]??'')!==String(w??''))patch[i.dataset.f]=w;}
  if(Object.keys(patch).length){patch.updated_at=new Date().toISOString();const {error}=await sb.from('obj_objekte').update(patch).eq('id',id);if(error){alert('Speichern fehlgeschlagen: '+error.message);return;}
    Object.assign(OB,patch);OB.display_address=[OB.strasse,[OB.plz,OB.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ');renderHero();}
  EDITK=-1;renderUeb();
}
async function feldSpeichern(f,v,t){
  v=String(v).trim();let w=v===''?null:v;
  if((t==='zahl'||t==='eur')&&w!=null){w=Number(w.replace(/\./g,'').replace(',','.'));if(isNaN(w)){alert('Bitte eine Zahl eingeben.');return;}}
  const {error}=await sb.from('obj_objekte').update({[f]:w,updated_at:new Date().toISOString()}).eq('id',id);
  if(error){alert('Speichern fehlgeschlagen: '+error.message);return;}
  OB[f]=w;if(['name','kz','gesellschaft','typ','status','strasse','plz','ort'].includes(f)){OB.display_address=[OB.strasse,[OB.plz,OB.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ');renderHero();}
  if(f!=='notizen')renderUeb();
}
async function hinwErledigt(i){const n=(OB.pruefhinweise||[]).filter((x,j)=>j!==i);const {error}=await sb.from('obj_objekte').update({pruefhinweise:n}).eq('id',id);if(error){alert(error.message);return;}OB.pruefhinweise=n;renderUeb();}

/* ---------- Mietverhältnisse: Quelle sind die Mieterkonten (OS), ergänzend die Objektdaten ---------- */
const aktuell=m=>(!m.beginn||m.beginn<=HEUTE)&&(!m.ende||m.ende>=HEUTE);
const mvVon=uid=>TEN.filter(m=>m.einheit_id===uid).sort((a,b)=>String(b.beginn||'').localeCompare(String(a.beginn||'')));
const mvAkt=uid=>mvVon(uid).filter(aktuell);
const mvBald=uid=>mvVon(uid).filter(m=>m.beginn&&m.beginn>HEUTE);
let MK=[],MKE={},TEN=[],VL=[];
function stufeAm(st,d){const L=(st||[]).slice().sort((a,b)=>String(a.ab||'').localeCompare(String(b.ab||'')));let s=L[0]||{};for(const x of L)if(!x.ab||x.ab<=d)s=x;return s;}
function baueTen(){
  TEN=[];const mitMK=new Set();
  MK.forEach(k=>{const e=MKE[k.pid]||{};const u=EIN.find(x=>x.nahaus_id&&x.nahaus_id===k.unit);if(!u)return;mitMK.add(u.id);
    const s=stufeAm(k.stufen,HEUTE);const mv=MV.find(x=>x.nahaus_id===k.pid)||{};
    const kon=(k.kontakte||[]).map(c=>({name:c.name,email:c.email,tel:c.tel}));
    if(e.email||e.tel){if(kon[0]){if(e.email)kon[0].email=e.email;if(e.tel)kon[0].tel=e.tel;}else kon.push({name:e.mieter||k.mieter,email:e.email,tel:e.tel});}
    TEN.push({quelle:'mk',pid:k.pid,einheit_id:u.id,mieter_name:e.mieter||k.mieter||(k.namen||[]).join(', '),mieter:kon,beginn:k.von||null,ende:e.bis||k.bis||null,
      kaltmiete:s.kalt,betriebskosten:s.bk,heizkosten:s.hk,sonstiges:(s.others||[]).map(o=>({text:o.t,betrag:o.b})),kaution:k.kaution,zahlungsreferenz:e.ref||k.ref,
      vertrag_datei:mv.vertrag_datei,onedrive_ordner:e.od?e.od.replace(ROOT+'/',''):mv.onedrive_ordner,gewerbe:k.gewerbe});});
  MV.forEach(m=>{if(mitMK.has(m.einheit_id))return;if(m.nahaus_id==='test')return;TEN.push(Object.assign({quelle:'objekt',mvid:m.id},m));});
}
function zumKonto(pid){(window.top||window).location.href='/hausverwaltung/mieterkonten?pid='+encodeURIComponent(pid);}

/* ---------- Einheiten & Mieter ---------- */
const jsq=s=>esc(s).replace(/'/g,"\\'");
const kv=(l,v)=>`<div class="kvr"><span>${l}</span><b>${v==null||v===''?'<span class="mut">–</span>':v}</b></div>`;
function renderEin(){
  const we=EIN.filter(u=>u.aktiv);
  let h=`<div class="sec"><h2>Einheiten &amp; Mieter <span class="sub" style="font-weight:400">${we.length} aktive Einheiten</span><span class="rechts"><button class="small" onclick="offenWE._alle=!offenWE._alle;renderEin()">${offenWE._alle?'Alle zuklappen':'Alle aufklappen'}</button> <button class="btn kl" onclick="einForm()">Einheit anlegen</button></span></h2>
   <div class="sub" style="margin:-2px 0 10px">Die Mieterdaten kommen aus den Mieterkonten. Ein Klick auf den Namen öffnet das Mieterkonto. Ein Klick auf die Zeile zeigt die Details.</div>`;
  if(!EIN.length){document.getElementById('pEin').innerHTML=h+'<div class="empty">Noch keine Einheiten angelegt.</div></div>';return;}
  h+=`<div style="overflow-x:auto"><table class="tab"><thead><tr><th>Einheit</th><th>Art</th><th class="r">Fläche</th><th>Mieter</th><th>Einzug</th><th class="r">Kaltmiete</th><th class="r">BK + HK</th><th class="r">Kaution</th><th>Status</th></tr></thead><tbody>`;
  EIN.forEach(u=>{
    const a=mvAkt(u.id),bald=mvBald(u.id),m=a[0],auf=offenWE[u.id]||offenWE._alle;
    const st=!u.aktiv?'<span class="pill">inaktiv</span>':m?(m.ende?`<span class="pill mid">Auszug ${dfmt(m.ende)}</span>`:'<span class="pill ok">vermietet</span>'):bald.length?`<span class="pill p-bald">ab ${dfmt(bald[bald.length-1].beginn)}</span>`:'<span class="pill p-leer">leer</span>';
    const nm=x=>x.quelle==='mk'?`<button class="lnk" onclick="event.stopPropagation();zumKonto('${jsq(x.pid)}')">${esc(x.mieter_name||'Mieterkonto')}</button>`:`${esc(x.mieter_name||'')}<div class="warn" style="font-size:11.5px">ohne Mieterkonto</div>`;
    const name=m?nm(m):bald.length?nm(bald[bald.length-1]):'<span class="mut">–</span>';
    h+=`<tr class="kl${auf?' auf':''}" onclick="offenWE['${u.id}']=!offenWE['${u.id}'];renderEin()"><td><b>${esc(u.bezeichnung)}</b>${u.lage?`<div class="sub">${esc(u.lage)}</div>`:''}</td><td>${esc(u.art||'')}</td><td class="r">${u.flaeche?zahlF(u.flaeche)+' m²':'–'}</td>
      <td>${name}${a.length>1?`<div class="warn" style="font-size:11.5px">${a.length} laufende Mietverhältnisse</div>`:''}</td><td>${m?dfmt(m.beginn):''}</td><td class="r">${m?eur(m.kaltmiete):''}</td><td class="r">${m?eur(Number(m.betriebskosten||0)+Number(m.heizkosten||0)):''}</td><td class="r">${m?eur(m.kaution):''}</td><td>${st}</td></tr>`;
    if(auf)h+=`<tr><td colspan="9" class="det">${einDetail(u)}</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  document.getElementById('pEin').innerHTML=h;
}
function einDetail(u){
  const L=mvVon(u.id);
  const akt=L.filter(x=>aktuell(x)||(x.beginn&&x.beginn>HEUTE));
  const frueher=L.filter(x=>!akt.includes(x));
  let h='';
  if(!akt.length)h+=`<div class="empty" style="margin-bottom:10px">Kein laufendes Mietverhältnis.</div>`;
  const ub=`<button onclick="einForm('${u.id}')">Einheit bearbeiten</button>${L.some(x=>x.quelle==='mk')?'':`<button onclick="mvForm(null,'${u.id}')">Mieter ohne Mieterkonto erfassen</button>`}`;
  akt.forEach((x,i)=>{h+=mvZeile(x,i===akt.length-1?ub:'');});
  if(!akt.length)h+=`<div class="acts" style="margin-top:0">${ub}</div>`;
  if(frueher.length){
    h+=`<div class="card" style="margin-top:12px"><div class="ch">Frühere Mieter <span class="sub" style="font-weight:400">${frueher.length}</span></div><table class="tab"><thead><tr><th>Name</th><th>Einzug</th><th>Auszug</th><th class="r">Kaltmiete</th><th class="r">Kaution</th></tr></thead><tbody>${frueher.map(x=>`<tr><td>${x.quelle==='mk'?`<button class="lnk" onclick="zumKonto('${jsq(x.pid)}')">${esc(x.mieter_name||'Mieterkonto')}</button>`:esc(x.mieter_name||'–')}</td><td>${dfmt(x.beginn)}</td><td>${x.ende?dfmt(x.ende):'–'}</td><td class="r">${eur(x.kaltmiete)}</td><td class="r">${eur(x.kaution)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  return h;
}
function mvZeile(x,extra){
  const kun=x.beginn&&x.beginn>HEUTE;
  const P=(x.mieter||[]).length?x.mieter:[{name:x.mieter_name}];
  const mail=e=>e?`<a class="lnk" href="mailto:${esc(e)}">${esc(e)}</a>`:'';
  const pers=P.map((p,i)=>(P.length>1?`<div class="sub" style="margin-top:${i?8:0}px">Mieter ${i+1}</div>`:'')+kv('Name',esc(p.name||''))+kv('E-Mail',mail(p.email))+kv('Telefon',esc(p.tel||''))).join('');
  const so=(x.sonstiges||[]);
  const sum=Number(x.kaltmiete||0)+Number(x.betriebskosten||0)+Number(x.heizkosten||0)+so.reduce((s,o)=>s+Number(o.betrag||0),0);
  const miete=kv('Kaltmiete',eur(x.kaltmiete))+kv('Betriebskosten',eur(x.betriebskosten))+kv('Heizkosten',eur(x.heizkosten))+so.map(o=>kv(esc(o.text||'Sonstiges'),eur(o.betrag))).join('')+`<div class="kvr" style="border-top:1px solid var(--line)"><span style="color:var(--ink);font-weight:700">Gesamt</span><b>${eur(sum)}</b></div>`;
  const status=kun?'<span class="pill p-bald">künftig</span>':x.ende?`<span class="pill mid">gekündigt</span>`:'<span class="pill ok">laufend</span>';
  const mv=kv('Status',status)+kv('Einzug',dfmt(x.beginn))+kv('Auszug',x.ende?dfmt(x.ende):'unbefristet')+kv('Kaution',eur(x.kaution))+kv('Verwendungszweck',esc(x.zahlungsreferenz||''))+(x.gewerbe?kv('Art','Gewerbe'):'')+(x.notizen?kv('Notiz',`<span class="warn">${esc(x.notizen)}</span>`):'');
  const knopf=x.quelle==='mk'?`<button class="primary" onclick="zumKonto('${jsq(x.pid)}')">Mieterkonto öffnen</button>`:`<button onclick="mvForm('${x.mvid}')">Mieter bearbeiten</button><span class="warn" style="font-size:12.5px">Kein Mieterkonto vorhanden</span>`;
  return `<div class="cards" style="margin-bottom:8px"><div class="card"><div class="ch">Mieter</div>${pers}</div><div class="card"><div class="ch">Miete pro Monat</div>${miete}</div><div class="card"><div class="ch">Mietverhältnis</div>${mv}</div></div>
   <div class="acts" style="margin:0 0 12px">${knopf}${x.vertrag_datei?`<button onclick="odOeffne('${jsq(x.vertrag_datei)}')">Mietvertrag</button>`:''}${x.onedrive_ordner?`<button onclick="wechsel('dokumente');dokLaden('${jsq(x.onedrive_ordner)}')">Mieterordner</button>`:''}${extra||''}</div>`;
}
function einForm(uid){
  const u=uid?EIN.find(x=>x.id===uid):{aktiv:true};
  dialog(`<h3>${uid?'Einheit bearbeiten':'Einheit anlegen'}</h3><div class="fg">
   <label>Bezeichnung<input class="inp" id="eB" value="${esc(u.bezeichnung||'')}" placeholder="z. B. WE 3"></label>
   <label>Art<input class="inp" id="eA" list="dlArt" value="${esc(u.art||'')}"></label>
   <label>Lage<input class="inp" id="eL" value="${esc(u.lage||'')}" placeholder="z. B. 1. OG links"></label>
   <label>Fläche m²<input class="inp" id="eF" inputmode="decimal" value="${esc(u.flaeche==null?'':String(u.flaeche).replace('.',','))}"></label>
   <label>Zimmer<input class="inp" id="eZ" inputmode="decimal" value="${esc(u.zimmer==null?'':String(u.zimmer).replace('.',','))}"></label>
   <label>Heizung<input class="inp" id="eH" value="${esc(u.heizung||'')}"></label>
   <label class="voll">Ausstattung<input class="inp" id="eS" value="${esc(u.ausstattung||'')}"></label>
   ${uid?`<label class="voll" style="flex-direction:row;align-items:center;gap:8px;text-transform:none;font-size:13.5px;color:var(--text)"><input type="checkbox" id="eX" ${u.aktiv?'checked':''}> Einheit ist aktiv</label>`:''}
  </div><datalist id="dlArt">${['Wohnung','Möbliertes Apartment','Zimmer','Haus','Gewerbe','Garage','Stellplatz','Lager'].map(x=>`<option value="${x}">`).join('')}</datalist>
  <div class="akt"><button class="btn zw" onclick="zu()">Abbrechen</button><button class="btn" id="eOk">Speichern</button></div>`);
  document.getElementById('eOk').onclick=async()=>{
    const n=v=>{v=String(v||'').trim().replace(',','.');return v===''?null:Number(v);};
    const rec={objekt_id:id,bezeichnung:document.getElementById('eB').value.trim(),art:document.getElementById('eA').value.trim()||null,lage:document.getElementById('eL').value.trim()||null,flaeche:n(document.getElementById('eF').value),zimmer:n(document.getElementById('eZ').value),heizung:document.getElementById('eH').value.trim()||null,ausstattung:document.getElementById('eS').value.trim()||null,updated_at:new Date().toISOString()};
    if(!rec.bezeichnung){alert('Bitte eine Bezeichnung angeben.');return;}
    if(uid)rec.aktiv=document.getElementById('eX').checked;else rec.sort=EIN.length+1;
    const {error}=uid?await sb.from('obj_einheiten').update(rec).eq('id',uid):await sb.from('obj_einheiten').insert(rec);
    if(error){alert('Fehler: '+error.message);return;}zu();laden();
  };
}
/* Mieter ohne Mieterkonto (z. B. K10): einfache Erfassung am Objekt */
function mvForm(mid,uid){
  const m=mid?MV.find(x=>x.id===mid):{einheit_id:uid,mieter:[]};
  const pers=(m.mieter||[]).map(p=>[p.name||'',p.email||'',p.tel||''].join('; ')).join('\n');
  const z=v=>v==null?'':String(v).replace('.',',');
  dialog(`<h3>${mid?'Mieter bearbeiten':'Mieter ohne Mieterkonto erfassen'}</h3><div class="hinw"><span>Für laufende Mieter bitte ein Mieterkonto anlegen, dann laufen Sollstellungen und Mahnwesen darüber.</span></div><div class="fg">
   <label class="voll">Mieter (je Zeile: Name; E-Mail; Telefon)<textarea class="inp" id="mP" rows="3">${esc(pers)}</textarea></label>
   <label>Mietbeginn<input class="inp" type="date" id="mB" value="${esc(m.beginn||'')}"></label>
   <label>Mietende<input class="inp" type="date" id="mE" value="${esc(m.ende||'')}"></label>
   <label>Kaltmiete<input class="inp" id="mK" inputmode="decimal" value="${z(m.kaltmiete)}"></label>
   <label>Kaution<input class="inp" id="mKa" inputmode="decimal" value="${z(m.kaution)}"></label>
   <label class="voll">Notiz<input class="inp" id="mN" value="${esc(m.notizen||'')}"></label>
  </div><div class="akt">${mid?'<button class="btn rot" id="mDel">Löschen</button>':''}<button class="btn zw" onclick="zu()">Abbrechen</button><button class="btn" id="mOk">Speichern</button></div>`);
  const n=v=>{v=String(v||'').trim();if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return v===''||isNaN(Number(v))?null:Number(v);};
  document.getElementById('mOk').onclick=async()=>{
    const P=document.getElementById('mP').value.split('\n').map(l=>l.split(';').map(s=>s.trim())).filter(a=>a[0]).map(a=>({name:a[0],email:a[1]||undefined,tel:a[2]||undefined}));
    const rec={einheit_id:m.einheit_id,mieter:P,mieter_name:P.map(p=>p.name).join(', ')||null,beginn:document.getElementById('mB').value||null,ende:document.getElementById('mE').value||null,kaltmiete:n(document.getElementById('mK').value),kaution:n(document.getElementById('mKa').value),notizen:document.getElementById('mN').value.trim()||null,updated_at:new Date().toISOString()};
    if(!mid)rec.quelle='Im OS erfasst';
    const {error}=mid?await sb.from('obj_mietverhaeltnisse').update(rec).eq('id',mid):await sb.from('obj_mietverhaeltnisse').insert(rec);
    if(error){alert('Fehler: '+error.message);return;}zu();laden();
  };
  if(mid)document.getElementById('mDel').onclick=async()=>{if(!confirm('Eintrag wirklich löschen?'))return;const {error}=await sb.from('obj_mietverhaeltnisse').delete().eq('id',mid);if(error){alert(error.message);return;}zu();laden();};
}

/* ---------- Verträge: Quelle ist das Vertragsregister des OS ---------- */
const VSORT=['Versicherung','Versorger','Verwaltung'];
function zumVertrag(vid){(window.top||window).location.href='/hausverwaltung/vertraege?id='+encodeURIComponent(vid);}
function renderVer(){
  let h=`<div class="sec"><h2>Verträge &amp; Versorger <span class="rechts"><button class="btn kl" onclick="(window.top||window).location.href='/hausverwaltung/vertraege?neu=1&obj=${encodeURIComponent(OB.kz)}'">Vertrag anlegen</button></span></h2>
   <div class="muted" style="font-size:12.5px;margin:-4px 0 10px">Die Verträge kommen aus dem Vertragsregister. Ein Klick öffnet den Vertrag dort.</div>`;
  if(!VL.length){document.getElementById('pVer').innerHTML=h+'<div class="empty">Für dieses Objekt sind noch keine Verträge erfasst.</div></div>';return;}
  const st=v=>v.quelle==='vorschlag'?'<span class="pill p-bald">zu prüfen</span>':(v.ende&&v.ende<HEUTE?'<span class="pill">beendet</span>':'<span class="pill p-ok">aktiv</span>');
  const gr=[...new Set(VL.map(v=>v.art||'Sonstiges'))].sort((a,b)=>(VSORT.indexOf(a)<0?9:VSORT.indexOf(a))-(VSORT.indexOf(b)<0?9:VSORT.indexOf(b)));
  gr.forEach(g=>{h+=`<div class="vgrp">${esc(g==='Verwaltung'?'Verwaltung & Sonstiges':g==='Versicherung'?'Versicherungen':g)}</div>`;
    VL.filter(v=>(v.art||'Sonstiges')===g).sort((a,b)=>String(a.sparte||'').localeCompare(String(b.sparte||''),'de')).forEach(v=>{
      const d=[v.vnr&&'Vertrag: '+v.vnr,v.knr&&'Kunde: '+v.knr,v.zaehler&&'Zähler: '+v.zaehler,v.start&&'ab '+dfmt(v.start),v.ende&&'bis '+dfmt(v.ende),v.betrag!=null&&v.betrag!==''&&eur(v.betrag)+(v.rhythmus?' '+v.rhythmus:'')].filter(Boolean);
      h+=`<div class="vk" style="cursor:pointer" onclick="zumVertrag('${esc(v.id)}')"><div class="k"><b>${esc(v.sparte||'')}${v.anbieter?' · '+esc(v.anbieter):''}</b>${st(v)}</div>${d.length?`<div class="d">${d.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}${v.notiz?`<div class="n">${esc(String(v.notiz).slice(0,220))}</div>`:''}</div>`;});});
  document.getElementById('pVer').innerHTML=h+'</div>';
}

/* ---------- OneDrive ---------- */
async function token(){const {data}=await sb.auth.getSession();return data&&data.session?data.session.access_token:'';}
async function odApi(body){let r;try{r=await fetch('/api/onedrive',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await token()},body:JSON.stringify(body)});}catch(e){throw new Error('OneDrive nicht erreichbar.');}
  let j=null;try{j=await r.json();}catch(e){}if(!j)throw new Error('OneDrive nicht erreichbar ('+r.status+').');if(j.error)throw new Error(j.error);return j;}
const voll=p=>{p=String(p||'').replace(/^\/+|\/+$/g,'');return p.startsWith(ROOT)?p:ROOT+'/'+p;};
async function odOeffne(pfad){
  const w=window.open('','_blank');
  try{const p=voll(pfad);const i=p.lastIndexOf('/');const j=await odApi({aktion:'ordner',pfad:p.slice(0,i)});
    const f=(j.eintraege||[]).find(x=>x.name===p.slice(i+1));
    if(!f){if(w)w.close();alert('Datei nicht gefunden: '+p.slice(i+1));return;}
    if(w)w.location.href=f.web;else window.open(f.web,'_blank');
  }catch(e){if(w)w.close();alert(e.message);}
}
let DOKPFAD='';
async function dokLaden(p){
  DOKPFAD=voll(p||OB.onedrive_pfad||'');const box=document.getElementById('pDok');
  const basis=voll(OB.onedrive_pfad||'');
  const teile=DOKPFAD.slice(basis.length).split('/').filter(Boolean);
  let k=`<div class="krume"><button onclick="dokLaden('${esc(basis).replace(/'/g,"\\'")}')">${esc(OB.kz)}</button>`;let acc=basis;
  teile.forEach(t=>{acc+='/'+t;k+=` / <button onclick="dokLaden('${esc(acc).replace(/'/g,"\\'")}')">${esc(t)}</button>`;});k+='</div>';
  box.innerHTML=`<div class="sec"><h2>Dokumente in OneDrive</h2>${k}<div class="empty">Lädt …</div></div>`;
  try{const j=await odApi({aktion:'ordner',pfad:DOKPFAD});const L=j.eintraege||[];
    box.innerHTML=`<div class="sec"><h2>Dokumente in OneDrive <span class="rechts muted" style="font-size:12px;text-transform:none;letter-spacing:0;font-weight:600">${esc(DOKPFAD.replace(ROOT+'/',''))}</span></h2>${k}${L.length?`<div class="od">${L.filter(x=>!x.name.startsWith('.')).map(x=>`<div class="z" onclick="${x.ordner?`dokLaden('${esc(DOKPFAD+'/'+x.name).replace(/'/g,"\\'")}')`:`window.open('${esc(x.web)}','_blank')`}"><span class="typ">${x.ordner?'Ordner':(x.name.split('.').pop()||'')}</span><span>${esc(x.name)}</span><span class="dt">${x.ordner?'':dfmt(x.geaendert)}</span></div>`).join('')}</div>`:'<div class="empty">Ordner ist leer.</div>'}</div>`;
  }catch(e){box.innerHTML=`<div class="sec"><h2>Dokumente in OneDrive</h2>${k}<div class="empty">${esc(e.message)}</div></div>`;}
}
laden();
