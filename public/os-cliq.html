<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cliq</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f5f8;--card:#ffffff;--ink:#18202c;--muted:#5f6b7a;--line:#e0e5eb;--soft:#eef1f5;--accent:#2f5d8a;--accent-ink:#ffffff;--accent-soft:#e3ecf5;--neg:#b42318;--neg-bg:#fcebe9;--warn:#946200;--warn-bg:#fff4d6;--pos:#1d7a4c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:34px;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button:disabled{opacity:.55;cursor:default}
.app{display:flex;flex-direction:column;height:100vh}
.kopf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:20px;font-weight:800}
.sub{color:var(--muted);font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.haupt{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0}
.liste{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lk{padding:8px;border-bottom:1px solid var(--line)}
.inp{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
.chats{overflow:auto;flex:1}
.grp>summary{list-style:none;cursor:pointer;padding:8px 12px;font-weight:700;font-size:13px;color:var(--accent);display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);background:var(--soft)}
.grp>summary::-webkit-details-marker{display:none}.grp>summary::before{content:'▸';color:var(--muted);margin-right:6px}.grp[open]>summary::before{content:'▾'}
.grp>summary span:first-child{flex:1}.grp .n{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:0 7px}
.gleer{padding:8px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.chat{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:9px 12px;min-height:0}
.chat:hover{background:var(--soft)}.chat.on{background:var(--accent-soft)}
.chat .z1{display:flex;justify-content:space-between;gap:8px}
.chat b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .vor{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat.neu b{color:var(--accent)}.chat.neu{box-shadow:inset 3px 0 0 var(--accent)}
.rechts{display:flex;flex-direction:column;min-height:0}
@media(min-width:801px){[data-a=zurueck]{display:none}}
.rk{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.verlauf{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:72%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 11px;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ich{align-self:flex-end;background:var(--accent-soft);border-color:#c9d8ea}
.msg .w{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.msg a{color:var(--accent)}
.datei{display:flex;gap:8px;align-items:center;margin-top:4px;padding:7px 10px;background:var(--soft);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px}
.datei:hover{border-color:var(--accent)}.datei .dn{font-weight:600;overflow-wrap:anywhere}
.bild{display:block;max-width:280px;max-height:220px;border-radius:8px;margin-top:4px;cursor:zoom-in;border:1px solid var(--line)}
.voll{position:fixed;inset:0;background:rgba(10,14,20,.85);display:flex;align-items:center;justify-content:center;z-index:100;cursor:zoom-out}.voll img{max-width:94vw;max-height:92vh;border-radius:8px}
.anh{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;grid-column:1/-1}.anh span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px}
label.up{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--card);cursor:pointer;min-height:34px}
.tag{align-self:center;font-size:11.5px;color:var(--muted);margin:6px 0}
.eingabe{border-top:1px solid var(--line);background:var(--card);padding:10px 16px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.eingabe textarea{width:100%;min-height:44px;max-height:180px;resize:vertical;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.leer{color:var(--muted);text-align:center;padding:40px 16px}
.karte{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px;max-width:640px;margin:30px auto}
.karte ol{padding-left:20px;margin:8px 0}.karte li{margin:4px 0}
code{background:var(--soft);border-radius:4px;padding:1px 5px;font-size:13px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:120}.toast.on{opacity:1}
@media(max-width:800px){.haupt{grid-template-columns:1fr}.haupt.offen .liste{display:none}.haupt:not(.offen) .rechts{display:none}}
</style></head><body>
<div class="app" id="app"><div class="leer">Lädt …</div></div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const p2=n=>String(n).padStart(2,'0');
let GR=null,GROFFEN={},UID='';try{GROFFEN=JSON.parse(localStorage.getItem('cliq_gr_offen')||'{}')||{};}catch(e){}
const STANDARDGRUPPEN={'Allgemein':[],'Kollegen':['Eric Eisenhardt','Jürgen Reuter','Mustafa Frotan','Stephan Klopsch'],'Private Immobilien EE':[],'Wohntraum':[]};

const merkeGelesen=()=>{try{localStorage.setItem('cliq_gelesen',JSON.stringify(GELESEN));}catch(e){}};
function toast(t,ms){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),ms||3800);}
async function token(){const {data}=await sb.auth.getSession();return data&&data.session?data.session.access_token:'';}
async function api(body){let r;try{r=await fetch('/api/cliq',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await token()},body:JSON.stringify(body)});}catch(e){throw new Error('Cliq nicht erreichbar.');}
  let j=null;try{j=await r.json();}catch(e){}if(!j)throw new Error('Cliq nicht erreichbar ('+r.status+').');if(j.error){const e=new Error(j.error);e.verbinden=j.verbinden;throw e;}return j;}
const heute=new Date();
function wann(ms,lang){if(!ms)return '';const d=new Date(ms),gleich=d.toDateString()===new Date().toDateString();const hm=p2(d.getHours())+':'+p2(d.getMinutes());
  if(lang)return hm;if(gleich)return hm;return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.';}
function tagText(ms){const d=new Date(ms),h=new Date();const g=new Date(h.getFullYear(),h.getMonth(),h.getDate()).getTime(),t=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  return t===g?'Heute':t===g-864e5?'Gestern':d.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});}
function verlinken(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,u=>'<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>');}
const ungelesen=c=>c.letzte&&c.letzte.vonId!==ICH&&c.letzte.zeit>(GELESEN[c.id]||0);

const chatBtn=c=>'<button class="chat'+(c.id===AKT?' on':'')+(ungelesen(c)?' neu':'')+'" data-chat="'+esc(c.id)+'"><div class="z1"><b>'+esc(c.name||'Chat')+'</b><span class="sub">'+wann(c.letzte?c.letzte.zeit:c.geaendert)+'</span></div><div class="vor">'+(c.letzte?esc((c.letzte.vonId===ICH?'Du: ':c.letzte.von&&c.typ!=='direct_message'?c.letzte.von.split(' ')[0]+': ':'')+c.letzte.text):(c.typ==='channel'?'Kanal':''))+'</div></button>';
const gruppeVon=id=>{if(!GR)return '';for(const g in GR.gruppen)if(GR.gruppen[g].includes(id))return g;return '';};
function listeHtml(L,q){if(!L.length)return '<div class="leer">'+(BUSY==='chats'?'Lädt …':'Keine Chats gefunden.')+'</div>';
  if(q||!GR)return L.map(chatBtn).join('');
  let h='';const namen=Object.keys(GR.gruppen).sort((a,b)=>a.localeCompare(b,'de'));
  for(const g of namen){const C=L.filter(c=>GR.gruppen[g].includes(c.id)),nu=C.filter(ungelesen).length,offen=GROFFEN[g]!==false;
    h+='<details class="grp" data-gr="'+esc(g)+'"'+(offen?' open':'')+'><summary><span>'+esc(g)+'</span>'+(nu?'<span class="n">'+nu+'</span>':'')+'</summary>'
      +(C.length?C.map(chatBtn).join(''):'<div class="gleer">Noch leer. Chat öffnen und oben rechts die Gruppe „'+esc(g)+'“ wählen. <button class="ghost" style="min-height:0;padding:0 4px;font-size:12px" data-grweg="'+esc(g)+'">Gruppe entfernen</button></div>')+'</details>';}
  const rest=L.filter(c=>!gruppeVon(c.id));
  if(rest.length)h+='<details class="grp" data-gr="__rest"'+(GROFFEN.__rest!==false?' open':'')+'><summary><span>Weitere Chats</span>'+(rest.filter(ungelesen).length?'<span class="n">'+rest.filter(ungelesen).length+'</span>':'')+'</summary>'+rest.map(chatBtn).join('')+'</details>';
  return h;}
async function gruppenLaden(){try{const {data:u}=await sb.auth.getUser();UID=u&&u.user&&u.user.id||'';
    const {data}=await sb.from('os_docs').select('data').eq('app','oc').eq('pfad','cliq/gruppen/'+UID).maybeSingle();GR=data&&data.data&&data.data.gruppen?data.data:null;}catch(e){GR=null;}
  if(!GR){GR={gruppen:{}};for(const g in STANDARDGRUPPEN){GR.gruppen[g]=CHATS.filter(c=>c.name.toLowerCase()===g.toLowerCase()||(c.typ!=='channel'&&STANDARDGRUPPEN[g].some(n=>c.name.toLowerCase().includes(n.toLowerCase().split(' ').slice(-1)[0])))).map(c=>c.id);}
    gruppenSpeichern();}}
async function gruppenSpeichern(){if(!UID)return;try{await sb.from('os_docs').upsert({app:'oc',pfad:'cliq/gruppen/'+UID,data:GR,updated_at:new Date().toISOString()});}catch(e){}}
function gruppeSetzen(id,g){g=String(g||'').trim();if(g===gruppeVon(id))return;for(const k in GR.gruppen)GR.gruppen[k]=GR.gruppen[k].filter(x=>x!==id);if(g){if(!GR.gruppen[g])GR.gruppen[g]=[];GR.gruppen[g].push(id);GROFFEN[g]=true;}gruppenSpeichern();render();toast(g?'In Gruppe „'+g+'“ verschoben.':'Aus der Gruppe genommen.');}
const groesse=b=>!b?'':b<1024*1024?Math.max(1,Math.round(b/1024))+' KB':(b/1024/1024).toFixed(1).replace('.',',')+' MB';
const istBild=d=>/^image\//.test(d.typ||'')||/\.(jpe?g|png|gif|webp|heic)$/i.test(d.name||'');
function dateiHtml(d){if(istBild(d)){const u=BILD[d.id];if(u===undefined){BILD[d.id]=null;dateiLaden(d,true);}
    return u?'<img class="bild" src="'+u+'" data-voll="'+esc(d.id)+'" alt="'+esc(d.name)+'">':'<div class="datei" data-datei="'+esc(d.id)+'" data-dn="'+esc(d.name)+'"><span class="dn">'+esc(d.name)+'</span><span class="sub">'+(u===false?'Bild nicht ladbar, klicken zum Öffnen':'Bild lädt …')+'</span></div>';}
  return '<div class="datei" data-datei="'+esc(d.id)+'" data-dn="'+esc(d.name)+'"><span class="dn">'+esc(d.name)+'</span><span class="sub">'+groesse(d.groesse)+' · öffnen</span></div>';}
async function dateiHolen(id){const r=await fetch('/api/cliq/datei',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await token()},body:JSON.stringify({id})});
  if(!r.ok){let j={};try{j=await r.json();}catch(e){}throw new Error(j.error||('Datei nicht ladbar ('+r.status+').'));}return await r.blob();}
async function dateiLaden(d,still){try{const b=await dateiHolen(d.id);BILD[d.id]=URL.createObjectURL(b);render();}catch(e){BILD[d.id]=false;if(!still)toast(e.message);render();}}
async function dateiOeffnen(id,name){const w=window.open('','_blank');try{const b=await dateiHolen(id);const u=URL.createObjectURL(b);
    if(/pdf|image|text/.test(b.type)&&w){w.location.href=u;}else{if(w)w.close();const a=document.createElement('a');a.href=u;a.download=name||'Datei';document.body.appendChild(a);a.click();a.remove();}}
  catch(e){if(w)w.close();toast(e.message||String(e),8000);}}
function render(){const app=document.getElementById('app');const fokus=document.activeElement&&document.activeElement.id,pos=fokus&&document.activeElement.selectionStart,fwert=fokus==='gruppe'?document.activeElement.value:null;
  if(!ST){app.innerHTML='<div class="leer">Lädt …</div>';return;}
  let h='<div class="kopf"><div><h1>Cliq</h1><div class="sub">'+(ST.verbunden?'verbunden als '+esc(ST.name||ST.mail||''):'Chats mit den Kollegen direkt im OS')+'</div></div><div class="acts">'
    +(ST.verbunden?'<button data-a="neu"'+(BUSY?' disabled':'')+'>Aktualisieren</button><button class="ghost" data-a="trennen">Verbindung trennen</button>':'')+'</div></div>';
  if(!ST.eingerichtet){h+='<div class="karte"><h2 style="margin-bottom:6px">Cliq ist noch nicht eingerichtet</h2><p class="sub">Einmalig für das ganze Team:</p><ol>'
    +'<li>In der <b>Zoho API Console</b> (api-console.zoho.eu) einen Zugang vom Typ <b>Server-based Applications</b> anlegen.</li>'
    +'<li>Homepage: <code>'+esc(location.origin)+'</code>, Weiterleitungs-URL: <code>'+esc(location.origin)+'/api/cliq/rueckkehr</code></li>'
    +'<li>Client ID und Client Secret in Vercel eintragen als <code>CLIQ_CLIENT_ID</code> und <code>CLIQ_CLIENT_SECRET</code>, dann neu bereitstellen.</li>'
    +'<li>Danach verbindet jeder hier einmal sein eigenes Cliq-Konto.</li></ol></div>';app.innerHTML=h;return;}
  if(!ST.verbunden){h+='<div class="karte" style="text-align:center"><h2 style="margin-bottom:6px">Cliq-Konto verbinden</h2><p class="sub" style="margin-bottom:14px">Einmal mit deinem Zoho-Konto anmelden. Danach siehst du hier deine Chats und schreibst unter deinem Namen.</p><button class="primary" data-a="verbinden">Mit Cliq verbinden</button>'
    +'<div class="sub" style="margin-top:18px;text-align:left">Falls Zoho „Ungültige Weiterleitungs-URI“ meldet: In der Zoho API Console (zoho.'+esc(ST.dc||'eu')+') beim Client'+(ST.client?' mit der Client ID '+esc(ST.client)+'…':'')+' unter „Autorisierte Umleitungs-URIs“ genau diese Adresse eintragen:<br><code style="user-select:all">'+esc(ST.rueckkehr||'')+'</code></div></div>';app.innerHTML=h;return;}
  if(ST.mail&&ST.osMail&&ST.mail.toLowerCase()!==ST.osMail.toLowerCase())h+='<div class="note" style="margin:10px 18px 0">Achtung: Cliq ist mit dem Zoho-Konto <b>'+esc(ST.mail)+'</b> verbunden, du bist im OS aber als <b>'+esc(ST.osMail)+'</b> angemeldet. Nachrichten gehen unter diesem fremden Namen raus. Bitte „Verbindung trennen“, dich bei Zoho abmelden und mit deinem eigenen Zugang neu verbinden.</div>';
  const q=SUCHE.trim().toLowerCase(),L=CHATS.filter(c=>!q||(c.name+' '+(c.letzte?c.letzte.text:'')).toLowerCase().includes(q));
  const ak=CHATS.find(c=>c.id===AKT);
  h+='<div class="haupt'+(AKT?' offen':'')+'"><div class="liste"><div class="lk"><input class="inp" type="search" id="suche" placeholder="Chat suchen …" value="'+esc(SUCHE)+'" autocomplete="off"></div><div class="chats">'
    +(FEHLER?'<div class="note">'+esc(FEHLER)+'</div>':'')
    +listeHtml(L,q)
    +'</div></div><div class="rechts">';
  if(!ak)h+='<div class="leer">Einen Chat auswählen.</div>';
  else{h+='<div class="rk acts" style="justify-content:space-between"><div class="acts"><button class="ghost" data-a="zurueck" style="padding:4px 6px">Zurück</button><b>'+esc(ak.name)+'</b>'+(ak.typ==='channel'?'<span class="sub">Kanal</span>':'')+'</div>'+(GR?'<div class="acts"><span class="sub">Gruppe</span><input class="inp" id="gruppe" list="dl-gr" value="'+esc(gruppeVon(ak.id))+'" placeholder="Gruppe wählen oder neu eintippen …" style="width:230px;padding:5px 9px" autocomplete="off"><datalist id="dl-gr">'+Object.keys(GR.gruppen).sort((a,b)=>a.localeCompare(b,'de')).map(g=>'<option value="'+esc(g)+'">').join('')+'</datalist></div>':'')+'</div><div class="verlauf" id="verlauf">';
    let letzterTag='';
    for(const m of MSG){const t=tagText(m.zeit);if(t!==letzterTag){h+='<div class="tag">'+esc(t)+'</div>';letzterTag=t;}
      const ich=m.vonId===ICH;h+='<div class="msg'+(ich?' ich':'')+'"><div class="w">'+(ich?'Du':esc(m.von))+' · '+wann(m.zeit,true)+'</div>'+(m.text?verlinken(m.text):'')+(m.datei?dateiHtml(m.datei):(!m.text?'('+esc(m.typ)+')':''))+'</div>';}
    if(!MSG.length)h+='<div class="leer">'+(BUSY==='msg'?'Lädt …':'Noch keine Nachrichten.')+'</div>';
    h+='</div><div class="eingabe"><textarea id="text" placeholder="Nachricht schreiben … (Enter sendet, Umschalt+Enter für neue Zeile)">'+esc(ENTWURF[AKT]||'')+'</textarea><div class="acts" style="flex-direction:column;align-items:stretch"><label class="up">Datei<input type="file" id="dateiwahl" multiple hidden></label><button class="primary" data-a="senden"'+(BUSY==='senden'?' disabled':'')+'>'+(BUSY==='senden'?'Sendet …':'Senden')+'</button></div>'+(ANH.length?'<div class="anh">'+ANH.map((f,i)=>'<span>'+esc(f.name)+' <button class="ghost" style="min-height:0;padding:0 4px" data-anhweg="'+i+'">x</button></span>').join('')+'</div>':'')+'</div>';}
  h+='</div></div>';
  const cl0=document.querySelector('.chats'),clTop=cl0?cl0.scrollTop:0;
  const v0=document.getElementById('verlauf'),unten=!v0||v0.scrollHeight-v0.scrollTop-v0.clientHeight<60,alt=v0?v0.scrollTop:0;
  app.innerHTML=h;
  const v=document.getElementById('verlauf');if(v)v.scrollTop=unten?v.scrollHeight:alt;
  if(v&&unten)v.querySelectorAll('img').forEach(im=>{if(!im.complete)im.addEventListener('load',()=>{v.scrollTop=v.scrollHeight;},{once:true});});
  const cl=document.querySelector('.chats');if(cl)cl.scrollTop=clTop;
  if(fokus){const n=document.getElementById(fokus);if(n){if(fwert!=null)n.value=fwert;n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}}}

async function chatsLaden(still){if(!still){BUSY='chats';render();}
  try{const j=await api({aktion:'chats'});CHATS=j.chats||[];ICH=j.ich||ICH;FEHLER='';}catch(e){FEHLER=e.message||String(e);}
  if(BUSY==='chats')BUSY='';render();}
async function nachrichtenLaden(still){if(!AKT)return;const id=AKT;if(!still){BUSY='msg';MSG=[];render();}
  try{const j=await api({aktion:'nachrichten',chat:id});if(id!==AKT)return;MSG=j.nachrichten||[];ICH=j.ich||ICH;
    const c=CHATS.find(x=>x.id===id),last=MSG.length?MSG[MSG.length-1]:null;if(last&&c){c.letzte={von:last.von,vonId:last.vonId,zeit:last.zeit,text:last.text};}
    GELESEN[id]=Math.max(GELESEN[id]||0,last?last.zeit:Date.now());merkeGelesen();}
  catch(e){if(!still)toast(e.message||String(e),6000);}
  if(BUSY==='msg')BUSY='';render();}
async function senden(){const ta=document.getElementById('text');const t=(ta&&ta.value||'').trim();if(!AKT)return;
  if(ANH.length){const gr=ANH.reduce((a,f)=>a+f.size,0);if(gr>4*1024*1024){toast('Zusammen höchstens 4 MB. Größere Dateien bitte direkt in Cliq senden.',6000);return;}
    BUSY='senden';render();try{const fd=new FormData();fd.append('chat',AKT);if(t)fd.append('text',t);for(const f of ANH)fd.append('file',f,f.name);
      const r=await fetch('/api/cliq/datei',{method:'POST',headers:{authorization:'Bearer '+await token()},body:fd});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||('Fehler '+r.status));
      ANH=[];ENTWURF[AKT]='';await nachrichtenLaden(true);}catch(e){toast(e.message||String(e),8000);}BUSY='';render();return;}
  if(!t)return;
  BUSY='senden';ENTWURF[AKT]=t;render();
  try{await api({aktion:'senden',chat:AKT,text:t});ENTWURF[AKT]='';await nachrichtenLaden(true);}catch(e){toast(e.message||String(e),6000);}
  BUSY='';render();const n=document.getElementById('text');if(n)n.focus();}
async function verbinden(){const w=window.open('','cliqlogin','width=620,height=760');try{const j=await api({aktion:'verbinden'});if(w)w.location.href=j.url;else location.href=j.url;}catch(e){if(w)w.close();toast(e.message||String(e),6000);}}
async function status(){try{ST=await api({aktion:'status'});try{const {data}=await sb.auth.getSession();ST.osMail=data&&data.session&&data.session.user&&data.session.user.email||'';}catch(x){}}catch(e){ST={eingerichtet:true,verbunden:false};FEHLER=e.message;}
  if(ST.verbunden){ICH=ST.id||'';await chatsLaden();await gruppenLaden();render();const c=new URLSearchParams(location.search).get('chat');if(c&&CHATS.some(x=>x.id===c)){AKT=c;nachrichtenLaden();}}else render();}

const A={
  verbinden:()=>verbinden(),
  trennen:async()=>{if(!confirm('Verbindung zu Cliq trennen? Du kannst dich jederzeit wieder verbinden.'))return;try{await api({aktion:'trennen'});}catch(e){}ST.verbunden=false;CHATS=[];AKT='';render();},
  neu:()=>{chatsLaden();if(AKT)nachrichtenLaden(true);},
  senden:()=>senden(),zurueck:()=>{AKT='';render();},
};
document.addEventListener('click',e=>{const l=e.target.closest('a[href]');if(l){try{const u=new URL(l.href);if(u.origin===location.origin&&window.top!==window){e.preventDefault();window.top.postMessage({osOeffne:u.pathname+u.search},location.origin);}}catch(x){}return;}
  const dv=e.target.closest('[data-voll]');if(dv){const v=document.createElement('div');v.className='voll';v.innerHTML='<img src="'+dv.src+'">';v.onclick=()=>v.remove();document.body.appendChild(v);return;}
  const dd=e.target.closest('[data-datei]');if(dd){dateiOeffnen(dd.dataset.datei,dd.dataset.dn);return;}
  const aw=e.target.closest('[data-anhweg]');if(aw){ANH.splice(+aw.dataset.anhweg,1);render();return;}
  const gw=e.target.closest('[data-grweg]');if(gw){e.preventDefault();const g=gw.dataset.grweg;if(confirm('Gruppe „'+g+'“ entfernen?')){delete GR.gruppen[g];gruppenSpeichern();render();}return;}
  const b=e.target.closest('[data-a],[data-chat]');if(!b||b.disabled)return;
  if(b.dataset.a&&A[b.dataset.a]){A[b.dataset.a]();return;}
  if(b.dataset.chat){const ta=document.getElementById('text');if(ta&&AKT)ENTWURF[AKT]=ta.value;AKT=b.dataset.chat;nachrichtenLaden();}});
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input[list]')){t.dataset.alt=t.value;t.value='';}});
document.addEventListener('focusout',e=>{const t=e.target;if(t.matches&&t.matches('input[list]')&&!t.value&&t.dataset.alt){t.value=t.dataset.alt;}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='dateiwahl'){ANH=ANH.concat([...t.files]);t.value='';render();return;}if(t.id==='gruppe'&&AKT){gruppeSetzen(AKT,t.value);}});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.matches&&d.matches('details.grp')){GROFFEN[d.dataset.gr]=d.open;try{localStorage.setItem('cliq_gr_offen',JSON.stringify(GROFFEN));}catch(x){}}},true);
document.addEventListener('input',e=>{const t=e.target;if(t.id==='suche'){SUCHE=t.value;render();}else if(t.id==='text'&&AKT)ENTWURF[AKT]=t.value;});
document.addEventListener('keydown',e=>{if(e.target.id==='text'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();senden();}});
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.cliqVerbunden){toast('Cliq ist verbunden.');status();}});
// regelmäßig aktualisieren, solange die Seite sichtbar ist
setInterval(()=>{if(document.visibilityState==='visible'&&ST&&ST.verbunden&&BUSY!=='senden')nachrichtenLaden(true);},12000);
setInterval(()=>{if(document.visibilityState==='visible'&&ST&&ST.verbunden)chatsLaden(true);},40000);
status();
</script></body></html>
