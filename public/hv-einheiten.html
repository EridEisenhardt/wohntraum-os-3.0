<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hausverwaltung · Einheiten</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f7f9;--surf:#ffffff;--surf2:#f1f3f6;--line:#e4e7ec;--text:#1c2230;--muted:#6b7280;--accent:#6d4ef0;--accent2:#8266ff;--gold:#b07d1a;--green:#0f9d6b;--red:#d64550;--amber:#c7851d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:none;margin:0 auto;padding:22px 26px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:26px;font-weight:800;color:var(--gold)}
.sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.topbtns{display:flex;gap:8px;align-items:center}
.btn{font:inherit;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surf);color:var(--text);cursor:pointer}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.btn:hover{border-color:var(--accent)}
.seg{display:inline-flex;background:var(--surf);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border:none;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.tabs{display:flex;gap:7px;margin-bottom:13px}
.tabs button{font:inherit;font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:transparent}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar input{font:inherit;font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surf);color:var(--text);min-width:280px;flex:1}
.bar select{font:inherit;font-size:12.5px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surf);color:var(--text)}
.objban{display:none;align-items:center;gap:10px;background:#efeafe;border:1px solid var(--accent);border-radius:10px;padding:8px 13px;margin-bottom:12px;font-size:13px}
.objban b{color:var(--accent2)} .objban a{margin-left:auto;color:var(--accent2);font-weight:700}
.count{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .ph{height:160px;background:var(--surf2) center/cover no-repeat;position:relative}
.card .ph .kzb{position:absolute;top:9px;left:9px;background:#000b;color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px}
.card .ph .st{position:absolute;top:9px;right:9px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;color:#fff}
.st.leer{background:var(--amber)} .st.belegt{background:var(--green)}
.card .bd{padding:13px 15px}
.card .t{font-weight:700;font-size:15px}
.card .a{font-size:12px;color:var(--muted);margin-top:2px}
.card .dims{font-size:11.5px;color:var(--muted);margin-top:7px}
.card .ten{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;font-size:12px}
.card .ten .who{font-weight:600} .card .ten.leer .who{color:var(--amber)}
.card .own{font-size:11px;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:13px;background:var(--surf)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--surf2);position:sticky;top:0}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surf2)}
.kz{font-size:11px;font-weight:700;color:var(--accent);background:#efeafe;padding:2px 8px;border-radius:6px}
.pill{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff}
.right{text-align:right} .money{font-weight:700;white-space:nowrap}
#map{height:68vh;border:1px solid var(--line);border-radius:13px}
.hide{display:none!important}
.wrap,.main,.layout,main{max-width:none!important}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div><h1>Portfolio · Einheiten</h1><div class="sub">Übersicht aller Einheiten. Klick auf eine Karte öffnet die Landingpage mit Stammdaten, Mieter, Zählern &amp; Finanzen. Live aus Nahaus.</div></div>
    <div class="topbtns">
      <div class="seg" id="viewseg"><button data-v="cards" class="on">▦ Kacheln</button><button data-v="list">☰ Liste</button><button data-v="map">🗺 Karte</button></div>
      <a class="btn" href="/hausverwaltung/objekte" target="_top">Objekte →</a>
    </div>
  </div>

  <div class="objban" id="objban"></div>
  <div class="tabs" id="tabs">
    <button data-f="alle" class="on">Alle</button>
    <button data-f="belegt">Vermietet</button>
    <button data-f="leer">Leerstand</button>
  </div>
  <div class="bar">
    <input id="q" placeholder="🔍 Adresse, Stadt, WE-Nr., Mieter, Vermieter …" oninput="render()">
    <select id="ort" onchange="render()"><option value="">Alle Städte</option></select>
    <select id="kat" onchange="render()"><option value="">Alle Kategorien</option></select>
    <select id="eig" onchange="render()"><option value="">Alle Vermieter</option></select>
    <select id="hv" onchange="render()"><option value="">Alle Hausverwaltungen</option></select>
    <span class="count" id="cnt"></span>
  </div>

  <div id="v_cards" class="cards"></div>
  <div id="v_list" class="hide"><div class="scroll"><table><thead><tr>
    <th>Einheit</th><th>Adresse</th><th>Größe</th><th>Status / Mieter</th><th class="right">Kaltmiete</th><th>Vermieter</th>
  </tr></thead><tbody id="tb"></tbody></table></div></div>
  <div id="v_map" class="hide"><div id="map"></div></div>
</div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const eur=n=>(n==null?'—':new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n));
const KAT={APARTMENT:'Wohnung',RESIDENTIAL_UNIT:'Wohnung',COMMERCIAL:'Gewerbe',COMMERCIAL_UNIT:'Gewerbe',GARAGE:'Garage',PARKING:'Stellplatz',PARKING_SPACE:'Stellplatz',OUTDOOR_PARKING:'Stellplatz',OFFICE:'Büro',STORAGE:'Lager'};
let EINH=[],OBJ={},CUR={},view='cards',statusF='alle',mapObj=null,markers=null;
const FOCUS_HID='H8'; // nur Objekt KW30 (Kellerweg 30) anzeigen; auf '' setzen, um wieder alle zu zeigen
const params=new URLSearchParams(location.search), objParam=params.get('obj')||'';

async function load(){
  const [e,o,m]=await Promise.all([
    sb.from('nahaus_einheiten').select('*'),
    sb.from('nahaus_objekte').select('*').eq('geloescht',false),
    sb.from('nahaus_mietverhaeltnisse').select('*').eq('is_current',true)
  ]);
  (o.data||[]).forEach(x=>{if(!FOCUS_HID||x.h_id_text===FOCUS_HID)OBJ[x.id]=x;});
  (m.data||[]).forEach(x=>{CUR[x.unit_id]=x;});
  EINH=(e.data||[]).filter(u=>OBJ[u.property_id]).map(u=>{const ob=OBJ[u.property_id]||{};const c=CUR[u.current_period_id]||CUR[u.id]||null;
    return {...u,_obj:ob,_cur:c,
      _ort:ob.ort||'',_eig:ob.eigentuemer||'',_hv:ob.hausverwaltung||'',
      _bild:u.bild_url||ob.bild_url||'',_rented:c?!!c.is_rented:false,
      _mieter:c&&c.is_rented?(c.mieter_namen||''):'' ,_kalt:c&&c.is_rented?c.kaltmiete:null};
  });
  buildFilters(); if(objParam)showObjBan(); render();
}
function showObjBan(){const ob=Object.values(OBJ).find(o=>o.h_id_text===objParam);const b=$('objban');b.style.display='flex';b.innerHTML=`Gefiltert auf Objekt <b>${esc(objParam)}</b>${ob?' · '+esc(ob.name||''):''} <a href="/hausverwaltung/einheiten" target="_top">Filter aufheben ✕</a>`;}
function uniq(f){return [...new Set(EINH.map(f).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));}
function buildFilters(){
  $('ort').innerHTML='<option value="">Alle Städte</option>'+uniq(e=>e._ort).map(v=>`<option>${esc(v)}</option>`).join('');
  $('eig').innerHTML='<option value="">Alle Vermieter</option>'+uniq(e=>e._eig).map(v=>`<option>${esc(v)}</option>`).join('');
  $('hv').innerHTML='<option value="">Alle Hausverwaltungen</option>'+uniq(e=>e._hv).map(v=>`<option>${esc(v)}</option>`).join('');
  const kats=[...new Set(EINH.map(e=>e.kategorie_typ).filter(Boolean))];
  $('kat').innerHTML='<option value="">Alle Kategorien</option>'+kats.map(v=>`<option value="${esc(v)}">${esc(KAT[v]||v)}</option>`).join('');
}
function filtered(){
  const q=$('q').value.trim().toLowerCase();
  return EINH.filter(u=>{
    if(objParam&&(u._obj.h_id_text!==objParam))return false;
    if(statusF==='belegt'&&!u._rented)return false;
    if(statusF==='leer'&&u._rented)return false;
    if($('ort').value&&u._ort!==$('ort').value)return false;
    if($('kat').value&&u.kategorie_typ!==$('kat').value)return false;
    if($('eig').value&&u._eig!==$('eig').value)return false;
    if($('hv').value&&u._hv!==$('hv').value)return false;
    if(q){const hay=[u._obj.name,u.display_address,u._ort,u.w_id_text,u.label,u._mieter,u._eig].join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;
  }).sort((a,b)=>(a._obj.name||'').localeCompare(b._obj.name||'','de')||(a.w_id||0)-(b.w_id||0));
}
function dims(u){const p=[];if(u.flaeche)p.push(u.flaeche+' m²');if(u.zimmer)p.push(u.zimmer+' Zi');if(u.kategorie_typ&&KAT[u.kategorie_typ])p.push(KAT[u.kategorie_typ]);return p.join(' · ')||'—';}
function render(){
  const rows=filtered();
  $('cnt').textContent=rows.length+' von '+EINH.length+' Einheiten';
  $('v_cards').innerHTML=rows.map(u=>{const bg=u._bild?`style="background-image:url('${esc(u._bild)}')"`:'';
    const stcls=u._rented?'belegt':'leer',sttxt=u._rented?'Vermietet':'Leer';
    return `<div class="card" onclick="openUnit('${u.id}')">
    <div class="ph" ${bg}><span class="kzb">${esc(u._obj.h_id_text||'')}·${esc(u.w_id_text||u.label||'')}</span><span class="st ${stcls}">${sttxt}</span></div>
    <div class="bd">
      <div class="t">${esc(u._obj.name||u.display_address||'Einheit')}</div>
      <div class="a">${esc(u._obj.plz||'')} ${esc(u._ort||'')} · ${esc(u.label||u.w_id_text||'')}</div>
      <div class="dims">${dims(u)}</div>
      <div class="ten ${u._rented?'':'leer'}"><span class="who">${u._rented?('👤 '+esc(u._mieter||'vermietet')):'leerstehend'}</span><span class="money">${u._kalt?eur(u._kalt):''}</span></div>
      <div class="own">🏢 ${esc(u._eig||'—')}${u._hv?' · '+esc(u._hv):''}</div>
    </div></div>`;}).join('')||`<div style="color:var(--muted);padding:24px">Keine Einheiten gefunden.</div>`;
  $('tb').innerHTML=rows.map(u=>`<tr onclick="openUnit('${u.id}')">
    <td><span class="kz">${esc(u._obj.h_id_text||'')}·${esc(u.w_id_text||u.label||'')}</span></td>
    <td>${esc(u._obj.name||'—')}<div style="font-size:11px;color:var(--muted)">${esc(u._obj.plz||'')} ${esc(u._ort||'')}</div></td>
    <td>${dims(u)}</td>
    <td>${u._rented?('<span class="pill" style="background:var(--green)">Vermietet</span> '+esc(u._mieter||'')):'<span class="pill" style="background:var(--amber)">Leer</span>'}</td>
    <td class="right money">${u._kalt?eur(u._kalt):'<span style="color:var(--muted)">—</span>'}</td>
    <td>${esc(u._eig||'—')}</td>
  </tr>`).join('')||`<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px">Keine Einheiten.</td></tr>`;
  if(view==='map')drawMap(rows);
}
function setView(v){view=v;$('viewseg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('v_cards').classList.toggle('hide',v!=='cards');$('v_list').classList.toggle('hide',v!=='list');$('v_map').classList.toggle('hide',v!=='map');
  if(v==='map')setTimeout(()=>{if(mapObj)mapObj.invalidateSize();render();},60);}
function drawMap(rows){
  if(!mapObj){mapObj=L.map('map').setView([49.85,8.2],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(mapObj);markers=L.layerGroup().addTo(mapObj);}
  markers.clearLayers();const byObj={};
  rows.forEach(u=>{const o=u._obj;if(!o.lat||!o.lng)return;const k=o.id;byObj[k]=byObj[k]||{o,units:[]};byObj[k].units.push(u);});
  const pts=[];Object.values(byObj).forEach(({o,units})=>{const col=units.some(u=>!u._rented)?'#e0a33a':'#28c07e';
    const mk=L.circleMarker([o.lat,o.lng],{radius:8+Math.min(units.length,10),color:col,fillColor:col,fillOpacity:.7,weight:2});
    mk.bindPopup(`<b>${esc(o.name||'')}</b><br>${esc(o.display_address||'')}<br>${units.length} Einheit(en)`);mk.addTo(markers);pts.push([o.lat,o.lng]);});
  if(pts.length)mapObj.fitBounds(pts,{padding:[40,40],maxZoom:14});
}
function openUnit(id){location.href='/hausverwaltung/einheit?id='+encodeURIComponent(id);}
$('viewseg').querySelectorAll('button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{statusF=b.dataset.f;$('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render();});
load();
</script></body></html>
