<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buchungen – Wohntraum OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.OS_APP='oc';</script>
<script src="/os-docstore.js?v=20261012b"></script>
<style>
:root{
  --bg:#f3f5f8;--card:#ffffff;--ink:#18202c;--muted:#5f6b7a;--line:#e0e5eb;--soft:#eef1f5;
  --accent:#2f5d8a;--accent-ink:#ffffff;--accent-soft:#e3ecf5;
  --pos:#1d7a4c;--pos-bg:#e5f4ec;--neg:#b42318;--neg-bg:#fcebe9;--warn:#946200;--warn-bg:#fff4d6;--chip:#edf1f6;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b;--card:#1a1f28;--ink:#e5e9ef;--muted:#97a1af;--line:#2b323e;--soft:#222935;
    --accent:#72a6d8;--accent-ink:#0d1117;--accent-soft:#1f2c3b;
    --pos:#5cc98e;--pos-bg:#15301f;--neg:#f07b70;--neg-bg:#3a1c19;--warn:#e7b949;--warn-bg:#342e18;--chip:#252c38;color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px 0;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.sub{color:var(--muted);font-size:12px}
.nav{display:flex;align-items:center;gap:6px}
.nav .y{font-weight:700;font-size:15px;min-width:44px;text-align:center}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:3px 6px}
button.small{font-size:12px;padding:3px 8px}
select,input[type=text],input[type=search],textarea{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
textarea{width:100%;resize:vertical}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 16px;margin-top:8px}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--muted)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
#view{flex:1;min-height:0;overflow:auto}
.pad{padding:14px 16px;max-width:1200px}
.loading,.empty{padding:40px 16px;text-align:center;color:var(--muted)}
/* Drei Spalten wie in einer Belegbuchhaltung */
.grid3{display:grid;grid-template-columns:230px minmax(380px,1fr) minmax(360px,440px);height:100%;min-height:0}
.knav{border-right:1px solid var(--line);overflow:auto;padding:10px 8px;background:var(--card)}
.nav-h{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:2px 0 6px 8px;display:flex;align-items:center;justify-content:space-between}
.grid3.kart{grid-template-columns:230px minmax(0,1fr)}.grid3.kart.kzu{grid-template-columns:38px minmax(0,1fr)}
.grid3.kart .mid{border-right:none}
.kbulk{margin-left:auto;display:inline-flex;gap:10px;align-items:center}.lsum{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.klist{background:var(--bg)}
.kz{display:grid;grid-template-columns:28px minmax(0,1fr) 110px 64px;gap:14px;align-items:start;background:var(--card);border-bottom:1px solid var(--line);padding:16px 14px 14px 10px}
.kz.sel{box-shadow:inset 3px 0 0 var(--accent)}
.kz-c{padding-top:2px}.kz-c input{width:16px;height:16px}
.kz-i b{font-size:14px}.kz-l{font-size:12px;font-weight:600;margin-top:10px}
.kz-z{font-size:12.5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}.kz-z.auf{display:block}
.kz-vt{font-size:12px;color:var(--accent);margin-top:4px}
.kz-mehr{border:0;background:none;color:var(--accent);font-size:12px;padding:6px 0 0;cursor:pointer}
.kz-b{text-align:right;font-weight:600;font-size:14px;padding-top:2px;white-space:nowrap}
.kz-z2{display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--line);padding-left:12px}
.kz-bel{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.kz-bf a{color:var(--accent);word-break:break-all}.kz-acts{display:flex;gap:16px;margin-top:6px}.kz-acts a{color:var(--accent);font-size:13px}
.kz-vb{margin-top:6px;font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.kz-vb span{font-weight:600;word-break:break-all}
.kz-f{display:grid;grid-template-columns:minmax(0,420px) 260px;justify-content:start;gap:8px;align-items:center}.kz-f select{width:100%}
.kz-f.vs .kc-in{color:var(--warn);border-color:var(--warn)}
.kz-src{font-size:11.5px;color:var(--warn);margin-top:-4px}
.kz-r{display:flex;flex-direction:column;align-items:center;gap:12px}
.kz-d{border:0;background:none;color:var(--accent);font-size:12.5px;cursor:pointer;padding:2px 4px}
.kz-ok{width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);background:transparent;cursor:pointer;padding:0}
.kz-ok:hover:not(:disabled){background:var(--accent-soft)}.kz-ok.on{background:var(--accent);cursor:default}
.kz-ok:disabled:not(.on){border-color:var(--line);cursor:not-allowed}
.kz.ok{background:var(--card)}
/* Infobereich oben, Zuordnung (Beleg, Konto, Objekt) darunter */
.kz>.kz-c{grid-column:1;grid-row:1}.kz>.kz-i{grid-column:2;grid-row:1}.kz>.kz-b{grid-column:3;grid-row:1}.kz>.kz-r{grid-column:4;grid-row:1/span 2}
.kz>.kz-z2{grid-column:2/4;grid-row:2;border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:10px}
.kz-um{display:flex;flex-direction:column;gap:3px;font-size:12.5px}.kz-um label{display:flex;gap:8px;align-items:center;color:var(--muted)}.kz-um select{flex:1;min-width:0}
/* jede zweite Buchung leicht hinterlegt */
.klist .kz:nth-child(even){background:var(--soft)}
.kdrw-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:60}
.kdrw{position:fixed;top:4vh;bottom:4vh;left:50%;transform:translateX(-50%);border-radius:14px;width:min(760px,96vw);background:var(--bg);z-index:61;overflow:auto;box-shadow:-8px 0 24px rgba(0,0,0,.15)}
.kdrw-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
@media (max-width:1100px){ .grid3.kart{grid-template-columns:1fr} .grid3.kart .knav{display:none} .kz{grid-template-columns:24px 1fr 100px} .kz-z2{grid-column:2/-1;border-left:none;padding-left:0} .kz-r{grid-column:2/-1;flex-direction:row;justify-content:flex-end} }
.kcombo{position:relative;display:block}.kc-in{width:100%}.kc-sel{display:none}
.kc-list{position:absolute;left:0;right:0;top:100%;margin-top:3px;max-height:320px;overflow:auto;background:var(--card,#fff);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:50;padding:4px 0}
.kc-g{font-size:11px;font-weight:700;color:var(--muted);padding:8px 12px 3px;text-transform:uppercase;letter-spacing:.03em}
.kc-o{padding:6px 12px;font-size:13px;cursor:pointer}.kc-o.akt,.kc-o:hover{background:var(--brand-soft,#e8f0fb)}.kc-o.on{font-weight:600}
.kc-leer{padding:8px 12px;color:var(--muted);font-size:13px}
.knzu{border:1px solid var(--line);background:var(--bg,#f6f7f9);color:var(--muted);border-radius:7px;width:24px;height:24px;padding:0;cursor:pointer;font-size:15px;line-height:1;text-transform:none}
.knzu:hover{color:var(--ink,#111)}
.grid3.kzu{grid-template-columns:38px minmax(380px,1fr) minmax(360px,440px)}
.knav-zu{padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:10px}
.knzu-t{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;color:var(--muted);white-space:nowrap}
button.nav-g.gtog{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;cursor:pointer;text-align:left}
button.nav-g.gtog b{margin-left:auto;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:0 7px;font-size:11px;min-width:20px;text-align:center}
.gpf.auf{transform:rotate(90deg)}
.gpf{display:inline-block;width:10px;color:var(--muted)}
@media (max-width:1100px){ .grid3.kzu{grid-template-columns:38px 1fr} }
.nav-g{font-size:12px;font-weight:700;color:var(--muted);padding:10px 8px 4px}
.kn{display:flex;width:100%;justify-content:space-between;gap:6px;border:none;background:none;text-align:left;padding:5px 8px;border-radius:6px;font-size:13px}
.kn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kn b{background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:0 7px;font-size:11px;min-width:20px;text-align:center}
.kn i{color:var(--pos);font-style:normal;font-size:12px}
.kn.on{background:var(--accent-soft);font-weight:600}
.mid{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.tbar input[type=search]{flex:1;min-width:160px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:5px 10px;font-size:13px;background:var(--card)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button span{font-size:11px;opacity:.8}
.lsum{padding:6px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.list{overflow:auto;flex:1;min-height:0}
.lgrp{position:sticky;top:0;background:var(--soft);font-size:12px;font-weight:700;color:var(--muted);padding:4px 12px;z-index:1}
.row{display:grid;grid-template-columns:10px 46px 1fr auto;grid-template-rows:auto auto;gap:0 10px;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);border-radius:0;background:var(--card);padding:8px 12px;align-items:center}
.row:hover{background:var(--accent-soft)}
.row.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.row .dot{width:9px;height:9px;border-radius:50%;grid-row:span 2}
.dot.o{background:var(--warn)}.dot.b{background:transparent;border:2px solid var(--warn)}.dot.z{background:var(--pos)}
.row .rd{font-size:12px;color:var(--muted);grid-row:span 2;font-variant-numeric:tabular-nums}
.row .rt{min-width:0;grid-column:3;grid-row:1}
.row .rt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ra{grid-column:4;grid-row:1;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .rz{grid-column:3/5;grid-row:2;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.det{overflow:auto;padding:12px;min-height:0}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.dn{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.da{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.dnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.lab{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.zweck{overflow-wrap:anywhere;font-size:13px}
.frm{display:grid;gap:8px}
.frm label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.frm select{width:100%;font-size:14px;padding:6px 8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--pos-bg);color:var(--pos)}.pill.mid{background:var(--warn-bg);color:var(--warn)}.pill.src{background:var(--chip);color:var(--muted);font-weight:500}
.spl{margin-top:10px;padding:10px;border-radius:10px;background:var(--soft)}
.sprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sprow select{max-width:160px}
input.num{width:96px;text-align:right;font-variant-numeric:tabular-nums}
table.sp{width:100%;border-collapse:collapse;font-size:13px}
table.sp td{padding:4px 0;border-bottom:1px dashed var(--line)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.bel{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0}
.bel a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
.bdrop{display:block;border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;margin-top:6px}
.bdrop.over,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.prev{margin-top:8px}
.belol{display:grid;gap:6px;margin:6px 0;font-size:13px}
.belol label{display:flex;gap:8px;align-items:center;cursor:pointer}
.belol input[type=text]{width:100%;font-size:14px;padding:6px 8px;box-sizing:border-box}
.kt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 0;margin-top:10px}
.kt-z{display:flex;align-items:center;gap:6px;width:100%;box-sizing:border-box;padding:4px 10px;font-size:14px;text-align:left;background:none;border:none;border-radius:0;color:var(--ink);text-decoration:none;cursor:pointer;min-height:28px}
.kt-z:hover{background:var(--chip)}
.kt-o{font-weight:600}
.kt-c{display:inline-block;width:14px;color:var(--muted);font-weight:400;transition:transform .15s}
.kt-o.auf .kt-c{transform:rotate(90deg)}
.kt-d{justify-content:space-between;gap:12px;cursor:default}
.kt-d>a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
.kt-r{display:flex;gap:6px;align-items:center;flex-shrink:0;font-size:12px}
.kt-r a{text-decoration:none}
.dbinfo{margin:6px 0;font-size:12px}
.dbinfo button{margin-left:4px}
.spbox{margin:8px 0;display:grid;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.spbox input[type=search]{width:100%;font-size:14px;padding:6px 8px;box-sizing:border-box}
.belq{margin-top:8px;display:grid;gap:8px}
.belf{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.belf input{width:100%;font-size:14px;padding:6px 8px;box-sizing:border-box}
.belname{font-family:ui-monospace,Menlo,monospace;font-size:12px;overflow-wrap:anywhere;background:var(--accent-soft);padding:6px 8px;border-radius:6px}
.bel>span{display:flex;gap:6px;align-items:center;flex-shrink:0}
.prev iframe{width:100%;height:520px;border:1px solid var(--line);border-radius:8px;background:#fff}
.prev img{width:100%;border:1px solid var(--line);border-radius:8px}
/* Import und Regeln (übernommen aus dem Objekt-Controlling) */
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:13px;margin-bottom:12px}
.note b{color:var(--ink)}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;background:var(--card);padding:26px 16px;text-align:center;color:var(--muted);cursor:pointer}
.drop b{color:var(--ink);font-size:15px;display:block;margin-bottom:4px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;display:grid;gap:8px}
.fcard .row:hover{background:none}
.fcard .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:none;padding:0;background:none}
h2{font-size:15px;margin:22px 0 8px}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--soft);font-weight:600;font-size:12px;color:var(--muted)}
th.n{text-align:right}
.mut{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:9}
.toast.on{opacity:1}
@media (max-width:1100px){ .grid3{grid-template-columns:190px 1fr} .det{grid-column:1/-1;border-top:1px solid var(--line)} body{overflow:auto} .grid3{height:auto} .list{max-height:60vh} }
@media (max-width:640px){ .grid3{grid-template-columns:1fr} .knav{display:none} }
.knr{font-size:13px;padding:6px 8px;background:var(--accent-soft);border-radius:8px}
.grid-kp{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;align-items:start}
@media (max-width:900px){.grid-kp{grid-template-columns:1fr}}
.opb{margin-top:10px}.opt{width:100%;font-size:12px;border-collapse:collapse;margin:6px 0}.opt th,.opt td{padding:4px;border-bottom:1px dashed var(--line);white-space:normal}.opt input.num{width:84px}
.kvr{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}.kvr span{color:var(--muted)}
.fl{display:grid;gap:2px;font-size:12px;color:var(--muted);margin-bottom:6px}.fl select{width:100%}

/* ===== Aussehen wie BuchhaltungsButler ===== */
:root{--bb-blau:#1592e6;--bb-blau-d:#0b7cc8;--bb-blau-h:#e3f1fc;--bb-streifen:#b5dcf6;--bb-grau:#eceff3;--bb-grau2:#f5f7f9;--bb-rand:#c9d2dc;--bb-text:#26303b;--bb-text2:#6c7987;--bb-orange:#e3a13b;--bb-rot:#d0312d;--bb-knopf:#c4cdd6;
  --accent:var(--bb-blau);--accent-soft:var(--bb-blau-h);--line:#d7dee6;--bg:#eef1f4;--ink:var(--bb-text);--muted:var(--bb-text2);--neg:var(--bb-rot);--f-ui:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bb-blau:#4fb0f2;--bb-blau-d:#3a9ee0;--bb-blau-h:#1b2d3d;--bb-streifen:#1f3c55;--bb-grau:#1c222b;--bb-grau2:#181d24;--bb-rand:#33404d;--bb-text:#e5e9ef;--bb-text2:#9aa6b3;--bb-knopf:#2c3642;--bb-rot:#f07b70}}
body{font-family:var(--f-ui);color:var(--bb-text)}
header h1{font-size:34px;font-weight:400;letter-spacing:-.3px}
header .sub{display:none}
.bb-hr{display:flex;gap:10px;align-items:center}
.bb-hr .bb-abruf{background:var(--bb-knopf);color:var(--bb-text);border:0;border-radius:2px;font-weight:700;padding:0 20px;height:44px}
.tabs{background:transparent;border-bottom:1px solid var(--bb-rand)}
.tabs button{font-size:15px;color:var(--bb-text2);padding:10px 16px}.tabs button.on{color:var(--bb-text);border-bottom:3px solid var(--bb-blau);font-weight:700}
button,select,input,textarea{border-radius:2px}
button.primary{background:var(--bb-blau);border-color:var(--bb-blau);color:#fff}
button.primary:hover{background:var(--bb-blau-d)}
.card,.fcard,.note{border-radius:2px}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{border:1px solid var(--bb-rand);background:var(--card)}
a{color:var(--bb-blau)}
.pad h2{font-weight:400;font-size:22px}
table th{background:var(--bb-grau);color:var(--bb-text2);text-transform:uppercase;font-size:11.5px;letter-spacing:.04em}
/* Leiste über der Liste */
.grid3.kart.bb{grid-template-columns:minmax(0,1fr)}

<script>
(function(){
const MS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const KATS=[['miete','Mieteinnahme'],['sonst_ein','Sonstige Einnahme'],['bk','Betriebskosten'],['inst','Instandhaltung'],['umbau','Umbau'],['darl','Darlehen'],['obj_sonst','Sonstige Objektkosten'],['verw','Verwaltung'],['intern','Umbuchung intern'],['ruecklast','Rücklastschrift (hebt sich auf)'],['ignore','Nicht relevant'],['','– ungeklärt –']];
const KATN=Object.fromEntries(KATS);
const SUBS_UM=[['lizenzen','Software / IT / Lizenzen'],['personal','Personal Verwaltung'],['gf','Geschäftsführung – Immobilienverwaltung'],['buchhaltung','Buchhaltung / Steuerberatung laufend'],['buero','Büro / Miete / Nebenkosten'],['buerobedarf','Bürobedarf / Porto / Druckkosten'],['telefon','Telefon / Internet / Kommunikation'],['bank','Bank- und Zahlungsverkehrskosten'],['objverw','Miet- und Objektverwaltung'],['forderung','Forderungsmanagement / Mahnwesen'],['bkverw','Betriebskostenverwaltung'],['vermietung','Vermietung / Inserate / Besichtigungen'],['objbetreuung','Objektbetreuung / Kontrollen / Fahrten'],['recht','Rechts- und Gerichtskosten objektbezogen'],['versicherung','Versicherungen Verwaltung'],['kfz','KFZ']];
/* nicht umgelegt */
const SUBS_NO=[['recht_sonst','Rechtskosten nicht objektbezogen'],['steuern','Steuern der Gesellschaft'],['spende','Spenden'],['fortbildung','Fortbildung / Fachliteratur Immobilienverwaltung'],['eeprivat','EE Privat'],['kauf','Kauf & Verkauf Immobilie'],['sonstige','Sonstige (nicht umgelegt)']];
const SUBS=SUBS_UM.concat(SUBS_NO);
const SUB_ALIAS={storno:'bank',leasing:'lizenzen'}; /* alte Arten */
const subNorm=x=>SUB_ALIAS[x]||x;
const SUBN=Object.fromEntries(SUBS);
const POOLS=['EE-Allgemein','WT-Allgemein','KiBo-Allgemein','EE-Instandhaltung','WT-Instandhaltung'];
const COSTK=['bk','inst','darl','obj_sonst'];
const fmt=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const fmt0=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fnum=new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=v=>fmt.format(v||0), eur0=v=>fmt0.format(Math.round(v||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Daten aus der Datenbank sind schreibgeschützt – immer mit einer Kopie arbeiten */
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const r2=v=>Math.round((v||0)*100)/100;
const $=id=>document.getElementById(id);
function parseNum(s){ if(s==null) return null; s=String(s).trim().replace(/\s|€|EUR/g,''); if(s==='') return null;
  let neg=false; if(/-$/.test(s)){neg=true;s=s.slice(0,-1);}
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const v=Number(s); return isFinite(v)?(neg?-v:v):NaN; }
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),3000);}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim();

/* ---------- Zustand ---------- */
let db=null, downloads=null, canWrite=true, dbState='wait';
let nhMap={}, nhStand='', vsMap={}; let unitCostOpen=store('oc_ucost')==='1', objCostOpen=store('oc_ocost')==='1', ovVerwOpen=store('oc_ovv')==='1', ovCostOpen=store('oc_ovc')==='1';
let vors={items:[]}, vFilter='offen', objekte=[], konten=[], regeln=[], einst={}, buch={}, plan=[], loaded={o:0,k:0,r:0,e:0,b:0};
let year=new Date().getFullYear(), month=null; // null = ganzes Jahr
let tab=store('oc_tab')||'uebersicht', selObj=store('oc_obj')||'', bFilter={status:'alle',konto:'',q:'',sub:'',obj:'',sort:''};
let pending=[]; // geparste, noch nicht importierte Dateien
let ruleOpen=null; const touched=new Set();
let kFilter={m:'',konto:'',ges:'',dir:'',ab:'',q:''}; try{ const kf=JSON.parse(store('oc_kf')||'null'); if(kf&&typeof kf==='object') kFilter=Object.assign(kFilter,kf); }catch(e){}
function setKF(k,v){ kFilter[k]=v; store('oc_kf',JSON.stringify(kFilter)); render(); }
/* Suche und Betrag filtern die Zeilen direkt, ohne die Seite neu aufzubauen – so bleibt das Eingabefeld beim Tippen ungestört */
function applyKF(){ const info=$('kf-info'); if(!info) return; const q=norm(kFilter.q), ab=parseNum(kFilter.ab);
  let n=0, sum=0, grp=null, gn=0; const fin=()=>{ if(grp){ grp.hidden=!gn; const x=grp.querySelector('.gn'); if(x) x.textContent=gn?' · '+gn+' offen':''; } };
  document.querySelectorAll('#view tr.grp, #view tr.tx').forEach(tr=>{ if(tr.classList.contains('grp')){ fin(); grp=tr; gn=0; return; }
    const b=Number(tr.dataset.b), ok=(!q||tr.dataset.q.includes(q))&&(!(ab>0)||Math.abs(b)>=ab); tr.hidden=!ok;
    if(ok&&tr.dataset.open==='1'){ n++; sum+=b; gn++; } }); fin();
  info.textContent=info.dataset.pre+' · '+n+' von '+info.dataset.all+' offenen Buchungen · Summe '+eur(sum);
  const em=$('kf-empty'); if(em) em.hidden=n>0||!!document.querySelector('#view tr.tx:not([hidden])');
  const rs=$('kf-reset'); if(rs) rs.hidden=!(kFilter.konto||kFilter.ges||kFilter.dir||kFilter.q||kFilter.ab); }
{const y=Number(store('oc_year')); if(y>2000&&y<2100) year=y; const m=store('oc_month'); if(m!==null&&m!==''&&!isNaN(Number(m))) month=Number(m);}

const chains={};
function queue(path,fn){chains[path]=(chains[path]||Promise.resolve()).then(fn).catch(e=>{console.error(e);
  toast(e&&e.code==='permission_denied'?'Nur Lesezugriff – Änderungen werden nicht gespeichert.':'Speichern fehlgeschlagen: '+(e&&e.message||e));});return chains[path];}
function saveStamm(name,data){ if(!db||!canWrite){toast('Nur Lesezugriff.');return Promise.resolve();} return queue('stamm/'+name,()=>db.doc('stamm/'+name).set(data)); }

/* ---------- Klassifizierung ---------- */
const objKz=()=>new Set(objekte.map(o=>o.kz));
function kontoTyp(k){ if(!k) return 'mix'; const o=k.obj||''; if(o==='__aus') return 'aus'; if(/-Allgemein$/.test(o)) return 'allg'; if(/-Instandhaltung$/.test(o)) return 'inst'; if(objKz().has(o)) return 'obj'; return 'mix'; }
let unitIdx=null;
function buildUnitIdx(){ unitIdx=[]; for(const o of objekte){ for(const e of (o.einheiten||[])){
  const toks=[]; const ref=norm(e.ref); if(ref.length>=6 && !/^miete\b/.test(ref)) toks.push(ref);
  for(const nm of String(e.mieter||'').split(',')){ const w=norm(nm).split(' ').filter(x=>x.length>=4 && x!=='undefined' && x!=='herr' && x!=='frau'); if(w.length&&!w.includes('eisenhardt')) toks.push(w[w.length-1]); } /* eigener Name (Eric Eisenhardt) nie als Mieter-Erkennung – sonst landen Geldtransits als Miete */
  unitIdx.push({obj:o.kz,id:e.id,toks}); } } }
function matchUnit(text,objs){ if(!unitIdx) buildUnitIdx(); const t=' '+norm(text)+' ';
  for(const u of unitIdx){ if(objs && !objs.includes(u.obj)) continue; for(const tk of u.toks){ if(t.includes(' '+tk+' ')||(tk.includes(' ')&&t.includes(tk))) return u; } } return null; }
/* Mieter-Erkennung inkl. ehemaliger Mieter 2026 (Einheit.alt = [{mieter, ref, von, bis, ibans}]) */
const SHARED_IBAN=new Set(['DE94760000000076001601']); /* Bundesagentur für Arbeit – zahlt für viele Mieter */
let tenIdx=null;
const dnum=s=>s?Date.parse(s)/864e5:null;
function inWin(d,von,bis,pre,post){ const x=dnum(d); if(von&&x<dnum(von)-pre) return false; if(bis&&x>dnum(bis)+post) return false; return true; }
function nameToks(names){ const out=[]; for(const nm of String(names||'').split(',')){ const w=norm(nm).split(' ').filter(x=>x.length>=3&&!['herr','frau','undefined','unbekannt'].includes(x)); if(w.length) out.push(w); } return out; }
function buildTenIdx(){ tenIdx={full:[],short:{},iban:[],alt:[],cur:[]};
  for(const o of objekte){ for(const e of (o.einheiten||[])){
    const add=(ref,von,bis,alt)=>{ const r=norm(ref); const m=r.match(/^(h\d+ w\d+)\b/); if(!m) return;
      if(r.length>m[1].length+2) tenIdx.full.push({obj:o.kz,id:e.id,tok:r,von,bis,alt});
      (tenIdx.short[m[1]]=tenIdx.short[m[1]]||[]).push({obj:o.kz,id:e.id}); };
    add(e.ref,null,null,false);
    for(const w of nameToks(e.mieter)) if(w.length>=2&&!w.includes('eisenhardt')) tenIdx.cur.push({obj:o.kz,id:e.id,w});
    for(const a of (e.alt||[])){ add(a.ref,a.von,a.bis,true);
      for(const ib of (a.ibans||[])) if(ib&&!SHARED_IBAN.has(ib)) tenIdx.iban.push({obj:o.kz,id:e.id,ib,von:a.von,bis:a.bis});
      for(const w of nameToks(a.mieter)) tenIdx.alt.push({obj:o.kz,id:e.id,w,von:a.von,bis:a.bis}); } } } }
function matchTenant(tx,kObj,typ){ if(!tenIdx) buildTenIdx(); const t=' '+norm(tx.n+' '+tx.z)+' ';
  /* 1. vollständige Nahaus-Referenz (z. B. „H9/W6 Foller“) – gilt kontoübergreifend */
  for(const u of tenIdx.full){ if(u.alt&&!inWin(tx.d,u.von,u.bis,31,60)) continue; if(t.includes(' '+u.tok+' ')) return {obj:u.obj,id:u.id,alt:u.alt}; }
  /* 2. IBAN eines ehemaligen Mieters */
  if(tx.i&&Math.abs(tx.b)>=50){ for(const u of tenIdx.iban){ if(u.ib===tx.i&&inWin(tx.d,u.von,u.bis,31,60)) return {obj:u.obj,id:u.id,alt:true}; } }
  /* 3. kurze Referenz „H1/W1“ */
  const m=t.match(/ (h\d+ w\d+) /); if(m&&tenIdx.short[m[1]]){ const l=tenIdx.short[m[1]], objs=[...new Set(l.map(x=>x.obj))]; if(objs.length===1) return {obj:objs[0],id:new Set(l.map(x=>x.id)).size===1?l[0].id:'',alt:false}; }
  if(typ!=='obj'&&typ!=='mix') return null; /* auf Sammelkonten nur über Referenz/IBAN */
  /* 4. Name – aktuelle Mieter des Kontos, dann ehemalige (Zeitraum, ab 100 €) */
  const objs=kObj?[kObj]:null; const u0=matchUnit(tx.n+' '+tx.z,objs); if(u0) return {obj:u0.obj,id:u0.id,alt:false};
  if(Math.abs(tx.b)>=100){ for(const u of tenIdx.alt){ if(objs&&!objs.includes(u.obj)) continue; if(!inWin(tx.d,u.von,u.bis,31,60)) continue; const ln=u.w[u.w.length-1]; if(ln.length>=4&&t.includes(' '+ln+' ')) return {obj:u.obj,id:u.id,alt:true}; } }
  /* 5. Vor- und Nachname eines aktuellen Mieters in einem anderen Objekt (z. B. nach Umzug) */
  for(const u of tenIdx.cur){ if(u.w.every(x=>t.includes(' '+x+' '))) return {obj:u.obj,id:u.id,alt:false}; }
  return null; }
const BANKFEE_RE=/^(abschluss per |\*\*endsaldo\*\*|abschluss · |entgeltabschluss · |stornorechnung · stornorechnung zur abrechnung|stornorechnung zur abrechnung|rechnung · rechnung loeschung)/i;
function isBankFee(tx){ const z=String(tx.z||'').trim(); if(BANKFEE_RE.test(z)) return true;
  return /^dkb ag$/i.test(String(tx.n||'').trim())&&/^abrechnung \d\d\.\d\d\.\d{4}/i.test(z); }
let ownIban=null;
function ruleHit(text,m){ const n=norm(m); if(!n) return false; /* endet das Muster auf eine Ziffer (z. B. „B20“), muss danach ein Wortende folgen */ return /[0-9]$/.test(n)?(' '+text+' ').includes(' '+n+' '):(' '+text).includes(' '+n); }
function planHit(obj,b){ if(!obj||b>=0) return null; const a=Math.abs(b); return plan.find(p=>p.obj===obj&&Math.abs(p.betrag-a)<0.005)||null; }
/* Objektkürzel im Verwendungszweck erkennen, z. B. „K28“, „EEK28U001“, „WT-S58“ */
let objRe=null;
/* Objektadresse im Verwendungszweck (z. B. „Kraemerstrasse 28“, „In den Kirchgaerten 7“) – hat Vorrang vor Kürzel und Konto */
let addrRe=null;
function streetStem(st){ let x=norm(st).replace(/ /g,'').replace(/(strasse|str)$/,''); return x.replace(/ae|oe|ue/g,m=>m[0]).replace(/[aou]/g,m=>'('+m+'|'+m+'e)?'); }
function buildAddrRe(){ addrRe=[]; for(const o of objekte){ const m=String(o.adresse||o.name||'').split(',')[0].match(/^(.*?)\s*(\d+)\s*[a-z]?$/i); if(!m) continue;
  const hasStr=/str(\.|asse|aße)?$/i.test(m[1].trim()); const stem=streetStem(m[1]); if(stem.length<4) continue;
  addrRe.push({kz:o.kz,re:new RegExp(stem+(hasStr?'(str|strasse)':'')+(o.kz==='U6'?'(4)?':'')+m[2]+'(?![0-9])')}); } }
function objByAddr(text){ if(!addrRe) buildAddrRe(); const c=norm(text).replace(/ /g,''); for(const a of addrRe){ if(a.re.test(c)) return a.kz; } return ''; }
function objInText(text){ const ad=objByAddr(text); if(ad) return ad; if(!objRe){ const ks=objekte.map(o=>o.kz.toLowerCase()).sort((a,b)=>b.length-a.length); objRe=ks.length?new RegExp('(?:^|[^a-z0-9]|ee|wt)('+ks.join('|')+')(?![0-9])'):null; }
  if(!objRe) return ''; const m=(' '+text).match(objRe); if(!m) return ''; const o=objekte.find(x=>x.kz.toLowerCase()===m[1]); return o?o.kz:''; }
function classify(tx,k){
  if(tx.m) return {obj:tx.o||'',kat:tx.k||'',sub:tx.s||'',unit:tx.u||'',src:tx.q==='beleg'?'Beleg':'manuell'};
  const typ=kontoTyp(k), kObj=typ==='obj'?k.obj:'';
  if(typ==='aus') return {obj:'',kat:'ignore',sub:'',unit:'',src:'Konto ausgeschlossen'};
  /* Bankgebühren: Kontoabschluss, Entgeltabschluss, Endsaldo, DKB-Abrechnung → Objektkonto: sonstige Objektkosten; sonst Verwaltung › Bankgebühren */
  if(isBankFee(tx)) return typ==='obj'?{obj:k.obj,kat:'obj_sonst',sub:'',unit:'',src:'Bankgebühr'}:{obj:'',kat:'verw',sub:'bank',unit:'',src:'Bankgebühr'};
  if(!ownIban) ownIban=new Set(konten.map(x=>x.iban).filter(Boolean));
  const text=norm((tx.n||'')+' '+(tx.z||''));
  /* Vorrang-Regeln gelten auch für Überweisungen zwischen eigenen Konten (z. B. Kostenweitergabe K28 → S16) */
  const dirOK=r=>!(r.dir==='ein'&&tx.b<=0)&&!(r.dir==='aus'&&tx.b>=0)&&!(r.betrag&&Math.abs(Math.abs(tx.b)-r.betrag)>0.005);
  const hit=r=>r.iban?(tx.i===r.iban):r.nurBetrag?!!r.betrag:ruleHit(text,r.muster); /* nurBetrag: nur der Betrag entscheidet */ /* Regel mit IBAN: Gegenkonto entscheidet (z. B. Darlehenskonto) */
  for(const r of regeln){ if(!r.vor||!r.muster||!dirOK(r)||!hit(r)) continue;
    return {obj:(r.iban&&objInText(text))||r.obj||kObj,kat:r.kat,sub:r.sub||'',unit:'',src:r.iban?'Darlehenskonto':'Regel',rule:r.id}; }
  if(tx.i && ownIban.has(tx.i)) return {obj:kObj,kat:'intern',sub:'',unit:'',src:'eigenes Konto'};
  /* Zahlungen zwischen den eigenen Gesellschaften = Geldtransit */
  const cp=norm(tx.n); if(/^(wohn t raum|wohntraum|anders macher|andersmacher)\b/.test(cp)) return {obj:kObj,kat:'intern',sub:'',unit:'',src:'eigene Gesellschaft'};
  /* Eingang eines Mieters hat Vorrang vor allen Regeln */
  if(tx.b>0){ const u0=matchTenant(tx,kObj,typ); if(u0) return {obj:u0.obj,kat:'miete',sub:'',unit:u0.id||'',src:u0.alt?'ehem. Mieter erkannt':'Mieter erkannt'}; }
  for(const r of regeln){ if(!r.muster||!dirOK(r)) continue;
    if(r.scope==='allgemein'&&typ!=='allg') continue; if(r.scope==='objekt'&&typ==='allg') continue;
    if(tx.b>0 && r.kat==='verw' && r.dir!=='beide') continue; /* Verwaltungsregeln nie auf Eingänge anwenden */
    if(hit(r)){ let obj=r.obj||(r.kat==='verw'?'':(objInText(text)||kObj)); let unit=r.unit||'';
      if(r.kat==='miete'){const u=matchUnit(tx.n+' '+tx.z,obj?[obj]:null); if(u){unit=u.id; obj=obj||u.obj;}}
      return {obj,kat:r.kat,sub:r.sub||'',unit,src:'Regel',rule:r.id}; } }
  /* Eingänge = Mieten */
  if(tx.b>0 && (typ==='allg'||typ==='inst')) return {obj:'',kat:'',sub:'',unit:'',src:'auto'}; /* Eingang auf Sammelkonto: selbst klären */
  if(tx.b>0){ const u=matchUnit(tx.n+' '+tx.z,kObj?[kObj]:null); return {obj:kObj||(u?u.obj:''),kat:'miete',sub:'',unit:u?u.id:'',src:'auto'}; }
  /* Ausgänge: Fixkosten-Plan (Betrag passt) */
  const pk=typ==='obj'?kObj:(typ==='allg'?k.obj:''); const ph=planHit(pk,tx.b);
  if(ph) return {obj:ph.kat==='verw'?'':kObj,kat:ph.kat,sub:ph.sub||'',unit:'',src:'Fixkosten: '+ph.pos};
  const oT=objInText(text);
  if(typ==='inst') return {obj:oT,kat:'inst',sub:'',unit:'',src:oT?'Objekt im Text':'auto'};
  return {obj:oT||kObj,kat:'',sub:'',unit:'',src:'auto'};
}
function isOpen(c){ if(c.kat==='') return true; if(c.kat==='sonst_ein'&&c.obj==='__ges') return false; if(['miete','sonst_ein','bk','inst','umbau','darl','obj_sonst'].includes(c.kat) && !objKz().has(c.obj)) return true; if(c.kat==='verw'&&!c.sub) return true; return false; }

/* alle Buchungen eines Jahres, klassifiziert (Cache) */
let cache=null;
function invalidate(){cache=null;unitIdx=null;tenIdx=null;ownIban=null;objRe=null;addrRe=null;}
function allTx(){
  if(cache&&cache.year===year) return cache.list;

/* Konto und Monat aus dem PDF erkennen (Dateiname, sonst Text der ersten Seite) */
var PDFJS=null;
async function pdfText(file){ if(!PDFJS){ await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); PDFJS=window.pdfjsLib; PDFJS.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
  const doc=await PDFJS.getDocument({data:await file.arrayBuffer()}).promise; const pg=await doc.getPage(1); const c=await pg.getTextContent(); return c.items.map(i=>i.str).join(' '); }
async function kaErkenne(file){ const p={file,konto:'',monat:'',hinweis:''}; const n=file.name;
  const fm=n.match(/^(.+?)_Kontoauszug_(\d{2})\.(\d{2})/i);
  if(fm){ const k=konten.find(x=>kaKz(x).toLowerCase()===fm[1].toLowerCase()); if(k) p.konto=k.key||k.iban; p.monat='20'+fm[3]+'-'+fm[2]; }
  if(!p.konto||!p.monat){ try{ const t=await pdfText(file);
      if(!p.konto){ const ib=(t.replace(/\s+/g,'').match(/DE\d{20}/g)||[]); const k=konten.find(x=>x.iban&&ib.includes(x.iban)); if(k) p.konto=k.key||k.iban; else p.hinweis='Konto nicht erkannt'; }
      if(!p.monat){ const a=t.match(/Kontoauszug\s+(\d{1,2})\s*\/\s*(\d{4})/i); if(a) p.monat=a[2]+'-'+a[1].padStart(2,'0');
        else { const cnt={}; for(const d of t.matchAll(/\b\d{2}\.(\d{2})\.(\d{4})\b/g)){ const k2=d[2]+'-'+d[1]; cnt[k2]=(cnt[k2]||0)+1; } const best=Object.entries(cnt).sort((x,y)=>y[1]-x[1])[0]; if(best) p.monat=best[0]; } } }
    catch(e){ p.hinweis='PDF nicht lesbar – bitte Konto und Monat wählen'; } }
  return p; }
async function kaQueue(files){ const L=files.filter(f=>/\.pdf$/i.test(f.name)); if(!L.length){ toast('Bitte PDF-Dateien wählen.'); return; }
  KAU.busy='Erkenne Konto und Monat …'; render(); for(const f of L) KAU.pend.push(await kaErkenne(f)); KAU.busy=''; render(); }
async function kaAblegen(){ const fehlt=KAU.pend.filter(p=>!p.konto||!/^\d{4}-\d{2}$/.test(p.monat)); if(fehlt.length){ toast('Bitte bei allen Dateien Konto und Monat wählen.'); return; }
  let n=0;

    KAU.busy='Lege ab '+(n+1)+' von '+KAU.pend.length+' …'; render();
    try{ const pfad=KA_ROOT+'/'+p.monat.slice(0,4)+'/'+(k.ges||'WT')+'/'+mm, name=kaKz(k)+'_Kontoauszug_'+mm+'.pdf';
      await odApi({aktion:'anlegen',pfad});
      const b64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=rej; r.readAsDataURL(p.file); });
      if(p.file.size<=3*1024*1024) await odApi({aktion:'hochladen',pfad,name,daten:b64,typ:'application/pdf'});
      else { const s=await odApi({aktion:'sitzung',pfad,name}); const r=await fetch(s.uploadUrl,{method:'PUT',headers:{'Content-Range':'bytes 0-'+(p.file.size-1)+'/'+p.file.size},body:p.file}); if(!r.ok) throw new Error('Hochladen fehlgeschlagen ('+r.status+')'); }
      KAU.pend.splice(KAU.pend.indexOf(p),1); n++; }
    catch(e){ toast(p.file.name+': '+(e.message||e)); } }
  KAU.busy=''; toast(n+' Kontoauszug'+(n===1?'':'e')+' in OneDrive abgelegt.'); ktNeu(); }
function ktNeu(){ const auf=[...KT.offen]; KT.k={}; KT.fehler=''; auf.forEach(p=>ktLaden(p)); render(); }

/* ---------- Belege und Rechnungen in OneDrive ----------
   Objekt, umlagefähig     → 7.000 Gebäude/<Gruppe>/<Objekt>/04 Betriebskosten/<Thema>   Objekt_Absender_Thema_Datum_Betrag
   Objekt, Hausgeld (WEG)  → …/07 WEG                                                    Objekt_Absender_Hausgeld_Datum_Betrag
   Objekt, nicht umlagef.  → …/05 Instandhaltung/<Jahr>                                  Objekt_Absender_Datum_Betrag
   ohne Objekt             → 9.000 Buchführung/Gesellschaften Rechnungen/<Jahr>/<Ges>/<mm.jj>   Ges_Absender_Datum_Betrag */
var BEL={id:'',L:[],busy:'',fehler:''}, OBJOD={}, absMap={}, belPrev={};
const BEL_RG='Prozesslandkarte 3.0/9.000 Buchführung/Gesellschaften Rechnungen';
const BEL_THEMA={grundsteuer:['Grundsteuer'],wasser:['Frischwasser','Wasser'],abwasser:['Schmutzwasser','Abwasser','Wasser'],niederschlag:['Schmutzwasser','Niederschlagswasser','Abwasser'],heizung:['Heizung','Gas','Heizöl','Wärme'],warmwasser:['Heizung','Gas','Warmwasser'],aufzug:['Aufzug'],strassenreinigung:['Straßenreinigung','Strassenreinigung'],muell:['Müll','Abfall'],reinigung:['Reinigung','Gebäudereinigung'],garten:['Gartenpflege','Garten'],allgstrom:['Strom','Allgemeinstrom'],schornstein:['Schornsteinfeger'],versicherung:['Versicherung','Versicherungen'],hauswart:['Hausmeister','Hauswart'],kabel:['Internet','Kabel'],waesche:['Sonstiges'],sonstige_bk:['Wartung','Sonstiges']};
const belFix=s=>String(s||'').replace(/[\\/:*?"<>|#%]+/g,' ').replace(/\s+/g,' ').trim();
const belKey=s=>norm(s).slice(0,60);
function belAbsender(n){ const k=belKey(n); if(absMap[k]) return absMap[k];
  let s=String(n||'').replace(/\b(s\.?\s?a\.?\s?r\.?\s?l\.?|s\.?\s?c\.?\s?a\.?|et cie|& co\.?|ltd\.?|inc\.?|europe|deutschland|germany)(?=\s|$|,)/gi,' ').replace(/\b(gmbh\s*&\s*co\.?\s*kg|gmbh|mbh|ag|kg|ohg|e\.?\s?v\.?|eg|se|ug|haftungsbeschränkt|\(haftungsbeschränkt\))(?=\s|$|,)/gi,' ').replace(/[,.;]+/g,' ');
  return belFix(s).split(' ').filter(Boolean).slice(0,3).join(' ')||'Absender'; }
const belEndung=f=>{ const m=String(f.name||'').match(/\.([A-Za-z0-9]{2,5})$/); return m?m[1].toLowerCase():(/pdf/.test(f.type)?'pdf':'pdf'); };
function belBetragText(v){ const n=parseNum(v); return n!=null&&!isNaN(n)&&/^[\s\d.,€-]+$/.test(String(v))?fnum.format(Math.abs(n))+'€':belFix(v); }
/* Ablageziele einer Buchung (je Teil der Aufteilung) */
function belZiele(it){ const k=it.k||{}, out=[], seen=new Set();
  const push=z=>{ const key=z.art+'|'+(z.obj||'')+'|'+(z.ka||''); if(seen.has(key)) return; seen.add(key); out.push(z); };
  for(const p of it.parts){ const c=p.c, o=objekte.find(x=>x.kz===c.obj); const b=Math.abs(p.tx&&p.tx.b!=null?p.tx.b:it.tx.b);
    if(!o){ continue; }
    if(c.kat==='bk'&&c.ka==='weg') push({art:'weg',obj:o.kz,b,label:o.kz+' · 07 WEG (Hausgeld)'});
    else if(c.kat==='bk'&&c.ka&&c.ka!=='bk_nu') push({art:'bk',obj:o.kz,ka:c.ka,b,label:o.kz+' · 04 Betriebskosten'});
    else if(['bk','inst','umbau','obj_sonst','darl'].includes(c.kat)) push({art:'inst',obj:o.kz,b,label:o.kz+' · 05 Instandhaltung'}); }
  const ges=(k.ges||'WT'); push({art:'ges',obj:'',b:Math.abs(it.tx.b),label:'Gesellschaft '+ges+' · 9.000 Buchführung/Gesellschaften Rechnungen'});
  /* Objektbezug bei Verwaltung/Einnahmen: zusätzlich Instandhaltung des Objekts anbieten */
  for(const p of it.parts){ const o=objekte.find(x=>x.kz===p.c.obj); if(o&&!out.some(z=>z.obj===o.kz)) push({art:'inst',obj:o.kz,b:Math.abs(it.tx.b),label:o.kz+' · 05 Instandhaltung'}); }
  return out; }
async function belObjOrdner(kz){ if(OBJOD[kz]&&OBJOD[kz].basis!==undefined) return OBJOD[kz];
  try{ OBJOD[kz]=await odApi({aktion:'objektordner',kz}); }catch(e){ OBJOD[kz]={basis:'',top:[],unter:{},fehler:e.message||String(e)}; }
  return OBJOD[kz]; }
const belTop=(od,nr,def)=>(od.top||[]).find(t=>t.startsWith(nr+' '))||def;
function belThemaWahl(od,ka){ const bk=belTop(od,'04','04 Betriebskosten'); const vorh=(od.unter&&od.unter[bk])||[]; const want=BEL_THEMA[ka]||['Sonstiges'];
  for(const w of want){ const f=vorh.find(x=>norm(x)===norm(w)); if(f) return f; }
  for(const w of want){ const f=vorh.find(x=>norm(x).startsWith(norm(w))||norm(w).startsWith(norm(x))); if(f) return f; }
  return want[0]; }
function belThemen(od){ const bk=belTop(od,'04','04 Betriebskosten'); const s=new Set([...((od.unter&&od.unter[bk])||[]).filter(x=>!/abrechnung/i.test(x)),'Frischwasser','Gas','Grundsteuer','Hausmeister','Heizung','Internet','Müll','Schmutzwasser','Schornsteinfeger','Strom','Versicherung']); return [...s].sort((a,b)=>a.localeCompare(b,'de')); }
/* Dateiname und Zielordner aus dem Entwurf */
function belName(d,it){ const z=d.ziel, o=z&&z.obj, k=it.k||{}; const pre=o||(k.ges||'WT');
  const teile=[pre,belFix(d.abs)]; if(z&&z.art==='bk') teile.push(belFix(d.thema)); if(z&&z.art==='weg') teile.push('Hausgeld');
  teile.push(d.datum||''); teile.push(belBetragText(d.betrag)); return teile.filter(Boolean).join('_')+'.'+d.ext; }
function belPfad(d,it){ const z=d.ziel; if(!z) return ''; const jahr=(d.datum||it.tx.d).slice(0,4), k=it.k||{};
  if(z.art==='ges'){ const dt=d.datum||it.tx.d; return BEL_RG+'/'+jahr+'/'+(k.ges||'WT')+'/'+dt.slice(5,7)+'.'+dt.slice(2,4); }
  const od=OBJOD[z.obj]; if(!od||!od.basis) return '';
  if(z.art==='bk') return od.basis+'/'+belTop(od,'04','04 Betriebskosten')+'/'+belFix(d.thema);
  if(z.art==='weg') return od.basis+'/'+belTop(od,'07','07 WEG');
  return od.basis+'/'+belTop(od,'05','05 Instandhaltung')+'/'+jahr; }
/* Rechnungsdatum aus dem PDF lesen (falls möglich) */
async function belDatumAusPdf(f){ if(!/\.pdf$/i.test(f.name)||typeof pdfText!=='function') return '';
  try{ const t=await pdfText(f); const m=t.match(/(?:Rechnungsdatum|Rechnungs-Datum|Belegdatum|Datum der Rechnung|Bescheiddatum|Datum)\s*:?\s*(\d{1,2})\.(\d{1,2})\.(\d{2,4})/i);
    if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); } }catch(e){}
  return ''; }
async function belQueue(files,ersetze){ const it=items().find(x=>x.id===U.sel); if(!it) return; if(!canWrite){ toast('Nur Lesezugriff.'); return; }
  const ok=files.filter(f=>/\.(pdf|jpe?g|png|heic|webp)$/i.test(f.name)); if(ok.length<files.length) toast('Nur PDF oder Bild.'); if(!ok.length) return;
  if(BEL.id!==it.id){ BEL={id:it.id,L:[],busy:'',fehler:''}; }
  BEL.busy='Suche Objektordner …'; render();
  const Z=belZiele(it); for(const kz of [...new Set(Z.filter(z=>z.obj).map(z=>z.obj))]) await belObjOrdner(kz);
  const zOk=Z.filter(z=>!z.obj||(OBJOD[z.obj]&&OBJOD[z.obj].basis));
  const fehl=Z.filter(z=>z.obj&&!(OBJOD[z.obj]&&OBJOD[z.obj].basis)).map(z=>z.obj);
  BEL.fehler=fehl.length?'Kein Objektordner in OneDrive gefunden für: '+[...new Set(fehl)].join(', ')+(OBJOD[fehl[0]]&&OBJOD[fehl[0]].fehler?' ('+OBJOD[fehl[0]].fehler+')':'')+'. Ablage dann unter der Gesellschaft.':'';
  for(const f of ok){ const z=zOk[0]; const pdfD=await belDatumAusPdf(f);

/* ---------- Kontoumsätze automatisch aus Nahaus abrufen ----------

function nhLetzte(key){ let m=''; for(const d of Object.values(buch)) if(d&&d.konto===key) for(const t of (d.tx||[])) if(t.d>m) m=t.d; return m; }

var VERTR=[], vtCache=new Map();
const vtZiff=s=>String(s||'').replace(/\D/g,'');
/* Nummer muss als eigenes Wort im Verwendungszweck stehen (Satzzeichen egal), sonst gibt es Zufallstreffer in IBANs und Referenzen */
const vtTok=z=>String(z||'').toUpperCase().split(/[\s\/,;:]+/).map(x=>x.replace(/[^A-Z0-9]/g,'')).filter(x=>x.length>=5);
function vtPasst(v,t,kkey){ const z=String(t.z||'').toUpperCase(), T=vtTok(z);
  for(const n of [v.vnr,v.knr,v.zaehler]){ const s=String(n||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(s.length<5) continue; const d=vtZiff(s); if(T.some(x=>x===s||(d.length>=6&&vtZiff(x)===d&&x.replace(/\d/g,'').length<=3))) return true; }
  if(v.mref&&z.includes(String(v.mref).toUpperCase())) return true;
  if(v.iban&&t.i&&t.i===v.iban&&(!v.konto||kkey===v.konto)&&!v.vnr&&!v.knr) return true;
  return false; }
function vtFuer(it){ if(!VERTR.length||!(it.tx.b<0)) return null; const k=it.id+'|'+VERTR.length; if(vtCache.has(k)) return vtCache.get(k);

  for(const v of Object.keys(sums).filter(v=>!done.has(v))){ const [k,s2,ka]=v.split('|'); h+='<tr><td>?</td><td>'+esc(kontoLabel(k,s2,ka))+'</td><td class="n">'+sums[v].n+'</td><td class="n">'+eur(sums[v].b)+'</td></tr>'; }

    +'</tbody></table></div>';
  return h; }

function opBox(it){ const key=(it.tx.h||'')+'|'+it.tx.b, c=it.c, betrag=it.tx.b;
  let h='<div class="spl opb"><div class="lab">Offene Posten des Mieters</div>';
  if(!MKload) return h+'<div class="sub">Mieterkonten werden geladen …</div></div>';
  if(!Object.keys(MK).length) return h+'<div class="sub">Noch keine Mieterkonten importiert (Hausverwaltung → Mieterkonten).</div></div>';
  if(!mkCalc) mkCalc=compute();
  const saved=it.tx.op&&it.tx.op.pid?it.tx.op:null, D=OPD[key];
  const pid=(D&&D.pid)||(saved&&saved.pid)||mkCalc.ZMAP[key]||'';
  const cands=Object.values(MK).filter(m=>(c.unit&&m.unit===c.unit)||(c.obj&&m.obj===c.obj)).sort((a,b)=>(a.unit===c.unit?0:1)-(b.unit===c.unit?0:1)||(b.von||'').localeCompare(a.von||''));
  h+='<label class="fl">Mieter<select data-opp="'+esc(key)+'"><option value="">– Mieter wählen –</option>'+cands.map(m=>'<option value="'+esc(m.pid)+'"'+(m.pid===pid?' selected':'')+'>'+esc(uName(m.einheit)+' · '+(ed(m).mieter||'')+' ('+dmy(m.von)+(m.bis?'–'+dmy(m.bis):'')+')')+'</option>').join('')+'</select></label>';
  if(!pid) return h+'<div class="sub">Bitte den Mieter wählen, dann erscheinen seine offenen Posten.</div></div>';
  if(!opCache[key]) opCache[key]=compute({ex:key});
  const x=opCache[key].res[pid]; if(!x) return h+'<div class="sub">Für dieses Mietverhältnis gibt es kein Mieterkonto (Objekt nicht aktiv).</div></div>';
  const L=x.op.concat(x.opK||[],x.opF||[]);
  let A; if(D&&D.a) A=D.a; else if(saved&&saved.pid===pid) A=saved.a||[]; else { A=[]; let r=betrag; const zm=zielMonat(it.tx), LL=x.op.concat(x.opF||[]), hit=o=>zm.includes(o.d.slice(0,7))&&/^Miete/.test(o.t); for(const o of LL.filter(hit).concat(LL.filter(o=>!hit(o)))){ if(r<=0.005) break; if(o.k) continue; const b=r2(Math.min(o.b,r)); A.push({id:o.id,b}); r=r2(r-b); } }
  const am=id=>{ const a=A.find(y=>y.id===id); return a?Number(a.b)||0:0; };
  const sum=r2(A.reduce((s2,a)=>s2+(Number(a.b)||0),0)), rest=r2(betrag-sum);
  if(!L.length) h+='<div class="sub">Keine offenen Posten – die Zahlung wird als Guthaben / Vorauszahlung geführt.</div>';
  else { h+='<table class="opt"><thead><tr><th></th><th>Fällig</th><th>Posten</th><th class="n">offen</th><th class="n">Zahlung</th></tr></thead><tbody>';
    for(const o of L){ const v=am(o.id); h+='<tr><td><input type="checkbox" data-opc="'+esc(key+'|'+o.id)+'"'+(v>0?' checked':'')+'></td><td>'+esc(dmy(o.d))+'</td><td>'+esc(o.t)+(o.k?' <span class="pill src">Kaution</span>':'')+(o.fut?' <span class="pill src">noch nicht fällig</span>':'')+'</td><td class="n">'+eur(o.b)+'</td><td class="n"><input type="text" inputmode="decimal" class="num" data-opb="'+esc(key+'|'+o.id)+'" value="'+(v?fnum.format(v):'')+'"></td></tr>'; }
    h+='</tbody></table>'; }
  h+='<div class="kvr"><span>Zahlung</span><b>'+eur(betrag)+'</b></div><div class="kvr"><span>zugeordnet</span><b>'+eur(sum)+'</b></div><div class="kvr"><span>'+(rest>=0?'Rest (Guthaben / Vorauszahlung)':'zu viel zugeordnet')+'</span><b class="'+(rest<-0.005?'neg':'')+'">'+eur(rest)+'</b></div>';
  h+='<div class="acts"><button class="primary small" data-opsave="'+esc(key)+'">Zuordnung speichern</button>'+(saved?'<button class="ghost small" data-opdel="'+esc(key)+'">Zuordnung entfernen</button><span class="sub">gespeichert</span>':(D?'':'<span class="sub">Vorschlag: älteste Posten zuerst</span>'))+'</div></div>';
  return h; }
function opDraft(key,it){ if(!OPD[key]){ const saved=it.tx.op&&it.tx.op.pid?it.tx.op:null; const pid=(saved&&saved.pid)||(mkCalc&&mkCalc.ZMAP[key])||''; OPD[key]={pid,a:null}; }
  if(!OPD[key].a){ /* aktuellen Stand (gespeichert oder Vorschlag) übernehmen */ const box=document.querySelectorAll('[data-opb^="'+CSS.escape(key)+'|"]'); OPD[key].a=[...box].map(i=>({id:i.dataset.opb.slice(key.length+1),b:parseNum(i.value)||0})).filter(a=>a.b>0); }
  return OPD[key]; }

  try{ let u, typ='';
    if(b.od){ const r=await belVorschauUrl(b); if(!r){ if($('prev')) $('prev').innerHTML='<div class="sub">Datei ist zu groß für die Vorschau. <a href="#" data-bopen="0">In OneDrive öffnen</a></div>'; return; } u=r.u; typ=r.typ; }

/* Aufteilen: Restbetrag sofort berechnen und in die letzte freie Zeile eintragen */
/* Betrag eines Teils: ohne Vorzeichen eingegeben = gleiches Vorzeichen wie die Zahlung (mit + bleibt er positiv) */
function spWert(p,tot){ const s=String(p.b||'').trim(); let v=parseNum(s); if(v==null||isNaN(v)) return 0; if(tot<0&&v>0&&!s.startsWith('+')) v=-v; return v; }
function spRestDraft(){ const it=items().find(x=>x.id===splitDraft.id); if(!it) return; const P=splitDraft.parts, z=P.length-1; const r=r2(it.tx.b-P.reduce((a,p,j)=>a+(j===z?0:spWert(p,it.tx.b)),0)); P[z].b=r?fnum.format(r):''; P[z].auto=true; }
function spRest(i){ const it=items().find(x=>x.id===splitDraft.id); if(!it) return; const P=splitDraft.parts;
  P[i].ts=Date.now(); let z=-1; for(let j=P.length-1;j>=0;j--){ if(j!==i&&(P[j].auto||String(P[j].b).trim()==='')){ z=j; break; } }
  if(z<0){ let best=Infinity; P.forEach((p,j)=>{ if(j!==i&&(p.ts||0)<best){ best=p.ts||0; z=j; } }); }
  if(z>=0){ const sonst=P.reduce((a,p,j)=>a+(j===z?0:spWert(p,it.tx.b)),0); const r=r2(it.tx.b-sonst); P[z].b=r?fnum.format(r):''; P[z].auto=true; const el=$('sp-b-'+z); if(el) el.value=P[z].b; }
  const rest=r2(it.tx.b-P.reduce((a,p)=>a+spWert(p,it.tx.b),0)), el=$('sp-rest'); if(el){ el.textContent=eur(rest); el.className=Math.abs(rest)<0.005?'pos':'neg'; } }

  box.innerHTML=h||'<div class="kc-leer">Kein Konto gefunden</div>'; box.hidden=false; const a=box.querySelector('.akt'); if(a) a.scrollIntoView({block:'nearest'}); }
function kcWahl(inp,v){ const sel=$(inp.dataset.kc); if(!sel) return; sel.value=v; inp.parentNode.querySelector('.kc-list').hidden=true; KC.el=null; inp.blur(); sel.dispatchEvent(new Event('change',{bubbles:true})); }
document.addEventListener('focusin',e=>{ const t=e.target; if(!t.classList||!t.classList.contains('kc-in')) return; t.dataset.typed='0'; KC.ix=0; t.select(); kcZeigen(t); });
document.addEventListener('input',e=>{ const t=e.target; if(!t.classList||!t.classList.contains('kc-in')) return; e.stopPropagation(); t.dataset.typed='1'; KC.ix=0; kcZeigen(t); },true);
document.addEventListener('keydown',e=>{ const t=e.target; if(!t.classList||!t.classList.contains('kc-in')) return; const L=kcOpts(t);
  if(e.key==='ArrowDown'){ e.preventDefault(); KC.ix=Math.min(L.length-1,KC.ix+1); kcZeigen(t); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); KC.ix=Math.max(0,KC.ix-1); kcZeigen(t); }
  else if(e.key==='Enter'){ e.preventDefault(); if(L[KC.ix]) kcWahl(t,L[KC.ix].v); }
  else if(e.key==='Escape'){ t.parentNode.querySelector('.kc-list').hidden=true; t.blur(); } },true);
document.addEventListener('mousedown',e=>{ const o=e.target.closest('.kc-o'); if(o&&KC.el){ e.preventDefault(); kcWahl(KC.el,o.dataset.kcv); return; }
  if(!e.target.closest('.kcombo')) document.querySelectorAll('.kc-list').forEach(b=>{ if(!b.hidden){ b.hidden=true; const i=b.parentNode.querySelector('.kc-in'); const sel=i&&$(i.dataset.kc); if(i&&sel){ const op=sel.options[sel.selectedIndex]; i.value=op&&op.value!=='||'?op.textContent:''; } } }); });
})();
</script>
</body>
