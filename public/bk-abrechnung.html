<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betriebskostenabrechnung</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f5f8;--card:#ffffff;--ink:#18202c;--muted:#5f6b7a;--line:#e0e5eb;--soft:#eef1f5;--accent:#2f5d8a;--accent-ink:#ffffff;--accent-soft:#e3ecf5;
  --pos:#1d7a4c;--pos-bg:#e5f4ec;--neg:#b42318;--neg-bg:#fcebe9;--warn:#946200;--warn-bg:#fff4d6;--chip:#edf1f6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:1600px;margin:0 auto;padding:16px 24px 60px}
h1{font-size:22px;font-weight:800}h2{font-size:16px;font-weight:700;margin:18px 0 8px}
.sub{color:var(--muted);font-size:12px}
.kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{font-size:12px;padding:3px 8px}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:3px 6px}
button:disabled{opacity:.6;cursor:default}
.lnk{color:var(--accent);cursor:pointer;background:none;border:0;padding:0;font-weight:600;text-decoration:none}.lnk:hover{text-decoration:underline}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi .l{font-size:12px;font-weight:700;color:var(--muted)}.kpi .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.inp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap;background:var(--chip);color:var(--muted)}
.p-ok{background:var(--pos-bg);color:var(--pos)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-neg{background:var(--neg-bg);color:var(--neg)}.p-acc{background:var(--accent-soft);color:var(--accent)}
.tab{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
.tab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tab td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.ue .tab{font-size:14px}.ue .tab td{padding:12px 14px}.ue .tab th{padding:10px 14px}
.tab td.n,.tab th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tab tr.kl td{cursor:pointer}.tab tr.kl:hover td{background:var(--accent-soft)}
.tbox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
.empty{color:var(--muted);font-size:13px;padding:24px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:12px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
.hin{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}.toast.on{opacity:1}
/* Kacheln */
.kacheln{display:flex;flex-direction:column;gap:8px}
.kachel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;cursor:pointer;display:grid;grid-template-columns:minmax(180px,280px) 160px minmax(0,1fr) auto;gap:18px;align-items:center}
.kachel:hover{border-color:var(--accent)}
.kachel.fertig{border-color:#9fd3b5;background:#f6fbf8}
.kachel .t{font-weight:700;font-size:15px}.kachel .b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.kachel .z{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.kachel.neu{border-style:dashed;color:var(--muted);display:block;text-align:center;font-weight:600}
/* Schritte */
.schritte{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.schritte button{border-radius:999px;font-size:13px}.schritte button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* Fenster */
.ov{position:fixed;inset:0;background:rgba(15,23,35,.35);z-index:60}
.dlg.drop{outline:3px dashed var(--acc);outline-offset:-8px}
.dropz{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);margin-top:8px}
.dlg.drop .dropz{border-color:var(--acc);color:var(--ink)}
.az td{vertical-align:top}.az tr.aus td{color:var(--muted)}.az .gr td{background:var(--bg);font-weight:700}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1500px,98vw);height:94vh;display:flex;flex-direction:column;background:var(--card);border-radius:14px;z-index:61;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.dh b{font-size:17px}
.db{padding:14px 22px;overflow:auto;flex:1}
.df{display:flex;gap:8px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.abs{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.abs:first-child{margin-top:0}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 12px}
.fl{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.fl input,.fl select,.fl textarea{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13.5px;color:var(--ink)}
.tab input,.tab select{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:13px;max-width:100%}
.tab input.zahl{width:110px;text-align:right}
.bel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.bel.neu{background:var(--soft)}
.bel .k{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.such{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
label.up{border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--card);cursor:pointer;font-size:13px}
@media(max-width:800px){.wrap{padding:12px}.fg{grid-template-columns:1fr 1fr}.kachel{grid-template-columns:1fr auto}}
</style></head><body>
<div class="wrap" id="app"><div class="empty">Lade …</div></div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
window.osSupabase=sb;
const NUTZER={'ramona@andersmacher.info':'Ramona','juergen@andersmacher.info':'Jürgen','eric@andersmacher.info':'Eric'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fnum=new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=v=>v==null||v===''||isNaN(Number(v))?'–':fnum.format(Number(v))+' €';
const dmy=d=>d?String(d).slice(0,10).split('-').reverse().join('.'):'–';
const r2=v=>Math.round((Number(v)||0)*100)/100;
function parseNum(s){ if(s==null) return null; s=String(s).replace(/[€\s]/g,''); if(s==='') return null; if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); const v=Number(s); return isNaN(v)?null:v; }
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim();
function toast(t,ms){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),ms||3500);}
const tage=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5)+1;
async function token(){const {data}=await sb.auth.getSession();return data&&data.session?data.session.access_token:'';}
async function odApi(body){let r;try{r=await fetch('/api/onedrive',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await token()},body:JSON.stringify(body)});}catch(e){throw new Error('OneDrive nicht erreichbar.');}
  let j=null;try{j=await r.json();}catch(e){}if(!j)throw new Error('OneDrive nicht erreichbar ('+r.status+').');if(j.error)throw new Error(j.error);return j;}
async function odOeffnen(id){const w=window.open('','_blank');try{const r=await odApi({aktion:'link',id});const u=r.web||r.download;if(w)w.location.href=u;else window.open(u,'_blank');}catch(e){if(w)w.close();toast('Datei nicht erreichbar: '+e.message);}}

/* ---------- Stammdaten ---------- */
const SCHLUESSEL=[['flaeche','Wohn-/Nutzfläche'],['personen','Personen'],['einheiten','je Einheit gleich'],['mea','Miteigentumsanteile'],['verbrauch','Verbrauch (Zähler/Messdienst)'],['direkt','direkt einem Mieter'],['nicht_umlegen','nicht umlegen']];
const schlLabel=v=>(SCHLUESSEL.find(x=>x[0]===v)||[,'–'])[1];
const STANDARD=[['Grundsteuer','1','betriebskosten','flaeche'],['Frischwasser','2','betriebskosten','personen'],['Schmutzwasser','3','betriebskosten','personen'],['Niederschlagswasser','3','betriebskosten','flaeche'],
  ['Heizkosten','4','heizkosten','verbrauch'],['Warmwasser','5','heizkosten','verbrauch'],['Müllgebühren','8','betriebskosten','personen'],['Straßenreinigung','8','betriebskosten','flaeche'],['Gebäudereinigung','9','betriebskosten','flaeche'],
  ['Gartenpflege','10','betriebskosten','flaeche'],['Allgemeinstrom','11','betriebskosten','flaeche'],['Schornsteinfeger','12','betriebskosten','flaeche'],['Versicherungen','13','betriebskosten','flaeche'],['Hausmeister','14','betriebskosten','flaeche'],
  ['Kabel / Antenne','15','betriebskosten','einheiten'],['Rauchwarnmelder','17','betriebskosten','einheiten']];
/* welche Zähler zu welcher Kostenart passen */
const ZTYP=k=>{const n=norm(k.name);const re=/strom/.test(n)?/strom/:/wasser/.test(n)&&!/niederschlag/.test(n)?/wasser/:/gas|heiz|warm/.test(n)?/gas|warm|warme/:null;return re?{test:t=>re.test(norm(t))}:null;};
const LOHN=k=>/hausmeister|reinigung|garten|schornstein|winterdienst/.test(norm(k.name));

let AZ=null; let EINST={jahre:{}}; let ICH='', JAHR=new Date().getFullYear()-1, OBJ=[], EIN=[], ABR=[], CUR=null, D=null, SCHRITT='kosten', K=null;
const P=new URLSearchParams(location.search); if(/^\d{4}$/.test(P.get('jahr')||'')) JAHR=Number(P.get('jahr'));
const frist=j=>(Number(j)+1)+'-12-31';

async function laden(){ const u=(await sb.auth.getUser()).data.user; if(!u){ $('app').innerHTML='<div class="empty">Bitte im Wohntraum OS anmelden.</div>'; return; }
  ICH=NUTZER[String(u.email||'').toLowerCase()]||u.email||'';
  const [o,e,a]=await Promise.all([sb.from('obj_objekte').select('id,kz,name,strasse,plz,ort,status,gesellschaft,eigentuemer').order('kz'),sb.from('obj_einheiten').select('id,objekt_id,bezeichnung,art,lage,flaeche,mea,aktiv,nahaus_id,sort').order('sort'),sb.from('bk_abrechnungen').select('*')]);
  if(o.error){ $('app').innerHTML='<div class="empty">Daten nicht lesbar: '+esc(o.error.message)+'</div>'; return; }
  OBJ=(o.data||[]).filter(x=>x.status!=='Verkauft'||true); EIN=e.data||[]; ABR=a.data||[];
  try{ const {data}=await sb.from('os_docs').select('data').eq('app','oc').eq('pfad','einstellungen/bka').maybeSingle(); if(data&&data.data) EINST=Object.assign({jahre:{}},data.data); }catch(e){}
  if(P.get('obj')){ const ob=OBJ.find(x=>x.kz===P.get('obj')); if(ob){ await oeffnen(ob.kz); return; } }
  render(); }
const objVon=kz=>OBJ.find(x=>x.kz===kz);
const jahrEinst=()=>EINST.jahre[String(JAHR)]||null;
/* Objekte des Jahres: festgelegte Liste, sonst alle Objekte mit aktiven Einheiten */
function jahrObjekte(){ const J=jahrEinst(); if(J&&Array.isArray(J.objekte)) return J.objekte.map(objVon).filter(Boolean);
  return OBJ.filter(o=>EIN.some(e=>e.objekt_id===o.id&&e.aktiv!==false)); }
const hinweisVon=kz=>((jahrEinst()||{}).hinweis||{})[kz]||'';
async function einstSpeichern(){ const {error}=await sb.from('os_docs').upsert({app:'oc',pfad:'einstellungen/bka',data:EINST,updated_at:new Date().toISOString()},{onConflict:'app,pfad'}); if(error) toast('Nicht gespeichert: '+error.message); }
function jahrSichern(){ if(!EINST.jahre[String(JAHR)]) EINST.jahre[String(JAHR)]={objekte:jahrObjekte().map(o=>o.kz),hinweis:{}}; const J=EINST.jahre[String(JAHR)]; J.hinweis=J.hinweis||{}; return J; }
async function objRaus(kz,btn){ if(btn.dataset.sure!=='1'){ btn.dataset.sure='1'; btn.textContent='wirklich herausnehmen?'; return; } const J=jahrSichern(); J.objekte=J.objekte.filter(x=>x!==kz); await einstSpeichern(); toast(kz+' ist für '+JAHR+' nicht mehr in der Übersicht.'); render(); }
async function objDazu(inp){ const v=inp.value.trim(); inp.value=''; if(!v) return; const o=OBJ.find(x=>x.kz.toLowerCase()===v.split(' ')[0].toLowerCase()||(x.kz+' · '+x.name)===v); if(!o){ toast('Bitte ein Objekt aus der Liste wählen.'); return; }
  const J=jahrSichern(); if(!J.objekte.includes(o.kz)) J.objekte.push(o.kz); await einstSpeichern(); toast(o.kz+' für '+JAHR+' aufgenommen.'); render(); }
async function hinweisSetzen(kz){ const J=jahrSichern(); const v=prompt('Hinweis zu '+kz+' für '+JAHR+' (z. B. nur WE2 Barth). Leer = kein Hinweis.',J.hinweis[kz]||''); if(v==null) return; if(v.trim()) J.hinweis[kz]=v.trim(); else delete J.hinweis[kz]; await einstSpeichern(); render(); }
const abrVon=kz=>ABR.find(x=>x.kennung===kz&&Number(x.jahr)===JAHR);
function einheitenVon(o){ const L=EIN.filter(e=>e.objekt_id===o.id), A=L.filter(e=>e.aktiv!==false); return A.length?A:L; }

/* ---------- Übersicht ---------- */
async function uebersichtDaten(){ const ids=ABR.filter(a=>Number(a.jahr)===JAHR).map(a=>a.id); if(!ids.length) return {};
  const [k,c]=await Promise.all([sb.from('bk_kostenarten').select('abrechnung_id,erledigt').in('abrechnung_id',ids),sb.from('bk_kosten').select('abrechnung_id,betrag,anteil').in('abrechnung_id',ids)]);
  const out={}; for(const x of (k.data||[])){ const o=out[x.abrechnung_id]=out[x.abrechnung_id]||{n:0,f:0,s:0}; o.n++; if(x.erledigt) o.f++; }
  for(const x of (c.data||[])){ const o=out[x.abrechnung_id]=out[x.abrechnung_id]||{n:0,f:0,s:0}; o.s+=Number(x.anteil!=null?x.anteil:x.betrag)||0; } return out; }
let UE={};
function render(){ if(CUR) return renderObjekt();
  const L=jahrObjekte().sort((a,b)=>a.kz.localeCompare(b.kz,'de',{numeric:true}));
  const rest=Math.ceil((new Date(frist(JAHR)+'T23:59:59')-new Date())/864e5);
  let h='<div class="kopf"><div><h1>Betriebskostenabrechnung '+JAHR+'</h1><div class="sub">Abgerechnet wird nach Rechnungen (Leistungszeitraum '+JAHR+'). Frist für den Zugang beim Mieter: '+dmy(frist(JAHR))+(rest>=0?' – noch '+rest+' Tage':' – abgelaufen')+'.</div></div>'
    +'<div class="acts" style="margin-top:0"><button onclick="JAHR--;UE={};uebersicht()">Vorjahr</button><b style="padding:0 6px">'+JAHR+'</b><button onclick="JAHR++;UE={};uebersicht()">Folgejahr</button></div></div>';
  const ang=L.filter(o=>abrVon(o.kz)).length;
  h+='<div class="kpis"><div class="kpi"><div class="l">Objekte</div><div class="v">'+L.length+'</div></div><div class="kpi"><div class="l">Abrechnung angelegt</div><div class="v">'+ang+'</div></div>'
    +'<div class="kpi"><div class="l">Kostenarten fertig</div><div class="v">'+Object.values(UE).reduce((a,x)=>a+x.f,0)+' / '+Object.values(UE).reduce((a,x)=>a+x.n,0)+'</div></div></div>';
  h+='<div class="tbox"><table class="tab"><thead><tr><th>Objekt</th><th>Einheiten</th><th>Stand</th><th>Kostenarten fertig</th><th class="n">Kosten '+JAHR+'</th><th></th></tr></thead><tbody>'
    +L.map(o=>{ const a=abrVon(o.kz), u=a&&UE[a.id]; const n=einheitenVon(o).length, hw=hinweisVon(o.kz);
      return '<tr class="kl" onclick="if(!event.target.closest(\'button\'))oeffnen(\''+esc(o.kz)+'\')"><td><b>'+esc(o.kz)+'</b> <span class="sub">'+esc(o.name||'')+'</span>'+(o.status==='Verkauft'?' <span class="pill">verkauft – letzte Abrechnung</span>':'')+(hw?'<div class="sub" style="color:var(--warn)">'+esc(hw)+'</div>':'')+'</td><td>'+n+'</td><td>'+(a?'<span class="pill p-acc">angelegt</span>':'<span class="pill">noch nicht angelegt</span>')+'</td><td>'+(u?u.f+' / '+u.n:'–')+'</td><td class="n">'+(u?eur(u.s):'–')+'</td>'
        +'<td class="n"><button class="ghost small" onclick="hinweisSetzen(\''+esc(o.kz)+'\')">Hinweis</button><button class="ghost small" onclick="objRaus(\''+esc(o.kz)+'\',this)">herausnehmen</button></td></tr>'; }).join('')+'</tbody></table></div>';
  h+='<div class="acts"><input class="inp" list="dl-objdazu" data-wahl="1" placeholder="Objekt für '+JAHR+' aufnehmen, z. B. Rh24" onchange="objDazu(this)" style="width:320px"><datalist id="dl-objdazu">'+OBJ.filter(o=>!L.includes(o)).sort((a,b)=>a.kz.localeCompare(b.kz,'de',{numeric:true})).map(o=>'<option value="'+esc(o.kz+' · '+o.name)+'">').join('')+'</datalist></div>';
  $('app').innerHTML='<div class="ue">'+h+'</div>'; }
async function uebersicht(){ CUR=null; D=null; K=null; try{ const a=await sb.from('bk_abrechnungen').select('*'); ABR=a.data||[]; UE=await uebersichtDaten(); }catch(e){} render(); try{ history.replaceState(null,'',location.pathname+'?jahr='+JAHR); }catch(e){} }

/* ---------- Objekt ---------- */
async function oeffnen(kz){ CUR=kz; SCHRITT='kosten'; D=null; $('app').innerHTML='<div class="empty">Lade '+esc(kz)+' …</div>'; await objLaden(); try{ history.replaceState(null,'',location.pathname+'?obj='+encodeURIComponent(kz)+'&jahr='+JAHR); }catch(e){} }
async function objLaden(){ const o=objVon(CUR), a=abrVon(CUR); D={o,a,ein:[],kas:[],kos:[],mvs:[],z:[],zs:[]};
  const [z]=await Promise.all([sb.from('objekt_zaehler').select('*').eq('object_id',o.id)]); D.z=(z.data||[]).filter(x=>x.aktiv!==false);
  if(D.z.length){ const s=await sb.from('objekt_zaehlerstaende').select('*').in('zaehler_id',D.z.map(x=>x.id)).order('datum'); D.zs=s.data||[]; }

async function azUebernehmen(){ const S=AZ.L.filter(x=>x.an&&x.ka); if(!S.length) return; for(const x of S) if(parseNum(x.betrag)==null){ toast('Bei '+x.name+' fehlt der Betrag.'); return; }
  const rows=S.map(x=>{ const b=(x.neg?-1:1)*parseNum(x.betrag), a=anteilBerechnen({betrag:b,von:x.von,bis:x.bis});
    return {abrechnung_id:D.a.id,kostenart_id:x.ka,datum:x.datum||x.bis||D.a.zeitraum_bis,betrag:b,empfaenger:x.empfaenger||null,verwendungszweck:x.rechnungsnr?'Rechnung '+x.rechnungsnr:null,quelle:'beleg',notiz:x.name,
      beleg:{od:x.id,n:x.name,pfad:x.pfad},von:x.von||null,bis:x.bis||null,anteil:a,rechnungsnr:x.rechnungsnr||null}; });
  const {data,error}=await sb.from('bk_kosten').insert(rows).select(); if(error){ toast('Nicht gespeichert: '+error.message,6000); return; }
  D.kos.push(...(data||[])); const n=rows.length; AZ=null; toast(n+' Beleg'+(n===1?'':'e')+' zugeordnet. Bitte in den Kostenarten prüfen.',6000); render(); }
/* Beleg auf mehrere Kostenarten aufteilen */
const kasSortiert=()=>D.kas.slice().sort((a,b)=>a.name.localeCompare(b.name,'de'));
function teileAn(){ const n=K.neu; n.teile=[{ka:K.id,betrag:''},{ka:'',betrag:''}]; kNeu2(); }
function teileAus(){ K.neu.teile=null; kNeu2(); }
function teilKa(i,inp){ const v=inp.value.trim().toLowerCase(); const ka=D.kas.find(x=>x.name.toLowerCase()===v); if(v&&!ka){ toast('Bitte eine Kostenart aus der Liste wählen.'); inp.value=''; }
  K.neu.teile[i].ka=ka?ka.id:''; kNeu2(); }
function teilBetrag(i,v){ K.neu.teile[i].betrag=v; kNeu2(); }
function teilDazu(){ K.neu.teile.push({ka:'',betrag:''}); kNeu2(); }
function teilWeg(i){ K.neu.teile.splice(i,1); if(!K.neu.teile.length) K.neu.teile=null; kNeu2(); }
function teileHtml(n){ const T=n.teile, sum=T.reduce((a,t)=>a+(parseNum(t.betrag)||0),0), ges=parseNum(n.betrag);
  let h='<div class="abs" style="margin-top:10px">Aufteilung auf Kostenarten</div><datalist id="dl-teilka">'+kasSortiert().map(k=>'<option value="'+esc(k.name)+'">').join('')+'</datalist>';
  h+='<div class="tbox"><table class="tab"><thead><tr><th>Kostenart</th><th class="n">Teilbetrag brutto (€)</th><th class="n">Anteil für '+JAHR+'</th><th></th></tr></thead><tbody>'
    +T.map((t,i)=>{ const ka=D.kas.find(x=>x.id===t.ka), a=anteilBerechnen({betrag:t.betrag,von:n.von,bis:n.bis});
      return '<tr><td><input list="dl-teilka" data-wahl="1" value="'+esc(ka?ka.name:'')+'" placeholder="Kostenart wählen" onchange="teilKa('+i+',this)" style="width:260px"></td>'
        +'<td class="n"><input class="zahl" style="width:110px" inputmode="decimal" value="'+esc(t.betrag)+'" onchange="teilBetrag('+i+',this.value)"></td>'
        +'<td class="n">'+(a!=null?eur(a):'–')+'</td><td class="n"><button class="small ghost" onclick="teilWeg('+i+')">entfernen</button></td></tr>'; }).join('')
    +'<tr><td><b>Summe</b></td><td class="n"><b>'+eur(sum)+'</b></td><td></td><td></td></tr></tbody></table></div>';
  h+='<div class="acts" style="margin-top:6px"><button class="small" onclick="teilDazu()">Weitere Kostenart</button><button class="small ghost" onclick="teileAus()">Nicht aufteilen</button>'
    +(ges!=null&&Math.abs(ges-sum)>0.005?'<span class="sub">Vom Gesamtbetrag '+eur(ges)+' werden '+eur(ges-sum)+' nicht übernommen (z. B. Vorauszahlung Folgejahr).</span>':'')+'</div>';
  h+='<div class="sub">Nicht umlagefähig, Lohnanteil und Verbrauch werden nur bei der Kostenart dieses Fensters ('+esc(K.name)+') eingetragen.</div>';
  return h; }
async function teileSpeichern(){ const n=K.neu; const T=n.teile.filter(t=>t.ka||String(t.betrag).trim());
  if(!T.length){ toast('Bitte mindestens eine Kostenart mit Betrag eintragen.'); return; }
  for(const t of T){ if(!t.ka){ toast('Bitte bei jeder Zeile eine Kostenart wählen.'); return; } if(parseNum(t.betrag)==null){ toast('Bitte bei jeder Zeile einen Teilbetrag eintragen.'); return; } }
  if(new Set(T.map(t=>t.ka)).size<T.length){ toast('Jede Kostenart bitte nur einmal.'); return; }
  if(n.von&&n.bis&&n.bis<n.von){ toast('Leistung bis liegt vor Leistung von.'); return; }
  const ges=parseNum(n.betrag); const rows=T.map(t=>{ const b=parseNum(t.betrag), hier=t.ka===K.id, a=anteilBerechnen({betrag:b,von:n.von,bis:n.bis}), nu=hier?(parseNum(n.nicht_umlagefaehig)||0):0, faktor=b?a/b:1;
    return {abrechnung_id:D.a.id,kostenart_id:t.ka,datum:n.datum||n.bis||D.a.zeitraum_bis,betrag:b,empfaenger:n.empfaenger||null,verwendungszweck:n.rechnungsnr?'Rechnung '+n.rechnungsnr:null,quelle:'beleg',notiz:n.beleg.n,
      beleg:Object.assign({},n.beleg,{teil:true,gesamt:ges}),von:n.von||null,bis:n.bis||null,anteil:r2(a-nu*faktor),nicht_umlagefaehig:nu||null,lohnanteil:hier?parseNum(n.lohnanteil):null,rechnungsnr:n.rechnungsnr||null,verbrauch:hier?parseNum(n.verbrauch):null}; });
  const {data,error}=await sb.from('bk_kosten').insert(rows).select(); if(error){ toast('Nicht gespeichert: '+error.message,6000); return; }
  D.kos.push(...(data||[])); K.neu=null;
  toast('Aufgeteilt auf '+rows.length+' Kostenarten: '+rows.map(r=>(D.kas.find(x=>x.id===r.kostenart_id)||{}).name+' '+eur(r.anteil)).join(', ')+'.',7000); kNeu2(); }
async function belegSpeichern(){ const n=K.neu, ka=kKa(); if(n.teile) return teileSpeichern(); const b=parseNum(n.betrag); if(b==null){ toast('Bitte den Gesamtbetrag eintragen.'); return; }
  if(n.von&&n.bis&&n.bis<n.von){ toast('Leistung bis liegt vor Leistung von.'); return; }
  const a=anteilBerechnen(n), nu=parseNum(n.nicht_umlagefaehig)||0, faktor=b?a/b:1;
  const row={abrechnung_id:D.a.id,kostenart_id:ka.id,datum:n.datum||n.bis||D.a.zeitraum_bis,betrag:b,empfaenger:n.empfaenger||null,verwendungszweck:n.rechnungsnr?'Rechnung '+n.rechnungsnr:null,quelle:'beleg',notiz:n.beleg.n,
    beleg:n.beleg,von:n.von||null,bis:n.bis||null,anteil:r2(a-nu*faktor),nicht_umlagefaehig:nu||null,lohnanteil:parseNum(n.lohnanteil),rechnungsnr:n.rechnungsnr||null,verbrauch:parseNum(n.verbrauch)};
  const {data,error}=await sb.from('bk_kosten').insert(row).select().single(); if(error){ toast('Nicht gespeichert: '+error.message,6000); return; }
  D.kos.push(data); K.neu=null; toast('Beleg übernommen: '+eur(data.anteil)+' für '+JAHR+'.'); kNeu2(); }
function belegZeile(c){ return '<div class="bel"><div class="k"><span>'+(c.beleg&&c.beleg.od?'<a class="lnk" onclick="odOeffnen(\''+esc(c.beleg.od)+'\')">'+esc(c.beleg.n||c.notiz||'Beleg')+'</a>':'<b>'+esc(c.notiz||c.empfaenger||'Kostenbuchung')+'</b>')+'</span><span><b>'+eur(c.anteil!=null?c.anteil:c.betrag)+'</b> <span class="sub">für '+JAHR+'</span></span></div>'
  +'<div class="sub">'+esc([c.empfaenger,c.rechnungsnr?'Nr. '+c.rechnungsnr:'',c.datum?'vom '+dmy(c.datum):'',c.von&&c.bis?'Leistung '+dmy(c.von)+' bis '+dmy(c.bis):'',c.beleg&&c.beleg.teil?'Teilbetrag '+eur(c.betrag)+(c.beleg.gesamt!=null?' aus Beleg über '+eur(c.beleg.gesamt):''):'Gesamtbetrag '+eur(c.betrag),c.nicht_umlagefaehig?'nicht umlagefähig '+eur(c.nicht_umlagefaehig):'',c.lohnanteil?'Lohnanteil '+eur(c.lohnanteil):'',c.verbrauch?'Verbrauch '+fnum.format(c.verbrauch):''].filter(Boolean).join(' · '))+'</div>'
  +'<div class="acts" style="margin-top:4px"><button class="small ghost" onclick="belegWeg(\''+c.id+'\',this)">Entfernen</button></div></div>'; }
async function belegWeg(id,btn){ if(btn.dataset.sure!=='1'){ btn.dataset.sure='1'; btn.textContent='wirklich entfernen?'; return; }
  const {error}=await sb.from('bk_kosten').delete().eq('id',id); if(error){ toast('Nicht entfernt: '+error.message); return; } D.kos=D.kos.filter(c=>c.id!==id); toast('Beleg aus der Abrechnung entfernt (die Datei bleibt in OneDrive).'); kNeu2(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(AZ) azZu(); else if(K) kZu(); } });
/* Datei ins Fenster ziehen */
document.addEventListener('dragover',e=>{ if(!K||!e.dataTransfer||![...e.dataTransfer.types].includes('Files')) return; e.preventDefault(); const d=document.querySelector('.dlg'); if(d) d.classList.add('drop'); });
document.addEventListener('dragleave',e=>{ if(e.relatedTarget) return; const d=document.querySelector('.dlg'); if(d) d.classList.remove('drop'); });
document.addEventListener('drop',e=>{ if(!K) return; e.preventDefault(); const d=document.querySelector('.dlg'); if(d) d.classList.remove('drop'); const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f) return;
  if(K.neu){ toast('Bitte zuerst den offenen Beleg übernehmen oder verwerfen.'); return; } if(e.dataTransfer.files.length>1) toast('Es wird nur die erste Datei übernommen.'); kHochDatei(f); });
laden().then(()=>{ if(!CUR) uebersicht(); });
</script></body></html>
