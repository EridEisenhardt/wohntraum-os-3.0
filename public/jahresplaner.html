<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jahresplaner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--surf:#fff;--line:#e6e8ec;--text:#1c2024;--muted:#6b7280;--accent:#185fa5}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.hdr{background:var(--surf);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hdr-title{font-size:16px;font-weight:700}.hdr-sub{font-size:11px;color:var(--muted)}
.wrap{max-width:1400px;margin:12px auto;padding:0 14px 40px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{font:inherit;font-size:14px;font-weight:700;padding:8px 20px;border:1px solid var(--line);border-radius:9px;background:var(--surf);color:var(--muted);cursor:pointer}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:11.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.block{overflow-x:auto;background:var(--surf);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
table.cal{border-collapse:collapse;width:100%;table-layout:fixed;min-width:900px}
table.cal th{background:#1c2024;color:#fff;font-size:12px;font-weight:700;padding:5px 4px;border:1px solid #2b2f36;width:16.66%}
table.cal td{border:1px solid #e6e8ec;height:22px;font-size:11px;padding:0;vertical-align:top}
.daywrap{display:flex;align-items:stretch;min-height:20px;cursor:pointer;position:relative}
.daywrap:hover{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
.dn{flex:0 0 34px;padding:2px 3px;font-variant-numeric:tabular-nums;display:flex;gap:3px;color:#333}
.dn b{min-width:15px;text-align:right}
.we{background:#fff9c4}.hol{background:#ffd9cf}
.kw{color:#999;font-size:9px;margin-left:auto;padding:2px 3px}
.evs{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:1px 2px 1px 0}
.ev{padding:1px 4px;font-size:10px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-radius:2px}
.evbar{height:6px;border-radius:2px;margin:0 2px}
.ev.res{font-style:italic}
.holname{font-size:8.5px;color:#c0392b;padding:2px 3px;align-self:center;white-space:nowrap;overflow:hidden}
.empty{width:16.66%}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50}
.ov.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:18px 20px;width:440px;max-width:94vw;max-height:88vh;overflow:auto}
.modal h3{font-size:15px;margin-bottom:10px}
.ev-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.ev-item .dot{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.ev-item .t{flex:1;font-size:13px}.ev-item .d{font-size:11px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.fld label{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.fld input,.fld select{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.btn{font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border:1px solid var(--line);border-radius:8px;background:#f1f3f6;color:var(--text);cursor:pointer}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.abtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px}.abtn:hover{color:#c0392b}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2024;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:60}.toast.show{opacity:1}
</style></head><body>
<div class="hdr">
  <div><div class="hdr-title">🗓️ Jahresplaner</div><div class="hdr-sub">Urlaube · Seminare · Masterminds · Tischtennis · Fortbildungen · Geburtstage · Betriebsferien</div></div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="wrap">
  <div class="legend" id="legend"></div>
  <div id="cal"></div>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const KATS=[['Urlaub','#2f9e44'],['Seminar','#1971c2'],['Mastermind','#7048e8'],['Tischtennis','#e8590c'],['Fortbildung','#0c8599'],['Geburtstag','#e64980'],['Betriebsferien','#f59f00'],['Sonstiges','#495057']];
const KCOL={};KATS.forEach(k=>KCOL[k[0]]=k[1]);
const KICON={'Urlaub':'🏖️','Seminar':'🎓','Mastermind':'🧠','Tischtennis':'🏓','Fortbildung':'📚','Geburtstag':'🎂','Betriebsferien':'🏢','Sonstiges':'📌'};
const CY=new Date().getFullYear();
let YEAR=CY, EV=[];

function iso(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function easter(Y){var a=Y%19,b=Math.floor(Y/100),c=Y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*mm+114)/31),da=((h+l-7*mm+114)%31)+1;return new Date(Y,mo-1,da);}
function addD(dt,n){var x=new Date(dt);x.setDate(x.getDate()+n);return x;}
function keyOf(dt){return iso(dt.getFullYear(),dt.getMonth(),dt.getDate());}
function holidays(Y){var h={},E=easter(Y);
  [[0,1,'Neujahr'],[0,6,'Hl. Drei Könige'],[4,1,'Tag der Arbeit'],[9,3,'Tag d. Dt. Einheit'],[10,1,'Allerheiligen'],[11,25,'1. Weihnachtstag'],[11,26,'2. Weihnachtstag']].forEach(x=>h[iso(Y,x[0],x[1])]=x[2]);
  h[keyOf(addD(E,-2))]='Karfreitag';h[keyOf(E)]='Ostersonntag';h[keyOf(addD(E,1))]='Ostermontag';
  h[keyOf(addD(E,39))]='Christi Himmelf.';h[keyOf(addD(E,50))]='Pfingstmontag';h[keyOf(addD(E,60))]='Fronleichnam';
  return h;}
function isoWeek(dt){var d=new Date(dt.getTime());d.setHours(0,0,0,0);d.setDate(d.getDate()+3-((d.getDay()+6)%7));var w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+((w1.getDay()+6)%7))/7);}

function buildDayMap(){
  const map={};
  EV.forEach(ev=>{const von=new Date(ev.datum+'T00:00:00');const bis=ev.bis?new Date(ev.bis+'T00:00:00'):von;
    for(let d=new Date(von);d<=bis;d=addD(d,1)){const k=keyOf(d);(map[k]=map[k]||[]).push({ev:ev,start:k===ev.datum});}});
  return map;
}
function cell(Y,m,d,HOL,DM){
  if(d>new Date(Y,m+1,0).getDate())return '<td class="empty"></td>';
  const dt=new Date(Y,m,d),wd=dt.getDay(),k=iso(Y,m,d),hol=HOL[k],we=(wd===0||wd===6);
  const evs=DM[k]||[],starts=evs.filter(e=>e.start),cont=evs.filter(e=>!e.start);
  const kw=wd===1?'<span class="kw">'+isoWeek(dt)+'</span>':'';
  let right='';
  if(starts.length||cont.length){
    let parts=starts.map(s=>{const e=s.ev;const ic=KICON[e.kategorie]||'';const col=KCOL[e.kategorie];const tt=esc((e.status==='reserviert'?'RESERVIERT · ':'')+(e.titel||e.kategorie)+(e.notiz?' · '+e.notiz:''));
      if(e.status==='reserviert')return '<div class="ev res" style="border:1px dashed '+col+';background:repeating-linear-gradient(45deg,'+col+'22,'+col+'22 5px,transparent 5px,transparent 10px);color:'+col+'" title="'+tt+'">'+ic+' '+esc(e.titel||e.kategorie)+' ⏳</div>';
      return '<div class="ev" style="background:'+col+'33;border-left:3px solid '+col+';color:#1c2024" title="'+tt+'">'+ic+' '+esc(e.titel||e.kategorie)+'</div>';});
    cont.forEach(c=>{const col=KCOL[c.ev.kategorie];const res=c.ev.status==='reserviert';parts.push('<div class="evbar" style="'+(res?'border:1px dashed '+col+';background:'+col+'11':'background:'+col+'55')+'" title="'+esc(c.ev.titel||c.ev.kategorie)+'"></div>');});
    right='<div class="evs">'+parts.join('')+'</div>';
  }
  else if(hol){right='<div class="holname">'+esc(hol)+'</div>';}
  const cls=hol?'hol':(we?'we':'');
  return '<td><div class="daywrap '+cls+'" onclick="openDay(\''+k+'\')"><div class="dn"><b>'+d+'</b>'+WD[wd]+kw+'</div>'+right+'</div></td>';
}
function renderCal(){
  const HOL=holidays(YEAR),DM=buildDayMap();
  function block(mstart){
    let h='<div class="block"><table class="cal"><thead><tr>';
    for(let m=mstart;m<mstart+6;m++)h+='<th>'+MONTHS[m]+'</th>';
    h+='</tr></thead><tbody>';
    for(let d=1;d<=31;d++){h+='<tr>';for(let m=mstart;m<mstart+6;m++)h+=cell(YEAR,m,d,HOL,DM);h+='</tr>';}
    return h+'</tbody></table></div>';
  }
  $('cal').innerHTML=block(0)+block(6);
}
function renderTabs(){
  $('tabs').innerHTML=[CY,CY+1].map(y=>'<button class="tab'+(y===YEAR?' active':'')+'" onclick="setYear('+y+')">'+y+'</button>').join('');
  $('legend').innerHTML=KATS.map(k=>'<span><i style="background:'+k[1]+'"></i>'+(KICON[k[0]]||'')+' '+k[0]+'</span>').join('')
    +'<span style="margin-left:6px"><i style="background:#185fa5;border-left:3px solid #185fa5"></i>fix</span>'
    +'<span><i style="border:1px dashed #185fa5;background:repeating-linear-gradient(45deg,#185fa522,#185fa522 3px,transparent 3px,transparent 6px)"></i>⏳ reserviert</span>'
    +'<span style="color:var(--muted)">· Tag anklicken zum Eintragen</span>';
}
function setYear(y){YEAR=y;renderTabs();load();}

/* ---- Modal ---- */
let CURDAY=null;
function openDay(k){CURDAY=k;renderModal();$('ov').classList.add('show');}
function closeModal(){$('ov').classList.remove('show');}
function renderModal(){
  const dt=new Date(CURDAY+'T00:00:00');
  const dayEvs=EV.filter(e=>{const von=e.datum,bis=e.bis||e.datum;return CURDAY>=von&&CURDAY<=bis;});
  let h='<h3>'+dt.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</h3>';
  h+=dayEvs.map(e=>{const res=e.status==='reserviert';const si='font:inherit;font-size:12px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff';
    return '<div class="ev-item" style="flex-direction:column;align-items:stretch;gap:6px'+(res?';border-style:dashed':'')+'">'
    +'<div style="display:flex;gap:6px;align-items:center">'
      +'<span class="dot" style="background:'+KCOL[e.kategorie]+'"></span>'
      +'<select style="'+si+'" onchange="updateEv(\''+e.id+'\',\'kategorie\',this.value)">'+KATS.map(k=>'<option value="'+k[0]+'"'+(k[0]===e.kategorie?' selected':'')+'>'+(KICON[k[0]]||'')+' '+k[0]+'</option>').join('')+'</select>'
      +'<input value="'+esc(e.titel||'')+'" placeholder="Titel" style="flex:1;'+si+'" onchange="updateEv(\''+e.id+'\',\'titel\',this.value)">'
      +'<button class="btn" style="padding:4px 8px;font-size:11px" onclick="toggleStatus(\''+e.id+'\')">'+(res?'⏳ reserviert':'✓ fix')+'</button>'
      +'<button class="abtn" onclick="delEv(\''+e.id+'\')">✕</button>'
    +'</div>'
    +'<div class="row2"><div class="fld"><label>Von</label><input type="date" value="'+esc(e.datum)+'" onchange="updateEv(\''+e.id+'\',\'datum\',this.value)"></div><div class="fld"><label>Bis (optional)</label><input type="date" value="'+esc(e.bis||'')+'" onchange="updateEv(\''+e.id+'\',\'bis\',this.value)"></div></div>'
    +'<input value="'+esc(e.notiz||'')+'" placeholder="Notiz" style="'+si+'" onchange="updateEv(\''+e.id+'\',\'notiz\',this.value)">'
    +'</div>';}).join('')||'<div style="color:var(--muted);font-size:12.5px;margin-bottom:8px">Noch kein Eintrag an diesem Tag.</div>';
  h+='<div style="border-top:1px solid var(--line);margin:12px 0 10px"></div><div style="font-weight:700;font-size:12px;margin-bottom:8px">Neuer Eintrag</div>';
  h+='<div class="row2"><div class="fld"><label>Kategorie</label><select id="m_kat">'+KATS.map(k=>'<option value="'+k[0]+'">'+(KICON[k[0]]||'')+' '+k[0]+'</option>').join('')+'</select></div>'
    +'<div class="fld"><label>Status</label><select id="m_status"><option value="fix">Fix (verbindlich)</option><option value="reserviert">Reserviert (Option)</option></select></div></div>';
  h+='<div class="fld"><label>Titel</label><input id="m_titel" placeholder="z. B. Golfurlaub mit Papa"></div>';
  h+='<div class="row2"><div class="fld"><label>Von</label><input type="date" id="m_von" value="'+CURDAY+'"></div><div class="fld"><label>Bis (optional)</label><input type="date" id="m_bis"></div></div>';
  h+='<div class="fld"><label>Notiz (optional)</label><input id="m_notiz"></div>';
  h+='<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px"><button class="btn" onclick="closeModal()">Schließen</button><button class="btn btn-accent" onclick="addEv()">Eintragen</button></div>';
  $('modal').innerHTML=h;
}
function fmt(s){const d=new Date(s+'T00:00:00');return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});}
async function addEv(){
  const von=$('m_von').value||CURDAY, bis=$('m_bis').value||null;
  const rec={jahr:new Date(von+'T00:00:00').getFullYear(),datum:von,bis:(bis&&bis>von)?bis:null,kategorie:$('m_kat').value,status:($('m_status')?$('m_status').value:'fix'),titel:($('m_titel').value||'').trim()||null,notiz:($('m_notiz').value||'').trim()||null};
  const res=await sb.from('jahresplaner').insert(rec).select();
  if(res.error){toast('Fehler: '+res.error.message);return;}
  EV.push(res.data[0]);renderCal();renderModal();toast('Eingetragen ✓');
}
async function delEv(id){const res=await sb.from('jahresplaner').delete().eq('id',id);if(res.error){toast(res.error.message);return;}EV=EV.filter(x=>x.id!==id);renderCal();renderModal();toast('Gelöscht');}
async function updateEv(id,field,val){
  const e=EV.find(x=>x.id===id);if(!e)return;
  let v=val, upd={};
  if(field==='datum'){if(!val)return;e.jahr=new Date(val+'T00:00:00').getFullYear();upd.jahr=e.jahr;}
  if(field==='bis'){v=val||null;if(v&&v<e.datum)v=null;}
  if((field==='titel'||field==='notiz')&&(!val||!val.trim()))v=null;
  upd[field]=v;
  const res=await sb.from('jahresplaner').update(upd).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  e[field]=v;renderCal();renderModal();toast('Gespeichert ✓');
}
async function toggleStatus(id){const e=EV.find(x=>x.id===id);if(!e)return;const ns=e.status==='reserviert'?'fix':'reserviert';const res=await sb.from('jahresplaner').update({status:ns}).eq('id',id);if(res.error){toast(res.error.message);return;}e.status=ns;renderCal();renderModal();toast(ns==='reserviert'?'Als reserviert markiert':'Als fix markiert');}
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))closeModal();});

async function load(){
  // Einträge, die das Jahr berühren (Start oder Ende im Jahr)
  const res=await sb.from('jahresplaner').select('*').or('jahr.eq.'+YEAR+',datum.gte.'+YEAR+'-01-01');
  EV=(res.data||[]).filter(e=>{const von=e.datum,bis=e.bis||e.datum;return von<=YEAR+'-12-31'&&bis>=YEAR+'-01-01';});
  renderCal();
}
renderTabs();load();
</script>
</body></html>
