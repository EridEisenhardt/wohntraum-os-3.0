<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuhrpark</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f5f8;--card:#ffffff;--ink:#18202c;--muted:#5f6b7a;--line:#e0e5eb;--soft:#eef1f5;--accent:#2f5d8a;--accent-ink:#ffffff;--accent-soft:#e3ecf5;
  --pos:#1d7a4c;--pos-bg:#e5f4ec;--neg:#b42318;--neg-bg:#fcebe9;--warn:#946200;--warn-bg:#fff4d6;--chip:#edf1f6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:1240px;margin:0 auto;padding:16px 20px 60px}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12px}
.kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{font-size:12px;padding:3px 8px}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.warn{color:var(--neg)}
button:disabled{opacity:.55;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi .l{font-size:12px;font-weight:700;color:var(--muted)}.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.inp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;padding:6px 12px}.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.ch{font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
details.sec>summary.ch{cursor:pointer;list-style:none;margin-bottom:0;justify-content:flex-start}details.sec>summary.ch::-webkit-details-marker{display:none}
details.sec>summary.ch::before{content:'▸';margin-right:8px;color:var(--muted)}details.sec[open]>summary.ch::before{content:'▾'}details.sec[open]>summary.ch{margin-bottom:8px}
details.sec>summary.ch .sub{margin-left:auto}
.kvgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:36px}.kvcol{min-width:0}
.kvr{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}.kvr:last-child{border-bottom:0}
.kvr span{color:var(--muted);white-space:nowrap}.kvr b{text-align:right;font-weight:600;overflow-wrap:anywhere}
.fl{display:grid;gap:2px;font-size:12px;color:var(--muted);margin-bottom:8px}
.fl input,.fl select,.fl textarea{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13.5px;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}.g3{display:grid;grid-template-columns:repeat(3,1fr);column-gap:14px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap;background:var(--chip);color:var(--muted)}
.p-ok{background:var(--pos-bg);color:var(--pos)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-neg{background:var(--neg-bg);color:var(--neg)}.p-blau{background:var(--accent-soft);color:var(--accent)}
.tab{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
.tab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tab td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tab td.n,.tab th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tab tr.kl td{cursor:pointer}.tab tr.kl:hover td{background:var(--accent-soft)}
.tab tr.summe td{font-weight:700;background:var(--soft)}
.tbox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.empty{color:var(--muted);font-size:13px;padding:20px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:12px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
.ord{border-top:1px solid var(--line);padding:6px 0}
.ord .oh{display:flex;gap:8px;align-items:center}
.ord .dt{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0 3px 18px}
.ord .dt a{color:var(--accent);cursor:pointer;text-decoration:none;overflow-wrap:anywhere}.ord .dt a:hover{text-decoration:underline}
label.up{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--card);cursor:pointer;font-size:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.voll{position:fixed;inset:0;background:rgba(10,14,20,.85);display:flex;align-items:center;justify-content:center;z-index:100;cursor:zoom-out}.voll img{max-width:94vw;max-height:92vh;border-radius:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:120}.toast.on{opacity:1}
@media(max-width:800px){.wrap{padding:12px}.kvgrid,.g2,.g3{grid-template-columns:1fr}.hide-m{display:none}}
</style></head><body>
<div class="wrap" id="app"><div class="empty">Fuhrpark wird geladen …</div></div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const p2=n=>String(n).padStart(2,'0');
const isoLokal=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const HEUTE=isoLokal(new Date()),JAHR=HEUTE.slice(0,4);
const dmy=x=>{const s=String(x||'').slice(0,10);return /^\d{4}-\d\d-\d\d$/.test(s)?s.split('-').reverse().join('.'):'';};
const eur=n=>n==null||n===''||isNaN(n)?'–':Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const zahl=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(/\s|€/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));return isNaN(n)?null:n;};
const tageBis=d=>d?Math.round((Date.parse(d)-Date.parse(HEUTE))/864e5):null;
const plusMonate=(d,m)=>{const x=new Date(d+'T12:00:00');x.setMonth(x.getMonth()+Number(m));return isoLokal(x);};
const ROOT='Prozesslandkarte 3.0',BASIS='6.000 Fuhrpark',BUCKET='fuhrpark';
const UNTER=['Kauf & Leasing','Schäden & Bußgelder','TÜV & Wartung','Versicherung','Zulassung & Steuer'];
const GES=[['WT','Wohn(T)raum Rheinhessen GmbH'],['KiBo','Wohn(T)raum KiBo GmbH'],['EE','Eric Eisenhardt privat'],['WW','Wohntraum Wonnegau GmbH'],['Andersmacher','Anders MACHER GmbH']];
const FRISTARTEN=['Hauptuntersuchung (TÜV)','Inspektion','Ölwechsel','Reifenwechsel Sommer','Reifenwechsel Winter','Leasingende','Versicherung Kündigungsfrist','Kfz-Steuer','Sonstiges'];
const KOSTENARTEN=['Leasingrate','Versicherung','Kfz-Steuer','Werkstatt','TÜV','Reifen','Tanken','Kauf','Sonstiges'];
const INTERVALLE=['einmalig','monatlich','vierteljährlich','jährlich'];
const SCHADENARTEN=['Unfall','Schaden','Steinschlag','Bußgeld','Parkverstoß','Geschwindigkeit','Abschleppen','Diebstahl','Sonstiges'];
const NUTZER={'ramona@andersmacher.info':'Ramona','juergen@andersmacher.info':'Jürgen','eric@andersmacher.info':'Eric'};
let F=[],FR=[],K=[],S=[],ICH='',ANS='fahrzeuge',AKT=null,EDIT=null,NEU=null,SNEU=null,KNEU=null,FNEU=null,FILTER={ges:'',alle:false,soff:true},OD={},EIN={},SEC={},BUSY='',ASU=null,AUF={};
try{SEC=JSON.parse(localStorage.getItem('fz_sec')||'{}')||{};}catch(e){}
function toast(t,ms){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),ms||3800);}
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input[list]')){t.dataset.alt=t.value;t.value='';}});
document.addEventListener('focusout',e=>{const t=e.target;if(t.matches&&t.matches('input[list]')&&!t.value&&t.dataset.alt){t.value=t.dataset.alt;t.dispatchEvent(new Event('change',{bubbles:true}));}});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.matches&&d.matches('details.sec[data-sec]')){SEC[d.dataset.sec]=d.open;try{localStorage.setItem('fz_sec',JSON.stringify(SEC));}catch(x){}if(d.open&&d.dataset.sec==='Dokumente'&&AKT)dokLaden(AKT);}},true);
async function token(){const {data}=await sb.auth.getSession();return data&&data.session?data.session.access_token:'';}
async function api(pfad,body){let r;try{r=await fetch(pfad,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await token()},body:JSON.stringify(body)});}catch(e){throw new Error('Dienst nicht erreichbar.');}
  let j=null;try{j=await r.json();}catch(e){}if(!j)throw new Error('Dienst nicht erreichbar ('+r.status+').');if(j.error)throw new Error(j.error);return j;}
const odApi=b=>api('/api/onedrive',b),asApi=b=>api('/api/asana',b);
function cliqTeilen(titel,pfad){try{(window.top||window).postMessage({cliqTeilen:{titel:String(titel||''),link:location.origin+pfad}},location.origin);}catch(e){}}

/* ---------- Daten ---------- */
async function laden(){
  const [f,fr,k,s,u]=await Promise.all([sb.from('fz_fahrzeuge').select('*').order('kennzeichen'),sb.from('fz_fristen').select('*').order('faellig'),sb.from('fz_kosten').select('*').order('datum',{ascending:false}),sb.from('fz_schaeden').select('*').order('datum',{ascending:false}),sb.auth.getUser()]);
  if(f.error){document.getElementById('app').innerHTML='<div class="empty">Fuhrpark konnte nicht geladen werden. Bitte im OS angemeldet sein.</div>';return;}
  F=f.data||[];FR=fr.data||[];K=k.data||[];S=s.data||[];
  const us=u&&u.data&&u.data.user;if(us)ICH=NUTZER[String(us.email||'').toLowerCase()]||us.email||'';
  try{const {data}=await sb.from('os_docs').select('data').eq('app','oc').eq('pfad','fuhrpark/einstellungen').maybeSingle();EIN=(data&&data.data)||{};}catch(e){}
  const id=new URLSearchParams(location.search).get('id');if(id&&F.some(x=>x.id===id)){AKT=id;}
  render();fristenAsana();}
const fzVon=id=>F.find(x=>x.id===id)||{};
const fzName=f=>[f.kennzeichen,f.modell].filter(Boolean).join(' · ');
const aktiv=f=>f.status==='aktiv';
const gesName=k=>(GES.find(g=>g[0]===k)||[k,k])[1];
const offeneFristen=id=>FR.filter(x=>!x.erledigt_am&&(!id||x.fahrzeug_id===id)).sort((a,b)=>String(a.faellig||'9').localeCompare(String(b.faellig||'9')));
function fristPill(d){const t=tageBis(d);if(t==null)return '<span class="pill">ohne Datum</span>';if(t<0)return '<span class="pill p-neg">überfällig seit '+(-t)+' Tg.</span>';if(t<=30)return '<span class="pill p-warn">in '+t+' Tg.</span>';return '<span class="pill">'+dmy(d)+'</span>';}
// laufende Kosten: je Kostenart der neueste wiederkehrende Eintrag
function laufend(id){const M={};for(const k of K.filter(x=>x.fahrzeug_id===id&&x.intervall!=='einmalig')){if(!M[k.art]||String(k.datum||'')>String(M[k.art].datum||''))M[k.art]=k;}
  let mon=0;for(const k of Object.values(M)){const b=Number(k.betrag)||0;mon+=k.intervall==='monatlich'?b:k.intervall==='vierteljährlich'?b/3:b/12;}return mon;}
const einmaligJahr=id=>K.filter(x=>x.fahrzeug_id===id&&x.intervall==='einmalig'&&String(x.datum||'').startsWith(JAHR)&&x.art!=='Kauf').reduce((a,x)=>a+(Number(x.betrag)||0),0);

/* ---------- Ansicht ---------- */
function render(){const app=document.getElementById('app');
  if(AKT){app.innerHTML=akte(fzVon(AKT));bilderZeigen();return;}
  const FA=F.filter(aktiv),fr30=offeneFristen().filter(x=>{const f=fzVon(x.fahrzeug_id);return aktiv(f)&&tageBis(x.faellig)!=null&&tageBis(x.faellig)<=30;}),so=S.filter(x=>x.status!=='erledigt');
  let h=`<div class="kopf"><div><h1>Fuhrpark</h1><div class="sub">Alle Fahrzeuge der Gruppe mit Fahrzeugakte, Fristen, Kosten sowie Schäden und Bußgeldern. Die Dokumente kommen aus OneDrive (6.000 Fuhrpark).</div></div>
    <div class="acts" style="margin-top:0"><button class="primary" data-a="neu">Fahrzeug anlegen</button></div></div>
  <div class="kpis"><div class="kpi"><div class="l">Fahrzeuge aktiv</div><div class="v">${FA.length}</div></div>
    <div class="kpi"><div class="l">Fristen in 30 Tagen / überfällig</div><div class="v">${fr30.length}</div></div>
    <div class="kpi"><div class="l">Schäden und Bußgelder offen</div><div class="v">${so.length}</div></div>
    <div class="kpi"><div class="l">Laufende Kosten im Monat</div><div class="v">${eur(FA.reduce((a,f)=>a+laufend(f.id),0))}</div></div></div>`;
  if(NEU)h+=neuForm();
  h+=`<div class="bar"><div class="seg">${[['fahrzeuge','Fahrzeuge'],['fristen','Fristen'],['kosten','Kosten'],['schaeden','Schäden & Bußgelder']].map(([k,l])=>`<button data-a="ans" data-v="${k}" class="${ANS===k?'on':''}">${l}</button>`).join('')}</div>
    <input class="inp" id="fges" list="dl-ges" placeholder="Alle Gesellschaften" value="${esc(FILTER.ges)}" style="width:200px"><datalist id="dl-ges"><option value="Alle">${GES.map(g=>`<option value="${g[0]}">${esc(g[1])}</option>`).join('')}</datalist>
    ${ANS==='fahrzeuge'?`<label class="sub" style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="falle"${FILTER.alle?' checked':''}> auch abgemeldete und verkaufte</label>`:''}</div>`;
  const G=x=>!FILTER.ges||x.gesellschaft===FILTER.ges;
  if(ANS==='fahrzeuge')h+=listeFahrzeuge(F.filter(f=>G(f)&&(FILTER.alle||aktiv(f))));
  else if(ANS==='fristen')h+=listeFristen(offeneFristen().filter(x=>G(fzVon(x.fahrzeug_id))&&aktiv(fzVon(x.fahrzeug_id))),true);
  else if(ANS==='kosten')h+=kostenUebersicht(F.filter(f=>G(f)));
  else h+=listeSchaeden(S.filter(x=>G(fzVon(x.fahrzeug_id))),true);
  app.innerHTML=h;bilderZeigen();}
function listeFahrzeuge(L){if(!L.length)return '<div class="empty">Keine Fahrzeuge gefunden.</div>';
  return '<div class="tbox" style="overflow-x:auto"><table class="tab"><thead><tr><th>Kennzeichen</th><th>Modell</th><th>Gesellschaft</th><th class="hide-m">Fahrer</th><th>Art</th><th>Nächste Frist</th><th class="n">Laufend / Monat</th><th>Status</th></tr></thead><tbody>'
    +L.map(f=>{const nf=offeneFristen(f.id)[0];return `<tr class="kl" data-fz="${f.id}"><td><b>${esc(f.kennzeichen||'–')}</b></td><td>${esc(f.modell||'')}</td><td>${esc(f.gesellschaft||'')}</td><td class="hide-m">${esc(f.fahrer||'')}</td><td>${esc(f.art||'')}${f.art==='Leasing'&&f.leasinggeber?'<div class="sub">'+esc(f.leasinggeber)+'</div>':''}</td>
      <td>${nf?esc(nf.art)+'<div>'+fristPill(nf.faellig)+'</div>':'<span class="sub">keine</span>'}</td><td class="n">${eur(laufend(f.id))}</td><td>${aktiv(f)?'<span class="pill p-ok">aktiv</span>':'<span class="pill">'+esc(f.status)+(f.abgemeldet_am?' '+dmy(f.abgemeldet_am):'')+'</span>'}</td></tr>`;}).join('')+'</tbody></table></div>';}
function listeFristen(L,mitFz){let h='';
  if(mitFz)h+=`<div class="card"><div class="acts" style="margin-top:0"><span class="sub">Erinnerung per Asana-Aufgabe 30 Tage vor Fälligkeit an</span><input class="inp" id="fzzust" list="dl-asu" value="${esc(EIN.zustaendig||'')}" placeholder="${ASU?'Name eintippen':'Personen werden geladen …'}" style="width:220px;padding:4px 8px"><datalist id="dl-asu">${(ASU||[]).map(u=>`<option value="${esc(u.name)}">`).join('')}</datalist>${EIN.zustaendig?'':'<span class="sub">noch niemand eingetragen, Aufgaben werden ohne Zuständigen angelegt</span>'}</div></div>`;
  if(!ASU&&mitFz)asNutzer();
  if(!L.length)return h+'<div class="empty">Keine offenen Fristen.</div>';
  return h+'<div class="tbox" style="overflow-x:auto"><table class="tab"><thead><tr>'+(mitFz?'<th>Fahrzeug</th>':'')+'<th>Frist</th><th>Fällig</th><th class="hide-m">Notiz</th><th>Asana</th><th></th></tr></thead><tbody>'
    +L.map(x=>{const f=fzVon(x.fahrzeug_id);return `<tr>${mitFz?`<td><a class="lnk" data-fz="${f.id}" style="cursor:pointer;color:var(--accent)"><b>${esc(f.kennzeichen||'')}</b></a><div class="sub">${esc(f.modell||'')}</div></td>`:''}<td>${esc(x.art)}${x.wiederholung_monate?'<div class="sub">alle '+x.wiederholung_monate+' Monate</div>':''}</td>
      <td>${dmy(x.faellig)}<div>${fristPill(x.faellig)}</div></td><td class="hide-m">${esc(x.notiz||'')}</td><td>${x.asana_link?`<a href="${esc(x.asana_link)}" target="_blank" rel="noopener" style="color:var(--accent)">öffnen</a>`:`<button class="small" data-a="fasana" data-id="${x.id}">anlegen</button>`}</td>
      <td style="white-space:nowrap;text-align:right"><button class="small" data-a="ferl" data-id="${x.id}">Erledigt</button> <button class="small ghost" data-a="fweg" data-id="${x.id}">Löschen</button></td></tr>`;}).join('')+'</tbody></table></div>';}
function kostenUebersicht(L){const A=L.filter(aktiv),B=L.filter(f=>!aktiv(f));
  const zeile=f=>{const m=laufend(f.id),e=einmaligJahr(f.id);return `<tr class="kl" data-fz="${f.id}"><td><b>${esc(f.kennzeichen||'')}</b><div class="sub">${esc(f.modell||'')}</div></td><td>${esc(f.gesellschaft||'')}</td><td class="n">${eur(m)}</td><td class="n">${eur(m*12)}</td><td class="n">${eur(e)}</td><td class="n"><b>${eur(m*12+e)}</b></td></tr>`;};
  let h='<div class="sub" style="margin-bottom:8px">Laufend = Leasing, Versicherung, Steuer usw. (je Kostenart der neueste Eintrag). Einmalig = Werkstatt, TÜV, Reifen usw. im Jahr '+JAHR+', ohne Kaufpreis.</div>';
  for(const g of [...new Set(A.map(f=>f.gesellschaft||'ohne Gesellschaft'))].sort((a,b)=>a.localeCompare(b,'de'))){const Lg=A.filter(f=>(f.gesellschaft||'ohne Gesellschaft')===g);const m=Lg.reduce((a,f)=>a+laufend(f.id),0),e=Lg.reduce((a,f)=>a+einmaligJahr(f.id),0);
    h+='<div class="tbox" style="overflow-x:auto"><table class="tab"><thead><tr><th>'+esc(gesName(g))+'</th><th>Ges.</th><th class="n">Laufend / Monat</th><th class="n">Laufend / Jahr</th><th class="n">Einmalig '+JAHR+'</th><th class="n">Gesamt '+JAHR+'</th></tr></thead><tbody>'+Lg.map(zeile).join('')
      +`<tr class="summe"><td colspan="2">Summe</td><td class="n">${eur(m)}</td><td class="n">${eur(m*12)}</td><td class="n">${eur(e)}</td><td class="n">${eur(m*12+e)}</td></tr></tbody></table></div>`;}
  if(!A.length)h+='<div class="empty">Keine aktiven Fahrzeuge.</div>';
  if(B.length)h+='<div class="sub" style="margin:6px 0">Abgemeldete und verkaufte Fahrzeuge zählen hier nicht mit.</div>';
  return h;}
function listeSchaeden(L,mitFz){const nurOffen=FILTER.soff;let h='';

const FELDER=[['kennzeichen','Kennzeichen'],['modell','Modell'],['gesellschaft','Gesellschaft','ges'],['status','Status','status'],['fahrer','Fahrer / Nutzer'],['fin','Fahrgestellnummer (FIN)'],['erstzulassung','Erstzulassung','date'],['zulassung','Zulassung auf uns','date'],['km_stand','Kilometerstand','int'],['km_datum','Kilometerstand vom','date'],['reifen','Reifen (Sommer/Winter/Ganzjahr)'],['tankkarte','Tankkarte'],
  ['art','Art (Kauf/Leasing/Finanzierung)','art'],['kaufdatum','Kaufdatum','date'],['kaufpreis','Kaufpreis','eur'],['verkaeufer','Verkäufer'],['leasinggeber','Leasinggeber'],['leasingvertrag','Leasingvertrag'],['leasingrate','Leasingrate / Monat','eur'],['leasing_beginn','Leasingbeginn','date'],['leasing_ende','Leasingende','date'],['leasing_km','Leasing-Kilometer gesamt','int'],['versicherer','Versicherer'],['versicherungsnr','Versicherungsnummer']];
function wert(f,[k,,t]){const v=f[k];if(v==null||v==='')return '';if(t==='date')return dmy(v);if(t==='eur')return eur(v);if(t==='int')return Number(v).toLocaleString('de-DE')+(k.includes('km')?' km':'');if(t==='ges')return esc(v)+' <span class="sub">'+esc(gesName(v))+'</span>';return esc(v);}

function kostenFahrzeug(f,L){let h=`<div class="acts" style="margin-top:0;margin-bottom:6px"><button class="small primary" data-a="kneu">Kosten hinzufügen</button><span class="sub">laufend ${eur(laufend(f.id))} im Monat · einmalig ${JAHR}: ${eur(einmaligJahr(f.id))}</span></div>`;

function fristForm(){return `<div class="card" style="background:var(--soft)"><div class="g3"><label class="fl">Frist<input id="fr-art" list="dl-frart"><datalist id="dl-frart">${FRISTARTEN.map(a=>`<option value="${a}">`).join('')}</datalist></label>

const odPfad=f=>{const p=String(f.onedrive_ordner||'').replace(/^\/+/,'');return p?(p.startsWith(ROOT)?p:ROOT+'/'+p):'';};
function dokumente(f){const p=odPfad(f);if(!p)return '<div class="sub">Für dieses Fahrzeug ist kein OneDrive-Ordner hinterlegt. Unter „Bearbeiten“ eintragen oder das Fahrzeug neu anlegen.</div>';
  const A=OD[f.id];if(!A||A==='lade')return '<div class="sub">Lädt Dokumente aus OneDrive …</div>';if(A.fehler)return '<div class="note">'+esc(A.fehler)+'</div>';
  const O=[...new Set(UNTER.concat(Object.keys(A.ordner||{}).filter(x=>!x.includes('/'))))].sort((a,b)=>a.localeCompare(b,'de'));
  let h='<div class="sub" style="margin-bottom:4px">Dateiname nach Ablageleitfaden: Kürzel_Absender_Datum_Beschreibung, z. B. '+esc(f.gesellschaft||'WT')+'_Allianz_'+HEUTE+'_Kfz-Versicherung</div>';
  if((A.dateien||[]).length)h+='<div class="ord"><div class="oh"><b>(direkt im Fahrzeugordner)</b></div>'+A.dateien.map(d=>`<div class="dt"><a data-od="${esc(d.id)}">${esc(d.name)}</a></div>`).join('')+'</div>';
  for(const o of O){const L=(A.ordner||{})[o]||[];h+=`<div class="ord"><div class="oh"><b>${esc(o)}</b><span class="sub">${L.length} Datei${L.length===1?'':'en'}</span><label class="up" style="margin-left:auto">Hochladen<input type="file" multiple hidden data-odup="${esc(o)}"></label></div>`
    +L.map(d=>`<div class="dt"><a data-od="${esc(d.id)}">${esc(d.name)}</a></div>`).join('')+'</div>';}
  return h;}
async function dokLaden(id,neu){const f=fzVon(id),p=odPfad(f);if(!p||(OD[id]&&!neu))return;OD[id]='lade';render();
  try{OD[id]=await odApi({aktion:'akte',pfad:p});}catch(e){OD[id]={fehler:e.message||String(e)};}render();}
async function odOeffnen(id){const w=window.open('','_blank');try{const r=await odApi({aktion:'link',id});const u=r.web||r.download;if(w)w.location.href=u;else window.open(u,'_blank');}catch(e){if(w)w.close();toast(e.message||String(e));}}
async function odHoch(f,ordner,dateien){const pfad=odPfad(f)+'/'+ordner;let n=0;
  for(const d of dateien){const ext=(d.name.match(/\.[A-Za-z0-9]{2,5}$/)||[''])[0];let name=d.name;
    const abs=prompt('Absender für „'+d.name+'“ (für den Dateinamen nach Ablageleitfaden), leer lassen für den bisherigen Namen:','');
    if(abs){const beschr=prompt('Beschreibung oder Betrag, z. B. Kfz-Steuerbescheid oder 412,80€:','')||'Dokument';name=(f.gesellschaft||'WT')+'_'+abs.trim()+'_'+HEUTE+'_'+beschr.trim()+ext;}
    name=name.replace(/[\\/:*?"<>|#%]/g,'_');
    try{await odApi({aktion:'anlegen',pfad});
      if(d.size<=3*1024*1024){const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(d);});await odApi({aktion:'hochladen',pfad,name,daten:b64,typ:d.type||'application/octet-stream'});}
      else{const s=await odApi({aktion:'sitzung',pfad,name});const r=await fetch(s.uploadUrl,{method:'PUT',headers:{'Content-Range':'bytes 0-'+(d.size-1)+'/'+d.size},body:d});if(!r.ok)throw new Error('Hochladen fehlgeschlagen ('+r.status+').');}n++;}
    catch(e){toast(d.name+': '+(e.message||e),6000);}}
  if(n)toast(n+' Datei'+(n===1?'':'en')+' hochgeladen.');dokLaden(f.id,true);}

async function pdfOeffnen(p){const w=window.open('','_blank');const {data}=await sb.storage.from(BUCKET).createSignedUrl(p,3600);if(data&&data.signedUrl){if(w)w.location.href=data.signedUrl;}else if(w)w.close();}

const A={
  ans:d=>{ANS=d.v;render();},soff:d=>{FILTER.soff=d.v==='1';render();},
  neu:()=>{NEU={};render();},nab:()=>{NEU=null;render();},
  nsave:async()=>{const v0=i=>(document.getElementById(i).value||'').trim();const W={};['n-kz','n-modell','n-ges','n-art','n-fahrer'].forEach(i=>W[i]=v0(i));const v=i=>W[i]||'';const kz=v('n-kz'),mod=v('n-modell');if(!kz&&!mod){toast('Bitte Kennzeichen oder Modell eintragen.');return;}
    BUSY='n';render();const ordner=BASIS+'/'+[kz.replace(/\s+/g,'-'),mod].filter(Boolean).join(' ');
    try{await odApi({aktion:'anlegen',pfad:ROOT+'/'+ordner,unterordner:UNTER});}catch(e){toast('OneDrive-Ordner nicht angelegt: '+(e.message||e),6000);}
    const {data,error}=await sb.from('fz_fahrzeuge').insert({kennzeichen:kz||null,modell:mod||null,gesellschaft:v('n-ges')||null,art:v('n-art')||null,fahrer:v('n-fahrer')||null,onedrive_ordner:ordner,status:'aktiv'}).select().single();
    BUSY='';if(error){toast(error.message);render();return;}F.push(data);NEU=null;AKT=data.id;render();toast('Fahrzeug angelegt.');},
  zurueck:()=>{AKT=null;EDIT=null;FNEU=null;KNEU=null;SNEU=null;render();},
  bearb:()=>{EDIT=true;render();},abbrechen:()=>{EDIT=null;render();},speichern:()=>speichernFz(),
  teilen:()=>{const f=fzVon(AKT);cliqTeilen('Fahrzeug '+fzName(f),'/verwalto/fuhrpark?id='+f.id);},
  abmelden:async()=>{const f=fzVon(AKT);const d=prompt('Datum der Abmeldung oder des Verkaufs (TT.MM.JJJJ):',dmy(HEUTE));if(!d)return;const m=d.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(!m){toast('Bitte als TT.MM.JJJJ eingeben.');return;}
    const st=confirm('Wurde das Fahrzeug verkauft? (OK = verkauft, Abbrechen = abgemeldet)')?'verkauft':'abgemeldet';const iso=m[3]+'-'+p2(m[2])+'-'+p2(m[1]);
    const {error}=await sb.from('fz_fahrzeuge').update({status:st,abgemeldet_am:iso,updated_at:new Date().toISOString()}).eq('id',f.id);if(error){toast(error.message);return;}
    f.status=st;f.abgemeldet_am=iso;render();toast('Gespeichert. Den OneDrive-Ordner bitte in „zz_'+(f.kennzeichen||'').replace(/\s+/g,'-')+' '+(f.modell||'')+'_'+st+' '+iso+'“ umbenennen.',9000);},
  fneu:()=>{FNEU={};render();},fab:()=>{FNEU=null;render();},
  fsave:async()=>{const v=i=>(document.getElementById(i).value||'').trim();if(!v('fr-art')){toast('Bitte die Frist benennen.');return;}
    const {data,error}=await sb.from('fz_fristen').insert({fahrzeug_id:AKT,art:v('fr-art'),faellig:v('fr-dat')||null,wiederholung_monate:parseInt(v('fr-wdh'))||null,notiz:v('fr-notiz')||null}).select().single();
    if(error){toast(error.message);return;}FR.push(data);FNEU=null;render();fristenAsana();},
  ferl:async d=>{const x=FR.find(y=>y.id===d.id);if(!x)return;const {error}=await sb.from('fz_fristen').update({erledigt_am:HEUTE,updated_at:new Date().toISOString()}).eq('id',x.id);if(error){toast(error.message);return;}x.erledigt_am=HEUTE;
    if(x.asana_gid){try{await asApi({aktion:'erledigt',gid:x.asana_gid,wert:true});}catch(e){}}
    if(x.wiederholung_monate&&x.faellig){const {data}=await sb.from('fz_fristen').insert({fahrzeug_id:x.fahrzeug_id,art:x.art,faellig:plusMonate(x.faellig,x.wiederholung_monate),wiederholung_monate:x.wiederholung_monate,notiz:x.notiz}).select().single();if(data){FR.push(data);toast('Erledigt. Nächster Termin: '+dmy(data.faellig));}}else toast('Erledigt.');render();},
  fweg:async d=>{if(!confirm('Frist löschen?'))return;const {error}=await sb.from('fz_fristen').delete().eq('id',d.id);if(error){toast(error.message);return;}FR=FR.filter(x=>x.id!==d.id);render();},
  fasana:d=>{const x=FR.find(y=>y.id===d.id);if(x)fristAsana(x);},
  kneu:()=>{KNEU={};render();},kab:()=>{KNEU=null;render();},
  ksave:async()=>{const v=i=>(document.getElementById(i).value||'').trim();const b=zahl(v('k-betrag'));if(!v('k-art')||b==null){toast('Bitte Art und Betrag eintragen.');return;}
    const iv=INTERVALLE.includes(v('k-int'))?v('k-int'):'einmalig';const {data,error}=await sb.from('fz_kosten').insert({fahrzeug_id:AKT,art:v('k-art'),betrag:b,intervall:iv,datum:v('k-datum')||HEUTE,notiz:v('k-notiz')||null}).select().single();
    if(error){toast(error.message);return;}K.unshift(data);KNEU=null;render();},
  kweg:async d=>{if(!confirm('Eintrag löschen?'))return;const {error}=await sb.from('fz_kosten').delete().eq('id',d.id);if(error){toast(error.message);return;}K=K.filter(x=>x.id!==d.id);render();},
  sneu:()=>{SNEU={fz:AKT||'',dateien:[]};render();},sab:()=>{SNEU=null;render();},
  ssave:async()=>{const W={};['s-fz','s-art','s-dat','s-fahrer','s-ort','s-betrag','s-az','s-frist','s-text'].forEach(i=>{const el=document.getElementById(i);W[i]=el?(el.value||'').trim():'';});['s-vers','s-asana'].forEach(i=>{const el=document.getElementById(i);W[i]=!!(el&&el.checked);});const v=i=>W[i]||'';let fz=AKT;if(!fz){const f=F.find(x=>fzName(x)===v('s-fz'));if(!f){toast('Bitte ein Fahrzeug aus der Liste wählen.');return;}fz=f.id;}
    if(!v('s-art')){toast('Bitte die Art wählen.');return;}BUSY='s';render();
    try{const fotos=SNEU.dateien.length?await dateienHoch(fz,SNEU.dateien):[];
      const zeile={fahrzeug_id:fz,art:v('s-art'),datum:v('s-dat')||HEUTE,fahrer:v('s-fahrer')||null,ort:v('s-ort')||null,betrag:zahl(v('s-betrag')),aktenzeichen:v('s-az')||null,frist:v('s-frist')||null,beschreibung:v('s-text')||null,versicherung:W['s-vers'],fotos,verlauf:[{d:new Date().toISOString(),by:ICH,t:'erfasst'}]};
      const mitAsana=W['s-asana'];const {data,error}=await sb.from('fz_schaeden').insert(zeile).select().single();if(error)throw error;
      S.unshift(data);SNEU=null;AUF[data.id]=true;BUSY='';render();toast('Gespeichert.');if(mitAsana)schadenAsana(data);}
    catch(e){BUSY='';render();toast(e.message||String(e),6000);}},
  sstatus:async d=>{const x=S.find(y=>y.id===d.id);const verlauf=(x.verlauf||[]).concat([{d:new Date().toISOString(),by:ICH,t:'Status: '+d.v}]);
    const {error}=await sb.from('fz_schaeden').update({status:d.v,verlauf,updated_at:new Date().toISOString()}).eq('id',x.id);if(error){toast(error.message);return;}x.status=d.v;x.verlauf=verlauf;
    if(d.v==='erledigt'&&x.asana_gid){try{await asApi({aktion:'erledigt',gid:x.asana_gid,wert:true});}catch(e){}}render();},
  snotiz:async d=>{const x=S.find(y=>y.id===d.id),t=(document.getElementById('snotiz-'+d.id).value||'').trim();if(!t)return;const verlauf=(x.verlauf||[]).concat([{d:new Date().toISOString(),by:ICH,t}]);
    const {error}=await sb.from('fz_schaeden').update({verlauf,updated_at:new Date().toISOString()}).eq('id',x.id);if(error){toast(error.message);return;}x.verlauf=verlauf;render();
    if(x.asana_gid){try{await asApi({aktion:'kommentar',gid:x.asana_gid,text:t});}catch(e){}}},
  sasana:d=>{const x=S.find(y=>y.id===d.id);if(x)schadenAsana(x);},
  steilen:d=>{const x=S.find(y=>y.id===d.id),f=fzVon(x.fahrzeug_id);cliqTeilen(x.art+' '+dmy(x.datum)+': '+fzName(f)+(x.beschreibung?' · '+x.beschreibung:''),'/verwalto/fuhrpark?id='+f.id);},
};
async function schadenAsana(x){const f=fzVon(x.fahrzeug_id);
  try{const j=await asApi({aktion:'anlegen',name:[String(f.kennzeichen||'').replace(/\s+/g,''),f.modell,x.art+(x.fahrer?' '+x.fahrer:'')+' '+dmy(x.datum)].filter(Boolean).join('_'),faellig:x.frist||'',zustaendig:zustGid(),
      notiz:[x.beschreibung,x.ort?'Ort: '+x.ort:'',x.aktenzeichen?'Aktenzeichen: '+x.aktenzeichen:'',x.betrag!=null?'Betrag: '+eur(x.betrag):'','Fuhrpark im Wohntraum OS: '+location.origin+'/verwalto/fuhrpark?id='+f.id].filter(Boolean).join('\n')});
    const t=j.aufgabe||{};await sb.from('fz_schaeden').update({asana_gid:t.gid,asana_link:t.link}).eq('id',x.id);x.asana_gid=t.gid;x.asana_link=t.link;render();toast('In Asana angelegt.');}
  catch(e){toast('Asana: '+(e.message||e),6000);}}
document.addEventListener('click',e=>{const im=e.target.closest('img[data-pfad]');if(im&&im.src){const v=document.createElement('div');v.className='voll';v.innerHTML='<img src="'+esc(im.src)+'">';v.onclick=()=>v.remove();document.body.appendChild(v);return;}
  const od=e.target.closest('[data-od]');if(od){e.preventDefault();odOeffnen(od.dataset.od);return;}
  const b=e.target.closest('[data-a]');if(b&&!b.disabled&&A[b.dataset.a]){e.preventDefault();e.stopPropagation();A[b.dataset.a](b.dataset);return;}
  const au=e.target.closest('tr[data-auf]');if(au&&!e.target.closest('input,label,button,a')){AUF[au.dataset.auf]=!AUF[au.dataset.auf];render();return;}
  const fz=e.target.closest('[data-fz]');if(fz){AKT=fz.dataset.fz;EDIT=null;render();window.scrollTo(0,0);}});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='fges'){FILTER.ges=t.value==='Alle'?'':t.value;setTimeout(render);return;}
  if(t.id==='falle'){FILTER.alle=t.checked;render();return;}
  if(t.id==='fzzust'){const u=(ASU||[]).find(x=>x.name===t.value);EIN={...EIN,zustaendig:u?u.name:'',zustaendig_gid:u?u.gid:''};
    await sb.from('os_docs').upsert({app:'oc',pfad:'fuhrpark/einstellungen',data:EIN,updated_at:new Date().toISOString()});toast(u?'Zuständig für Fuhrpark-Fristen: '+u.name:'Zuständigkeit entfernt.');return;}
  if(t.id==='s-dateien'){SNEU.dateien=SNEU.dateien.concat([...t.files]);const n=document.getElementById('s-dn');if(n)n.textContent=SNEU.dateien.map(x=>x.name).join(', ');return;}
  if(t.dataset.odup){const L=[...t.files];t.value='';if(L.length)odHoch(fzVon(AKT),t.dataset.odup,L);return;}
  if(t.dataset.sfoto){const x=S.find(y=>y.id===t.dataset.sfoto);const L=[...t.files];t.value='';if(!L.length)return;const neu=await dateienHoch(x.fahrzeug_id,L);if(!neu.length)return;
    const fotos=(x.fotos||[]).concat(neu);const {error}=await sb.from('fz_schaeden').update({fotos}).eq('id',x.id);if(error){toast(error.message);return;}x.fotos=fotos;render();toast(neu.length+' Datei'+(neu.length===1?'':'en')+' gespeichert.');}});
laden();
</script></body></html>
