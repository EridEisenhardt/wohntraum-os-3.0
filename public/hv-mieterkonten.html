<script>window.OS_HILFE_HINWEISE=["Soll und Ist je Mietverhältnis ab 01.01.2025, Grundlage für den Mahnlauf.", "Saldo positiv = Mieter schuldet, negativ = Guthaben. Bis zum Übernahme-Stichtag sind Sollstellungen und Zahlungen 1 zu 1 aus Nahaus übernommen. Danach wird nur noch im OS gebucht: Sollstellungen aus dem Sollstellungslauf (fehlende Monatsmieten aus dem Mietvertrag), Zahlungen aus den Kontoauszügen.", "Saldo = alle bis heute fälligen Sollstellungen minus Zahlungen. Überfällig = offen und mehr als 5 Tage vor dem letzten Kontoauszug fällig, Zahlungen danach sind noch nicht importiert. Kaution wird getrennt geführt.", "Sollstellungslauf: jeweils am 25. für den Folgemonat automatisch. Die Kachel zeigt den nächsten noch nicht erstellten Monat, ein Klick erstellt ihn sofort.", "Sammelmahnung: jeweils am 05. und 20. des Monats. Die Kachel zeigt den nächsten Termin, ein Klick öffnet den Mahnlauf. Ist ein Termin überfällig, ist die Kachel rot.", "Mahnlauf Mieten: alle Mieter mit überfälligen Mietforderungen (fällig vor mehr als 5 Tagen): Mieten, Nebenkosten-Nachzahlungen, frühere Mahngebühren und Zinsen. Kautionen werden dort nicht gemahnt.", "Mahnlauf Kautionen: alle Mieter mit offener Kaution (fällig vor mehr als 5 Tagen). Gemahnt wird nur die Kaution, ohne Verzugszinsen.", "Im Mahnlauf kannst du Auswahl und Mahnstufe anpassen. Erstellt werden je Mieter ein Schreiben als PDF, ein Eintrag im Mahnregister, die Ablage in der Mieterakte (03 Miete & Zahlungen / Mahnungen) und ab der 1. Mahnung eine Mahngebühr als Sollstellung.", "Mieter mit Mahnsperre werden im Mahnlauf nicht vorausgewählt. Bei einem Zahltag wird im Mahnlauf vor diesem Tag nur gemahnt, wenn ältere Monate offen sind.", "Einzug ändern passt die Sollstellungen an: Monatsmieten ab dem neuen Datum (im Einzugsmonat anteilig), Kaution zum neuen Datum.", "Auszug: ab dem Folgemonat werden keine Sollstellungen mehr erstellt. Leer lassen, wenn der Mieter bleibt.", "Miete ändern: die neue Miete gilt ab dem gewählten Datum für den Sollstellungslauf, das Mieterkonto und die Dokumente (z. B. Mietangebot). Bisherige Monate bleiben unverändert.", "Sollstellung anklicken, um zu sehen, welche Zahlungen darauf gebucht sind, und um eine Zahlung zuzuordnen.", "Eine Zahlung kann auf mehrere Sollstellungen verteilt werden. Wird mehr zugeordnet als gezahlt, werden die anderen Zuordnungen dieser Zahlung gekürzt.", "Manuelle Zahlungen sind für Zahlungen, die nicht auf unseren Konten eingehen, z. B. Kaution auf ein Kautionskonto (Sparbuch, Bürgschaft) oder Barzahlung.", "Gespeicherte Notizen erhalten Datum, Uhrzeit und Ersteller und können nur von dem bearbeitet oder gelöscht werden, der sie geschrieben hat.", "Mails aus Outlook auf den Desktop ziehen (ergibt eine .eml-Datei) und hier hochladen, oder direkt in Outlook suchen, sobald Outlook verbunden ist.", "Anschreiben: danach siehst du den fertigen Brief und kannst alles noch ändern, bevor das PDF erstellt wird.", "Asana: Mieter, Einheit und Adresse werden automatisch in die Beschreibung übernommen."];</script>

<body>
<header>
  <div><h1>Mieterkonten</h1></div>
</header>
<div id="view"><div class="loading">Lade Daten …</div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
const MS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const KATS=[['miete','Mieteinnahme'],['sonst_ein','Sonstige Einnahme'],['bk','Betriebskosten'],['inst','Instandhaltung'],['umbau','Umbau'],['darl','Darlehen'],['obj_sonst','Sonstige Objektkosten'],['verw','Verwaltung'],['intern','Umbuchung intern'],['ruecklast','Rücklastschrift (hebt sich auf)'],['ignore','Nicht relevant'],['','– ungeklärt –']];
const KATN=Object.fromEntries(KATS);
const SUBS_UM=[['lizenzen','Software / IT / Lizenzen'],['personal','Personal Verwaltung'],['gf','Geschäftsführung – Immobilienverwaltung'],['buchhaltung','Buchhaltung / Steuerberatung laufend'],['buero','Büro / Miete / Nebenkosten'],['buerobedarf','Bürobedarf / Porto / Druckkosten'],['telefon','Telefon / Internet / Kommunikation'],['bank','Bank- und Zahlungsverkehrskosten'],['objverw','Miet- und Objektverwaltung'],['forderung','Forderungsmanagement / Mahnwesen'],['bkverw','Betriebskostenverwaltung'],['vermietung','Vermietung / Inserate / Besichtigungen'],['objbetreuung','Objektbetreuung / Kontrollen / Fahrten'],['recht','Rechts- und Gerichtskosten objektbezogen'],['versicherung','Versicherungen Verwaltung'],['kfz','KFZ']];
/* nicht umgelegt */
const SUBS_NO=[['recht_sonst','Rechtskosten nicht objektbezogen'],['steuern','Steuern der Gesellschaft'],['spende','Spenden'],['fortbildung','Fortbildung / Fachliteratur Immobilienverwaltung'],['eeprivat','EE Privat'],['kauf','Kauf & Verkauf Immobilie'],['sonstige','Sonstige (nicht umgelegt)']];
const SUBS=SUBS_UM.concat(SUBS_NO);
const SUB_ALIAS={storno:'bank',leasing:'lizenzen'}; /* alte Arten */
const subNorm=x=>SUB_ALIAS[x]||x;
const SUBN=Object.fromEntries(SUBS);
const POOLS=['EE-Allgemein','WT-Allgemein','KiBo-Allgemein','EE-Instandhaltung','WT-Instandhaltung'];
const COSTK=['bk','inst','darl','obj_sonst'];
const fmt=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const fmt0=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fnum=new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=v=>fmt.format(v||0), eur0=v=>fmt0.format(Math.round(v||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Daten aus der Datenbank sind schreibgeschützt – immer mit einer Kopie arbeiten */
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const r2=v=>Math.round((v||0)*100)/100;
const $=id=>document.getElementById(id);
function parseNum(s){ if(s==null) return null; s=String(s).trim().replace(/\s|€|EUR/g,''); if(s==='') return null;
  let neg=false; if(/-$/.test(s)){neg=true;s=s.slice(0,-1);}
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const v=Number(s); return isFinite(v)?(neg?-v:v):NaN; }
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),3000);}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim();

/* ---------- Zustand ---------- */
let db=null, downloads=null, canWrite=true, dbState='wait';
let nhMap={}, nhStand='', vsMap={}; let unitCostOpen=store('oc_ucost')==='1', objCostOpen=store('oc_ocost')==='1', ovVerwOpen=store('oc_ovv')==='1', ovCostOpen=store('oc_ovc')==='1';
let vors={items:[]}, vFilter='offen', objekte=[], konten=[], regeln=[], einst={}, buch={}, plan=[], loaded={o:0,k:0,r:0,e:0,b:0};
let year=new Date().getFullYear(), month=null; // null = ganzes Jahr
let tab=store('oc_tab')||'uebersicht', selObj=store('oc_obj')||'', bFilter={status:'alle',konto:'',q:'',sub:'',obj:'',sort:''};
let pending=[]; // geparste, noch nicht importierte Dateien
let ruleOpen=null; const touched=new Set();
let kFilter={m:'',konto:'',ges:'',dir:'',ab:'',q:''}; try{ const kf=JSON.parse(store('oc_kf')||'null'); if(kf&&typeof kf==='object') kFilter=Object.assign(kFilter,kf); }catch(e){}
function setKF(k,v){ kFilter[k]=v; store('oc_kf',JSON.stringify(kFilter)); render(); }
/* Suche und Betrag filtern die Zeilen direkt, ohne die Seite neu aufzubauen – so bleibt das Eingabefeld beim Tippen ungestört */
function applyKF(){ const info=$('kf-info'); if(!info) return; const q=norm(kFilter.q), ab=parseNum(kFilter.ab);
  let n=0, sum=0, grp=null, gn=0; const fin=()=>{ if(grp){ grp.hidden=!gn; const x=grp.querySelector('.gn'); if(x) x.textContent=gn?' · '+gn+' offen':''; } };
  document.querySelectorAll('#view tr.grp, #view tr.tx').forEach(tr=>{ if(tr.classList.contains('grp')){ fin(); grp=tr; gn=0; return; }
    const b=Number(tr.dataset.b), ok=(!q||tr.dataset.q.includes(q))&&(!(ab>0)||Math.abs(b)>=ab); tr.hidden=!ok;
    if(ok&&tr.dataset.open==='1'){ n++; sum+=b; gn++; } }); fin();
  info.textContent=info.dataset.pre+' · '+n+' von '+info.dataset.all+' offenen Buchungen · Summe '+eur(sum);
  const em=$('kf-empty'); if(em) em.hidden=n>0||!!document.querySelector('#view tr.tx:not([hidden])');
  const rs=$('kf-reset'); if(rs) rs.hidden=!(kFilter.konto||kFilter.ges||kFilter.dir||kFilter.q||kFilter.ab); }
{const y=Number(store('oc_year')); if(y>2000&&y<2100) year=y; const m=store('oc_month'); if(m!==null&&m!==''&&!isNaN(Number(m))) month=Number(m);}

const chains={};
function queue(path,fn){chains[path]=(chains[path]||Promise.resolve()).then(fn).catch(e=>{console.error(e);
  toast(e&&e.code==='permission_denied'?'Nur Lesezugriff – Änderungen werden nicht gespeichert.':'Speichern fehlgeschlagen: '+(e&&e.message||e));});return chains[path];}
function saveStamm(name,data){ if(!db||!canWrite){toast('Nur Lesezugriff.');return Promise.resolve();} return queue('stamm/'+name,()=>db.doc('stamm/'+name).set(data)); }

/* ---------- Klassifizierung ---------- */
const objKz=()=>new Set(objekte.map(o=>o.kz));
function kontoTyp(k){ if(!k) return 'mix'; const o=k.obj||''; if(o==='__aus') return 'aus'; if(/-Allgemein$/.test(o)) return 'allg'; if(/-Instandhaltung$/.test(o)) return 'inst'; if(objKz().has(o)) return 'obj'; return 'mix'; }
let unitIdx=null;
function buildUnitIdx(){ unitIdx=[]; for(const o of objekte){ for(const e of (o.einheiten||[])){
  const toks=[]; const ref=norm(e.ref); if(ref.length>=6 && !/^miete\b/.test(ref)) toks.push(ref);
  for(const nm of String(e.mieter||'').split(',')){ const w=norm(nm).split(' ').filter(x=>x.length>=4 && x!=='undefined' && x!=='herr' && x!=='frau'); if(w.length&&!w.includes('eisenhardt')) toks.push(w[w.length-1]); } /* eigener Name (Eric Eisenhardt) nie als Mieter-Erkennung – sonst landen Geldtransits als Miete */
  unitIdx.push({obj:o.kz,id:e.id,toks}); } } }
function matchUnit(text,objs){ if(!unitIdx) buildUnitIdx(); const t=' '+norm(text)+' ';
  for(const u of unitIdx){ if(objs && !objs.includes(u.obj)) continue; for(const tk of u.toks){ if(t.includes(' '+tk+' ')||(tk.includes(' ')&&t.includes(tk))) return u; } } return null; }
/* Mieter-Erkennung inkl. ehemaliger Mieter 2026 (Einheit.alt = [{mieter, ref, von, bis, ibans}]) */
const SHARED_IBAN=new Set(['DE94760000000076001601']); /* Bundesagentur für Arbeit – zahlt für viele Mieter */
let tenIdx=null;
const dnum=s=>s?Date.parse(s)/864e5:null;
function inWin(d,von,bis,pre,post){ const x=dnum(d); if(von&&x<dnum(von)-pre) return false; if(bis&&x>dnum(bis)+post) return false; return true; }
function nameToks(names){ const out=[]; for(const nm of String(names||'').split(',')){ const w=norm(nm).split(' ').filter(x=>x.length>=3&&!['herr','frau','undefined','unbekannt'].includes(x)); if(w.length) out.push(w); } return out; }
function buildTenIdx(){ tenIdx={full:[],short:{},iban:[],alt:[],cur:[]};
  for(const o of objekte){ for(const e of (o.einheiten||[])){
    const add=(ref,von,bis,alt)=>{ const r=norm(ref); const m=r.match(/^(h\d+ w\d+)\b/); if(!m) return;
      if(r.length>m[1].length+2) tenIdx.full.push({obj:o.kz,id:e.id,tok:r,von,bis,alt});
      (tenIdx.short[m[1]]=tenIdx.short[m[1]]||[]).push({obj:o.kz,id:e.id}); };
    add(e.ref,null,null,false);
    for(const w of nameToks(e.mieter)) if(w.length>=2&&!w.includes('eisenhardt')) tenIdx.cur.push({obj:o.kz,id:e.id,w});
    for(const a of (e.alt||[])){ add(a.ref,a.von,a.bis,true);
      for(const ib of (a.ibans||[])) if(ib&&!SHARED_IBAN.has(ib)) tenIdx.iban.push({obj:o.kz,id:e.id,ib,von:a.von,bis:a.bis});
      for(const w of nameToks(a.mieter)) tenIdx.alt.push({obj:o.kz,id:e.id,w,von:a.von,bis:a.bis}); } } } }
function matchTenant(tx,kObj,typ){ if(!tenIdx) buildTenIdx(); const t=' '+norm(tx.n+' '+tx.z)+' ';
  /* 1. vollständige Nahaus-Referenz (z. B. „H9/W6 Foller“) – gilt kontoübergreifend */
  for(const u of tenIdx.full){ if(u.alt&&!inWin(tx.d,u.von,u.bis,31,60)) continue; if(t.includes(' '+u.tok+' ')) return {obj:u.obj,id:u.id,alt:u.alt}; }
  /* 2. IBAN eines ehemaligen Mieters */
  if(tx.i&&Math.abs(tx.b)>=50){ for(const u of tenIdx.iban){ if(u.ib===tx.i&&inWin(tx.d,u.von,u.bis,31,60)) return {obj:u.obj,id:u.id,alt:true}; } }
  /* 3. kurze Referenz „H1/W1“ */
  const m=t.match(/ (h\d+ w\d+) /); if(m&&tenIdx.short[m[1]]){ const l=tenIdx.short[m[1]], objs=[...new Set(l.map(x=>x.obj))]; if(objs.length===1) return {obj:objs[0],id:new Set(l.map(x=>x.id)).size===1?l[0].id:'',alt:false}; }
  if(typ!=='obj'&&typ!=='mix') return null; /* auf Sammelkonten nur über Referenz/IBAN */
  /* 4. Name – aktuelle Mieter des Kontos, dann ehemalige (Zeitraum, ab 100 €) */
  const objs=kObj?[kObj]:null; const u0=matchUnit(tx.n+' '+tx.z,objs); if(u0) return {obj:u0.obj,id:u0.id,alt:false};
  if(Math.abs(tx.b)>=100){ for(const u of tenIdx.alt){ if(objs&&!objs.includes(u.obj)) continue; if(!inWin(tx.d,u.von,u.bis,31,60)) continue; const ln=u.w[u.w.length-1]; if(ln.length>=4&&t.includes(' '+ln+' ')) return {obj:u.obj,id:u.id,alt:true}; } }
  /* 5. Vor- und Nachname eines aktuellen Mieters in einem anderen Objekt (z. B. nach Umzug) */
  for(const u of tenIdx.cur){ if(u.w.every(x=>t.includes(' '+x+' '))) return {obj:u.obj,id:u.id,alt:false}; }
  return null; }
const BANKFEE_RE=/^(abschluss per |\*\*endsaldo\*\*|abschluss · |entgeltabschluss · |stornorechnung · stornorechnung zur abrechnung|stornorechnung zur abrechnung|rechnung · rechnung loeschung)/i;
function isBankFee(tx){ const z=String(tx.z||'').trim(); if(BANKFEE_RE.test(z)) return true;
  return /^dkb ag$/i.test(String(tx.n||'').trim())&&/^abrechnung \d\d\.\d\d\.\d{4}/i.test(z); }
let ownIban=null;
function ruleHit(text,m){ const n=norm(m); if(!n) return false; /* endet das Muster auf eine Ziffer (z. B. „B20“), muss danach ein Wortende folgen */ return /[0-9]$/.test(n)?(' '+text+' ').includes(' '+n+' '):(' '+text).includes(' '+n); }
function planHit(obj,b){ if(!obj||b>=0) return null; const a=Math.abs(b); return plan.find(p=>p.obj===obj&&Math.abs(p.betrag-a)<0.005)||null; }
/* Objektkürzel im Verwendungszweck erkennen, z. B. „K28“, „EEK28U001“, „WT-S58“ */
let objRe=null;
/* Objektadresse im Verwendungszweck (z. B. „Kraemerstrasse 28“, „In den Kirchgaerten 7“) – hat Vorrang vor Kürzel und Konto */
let addrRe=null;
function streetStem(st){ let x=norm(st).replace(/ /g,'').replace(/(strasse|str)$/,''); return x.replace(/ae|oe|ue/g,m=>m[0]).replace(/[aou]/g,m=>'('+m+'|'+m+'e)?'); }
function buildAddrRe(){ addrRe=[]; for(const o of objekte){ const m=String(o.adresse||o.name||'').split(',')[0].match(/^(.*?)\s*(\d+)\s*[a-z]?$/i); if(!m) continue;
  const hasStr=/str(\.|asse|aße)?$/i.test(m[1].trim()); const stem=streetStem(m[1]); if(stem.length<4) continue;
  addrRe.push({kz:o.kz,re:new RegExp(stem+(hasStr?'(str|strasse)':'')+(o.kz==='U6'?'(4)?':'')+m[2]+'(?![0-9])')}); } }
function objByAddr(text){ if(!addrRe) buildAddrRe(); const c=norm(text).replace(/ /g,''); for(const a of addrRe){ if(a.re.test(c)) return a.kz; } return ''; }
function objInText(text){ const ad=objByAddr(text); if(ad) return ad; if(!objRe){ const ks=objekte.map(o=>o.kz.toLowerCase()).sort((a,b)=>b.length-a.length); objRe=ks.length?new RegExp('(?:^|[^a-z0-9]|ee|wt)('+ks.join('|')+')(?![0-9])'):null; }
  if(!objRe) return ''; const m=(' '+text).match(objRe); if(!m) return ''; const o=objekte.find(x=>x.kz.toLowerCase()===m[1]); return o?o.kz:''; }
function classify(tx,k){
  if(tx.m) return {obj:tx.o||'',kat:tx.k||'',sub:tx.s||'',unit:tx.u||'',src:tx.q==='beleg'?'Beleg':'manuell'};
  const typ=kontoTyp(k), kObj=typ==='obj'?k.obj:'';
  if(typ==='aus') return {obj:'',kat:'ignore',sub:'',unit:'',src:'Konto ausgeschlossen'};
  /* Bankgebühren: Kontoabschluss, Entgeltabschluss, Endsaldo, DKB-Abrechnung → Objektkonto: sonstige Objektkosten; sonst Verwaltung › Bankgebühren */
  if(isBankFee(tx)) return typ==='obj'?{obj:k.obj,kat:'obj_sonst',sub:'',unit:'',src:'Bankgebühr'}:{obj:'',kat:'verw',sub:'bank',unit:'',src:'Bankgebühr'};
  if(!ownIban) ownIban=new Set(konten.map(x=>x.iban).filter(Boolean));
  const text=norm((tx.n||'')+' '+(tx.z||''));
  /* Vorrang-Regeln gelten auch für Überweisungen zwischen eigenen Konten (z. B. Kostenweitergabe K28 → S16) */
  const dirOK=r=>!(r.dir==='ein'&&tx.b<=0)&&!(r.dir==='aus'&&tx.b>=0)&&!(r.betrag&&Math.abs(Math.abs(tx.b)-r.betrag)>0.005);
  const hit=r=>r.iban?(tx.i===r.iban):r.nurBetrag?!!r.betrag:ruleHit(text,r.muster); /* nurBetrag: nur der Betrag entscheidet */ /* Regel mit IBAN: Gegenkonto entscheidet (z. B. Darlehenskonto) */
  for(const r of regeln){ if(!r.vor||!r.muster||!dirOK(r)||!hit(r)) continue;
    return {obj:(r.iban&&objInText(text))||r.obj||kObj,kat:r.kat,sub:r.sub||'',unit:'',src:r.iban?'Darlehenskonto':'Regel',rule:r.id}; }
  if(tx.i && ownIban.has(tx.i)) return {obj:kObj,kat:'intern',sub:'',unit:'',src:'eigenes Konto'};
  /* Zahlungen zwischen den eigenen Gesellschaften = Geldtransit */
  const cp=norm(tx.n); if(/^(wohn t raum|wohntraum|anders macher|andersmacher)\b/.test(cp)) return {obj:kObj,kat:'intern',sub:'',unit:'',src:'eigene Gesellschaft'};
  /* Eingang eines Mieters hat Vorrang vor allen Regeln */
  if(tx.b>0){ const u0=matchTenant(tx,kObj,typ); if(u0) return {obj:u0.obj,kat:'miete',sub:'',unit:u0.id||'',src:u0.alt?'ehem. Mieter erkannt':'Mieter erkannt'}; }
  for(const r of regeln){ if(!r.muster||!dirOK(r)) continue;
    if(r.scope==='allgemein'&&typ!=='allg') continue; if(r.scope==='objekt'&&typ==='allg') continue;
    if(tx.b>0 && r.kat==='verw' && r.dir!=='beide') continue; /* Verwaltungsregeln nie auf Eingänge anwenden */
    if(hit(r)){ let obj=r.obj||(r.kat==='verw'?'':(objInText(text)||kObj)); let unit='';
      if(r.kat==='miete'){const u=matchUnit(tx.n+' '+tx.z,obj?[obj]:null); if(u){unit=u.id; obj=obj||u.obj;}}
      return {obj,kat:r.kat,sub:r.sub||'',unit,src:'Regel',rule:r.id}; } }
  /* Eingänge = Mieten */
  if(tx.b>0 && (typ==='allg'||typ==='inst')) return {obj:'',kat:'',sub:'',unit:'',src:'auto'}; /* Eingang auf Sammelkonto: selbst klären */
  if(tx.b>0){ const u=matchUnit(tx.n+' '+tx.z,kObj?[kObj]:null); return {obj:kObj||(u?u.obj:''),kat:'miete',sub:'',unit:u?u.id:'',src:'auto'}; }
  /* Ausgänge: Fixkosten-Plan (Betrag passt) */
  const pk=typ==='obj'?kObj:(typ==='allg'?k.obj:''); const ph=planHit(pk,tx.b);

async function kiCall(aufgabe,text,kontext){ const sb=window.osSupabase; let tok='';
  try{ const {data}=await sb.auth.getSession(); tok=(data&&data.session&&data.session.access_token)||''; }catch(e){}
  let r; try{ r=await fetch('/api/ki',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify({aufgabe,text,kontext})}); }catch(e){ throw new Error('KI nicht erreichbar.'); }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!j) throw new Error(r.status===404?'Die KI-Funktion ist noch nicht online (Seite neu laden oder Deploy abwarten).':'KI nicht erreichbar ('+r.status+').');
  if(j.error) throw new Error(j.error); return j; }

/* einfache .eml-Auswertung: Kopfzeilen und Text */
function emlDecodeWords(s){ return String(s||'').replace(/(\?=)\s+(=\?)/g,'$1$2').replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g,(m,cs,enc,t)=>{ try{ let bytes; if(/b/i.test(enc)) bytes=Uint8Array.from(atob(t),c=>c.charCodeAt(0)); else { const q=t.replace(/_/g,' ').replace(/=([0-9A-F]{2})/gi,(m2,h)=>String.fromCharCode(parseInt(h,16))); bytes=Uint8Array.from(q,c=>c.charCodeAt(0)); } return new TextDecoder(cs.toLowerCase()).decode(bytes); }catch(e){ return t; } }); }
function emlTeil(raw){ const i=raw.search(/\r?\n\r?\n/); const head=(i<0?raw:raw.slice(0,i)).replace(/\r?\n[ \t]+/g,' '), body=i<0?'':raw.slice(i).replace(/^\r?\n\r?\n/,''); const H={};
  for(const l of head.split(/\r?\n/)){ const m=l.match(/^([\w-]+):\s*(.*)$/); if(m&&H[m[1].toLowerCase()]==null) H[m[1].toLowerCase()]=m[2]; } return {H,body}; }
function emlText(raw,tiefe){ const {H,body}=emlTeil(raw); const ct=H['content-type']||'text/plain'; tiefe=tiefe||0;
  const bm=ct.match(/boundary="?([^";]+)"?/i);
  if(/multipart\//i.test(ct)&&bm&&tiefe<5){ const parts=body.split('--'+bm[1]).slice(1).filter(p=>!/^--/.test(p)); let html='';
    for(const p of parts){ const t=emlText(p.replace(/^\r?\n/,''),tiefe+1); if(t.plain) return t; if(t.html&&!html) html=t.html; } return {html}; }
  const cs=(ct.match(/charset="?([^";]+)"?/i)||[])[1]||'utf-8', te=(H['content-transfer-encoding']||'').toLowerCase(); let bytes;
  if(te==='base64'){ try{ bytes=Uint8Array.from(atob(body.replace(/\s+/g,'')),c=>c.charCodeAt(0)); }catch(e){ bytes=null; } }
  else if(te==='quoted-printable'){ const q=body.replace(/=\r?\n/g,'').replace(/=([0-9A-F]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16))); bytes=Uint8Array.from(q,c=>c.charCodeAt(0)&255); }
  let t; try{ t=bytes?new TextDecoder(cs.toLowerCase()).decode(bytes):body; }catch(e){ t=body; }
  if(/text\/html/i.test(ct)) return {html:t.replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|tr|li)>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\n{3,}/g,'\n\n').trim()};
  if(/text\//i.test(ct)) return {plain:t.trim()}; return {}; }
function emlLesen(raw){ const {H}=emlTeil(raw); const t=emlText(raw); let d=''; try{ d=new Date(H.date).toISOString(); }catch(e){ d=new Date().toISOString(); }
  return {betreff:emlDecodeWords(H.subject||''),von:emlDecodeWords(H.from||''),an:emlDecodeWords(H.to||''),datum:d,msgId:(H['message-id']||'').trim(),text:(t.plain||t.html||'').slice(0,50000)}; }

  if(t.dataset.tadd){ const v=($('t-neu').value||'').trim(); if(!v){ toast('Bitte einen Text eingeben.'); return; } const T=(ed(MK[M.sel]).tickets||[]).concat([{id:'t'+Date.now().toString(36),t:v,d:today}]); saveEdit(M.sel,{tickets:T},'Ticket angelegt.','Ticket angelegt: '+v); return; }
  if(t.dataset.vm){ VMO[t.dataset.vm]=!VMO[t.dataset.vm]; render(); return; }
  if(t.dataset.msort){ const k=t.dataset.msort; if((M.sk||'einheit')===k) M.sd=-(M.sd||1); else { M.sk=k; M.sd=['miete','saldo'].includes(k)?-1:1; } saveM(); render(); return; }

  if(t.dataset.ecancel){ editOpen=false; render(); return; }
  if(t.dataset.esave){ const g=id=>$(id).value.trim(); editOpen=false; const kz=parseNum(g('e-kaution')), kbz=parseNum(g('e-kbez')); const alt=ed(MK[M.sel]), neu={kaution:(kz==null||isNaN(kz))?(alt.kaution||0):kz,kautionBezahlt:(kbz==null||isNaN(kbz))?'':kbz,mieter:g('e-mieter'),anrede:g('e-anrede'),email:g('e-email'),tel:g('e-tel'),betreuer:g('e-betreuer'),zahler:g('e-zahler'),ref:g('e-ref'),ampel:$('e-ampel').value,bis:g('e-bis'),von:g('e-von')};
    { const pv=g('e-personen'); if(pv===''){ if(alt.personen!=null) neu.personen=null; } else { const pz=parseNum(pv); if(pz==null||isNaN(pz)||pz<0||pz!==Math.round(pz)){ toast('Bitte bei Personen eine ganze Zahl eintragen.'); editOpen=true; return; } neu.personen=pz; } }
    if(String(neu.bis||'')===String(MK[M.sel].bisNH||'')) neu.bis=''; if(!neu.bis&&!(EDIT[M.sel]||{}).bis) delete neu.bis;
    if(neu.von&&!/^(19|20)\d\d-\d\d-\d\d$/.test(neu.von)){ toast('Bitte beim Einzug ein vollständiges Datum eintragen.'); editOpen=true; return; }
    if(String(neu.von||'')===String(MK[M.sel].vonNH||'')) neu.von=''; if(!neu.von&&!(EDIT[M.sel]||{}).von) delete neu.von;
    const NAM={kaution:'Kaution vereinbart',kautionBezahlt:'Kaution bezahlt',mieter:'Name',anrede:'Anrede',email:'E-Mail',tel:'Telefon',betreuer:'Betreuer',zahler:'Wer zahlt',ref:'Verwendungszweck',ampel:'Mieterranking',bis:'Auszug',von:'Einzug',personen:'Personen'};
    const eff=Object.assign({},neu); if('bis' in neu) eff.bis=neu.bis||MK[M.sel].bisNH||''; else eff.bis=alt.bis||''; if('von' in neu) eff.von=neu.von||MK[M.sel].vonNH||''; else eff.von=alt.von||''; const fmt=(k,v)=>(k==='bis'||k==='von')?dmy(v):v;
    const diff=Object.keys(eff).filter(k=>String(alt[k]??'')!==String(eff[k]??'')).map(k=>NAM[k]+': '+(String(fmt(k,alt[k]??''))||'–')+' → '+(String(fmt(k,eff[k]??''))||'–'));
    const altB=String(alt.betreuer||'').trim(), neuB=String(neu.betreuer||'').trim(); if(altB!==neuB) neu.betreuerSeit=neuB?isoHeute():'';
    const log=diff.length?'Mieterdaten geändert – '+diff.join('; '):false;
    if(altB&&altB!==neuB){ BFRAGE={pid:M.sel,neu,log,altB,neuB,altSeit:alt.betreuerSeit||''}; render(); return; }
    saveEdit(M.sel,neu,'Mieterdaten gespeichert.',log); return; }
  if(t.dataset.bfrage){ const F=BFRAGE; BFRAGE=null; if(!F||t.dataset.bfrage==='abbr'){ render(); if(F) toast('Nichts gespeichert.'); return; }
    let log=F.log; if(t.dataset.bfrage==='ja'){ F.neu.betreuerAlt=[{name:F.altB,von:F.altSeit,bis:isoHeute()}].concat(ed(MK[F.pid]).betreuerAlt||[]); log=(log||'Mieterdaten geändert')+'; bisheriger Betreuer archiviert: '+F.altB; }
    saveEdit(F.pid,F.neu,'Mieterdaten gespeichert.',log); return; } });
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{ const d=e.target.closest&&e.target.closest('[data-fdrop]'); if(d&&e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files')){ e.preventDefault(); document.querySelectorAll('.fold.over').forEach(x=>x!==d&&x.classList.remove('over')); d.classList.add('over'); } }));

document.addEventListener('change',async e=>{ const t=e.target;

  if(t.dataset.zkey){ const v=ZLAB[t.value]; if(!v){ if(t.value) toast('Bitte einen Eintrag aus der Liste wählen.'); return; } const z=Object.assign({},ZUORD); if(v==='~') delete z[t.dataset.zkey]; else z[t.dataset.zkey]=v; ZUORD=z; calc=null; render(); saveStamm('mietzuordnung',{map:ZUORD}).then(()=>toast(v==='-'?'Zahlung keinem Mieter zugeordnet.':'Zahlung umgebucht.')); return; }
  if(t.dataset.mrsel){ MR.sel[t.dataset.mrsel]=t.checked; render(); return; }
  if(t.dataset.mrst){ MR.stufe[t.dataset.mrst]=t.value; render(); return; }
  if(t.id==='mr-datum'){ if(t.value){ MR.datum=t.value; } render(); return; }
  if(t.id==='mr-frist'){ if(t.value) MR.frist=t.value; render(); return; }
  if(t.id==='mr-min'){ const v=parseNum(t.value); if(v!=null&&!isNaN(v)){ MR.min=v; for(const x of mahnListe()){ const g=mahnVorschlag(x).grund; MR.sel[x.mk.pid]=!g; } } render(); return; }
  if(t.id==='m-alle'){ M.alle=t.checked; calc=null; render(); return; }
  if(t.id==='m-ges'){ M.ges=t.value; saveM(); render(); return; }
  if(t.id==='m-obj'){ M.obj=t.value; saveM(); render(); return; }
  if(t.id==='m-ms'||t.id==='m-rz'||t.id==='m-sp'){ mFilterSetzen(t); return; }
  if(t.id==='mk-file'){ const f=t.files[0]; if(!f) return; const st=$('mk-st');
    try{ const n=await window.osImportFile(f,x=>st.textContent=x); st.textContent='✅ '+n+' Dokumente übernommen.'; toast('Mieterkonten aktualisiert.'); }catch(err){ st.textContent='❌ '+(err.message||err); } } });
document.addEventListener('input',e=>{ if(e.target.id==='n-text'){ NDRAFT=e.target.value; return; } if(e.target.id==='ne-text'){ NEDTXT=e.target.value; return; } if(e.target.id==='mr-q'){ MR.q=e.target.value; clearTimeout(window.__mq); window.__mq=setTimeout(render,180); return; } if(e.target.id==='m-betr'){ M.betr=e.target.value; saveM(); clearTimeout(window.__mq); window.__mq=setTimeout(render,250); return; } if(e.target.id==='m-q'){ M.q=e.target.value; clearTimeout(window.__mq); window.__mq=setTimeout(render,180); } });

  db.collection('anschreiben').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{ const v=clone(d.data()); (m[v.pid]=m[v.pid]||[]).push(v); }); ANS=m; render(); },()=>{});

  db.collection('mietkonten').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{m[d.id]=clone(d.data());}); MK=m; applyBis(); loadedMK=true; calc=null; render(); zvTry(); deepLink(); },()=>{ loadedMK=true; render(); });
