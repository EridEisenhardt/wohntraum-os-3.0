  if(typ==='aus') return {obj:'',kat:'ignore',sub:'',unit:'',src:'Konto ausgeschlossen'};

  if(isBankFee(tx)) return typ==='obj'?{obj:k.obj,kat:'obj_sonst',sub:'',unit:'',src:'Bankgebühr'}:{obj:'',kat:'verw',sub:'bank',unit:'',src:'Bankgebühr'};

  if(tx.b>0 && (typ==='allg'||typ==='inst')) return {obj:'',kat:'',sub:'',unit:'',src:'auto'}; /* Eingang auf Sammelkonto: selbst klären */
  if(tx.b>0){ const u=matchUnit(tx.n+' '+tx.z,kObj?[kObj]:null); return {obj:kObj||(u?u.obj:''),kat:'miete',sub:'',unit:u?u.id:'',src:'auto'}; }

  const oT=objInText(text);
  if(typ==='inst') return {obj:oT,kat:'inst',sub:'',unit:'',src:oT?'Objekt im Text':'auto'};

  const mk=ed(x.mk), o=objekte.find(q=>q.kz===x.mk.obj)||{}, inh=INHABER[o.ges||x.mk.ges]||INHABER.WT, adr=(ADR[x.mk.obj]||'|').split('|');
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}); const L=20,R=190; let y=18;
  const kopf=()=>{ doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120); doc.text(inh+ABS,L,y); y+=8; doc.setTextColor(20);
    doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.text(art==='soll'?'Sollstellungen':'Mieterkonto',L,y); doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90); doc.text('Stand '+dmy(today),R,y,{align:'right'}); y+=6; doc.setTextColor(20);
    doc.setFontSize(10); doc.text((mk.mieter||'')+' · '+x.mk.obj+' '+uName(x.mk.einheit),L,y); y+=5; doc.setFontSize(9); doc.setTextColor(90); doc.text(adr[0]+', '+adr[1]+' · Mietbeginn '+dmy(x.mk.von)+(x.mk.bis?' · Mietende '+dmy(x.mk.bis):''),L,y); y+=8; doc.setTextColor(20); };
  kopf();
  let cols, rows;
  if(art==='soll'){ cols=[['Fällig',22,'l'],['Sollstellung',78,'l'],['Betrag',22,'r'],['bezahlt',22,'r'],['offen',26,'r']];
    rows=x.rows.filter(r=>r.s>0&&r.id&&!r.fut).map(r=>[dmy(r.d),r.t+(r.k?' (Kaution)':''),eur(r.s),eur(r2(r.s-(r.offen||0))),r.offen>0.005?eur(r.offen):'–']); }
  else { cols=[['Datum',22,'l'],['Buchung',88,'l'],['Soll',20,'r'],['Ist',20,'r'],['Saldo',20,'r']];
    rows=x.rows.filter(r=>!r.fut).map(r=>[dmy(r.d),(r.t||'')+(r.k?' (Kaution)':''),r.s?eur(r.s):'',r.h?eur(r.h):'',r.saldo==null?'':eur(r.saldo)]); }
  const head=()=>{ doc.setFont('helvetica','bold'); doc.setFontSize(8.5); let cx=L; for(const [t,w,a] of cols){ doc.text(t,a==='r'?cx+w:cx,y,{align:a==='r'?'right':'left'}); cx+=w; } y+=1.5; doc.line(L,y,R,y); y+=4; doc.setFont('helvetica','normal'); };
  head();
  for(const row of rows){ const lines=doc.splitTextToSize(String(row[1]),cols[1][1]-2); if(y+lines.length*4>282){ doc.addPage(); y=18; head(); }
    let cx=L; row.forEach((v,i)=>{ const [t,w,a]=cols[i]; if(i===1) doc.text(lines,cx,y); else doc.text(String(v),a==='r'?cx+w:cx,y,{align:a==='r'?'right':'left'}); cx+=w; }); y+=lines.length*4+1; }
  y+=1; doc.line(L,y-3,R,y-3); y+=2; doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
  if(art==='soll'){ const off=r2(x.rows.filter(r=>r.s>0&&r.id&&!r.fut&&!r.k).reduce((a,r)=>a+(r.offen||0),0)); doc.text('Summe offen (ohne Kaution)',L,y); doc.text(eur(off),R,y,{align:'right'}); if(x.kOffen>0.5){ y+=5; doc.text('Kaution offen',L,y); doc.text(eur(x.kOffen),R,y,{align:'right'}); } }
  else { doc.text('Saldo (positiv = offene Forderung)',L,y); doc.text(eur(x.saldo),R,y,{align:'right'}); y+=5; doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.text('Kautionsbuchungen sind gekennzeichnet und im Saldo nicht enthalten.',L,y); }
  const pages=doc.getNumberOfPages(); for(let i=1;i<=pages;i++){ doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(120); doc.text('Seite '+i+' von '+pages+' · erstellt mit Wohntraum OS',R,292,{align:'right'}); }
  return doc; }
function pdfName(x,art){ return aktenName(x.mk)+'_'+today+'_'+(art==='soll'?'Sollstellungen':'Mieterkonto')+'.pdf'; }
async function pdfInAkte(x,art){ const doc=pdfAuszug(x,art); if(!doc) return; const sb=window.osSupabase; const name=enc(pdfName(x,art)).replace(/\//g,'_');

/* ---------- Notizen: jede Notiz ein eigener Eintrag mit Datum und Ersteller, nicht änderbar oder löschbar ---------- */
var VMO={}, NEDIT=null, NEDTXT=''; var NOTIZ={}, NOTF=[], ICH='', ICHID='', ICHMAIL='', nBusy=false, NDRAFT='';
const NUTZER={'ramona@andersmacher.info':'Ramona','juergen@andersmacher.info':'Jürgen','eric@andersmacher.info':'Eric'};
const nutzerName=v=>{ const k=String(v||'').toLowerCase().trim(); return NUTZER[k]||v||'unbekannt'; };
async function loadIch(){ const sb=window.osSupabase; if(!sb) return; try{ const {data:{user}}=await sb.auth.getUser(); if(!user) return; let n=(user.user_metadata&&(user.user_metadata.full_name||user.user_metadata.name))||'';
  try{ const {data}=await sb.from('profiles').select('full_name,email').eq('id',user.id).maybeSingle(); if(data&&data.full_name) n=data.full_name; }catch(e){}
  ICHID=user.id; ICHMAIL=String(user.email||'').toLowerCase(); ICH=NUTZER[ICHMAIL]||n||user.email||''; }catch(e){} }
function notizCard(x){ const mk=ed(x.mk), L=(NOTIZ[x.mk.pid]||[]).slice().sort((a,b)=>a.d<b.d?1:-1);

    +'<div class="acts">'+kiNotizButtons('n-text')+'</div><div class="acts"><label class="ghost small up">Datei anhängen<input type="file" id="n-file" multiple hidden></label>'+(NOTF.length?'<span class="sub">'+NOTF.map(f=>esc(f.name)).join(', ')+'</span>':'')+'<button class="primary small" data-nsave="1"'+(nBusy?' disabled':'')+'>'+(nBusy?'Speichere …':'Notiz speichern')+'</button></div>'
    +'<div class="sub">Gespeicherte Notizen erhalten Datum, Uhrzeit und Ersteller und können nur von dem bearbeitet oder gelöscht werden, der sie geschrieben hat.</div>';
  for(const n of L){ const dt=new Date(n.d); h+='<div class="note-e"><div class="note-h"><b>'+esc(dt.toLocaleDateString('de-DE'))+' '+esc(dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}))+'</b> · '+esc(nutzerName(n.mail||n.by))+(n.edited?' <span class="sub">(bearbeitet '+esc(new Date(n.edited).toLocaleDateString('de-DE'))+')</span>':'')+(eigeneNotiz(n)&&NEDIT!==nid(n)?' <button class="ghost small" data-nedit="'+esc(nid(n))+'">bearbeiten</button><button class="ghost small" data-ndel="'+esc(nid(n))+'">löschen</button>':'')+'</div>'
      +(NEDIT===nid(n)?'<textarea id="ne-text" rows="5">'+esc(NEDTXT)+'</textarea><div class="acts">'+kiNotizButtons('ne-text')+'</div><div class="acts"><button class="primary small" data-nesave="1">Speichern</button><button class="ghost small" data-necancel="1">Abbrechen</button></div>':(n.t?'<div class="note-t">'+esc(n.t)+'</div>'+(n.t.length>350?'<div class="acts"><button class="ghost small" data-nkurz="'+esc(nid(n))+'"'+(kurzBusy===nid(n)?' disabled':'')+'>'+(kurzBusy===nid(n)?'KI fasst zusammen …':KURZ[nid(n)]?'Kurzfassung ausblenden':'Kurzfassung (KI)')+'</button></div>'+(KURZ[nid(n)]?'<div class="note-k"><div class="sub">Kurzfassung der KI – die Notiz selbst bleibt unverändert'+(KURZ[nid(n)].zu!==(n.edited||n.d)?' (Notiz wurde seitdem geändert)':'')+'</div>'+esc(KURZ[nid(n)].t)+'</div>':''):''):''))
      +(n.files&&n.files.length?'<div class="note-f">'+n.files.map(f=>'<a href="#" data-nfopen="'+esc(f.p)+'">'+esc(f.n)+'</a>').join(' · ')+'</div>':'')+'</div>'; }
  if(mk.notiz) h+='<div class="note-e"><div class="note-h"><b>Frühere Notiz</b> · ohne Datum</div><div class="note-t">'+esc(mk.notiz)+'</div></div>';
  return h+'</div>'; }
async function notizSpeichern(){ const sb=window.osSupabase, mk=MK[M.sel]; if(!sb||!db||!mk||nBusy) return; const ta=$('n-text'), t=((ta&&ta.value)||NDRAFT||'').trim();
  if(!t&&!NOTF.length){ toast('Bitte einen Text eingeben oder eine Datei anhängen.'); return; }
  if(!ICH) await loadIch(); nBusy=true; render(); const ts=new Date(), id=mk.pid+'__'+ts.getTime(), files=[];
  for(const f of NOTF){ const p=docBase(mk)+'/Notizen/'+ts.getTime()+'_'+enc(f.name).replace(/\//g,'_'); const {error}=await sb.storage.from('mieterakten').upload(p,f,{upsert:false,contentType:f.type||undefined}); if(error){ toast(f.name+': '+error.message); nBusy=false; render(); return; } files.push({p,n:f.name}); }
  const e={pid:mk.pid,d:ts.toISOString(),by:ICH||'unbekannt',mail:ICHMAIL,uid:ICHID,t,files,id};
  try{ await db.doc('notizen/'+id).set(e); NOTF=[]; NDRAFT=''; if(ta) ta.value=''; toast('Notiz gespeichert.'); }catch(err){ toast('Notiz nicht gespeichert: '+(err.message||err)); }
  nBusy=false; render(); }

function eigeneNotiz(n){ return (ICHID&&n.uid===ICHID)||(ICHMAIL&&String(n.mail||n.by||'').toLowerCase()===ICHMAIL); }
async function notizLoeschen(id){ const sb=window.osSupabase; const pid=id.split('__')[0]; const n=(NOTIZ[pid]||[]).find(q=>(q.id||(q.pid+'__'+Date.parse(q.d)))===id); if(!n||!eigeneNotiz(n)){ toast('Nur der Verfasser kann diese Notiz löschen.'); return; }
  try{ if(n.files&&n.files.length){ const {error}=await sb.storage.from('mieterakten').remove(n.files.map(f=>f.p)); if(error) throw error; }
    await db.doc('notizen/'+id).delete(); toast('Notiz gelöscht.'); }catch(err){ toast('Löschen nicht möglich: '+(err.message||err)); } }

const nid=n=>n.id||(n.pid+'__'+Date.parse(n.d));
function notizById(id){ const pid=id.split('__')[0]; return (NOTIZ[pid]||[]).find(q=>nid(q)===id)||null; }
async function notizAendern(){ const n=notizById(NEDIT); if(!n||!eigeneNotiz(n)){ toast('Nur der Verfasser kann diese Notiz bearbeiten.'); return; } const t=(NEDTXT||'').trim(); if(!t&&!(n.files||[]).length){ toast('Bitte einen Text eingeben.'); return; }
  const neu=Object.assign({},n,{t,edited:new Date().toISOString()}); const id=NEDIT;
  try{ await db.doc('notizen/'+id).set(neu); NEDIT=null; NEDTXT=''; toast('Notiz geändert.'); render(); }catch(err){ toast('Ändern nicht möglich: '+(err.message||err)); } }

/* ---------- KI-Hilfe (Server: /api/ki) ---------- */
async function kiCall(aufgabe,text,kontext){ const sb=window.osSupabase; let tok='';
  try{ const {data}=await sb.auth.getSession(); tok=(data&&data.session&&data.session.access_token)||''; }catch(e){}
  let r; try{ r=await fetch('/api/ki',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify({aufgabe,text,kontext})}); }catch(e){ throw new Error('KI nicht erreichbar.'); }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!j) throw new Error(r.status===404?'Die KI-Funktion ist noch nicht online (Seite neu laden oder Deploy abwarten).':'KI nicht erreichbar ('+r.status+').');
  if(j.error) throw new Error(j.error); return j; }

/* Briefanrede aus der hinterlegten Anrede (wie bei den Mahnungen) */
function anredeZeile(mk){ const e=ed(mk), an=String(e.anrede||'').trim(), name=e.mieter||'';
  if(!an) return 'Guten Tag '+name+',';
  if(/^(sehr|liebe|hallo|guten)/i.test(an)) return an.replace(/,?$/,',');
  return an.split(/\s*(?:,|\bund\b)\s*/).filter(Boolean).map((t,i)=>(i?'s':'S')+'ehr geehrte'+(/^herr/i.test(t)?'r ':' ')+t).join(', ')+','; }
function briefInhaber(mk){ const o=objekte.find(q=>q.kz===mk.obj)||{}; return INHABER[o.ges||mk.ges]||INHABER.WT; }
function briefEmpf(mk){ const e=ed(mk), adr=(ADR[mk.obj]||'|').split('|'); return [e.mieter||'',adr[0]+(mk.einheit&&!/efh/i.test(mk.einheit)?', '+uName(mk.einheit):''),adr[1]].filter(Boolean).join('\n'); }

/* ---------- Anschreiben ---------- */
var ANS={}, AB={pid:null}, abBusy='';
function abReset(mk){ AB={pid:mk.pid,betreff:'',entwurf:'',phase:'eingabe',text:'',empf:briefEmpf(mk),ki:false}; }
const abName=(mk,d,betreff)=>enc(aktenName(mk)+'_'+d+'_Anschreiben '+String(betreff||'ohne Betreff').replace(/[\/\\]/g,'-').slice(0,60).trim()).replace(/\//g,'_')+'.pdf';

function anschreibenPdf(mk,B){ if(!window.jspdf){ toast('PDF-Bibliothek lädt noch, bitte gleich nochmal.'); return null; }
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}); const L=25,R=185; let y=22;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120); doc.text(B.inh+ABS,L,y); y+=12;
  doc.setTextColor(20); doc.setFontSize(11); String(B.empf||'').split('\n').filter(s=>s.trim()).forEach(l=>{ doc.text(l.trim(),L,y); y+=5; });
  y=Math.max(y,62)+8; doc.setFontSize(9); doc.setTextColor(90); doc.text('Dexheim, '+dmy(B.d),R,y,{align:'right'});
  y+=12; doc.setTextColor(20); doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.splitTextToSize(B.betreff||'',R-L).forEach(l=>{ doc.text(l,L,y); y+=6; }); doc.setFont('helvetica','normal'); y+=4; doc.setFontSize(10.5);
  const para=t=>{ doc.splitTextToSize(t,R-L).forEach(ln=>{ if(y>275){ doc.addPage(); y=22; } doc.text(ln,L,y); y+=5.4; }); y+=3; };
  String(B.text||'').replace(/\r/g,'').split(/\n\s*\n/).forEach(p=>para(p.trim()));
  y+=2; para('Mit freundlichen Grüßen\n'+B.inh);
  const pages=doc.getNumberOfPages(); if(pages>1) for(let i=1;i<=pages;i++){ doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(120); doc.text('Seite '+i+' von '+pages,R,292,{align:'right'}); }
  return doc; }
function abDaten(mk){ return {inh:briefInhaber(mk),empf:AB.empf,d:today,betreff:AB.betreff.trim(),text:AB.text.trim()}; }

function anschreibenCard(x){ const mk=x.mk; if(AB.pid!==mk.pid) abReset(mk);
  const L=(ANS[mk.pid]||[]).slice().sort((a,b)=>a.d<b.d?1:-1);
  let h='<details class="card wide sec" data-sec="brief"'+(SEC.brief?' open':'')+'><summary class="ch">Anschreiben<span class="sub">'+L.length+' verschickt'+(L.length?' · zuletzt '+esc(dmy(L[0].d.slice(0,10))):'')+'</span></summary>';
  if(AB.phase==='eingabe'){
    h+='<label class="fl">Betreff (optional – die KI schlägt sonst einen vor)<input type="text" id="ab-betreff" value="'+esc(AB.betreff)+'" placeholder="z. B. Treppenhausreinigung"></label>'
      +'<label class="fl">Ihr Text – Stichworte oder Entwurf<textarea id="ab-entwurf" rows="5" placeholder="Was soll der Mieter erfahren? Die KI formuliert daraus einen Brief.">'+esc(AB.entwurf)+'</textarea></label>'
      +'<div class="acts"><button class="primary small" data-abki="1"'+(abBusy?' disabled':'')+'>'+(abBusy==='ki'?'KI formuliert …':'Mit KI formulieren')+'</button><button class="ghost small" data-abdirekt="1">Ohne KI übernehmen</button></div>'
      +'<div class="sub">Danach siehst du den fertigen Brief und kannst alles noch ändern, bevor das PDF erstellt wird.</div>';
  } else {
    h+='<div class="sub">'+(AB.ki?'Vorschlag der KI – bitte prüfen und bei Bedarf ändern.':'Brief prüfen und bei Bedarf ändern.')+' Briefkopf, Datum und Grußformel ergänzt das System.</div>'
      +'<label class="fl">Empfänger<textarea id="ab-empf" rows="3">'+esc(AB.empf)+'</textarea></label>'
      +'<label class="fl">Betreff<input type="text" id="ab-betreff2" value="'+esc(AB.betreff)+'"></label>'
      +'<label class="fl">Brieftext<textarea id="ab-text" rows="12">'+esc(AB.text)+'</textarea></label>'
      +'<div class="acts"><button class="primary small" data-absave="1"'+(abBusy?' disabled':'')+'>'+(abBusy==='save'?'Speichere …':'PDF erstellen und ablegen')+'</button><button class="ghost small" data-abvor="1">Vorschau</button><button class="ghost small" data-abzur="1">Zurück zum Entwurf</button><button class="ghost small" data-abweg="1">Verwerfen</button></div>'
      +'<div class="sub">Das PDF wird unter Dokumente / 05 Schriftverkehr abgelegt als: '+esc(abName(mk,today,AB.betreff))+'</div>';
  }
  h+='<div class="rh" style="margin-top:12px">Verschickte Anschreiben</div>';
  if(!L.length) h+='<div class="sub">Noch keine Anschreiben erstellt.</div>';
  else h+='<table class="mini">'+L.map(a=>'<tr><td>'+esc(dmy(a.d.slice(0,10)))+'</td><td><a href="#" data-dopen="05 Schriftverkehr|'+esc(a.datei)+'">'+esc(a.betreff||'ohne Betreff')+'</a></td><td class="sub">'+esc(nutzerName(a.mail||a.by))+'</td></tr>').join('')+'</table>';
  return h+'</details>'; }

async function abKi(){ const mk=MK[M.sel]; if(!mk) return; if(!AB.entwurf.trim()){ toast('Bitte zuerst einen Text oder Stichworte eingeben.'); return; }
  abBusy='ki'; render();
  try{ const r=await kiCall('brief',AB.entwurf,{anrede:anredeZeile(mk),mieter:ed(mk).mieter||'',objekt:mk.obj+' '+uName(mk.einheit),betreff:AB.betreff});
    AB.text=r.text||''; if(r.betreff&&!AB.betreff.trim()) AB.betreff=r.betreff; AB.phase='vorschau'; AB.ki=true; }
  catch(e){ toast(e.message||String(e)); }
  abBusy=''; render(); }
function abDirekt(){ const mk=MK[M.sel]; if(!mk) return; if(!AB.entwurf.trim()){ toast('Bitte zuerst einen Text eingeben.'); return; }
  AB.text=(/^(sehr|liebe|hallo|guten)/i.test(AB.entwurf.trim())?'':anredeZeile(mk)+'\n\n')+AB.entwurf.trim(); AB.phase='vorschau'; AB.ki=false; render(); }
async function abSpeichern(){ const sb=window.osSupabase, mk=MK[M.sel]; if(!sb||!db||!mk||abBusy) return;
  if(!AB.betreff.trim()){ toast('Bitte einen Betreff eingeben.'); return; } if(!AB.text.trim()){ toast('Der Brieftext ist leer.'); return; }
  const B=abDaten(mk), doc=anschreibenPdf(mk,B); if(!doc) return;
  if(!ICH) await loadIch(); abBusy='save'; render();
  const ts=new Date(), name=abName(mk,today,B.betreff), id=mk.pid+'__'+ts.getTime();
  try{ const {error}=await sb.storage.from('mieterakten').upload(docBase(mk)+'/'+enc('05 Schriftverkehr')+'/'+name,doc.output('blob'),{contentType:'application/pdf',upsert:true}); if(error) throw error;
    await db.doc('anschreiben/'+id).set({pid:mk.pid,id,d:ts.toISOString(),by:ICH||'unbekannt',mail:ICHMAIL,uid:ICHID,betreff:B.betreff,text:B.text,empf:B.empf,datei:name,ki:!!AB.ki});
    doc.save(name); toast('Anschreiben erstellt und unter 05 Schriftverkehr abgelegt.'); abReset(mk); loadDocs(mk); }
  catch(e){ toast('Ablage fehlgeschlagen: '+(e.message||e)); }
  abBusy=''; render(); }

/* ---------- Notizen mit KI verbessern oder kürzen ---------- */
var NKI={orig:null,busy:''}, NEKI={orig:null}, KURZ={}, kurzBusy='';
async function notizKi(aufgabe,feld){ const ta=$(feld), t=((ta&&ta.value)||'').trim(); if(!t){ toast('Bitte zuerst einen Text eingeben.'); return; }
  NKI.busy=feld+aufgabe; render();
  try{ const r=await kiCall(aufgabe,t); if(feld==='n-text'){ if(NKI.orig==null) NKI.orig=t; NDRAFT=r.text||t; } else { if(NEKI.orig==null) NEKI.orig=t; NEDTXT=r.text||t; } }
  catch(e){ toast(e.message||String(e)); }
  NKI.busy=''; render(); }
async function notizKurz(id){ const n=notizById(id); if(!n||!n.t) return; if(KURZ[id]){ KURZ[id]=null; render(); return; }
  kurzBusy=id; render(); try{ const r=await kiCall('stichpunkte',n.t); KURZ[id]={t:r.text||'',zu:n.edited||n.d}; }catch(e){ toast(e.message||String(e)); } kurzBusy=''; render(); }
function kiNotizButtons(feld){ const b=NKI.busy, orig=feld==='n-text'?NKI.orig:NEKI.orig;
  return '<button class="ghost small" data-nki="verbessern" data-nkif="'+feld+'"'+(b?' disabled':'')+'>'+(b===feld+'verbessern'?'KI arbeitet …':'Mit KI verbessern')+'</button>'
    +'<button class="ghost small" data-nki="stichpunkte" data-nkif="'+feld+'"'+(b?' disabled':'')+'>'+(b===feld+'stichpunkte'?'KI arbeitet …':'In Stichpunkte kürzen')+'</button>'
    +(orig!=null?'<button class="ghost small" data-nkorig="'+feld+'">Original wiederherstellen</button>':''); }

/* ---------- Mails zum Mieter (Outlook über /api/mails, oder .eml-Dateien hochladen) ---------- */
var MAILS={}, MLS={pid:null,res:null,busy:'',fehler:[],offen:{}};
const mlHash=s=>{ let h=5381; for(let i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0; return h.toString(36); };
function mieterMails(mk){ const e=ed(mk), K=mk.kontakte||[]; const s=e.email!=null&&e.email!==''?String(e.email):K.map(k=>k.email).filter(Boolean).join(','); return s.split(/[,;\s]+/).map(x=>x.trim().toLowerCase()).filter(x=>/@/.test(x)); }
async function mlApi(body){ const sb=window.osSupabase; let tok=''; try{ const {data}=await sb.auth.getSession(); tok=(data&&data.session&&data.session.access_token)||''; }catch(e){}
  let r; try{ r=await fetch('/api/mails',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(body)}); }catch(e){ throw new Error('Outlook-Schnittstelle nicht erreichbar.'); }
  let j=null; try{ j=await r.json(); }catch(e){} if(!j) throw new Error(r.status===404?'Die Outlook-Schnittstelle ist noch nicht online.':'Outlook nicht erreichbar ('+r.status+').'); if(j.error) throw new Error(j.error); return j; }

/* einfache .eml-Auswertung: Kopfzeilen und Text */
function emlDecodeWords(s){ return String(s||'').replace(/(\?=)\s+(=\?)/g,'$1$2').replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g,(m,cs,enc,t)=>{ try{ let bytes; if(/b/i.test(enc)) bytes=Uint8Array.from(atob(t),c=>c.charCodeAt(0)); else { const q=t.replace(/_/g,' ').replace(/=([0-9A-F]{2})/gi,(m2,h)=>String.fromCharCode(parseInt(h,16))); bytes=Uint8Array.from(q,c=>c.charCodeAt(0)); } return new TextDecoder(cs.toLowerCase()).decode(bytes); }catch(e){ return t; } }); }
function emlTeil(raw){ const i=raw.search(/\r?\n\r?\n/); const head=(i<0?raw:raw.slice(0,i)).replace(/\r?\n[ \t]+/g,' '), body=i<0?'':raw.slice(i).replace(/^\r?\n\r?\n/,''); const H={};
  for(const l of head.split(/\r?\n/)){ const m=l.match(/^([\w-]+):\s*(.*)$/); if(m&&H[m[1].toLowerCase()]==null) H[m[1].toLowerCase()]=m[2]; } return {H,body}; }
function emlText(raw,tiefe){ const {H,body}=emlTeil(raw); const ct=H['content-type']||'text/plain'; tiefe=tiefe||0;
  const bm=ct.match(/boundary="?([^";]+)"?/i);
  if(/multipart\//i.test(ct)&&bm&&tiefe<5){ const parts=body.split('--'+bm[1]).slice(1).filter(p=>!/^--/.test(p)); let html='';
    for(const p of parts){ const t=emlText(p.replace(/^\r?\n/,''),tiefe+1); if(t.plain) return t; if(t.html&&!html) html=t.html; } return {html}; }
  const cs=(ct.match(/charset="?([^";]+)"?/i)||[])[1]||'utf-8', te=(H['content-transfer-encoding']||'').toLowerCase(); let bytes;
  if(te==='base64'){ try{ bytes=Uint8Array.from(atob(body.replace(/\s+/g,'')),c=>c.charCodeAt(0)); }catch(e){ bytes=null; } }
  else if(te==='quoted-printable'){ const q=body.replace(/=\r?\n/g,'').replace(/=([0-9A-F]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16))); bytes=Uint8Array.from(q,c=>c.charCodeAt(0)&255); }
  let t; try{ t=bytes?new TextDecoder(cs.toLowerCase()).decode(bytes):body; }catch(e){ t=body; }
  if(/text\/html/i.test(ct)) return {html:t.replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|tr|li)>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\n{3,}/g,'\n\n').trim()};
  if(/text\//i.test(ct)) return {plain:t.trim()}; return {}; }
function emlLesen(raw){ const {H}=emlTeil(raw); const t=emlText(raw); let d=''; try{ d=new Date(H.date).toISOString(); }catch(e){ d=new Date().toISOString(); }
  return {betreff:emlDecodeWords(H.subject||''),von:emlDecodeWords(H.from||''),an:emlDecodeWords(H.to||''),datum:d,msgId:(H['message-id']||'').trim(),text:(t.plain||t.html||'').slice(0,50000)}; }

function mailName(mk,m){ return enc(aktenName(mk)+'_'+String(m.datum||'').slice(0,10)+'_Mail '+m.richtung+' '+String(m.betreff||'ohne Betreff').replace(/[\/\\]/g,'-').slice(0,50).trim()).replace(/\//g,'_')+'.eml'; }
async function mailSpeichern(mk,m,mime,quelle){ const sb=window.osSupabase; if(!ICH) await loadIch();
  const name=mailName(mk,m), id=mk.pid+'__'+mlHash(m.msgId||(m.datum+m.betreff+m.von));
  const {error}=await sb.storage.from('mieterakten').upload(docBase(mk)+'/Mails/'+name,new Blob([mime],{type:'message/rfc822'}),{contentType:'message/rfc822',upsert:true}); if(error) throw error;
  await db.doc('mails/'+id).set({pid:mk.pid,id,d:m.datum,richtung:m.richtung,von:m.von,an:m.an,betreff:m.betreff,text:String(m.text||'').slice(0,20000),datei:docBase(mk)+'/Mails/'+name,msgId:m.msgId||'',quelle,by:ICH||'unbekannt',mail:ICHMAIL,erfasst:new Date().toISOString()}); }

function mailsCard(x){ const mk=x.mk; if(MLS.pid!==mk.pid) MLS={pid:mk.pid,res:null,busy:'',fehler:[],offen:{}};
  const L=(MAILS[mk.pid]||[]).slice().sort((a,b)=>String(b.d).localeCompare(String(a.d))), have=new Set(L.map(m=>m.msgId).filter(Boolean)), adr=mieterMails(mk);
  let h='<details class="card wide sec" data-sec="mails"'+(SEC.mails?' open':'')+'><summary class="ch">Mails<span class="sub">'+L.length+' hinterlegt'+(L.length?' · zuletzt '+esc(dmy(String(L[0].d).slice(0,10))):'')+'</span></summary>';
  h+='<div class="acts"><button class="primary small" data-mlsuch="1"'+(MLS.busy?' disabled':'')+'>'+(MLS.busy==='suche'?'Suche in Outlook …':'In Outlook suchen')+'</button>'
    +'<label class="ghost small up">.eml-Dateien hochladen<input type="file" id="ml-file" accept=".eml,message/rfc822" multiple hidden></label>'
    +'<span class="sub">'+(adr.length?'Mieter-Adresse: '+esc(adr.join(', ')):'Keine E-Mail-Adresse beim Mieter hinterlegt (Mieterinformationen bearbeiten).')+'</span></div>'
    +'<div class="sub">Mails aus Outlook auf den Desktop ziehen (ergibt eine .eml-Datei) und hier hochladen – oder direkt in Outlook suchen, sobald Outlook verbunden ist.</div>';
  if(MLS.fehler.length) h+='<div class="note warnbox">'+MLS.fehler.map(esc).join('<br>')+'</div>';

    h+='<div class="rh" style="margin-top:10px">Gefunden in Outlook: '+MLS.res.length+' Mails, davon '+neu.length+' noch nicht hinterlegt'+(neu.length>1?' <button class="ghost small" data-mlalle="1"'+(MLS.busy?' disabled':'')+'>alle hinterlegen</button>':'')+'</div>';
    for(const m of neu) h+='<div class="ml-row"><b>'+esc(m.betreff||'ohne Betreff')+'</b> <span class="pill src">'+esc(m.richtung)+'</span><div class="sub">'+esc(new Date(m.datum).toLocaleString('de-DE'))+' · von '+esc(m.von)+' · an '+esc(m.an)+(m.anhang?' · mit Anhang':'')+'</div><div class="sub">'+esc(m.vorschau.slice(0,200))+'</div><button class="ghost small" data-mladd="'+esc(m.id)+'"'+(MLS.busy?' disabled':'')+'>'+(MLS.busy===m.id?'Hinterlege …':'Hinterlegen')+'</button></div>'; }
  h+='<div class="rh" style="margin-top:12px">Hinterlegte Mails</div>';
  if(!L.length) h+='<div class="sub">Noch keine Mails hinterlegt.</div>';

    +(o?'<div class="ml-b">'+esc(m.text||'(kein Text)')+'</div><div class="acts"><a href="#" data-nfopen="'+esc(m.datei)+'">Original-Mail (.eml) öffnen</a></div>':'')+'</div>'; }
  return h+'</details>'; }

async function mlSuchen(){ const mk=MK[M.sel]; if(!mk) return; const adr=mieterMails(mk); if(!adr.length){ toast('Beim Mieter ist keine E-Mail-Adresse hinterlegt.'); return; }
  MLS.busy='suche'; MLS.fehler=[]; render();
  try{ const r=await mlApi({aktion:'suchen',adressen:adr}); MLS.res=r.mails||[]; MLS.fehler=r.fehler||[]; if(!MLS.res.length&&!MLS.fehler.length) toast('Keine Mails zu '+adr.join(', ')+' gefunden.'); }
  catch(e){ MLS.fehler=[e.message||String(e)]; }
  MLS.busy=''; render(); }
async function mlHinterlegen(ids){ const mk=MK[M.sel]; if(!mk||!MLS.res) return; let n=0;
  for(const id of ids){ const m=MLS.res.find(q=>q.id===id); if(!m) continue; MLS.busy=id; render();
    try{ const r=await mlApi({aktion:'laden',mailbox:m.mailbox,id:m.id}); await mailSpeichern(mk,Object.assign({},m,{text:r.text}),r.mime,'outlook'); n++; }
    catch(e){ toast((m.betreff||'Mail')+': '+(e.message||e)); break; } }
  MLS.busy=''; if(n) toast(n+' Mail'+(n>1?'s':'')+' hinterlegt.'); render(); }
async function mlUpload(files){ const mk=MK[M.sel]; if(!mk||!files.length) return; const adr=mieterMails(mk); let n=0;
  for(const f of files){ try{ const raw=await f.text(); const m=emlLesen(raw); const vonA=(m.von.match(/[\w.+-]+@[\w.-]+/)||[''])[0].toLowerCase();
      m.richtung=adr.includes(vonA)||!/andersmacher|wohntraum/i.test(vonA)?'Eingang':'Ausgang'; if(!m.betreff) m.betreff=f.name.replace(/\.eml$/i,'');
      await mailSpeichern(mk,m,raw,'upload'); n++; }
    catch(e){ toast(f.name+': '+(e.message||e)); } }
  if(n) toast(n+' Mail'+(n>1?'s':'')+' hinterlegt.'); render(); }

document.addEventListener('click',e=>{ const t=e.target.closest('button,a[data-mlopen]'); if(!t) return; const d=t.dataset;
  if(d.mlsuch){ mlSuchen(); return; }

  if(!slAuto&&loadedSL&&canWrite&&today>=curM+'-25'&&!SL[nextMon()]){ slAuto=true; runSoll(nextMon(),true); }
  if(!calc) calc=compute();
  const all=Object.values(calc.res);
  const q=norm(M.q);
  const list=all.filter(x=>(!M.ges||x.mk.ges===M.ges)&&(!M.obj||x.mk.obj===M.obj)&&(M.st==='alle'||(M.st==='aktiv'&&x.aktiv)||(M.st==='rueck'&&x.ueber>0.5)||(M.st==='guthaben'&&x.saldo<-0.5)||(M.st==='beendet'&&!x.aktiv)||(M.st==='kaution'&&x.kOffen>0.5))

    .sort(listSort);
  const sumR=all.filter(x=>x.ueber>0.5).reduce((a,x)=>a+x.ueber,0), nR=all.filter(x=>x.ueber>0.5).length, n2=all.filter(x=>x.status==='kuendigung').length;
  const objs=[...new Set(all.map(x=>x.mk.obj))].sort((a,b)=>String(a).localeCompare(String(b),'de',{numeric:true}));

  h+='<div class="tbar"><div class="seg">'+[['alle','Alle'],['aktiv','Laufend'],['rueck','Rückstand'],['guthaben','Guthaben'],['kaution','Kaution offen'],['beendet','Beendet']].map(([k,l])=>'<button data-mst="'+k+'" class="'+(M.st===k?'on':'')+'">'+l+'</button>').join('')+'</div>'
    +'<select id="m-ges"><option value="">alle Gesellschaften</option>'+['EE','WT','KiBo'].map(g=>'<option'+(g===M.ges?' selected':'')+'>'+g+'</option>').join('')+'</select>'
    +'<select id="m-obj"><option value="">alle Objekte</option>'+objs.map(o=>'<option'+(o===M.obj?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>'
    +'<input type="search" id="m-q" placeholder="Mieter, Objekt, Einheit" value="'+esc(M.q)+'" autocomplete="off"></div>';
  const TH=(k,l,n)=>'<th class="sortable'+(n?' n':'')+((M.sk||'einheit')===k?' on':'')+'" data-msort="'+k+'" title="Sortieren">'+l+((M.sk||'einheit')===k?((M.sd||1)>0?' ↑':' ↓'):'')+'</th>';
  h+='<div class="tablewrap mlist"><table><thead><tr><th></th>'+TH('obj','Objekt')+TH('einheit','Einheit')+TH('mieter','Mieter')+TH('zahler','Zahler')+TH('von','Zeitraum')+TH('miete','Miete',1)+TH('saldo','Saldo',1)+TH('status','Status')+'</tr></thead><tbody>';
  if(!list.length) h+='<tr><td colspan="9" class="empty">Keine Mietverhältnisse für diesen Filter.</td></tr>';
  const rowH=(x,cls,vm)=>{ const mk=x.mk, sn=STN[x.status];

  h+='</tbody></table></div>';
  if(mahnOpen) h+='<div class="ov" id="ov"><div class="dlg">'+renderMahn()+'</div></div>';
  else if(modal&&calc.res[M.sel]) h+='<div class="ov" id="ov"><div class="dlg">'+renderDash(calc.res[M.sel])+'</div></div>';

/* Sortierung der Mieterliste: Klick auf Spaltenkopf, erneuter Klick dreht die Reihenfolge */

  const done=(k)=>{loaded[k]=1; invalidate(); calc=null; render();};
  db.doc('stamm/objekte').onSnapshot(s=>{ const d=s.exists?clone(s.data()):{}; objekte=d.objekte||[]; done('o'); },()=>done('o'));
  db.doc('stamm/konten').onSnapshot(s=>{ konten=(s.exists?clone(s.data()).konten:null)||[]; done('k'); },()=>done('k'));
  db.doc('stamm/regeln').onSnapshot(s=>{ regeln=(s.exists?clone(s.data()).regeln:null)||[]; done('r'); },()=>done('r'));
  db.doc('stamm/fixkosten').onSnapshot(s=>{ plan=(s.exists?clone(s.data()).plan:null)||[]; invalidate(); calc=null; render(); },()=>{});
  db.doc('stamm/verwsub').onSnapshot(s=>{ vsMap=(s.exists?clone(s.data()).map:null)||{}; invalidate(); calc=null; render(); },()=>{});
  db.doc('stamm/nahaus').onSnapshot(s=>{ const d=s.exists?clone(s.data()):{}; nhMap=d.map||{}; invalidate(); calc=null; render(); },()=>{});
  db.doc('stamm/einstellungen').onSnapshot(s=>{ einst=s.exists?clone(s.data()):{}; done('e'); },()=>done('e'));
  db.doc('stamm/mietkonten-edit').onSnapshot(s=>{ EDIT=(s.exists?clone(s.data()).e:null)||{}; calc=null; render(); },()=>{});
  db.doc('stamm/mietzuordnung').onSnapshot(s=>{ ZUORD=(s.exists?clone(s.data()).map:null)||{}; calc=null; render(); },()=>{});
  db.doc('stamm/mietkonten').onSnapshot(s=>{ mkStand=s.exists?(s.data().stand||''):''; mkUeb=s.exists?(s.data().uebernahme||''):''; render(); },()=>{});
  db.collection('buchungen').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{m[d.id]=clone(d.data());}); buch=m; done('b'); },e=>{toast('Buchungen nicht lesbar: '+e.message); done('b');});
  loadZV(); loadRegM(); loadIch();
  db.collection('mails').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{ const v=clone(d.data()); (m[v.pid]=m[v.pid]||[]).push(v); }); MAILS=m; render(); },()=>{});
  db.collection('anschreiben').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{ const v=clone(d.data()); (m[v.pid]=m[v.pid]||[]).push(v); }); ANS=m; render(); },()=>{});
  db.collection('notizen').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{ const v=clone(d.data()); (m[v.pid]=m[v.pid]||[]).push(v); }); NOTIZ=m; render(); },()=>{});
  db.doc('stamm/mahnung').onSnapshot(s=>{ MBZ=(s.exists?clone(s.data()).bz:null)||[]; render(); },()=>{});
  db.collection('mahnlaeufe').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{m[d.id]=clone(d.data());}); MAHN=m; calc=null; render(); },()=>{});
  db.collection('sollstellungen').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{m[d.id]=clone(d.data());}); SL=m; loadedSL=true; calc=null; render(); },()=>{ loadedSL=true; });
  db.collection('mietkonten').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{m[d.id]=clone(d.data());}); MK=m; loadedMK=true; calc=null; render(); },()=>{ loadedMK=true; render(); });
})();
})();
</script>
