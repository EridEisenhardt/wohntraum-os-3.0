<style>

h2{font-size:15px;margin:22px 0 8px}

table{border-collapse:collapse;width:100%;font-size:13px}

#view{overflow:visible}
.pad{max-width:1500px}

.mlist{max-height:calc(100vh - 260px);overflow:auto}

@media (max-width:1100px){ .grid2{grid-template-columns:1fr} .det{position:static;max-height:none} .mlist{max-height:none} }
select.zsel{font-size:11px;padding:2px 4px;margin-top:4px;max-width:100%}
.mlist{max-height:none}
.adot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px}.adot.big{width:16px;height:16px;vertical-align:-2px}

.ch{font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}

.kvr{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}.kvr span{color:var(--muted)}.kvr b{text-align:right;font-weight:600}
.fl{display:grid;gap:2px;font-size:12px;color:var(--muted);margin-bottom:6px}.fl input,.fl select{width:100%}

.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0 8px}.bar span{display:block;height:100%;background:var(--pos)}

.prow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.prow .pd{width:110px}.prow input[data-pt]{flex:1;min-width:160px}

</style>

<body>
<header>
  <div><h1>Mieterkonten</h1><div class="sub">Soll und Ist je Mietverhältnis ab 01.01.2025 · Grundlage für den Mahnlauf</div></div>
</header>
<div id="view"><div class="loading">Lade Daten …</div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
const MS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const KATS=[['miete','Mieteinnahme'],['sonst_ein','Sonstige Einnahme'],['bk','Betriebskosten'],['inst','Instandhaltung'],['umbau','Umbau'],['darl','Darlehen'],['obj_sonst','Sonstige Objektkosten'],['verw','Verwaltung'],['intern','Umbuchung intern'],['ruecklast','Rücklastschrift (hebt sich auf)'],['ignore','Nicht relevant'],['','– ungeklärt –']];
const KATN=Object.fromEntries(KATS);
const SUBS_UM=[['lizenzen','Software / IT / Lizenzen'],['personal','Personal Verwaltung'],['gf','Geschäftsführung – Immobilienverwaltung'],['buchhaltung','Buchhaltung / Steuerberatung laufend'],['buero','Büro / Miete / Nebenkosten'],['buerobedarf','Bürobedarf / Porto / Druckkosten'],['telefon','Telefon / Internet / Kommunikation'],['bank','Bank- und Zahlungsverkehrskosten'],['objverw','Miet- und Objektverwaltung'],['forderung','Forderungsmanagement / Mahnwesen'],['bkverw','Betriebskostenverwaltung'],['vermietung','Vermietung / Inserate / Besichtigungen'],['objbetreuung','Objektbetreuung / Kontrollen / Fahrten'],['recht','Rechts- und Gerichtskosten objektbezogen'],['versicherung','Versicherungen Verwaltung'],['kfz','KFZ']];
/* nicht umgelegt */
const SUBS_NO=[['recht_sonst','Rechtskosten nicht objektbezogen'],['steuern','Steuern der Gesellschaft'],['spende','Spenden'],['fortbildung','Fortbildung / Fachliteratur Immobilienverwaltung'],['eeprivat','EE Privat'],['kauf','Kauf & Verkauf Immobilie'],['sonstige','Sonstige (nicht umgelegt)']];
const SUBS=SUBS_UM.concat(SUBS_NO);
const SUB_ALIAS={storno:'bank',leasing:'lizenzen'}; /* alte Arten */
const subNorm=x=>SUB_ALIAS[x]||x;
const SUBN=Object.fromEntries(SUBS);
const POOLS=['EE-Allgemein','WT-Allgemein','KiBo-Allgemein','EE-Instandhaltung','WT-Instandhaltung'];
const COSTK=['bk','inst','darl','obj_sonst'];
const fmt=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const fmt0=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fnum=new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=v=>fmt.format(v||0), eur0=v=>fmt0.format(Math.round(v||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Daten aus der Datenbank sind schreibgeschützt – immer mit einer Kopie arbeiten */
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const r2=v=>Math.round((v||0)*100)/100;
const $=id=>document.getElementById(id);
function parseNum(s){ if(s==null) return null; s=String(s).trim().replace(/\s|€|EUR/g,''); if(s==='') return null;
  let neg=false; if(/-$/.test(s)){neg=true;s=s.slice(0,-1);}
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const v=Number(s); return isFinite(v)?(neg?-v:v):NaN; }
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),3000);}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim();

/* ---------- Zustand ---------- */
let db=null, downloads=null, canWrite=true, dbState='wait';
let nhMap={}, nhStand='', vsMap={}; let unitCostOpen=store('oc_ucost')==='1', objCostOpen=store('oc_ocost')==='1', ovVerwOpen=store('oc_ovv')==='1', ovCostOpen=store('oc_ovc')==='1';
let vors={items:[]}, vFilter='offen', objekte=[], konten=[], regeln=[], einst={}, buch={}, plan=[], loaded={o:0,k:0,r:0,e:0,b:0};
let year=new Date().getFullYear(), month=null; // null = ganzes Jahr
let tab=store('oc_tab')||'uebersicht', selObj=store('oc_obj')||'', bFilter={status:'alle',konto:'',q:'',sub:'',obj:'',sort:''};
let pending=[]; // geparste, noch nicht importierte Dateien
let ruleOpen=null; const touched=new Set();
let kFilter={m:'',konto:'',ges:'',dir:'',ab:'',q:''}; try{ const kf=JSON.parse(store('oc_kf')||'null'); if(kf&&typeof kf==='object') kFilter=Object.assign(kFilter,kf); }catch(e){}
function setKF(k,v){ kFilter[k]=v; store('oc_kf',JSON.stringify(kFilter)); render(); }
/* Suche und Betrag filtern die Zeilen direkt, ohne die Seite neu aufzubauen – so bleibt das Eingabefeld beim Tippen ungestört */
function applyKF(){ const info=$('kf-info'); if(!info) return; const q=norm(kFilter.q), ab=parseNum(kFilter.ab);
  let n=0, sum=0, grp=null, gn=0; const fin=()=>{ if(grp){ grp.hidden=!gn; const x=grp.querySelector('.gn'); if(x) x.textContent=gn?' · '+gn+' offen':''; } };
  document.querySelectorAll('#view tr.grp, #view tr.tx').forEach(tr=>{ if(tr.classList.contains('grp')){ fin(); grp=tr; gn=0; return; }
    const b=Number(tr.dataset.b), ok=(!q||tr.dataset.q.includes(q))&&(!(ab>0)||Math.abs(b)>=ab); tr.hidden=!ok;
    if(ok&&tr.dataset.open==='1'){ n++; sum+=b; gn++; } }); fin();

  if(editOpen){ const f=(id,l,v)=>'<label class="fl">'+l+'<input type="text" id="'+id+'" value="'+esc(v??'')+'"></label>';
    h+=f('e-mieter','Name(n)',mk.mieter)+f('e-anrede','Anrede für Briefe',mk.anrede)+f('e-email','E-Mail',mk.email!=null?mk.email:K.map(k=>k.email).filter(Boolean).join(', '))+f('e-tel','Telefon',mk.tel!=null?mk.tel:K.map(k=>k.tel).filter(Boolean).join(', '))
      +f('e-kaution','Kaution vereinbart (€)',fnum.format(mk.kaution||0))+f('e-kbez','Kaution bezahlt (€) – leer = aus Nahaus',mk.kautionBezahlt!=null&&mk.kautionBezahlt!==''?fnum.format(mk.kautionBezahlt):'')+f('e-betreuer','Betreuer',mk.betreuer)+f('e-zahler','Wer zahlt die Miete? (leer = automatisch)',mk.zahler)+f('e-ref','Verwendungszweck',mk.ref)
      +'<label class="fl">Mieterranking<select id="e-ampel"><option value="">automatisch ('+AMPEL[x.ampelAuto][1]+')</option>'+Object.entries(AMPEL).map(([k,v])=>'<option value="'+k+'"'+(mk.ampel===k?' selected':'')+'>'+({gruen:'🟢 grün',gelb:'🟡 gelb',rot:'🔴 rot'}[k])+' – '+v[1]+'</option>').join('')+'</select></label>'
      +'<div class="acts"><button class="primary small" data-esave="1">Speichern</button><button class="ghost small" data-ecancel="1">Abbrechen</button></div>';
  } else {
    h+=kv('Name',esc(mk.mieter||'–'))+kv('E-Mail',(mk.email!=null?mk.email:K.map(k=>k.email).filter(Boolean).join(', '))?esc(mk.email!=null?mk.email:K.map(k=>k.email).filter(Boolean).join(', ')):'<span class="mut">–</span>')
      +kv('Telefon',esc((mk.tel!=null?mk.tel:K.map(k=>k.tel).filter(Boolean).join(', '))||'–'))+kv('Betreuer',esc(mk.betreuer||'–'))
      +kv('Wer zahlt',esc(mk.zahler||x.zahlerAuto||'–')+(mk.zahler?'':' <span class="pill src">aus Zahlungen</span>'))
      +kv('Mieterranking',ampelDot(a)+' '+AMPEL[a][1]+(mk.ampel?' <span class="pill src">manuell</span>':' <span class="pill src" title="Automatisch aus Rückstand, Kaution und Zahlungseingang">auto</span>'))+(x.spaet?'<div class="sub">'+x.spaet+' verspätete Zahlung'+(x.spaet>1?'en':'')+' in den letzten 6 Monaten (nach dem 10.)</div>':''); }
  h+='</div>';
  /* Offene Posten */
  h+='<div class="card"><div class="ch">Offene Posten</div><div class="big '+(x.saldo>0.5?'neg':x.saldo<-0.5?'pos':'')+'">'+eur(x.saldo)+'</div><span class="pill '+sn[0]+'">'+sn[1]+'</span>'+(x.saldo<-0.5?' <span class="sub">Guthaben des Mieters</span>':'')
    +kv('Rückstand in Monatsmieten',x.miete?fnum.format(Math.max(0,x.monate)):'–')+kv('Soll ab 2025',eur(x.soll))+kv('Ist ab 2025',eur(x.ist))+kv('Saldo laut Nahaus',eur(x.nhSaldo));
  if(x.op.length) h+='<details'+(x.op.length<=4?' open':'')+'><summary>'+x.op.length+' offene Posten</summary><table class="mini">'+x.op.map(o=>'<tr><td>'+esc(dmy(o.d))+'</td><td>'+esc(o.t)+'</td><td class="n neg">'+eur(o.b)+'</td></tr>').join('')+'</table></details>';
  h+=ratenBox(x,['mietschulden','bka'])+'</div>';
  /* Kaution */
  const kv0=mk.kaution||0, man=mk.kautionBezahlt!=null&&mk.kautionBezahlt!=='', unbek=!man&&!x.kSoll&&!x.kIst, kb=man?Number(mk.kautionBezahlt):x.kIst, ko=r2(Math.max(0,kv0-kb));
  if(unbek){ h+='<div class="card"><div class="ch">Kaution<button class="ghost small" data-edit="1">Bearbeiten</button></div><div class="big">'+eur(kv0)+'</div><span class="sub">vereinbart</span>'+kv('Bezahlt','<span class="mut">unbekannt</span>')+'<div class="sub" style="margin-top:6px">In Nahaus gibt es zu dieser Kaution keine Buchung (vermutlich vor der Nahaus-Zeit gezahlt). Den bezahlten Betrag kannst du über „Bearbeiten“ eintragen.</div>'+ratenBox(x,['kaution'])+'</div>'; }
  else h+='<div class="card"><div class="ch">Kaution'+(man?' <span class="pill src">manuell</span>':'')+'</div><div class="big">'+eur(kb)+' <span class="sub">von '+eur(kv0)+'</span></div>'
    +'<div class="bar"><span style="width:'+(kv0?Math.min(100,kb/kv0*100):0)+'%"></span></div>'
    +kv('Vereinbart',eur(kv0))+kv('Bezahlt',eur(kb))+kv('Offen','<span class="'+(ko>0.5?'neg':'pos')+'">'+eur(ko)+'</span>')
    +kv('Zahlweise',(mk.kautionRaten?mk.kautionRaten+' Raten':'')+(kb>0.5&&ko>0.5?(mk.kautionRaten?' · ':'')+'<span class="pill mid">Teilzahlung</span>':ko<=0.5&&kv0?'<span class="pill ok">vollständig</span>':(mk.kautionRaten?'':'–')))+ratenBox(x,['kaution'])+'</div>';
  /* Warmmiete */
  const others=(st.others||[]);
  h+='<div class="card"><div class="ch">Warmmiete</div><div class="big">'+(st.total?eur(st.total):'–')+'</div><span class="sub">'+(st.ab?'seit '+esc(dmy(st.ab)):'')+'</span>'
    +'<details open><summary>Zusammensetzung</summary>'+kv('Kaltmiete',eur(st.kalt))+kv('Betriebskosten',eur(st.bk))+kv('Heizkosten',eur(st.hk))+(st.strom?kv('Strom',eur(st.strom)):'')+others.map(o=>kv(esc(o.t||'Sonstiges'),eur(o.b))).join('')+(!others.length&&st.sonst?kv('Sonstiges',eur(st.sonst)):'')+'</details>'
    +((x.mk.stufen||[]).length>1?'<details><summary>Mietentwicklung</summary><table class="mini">'+x.mk.stufen.map(z=>'<tr><td>ab '+esc(dmy(z.ab))+'</td><td class="n">'+eur(z.total)+'</td></tr>').join('')+'</table></details>':'')+'</div>';
  /* Notizen */
  h+='<div class="card"><div class="ch">Notizen</div><textarea id="e-notiz" rows="6" placeholder="Notizen zum Mieter …">'+esc(mk.notiz||'')+'</textarea><div class="sub">Wird automatisch gespeichert, sobald du das Feld verlässt.</div></div>';
  /* Tickets */
  const T=mk.tickets||[], to=T.filter(t=>!t.done);
  h+='<div class="card"><div class="ch">Tickets <span class="pill '+(to.length?'mid':'ok')+'">'+to.length+' offen</span></div>'
    +'<div class="trow"><input type="text" id="t-neu" placeholder="Neues Ticket, z. B. Heizung defekt"><button class="small primary" data-tadd="1">Hinzufügen</button></div>'
    +(T.filter(t=>showDone||!t.done).map(t=>'<label class="tick'+(t.done?' done':'')+'"><input type="checkbox" data-tdone="'+esc(t.id)+'"'+(t.done?' checked':'')+'><span>'+esc(t.t)+'<small>'+esc(dmy(t.d))+(t.done?' · erledigt '+esc(dmy(t.done)):'')+'</small></span></label>').join('')||'<div class="sub">Keine offenen Tickets.</div>')
    +(T.some(t=>t.done)?'<button class="ghost small" data-tshow="1">'+(showDone?'erledigte ausblenden':'erledigte anzeigen')+'</button>':'')+'</div>';
  h+='</div>'+docsBox(x);
  /* Mieterkonto */
  if(x.erg) h+='<div class="note warnbox">'+x.erg+' Monatsmiete'+(x.erg>1?'n fehlen':' fehlt')+' in Nahaus als Sollstellung und '+(x.erg>1?'wurden':'wurde')+' aus dem Mietvertrag ergänzt (kursiv).</div>';
  h+='<h3>Mieterkonto</h3><div class="tablewrap"><table class="kb"><thead><tr><th>Datum</th><th>Buchung</th><th class="n">Soll</th><th class="n">Ist</th><th class="n">Saldo</th></tr></thead><tbody>';
  const idT={}; for(const r of x.rows) if(r.id) idT[r.id]=r.t;
  for(const r of x.rows.slice().reverse()){ h+='<tr class="'+(r.e?'erg':'')+(r.fut?' fut':'')+(r.k?' kaut':'')+'"><td>'+esc(dmy(r.d))+'</td><td class="wrapc">'+esc(r.t)+'<div class="sub">'+esc(r.src)+(r.fut?' · fällig ab '+esc(dmy(r.d))+', zählt noch nicht im Saldo':'')+(r.k?' · Kaution (getrennt)':'')+(r.man?' · manuell zugeordnet':'')+(r.alloc&&r.alloc.length?' · zugeordnet auf: '+r.alloc.map(q=>esc(idT[q.id]||'Posten')+' '+eur(q.b)).join(', '):'')+(r.s&&r.offen!=null&&!r.fut?(r.offen>0.005?(r.offen<r.s-0.005?' · teilweise bezahlt, offen '+eur(r.offen):' · offen'):' · bezahlt'):'')+'</div>'+(r.key?zuordSel(r,x.mk):'')+'</td><td class="n">'+(r.s?eur(r.s):'')+'</td><td class="n pos">'+(r.h?eur(r.h):'')+'</td><td class="n">'+(r.saldo==null?'':'<b class="'+(r.saldo>0.5?'neg':'')+'">'+eur(r.saldo)+'</b>')+'</td></tr>'; }
  h+='</tbody></table></div><div class="sub" style="margin-top:6px">Neueste Buchungen oben.</div>';
  return h; }
function zuordSel(r,mk0){ const L=Object.values(MK).filter(m=>m.unit===r.unit||m.obj===mk0.obj).sort((a,b)=>(b.von||'').localeCompare(a.von||''));
  return '<select class="zsel" data-zkey="'+esc(r.key)+'" title="Zahlung einem anderen Mietverhältnis zuordnen"><option value="">andere Zuordnung …</option>'+L.filter(m=>m.pid!==mk0.pid).map(m=>'<option value="'+esc(m.pid)+'">'+esc(m.obj+' '+(m.einheit||'')+' · '+(ed(m).mieter||'')+' ('+dmy(m.von)+(m.bis?'–'+dmy(m.bis):'')+')')+'</option>').join('')+'<option value="-">keinem Mieter zuordnen</option>'+(r.man?'<option value="~">automatische Zuordnung wiederherstellen</option>':'')+'</select>'; }
function importCard(big){ return '<div class="note'+(big?'':' small')+'"><b>'+(big?'Mietverträge und Sollstellungen übernehmen':'Daten aus Nahaus aktualisieren')+'</b><div style="margin:6px 0">Import-Datei <code>mietkonten_import.json</code> auswählen (erstellt Claude aus Nahaus).</div><input type="file" id="mk-file" accept=".json"> <span id="mk-st" class="sub"></span></div>'; }

/* ---------- Ereignisse ---------- */
document.addEventListener('click',async e=>{ const t=e.target.closest('button,tr.click,a[data-dopen]'); if(!t) return;
  if(t.dataset.dopen){ e.preventDefault(); const [f,n]=t.dataset.dopen.split('|'); const mk=MK[M.sel]; const {data,error}=await window.osSupabase.storage.from('mieterakten').createSignedUrl(docBase(mk)+'/'+enc(f)+'/'+n,3600); if(error){ toast(error.message); return; } window.open(data.signedUrl,'_blank'); return; }
  if(t.dataset.mk){ M.sel=t.dataset.mk; editOpen=false; modal=true; showDone=false; saveM(); render(); return; }
  if(t.dataset.zvopen){ (window.top||window).location.href='/vermietung/zahlungsvereinbarung-register'; return; }
  if(t.dataset.zvnew){ (window.top||window).location.href='/vermietung/zahlungsvereinbarung'; return; }
  if(t.dataset.zvdel){ saveEdit(M.sel,{raten:(ed(MK[M.sel]).raten||[]).filter(i=>i!==t.dataset.zvdel)},'Verknüpfung gelöst.'); return; }
  if(t.dataset.ftog){ const k=M.sel+'|'+t.dataset.ftog; const D=DOCS[M.sel]||{}; docOpen[k]=!(docOpen[k]??((D[t.dataset.ftog]||[]).length>0)); render(); return; }
  if(t.dataset.pcancel){ pend=null; render(); return; }
  if(t.dataset.pup){ uploadPend(); return; }
  if(t.dataset.ddel){ if(t.dataset.sure!=='1'){ t.dataset.sure='1'; t.textContent='Wirklich löschen?'; return; } const [f,n]=t.dataset.ddel.split('|'); const mk=MK[M.sel]; window.osSupabase.storage.from('mieterakten').remove([docBase(mk)+'/'+enc(f)+'/'+n]).then(()=>{ toast('Datei gelöscht.'); loadDocs(mk); }); return; }
  if(t.dataset.slrun){ runSoll(nextMon(),false); return; }
  if(t.dataset.slre){ if(t.dataset.sure!=='1'){ t.dataset.sure='1'; t.textContent='Wirklich neu erstellen?'; return; } runSoll(nextMon(),false); return; }
  if(t.dataset.close){ modal=false; editOpen=false; render(); return; }
  if(t.dataset.tshow){ showDone=!showDone; render(); return; }
  if(t.dataset.tadd){ const v=($('t-neu').value||'').trim(); if(!v){ toast('Bitte einen Text eingeben.'); return; } const T=(ed(MK[M.sel]).tickets||[]).concat([{id:'t'+Date.now().toString(36),t:v,d:today}]); saveEdit(M.sel,{tickets:T},'Ticket angelegt.'); return; }
  if(t.dataset.mst){ M.st=t.dataset.mst; saveM(); render(); return; }
  if(t.dataset.edit){ editOpen=true; render(); return; }
  if(t.dataset.ecancel){ editOpen=false; render(); return; }
  if(t.dataset.esave){ const g=id=>$(id).value.trim(); editOpen=false; const kz=parseNum(g('e-kaution')), kbz=parseNum(g('e-kbez')); saveEdit(M.sel,{kaution:(kz==null||isNaN(kz))?(ed(MK[M.sel]).kaution||0):kz,kautionBezahlt:(kbz==null||isNaN(kbz))?'':kbz,mieter:g('e-mieter'),anrede:g('e-anrede'),email:g('e-email'),tel:g('e-tel'),betreuer:g('e-betreuer'),zahler:g('e-zahler'),ref:g('e-ref'),ampel:$('e-ampel').value},'Mieterdaten gespeichert.'); return; } });
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{ const d=e.target.closest&&e.target.closest('[data-fdrop]'); if(d&&e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files')){ e.preventDefault(); document.querySelectorAll('.fold.over').forEach(x=>x!==d&&x.classList.remove('over')); d.classList.add('over'); } }));
document.addEventListener('dragleave',e=>{ const d=e.target.closest&&e.target.closest('[data-fdrop]'); if(d&&!d.contains(e.relatedTarget)) d.classList.remove('over'); });
document.addEventListener('drop',e=>{ const d=e.target.closest&&e.target.closest('[data-fdrop]'); if(!d||!e.dataTransfer||!e.dataTransfer.files.length) return; e.preventDefault(); d.classList.remove('over'); queueFiles(MK[M.sel],d.dataset.fdrop,e.dataTransfer.files); });
document.addEventListener('mousedown',e=>{ if(e.target.id==='ov'){ modal=false; editOpen=false; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&modal){ modal=false; editOpen=false; render(); } if(e.key==='Enter'&&e.target.id==='t-neu'){ const b=document.querySelector('[data-tadd]'); if(b) b.click(); } });
document.addEventListener('change',async e=>{ const t=e.target;
  if(t.dataset.zvadd){ if(!t.value) return; saveEdit(M.sel,{raten:(ed(MK[M.sel]).raten||[]).concat([t.value])},'Ratenzahlung verknüpft.'); return; }
  if(t.dataset.fup){ queueFiles(MK[M.sel],t.dataset.fup,t.files); t.value=''; return; }
  if(t.dataset.pf!==undefined){ pend.files[Number(t.dataset.pf)].folder=t.value; return; }
  if(t.dataset.pdt!==undefined){ pend.files[Number(t.dataset.pdt)].datum=t.value.trim(); render(); return; }
  if(t.dataset.pt!==undefined){ pend.files[Number(t.dataset.pt)].titel=t.value.trim(); render(); return; }
  if(t.id==='e-notiz'){ saveEdit(M.sel,{notiz:t.value},'Notiz gespeichert.'); return; }
  if(t.dataset.tdone){ const T=(ed(MK[M.sel]).tickets||[]).map(x=>x.id===t.dataset.tdone?Object.assign({},x,{done:t.checked?today:''}):x); saveEdit(M.sel,{tickets:T},t.checked?'Ticket erledigt.':'Ticket wieder offen.'); return; }
  if(t.dataset.zkey){ const v=t.value; if(!v) return; const z=Object.assign({},ZUORD); if(v==='~') delete z[t.dataset.zkey]; else z[t.dataset.zkey]=v; ZUORD=z; calc=null; render(); saveStamm('mietzuordnung',{map:ZUORD}).then(()=>toast(v==='-'?'Zahlung keinem Mieter zugeordnet.':'Zahlung umgebucht.')); return; }
  if(t.id==='m-alle'){ M.alle=t.checked; calc=null; render(); return; }
  if(t.id==='m-ges'){ M.ges=t.value; saveM(); render(); return; }
  if(t.id==='m-obj'){ M.obj=t.value; saveM(); render(); return; }
  if(t.id==='mk-file'){ const f=t.files[0]; if(!f) return; const st=$('mk-st');
    try{ const n=await window.osImportFile(f,x=>st.textContent=x); st.textContent='✅ '+n+' Dokumente übernommen.'; toast('Mieterkonten aktualisiert.'); }catch(err){ st.textContent='❌ '+(err.message||err); } } });
document.addEventListener('input',e=>{ if(e.target.id==='m-q'){ M.q=e.target.value; clearTimeout(window.__mq); window.__mq=setTimeout(render,180); } });

/* ---------- Start ---------- */
render();
(async()=>{
  try{ db=await claude.use('db'); }catch(e){ db=null; }
  if(!db){ dbState='none'; render(); return; }
  const done=(k)=>{loaded[k]=1; invalidate(); calc=null; render();};
  db.doc('stamm/objekte').onSnapshot(s=>{ const d=s.exists?clone(s.data()):{}; objekte=d.objekte||[]; done('o'); },()=>done('o'));
  db.doc('stamm/konten').onSnapshot(s=>{ konten=(s.exists?clone(s.data()).konten:null)||[]; done('k'); },()=>done('k'));
  db.doc('stamm/regeln').onSnapshot(s=>{ regeln=(s.exists?clone(s.data()).regeln:null)||[]; done('r'); },()=>done('r'));
  db.doc('stamm/fixkosten').onSnapshot(s=>{ plan=(s.exists?clone(s.data()).plan:null)||[]; invalidate(); calc=null; render(); },()=>{});
  db.doc('stamm/verwsub').onSnapshot(s=>{ vsMap=(s.exists?clone(s.data()).map:null)||{}; invalidate(); calc=null; render(); },()=>{});
  db.doc('stamm/nahaus').onSnapshot(s=>{ const d=s.exists?clone(s.data()):{}; nhMap=d.map||{}; invalidate(); calc=null; render(); },()=>{});
  db.doc('stamm/einstellungen').onSnapshot(s=>{ einst=s.exists?clone(s.data()):{}; done('e'); },()=>done('e'));
  db.doc('stamm/mietkonten-edit').onSnapshot(s=>{ EDIT=(s.exists?clone(s.data()).e:null)||{}; calc=null; render(); },()=>{});
  db.doc('stamm/mietzuordnung').onSnapshot(s=>{ ZUORD=(s.exists?clone(s.data()).map:null)||{}; calc=null; render(); },()=>{});
  db.doc('stamm/mietkonten').onSnapshot(s=>{ mkStand=s.exists?(s.data().stand||''):''; render(); },()=>{});
  db.collection('buchungen').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{m[d.id]=clone(d.data());}); buch=m; done('b'); },e=>{toast('Buchungen nicht lesbar: '+e.message); done('b');});
  loadZV();
  db.collection('sollstellungen').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{m[d.id]=clone(d.data());}); SL=m; loadedSL=true; calc=null; render(); },()=>{ loadedSL=true; });
  db.collection('mietkonten').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{m[d.id]=clone(d.data());}); MK=m; loadedMK=true; calc=null; render(); },()=>{ loadedMK=true; render(); });
})();
})();
</script>
