<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postfach</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f5f8;--card:#ffffff;--ink:#18202c;--muted:#5f6b7a;--line:#e0e5eb;--soft:#eef1f5;--accent:#2f5d8a;--accent-ink:#ffffff;--accent-soft:#e3ecf5;
  --pos:#1d7a4c;--pos-bg:#e5f4ec;--neg:#b42318;--neg-bg:#fcebe9;--warn:#946200;--warn-bg:#fff4d6;--chip:#edf1f6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;cursor:pointer;min-height:34px;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{font-size:12.5px;padding:3px 9px;min-height:28px}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.warn{color:var(--neg)}
button:disabled{opacity:.55;cursor:default}
.app{display:flex;flex-direction:column;height:100vh}
.kopf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
h1{font-size:20px;font-weight:800}
.sub{color:var(--muted);font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.haupt{flex:1;display:grid;grid-template-columns:230px 390px 1fr;min-height:0}
.spalte{min-height:0;overflow:auto;border-right:1px solid var(--line)}
.ordner{padding:8px}
.ord{display:flex;justify-content:space-between;gap:6px;width:100%;text-align:left;border:0;background:transparent;border-radius:7px;padding:6px 8px;min-height:30px}
.ord:hover{background:var(--soft)}.ord.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ord .n{font-weight:700;color:var(--accent)}
.liste{background:var(--card);display:flex;flex-direction:column}
.lkopf{padding:8px;border-bottom:1px solid var(--line);display:grid;gap:6px;position:sticky;top:0;background:var(--card);z-index:2}
.inp{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:7px 10px}
.zeile{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.zeile:hover{background:var(--soft)}.zeile.on{background:var(--accent-soft)}
.zeile.ungelesen .wer,.zeile.ungelesen .betr{font-weight:700}
.zeile.ungelesen{box-shadow:inset 3px 0 0 var(--accent)}
.z1{display:flex;justify-content:space-between;gap:8px}
.wer{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dat{font-size:12px;color:var(--muted);white-space:nowrap}
.betr{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vor{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;padding:0 6px;border-radius:999px;background:var(--chip);color:var(--muted);margin-right:4px}
.tag.rot{background:var(--neg-bg);color:var(--neg)}.tag.gelb{background:var(--warn-bg);color:var(--warn)}
.lesen{min-height:0;overflow:auto;padding:14px 18px}
.mk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.mk h2{font-size:18px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:44px 1fr;gap:2px 8px;font-size:13px}.kv span:nth-child(odd){color:var(--muted)}
.anh{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.anh button{font-size:12.5px}
iframe.body{width:100%;border:0;background:#fff;border-radius:8px;min-height:200px;display:block}
.leer{color:var(--muted);text-align:center;padding:40px 10px}
.fl{display:grid;gap:3px;font-size:12px;color:var(--muted);margin-bottom:8px}
.fl input,.fl textarea{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:14px;color:var(--ink)}
textarea{resize:vertical;min-height:240px;line-height:1.45}
.g2{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--chip);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px;margin:0 6px 6px 0}
.chip button{min-height:22px;padding:0 7px;border:0;background:transparent;color:var(--muted)}
.picker{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:var(--soft)}
.pl{max-height:260px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:6px}
.pl label{display:flex;gap:8px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.pl .ph{padding:5px 8px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;background:var(--soft)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px}
.info{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
label.up{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 11px;background:var(--card);cursor:pointer;font-size:13px;min-height:34px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:120;max-width:90vw}.toast.on{opacity:1}
.mobil{display:none}
@media(max-width:1100px){.haupt{grid-template-columns:330px 1fr}.ordner{display:none}.mobil{display:block}.spalte.os{display:none}}
@media(max-width:760px){.haupt{grid-template-columns:1fr}.haupt.lesemodus .liste{display:none}.haupt:not(.lesemodus) .lesen{display:none}.g2{grid-template-columns:1fr}}
</style></head><body>
<div class="app" id="app"><div class="leer">Lädt …</div></div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const p2=n=>String(n).padStart(2,'0');
const NUTZER={'ramona@andersmacher.info':'Ramona Romanelli','juergen@andersmacher.info':'Jürgen Reuter','eric@andersmacher.info':'Eric Eisenhardt'};
const WK_REIHE=['inbox','drafts','sentitems','archive','deleteditems','junkemail','outbox'];
let POSTFACH='',ORD=[],AKT='',MAILS=[],WEITER='',SUCHE='',UEBERALL=false,SEL=null,AUSW=new Set(),C=null,BUSY='',ICH='',FEHLER='';
let MK=[],MKE={},MKGELADEN=false,AKTE={};

function toast(t,ms){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),ms||3800);}
async function token(){const {data}=await sb.auth.getSession();return data&&data.session?data.session.access_token:'';}
async function api(pfad,body){let r;try{r=await fetch(pfad,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await token()},body:JSON.stringify(body)});}catch(e){throw new Error('Dienst nicht erreichbar.');}
  let j=null;try{j=await r.json();}catch(e){}if(!j)throw new Error(r.status===404?'Die Schnittstelle ist noch nicht online.':'Dienst nicht erreichbar ('+r.status+').');if(j.error)throw new Error(j.error);return j;}
const pf=b=>api('/api/postfach',b);
function datum(d){if(!d)return '';const x=new Date(d),h=new Date();if(x.toDateString()===h.toDateString())return p2(x.getHours())+':'+p2(x.getMinutes());
  const g=new Date(h);g.setDate(h.getDate()-6);if(x>g)return x.toLocaleDateString('de-DE',{weekday:'short'})+' '+p2(x.getHours())+':'+p2(x.getMinutes());return p2(x.getDate())+'.'+p2(x.getMonth()+1)+'.'+String(x.getFullYear()).slice(2);}
const zeitLang=d=>d?new Date(d).toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const person=a=>a?(a.name&&a.name!==a.mail?a.name+' <'+a.mail+'>':a.mail):'';
const personKurz=a=>a?(a.name||a.mail):'';
const ordVon=id=>ORD.find(o=>o.id===id)||null;
const akt=()=>ordVon(AKT)||{};
const groesse=n=>n>1048576?(n/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(n/1024))+' KB';
const signatur=()=>'\n\nMit freundlichen Grüßen\n\nWohn(T)raum Rheinhessen GmbH\nbewusst sozial engagiert\nE-Mail: hausverwaltung@andersmacher.info\nTelefon: 06133-9382937\nDalheimer Str. 70, 55278 Dexheim\nHRB 45997, Amtsgericht Mainz\nGeschäftsführer: Eric Eisenhardt';

/* ---------- Ordner ---------- */
function ordnerSortiert(){const top=ORD.filter(o=>!o.eltern||!ordVon(o.eltern));const out=[];
  const sortiere=L=>L.slice().sort((a,b)=>{const ia=WK_REIHE.indexOf(a.wk),ib=WK_REIHE.indexOf(b.wk);if(ia>=0||ib>=0)return (ia<0?99:ia)-(ib<0?99:ib);return a.name.localeCompare(b.name,'de');});
  const geh=(L,t)=>sortiere(L).forEach(o=>{out.push({o,t});geh(ORD.filter(x=>x.eltern===o.id),t+1);});geh(top,0);return out;}
const ordLabel=o=>{const p=[];let x=o;while(x){p.unshift(x.name);x=ordVon(x.eltern);}return p.join(' / ');};
async function ordnerLaden(){const r=await pf({aktion:'ordner'});POSTFACH=r.postfach;ORD=r.ordner||[];if(!AKT){const i=ORD.find(o=>o.wk==='inbox');AKT=i?i.id:(ORD[0]||{}).id||'';}}

/* ---------- Liste ---------- */
async function listeLaden(mehr){BUSY=mehr?'mehr':'liste';render();
  try{const r=await pf(mehr?{aktion:'liste',weiter:WEITER}:{aktion:'liste',ordner:AKT,suche:SUCHE,ueberall:UEBERALL});
    MAILS=mehr?MAILS.concat(r.mails||[]):(r.mails||[]);WEITER=r.weiter||'';FEHLER='';}
  catch(e){FEHLER=e.message||String(e);}
  BUSY='';render();}
async function aktualisieren(still){try{await ordnerLaden();}catch(e){if(!still)FEHLER=e.message;}
  if(still){if(!SUCHE&&!BUSY&&!C&&!AUSW.size&&MAILS.length<=50){try{const r=await pf({aktion:'liste',ordner:AKT});MAILS=r.mails||[];WEITER=r.weiter||'';}catch(e){}}
    if(!C)render();return;}
  await listeLaden();}
const istGesendet=()=>['sentitems','drafts','outbox'].includes(akt().wk);

/* ---------- Lesen ---------- */
async function oeffnen(id){C=null;SEL={id,lade:true};render();
  try{const r=await pf({aktion:'lesen',id});SEL=r.mail;const m=MAILS.find(x=>x.id===id);if(m&&!m.gelesen){m.gelesen=true;const o=akt();if(o.ungelesen)o.ungelesen--;}}
  catch(e){SEL={id,fehler:e.message||String(e)};}
  render();}
function koerperEinsetzen(){const f=document.getElementById('mbody');if(!f||!SEL||!SEL.html)return;
  f.srcdoc='<!DOCTYPE html><html><head><meta charset="utf-8"><base target="_blank"><style>body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#18202c;margin:12px;word-wrap:break-word}img{max-width:100%;height:auto}</style></head><body>'+SEL.html+'</body></html>';
  f.onload=()=>{try{f.style.height=(f.contentDocument.documentElement.scrollHeight+20)+'px';}catch(e){f.style.height='70vh';}};}
async function anhangOeffnen(aid){const a=(SEL.anhaenge||[]).find(x=>x.id===aid);const w=window.open('','_blank');
  try{const r=await pf({aktion:'anhang',id:SEL.id,aid});const bin=atob(r.daten),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:r.typ}));
    if(/pdf|image|text/.test(r.typ)&&w){w.location.href=url;}else{if(w)w.close();const l=document.createElement('a');l.href=url;l.download=r.name||(a&&a.name)||'Anhang';document.body.appendChild(l);l.click();l.remove();}}
  catch(e){if(w)w.close();toast(e.message||String(e));}}

/* ---------- Aktionen auf Mails ---------- */
async function aufMails(aktion,extra,liste){if(BUSY)return;const L=liste||(AUSW.size?[...AUSW]:SEL&&SEL.id?[SEL.id]:[]);if(!L.length)return;
  BUSY='akt';render();
  try{await pf(Object.assign({aktion,ids:L},extra||{}));
    if(aktion==='verschieben'||aktion==='loeschen'){MAILS=MAILS.filter(m=>!L.includes(m.id));if(SEL&&L.includes(SEL.id))SEL=null;AUSW.clear();
      toast(aktion==='loeschen'?(L.length+' gelöscht.'):(L.length+' verschoben.'));}
    else{for(const m of MAILS)if(L.includes(m.id)){if(extra.gelesen!=null)m.gelesen=extra.gelesen;if(extra.markiert!=null)m.markiert=extra.markiert;}
      if(SEL&&L.includes(SEL.id)){if(extra.gelesen!=null)SEL.gelesen=extra.gelesen;if(extra.markiert!=null)SEL.markiert=extra.markiert;}}
    ordnerLaden().then(render).catch(()=>{});}
  catch(e){toast(e.message||String(e),8000);}
  BUSY='';render();}
function zielWaehlen(wert){const o=ORD.find(x=>ordLabel(x)===wert);if(!o){toast('Bitte einen Ordner aus der Liste wählen.');return;}aufMails('verschieben',{ziel:o.id});}

/* ---------- Schreiben ---------- */
function neueMail(modus,vorlage){const m=SEL&&SEL.id&&!SEL.lade?SEL:null;C={modus:modus||'neu',bezug:modus&&modus!=='neu'&&m?m.id:'',an:'',cc:'',bcc:'',bccZeigen:false,betreff:'',text:signatur(),anh:[],picker:false,pq:'',pmk:'',pwahl:{}};
  if(m&&modus!=='neu'){const re=/^(aw|re|wg|fw|fwd):/i;
    if(modus==='antworten'){C.an=((m.antwortAn&&m.antwortAn.length?m.antwortAn:[m.von])).map(a=>a.mail).join(', ');C.betreff=(re.test(m.betreff)?'':'AW: ')+m.betreff;}
    if(modus==='allen'){const ich=POSTFACH.toLowerCase();C.an=[...new Set(((m.antwortAn&&m.antwortAn.length?m.antwortAn:[m.von])).concat(m.an).map(a=>a.mail).filter(x=>x&&x!==ich))].join(', ');C.cc=(m.cc||[]).map(a=>a.mail).filter(x=>x&&x!==ich).join(', ');C.betreff=(re.test(m.betreff)?'':'AW: ')+m.betreff;}
    if(modus==='weiterleiten'){C.betreff=(re.test(m.betreff)?'':'WG: ')+m.betreff;}}
  if(vorlage)Object.assign(C,vorlage);render();setTimeout(()=>{const i=document.getElementById(C.an?'c-text':'c-an');if(i){i.focus();if(i.id==='c-text')i.setSelectionRange(0,0);}},60);}
async function geraetAnhaenge(files){for(const f of files){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const pfad='mailanhaenge/'+id+'/'+f.name.replace(/[^\w.\- ]/g,'_');const e={typ:'speicher',bucket:'uebergaben',pfad,name:f.name,contentType:f.type||'application/octet-stream',groesse:f.size,lade:true};C.anh.push(e);render();
    const {error}=await sb.storage.from('uebergaben').upload(pfad,f,{contentType:e.contentType,upsert:true});
    if(error){C.anh=C.anh.filter(x=>x!==e);toast(f.name+': '+error.message);}else e.lade=false;render();}}
async function senden(){if(!C||BUSY)return;if(C.anh.some(a=>a.lade)){toast('Anhänge werden noch hochgeladen.');return;}
  if(!C.an.trim()){toast('Bitte einen Empfänger eintragen.');return;}
  BUSY='senden';render();
  try{await pf({aktion:'senden',modus:C.modus,bezug:C.bezug,an:C.an,cc:C.cc,bcc:C.bcc,betreff:C.betreff,text:C.text,anhaenge:C.anh.map(a=>a.typ==='onedrive'?{typ:'onedrive',id:a.id}:{typ:'speicher',bucket:a.bucket,pfad:a.pfad,name:a.name,contentType:a.contentType})});
    for(const a of C.anh)if(a.typ==='speicher'&&a.bucket==='uebergaben'&&a.pfad.startsWith('mailanhaenge/'))sb.storage.from('uebergaben').remove([a.pfad]).catch(()=>{});
    C=null;BUSY='';toast('Mail gesendet.');render();ordnerLaden().then(render).catch(()=>{});if(istGesendet())listeLaden();}
  catch(e){BUSY='';render();toast('Senden fehlgeschlagen: '+(e.message||e),10000);}}

/* KI: nur den Text vor der Signatur verbessern, Signatur bleibt */
function kiTeilen(t){const i=t.indexOf('Mit freundlichen Grüßen');return i>=0?[t.slice(0,i).trim(),t.slice(i)]:[t.trim(),''];}
const htmlZuText=h=>{try{const d=new DOMParser().parseFromString(String(h||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|tr|li|h\d)>/gi,'$&\n'),'text/html');d.querySelectorAll('style,script').forEach(x=>x.remove());return (d.body.textContent||'').replace(/\n{3,}/g,'\n\n').trim();}catch(e){return '';}};
async function kiMail(){if(!C||BUSY)return;const [body,sig]=kiTeilen(C.text);if(!body){toast('Bitte zuerst Stichworte oder einen Entwurf eingeben.');return;}
  BUSY='ki';render();
  try{const bez=C.modus!=='neu'&&SEL&&SEL.id===C.bezug&&SEL.html?htmlZuText(SEL.html):'';
    const r=await api('/api/ki',{aufgabe:'mail',text:body,kontext:{empfaenger:C.an,betreff:C.betreff,bezug:bez}});
    C.kiAlt={text:C.text,betreff:C.betreff};C.text=String(r.text||'').trim()+(sig?'\n\n'+sig:'');if(r.betreff)C.betreff=r.betreff;}
  catch(e){toast('KI: '+(e.message||e),8000);}
  BUSY='';render();}
/* Anhänge aus dem Mieterordner (OneDrive) */
async function mieterLaden(){if(MKGELADEN)return;MKGELADEN=true;
  const [mk,me]=await Promise.all([sb.from('os_docs').select('pid:data->>pid,obj:data->>obj,einheit:data->>einheit,von:data->>von,bis:data->>bis,mieter:data->>mieter,kontakte:data->kontakte').eq('app','oc').like('pfad','mietkonten/%'),
    sb.from('os_docs').select('data').eq('app','oc').eq('pfad','stamm/mietkonten-edit').maybeSingle()]);
  MK=(mk.data||[]).filter(m=>m.pid);MKE=(me.data&&me.data.data&&me.data.data.e)||{};render();}
const mkName=m=>(MKE[m.pid]||{}).mieter||m.mieter||'';
const mkLabel=m=>(m.obj||'')+' '+(m.einheit||'')+' – '+mkName(m)+((MKE[m.pid]||{}).bis||m.bis?' (bis '+String((MKE[m.pid]||{}).bis||m.bis).slice(0,10).split('-').reverse().join('.')+')':'');
function mkMails(m){const e=MKE[m.pid]||{};const s=e.email!=null&&e.email!==''?String(e.email):(m.kontakte||[]).map(k=>k.email).filter(Boolean).join(',');return s.split(/[,;\s]+/).map(x=>x.trim()).filter(x=>/@/.test(x));}
async function akteLaden(pid){const m=MK.find(x=>x.pid===pid);const od=m&&(MKE[pid]||{}).od;if(!od){AKTE[pid]={fehler:'Für diesen Mieter ist kein OneDrive-Mieterordner zugeordnet.'};render();return;}
  AKTE[pid]='lade';render();try{AKTE[pid]=await api('/api/onedrive',{aktion:'akte',pfad:od});}catch(e){AKTE[pid]={fehler:e.message||String(e)};}render();}
function pickerHtml(){const pid=C.pmk;let h='<div class="picker"><div class="g2"><label class="fl">Mieter<input id="c-pmk" list="dl-mk" placeholder="Name, Objekt oder Einheit eintippen …" value="'+esc(pid?mkLabel(MK.find(m=>m.pid===pid)||{}):'')+'" autocomplete="off"></label>'
    +'<label class="fl">Datei suchen<input id="c-pq" value="'+esc(C.pq)+'" placeholder="z. B. Mietvertrag" autocomplete="off"></label></div>'
    +'<datalist id="dl-mk">'+MK.slice().sort((a,b)=>mkLabel(a).localeCompare(mkLabel(b),'de')).map(m=>'<option value="'+esc(mkLabel(m))+'">').join('')+'</datalist>';
  if(!MKGELADEN)mieterLaden();
  if(pid){const A=AKTE[pid];if(!A)akteLaden(pid);
    if(!A||A==='lade')h+='<div class="sub">Mieterordner wird geladen …</div>';else if(A.fehler)h+='<div class="note" style="margin:6px 0">'+esc(A.fehler)+'</div>';
    else{const q=C.pq.trim().toLowerCase();const gruppen=[['Hauptordner',A.dateien||[]]].concat(Object.keys(A.ordner||{}).sort((a,b)=>a.localeCompare(b,'de')).map(k=>[k,A.ordner[k]]));
      let n=0;h+='<div class="pl">';for(const [g,L] of gruppen){const F=L.filter(f=>!q||f.name.toLowerCase().includes(q)||g.toLowerCase().includes(q));if(!F.length)continue;
        h+='<div class="ph">'+esc(g)+'</div>'+F.map(f=>{n++;return '<label><input type="checkbox" data-pw="'+esc(f.id)+'" data-pn="'+esc(f.name)+'" data-ps="'+(f.size||0)+'"'+(C.pwahl[f.id]?' checked':'')+'> <span style="flex:1">'+esc(f.name)+'</span><span class="sub">'+groesse(f.size||0)+'</span></label>';}).join('');}
      h+=(n?'':'<div class="sub" style="padding:8px">Keine Dateien gefunden.</div>')+'</div>';}}
  return h+'<div class="acts" style="margin-top:8px"><button class="small primary" data-a="pickok">Ausgewählte anhängen</button><button class="small ghost" data-a="pickzu">Schließen</button></div></div>';}

/* ---------- Darstellung ---------- */
function render(){const app=document.getElementById('app');const fokus=document.activeElement,fid=fokus&&fokus.id,fpos=fokus&&fokus.selectionStart;
  const lsc=(document.getElementById('lspalte')||{}).scrollTop||0,rsc=(document.getElementById('rspalte')||{}).scrollTop||0;
  const o=akt();
  let h='<div class="kopf"><div><h1>Postfach</h1><div class="sub">'+esc(POSTFACH||'')+' · wie in Outlook</div></div><div class="acts">'
    +'<div class="mobil"><input class="inp" id="ord-mobil" list="dl-ord" style="width:240px" placeholder="Ordner wählen …" value="'+esc(o.name||'')+'" autocomplete="off"></div>'
    +'<button class="primary" data-a="neu">Neue Mail</button><button data-a="refresh"'+(BUSY?' disabled':'')+'>Aktualisieren</button></div></div>';
  h+='<datalist id="dl-ord">'+ordnerSortiert().map(({o})=>'<option value="'+esc(ordLabel(o))+'">').join('')+'</datalist>';
  h+='<div class="haupt'+(SEL||C?' lesemodus':'')+'">';
  // Ordner
  h+='<div class="spalte os"><div class="ordner">'+ordnerSortiert().map(({o:x,t})=>'<button class="ord'+(x.id===AKT?' on':'')+'" data-ord="'+esc(x.id)+'" style="padding-left:'+(8+t*14)+'px"><span>'+esc(x.name)+'</span>'+(x.ungelesen&&x.wk!=='sentitems'&&x.wk!=='deleteditems'?'<span class="n">'+x.ungelesen+'</span>':(x.wk==='drafts'&&x.gesamt?'<span class="sub">'+x.gesamt+'</span>':''))+'</button>').join('')+'</div></div>';
  // Liste
  h+='<div class="spalte liste" id="lspalte"><div class="lkopf"><input class="inp" type="search" id="suche" placeholder="Suchen in '+esc(UEBERALL?'allen Ordnern':(o.name||'Ordner'))+' …" value="'+esc(SUCHE)+'" autocomplete="off">'
    +'<div class="acts"><label class="sub" style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="ueberall"'+(UEBERALL?' checked':'')+'> alle Ordner</label>'
    +(AUSW.size?'<span class="sub">'+AUSW.size+' ausgewählt</span><button class="small" data-a="gel">Gelesen</button><button class="small" data-a="ungel">Ungelesen</button><button class="small" data-a="mark">Markieren</button><button class="small warn" data-a="del">Löschen</button><input class="inp" list="dl-ord" id="ziel-l" placeholder="Verschieben nach …" style="width:170px;padding:4px 8px" autocomplete="off"><button class="small ghost" data-a="auswnone">Auswahl aufheben</button>':'<button class="small ghost" data-a="auswall">Alle auswählen</button>')
    +'</div></div>';
  if(FEHLER)h+='<div class="note">'+esc(FEHLER)+'</div>';
  if(BUSY==='liste'&&!MAILS.length)h+='<div class="leer">Lädt …</div>';
  else if(!MAILS.length&&!FEHLER)h+='<div class="leer">'+(SUCHE?'Keine Treffer.':'Dieser Ordner ist leer.')+'</div>';
  const ges=istGesendet()&&!SUCHE;
  h+=MAILS.map(m=>'<div class="zeile'+(m.gelesen?'':' ungelesen')+(SEL&&SEL.id===m.id?' on':'')+'" data-mail="'+esc(m.id)+'"><input type="checkbox" data-ausw="'+esc(m.id)+'"'+(AUSW.has(m.id)?' checked':'')+'><div style="min-width:0">'
    +'<div class="z1"><span class="wer">'+esc(ges?('An: '+m.an.map(personKurz).join(', ')):personKurz(m.von)||'(unbekannt)')+'</span><span class="dat">'+datum(m.datum)+'</span></div>'
    +'<div class="betr">'+(m.entwurf?'<span class="tag rot">Entwurf</span>':'')+(m.markiert?'<span class="tag gelb">markiert</span>':'')+(m.wichtig?'<span class="tag rot">wichtig</span>':'')+(m.anhang?'<span class="tag">Anhang</span>':'')+esc(m.betreff||'(kein Betreff)')+'</div>'
    +'<div class="vor">'+esc(m.vorschau)+'</div></div></div>').join('');
  if(WEITER)h+='<div style="padding:10px;text-align:center"><button data-a="mehr"'+(BUSY?' disabled':'')+'>'+(BUSY==='mehr'?'Lädt …':'Weitere laden')+'</button></div>';
  h+='</div>';
  // Lesen / Schreiben
  h+='<div class="spalte lesen" id="rspalte" style="border-right:0">';
  if(C){const titel={neu:'Neue Mail',antworten:'Antworten',allen:'Allen antworten',weiterleiten:'Weiterleiten'}[C.modus];
    h+='<div class="mk"><div class="acts" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">'+titel+'</h2><div class="acts"><button class="primary" data-a="senden"'+(BUSY?' disabled':'')+'>'+(BUSY==='senden'?'Wird gesendet …':'Senden')+'</button><button data-a="ki"'+(BUSY?' disabled':'')+'>'+(BUSY==='ki'?'KI arbeitet …':'Mit KI verbessern')+'</button>'+(C.kiAlt?'<button class="ghost" data-a="kizurueck">KI rückgängig</button>':'')+'<button class="ghost" data-a="verwerfen">Verwerfen</button></div></div>'
      +'<div class="sub" style="margin-bottom:8px">Von: '+esc(POSTFACH)+'</div>'
      +'<label class="fl">An<input id="c-an" list="dl-adr" value="'+esc(C.an)+'" placeholder="E-Mail-Adresse oder Mieter eintippen, mehrere mit Komma" autocomplete="off"></label>'
      +'<div class="g2"><label class="fl">Cc<input id="c-cc" value="'+esc(C.cc)+'" autocomplete="off"></label>'+(C.bccZeigen||C.bcc?'<label class="fl">Bcc<input id="c-bcc" value="'+esc(C.bcc)+'" autocomplete="off"></label>':'<div style="align-self:center"><button class="small ghost" data-a="bcc">Bcc hinzufügen</button></div>')+'</div>'
      +'<label class="fl">Betreff<input id="c-betreff" value="'+esc(C.betreff)+'" autocomplete="off"></label>'
      +'<label class="fl">Text <span class="sub">– Stichworte genügen, „Mit KI verbessern“ formuliert daraus die Mail</span><textarea id="c-text">'+esc(C.text)+'</textarea></label>'
      +(C.modus==='weiterleiten'?'<div class="info">Die Anhänge der ursprünglichen Mail werden automatisch mitgesendet. Die ursprüngliche Mail wird unter deinem Text angefügt.</div>':C.modus!=='neu'?'<div class="info">Die ursprüngliche Mail wird unter deinem Text angefügt.</div>':'')
      +'<div class="sub" style="margin:6px 0 4px">Anhänge</div><div>'+C.anh.map((a,i)=>'<span class="chip">'+esc(a.name)+(a.groesse?' · '+groesse(a.groesse):'')+(a.lade?' · lädt …':'')+'<button data-anhweg="'+i+'">Entfernen</button></span>').join('')+'</div>'
      +'<div class="acts"><label class="up">Vom Gerät anhängen<input type="file" id="c-file" multiple hidden></label><button data-a="picker">Aus Mieterordner anhängen</button></div>'
      +(C.picker?pickerHtml():'')+'</div>';
    h+='<datalist id="dl-adr">'+adrVorschlaege().map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>';}
  else if(!SEL)h+='<div class="leer">Eine Mail auswählen, um sie zu lesen.</div>';
  else if(SEL.lade)h+='<div class="leer">Mail wird geladen …</div>';
  else if(SEL.fehler)h+='<div class="note">'+esc(SEL.fehler)+'</div>';
  else{const m=SEL;
    h+='<div class="mk"><div class="acts" style="margin-bottom:8px"><button class="small mobil-zurueck" data-a="zurueck">Zur Liste</button><button class="small" data-a="antworten">Antworten</button><button class="small" data-a="allen">Allen antworten</button><button class="small" data-a="weiterleiten">Weiterleiten</button>'
      +'<button class="small ghost" data-a="'+(m.gelesen?'ungel1':'gel1')+'">'+(m.gelesen?'Als ungelesen markieren':'Als gelesen markieren')+'</button><button class="small ghost" data-a="mark1">'+(m.markiert?'Markierung entfernen':'Markieren')+'</button>'
      +'<input class="inp" list="dl-ord" id="ziel-1" placeholder="Verschieben nach …" style="width:170px;padding:4px 8px" autocomplete="off"><button class="small warn" data-a="del1">Löschen</button></div>'
      +'<h2>'+esc(m.betreff||'(kein Betreff)')+'</h2><div class="kv"><span>Von</span><span>'+esc(person(m.von))+'</span><span>An</span><span>'+esc(m.an.map(person).join(', '))+'</span>'
      +(m.cc&&m.cc.length?'<span>Cc</span><span>'+esc(m.cc.map(person).join(', '))+'</span>':'')+(m.bcc&&m.bcc.length?'<span>Bcc</span><span>'+esc(m.bcc.map(person).join(', '))+'</span>':'')
      +'<span>Datum</span><span>'+esc(zeitLang(m.datum))+'</span></div>'
      +(m.anhaenge&&m.anhaenge.length?'<div class="anh">'+m.anhaenge.map(a=>'<button data-anh="'+esc(a.id)+'">'+esc(a.name)+' · '+groesse(a.groesse)+'</button>').join('')+'</div>':'')+'</div>'
      +'<iframe class="body" id="mbody" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>';}
  h+='</div></div>';
  app.innerHTML=h;koerperEinsetzen();
  const l=document.getElementById('lspalte');if(l)l.scrollTop=lsc;const r=document.getElementById('rspalte');if(r&&(C||SEL&&!SEL.lade))r.scrollTop=rsc;
  if(fid){const n=document.getElementById(fid);if(n&&n.tagName!=='BUTTON'){n.focus();try{if(fpos!=null)n.setSelectionRange(fpos,fpos);}catch(e){}}}}
function adrVorschlaege(){if(!MKGELADEN)mieterLaden();const out=[];for(const m of MK)for(const a of mkMails(m))out.push(a);return [...new Set(out)].sort();}

/* ---------- Ereignisse ---------- */
const A={
  neu:()=>neueMail('neu'),refresh:()=>aktualisieren(),mehr:()=>listeLaden(true),
  antworten:()=>neueMail('antworten'),allen:()=>neueMail('allen'),weiterleiten:()=>neueMail('weiterleiten'),
  verwerfen:()=>{if(C&&(C.text.trim()!==signatur().trim()||C.anh.length)&&!confirm('Mail verwerfen?'))return;C=null;render();},
  ki:()=>kiMail(),kizurueck:()=>{if(C&&C.kiAlt){C.text=C.kiAlt.text;C.betreff=C.kiAlt.betreff;C.kiAlt=null;render();}},
  senden:()=>senden(),bcc:()=>{C.bccZeigen=true;render();},
  picker:()=>{C.picker=!C.picker;render();},pickzu:()=>{C.picker=false;render();},
  pickok:()=>{const A2=AKTE[C.pmk]||{};const alle=[].concat(A2.dateien||[],...Object.values(A2.ordner||{}));let n=0;
    for(const id of Object.keys(C.pwahl)){if(!C.pwahl[id]||C.anh.some(a=>a.id===id))continue;const f=alle.find(x=>x.id===id);if(f){C.anh.push({typ:'onedrive',id,name:f.name,groesse:f.size||0});n++;}}
    C.pwahl={};C.picker=false;render();if(n)toast(n+' Datei'+(n>1?'en':'')+' angehängt.');},
  gel:()=>aufMails('markieren',{gelesen:true}),ungel:()=>aufMails('markieren',{gelesen:false}),mark:()=>aufMails('markieren',{markiert:true}),
  del:()=>{if(confirm(AUSW.size+' Mail'+(AUSW.size>1?'s':'')+' löschen?'))aufMails('loeschen');},
  auswall:()=>{MAILS.forEach(m=>AUSW.add(m.id));render();},auswnone:()=>{AUSW.clear();render();},
  gel1:()=>aufMails('markieren',{gelesen:true},[SEL.id]),ungel1:()=>aufMails('markieren',{gelesen:false},[SEL.id]),mark1:()=>aufMails('markieren',{markiert:!SEL.markiert},[SEL.id]),
  del1:()=>aufMails('loeschen',{},[SEL.id]),zurueck:()=>{SEL=null;render();},
};
document.addEventListener('click',e=>{const t=e.target;
  if(t.dataset&&t.dataset.ausw!==undefined){if(t.checked)AUSW.add(t.dataset.ausw);else AUSW.delete(t.dataset.ausw);render();return;}
  if(t.dataset&&t.dataset.pw!==undefined){C.pwahl[t.dataset.pw]=t.checked;return;}
  const b=t.closest('[data-a],[data-ord],[data-mail],[data-anh],[data-anhweg]');if(!b||b.disabled)return;
  if(b.dataset.a&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a]();return;}
  if(b.dataset.ord){AKT=b.dataset.ord;SUCHE='';UEBERALL=false;SEL=null;C=null;AUSW.clear();MAILS=[];WEITER='';listeLaden();return;}
  if(b.dataset.mail){if(C&&!confirm('Die angefangene Mail verwerfen?'))return;oeffnen(b.dataset.mail);return;}
  if(b.dataset.anh){anhangOeffnen(b.dataset.anh);return;}
  if(b.dataset.anhweg!==undefined){C.anh.splice(+b.dataset.anhweg,1);render();return;}});
let suchT=null;
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='suche'){SUCHE=t.value;clearTimeout(suchT);suchT=setTimeout(()=>{SEL=null;AUSW.clear();listeLaden();},450);return;}
  if(C&&t.id&&t.id.startsWith('c-')&&!['c-file','c-pmk'].includes(t.id)){const k=t.id.slice(2);if(k==='pq'){C.pq=t.value;clearTimeout(suchT);suchT=setTimeout(render,250);}else C[k]=t.value;return;}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='ueberall'){UEBERALL=t.checked;if(SUCHE)listeLaden();else render();return;}
  if(t.id==='ziel-l'||t.id==='ziel-1'){if(t.value)zielWaehlen(t.value);return;}
  if(t.id==='ord-mobil'){const o=ORD.find(x=>ordLabel(x)===t.value||x.name===t.value);if(o){AKT=o.id;SUCHE='';SEL=null;C=null;AUSW.clear();MAILS=[];WEITER='';listeLaden();}return;}
  if(t.id==='c-file'){const f=[...t.files];t.value='';geraetAnhaenge(f);return;}
  if(t.id==='c-pmk'){const m=MK.find(x=>mkLabel(x)===t.value);if(m){C.pmk=m.pid;C.pq='';render();}return;}
  if(t.id==='c-an'&&C){C.an=t.value;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SEL&&!C&&window.innerWidth<=760){SEL=null;render();}});

async function start(){const {data}=await sb.auth.getSession();if(!data||!data.session){document.getElementById('app').innerHTML='<div class="leer">Bitte im Wohntraum OS anmelden.</div>';return;}
  const u=data.session.user||{};const mail=String(u.email||'').toLowerCase();ICH=NUTZER[mail]||(u.user_metadata&&(u.user_metadata.full_name||u.user_metadata.name))||u.email||'';
  try{await ordnerLaden();}catch(e){document.getElementById('app').innerHTML='<div class="note">'+esc(e.message||String(e))+'</div>';return;}
  const Q=new URLSearchParams(location.search);
  await listeLaden();
  if(Q.get('an')){neueMail('neu',{an:Q.get('an'),betreff:Q.get('betreff')||''});}
  setInterval(()=>{if(document.visibilityState==='visible')aktualisieren(true);},60000);}
start();
</script></body></html>
