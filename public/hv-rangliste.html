<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hausverwaltung · Rangliste Objekte</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--surf:#ffffff;--surf2:#f1f3f6;--line:#e4e7ec;--text:#1c2230;--muted:#6b7280;--accent:#6d4ef0;--accent2:#8266ff;--gold:#b07d1a;--green:#0f9d6b;--red:#d64550;--amber:#c7851d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
a{color:var(--accent2);text-decoration:none}
.wrap{max-width:none;margin:0 auto;padding:22px 26px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:26px;font-weight:800;color:var(--gold)}
.sub{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:780px}
.topbtns{display:flex;gap:8px;align-items:center}
.btn{font:inherit;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surf);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:18px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kpi .v{font-size:21px;font-weight:800;margin-top:5px}
.kpi.gold .v{color:var(--gold)} .kpi.green .v{color:var(--green)} .kpi.red .v{color:var(--red)}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar input{font:inherit;font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surf);color:var(--text);min-width:260px}
.bar select{font:inherit;font-size:12.5px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surf);color:var(--text)}
.count{font-size:12px;color:var(--muted)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:13px;background:var(--surf)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1180px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;background:var(--surf2);position:sticky;top:0;z-index:1;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
th.so::after{content:' ▾';color:var(--accent2)} th.sa::after{content:' ▴';color:var(--accent2)}
th:nth-child(1),th:nth-child(2),th:nth-child(3),td:nth-child(1),td:nth-child(2),td:nth-child(3){text-align:left}
td:nth-child(1){color:var(--muted);font-weight:700;width:34px}
.oname{font-weight:700}.omut{font-size:11px;color:var(--muted)}
.kz{font-size:10.5px;font-weight:700;color:var(--accent);background:#efeafe;padding:1px 7px;border-radius:5px;margin-right:5px}
tbody tr:hover{background:var(--surf2)}
.good{color:var(--green)} .bad{color:var(--red)}
.edit{cursor:pointer;border-bottom:1px dashed var(--muted)}
.edit:hover{color:var(--accent2);border-color:var(--accent2)}
.est{color:var(--amber)}
.bausbar{height:6px;background:var(--surf2);border-radius:99px;overflow:hidden;min-width:70px;display:inline-block;vertical-align:middle;margin-left:6px}
.bausbar>i{display:block;height:100%}
tfoot td{font-weight:800;background:var(--surf2);border-top:2px solid var(--line);position:sticky;bottom:0}
.legend{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.7}
.legend b{color:var(--text)}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:100}
.ov.show{display:flex}
.modal{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:22px;width:420px;max-width:92vw}
.modal h3{font-size:16px;margin-bottom:4px}.modal .ms{font-size:12px;color:var(--muted);margin-bottom:16px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.mrow label{font-size:12.5px;color:var(--muted)}
.mrow input{font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surf2);color:var(--text);width:150px;text-align:right}
.mact{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:200}
.toast.show{opacity:1}
.wrap,.main,.layout,main{max-width:none!important}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div><h1>Rangliste · Objekte</h1><div class="sub">Wirtschaftlichkeit je Haus (ganze Immobilie). Umsatz = Warmmiete p.a. der aktuell vermieteten Einheiten · Bankrate aus den Darlehen · Bewirtschaftung als OS-Eingabe je Objekt. Spalten sortierbar, Werte editierbar (✎).</div></div>
    <div class="topbtns"><a class="btn" href="/hausverwaltung/objekte" target="_top">Objekte →</a><a class="btn" href="/hausverwaltung/einheiten" target="_top">Einheiten →</a></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="bar">
    <input id="q" placeholder="🔍 Objekt / Stadt suchen …" oninput="render()">
    <select id="eig" onchange="render()"><option value="">Alle Eigentümer</option></select>
    <span class="count" id="cnt"></span>
  </div>
  <div class="scroll"><table id="tbl"><thead><tr id="hrow"></tr></thead><tbody id="tb"></tbody><tfoot><tr id="tf"></tr></tfoot></table></div>
  <div class="legend" id="legend"></div>
</div>

<div class="ov" id="ov"><div class="modal">
  <h3 id="mtitle">Objekt</h3><div class="ms" id="msub"></div>
  <div class="mrow"><label>Betriebskosten / Jahr</label><input id="m_bk" type="number" step="100" placeholder="0"></div>
  <div class="mrow"><label>Heizkosten / Jahr</label><input id="m_hk" type="number" step="100" placeholder="0"></div>
  <div class="mrow"><label>Reparaturen / Jahr</label><input id="m_rep" type="number" step="100" placeholder="0"></div>
  <div class="mrow"><label>Bankrate / Jahr (Override)</label><input id="m_bank" type="number" step="100" placeholder="auto aus Darlehen"></div>
  <div class="mrow"><label>Notiz</label><input id="m_notiz" type="text" style="width:220px;text-align:left" placeholder="optional"></div>
  <div class="mact"><button class="btn" onclick="closeModal()">Abbrechen</button><button class="btn primary" onclick="saveModal()">Speichern</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const eur=n=>(n==null||isNaN(n)?'—':new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n));
const eur2=n=>(n==null||isNaN(n)?'—':new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' €');
const pct=n=>(n==null||isNaN(n)?'—':n.toFixed(1).replace('.',',')+' %');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
// Darlehen-Kürzel -> Nahaus h_id_text (nur Bankdarlehen mit Kapitaldienst)
const CODEMAP={KW30:'H8',U6:'H12',E4:'H2',S58:'H11',H44:'H6',S16:'H5',K28:'H4',K6:'H7',M8:'H9',K7:'H13',R6:'H15',V11:null,A14:'H1',K10:'H1'};
// Interne Objektkennung je Nahaus-Objekt (Fallback = Nahaus-Kürzel H.., z.B. H3)
const KUERZEL={H1:'A14',H2:'E4',H4:'K28',H5:'S16',H6:'H44',H7:'K6',H8:'KW30',H9:'M8',H11:'S58',H12:'U6',H13:'K7',H15:'R6'};
let OBJ=[],MIET=[],LOANS=[],KENN={},ROWS=[],sortKey='gewinn',sortDir=-1,editId=null;
const COLS=[
 ['rank','#',r=>r._rank,'t'],
 ['kennung','Kennung',r=>`<span class="kz">${esc(r.kennung)}</span>`,'t'],
 ['name','Objekt',r=>`<span class="oname">${esc(r.name||'')}</span><div class="omut">${esc(r.ort||'')} · ${esc(r.eigentuemer||'')}</div>`,'t'],
 ['einheiten','Wohneinheiten',r=>r.einheiten,'n'],
 ['auslastung','Auslastung',r=>auslHtml(r),'n'],
 ['umsatz','Umsatz p.a.',r=>eur(r.umsatz),'n'],
 ['bankrate','Bankrate p.a.',r=>bankHtml(r),'n'],
 ['bewirt','Bewirtschaftung p.a.',r=>bewirtHtml(r),'n'],
 ['kaltm2','Kaltmiete /m²',r=>r.kaltm2?eur2(r.kaltm2):'—','n'],
 ['cashflow','Cashflow /Monat',r=>`<b class="${r.cashflow>=0?'good':'bad'}">${eur(r.cashflow)}</b>`,'n'],
 ['gewinn','Gewinn p.a.',r=>`<b class="${r.gewinn>=0?'good':'bad'}">${eur(r.gewinn)}</b>`,'n'],
 ['umsatzWhg','Umsatz/Whg·Monat',r=>eur(r.umsatzWhg),'n'],
 ['rendite','Rendite %',r=>`<b class="${r.rendite>=0?'good':'bad'}">${pct(r.rendite)}</b>`,'n']
];
function auslHtml(r){const p=r.auslastung;const c=p>=100?'var(--green)':p>=75?'#9ecb3a':'var(--amber)';return `${pct(p)}<span class="bausbar"><i style="width:${Math.min(100,p)}%;background:${c}"></i></span>`;}
function bankHtml(r){const ov=KENN[r.id]&&KENN[r.id].bankrate_override!=null;return `<span class="edit ${ov?'':''}" onclick="openModal('${r.id}')">${eur(r.bankrate)}</span>${ov?'':(r.bankAuto?'':' <span class="est" title="kein Darlehen zugeordnet">•</span>')}`;}
function bewirtHtml(r){const has=r.bewirt>0;return `<span class="edit ${has?'':'est'}" onclick="openModal('${r.id}')">${has?eur(r.bewirt):'eintragen ✎'}</span>`;}

async function load(){
  const [o,m,l,k]=await Promise.all([
    sb.from('nahaus_objekte').select('*').eq('geloescht',false),
    sb.from('nahaus_mietverhaeltnisse').select('property_id,is_current,is_rented,kaltmiete,warmmiete').eq('is_current',true),
    sb.from('loans').select('dnr_intern,bez,kapitaldienst,status,geber'),
    sb.from('nahaus_objekt_kennzahlen').select('*')
  ]);
  OBJ=o.data||[];MIET=m.data||[];LOANS=(l.error?[]:(l.data||[]));(k.data||[]).forEach(x=>KENN[x.object_id]=x);
  compute();buildFilters();buildHead();render();
}
function loanMonatByObj(){
  const map={};
  LOANS.filter(x=>x.status==='Aktiv'&&x.kapitaldienst).forEach(x=>{
    const code=String(x.bez||'').trim().split(/\s+/)[0].toUpperCase();
    const h=CODEMAP[code];if(!h)return;
    map[h]=(map[h]||0)+Number(x.kapitaldienst);
  });
  return map;
}
function compute(){
  const lm=loanMonatByObj();
  const warmByObj={},kaltByObj={};
  MIET.filter(x=>x.is_rented).forEach(x=>{
    warmByObj[x.property_id]=(warmByObj[x.property_id]||0)+Number(x.warmmiete||x.kaltmiete||0);
    kaltByObj[x.property_id]=(kaltByObj[x.property_id]||0)+Number(x.kaltmiete||0);
  });
  ROWS=OBJ.map(o=>{
    const warmM=warmByObj[o.id]||0,kaltM=kaltByObj[o.id]||0;
    const umsatz=warmM*12;
    const kn=KENN[o.id]||{};
    const bankAuto=(lm[o.h_id_text]||0)*12;
    const bankrate=kn.bankrate_override!=null?Number(kn.bankrate_override):bankAuto;
    const bewirt=(Number(kn.betriebskosten_jahr||0)+Number(kn.heizkosten_jahr||0)+Number(kn.reparaturen_jahr||0));
    const gewinn=umsatz-bankrate-bewirt;
    const einh=o.einheiten_gesamt||0;
    return {id:o.id,h_id_text:o.h_id_text,kennung:KUERZEL[o.h_id_text]||o.h_id_text,name:o.name,ort:o.ort,eigentuemer:o.eigentuemer,
      einheiten:einh,
      auslastung:einh?(o.einheiten_vermietet||0)/einh*100:0,
      umsatz,bankrate,bankAuto:!!(lm[o.h_id_text]),bewirt,
      kaltm2:(kaltM&&o.wohnflaeche)?kaltM/Number(o.wohnflaeche):null,
      gewinn,cashflow:gewinn/12,umsatzWhg:einh?warmM/einh:0,
      rendite:umsatz?gewinn/umsatz*100:null};
  });
}
function buildFilters(){
  const e=[...new Set(OBJ.map(o=>o.eigentuemer).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));
  $('eig').innerHTML='<option value="">Alle Eigentümer</option>'+e.map(x=>`<option>${esc(x)}</option>`).join('');
}
function buildHead(){$('hrow').innerHTML=COLS.map(c=>`<th data-k="${c[0]}" onclick="setSort('${c[0]}')">${c[1]}</th>`).join('');}
function setSort(k){if(k==='rank'||k==='name'||k==='kennung')return;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1;}render();}
function filtered(){
  const q=$('q').value.trim().toLowerCase(),eg=$('eig').value;
  let r=ROWS.filter(x=>{if(eg&&x.eigentuemer!==eg)return false;if(q){const h=[x.name,x.ort,x.h_id_text,x.eigentuemer].join(' ').toLowerCase();if(!h.includes(q))return false;}return true;});
  r.sort((a,b)=>{let va=a[sortKey],vb=b[sortKey];va=va==null?-1e15:va;vb=vb==null?-1e15:vb;return (va-vb)*sortDir;});
  r.forEach((x,i)=>x._rank=i+1);return r;
}
function render(){
  const rows=filtered();
  $('cnt').textContent=rows.length+' von '+ROWS.length+' Objekten';
  document.querySelectorAll('#hrow th').forEach(th=>{th.classList.remove('so','sa');if(th.dataset.k===sortKey)th.classList.add(sortDir<0?'so':'sa');});
  $('tb').innerHTML=rows.map(r=>'<tr>'+COLS.map(c=>`<td>${c[2](r)}</td>`).join('')+'</tr>').join('')||`<tr><td colspan="13" style="text-align:center;color:var(--muted);padding:24px">Keine Objekte.</td></tr>`;
  // totals
  const S=rows.reduce((a,r)=>{a.einh+=r.einheiten;a.ums+=r.umsatz;a.bank+=r.bankrate;a.bew+=r.bewirt;a.gew+=r.gewinn;return a;},{einh:0,ums:0,bank:0,bew:0,gew:0});
  const avgAusl=rows.length?rows.reduce((a,r)=>a+r.auslastung,0)/rows.length:0;
  const avgRend=S.ums?S.gew/S.ums*100:0;
  const tf=[`Σ`,'',`${rows.length} Objekte`,S.einh,pct(avgAusl),eur(S.ums),eur(S.bank),eur(S.bew),'',`<b class="${S.gew>=0?'good':'bad'}">${eur(S.gew/12)}</b>`,`<b class="${S.gew>=0?'good':'bad'}">${eur(S.gew)}</b>`,'',`<b>${pct(avgRend)}</b>`];
  $('tf').innerHTML=tf.map(v=>`<td>${v}</td>`).join('');
  renderKpis(S,avgAusl,avgRend,rows.length);
}
function renderKpis(S,avgAusl,avgRend,n){
  const k=[['Objekte',n,''],['Wohneinheiten',S.einh,''],['Ø Auslastung',pct(avgAusl),'green'],['Umsatz p.a.',eur(S.ums),'gold'],['Bankrate p.a.',eur(S.bank),''],['Gewinn p.a.',eur(S.gew),S.gew>=0?'green':'red'],['Ø Gewinnmarge',pct(avgRend),'gold']];
  $('kpis').innerHTML=k.map(([l,v,c])=>`<div class="kpi ${c||''}"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
}
function openModal(id){editId=id;const o=ROWS.find(x=>x.id===id),kn=KENN[id]||{};
  $('mtitle').textContent=(o.h_id_text||'')+' · '+(o.name||'');
  $('msub').textContent=`Bankrate automatisch aus Darlehen: ${eur(o.bankAuto)} / Jahr`;
  $('m_bk').value=kn.betriebskosten_jahr??'';$('m_hk').value=kn.heizkosten_jahr??'';$('m_rep').value=kn.reparaturen_jahr??'';
  $('m_bank').value=kn.bankrate_override??'';$('m_notiz').value=kn.notiz??'';
  $('ov').classList.add('show');}
function closeModal(){$('ov').classList.remove('show');editId=null;}
async function saveModal(){
  const v=id=>{const x=$(id).value.trim();return x===''?null:(id==='m_notiz'?x:Number(x));};
  const rec={object_id:editId,betriebskosten_jahr:v('m_bk'),heizkosten_jahr:v('m_hk'),reparaturen_jahr:v('m_rep'),bankrate_override:v('m_bank'),notiz:v('m_notiz'),updated_at:new Date().toISOString()};
  const {error}=await sb.from('nahaus_objekt_kennzahlen').upsert(rec,{onConflict:'object_id'});
  if(error){toast('Fehler: '+error.message);return;}
  KENN[editId]=rec;compute();render();closeModal();toast('Gespeichert ✓');
}
$('legend').innerHTML='<b>Berechnung:</b> Umsatz = Warmmiete der aktuell vermieteten Einheiten × 12. · Bankrate = Kapitaldienst der zugeordneten Darlehen × 12 (überschreibbar). · Bewirtschaftung = Betriebskosten + Heizkosten + Reparaturen (OS-Eingabe je Objekt). · Gewinn = Umsatz − Bankrate − Bewirtschaftung. · Rendite = Gewinnmarge = Gewinn ÷ Umsatz. · Kaltmiete/m² = Kaltmiete-Monat ÷ Wohnfläche. · Umsatz/Whg·Monat = Warmmiete-Monat ÷ Wohneinheiten. · <span class="est">✎</span> = Wert in Wohntraum OS eintragen.';
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal();});
load();
</script></body></html>
