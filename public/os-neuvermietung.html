 ['5. Bonität',[['eidesstattlich','Eidesstattliche Versicherung oder Haftbefehl in den letzten 3 Jahren']]],

let K=[],O=[],E=[],MSA={},MKO=[],ICH='',ICHMAIL='',SEL=null,BUSY='',ARCH=false,SUCHE='';

async function token(){const {data}=await sb.auth.getSession();return data&&data.session?data.session.access_token:'';}

function kalk(k){const c=k.kalk=k.kalk||{};c.pos=c.pos||{};
  // ältere Karten: Werte aus den einfachen Feldern übernehmen
  for(const [a,b] of [['kalt','kalt'],['bk','bk'],['hk','hk']])if(c[a]!=null&&c.pos[b]==null){c.pos[b]={neu:c[a]};}

  let h=`<div class="ov" id="ov"><div class="panel"><div class="kopf"><div><h1 style="font-size:20px">${esc(nameVoll(k))}</h1><div class="sub">${esc(SPN[k.spalte]||'')}${k.freigabe?' · übergeben von '+esc(k.freigabe.von||'Eric')+' am '+esc(zeit(k.freigabe.am)):''}</div></div><div class="acts"><button data-a="zu">Schließen</button></div></div>`;
  if(!k.archiv)h+=`<div class="card"><div class="ch">Schritt</div><div class="seg">${SP.map(([s,t],i)=>`<button data-spalte-wahl="${s}" class="${k.spalte===s?'on':''}"${BUSY||(i>0&&!k.freigabeMsa)?' disabled':''}>${i+1}. ${esc(t)}</button>`).join('')}</div>
    ${k.pid?`<div class="ok">Mieterkonto ist angelegt. <a href="#" data-a="konto">Mieterkonto öffnen</a></div>`:!k.freigabeMsa?'<div class="sub" style="margin-top:6px">Die nächsten Schritte sind frei, sobald Eric die Mieterselbstauskunft freigegeben hat.</div>':f.length?`<div class="sub" style="margin-top:6px">Für „Mietvertrag unterschrieben“ fehlt noch: ${esc(f.join(', '))}</div>`:''}</div>`;
  h+=msaKarte(k);
  h+=`<fieldset style="border:0"${ro?' disabled':''}>`;
  if(k.freigabeMsa||k.spalte!=='selbstauskunft')h+=kalkKarte(k);
  h+=`<div class="card"><div class="ch">Mieter</div>
    <div class="g3"><label class="fl">Anrede<input id="f-anrede" list="dl-anrede" value="${esc(k.anrede||'')}" autocomplete="off"><datalist id="dl-anrede"><option value="Frau"><option value="Herr"><option value="Familie"></datalist></label>${feld('f-vorname','Vorname',k.vorname)}${feld('f-name','Nachname',k.name)}</div>
    ${feld('f-weitere','Weitere Mieter (Vor- und Nachname, mehrere mit Komma)',k.weitere)}
    <div class="g3">${feld('f-email','E-Mail',k.email,'email')}${feld('f-tel','Telefon',k.tel,'tel')}${feld('f-personen','Personen',k.personen)}</div>
    <div class="g2">${feld('f-anschrift','Bisherige Anschrift',k.anschrift)}${feld('f-iban','IBAN des Mieters (für die Zuordnung der Zahlungen)',k.iban)}</div>
    ${k.kontakt?`<div class="sub">Kontakt aus Erics Liste: ${esc(k.kontakt)}${k.zahlungsart?' · Mietzahlung: '+esc(k.zahlungsart):''}${k.ziel?' · Zielwohnung: '+esc(k.ziel):''}</div>`:''}</div>
    <div class="card"><div class="ch">Wohnung</div><div class="g2">
      <label class="fl">Immobilie<input id="f-obj" list="dl-obj" value="${esc(objLabel(o))}" placeholder="Kürzel oder Straße eintippen …" autocomplete="off"><datalist id="dl-obj">${O.slice().sort((a,b)=>a.kz.localeCompare(b.kz,'de')).map(x=>`<option value="${esc(objLabel(x))}">`).join('')}</datalist></label>
      <label class="fl">Einheit<input id="f-ein" list="dl-ein" value="${esc(einLabel(e))}" placeholder="${o?'Einheit eintippen …':'zuerst die Immobilie wählen'}" autocomplete="off"${o?'':' disabled'}><datalist id="dl-ein">${o?E.filter(x=>x.objekt_id===o.id&&x.aktiv!==false).map(x=>`<option value="${esc(einLabel(x))}">`).join(''):''}</datalist></label></div>
      ${e?`<div class="sub">${esc([e.art,e.flaeche?String(e.flaeche).replace('.',',')+' m²':'',e.zimmer?e.zimmer+' Zimmer':''].filter(Boolean).join(' · '))}</div>`:''}</div>
    <div class="card"><div class="ch">Notizen</div><textarea id="f-notiz" placeholder="z. B. Schufa liegt vor, Mietangebot verschickt am …">${esc(k.notiz||'')}</textarea></div></fieldset>
    <div class="card verlauf"><div class="ch">Verlauf</div>${(k.verlauf||[]).slice().reverse().map(v=>`<div>${esc(zeit(v.t))} · ${esc(v.von||'')}: ${esc(v.text)}</div>`).join('')||'<div class="sub">Noch keine Einträge.</div>'}</div>
    ${k.pid?'':k.archiv?`<div class="acts"><button data-a="zurueck">Wieder ins Board holen</button></div>`:`<div class="acts" style="justify-content:flex-end"><input class="inp" id="f-grund" list="dl-grund" placeholder="Grund, z. B. Absage Mieter" style="width:240px" autocomplete="off"><datalist id="dl-grund"><option value="Absage Mieter"><option value="Absage Vermieter"><option value="Selbstauskunft unvollständig"><option value="Andere Wohnung gefunden"></datalist><button class="warn" data-a="archiv">Ins Archiv</button></div>`}
  </div></div>`;
  const sc=(document.querySelector('.panel')||{}).scrollTop||0;box.innerHTML=h;const p=document.querySelector('.panel');if(p)p.scrollTop=sc;
  const q=document.getElementById('qrbox');if(q&&window.QRCode&&MSA[k.id]){q.innerHTML='';new QRCode(q,{text:msaLink(MSA[k.id].token),width:150,height:150,correctLevel:QRCode.CorrectLevel.M});}}

/* ---------- Eingaben ---------- */
const FELD={'f-anrede':'anrede','f-vorname':'vorname','f-name':'name','f-weitere':'weitere','f-email':'email','f-tel':'tel','f-personen':'personen','k-personen':'personen','f-anschrift':'anschrift','f-iban':'iban','f-notiz':'notiz'};
const KALK={'k-beginn':'beginn','k-aenderung':'aenderung','k-wfl':'wfl','k-lage':'lage','k-ausstattung':'ausstattung','k-zielgruppe':'zielgruppe','k-kaution':'kaution'};
let spT=null;
function spaeter(k,neuZeichnen){clearTimeout(spT);spT=setTimeout(()=>{speichern(k);render();if(neuZeichnen)panel();},700);}
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='suche'){SUCHE=t.value;render();return;}
  const k=K.find(x=>x.id===SEL);if(!k||k.pid)return;const c=kalk(k);
  if(FELD[t.id]){k[FELD[t.id]]=t.value;spaeter(k,t.id==='k-personen');return;}
  if(KALK[t.id]){c[KALK[t.id]]=t.value;spaeter(k,t.id==='k-wfl');return;}
  if(t.dataset.pos){c.pos[t.dataset.pos][t.dataset.s]=t.value;spaeter(k,true);return;}
  if(t.dataset.vgl!==undefined){c.vergleich[+t.dataset.vgl][t.dataset.f]=t.value;spaeter(k,['kalt','wfl'].includes(t.dataset.f));return;}});
document.addEventListener('change',e=>{const t=e.target;const k=K.find(x=>x.id===SEL);if(!k||k.pid)return;
  if(t.id==='f-obj'){const o=O.find(x=>objLabel(x)===t.value);if(!o){if(t.value)toast('Bitte eine Immobilie aus der Liste wählen.');return;}k.wohnung={objekt_id:o.id};speichern(k);setTimeout(()=>{panel();render();});return;}
  if(t.id==='f-ein'){const o=k.wohnung&&objVon(k.wohnung.objekt_id);const ei=o&&E.find(x=>x.objekt_id===o.id&&einLabel(x)===t.value);if(!ei){if(t.value)toast('Bitte eine Einheit aus der Liste wählen.');return;}
    k.wohnung={objekt_id:o.id,einheit_id:ei.id,label:o.kz+' '+ei.bezeichnung+' · '+(o.strasse||o.name||'')};speichern(k,'Wohnung gewählt: '+k.wohnung.label);setTimeout(()=>{panel();render();});return;}
  if(t.id==='k-region'){if(t.value&&!KDU[t.value]){toast('Bitte ein Gebiet aus der Liste wählen.');return;}kalk(k).region=t.value;speichern(k);setTimeout(panel);return;}
  if(t.dataset.pos||t.id==='k-beginn'||t.id==='k-kaution'){clearTimeout(spT);speichern(k);setTimeout(()=>{panel();render();});}});
document.addEventListener('click',async e=>{const t=e.target;
  const sw=t.closest('[data-spalte-wahl]');if(sw){const k=K.find(x=>x.id===SEL);if(k)verschieben(k,sw.dataset.spalteWahl);return;}
  const vd=t.closest('[data-vgldel]');if(vd){const k=K.find(x=>x.id===SEL);kalk(k).vergleich.splice(+vd.dataset.vgldel,1);speichern(k);panel();return;}
  const a=t.closest('[data-a]');if(a){e.preventDefault();const k=K.find(x=>x.id===SEL),w=a.dataset.a;
    if(w==='zu'){SEL=null;panel();return;}
    if(w==='arch'){ARCH=!ARCH;render();return;}
    if(w==='konto'&&k&&k.pid){(window.top||window).location.href='/hausverwaltung/mieterkonten?pid='+encodeURIComponent(k.pid);return;}
    if(w==='msaneu'&&k){msaErstellen(k);return;}
    if(w==='msakopie'){const i=document.getElementById('msa-link');try{await navigator.clipboard.writeText(i.value);}catch(x){i.select();document.execCommand('copy');}toast('Link kopiert.');return;}
    if(w==='msamail'&&k){msaMail(k);return;}
    if(w==='msaqr'&&k){const img=document.querySelector('#qrbox img,#qrbox canvas');const u=img?(img.tagName==='CANVAS'?img.toDataURL('image/png'):img.src):'';if(!u)return;const l=document.createElement('a');l.href=u;l.download='QR_Selbstauskunft_'+String(k.name||'Mieter')+'.png';l.click();return;}
    if(w==='msapdf'&&k){msaPdf(k);return;}
    if(w==='msafrei'&&k){msaFreigeben(k);return;}
    if(w==='vgladd'&&k){const c=kalk(k);(c.vergleich=c.vergleich||[]).push({});speichern(k);panel();return;}
    if(w==='vglobj'&&k){vglAusObjekt(k);return;}
    if(w==='archiv'&&k){const g=(document.getElementById('f-grund')||{}).value||'';if(!g.trim()){toast('Bitte einen Grund eintragen.');return;}k.archiv={grund:g.trim(),am:HEUTE,von:ICH};speichern(k,'Ins Archiv: '+g.trim()).then(()=>{SEL=null;panel();render();toast('Ins Archiv verschoben.');});return;}
    if(w==='zurueck'&&k){delete k.archiv;speichern(k,'Aus dem Archiv zurückgeholt').then(()=>{panel();render();});return;}
    return;}
  const kt=t.closest('[data-k]');if(kt){SEL=kt.dataset.k;panel();return;}
  if(t.id==='ov'){SEL=null;panel();}});
/* Vergleichswohnungen aus den laufenden Mietverhältnissen desselben Objekts */
async function vglAusObjekt(k){const e=k.wohnung&&einVon(k.wohnung.einheit_id),o=e&&objVon(e.objekt_id);if(!o){toast('Bitte zuerst die Wohnung wählen.');return;}
  const {data}=await sb.from('os_docs').select('pid:data->>pid,unit:data->>unit,bis:data->>bis,mieter:data->>mieter,stufen:data->stufen,einheit:data->>einheit').eq('app','oc').like('pfad','mietkonten/%').eq('data->>obj',o.kz);
  const c=kalk(k);c.vergleich=c.vergleich||[];let n=0;
  for(const m of data||[]){if(m.bis&&m.bis<HEUTE)continue;const st=(m.stufen||[]).filter(x=>x.total>0).sort((a,b)=>String(a.ab).localeCompare(String(b.ab))).pop();if(!st||!st.kalt)continue;
    const ei=E.find(x=>x.objekt_id===o.id&&((x.nahaus_id&&x.nahaus_id===m.unit)||x.id===m.unit));if(ei&&ei.id===e.id)continue;
    c.vergleich.push({geb:o.kz,we:ei?ei.bezeichnung:(m.einheit||''),lage:ei&&ei.lage||'',name:m.mieter||'',kalt:st.kalt,wfl:ei&&ei.flaeche||'',zimmer:ei&&ei.zimmer||''});n++;}
  speichern(k);panel();toast(n?n+' Wohnung'+(n>1?'en':'')+' übernommen.':'Keine weiteren vermieteten Wohnungen in diesem Objekt gefunden.');}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SEL){SEL=null;panel();}});
/* Ziehen und Ablegen */
let ZIEH=null;
document.addEventListener('dragstart',e=>{const k=e.target.closest&&e.target.closest('[data-k]');if(!k)return;ZIEH=k.dataset.k;e.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',e=>{const s=e.target.closest&&e.target.closest('[data-spalte]');if(!s||!ZIEH)return;e.preventDefault();document.querySelectorAll('.spalte.ziel').forEach(x=>x!==s&&x.classList.remove('ziel'));s.classList.add('ziel');});
document.addEventListener('drop',e=>{const s=e.target.closest&&e.target.closest('[data-spalte]');document.querySelectorAll('.spalte.ziel').forEach(x=>x.classList.remove('ziel'));if(!s||!ZIEH)return;e.preventDefault();const k=K.find(x=>x.id===ZIEH);ZIEH=null;if(k)verschieben(k,s.dataset.spalte);});
document.addEventListener('dragend',()=>{ZIEH=null;document.querySelectorAll('.spalte.ziel').forEach(x=>x.classList.remove('ziel'));});
setInterval(()=>{if(document.visibilityState==='visible'&&!SEL)laden();},60000);
laden();
</script></body></html>
