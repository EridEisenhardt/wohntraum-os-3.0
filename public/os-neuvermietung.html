/* Abgleich mit Asana (Aufgaben anlegen, erledigte Aufgaben übernehmen) */
let SYNC=null;
async function asanaSync(){if(SYNC)return SYNC;SYNC=(async()=>{try{const r=await api('/api/neuvermietung',{aktion:'sync'});if(r&&r.fehler&&r.fehler.length)console.warn('Asana',r.fehler);if(r&&r.hinweis)console.warn(r.hinweis);return r&&r.geaendert||0;}catch(e){console.warn('Asana-Abgleich',e.message||e);return 0;}finally{setTimeout(()=>{SYNC=null;},0);}})();return SYNC;}
async function syncUndLaden(){const n=await asanaSync();if(n)await laden(true);}
async function speichern(k,log){
  // Änderungen, die der Asana-Abgleich inzwischen auf dem Server gemacht hat, nicht überschreiben
  try{const {data:cur}=await sb.from('os_docs').select('data').eq('app','oc').eq('pfad','neuvermietung/'+k.id).maybeSingle();const d=cur&&cur.data;
    if(d){const sa=d.asana||{};k.asana=k.asana||{};for(const x in sa){const a=k.asana[x],b=sa[x];if(!a||(!a.gid&&b.gid)||(b.erledigt&&!a.erledigt)||(b.gid&&a.gid!==b.gid&&!a.gid))k.asana[x]=b;}
      if(d.freigabeMsa&&!k.freigabeMsa)k.freigabeMsa=d.freigabeMsa;
      if(String(d.seit||'')>String(k.seit||'')){k.spalte=d.spalte;k.seit=d.seit;if(d.archiv&&!k.archiv)k.archiv=d.archiv;}
      const da=new Set((k.verlauf||[]).map(v=>v.t+v.text));(d.verlauf||[]).forEach(v=>{if(!da.has(v.t+v.text))(k.verlauf=k.verlauf||[]).push(v);});(k.verlauf||[]).sort((a,b)=>String(a.t).localeCompare(String(b.t)));}}catch(e){}
  k.geaendert=new Date().toISOString();if(log)(k.verlauf=k.verlauf||[]).push({t:k.geaendert,von:ICH,text:log});
  const {error}=await sb.from('os_docs').upsert({app:'oc',pfad:'neuvermietung/'+k.id,data:k,updated_at:k.geaendert});if(error){toast('Nicht gespeichert: '+error.message,6000);return false;}return true;}
async function eriSync(k){if(!k.iid)return;const s=SP.find(x=>x[0]===k.spalte);if(!s)return;const p={status:s[2],updated_at:new Date().toISOString()};
  if(['angebot','vertrag','unterschrieben'].includes(k.spalte))p.mietangebot_erhalten='✅';if(k.spalte==='unterschrieben')p.mietvertrag_unterschrieben='✅';
  if(MSA[k.id]&&MSA[k.id].status==='eingegangen')p.selbstauskunft_vorhanden='Ja';
  if(k.wohnung&&k.wohnung.label)p.zielwohnung_label=k.wohnung.label;
  try{await sb.from('mietinteressenten').update(p).eq('id',k.iid);}catch(e){}}

async function verschieben(k,ziel){if(k.spalte===ziel)return;
  if(k.spalte==='unterschrieben'&&k.pid){toast('Das Mieterkonto ist schon angelegt. Änderungen bitte im Mieterkonto vornehmen.',6000);return;}
  const reihe=SP.map(x=>x[0]);
  if(reihe.indexOf(ziel)>0&&!k.freigabeMsa){k.freigabeMsa={von:ICH,am:new Date().toISOString(),ohne:true};(k.verlauf=k.verlauf||[]).push({t:k.freigabeMsa.am,von:ICH,text:'Ohne Freigabe der Selbstauskunft weitergeschoben'});}
  const alt=k.spalte;k.spalte=ziel;k.seit=new Date().toISOString();
  if(await speichern(k,'Verschoben: '+(SPN[alt]||alt)+' → '+SPN[ziel])){eriSync(k);toast('Nach „'+SPN[ziel]+'“ verschoben.',5000);}
  render();if(SEL)panel();syncUndLaden();}
/* Mietvertrag unterschrieben: Mieterkonto anlegen und Asana-Projekt 03_EINZUG aus der Vorlage */
async function unterschreiben(k){if(k.pid)return;const f=fehlt(k);if(f.length){toast('Es fehlt noch: '+f.join(', '),7000);return;}
  if(!confirm('Mietvertrag unterschrieben?\n\nDas OS legt jetzt das Mieterkonto für '+nameVoll(k)+' an, der Mieter erscheint in der Einheit '+(k.wohnung&&k.wohnung.label||'')+'. In Asana wird das Projekt 03_EINZUG aus der Vorlage angelegt.'))return;
  BUSY='mk';render();
  try{await mieterkontoAnlegen(k);}catch(e){BUSY='';render();toast('Mieterkonto nicht angelegt: '+(e.message||e),8000);return;}
  if(k.spalte!=='unterschrieben'){k.spalte='unterschrieben';k.seit=new Date().toISOString();}
  await speichern(k,'Mietvertrag unterschrieben – Mieterkonto angelegt');eriSync(k);
  let hinweis='';try{const r=await api('/api/neuvermietung',{aktion:'einzug',id:k.id});if(r&&r.einzug){k.asana=k.asana||{};k.asana.einzug=r.einzug;}else if(r&&r.hinweis)hinweis=r.hinweis;}catch(e){hinweis='Asana-Projekt nicht angelegt: '+(e.message||e);}
  BUSY='';render();toast(hinweis||'Mieterkonto angelegt und Asana-Projekt 03_EINZUG erstellt.',hinweis?9000:5000);}
function fehlt(k){const c=kalk(k),f=[];if(!k.name&&!k.vorname)f.push('Name');if(!k.wohnung||!k.wohnung.einheit_id)f.push('Wohnung');if(!c.beginn)f.push('Mietbeginn');if(!posWert(c,'kalt','neu'))f.push('Kaltmiete');return f;}

/* Mieterkonto im OS anlegen: erscheint in Mieterkonten, beim Objekt und in den Übergabeprotokollen */
async function mieterkontoAnlegen(k){const e=einVon(k.wohnung.einheit_id),o=e&&objVon(e.objekt_id);if(!e||!o)throw new Error('Wohnung nicht gefunden.');
  const c=kalk(k),pid='os'+rid(),von=c.beginn,kaution=kaution_(k);
  const namen=[nameVoll(k)].concat(String(k.weitere||'').split(/\s*,\s*/).filter(Boolean));
  const others=POS.filter(([p])=>!['kalt','bk','hk','strom'].includes(p)).map(([p,l])=>({t:l.replace(/ \(.*\)$/,''),b:posWert(c,p,'neu')})).filter(x=>x.b);
  const st={ab:von,kalt:posWert(c,'kalt','neu'),bk:posWert(c,'bk','neu'),hk:posWert(c,'hk','neu'),strom:posWert(c,'strom','neu'),sonst:Math.round(others.reduce((a,x)=>a+x.b,0)*100)/100,others,total:warm(k)};
  const daten={pid,obj:o.kz,ges:o.gesellschaft||'',einheit:e.bezeichnung,unit:e.nahaus_id||e.id,einheit_id:e.id,von,bis:null,mieter:namen.join(', '),
    namen:namen.map(n=>n.trim().split(/\s+/).pop()),anrede:k.anrede?(k.anrede+' '+nameVoll(k)):'',kontakte:[{name:nameVoll(k),email:k.email||'',tel:k.tel||''}],
    ref:e.bezeichnung+' '+nameVoll(k),kaution,ibans:k.iban?[String(k.iban).replace(/\s+/g,'').toUpperCase()]:[],stufen:[st],
    soll:kaution?[{b:kaution,d:von,m:von.slice(0,7),t:'Kaution',id:pid+'_kaution',art:'KAUTION',typ:'PAYMENT',src:'os'}]:[],nhIst:[],ueb:'',quelle:'os',neuvermietung:k.id,angelegt:new Date().toISOString(),angelegtVon:ICH};
  const ts=new Date().toISOString();
  const {error}=await sb.from('os_docs').upsert({app:'oc',pfad:'mietkonten/'+pid,data:daten,updated_at:ts});if(error)throw error;
  try{await sb.from('os_docs').upsert({app:'oc',pfad:'historie/'+pid+'__'+Date.now(),data:{pid,id:pid+'__'+Date.now(),d:ts,erfasst:ts,art:'Neuvermietung',t:'Mieterkonto aus der Neuvermietung angelegt (Mietvertrag unterschrieben). Mietbeginn '+dmy(von)+', Warmmiete '+eur(st.total)+', Kaution '+eur(kaution)+'.',by:ICH||'unbekannt',manuell:false},updated_at:ts});}catch(x){}
  try{await stammEintragen(o,e,daten,st);}catch(x){}
  k.pid=pid;}
/* Objekt und Einheit in den Stammdaten der Mieterkonten (stamm/objekte) eintragen, falls sie dort noch fehlen */
async function stammEintragen(o,e,mk,st){const {data}=await sb.from('os_docs').select('data').eq('app','oc').eq('pfad','stamm/objekte').maybeSingle();if(!data||!data.data)return;
  const d=data.data,L=d.objekte=d.objekte||[];let ob=L.find(x=>x.kz===o.kz),neu=false;
  if(!ob){ob={kz:o.kz,ges:o.gesellschaft||'',name:[o.strasse||o.name,o.ort].filter(Boolean).join(', '),aktiv:true,einheiten:[]};L.push(ob);neu=true;}
  ob.einheiten=ob.einheiten||[];let ein=ob.einheiten.find(x=>x.id===mk.unit);
  if(!ein){ob.einheiten.push({id:mk.unit,label:e.bezeichnung,kalt:st.kalt,nk:Math.round((st.total-st.kalt)*100)/100,mieter:mk.mieter,ref:o.kz+' '+e.bezeichnung.replace(/\s+/g,'')+' '+(mk.namen[0]||''),umlage:true});neu=true;}
  if(neu)await sb.from('os_docs').upsert({app:'oc',pfad:'stamm/objekte',data:d,updated_at:new Date().toISOString()});}

/* ---------- Mieterselbstauskunft: Link, QR-Code, Freigabe ---------- */
const msaLink=t=>location.origin+'/mieterselbstauskunft.html?t='+encodeURIComponent(t);
async function msaErstellen(k){const t=(crypto.randomUUID?crypto.randomUUID():rid()+rid()+rid()).replace(/-/g,'');const e=k.wohnung&&einVon(k.wohnung.einheit_id),o=e&&objVon(e.objekt_id);
  const vor={objekt:o?[o.strasse,[o.plz,o.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ')+(e?' – '+e.bezeichnung:''):(k.ziel||''),einzug:(kalk(k).beginn||''),vorname:k.vorname||'',nachname:k.name||'',email:k.email||'',telefon:k.tel||'',personen:k.personen||''};
  const {data,error}=await sb.from('mieterselbstauskunft').insert({token:t,karte_id:k.id,vorbelegt:vor,erstellt_von:ICH}).select('id,token,karte_id,status,daten,unterschrift,eingegangen_at,created_at').single();
  if(error){toast('Link nicht erstellt: '+error.message,6000);return;}MSA[k.id]=data;await speichern(k,'Link zur Selbstauskunft erstellt');panel();render();}
async function msaMail(k){const s=MSA[k.id];if(!s)return;if(!/@/.test(k.email||'')){toast('Bitte zuerst die E-Mail-Adresse beim Mieter eintragen.');return;}
  BUSY='mail';panel();
  const text=(k.anrede==='Frau'?'Sehr geehrte Frau '+(k.name||''):k.anrede==='Herr'?'Sehr geehrter Herr '+(k.name||''):'Guten Tag'+(nameVoll(k)?' '+nameVoll(k):''))+',\n\nvielen Dank für Ihr Interesse an unserer Wohnung'+(k.wohnung&&k.wohnung.label?' ('+k.wohnung.label.split(' · ').pop()+')':'')+'. Bitte füllen Sie unsere Mieterselbstauskunft aus. Sie werden Schritt für Schritt durch die Fragen geführt und können die Auskunft am Ende direkt an uns versenden:\n\n'+msaLink(s.token)+'\n\nDas dauert nur wenige Minuten und funktioniert auch auf dem Handy.\n\nMit freundlichen Grüßen\n\nWohn(T)raum Rheinhessen GmbH\nbewusst sozial engagiert\nE-Mail: hausverwaltung@andersmacher.info\nTelefon: 06133-9382937\nDalheimer Str. 70, 55278 Dexheim\nHRB 45997, Amtsgericht Mainz\nGeschäftsführer: Eric Eisenhardt';
  try{await api('/api/postfach',{aktion:'senden',modus:'neu',an:k.email,betreff:'Ihre Mieterselbstauskunft',text,anhaenge:[]});k.msaGesendet=new Date().toISOString();await speichern(k,'Link zur Selbstauskunft per Mail an '+k.email+' gesendet');toast('Mail gesendet.');}
  catch(e){toast('Mail nicht gesendet: '+(e.message||e),8000);}
  BUSY='';panel();render();}
async function msaFreigeben(k){if(!darfFreigeben()){toast('Die Freigabe machen Eric oder Ramona.');return;}
  k.freigabeMsa={von:ICH,am:new Date().toISOString()};await speichern(k,'Mieterselbstauskunft freigegeben');await verschieben(k,'kalkulation');zuWs();}
function msaPdf(k){const s=MSA[k.id];if(!s||!s.daten)return;const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});const L=18,B=174;let y=20;
  const neu=()=>{doc.addPage();y=20;};doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('Mieterselbstauskunft',L,y);y+=10;
  for(const [t,F] of MSA_F){if(y>260)neu();doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(t,L,y);y+=6;doc.setFontSize(10);
    for(const [f,l] of F){const v=s.daten[f];if(v==null||v==='')continue;const val=doc.splitTextToSize(String(/^\d{4}-\d\d-\d\d$/.test(v)?dmy(v):v),B/2);if(y+val.length*4.6>280)neu();
      doc.setFont('helvetica','normal');doc.setTextColor(95,107,122);doc.text(doc.splitTextToSize(l,B/2-4),L,y);doc.setTextColor(0);doc.text(val,L+B/2,y);y+=Math.max(5,val.length*4.6)+1.5;}y+=3;}
  if(s.unterschrift){if(y>240)neu();doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Unterschrift',L,y);y+=3;try{doc.addImage(s.unterschrift,'PNG',L,y,70,22);}catch(e){}y+=26;}
  doc.setFontSize(8.5);doc.setTextColor(120);doc.text('Übermittelt über das Wohntraum OS am '+zeit(s.eingegangen_at),L,288);
  const name=(k.wohnung&&k.wohnung.label?k.wohnung.label.split(' · ')[0].replace(/\s+/g,'_'):'Neuvermietung')+'_'+String(k.name||'').toUpperCase()+' '+(k.vorname||'')+'_'+String(s.eingegangen_at||'').slice(0,10)+'_Mieterselbstauskunft.pdf';
  doc.save(name);}

/* ---------- Dateien je Mietinteressent ---------- */
const DT_ARTEN=['Ausweis','Einkommensnachweis','Kostenübernahme / Bescheid','Mietschuldenfreiheit','Schufa','Selbstauskunft','Sonstiges'];
const SPNAME={selbstauskunft:'Mieterselbstauskunft',kalkulation:'Mietkalkulation',angebot:'Mietangebot',vertrag:'Mietvertrag',unterschrieben:'Mietvertrag unterschrieben'};
function dateienKarte(k){const L=(k.dateien||[]).slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'de',{numeric:true}));
  return `<div class="card"><div class="ch">Dateien<span class="sub">${L.length?L.length+' Datei'+(L.length===1?'':'en'):''}</span></div>
  <div class="sub" style="margin-bottom:8px">Hier Unterlagen ablegen, die nicht über das OS gekommen sind, z. B. eine Selbstauskunft auf Papier, Ausweis, Einkommensnachweis oder Schufa. Bei Art „Selbstauskunft“ können Eric oder Ramona sie in Schritt 1 freigeben.</div>
  ${L.length?'<table class="ktab" style="margin-bottom:8px"><thead><tr><th>Datei</th><th>Art</th><th>Schritt</th><th>hochgeladen</th><th></th></tr></thead><tbody>'+L.map(d=>`<tr><td><a href="#" data-dt-oeffnen="${esc(d.pfad)}">${esc(d.name)}</a></td><td>${esc(d.art||'')}</td><td>${esc(SPNAME[d.schritt]||'')}</td><td>${esc(zeit(d.am))}${d.von?' · '+esc(d.von):''}</td><td class="r">${k.pid?'':`<button class="small ghost" data-dt-weg="${esc(d.pfad)}">Entfernen</button>`}</td></tr>`).join('')+'</tbody></table>':''}
  ${k.pid?'':`<div class="acts"><input class="inp" id="dt-art" list="dl-dtart" placeholder="Art, z. B. Selbstauskunft" style="width:240px" autocomplete="off"><datalist id="dl-dtart">${DT_ARTEN.map(a=>`<option value="${esc(a)}">`).join('')}</datalist>
    <label class="inp" style="cursor:pointer">${BUSY==='dt'?'Wird hochgeladen …':'Datei auswählen und hochladen'}<input type="file" id="dt-datei" multiple style="display:none"${BUSY?' disabled':''}></label></div>`}</div>`;}
async function dateiHoch(k,files,art){if(!files.length)return;BUSY='dt';panel();let n=0;
  for(const f of files){if(f.size>25*1024*1024){toast(f.name+' ist größer als 25 MB.',6000);continue;}
    const sauber=String(f.name).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.\- ]+/g,'_').replace(/\s+/g,'_').slice(-120);
    const pfad=k.id+'/dateien/'+Date.now()+'_'+sauber;
    const {error}=await sb.storage.from('vertraege').upload(pfad,f,{contentType:f.type||'application/octet-stream'});
    if(error){toast('Nicht hochgeladen: '+f.name+' ('+error.message+')',7000);continue;}
    (k.dateien=k.dateien||[]).push({pfad,name:f.name,art:art||'',schritt:k.spalte||'selbstauskunft',am:new Date().toISOString(),von:ICH});n++;}
  BUSY='';if(n)await speichern(k,n+' Datei'+(n===1?'':'en')+' hochgeladen'+(art?' ('+art+')':''));panel();zeileNeu(k);if(n)toast(n===1?'Datei hochgeladen.':n+' Dateien hochgeladen.');}
async function dateiOeffnen(pfad){const {data,error}=await sb.storage.from('vertraege').createSignedUrl(pfad,600);if(error){toast('Nicht geöffnet: '+error.message,6000);return;}window.open(data.signedUrl,'_blank');}
async function dateiWeg(k,pfad){const d=(k.dateien||[]).find(x=>x.pfad===pfad);if(!d||!confirm('Datei „'+d.name+'“ entfernen?'))return;
  const {error}=await sb.storage.from('vertraege').remove([pfad]);if(error){toast('Nicht entfernt: '+error.message,6000);return;}
  k.dateien=k.dateien.filter(x=>x.pfad!==pfad);await speichern(k,'Datei entfernt: '+d.name);panel();}
async function loeschen(k){if(k.pid){toast('Das Mieterkonto ist schon angelegt. Diese Vermietung kann nicht gelöscht werden.',6000);return;}
  if(!confirm(nameVoll(k)+' endgültig löschen?\n\nDie Karte mit allen Angaben und hochgeladenen Dateien wird entfernt. Offene Asana-Aufgaben werden abgehakt. Das lässt sich nicht rückgängig machen.'))return;
  BUSY='del';panel();
  for(const s of ['selbstauskunft','kalkulation','angebot','vertrag']){const a=(k.asana||{})[s];if(a&&/^\d+$/.test(String(a.gid||''))&&!a.erledigt){try{await api('/api/asana',{aktion:'erledigt',gid:a.gid,wert:true});}catch(e){}}}
  const pf=(k.dateien||[]).map(d=>d.pfad);if(pf.length){try{await sb.storage.from('vertraege').remove(pf);}catch(e){}}
  const {error}=await sb.from('os_docs').delete().eq('app','oc').eq('pfad','neuvermietung/'+k.id);
  BUSY='';if(error){toast('Nicht gelöscht: '+error.message,7000);panel();return;}
  K=K.filter(x=>x.id!==k.id);SEL=null;render();toast('Gelöscht.');}

/* ---------- Darstellung ---------- */
function karte(k){const c=kalk(k),w=warm(k),tage=k.seit?Math.floor((Date.now()-Date.parse(k.seit))/864e5):0,s=MSA[k.id],auf=SEL===k.id;
  let st='';if(k.spalte==='selbstauskunft'){st=k.freigabeMsa?'<span class="pill p-ok">freigegeben</span>':s&&s.status==='eingegangen'?'<span class="pill p-blau">Selbstauskunft eingegangen – Freigabe offen</span>':k.msaManuell?'<span class="pill p-blau">Selbstauskunft manuell erfasst – Freigabe offen</span>':(k.dateien||[]).some(d=>d.art==='Selbstauskunft')?'<span class="pill p-blau">Selbstauskunft als Datei – Freigabe offen</span>':s?'<span class="pill">Link erstellt, wartet auf den Mieter</span>':'<span class="pill">Link noch nicht erstellt</span>';}
  return `<div class="zeile${auf?' on':''}" draggable="${k.pid||auf?'false':'true'}" data-k="${esc(k.id)}"><span class="n">${esc(nameVoll(k))}</span>
    <span class="z">${esc(k.wohnung&&k.wohnung.label||k.ziel||'Wohnung noch offen')}</span>${st}
    ${c.beginn?`<span class="pill">ab ${esc(dmy(c.beginn))}</span>`:(k.einzug_ab?`<span class="pill">Einzug ab ${esc(k.einzug_ab)}</span>`:'')}${w?`<span class="pill">${esc(eur(w))} warm</span>`:''}
    ${!k.pid&&k.asana&&k.asana[k.spalte]&&k.asana[k.spalte].gid&&!k.asana[k.spalte].erledigt?`<span class="pill p-blau">Asana: ${esc((ASW[k.spalte]||'').split(':')[0])}</span>`:''}${k.pid?'<span class="pill p-ok">Mieterkonto angelegt</span>':''}${!k.pid&&tage>=7?`<span class="pill p-warn">seit ${tage} Tagen hier</span>`:''}<span class="rechts">${auf?'Zuklappen':'Bearbeiten'}</span></div>${auf?'<div class="ws" id="ws"></div>':''}`;}
function render(){const q=SUCHE.trim().toLowerCase();
  const L=K.filter(k=>!!k.archiv===ARCH&&(!q||[nameVoll(k),k.kontakt,k.wohnung&&k.wohnung.label,k.ziel].join(' ').toLowerCase().includes(q)));
  let h=`<div class="kopf"><div><h1>Neuvermietung</h1><div class="sub">Mietinteressenten, die Eric an das Team übergeben hat oder die ihr mit „Neuer Mietinteressent“ selbst anlegt. Die Selbstauskunft wird vorher unter „Selbstauskünfte“ verschickt. Auf einen Namen klicken, dann wird in der Kachel direkt gearbeitet. Ist ein Schritt erledigt, geht es mit „Fertig – weiter“ in die nächste Kachel. Zu jedem Schritt legt das OS eine Asana-Aufgabe an; ist sie erledigt, springt der Mieter automatisch weiter. Bei „Unterschrieben“ legt das OS das Mieterkonto und in Asana das Projekt 03_EINZUG an.</div></div>

  const mp=t.closest('[data-mapdf]');if(mp){e.preventDefault();maPdf(mp.dataset.mapdf);return;}
  const vd=t.closest('[data-vgldel]');if(vd){const k=K.find(x=>x.id===SEL);kalk(k).vergleich.splice(+vd.dataset.vgldel,1);speichern(k);panel();return;}
  const a=t.closest('[data-a]');if(a){e.preventDefault();const k=K.find(x=>x.id===SEL),w=a.dataset.a;
    if(w==='zu'){SEL=null;render();return;}
    if(w==='weiter'&&k){const i=SP.findIndex(x=>x[0]===k.spalte),n=SP[i+1];if(n){await verschieben(k,n[0]);zuWs();}return;}
    if(w==='arch'){ARCH=!ARCH;render();return;}
    if(w==='neu'){const n={id:rid(),spalte:'selbstauskunft',seit:new Date().toISOString(),angelegt:{von:ICH,am:HEUTE}};K.push(n);if(await speichern(n,'Mietinteressent im OS angelegt')){SEL=n.id;render();zuWs();setTimeout(()=>{const f=document.getElementById('f-vorname');if(f)f.focus();},50);}return;}
    if(w==='konto'&&k&&k.pid){(window.top||window).location.href='/hausverwaltung/mieterkonten?pid='+encodeURIComponent(k.pid);return;}
    if(w==='msaneu'&&k){msaErstellen(k);return;}
    if(w==='msakopie'){const i=document.getElementById('msa-link');try{await navigator.clipboard.writeText(i.value);}catch(x){i.select();document.execCommand('copy');}toast('Link kopiert.');return;}
    if(w==='msamail'&&k){msaMail(k);return;}
    if(w==='msaqr'&&k){const img=document.querySelector('#qrbox img,#qrbox canvas');const u=img?(img.tagName==='CANVAS'?img.toDataURL('image/png'):img.src):'';if(!u)return;const l=document.createElement('a');l.href=u;l.download='QR_Selbstauskunft_'+String(k.name||'Mieter')+'.png';l.click();return;}
    if(w==='msapdf'&&k){msaPdf(k);return;}
    if(w==='msafrei'&&k){msaFreigeben(k);return;}
    if(w==='loeschen'&&k){loeschen(k);return;}
    if(w==='msaman'&&k){msmStart(k);panel();return;}
    if(w==='msmab'){MSM=null;panel();return;}
    if(w==='msmsave'&&k){msmSpeichern(k);return;}
    if(w==='msaab'&&k){if(!darfFreigeben())return;if(!confirm('Mieterselbstauskunft ablehnen? Der Mietinteressent wird ins Archiv gelegt.'))return;k.archiv={grund:'Selbstauskunft abgelehnt',am:HEUTE,von:ICH};k.seit=new Date().toISOString();await speichern(k,'Mieterselbstauskunft abgelehnt');SEL=null;render();toast('Abgelehnt und ins Archiv gelegt.');syncUndLaden();return;}
    if(w==='unterschreiben'&&k){unterschreiben(k);return;}
    if(w==='vtsenden'&&k){vtSenden(k);return;}
    if(w==='masenden'&&k){maSenden(k);return;}
    if(w==='vormiete'&&k){const c=kalk(k);if(!confirm('Die Beträge des letzten Mietverhältnisses erneut als Miete alt und als Startwerte übernehmen? Die jetzigen Beträge werden überschrieben.'))return;POS.forEach(([p])=>{c.pos[p].neu='';});delete c.vormiete;vormiete(k,true);return;}
    if(w==='matext'&&k){const a=maDaten(k);delete a.betreff;delete a.text;speichern(k);panel();return;}
    if(w==='vtstand'&&k){vtStand(k);return;}
    if(w==='vtstorno'&&k){vtStorno(k);return;}
    if(w==='vtpdf'&&k){vtPdf(k);return;}
    if(w==='vtvorschau'&&k){try{const {gesamt}=vtErstellen(k,true);if(gesamt)window.open(URL.createObjectURL(gesamt.output('blob')),'_blank');}catch(x){toast('Vorschau nicht möglich: '+(x.message||x),7000);}return;}
    if(w==='einzug'&&k){try{const r=await api('/api/neuvermietung',{aktion:'einzug',id:k.id});if(r.einzug){k.asana=k.asana||{};k.asana.einzug=r.einzug;panel();toast('Asana-Projekt angelegt.');}else toast(r.hinweis||'Nicht angelegt.',7000);}catch(e){toast('Nicht angelegt: '+(e.message||e),8000);}return;}
    if(w==='vgladd'&&k){const c=kalk(k);(c.vergleich=c.vergleich||[]).push({});speichern(k);panel();return;}
    if(w==='vglobj'&&k){vglAusObjekt(k);return;}
    if(w==='archiv'&&k){const g=(document.getElementById('f-grund')||{}).value||'';if(!g.trim()){toast('Bitte einen Grund eintragen.');return;}k.archiv={grund:g.trim(),am:HEUTE,von:ICH};k.seit=new Date().toISOString();speichern(k,'Ins Archiv: '+g.trim()).then(()=>{SEL=null;panel();render();toast('Ins Archiv verschoben.');});return;}
    if(w==='abschluss'&&k&&k.pid){k.archiv={grund:'Vermietet – Mieterkonto angelegt',am:HEUTE,von:ICH};k.seit=new Date().toISOString();speichern(k,'Vermietung abgeschlossen und ins Archiv gelegt').then(()=>{SEL=null;panel();render();toast('Abgeschlossen und ins Archiv gelegt.');});return;}
    if(w==='zurueck'&&k){delete k.archiv;k.seit=new Date().toISOString();speichern(k,'Aus dem Archiv zurückgeholt').then(()=>{panel();render();});return;}
    return;}
  const kt=t.closest('.zeile[data-k]');if(kt){SEL=SEL===kt.dataset.k?null:kt.dataset.k;render();if(SEL)zuWs();return;}});
/* Vergleichswohnungen aus den laufenden Mietverhältnissen desselben Objekts */
async function vglAusObjekt(k){const e=k.wohnung&&einVon(k.wohnung.einheit_id),o=e&&objVon(e.objekt_id);if(!o){toast('Bitte zuerst die Wohnung wählen.');return;}
  const {data}=await sb.from('os_docs').select('pid:data->>pid,unit:data->>unit,bis:data->>bis,mieter:data->>mieter,stufen:data->stufen,einheit:data->>einheit').eq('app','oc').like('pfad','mietkonten/%').eq('data->>obj',o.kz);
  const c=kalk(k);c.vergleich=c.vergleich||[];let n=0;
  for(const m of data||[]){if(m.bis&&m.bis<HEUTE)continue;const st=(m.stufen||[]).filter(x=>x.total>0).sort((a,b)=>String(a.ab).localeCompare(String(b.ab))).pop();if(!st||!st.kalt)continue;
    const ei=E.find(x=>x.objekt_id===o.id&&((x.nahaus_id&&x.nahaus_id===m.unit)||x.id===m.unit));if(ei&&ei.id===e.id)continue;
    c.vergleich.push({geb:o.kz,we:ei?ei.bezeichnung:(m.einheit||''),lage:ei&&ei.lage||'',name:m.mieter||'',kalt:st.kalt,wfl:ei&&ei.flaeche||'',zimmer:ei&&ei.zimmer||''});n++;}
  speichern(k);panel();toast(n?n+' Wohnung'+(n>1?'en':'')+' übernommen.':'Keine weiteren vermieteten Wohnungen in diesem Objekt gefunden.');}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SEL&&!(e.target&&e.target.closest&&e.target.closest('input,textarea'))){SEL=null;render();}});
/* Ziehen und Ablegen */
let ZIEH=null;
document.addEventListener('dragstart',e=>{const k=e.target.closest&&e.target.closest('.zeile[data-k]');if(!k)return;ZIEH=k.dataset.k;e.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',e=>{const s=e.target.closest&&e.target.closest('[data-spalte]');if(!s||!ZIEH)return;e.preventDefault();document.querySelectorAll('.spalte.ziel').forEach(x=>x!==s&&x.classList.remove('ziel'));s.classList.add('ziel');});
document.addEventListener('drop',e=>{const s=e.target.closest&&e.target.closest('[data-spalte]');document.querySelectorAll('.spalte.ziel').forEach(x=>x.classList.remove('ziel'));if(!s||!ZIEH)return;e.preventDefault();const k=K.find(x=>x.id===ZIEH);ZIEH=null;if(k)verschieben(k,s.dataset.spalte);});
document.addEventListener('dragend',()=>{ZIEH=null;document.querySelectorAll('.spalte.ziel').forEach(x=>x.classList.remove('ziel'));});
setInterval(()=>{if(document.visibilityState==='visible'&&!SEL)laden();},60000);
laden();
</script></body></html>
