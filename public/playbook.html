<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wohntraum Playbook</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#ffffff;--sidebar:#fbfbfa;--line:#ecebe9;--text:#37352f;--muted:#9b9a97;--accent:#2383e2;--hover:#efefed;--sel:#e8e7e4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;font-size:15px;line-height:1.6}
.app{display:flex;height:100vh;overflow:hidden}
/* Sidebar */
.side{width:300px;flex:0 0 300px;background:var(--sidebar);border-right:1px solid var(--line);overflow-y:auto;padding:10px 6px 40px}
.side .brand{font-weight:700;font-size:15px;padding:10px 12px 6px;display:flex;align-items:center;gap:8px}
.side .search{margin:4px 10px 10px}
.side .search input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;background:#fff}
.nav{list-style:none}
.nav li{list-style:none}
.navrow{display:flex;align-items:center;gap:4px;padding:4px 8px;margin:1px 4px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--text)}
.navrow:hover{background:var(--hover)}
.navrow.sel{background:var(--sel);font-weight:600}
.navrow .tw{width:16px;flex:0 0 16px;text-align:center;color:var(--muted);font-size:11px;cursor:pointer;user-select:none}
.navrow .ic{flex:0 0 auto}
.navrow .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navrow.e1{font-weight:600}
.navrow.e2 .tx,.navrow.e3 .tx{color:#55534e}
.hidden{display:none}
/* Main */
.main{flex:1;overflow-y:auto}
.doc{max-width:820px;margin:0 auto;padding:56px 60px 120px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.doc h1.title{font-size:36px;font-weight:800;line-height:1.2;margin:4px 0 22px;letter-spacing:-.01em}
.toolbar{display:flex;gap:8px;margin-bottom:18px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;color:var(--text)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.content h1{font-size:28px;font-weight:700;margin:30px 0 10px;letter-spacing:-.01em}
.content h2{font-size:22px;font-weight:700;margin:26px 0 8px}
.content h3{font-size:18px;font-weight:700;margin:20px 0 6px}
.content h4{font-size:16px;font-weight:700;margin:16px 0 4px}
.content p{margin:8px 0}
.content ul,.content ol{margin:8px 0 8px 26px}
.content li{margin:3px 0}
.content a{color:var(--accent);text-decoration:none}
.content a:hover{text-decoration:underline}
.content blockquote{border-left:3px solid var(--text);margin:12px 0;padding:2px 0 2px 14px;color:#4b4a46}
.content code{background:#f1f1ef;border-radius:4px;padding:1px 5px;font-family:'SFMono-Regular',Consolas,monospace;font-size:85%}
.content pre{background:#f7f6f3;border:1px solid var(--line);border-radius:8px;padding:14px;overflow:auto;margin:12px 0}
.content pre code{background:none;padding:0}
.content hr{border:none;border-top:1px solid var(--line);margin:22px 0}
.content table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13.5px;display:block;overflow-x:auto}
.content th,.content td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.content th{background:#f7f6f3;font-weight:600}
.content img{max-width:100%;border-radius:8px}
.editor{width:100%;min-height:60vh;border:1px solid var(--line);border-radius:8px;padding:16px;font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;line-height:1.6;resize:vertical}
.srcnote{font-size:12px;color:var(--muted);margin-top:40px;border-top:1px solid var(--line);padding-top:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#37352f;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1}
.empty{color:var(--muted);font-style:italic;margin-top:20px}
@media(max-width:780px){.side{position:fixed;z-index:20;height:100vh;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.doc{padding:40px 22px 100px}.burger{display:inline-flex!important}}
.burger{display:none;position:fixed;top:12px;left:12px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:pointer}
</style></head><body>
<div class="burger" onclick="document.querySelector('.side').classList.toggle('open')">☰</div>
<div class="app">
  <div class="side">
    <div class="brand">🏠 Wohntraum Playbook</div>
    <div class="search"><input id="q" placeholder="Suchen …" oninput="filterNav()"></div>
    <ul class="nav" id="nav"></ul>
  </div>
  <div class="main"><div class="doc" id="doc"></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700);}
let PAGES=[], CUR=null, collapsed={}, editing=false;
marked.setOptions({gfm:true,breaks:true});
async function load(){
  const res=await fetch('/playbook-data.json');PAGES=await res.json();
  // DB-Overrides (bearbeitete Seiten) überlagern
  try{const {data}=await sb.from('playbook_seiten').select('sort,titel,inhalt_md');
    if(data){const by={};data.forEach(r=>by[r.sort]=r);PAGES.forEach(p=>{const o=by[p.sort];if(o){if(o.inhalt_md!=null)p.md=o.inhalt_md;if(o.titel)p.titel=o.titel;}});}
  }catch(e){}
  buildNav();
  const h=parseInt(location.hash.replace('#p',''),10);
  openPage(PAGES.find(p=>p.sort===h)||PAGES[0]);
}
function childrenOf(p,idx){ // nächste Seiten mit höherer Ebene bis gleich/niedriger
  const res=[];for(let i=idx+1;i<PAGES.length;i++){if(PAGES[i].ebene<=p.ebene)break;if(PAGES[i].ebene===p.ebene+1)res.push(i);}return res;
}
function hasKids(idx){const p=PAGES[idx];return idx+1<PAGES.length&&PAGES[idx+1].ebene>p.ebene;}
function buildNav(){
  const ul=document.getElementById('nav');ul.innerHTML='';
  PAGES.forEach((p,idx)=>{
    const li=document.createElement('li');li.dataset.idx=idx;
    // sichtbar nur, wenn kein Vorfahr collapsed
    let hideByCollapse=false;
    for(let i=idx-1;i>=0;i--){if(PAGES[i].ebene<p.ebene){if(collapsed[i]){hideByCollapse=true;break;}if(PAGES[i].ebene===1)break;}}
    const kids=hasKids(idx);
    li.className='navwrap'+(hideByCollapse?' hidden':'');
    li.innerHTML=`<div class="navrow e${p.ebene} ${CUR&&CUR.sort===p.sort?'sel':''}" style="padding-left:${8+(p.ebene-1)*16}px" onclick="openIdx(${idx})">
      <span class="tw" onclick="event.stopPropagation();toggle(${idx})">${kids?(collapsed[idx]?'▸':'▾'):''}</span>
      <span class="tx">${esc(p.titel)}</span></div>`;
    ul.appendChild(li);
  });
}
function toggle(idx){collapsed[idx]=!collapsed[idx];buildNav();}
function openIdx(i){openPage(PAGES[i]);if(window.innerWidth<=780)document.querySelector('.side').classList.remove('open');}
function crumb(p){const parts=[];if(p.kapitel&&p.kapitel!==p.titel)parts.push(p.kapitel);if(p.parent&&p.parent!==p.kapitel&&p.parent!==p.titel)parts.push(p.parent);return parts.join(' / ');}
function openPage(p){
  if(!p)return;CUR=p;editing=false;location.hash='p'+p.sort;buildNav();
  const doc=document.getElementById('doc');
  const body=p.md&&p.md.trim()?marked.parse(p.md):'<div class="empty">Diese Seite ist (noch) leer.</div>';
  doc.innerHTML=`${crumb(p)?`<div class="crumb">${esc(crumb(p))}</div>`:''}
    <h1 class="title">${esc(p.titel)}</h1>
    <div class="toolbar"><button class="btn" onclick="edit()">✎ Bearbeiten</button></div>
    <div class="content">${body}</div>
    ${p.notion_url?`<div class="srcnote">1:1 übernommen aus Notion · <a href="${esc(p.notion_url)}" target="_blank">Original in Notion öffnen</a></div>`:''}`;
  document.querySelector('.main').scrollTop=0;
}
function edit(){
  editing=true;const p=CUR;const doc=document.getElementById('doc');
  doc.innerHTML=`<div class="crumb">${esc(crumb(p))}</div><h1 class="title">${esc(p.titel)}</h1>
    <div class="toolbar"><button class="btn pri" onclick="save()">Speichern</button><button class="btn" onclick="openPage(CUR)">Abbrechen</button></div>
    <textarea class="editor" id="ed"></textarea>`;
  document.getElementById('ed').value=p.md||'';
}
async function save(){
  const p=CUR;const md=document.getElementById('ed').value;
  p.md=md;
  const {error}=await sb.from('playbook_seiten').upsert({sort:p.sort,titel:p.titel,kapitel:p.kapitel,parent:p.parent,ebene:p.ebene,notion_url:p.notion_url,tags:p.tags,inhalt_md:md,updated_at:new Date().toISOString()},{onConflict:'sort'});
  if(error){toast('Fehler: '+error.message);return;}
  toast('Gespeichert ✓');openPage(p);
}
function filterNav(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  document.querySelectorAll('#nav .navwrap').forEach(li=>{
    const idx=+li.dataset.idx;const p=PAGES[idx];
    if(!q){buildNav();return;}
    const hit=(p.titel+' '+p.kapitel).toLowerCase().includes(q)||(p.md||'').toLowerCase().includes(q);
    li.classList.toggle('hidden',!hit);
  });
}
load();
</script></body></html>
