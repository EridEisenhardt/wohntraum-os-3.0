<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entwicklung · GF-Übersicht</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--surf:#fff;--surf2:#f1f3f6;--line:#e6e8ec;--text:#1c2024;--muted:#6b7280;--accent:#0f9d6b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
.hdr{background:var(--surf);border-bottom:1px solid var(--line);padding:16px 24px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hdr-title{font-size:18px;font-weight:700} .hdr-sub{font-size:12px;color:var(--muted);margin-top:2px}
.wrap{max-width:1500px;margin:20px auto;padding:0 18px}
.cols{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}
.pillar{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:9px;min-width:300px;width:300px;flex:0 0 auto}
.phead{border-radius:10px;padding:10px 12px;color:#1c2024;display:flex;align-items:center;gap:6px}
.phead input{flex:1;min-width:0;font:inherit;font-weight:800;font-size:15px;background:transparent;border:none;color:#1c2024;padding:2px 4px;border-radius:6px}
.phead input:focus{outline:2px solid rgba(0,0,0,.15);background:rgba(255,255,255,.4)}
.p1{background:linear-gradient(135deg,#fde2e0,#f7c6c1)} .p2{background:linear-gradient(135deg,#dbe7fb,#bcd2f5)}
.p3{background:linear-gradient(135deg,#d6f0dd,#b6e3c3)} .p4{background:linear-gradient(135deg,#fdeecf,#f7dca0)}
.p5{background:linear-gradient(135deg,#e7ddfb,#cdbaf3)} .p6{background:linear-gradient(135deg,#d3f1f0,#aee0de)}
.p7{background:linear-gradient(135deg,#fbdde8,#f4b6cd)}
.card{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;transition:.12s}
.card.sub{margin-left:16px;background:#fbfcfd;border-left:3px solid #cbd5e1}
.crow{display:flex;align-items:center;gap:6px}
.ctitle{flex:1;min-width:0;font-weight:600;font:inherit;font-size:13.5px;font-weight:600;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;color:var(--text)}
.ctitle:hover{border-color:var(--line)} .ctitle:focus{outline:none;border-color:#c3c8d0;background:#fff}
.ico{cursor:pointer;border:none;background:none;color:var(--muted);font-size:15px;line-height:1;padding:3px}
.ico:hover{color:var(--text)} .ico.del:hover{color:#c0392b}
.badge{font-size:9.5px;padding:2px 6px;border-radius:20px;background:#e6e8ec;color:#4b5563;white-space:nowrap;cursor:pointer}
.badge.has{background:#0f9d6b;color:#fff}
.editor{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;display:none}
.editor.open{display:block}
.editor label{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.editor input,.editor textarea{width:100%;font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;margin:3px 0 7px;background:#fff;color:var(--text)}
.editor textarea{min-height:56px;resize:vertical}
.linkrow{margin:-3px 0 7px}.linkrow a{font-size:11.5px;color:#2563eb;text-decoration:none}
.addbtn{background:none;border:1px dashed #c3c8d0;color:var(--muted);border-radius:8px;padding:7px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;width:100%}
.addbtn:hover{color:var(--text);border-color:#9aa1ab}
.subadd{font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 4px;margin-top:2px}
.subadd:hover{color:var(--accent)}
.newcol{min-width:230px;width:230px;flex:0 0 auto}
.newcol button{width:100%;height:100%;min-height:120px;border:2px dashed #c3c8d0;border-radius:14px;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.newcol button:hover{color:var(--text);border-color:#9aa1ab}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2024;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1}
</style></head><body>
<div class="hdr"><div><div class="hdr-title">Entwicklung · GF-Übersicht</div><div class="hdr-sub">Wie komme ich aufs nächste Level · Karte anklicken → Asana &amp; Notizen · Aufgaben, Unteraufgaben und Hauptthemen frei erweiterbar</div></div></div>
<div class="wrap"><div class="cols" id="cols"></div></div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
function isUrl(s){return /^https?:\/\//i.test((s||'').trim());}
let SPALTEN=[], ITEMS=[];
const PALETTE=['p1','p2','p3','p4','p5','p6','p7'];
function colCls(sp,i){return (sp.cls&&sp.cls!=='pc')?sp.cls:PALETTE[i%PALETTE.length];}
function cardHtml(it,sub){
  const has=(it.asana&&it.asana.trim())||(it.notiz&&it.notiz.trim());
  const kids=ITEMS.filter(x=>x.parent_id===it.id).sort((a,b)=>a.pos-b.pos);
  return `<div class="card${sub?' sub':''}">
    <div class="crow">
      <input class="ctitle" value="${esc(it.titel)}" onchange="saveField('${it.id}','titel',this.value)">
      <span class="badge${has?' has':''}" title="Details" onclick="toggle('${it.id}')">${has?'●':'…'}</span>
      <button class="ico del" title="Löschen" onclick="delItem('${it.id}')">✕</button>
    </div>
    <div class="editor" id="ed-${it.id}">
      <label>Asana-Projekt (Link oder Name)</label>
      <input id="as-${it.id}" value="${esc(it.asana)}" placeholder="https://app.asana.com/…" onchange="saveField('${it.id}','asana',this.value)">
      <div class="linkrow" id="lk-${it.id}">${isUrl(it.asana)?`<a href="${esc(it.asana)}" target="_blank" rel="noopener">↗ Asana öffnen</a>`:''}</div>
      <label>Notizen</label>
      <textarea id="nt-${it.id}" placeholder="Gedanken, nächste Schritte…" onchange="saveField('${it.id}','notiz',this.value)">${esc(it.notiz)}</textarea>
    </div>
    ${kids.map(k=>cardHtml(k,true)).join('')}
    ${sub?'':`<button class="subadd" onclick="addItem('${it.spalte_id}','${it.id}')">+ Unteraufgabe</button>`}
  </div>`;
}
function render(){
  const el=document.getElementById('cols');
  const cols=SPALTEN.map((sp,i)=>{
    const tops=ITEMS.filter(x=>x.spalte_id===sp.id && !x.parent_id).sort((a,b)=>a.pos-b.pos);
    return `<div class="pillar">
      <div class="phead ${colCls(sp,i)}">
        <input value="${esc(sp.titel)}" onchange="saveSpalte('${sp.id}',this.value)">
        <button class="ico del" title="Spalte löschen" onclick="delSpalte('${sp.id}')">✕</button>
      </div>
      ${tops.map(t=>cardHtml(t,false)).join('')}
      <button class="addbtn" onclick="addItem('${sp.id}',null)">+ Aufgabe</button>
    </div>`;
  }).join('');
  el.innerHTML=cols+`<div class="pillar newcol"><button onclick="addSpalte()">+ Neues Hauptthema<br><span style="font-weight:400;font-size:12px">(eigene Spalte)</span></button></div>`;
}
function toggle(id){const e=document.getElementById('ed-'+id);if(e)e.classList.toggle('open');}
async function saveField(id,field,val){
  const v=(val&&val.trim())?val.trim():(field==='titel'?'(ohne Titel)':null);
  const res=await sb.from('entwicklung_items').update({[field]:v}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  const it=ITEMS.find(x=>x.id===id); if(it)it[field]=v;
  if(field==='asana'){const lk=document.getElementById('lk-'+id); if(lk)lk.innerHTML=isUrl(v)?`<a href="${esc(v)}" target="_blank" rel="noopener">↗ Asana öffnen</a>`:'';}
  if(field==='titel'){toast('Gespeichert ✓');}
  else{const has=(it.asana&&it.asana.trim())||(it.notiz&&it.notiz.trim());toast('Gespeichert ✓');}
}
async function addItem(spalteId,parentId){
  const sameLevel=ITEMS.filter(x=>x.spalte_id===spalteId && (parentId?x.parent_id===parentId:!x.parent_id));
  const pos=sameLevel.length?Math.max(...sameLevel.map(x=>x.pos||0))+1:1;
  const row={spalte_id:spalteId,parent_id:parentId||null,titel:parentId?'Neue Unteraufgabe':'Neue Aufgabe',pos:pos};
  const res=await sb.from('entwicklung_items').insert(row).select();
  if(res.error){toast('Fehler: '+res.error.message);return;}
  ITEMS.push(res.data[0]); render();
}
async function delItem(id){
  const kids=ITEMS.filter(x=>x.parent_id===id).length;
  if(!confirm('Diese '+(kids?'Aufgabe inkl. Unteraufgaben':'Aufgabe')+' löschen?'))return;
  const res=await sb.from('entwicklung_items').delete().eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  ITEMS=ITEMS.filter(x=>x.id!==id && x.parent_id!==id); render();
}
async function addSpalte(){
  const titel=prompt('Titel des neuen Hauptthemas:');
  if(titel==null||!titel.trim())return;
  const pos=SPALTEN.length?Math.max(...SPALTEN.map(s=>s.pos||0))+1:1;
  const cls=PALETTE[SPALTEN.length%PALETTE.length];
  const res=await sb.from('entwicklung_spalten').insert({titel:titel.trim(),cls:cls,pos:pos}).select();
  if(res.error){toast('Fehler: '+res.error.message);return;}
  SPALTEN.push(res.data[0]); render(); toast('Hauptthema angelegt ✓');
}
async function saveSpalte(id,val){
  const v=(val&&val.trim())?val.trim():'(ohne Titel)';
  const res=await sb.from('entwicklung_spalten').update({titel:v}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  const sp=SPALTEN.find(x=>x.id===id); if(sp)sp.titel=v; toast('Gespeichert ✓');
}
async function delSpalte(id){
  if(!confirm('Ganzes Hauptthema inkl. aller Aufgaben löschen?'))return;
  const res=await sb.from('entwicklung_spalten').delete().eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  SPALTEN=SPALTEN.filter(x=>x.id!==id); ITEMS=ITEMS.filter(x=>x.spalte_id!==id); render();
}
async function load(){
  const [rs,ri]=await Promise.all([
    sb.from('entwicklung_spalten').select('*').order('pos'),
    sb.from('entwicklung_items').select('*').order('pos')
  ]);
  if(rs.error){toast('Fehler: '+rs.error.message);return;}
  SPALTEN=rs.data||[]; ITEMS=ri.error?[]:(ri.data||[]);
  render();
}
load();
</script>
</body></html>
