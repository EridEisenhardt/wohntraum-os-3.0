<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entwicklung · GF-Übersicht</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--surf:#fff;--surf2:#f1f3f6;--line:#e6e8ec;--text:#1c2024;--muted:#6b7280;--accent:#0f9d6b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
.hdr{background:var(--surf);border-bottom:1px solid var(--line);padding:16px 24px;position:sticky;top:0;z-index:10}
.hdr-title{font-size:18px;font-weight:700} .hdr-sub{font-size:12px;color:var(--muted);margin-top:2px}
.wrap{max-width:1200px;margin:22px auto;padding:0 20px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.pillar{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.phead{border-radius:10px;padding:12px 14px;font-weight:800;font-size:15px;color:#1c2024}
.p1{background:linear-gradient(135deg,#fde2e0,#f7c6c1)}
.p2{background:linear-gradient(135deg,#dbe7fb,#bcd2f5)}
.p3{background:linear-gradient(135deg,#d6f0dd,#b6e3c3)}
.card{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;transition:.12s}
.card:hover{border-color:#c3c8d0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card.sub{margin-left:14px;background:#fbfcfd}
.card .t{font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .desc{font-size:11.5px;color:var(--muted);margin-top:2px}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;background:#e6e8ec;color:#4b5563;white-space:nowrap}
.badge.has{background:#0f9d6b;color:#fff}
.editor{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px;display:none}
.editor.open{display:block}
.editor label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.editor input,.editor textarea{width:100%;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin:3px 0 8px;background:#fff;color:var(--text)}
.editor textarea{min-height:66px;resize:vertical}
.linkrow{display:flex;gap:8px;align-items:center;margin:-2px 0 8px}
.linkrow a{font-size:12px;color:#2563eb;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savebtn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 13px;font:inherit;font-weight:600;font-size:12.5px;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2024;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1}
</style></head><body>
<div class="hdr"><div class="hdr-title">Entwicklung · GF-Übersicht</div><div class="hdr-sub">Wie komme ich aufs nächste Level · Karte anklicken → Asana-Projekt &amp; Notizen hinterlegen</div></div>
<div class="wrap"><div class="cols" id="cols"></div></div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700);}
// Struktur aus dem Bild „GF Übersicht in Claude"
const PILLARS=[
 {cls:'p1',title:'Profitables Wachstumsfranchise',cards:[
   {k:'kontenmodell',t:'6 Kontenmodell'},
   {k:'liquiditaet',t:'Liquidität verbessern'},
   {k:'immo_finanz',t:'Immobilien finanzieren'},
   {k:'co_investoren',t:'Co-Investoren'},
   {k:'cashflow',t:'Cashflow verbessern'},
   {k:'engpass_tool',t:'Engpassanalyse-Tool'},
   {k:'einkommensstroeme',t:'Mehr Einkommensströme',sub:[
     {k:'waerme_contracting',t:'Wärme-Contracting'},
     {k:'mieter_strom',t:'Mieter-Strom'},
     {k:'drme_provision',t:'DRME-Provision'},
   ]},
 ]},
 {cls:'p2',title:'Gipfelkreuzmission',cards:[
   {k:'zustaendigkeiten',t:'Zuständigkeiten klären'},
   {k:'wohntraum_os',t:'Wohntraum OS über Claude'},
   {k:'feste_tage',t:'Feste Tage',desc:'Fr. Unternehmer-Tag · 1 Tag nur operative To-dos'},
   {k:'probesterben',t:'Probesterben',desc:'→ Brachstellen erkennen'},
 ]},
 {cls:'p3',title:'Mehr Energie',cards:[
   {k:'bewusste_erholung',t:'Bewusste Erholung',desc:'Energieräuber weg'},
   {k:'haushaltshilfe',t:'Haushaltshilfe'},
   {k:'sport_gesundheit',t:'250 Einheiten Sport & Gesundheit'},
 ]},
];
let DATA={};
function isUrl(s){return /^https?:\/\//i.test((s||'').trim());}
function cardHtml(c,sub){
 const d=DATA[c.k]||{}; const has=(d.asana&&d.asana.trim())||(d.notiz&&d.notiz.trim());
 return `<div class="card${sub?' sub':''}" data-k="${c.k}">
   <div class="t" onclick="toggle('${c.k}')"><span>${esc(c.t)}</span><span class="badge${has?' has':''}" id="bdg-${c.k}">${has?'hinterlegt':'leer'}</span></div>
   ${c.desc?`<div class="desc">${esc(c.desc)}</div>`:''}
   <div class="editor" id="ed-${c.k}">
     <label>Asana-Projekt (Link oder Name)</label>
     <input id="as-${c.k}" value="${esc(d.asana)}" placeholder="https://app.asana.com/… oder Projektname">
     <div class="linkrow" id="lk-${c.k}">${isUrl(d.asana)?`<a href="${esc(d.asana)}" target="_blank" rel="noopener">↗ Asana öffnen</a>`:''}</div>
     <label>Notizen</label>
     <textarea id="nt-${c.k}" placeholder="Gedanken, nächste Schritte, Ideen…">${esc(d.notiz)}</textarea>
     <button class="savebtn" onclick="save('${c.k}')">Speichern</button>
   </div>
 </div>`;
}
function render(){
 document.getElementById('cols').innerHTML=PILLARS.map(p=>`<div class="pillar">
   <div class="phead ${p.cls}">${esc(p.title)}</div>
   ${p.cards.map(c=>cardHtml(c,false)+(c.sub?c.sub.map(s=>cardHtml(s,true)).join(''):'')).join('')}
 </div>`).join('');
}
function toggle(k){document.getElementById('ed-'+k).classList.toggle('open');}
async function save(k){
 const asana=document.getElementById('as-'+k).value.trim();
 const notiz=document.getElementById('nt-'+k).value.trim();
 const res=await sb.from('entwicklung_karten').upsert({card_key:k,asana:asana||null,notiz:notiz||null,updated_at:new Date().toISOString()});
 if(res.error){toast('Fehler: '+res.error.message);return;}
 DATA[k]={asana,notiz};
 const lk=document.getElementById('lk-'+k); if(lk)lk.innerHTML=isUrl(asana)?`<a href="${esc(asana)}" target="_blank" rel="noopener">↗ Asana öffnen</a>`:'';
 const b=document.getElementById('bdg-'+k); const has=asana||notiz; b.textContent=has?'hinterlegt':'leer'; b.className='badge'+(has?' has':'');
 toast('Gespeichert ✓');
}
async function load(){
 const res=await sb.from('entwicklung_karten').select('*');
 if(!res.error&&res.data){res.data.forEach(r=>{DATA[r.card_key]={asana:r.asana||'',notiz:r.notiz||''};});}
 render();
}
load();
</script>
</body></html>
