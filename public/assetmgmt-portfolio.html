<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio · Assetmanagement</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--surf:#fff;--surf2:#f1f3f6;--line:#e6e8ec;--text:#1c2024;--muted:#6b7280;--dim:#4b5563;--accent:#185fa5;--green:#1f7a4d;--red:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
.hdr{background:var(--surf);border-bottom:1px solid var(--line);padding:14px 22px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hdr-title{font-size:17px;font-weight:700}.hdr-sub{font-size:11.5px;color:var(--muted)}
.wrap{max-width:100%;margin:14px auto;padding:0 16px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.kpi .l{font-size:10px;text-transform:uppercase;color:var(--muted)}.kpi .v{font-size:18px;font-weight:700;margin-top:2px}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar input[type=text],.bar select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--text)}
.bar input[type=text]{min-width:220px}
.btn{font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surf2);color:var(--text);cursor:pointer}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.count{font-size:12px;color:var(--muted)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surf);max-height:75vh}
table{border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid #f0f1f3;text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:9.5px;text-transform:uppercase;color:var(--muted);background:var(--surf2);position:sticky;top:0;z-index:2}
th.grp{text-align:center;color:#fff}
th.g0{background:#41506b}th.g1{background:#2f6db0}th.g2{background:#1f7a4d}th.g3{background:#8a5a1e}th.g4{background:#7b53b8}th.g5{background:#565f6b}
td:first-child,th:first-child{position:sticky;left:0;z-index:1;background:var(--surf)}
th:first-child{z-index:3}
td.kn{font-weight:700;color:var(--accent)}
td input,td select{width:100%;min-width:70px;font:inherit;font-size:12px;padding:4px 5px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--text)}
td input:hover,td select:hover{border-color:var(--line)}td input:focus,td select:focus{outline:none;border-color:var(--accent);background:var(--surf)}
td.num input{text-align:right}
tr.own-eric td{background:#eceef1}tr.own-eric td:first-child{background:#e4e6ea}
tr.own-gmbh td{background:#e7f0fb}tr.own-gmbh td:first-child{background:#dbe8f8}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2024;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:50}.toast.show{opacity:1}
</style></head><body>
<div class="hdr">
  <div><div class="hdr-title">🏦 Portfolio · Assetmanagement</div><div class="hdr-sub">Objektdaten, Finanzierung &amp; Cashflow je Immobilie · editierbar</div></div>
  <div style="display:flex;gap:8px">
    <button class="btn" onclick="exportCSV()">⬇︎ CSV Export</button>
    <button class="btn btn-accent" onclick="addRow()">+ Objekt</button>
  </div>
</div>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="bar">
    <input type="text" id="q" placeholder="🔍 Objekt / Typ / Bank…" oninput="render()">
    <select id="fEig" onchange="render()"><option value="">Alle Eigentümer</option><option>Eric Eisenhardt</option><option>Wohn(T)raum Rheinhessen GmbH</option></select>
    <span class="count" id="cnt"></span>
  </div>
  <div class="scroll"><table id="tbl"><thead id="thead"></thead><tbody></tbody></table></div>
</div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700);}
const nf=new Intl.NumberFormat('de-DE',{maximumFractionDigits:0});
const eur=v=>v==null||v===''?'':nf.format(Math.round(Number(v)))+' €';
let ROWS=[];
const EIG=['Eric Eisenhardt','Wohn(T)raum Rheinhessen GmbH'];
const TYPEN=['Mehrfamilienhaus','Wohn- und Geschäftshaus','Reihenmittelhaus','Eigentumswohnung','Mietwohnung','2 Familienhaus','Sonstiges'];
const STATI=['Erwerb abgeschlossen','In Ankauf','Verkauf beim Notar unterschrieben','Verkauft','Ohne Laufzeit'];
// [dbcol,label,type,gruppe]  type: t=text s=select n=num i=int p=prozent d=datum
const COLS=[
 ['kennung','Kennung','t',0],['eigentuemer','Eigentümer','s',0],['immobilien_typ','Typ','s',0],['status','Status','s',0],
 ['grundbuch','Amtsgericht/Grundbuch','t',0],['gemarkung','Gemarkung/Flur/Flurstück','t',0],['notarvertrag','Notarvertrag','d',0],['nutzen_lasten','Nutzen/Lasten ab','d',0],['baujahr','Baujahr','i',0],
 ['wohn_einheiten','Wohn-EH','i',1],['gewerbe_einheiten','Gewerbe-EH','i',1],['stellplaetze','Stellpl.','i',1],['garage','Garage','i',1],['qm_wfl','qm Wfl','n',1],['qm_gewerbe','qm Gew','n',1],['qm_grund','qm Grund','n',1],
 ['kaufpreis','Kaufpreis','n',2],['aufwertung','Aufwertung','n',2],['invest_summe','Invest-Summe','n',2],['verkehrswert','Verkehrswert','n',2],['wertzuwachs','Wertzuwachs','n',2],
 ['kaltmiete_ist','Kaltmiete p.a. IST','n',3],['zielmiete_soll','Zielmiete p.a. SOLL','n',3],['faktor_ist','Faktor IST','n',3],['rendite_ist','Rendite % IST','p',3],['rendite_soll','Rendite % SOLL','p',3],
 ['kapitaldienst_eur','Kapitaldienst €','n',4],['kapitaldienst_pct','Kapitaldienst %','p',4],['zins_pct','Zins %','p',4],['tilgung_pct','Tilgung %','p',4],['zins_eur','Zins €','n',4],['tilgung_eur','Tilgung €','n',4],['restschuld','Restschuld','n',4],['restschuld_nach_zb','Restschuld n. ZB','n',4],['zinsbindung','Zinsbindung','t',4],['bank','Finanz. Bank','s',4],
 ['bewirtschaftung','Bewirtschaftung','n',5],['cashflow_vst','Cashflow vSt','n',5],['notiz','Notiz','t',5],
];
const GRP=[[0,'Stammdaten','g0'],[1,'Einheiten & Flächen','g1'],[2,'Werte','g2'],[3,'Miete & Rendite','g3'],[4,'Finanzierung','g4'],[5,'Cashflow','g5']];
function distinct(f){return [...new Set(ROWS.map(r=>r[f]).filter(v=>v!=null&&v!==''))].sort((a,b)=>String(a).localeCompare(String(b),'de'));}
function selOpts(c,sel){let base=c==='eigentuemer'?EIG:c==='immobilien_typ'?TYPEN:c==='status'?STATI:c==='bank'?distinct('bank'):[];
  base=[...new Set(base.concat(distinct(c)))];
  return '<option value="">—</option>'+base.map(v=>'<option'+(String(v)===String(sel)?' selected':'')+'>'+esc(v)+'</option>').join('');}
function ownerClass(e){if(!e)return '';if(String(e).includes('GmbH'))return 'own-gmbh';if(String(e).startsWith('Eric'))return 'own-eric';return '';}
async function save(id,col,val,type){
  let v;
  if(type==='n'||type==='p')v=(val===''||val==null)?null:Number(String(val).replace(/\./g,'').replace(',','.'));
  else if(type==='i')v=(val===''||val==null)?null:parseInt(String(val).replace(/\D/g,''),10);
  else if(type==='d')v=val||null;
  else v=(val&&val.trim())?val.trim():null;
  if((type==='n'||type==='p'||type==='i')&&isNaN(v))v=null;
  const res=await sb.from('assetmgmt_portfolio').update({[col]:v}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  const r=ROWS.find(x=>x.id===id);if(r)r[col]=v;
  if(col==='eigentuemer')render();else{toast('Gespeichert ✓');renderKpis();}
}
async function addRow(){const r=await sb.from('assetmgmt_portfolio').insert({kennung:'NEU',eigentuemer:'Wohn(T)raum Rheinhessen GmbH',pos:ROWS.length}).select();if(r.error)return toast(r.error.message);ROWS.push(r.data[0]);render();toast('Objekt angelegt');}
async function del(id){if(!confirm('Objekt löschen?'))return;const res=await sb.from('assetmgmt_portfolio').delete().eq('id',id);if(res.error)return toast(res.error.message);ROWS=ROWS.filter(x=>x.id!==id);render();}
function cell(r,c){const [col,lbl,type]=c;const v=r[col];
  if(type==='s')return '<td><select style="min-width:130px" onchange="save(\''+r.id+'\',\''+col+'\',this.value,\'s\')">'+selOpts(col,v)+'</select></td>';
  if(type==='d')return '<td><input type="date" value="'+esc(v)+'" onchange="save(\''+r.id+'\',\''+col+'\',this.value,\'d\')"></td>';
  const cls=(type==='n'||type==='p'||type==='i')?' class="num"':'';
  const w=col==='grundbuch'||col==='gemarkung'||col==='notiz'?'min-width:150px':(type==='t'?'min-width:120px':'width:82px');
  return '<td'+cls+'><input value="'+esc(v)+'" style="'+w+'" onchange="save(\''+r.id+'\',\''+col+'\',this.value,\''+type+'\')"></td>';
}
function render(){
  const q=($('q').value||'').toLowerCase(), fe=$('fEig').value;
  const list=ROWS.filter(r=>(!fe||r.eigentuemer===fe)&&(!q||((r.kennung||'')+' '+(r.immobilien_typ||'')+' '+(r.bank||'')).toLowerCase().includes(q)));
  // Header (2 Zeilen: Gruppen + Spalten)
  let r1='<tr>';GRP.forEach(g=>{const n=COLS.filter(c=>c[3]===g[0]).length;r1+='<th class="grp '+g[2]+'" colspan="'+n+'">'+esc(g[1])+'</th>';});r1+='<th></th></tr>';
  let r2='<tr>'+COLS.map(c=>'<th>'+esc(c[1])+'</th>').join('')+'<th></th></tr>';
  $('thead').innerHTML=r1+r2;
  $('tbl').querySelector('tbody').innerHTML=list.map(r=>'<tr class="'+ownerClass(r.eigentuemer)+'">'+COLS.map(c=>c[0]==='kennung'?'<td class="kn"><input value="'+esc(r.kennung)+'" style="width:64px;font-weight:700" onchange="save(\''+r.id+'\',\'kennung\',this.value,\'t\')"></td>':cell(r,c)).join('')+'<td><button class="btn" style="padding:3px 7px;background:none;border:none;color:var(--muted)" onclick="del(\''+r.id+'\')">✕</button></td></tr>').join('')||'<tr><td colspan="'+(COLS.length+1)+'" style="text-align:center;color:var(--muted);padding:20px">Keine Objekte.</td></tr>';
  $('cnt').textContent=list.length+' von '+ROWS.length+' Objekten';
  renderKpis();
}
function renderKpis(){
  const s=f=>ROWS.reduce((a,r)=>a+(Number(r[f])||0),0);
  const vw=s('verkehrswert'),rs=s('restschuld'),mi=s('kaltmiete_ist'),cf=s('cashflow_vst');
  const k=[['Objekte',ROWS.length],['Σ Verkehrswert',eur(vw)],['Σ Restschuld',eur(rs)],['Σ Netto-Vermögen',eur(vw-rs)],['Σ Kaltmiete p.a. IST',eur(mi)],['Σ Cashflow vSt',eur(cf)]];
  $('kpis').innerHTML=k.map(x=>'<div class="kpi"><div class="l">'+esc(x[0])+'</div><div class="v">'+x[1]+'</div></div>').join('');
}
function csvCell(v){v=(v==null?'':String(v));return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCSV(){const head=COLS.map(c=>c[1]);const rows=[head].concat(ROWS.map(r=>COLS.map(c=>r[c[0]]==null?'':r[c[0]])));
  const csv=rows.map(r=>r.map(csvCell).join(';')).join('\r\n');const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='assetmanagement_portfolio.csv';a.click();toast('CSV exportiert ✓');}
async function load(){const res=await sb.from('assetmgmt_portfolio').select('*').order('pos',{nullsFirst:false}).order('kennung');ROWS=res.error?[]:(res.data||[]);render();}
load();
</script>
</body></html>
