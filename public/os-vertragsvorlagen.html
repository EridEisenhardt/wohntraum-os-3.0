<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertragsvorlagen</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/vertrag-pdf.js?v=20261020a"></script>
<style>
:root{--bg:#f3f5f8;--card:#ffffff;--ink:#18202c;--muted:#5f6b7a;--line:#e0e5eb;--soft:#eef1f5;--accent:#2f5d8a;--accent-ink:#ffffff;--accent-soft:#e3ecf5;--pos:#1d7a4c;--pos-bg:#e5f4ec;--warn:#946200;--warn-bg:#fff4d6;--neg:#b42318}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--ink)}
.wrap{padding:16px 20px 40px;max-width:1400px;margin:0 auto}
h1{font-size:22px;font-weight:800}.sub{color:var(--muted);font-size:12px}
.kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:34px}
button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.warn{color:var(--neg)}button:disabled{opacity:.55;cursor:default}
.grid{display:grid;grid-template-columns:270px 1fr;gap:14px;align-items:start}
.liste{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.liste>div{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}.liste>div:last-child{border-bottom:0}
.liste>div:hover{background:var(--soft)}.liste>div.on{background:var(--accent-soft);font-weight:600}
.liste .n{font-weight:600}.liste .z{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.ch{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.g4{display:grid;grid-template-columns:2fr 2fr 1.2fr 1fr;column-gap:12px}
.fl{display:grid;gap:3px;font-size:12px;color:var(--muted);margin-bottom:8px}
.fl input,.inp{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:14px}
.cb{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--ink);margin-top:20px}
textarea#text{width:100%;min-height:520px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#fbfcfd;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;white-space:pre-wrap}
.leiste{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.leiste input{width:260px}
details.hilfe{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
details.hilfe>summary{cursor:pointer;padding:10px 16px;font-weight:700;list-style:none}
details.hilfe>summary::-webkit-details-marker{display:none}
details.hilfe>summary::after{content:'aufklappen';float:right;font-size:12px;font-weight:600;color:var(--muted)}
details.hilfe[open]>summary::after{content:'zuklappen'}
.hilfe table{border-collapse:collapse;margin:0 16px 14px;font-size:13px}.hilfe td{border-top:1px solid var(--line);padding:5px 10px;vertical-align:top}
.hilfe code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:var(--soft);padding:1px 5px;border-radius:4px}
iframe.vs{width:100%;height:760px;border:1px solid var(--line);border-radius:8px;background:#fff}
.leer{color:var(--muted);padding:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}.toast.on{opacity:1}
@media(max-width:900px){.grid{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="wrap" id="app"><div class="leer">Lädt …</div></div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const VP=window.VertragPdf;
const BEREICHE=['Neuvermietung','Ratenzahlung'];
let L=[],SEL=null,DIRTY=false,VSURL='';
function toast(t,ms){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),ms||3500);}
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function laden(){const {data,error}=await sb.from('os_docs').select('data').eq('app','oc').like('pfad','vertragsvorlagen/%');
  if(error){document.getElementById('app').innerHTML='<div class="leer">Bitte im Wohntraum OS anmelden.</div>';return;}
  L=(data||[]).map(r=>r.data).filter(Boolean).sort((a,b)=>String(a.name).localeCompare(String(b.name),'de'));
  if(!SEL&&L.length)SEL=L[0].id;render();}
async function speichern(v){v.geaendert=new Date().toISOString();const {error}=await sb.from('os_docs').upsert({app:'oc',pfad:'vertragsvorlagen/'+v.id,data:v,updated_at:v.geaendert});
  if(error){toast('Nicht gespeichert: '+error.message,6000);return false;}DIRTY=false;return true;}
function render(){const v=L.find(x=>x.id===SEL);
  let h=`<div class="kopf"><div><h1>Vertragsvorlagen</h1><div class="sub">Alle Verträge, die das OS erstellt und über DocuSign zur Unterschrift sendet. Alle Vorlagen haben das gleiche Design; hier wird nur der Text gepflegt.</div></div><div class="acts"><button class="primary" data-a="neu">Neue Vorlage</button></div></div>`;
  h+=`<details class="hilfe"><summary>So funktionieren die Vorlagen</summary><table>
    <tr><td><code># Titel</code></td><td>Überschrift des Vertrags</td></tr>
    <tr><td><code>## § 1 Mieträume</code></td><td>Abschnitt</td><td><code>### Zwischenüberschrift</code></td><td>kleine Überschrift</td></tr>
    <tr><td><code>1.</code> <code>1.1.</code> <code>(1)</code> <code>a)</code></td><td>nummerierter Absatz mit Einzug</td><td><code>- Text</code></td><td>Aufzählung</td></tr>
    <tr><td><code>[x] Text</code> <code>[ ] Text</code></td><td>angekreuztes / leeres Kästchen</td><td><code>**fett**</code></td><td>fetter Text</td></tr>
    <tr><td><code>| a | b |</code></td><td>Tabellenzeile (<code>|# a | b |</code> = Kopfzeile, <code>|=30,70|</code> = Spaltenbreiten in Prozent)</td><td><code>&gt;&gt; Text</code></td><td>rechtsbündige Zeile</td></tr>
    <tr><td><code>{kaltmiete_zahl}</code></td><td>Wert aus dem OS (Liste „Platzhalter einfügen“)</td><td><code>{text:IBAN|Vorgabe}</code></td><td>freier Text, wird vor dem Versenden in der Neuvermietung ausgefüllt (Vorgabe optional)</td></tr>
    <tr><td><code>{feld:mieter1:Name}</code></td><td>Feld, das der Mieter in DocuSign selbst ausfüllt</td><td><code>?{mieter2_name} …</code></td><td>Zeile nur, wenn es einen zweiten Mieter gibt</td></tr>
    <tr><td><code>:::unterschriften mieter, vermieter</code></td><td>Unterschriften über DocuSign (Bezeichnung ändern: <code>mieter=Gast, vermieter=Beherberger</code>). Erst unterschreiben die Mieter, dann der Vermieter.</td><td><code>---seite</code></td><td>Seitenumbruch</td></tr></table></details>`;
  h+='<div class="grid"><div class="liste">'+(L.length?L.map(x=>`<div data-v="${esc(x.id)}" class="${x.id===SEL?'on':''}"><div class="n">${esc(x.name)}</div><div class="z">${esc([x.bereich,x.standard?'immer vorausgewählt':'',x.aktiv===false?'nicht aktiv':''].filter(Boolean).join(' · '))}</div></div>`).join(''):'<div class="leer">Noch keine Vorlagen.</div>')+'</div><div>';
  if(v){h+=`<div class="card"><div class="g4"><label class="fl">Name der Vorlage<input id="v-name" value="${esc(v.name)}"></label><label class="fl">Titel in Kopf- und Fußzeile<input id="v-titel" value="${esc(v.titel||'')}"></label>
      <label class="fl">Bereich<input id="v-bereich" list="dl-bereich" value="${esc(v.bereich||'')}" autocomplete="off"><datalist id="dl-bereich">${BEREICHE.map(b=>`<option value="${b}">`).join('')}</datalist></label>
      <div><label class="cb"><input type="checkbox" id="v-standard"${v.standard?' checked':''}> immer vorausgewählt</label><label class="cb" style="margin-top:6px"><input type="checkbox" id="v-aktiv"${v.aktiv!==false?' checked':''}> aktiv</label></div></div></div>
    <div class="card"><div class="leiste"><input class="inp" id="q" list="dl-q" placeholder="Platzhalter suchen, z. B. Kaltmiete …" autocomplete="off"><datalist id="dl-q">${VP.QUELLEN.map(([k,l])=>`<option value="${esc(l)}">`).join('')}</datalist>
      <button data-a="q">Platzhalter einfügen</button><button data-a="frei">Freien Text einfügen</button><button data-a="feld">Feld für den Mieter</button><button data-a="unt">Unterschriften</button><button data-a="seite">Seitenumbruch</button></div>
      <textarea id="text" spellcheck="true">${esc(v.text||'')}</textarea>
      <div class="acts" style="margin-top:10px;justify-content:space-between"><div class="acts"><button class="primary" data-a="speichern">Speichern</button><button data-a="vorschau">Vorschau mit Beispieldaten</button></div><button class="warn" data-a="loeschen">Vorlage löschen</button></div>
      ${v.geaendert?`<div class="sub" style="margin-top:6px">Zuletzt gespeichert: ${esc(new Date(v.geaendert).toLocaleString('de-DE'))}</div>`:''}</div>
    <div id="vs"></div>`;}
  else h+='<div class="card leer">Links eine Vorlage wählen oder eine neue anlegen.</div>';
  h+='</div></div>';
  document.getElementById('app').innerHTML=h;}
function einfuegen(s){const t=document.getElementById('text');if(!t)return;const a=t.selectionStart,b=t.selectionEnd;t.value=t.value.slice(0,a)+s+t.value.slice(b);t.focus();t.selectionStart=t.selectionEnd=a+s.length;DIRTY=true;}
function uebernehmen(){const v=L.find(x=>x.id===SEL);if(!v)return null;const g=id=>document.getElementById(id);
  v.name=g('v-name').value.trim()||'Vorlage';v.titel=g('v-titel').value.trim();v.bereich=g('v-bereich').value.trim();v.standard=g('v-standard').checked;v.aktiv=g('v-aktiv').checked;v.text=g('text').value;return v;}
function vorschau(){const v=uebernehmen();if(!v)return;try{const V=VP.werte(VP.BEISPIEL);const {doc}=VP.erstellen(v.text,V,{},{titel:v.titel||v.name,fuss:'K28 WE 2 (Beispiel)',vorschau:true});
  if(VSURL)URL.revokeObjectURL(VSURL);VSURL=URL.createObjectURL(doc.output('blob'));document.getElementById('vs').innerHTML=`<div class="card"><div class="ch">Vorschau mit Beispieldaten<a href="${VSURL}" target="_blank" rel="noopener" style="font-size:13px">in neuem Fenster öffnen</a></div><iframe class="vs" src="${VSURL}"></iframe></div>`;}
  catch(e){toast('Vorschau nicht möglich: '+(e.message||e),7000);}}
document.addEventListener('input',e=>{if(e.target.closest('.card'))DIRTY=true;});
document.addEventListener('click',async e=>{const t=e.target;
  const lv=t.closest('[data-v]');if(lv){if(DIRTY&&!confirm('Änderungen verwerfen?'))return;DIRTY=false;SEL=lv.dataset.v;render();return;}
  const a=t.closest('[data-a]');if(!a)return;const w=a.dataset.a;
  if(w==='neu'){const v={id:rid(),name:'Neue Vorlage',titel:'',bereich:'Neuvermietung',standard:false,aktiv:true,text:'# Titel\n\nzwischen\n\n**{vermieter}**, {vermieter_anschrift}\n\n>> – als Vermieter –\n\nund\n\n**{alle_mieter}**\n\n>> – als Mieter –\n\n## § 1 Gegenstand\n\nText …\n\n:::unterschriften mieter, vermieter\n'};
    L.push(v);SEL=v.id;if(await speichern(v)){render();toast('Vorlage angelegt.');}return;}
  if(w==='q'){const q=document.getElementById('q').value;const f=VP.QUELLEN.find(([k,l])=>l===q||k===q);if(!f){toast('Bitte einen Platzhalter aus der Liste wählen.');return;}einfuegen('{'+f[0]+'}');return;}
  if(w==='frei'){const l=prompt('Bezeichnung des freien Textes (z. B. IBAN):');if(l&&l.trim())einfuegen('{text:'+l.trim().replace(/[{}|]/g,'')+'}');return;}
  if(w==='feld'){const l=prompt('Bezeichnung des Feldes, das der Mieter in DocuSign ausfüllt:');if(l&&l.trim())einfuegen('{feld:mieter1:'+l.trim().replace(/[{}:]/g,'')+'}');return;}
  if(w==='unt'){einfuegen('\n:::unterschriften mieter, vermieter\n');return;}
  if(w==='seite'){einfuegen('\n---seite\n');return;}
  if(w==='vorschau'){vorschau();return;}
  if(w==='speichern'){const v=uebernehmen();if(v&&await speichern(v)){L.sort((a,b)=>String(a.name).localeCompare(String(b.name),'de'));render();toast('Gespeichert.');}return;}
  if(w==='loeschen'){const v=L.find(x=>x.id===SEL);if(!v||!confirm('Vorlage „'+v.name+'“ löschen?'))return;const {error}=await sb.from('os_docs').delete().eq('app','oc').eq('pfad','vertragsvorlagen/'+v.id);
    if(error){toast('Nicht gelöscht: '+error.message,6000);return;}L=L.filter(x=>x.id!==v.id);SEL=L[0]&&L[0].id;DIRTY=false;render();toast('Gelöscht.');return;}});
window.addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue='';}});
laden();
</script></body></html>
