<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GF Testboard · Aufgaben</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--surf:#fff;--surf2:#f1f3f6;--line:#e4e7ec;--text:#1c2230;--muted:#6b7280;--accent:#6d4ef0;--green:#0f9d6b;--red:#c0392b;--amber:#b45309}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1400px;margin:0 auto;padding:20px 22px 60px}
h1{font-size:21px;font-weight:800}
.sub{font-size:12.5px;color:var(--muted);margin:5px 0 14px;max-width:900px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.kpi .l{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-size:19px;font-weight:800;margin-top:3px}
.kpi.red .v{color:var(--red)}.kpi.green .v{color:var(--green)}.kpi.amber .v{color:var(--amber)}
.addbar{display:flex;gap:8px;margin-bottom:14px}
.addbar input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:13px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surf);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
@media(max-width:980px){.cols{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.cols{grid-template-columns:1fr}}
.col{background:var(--surf2);border:1px solid var(--line);border-radius:13px;padding:10px;min-height:120px}
.col.dragover{outline:2px dashed var(--accent);outline-offset:-4px}
.col-h{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;padding:2px 4px 8px}
.col-h .cnt{font-size:11px;color:var(--muted);font-weight:700}
.card{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;cursor:grab;box-shadow:0 1px 2px #0000000a}
.card:active{cursor:grabbing}
.card .tt{font-weight:600;font-size:13.5px;line-height:1.35}
.card .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surf2);color:var(--muted);border:1px solid var(--line)}
.pill.due{background:#fff4e5;color:var(--amber);border-color:#f3dcc0}
.pill.over{background:#fdecea;color:var(--red);border-color:#f5c6c2}
.pill.kontakt{background:#eef3fb;color:#2563eb;border-color:#d6e4fb}
.pill.obj{background:#eefaf3;color:var(--green);border-color:#cdeede}
.card .links{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.card a{font-size:11.5px;color:var(--accent);text-decoration:none}
.card select{font:inherit;font-size:11px;padding:2px 5px;border:1px solid var(--line);border-radius:6px;background:var(--surf);color:var(--muted);max-width:140px}
.card .del{margin-left:auto;background:none;border:0;color:var(--red);cursor:pointer;font-size:12px}
.foot{font-size:11.5px;color:var(--muted);margin-top:16px}
.viewbar{margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surf)}
.seg button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:var(--surf);color:var(--muted);padding:7px 14px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
/* Liste */
.ltab{width:100%;border-collapse:collapse;font-size:13px;background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ltab th,.ltab td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.ltab th{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surf2)}
.ltab tr:last-child td{border-bottom:0}
.ltab tr.over td:nth-child(3){color:var(--red);font-weight:700}
.ltab select{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surf)}
.ltab a{color:var(--accent);text-decoration:none;font-size:12px}
.ltab .del{background:none;border:0;color:var(--red);cursor:pointer}
/* Kalender */
.calhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.calhead b{font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;padding:2px}
.cell{background:var(--surf);border:1px solid var(--line);border-radius:9px;min-height:92px;padding:5px 6px}
.cell.out{background:var(--surf2);opacity:.6}
.cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cell .dn{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px}
.cell .ct{font-size:10.5px;background:#eef3fb;border:1px solid #d6e4fb;color:#2563eb;border-radius:6px;padding:2px 5px;margin-bottom:3px;line-height:1.25;cursor:default}
.cell .ct.over{background:#fdecea;border-color:#f5c6c2;color:var(--red)}
.cell .ct.done{background:#eefaf3;border-color:#cdeede;color:var(--green);text-decoration:line-through}
.pill.art{background:#efeafe;border-color:#ddd3fb;color:#6d4ef0}
.pill.wv{background:#fff4e5;border-color:#f3dcc0;color:var(--amber)}.pill.wv.over{background:#fdecea;border-color:#f5c6c2;color:var(--red)}
.pill.prio{background:#f1f3f6}
.card .tt{cursor:pointer}
/* Detail-Dialog */
.ov{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;z-index:100;overflow:auto;padding:30px 12px}
.ov.show{display:flex}
.dlg{background:var(--surf);border:1px solid var(--line);border-radius:14px;width:720px;max-width:96vw;display:flex;flex-direction:column}
.dlg-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800}
.dlg-hd .x{cursor:pointer;color:var(--muted)}
.dlg-bd{padding:16px 18px;max-height:72vh;overflow:auto}
.dlg-ft{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f.wide{grid-column:1/-1}
.f label{display:block;font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;background:var(--surf);color:var(--text)}
.dlg .sec{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.dlg .st{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:8px}
.dlg .row{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.dlg .row input,.dlg textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px}
.btn.sm{font-size:12px;padding:5px 11px}
.dsub{display:flex;gap:8px;align-items:center;padding:3px 0}
.dsub span{flex:1;font-size:13px}.dsub.done span{text-decoration:line-through;color:var(--muted)}
.dsub b{cursor:pointer;color:var(--red)}
.vrow{border-left:2px solid var(--line);padding:4px 0 4px 10px;margin:2px 0;font-size:12.5px}
.vrow .vm{color:var(--muted);font-size:11px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 15px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1}
</style></head><body>
<div class="wrap">
  <h1>🗂 GF Testboard · Aufgaben</h1>
  <div class="sub">Testboard zum Ablösen von Asana: Aufgaben per Spalte verschieben (Drag &amp; Drop oder Status-Auswahl), mit Kontakt &amp; Objekt verknüpfen. Import: heute fällige Asana-Aufgaben. Quelle bleibt vorerst Asana – hier wird nur getestet.</div>
  <div class="kpis" id="kpis"></div>
  <div class="viewbar" style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
    <div class="seg" id="seg">
      <button data-v="board" class="on" onclick="setView('board')">▦ Board</button>
      <button data-v="liste" onclick="setView('liste')">☰ Liste</button>
      <button data-v="kalender" onclick="setView('kalender')">▦ Kalender</button>
    </div>
    <div class="seg" id="artseg">
      <button data-a="alle" class="on" onclick="setArt('alle')">Alle</button>
      <button data-a="aufgabe" onclick="setArt('aufgabe')">Aufgaben</button>
      <button data-a="ticket" onclick="setArt('ticket')">Tickets</button>
      <button data-a="followup" onclick="setArt('followup')">Follow-ups</button>
    </div>
    <button class="btn" id="wvBtn" onclick="toggleWV()" title="Nur fällige Wiedervorlagen">🔔 Wiedervorlagen</button>
  </div>
  <div class="addbar"><input id="newT" placeholder="Neue Aufgabe …" onkeydown="if(event.key==='Enter')addTask()">
    <select id="newArt" title="Art"><option value="aufgabe">Aufgabe</option><option value="ticket">Ticket</option><option value="followup">Follow-up</option></select>
    <button class="btn pri" onclick="addTask()">+ anlegen</button></div>
  <div id="view"></div>
  <div class="foot" id="foot"></div>
</div>
<div class="ov" id="dov" onclick="if(event.target===this)closeDetail()"><div class="dlg">
  <div class="dlg-hd"><span id="dTitle">Aufgabe</span><span class="x" onclick="closeDetail()">✕</span></div>
  <div class="dlg-bd">
    <div class="fg">
      <div class="f wide"><label>Titel</label><input id="d_titel"></div>
      <div class="f"><label>Art</label><select id="d_art"><option value="aufgabe">Aufgabe</option><option value="ticket">Ticket</option><option value="followup">Follow-up</option></select></div>
      <div class="f"><label>Status</label><select id="d_status"></select></div>
      <div class="f"><label>Priorität</label><select id="d_prio"><option value="">—</option><option>P1</option><option>P2</option><option>P3</option></select></div>
      <div class="f"><label>Verantwortlich</label><input id="d_verantwortlich" placeholder="—"></div>
      <div class="f"><label>Fällig am</label><input id="d_faellig" type="date"></div>
      <div class="f"><label>🔔 Wiedervorlage am</label><input id="d_wiedervorlage" type="date"></div>
      <div class="f"><label>Kontakt</label><select id="d_kont"></select></div>
      <div class="f"><label>Objekt</label><select id="d_obj"></select></div>
      <div class="f wide"><label>Asana-Link</label><input id="d_asana_url" placeholder="https://app.asana.com/…"></div>
      <div class="f wide"><label>Beschreibung</label><textarea id="d_beschreibung" rows="4"></textarea>
        <div class="row"><button class="btn sec sm" id="mic_d_beschreibung" onclick="diktieren('d_beschreibung','mic_d_beschreibung')">🎤 Diktieren</button><button class="btn sec sm" onclick="kiZusammenfassen('d_beschreibung')">✨ Zusammenfassen</button></div></div>
    </div>
    <div class="sec"><div class="st">☑ Unteraufgaben <span id="d_subcnt"></span></div><div id="d_subs"></div>
      <div class="row"><input id="d_subnew" placeholder="Neue Unteraufgabe …" onkeydown="if(event.key==='Enter')dAddSub()"><button class="btn sec sm" onclick="dAddSub()">+</button></div></div>
    <div class="sec"><div class="st">🕓 Verlauf &amp; Kommentare</div><div id="d_ver"></div>
      <textarea id="d_comment" rows="2" placeholder="Kommentar … – oder 🎤 reinsprechen"></textarea>
      <div class="row"><button class="btn sec sm" id="mic_d_comment" onclick="diktieren('d_comment','mic_d_comment')">🎤</button><button class="btn sec sm" onclick="kiZusammenfassen('d_comment')">✨</button><button class="btn sm" onclick="dAddComment()">Kommentar</button></div></div>
  </div>
  <div class="dlg-ft"><button class="btn sec" onclick="dFollowup()">+ Follow-up anlegen</button><span style="flex:1"></span><button class="btn" onclick="closeDetail()">Schließen</button><button class="btn pri" onclick="dSave()">Speichern</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const dfmt=d=>d?new Date(d).toLocaleDateString('de-DE'):'—';
const today=new Date().toISOString().slice(0,10);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
const COLS=[['todo','📋 To Do'],['inarbeit','🔧 In Arbeit'],['warten','⏳ Wartet'],['erledigt','✅ Erledigt']];
let TASKS=[], KONT=[], OBJ=[];
async function load(){
  const [t,ck,hk,ob]=await Promise.all([
    sb.from('os_tasks').select('*').order('pos',{ascending:true}).order('created_at',{ascending:true}),
    sb.from('crm_kontakte').select('id,vorname,name'),
    sb.from('hv_kontakte').select('id,vorname,name'),
    sb.from('nahaus_objekte').select('id,h_id_text,name').eq('geloescht',false)
  ]);
  TASKS=t.data||[];
  const seen=new Set();KONT=[];
  (ck.data||[]).concat(hk.data||[]).forEach(k=>{const nm=[k.vorname,k.name].filter(Boolean).join(' ').trim();if(nm&&!seen.has(nm)){seen.add(nm);KONT.push({id:k.id,label:nm});}});
  KONT.sort((a,b)=>a.label.localeCompare(b.label,'de'));
  OBJ=(ob.data||[]).map(o=>({id:o.id,label:(o.h_id_text?o.h_id_text+' · ':'')+(o.name||'')})).sort((a,b)=>a.label.localeCompare(b.label,'de'));
  render();
}
function kontOptions(sel){return `<option value="">+ Kontakt</option>`+KONT.map(k=>`<option value="${k.id}|${esc(k.label)}"${sel===k.label?' selected':''}>${esc(k.label)}</option>`).join('');}
function objOptions(sel){return `<option value="">+ Objekt</option>`+OBJ.map(o=>`<option value="${o.id}|${esc(o.label)}"${sel===o.label?' selected':''}>${esc(o.label)}</option>`).join('');}
function card(t){
  const over=t.faellig&&t.faellig<today&&t.status!=='erledigt';
  const due=t.faellig?`<span class="pill ${over?'over':'due'}">📅 ${dfmt(t.faellig)}${over?' · überfällig':''}</span>`:'';
  const proj=t.projekt?`<span class="pill">${esc(t.projekt)}</span>`:'';
  const kont=t.kontakt_label?`<span class="pill kontakt">👤 ${esc(t.kontakt_label)}</span>`:'';
  const obj=t.object_label?`<span class="pill obj">🏠 ${esc(t.object_label)}</span>`:'';
  const asana=t.asana_url?`<a href="${esc(t.asana_url)}" target="_blank">↗ Asana</a>`:'';
  return `<div class="card" draggable="true" ondragstart="drag(event,'${t.id}')">
    <div class="tt">${esc(t.titel)}</div>
    <div class="meta">${due}${proj}${kont}${obj}</div>
    <div class="links">${asana}
      <select onchange="linkKont('${t.id}',this.value)">${kontOptions(t.kontakt_label)}</select>
      <select onchange="linkObj('${t.id}',this.value)">${objOptions(t.object_label)}</select>
      <button class="del" onclick="delTask('${t.id}')">🗑</button></div>
  </div>`;
}
let VIEW='board', CALM=null;
const STLBL={todo:'To Do',inarbeit:'In Arbeit',warten:'Wartet',erledigt:'Erledigt'};
function setView(v){VIEW=v;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();}
function render(){
  const over=TASKS.filter(t=>t.faellig&&t.faellig<today&&t.status!=='erledigt').length;
  const done=TASKS.filter(t=>t.status==='erledigt').length;
  document.getElementById('kpis').innerHTML=[
    ['Aufgaben gesamt',TASKS.length,''],['offen',TASKS.filter(t=>t.status!=='erledigt').length,''],
    ['überfällig',over,over?'red':'green'],['erledigt',done,'green']
  ].map(k=>`<div class="kpi ${k[2]}"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('');
  if(VIEW==='liste')renderList();else if(VIEW==='kalender')renderCalendar();else renderBoard();
  document.getElementById('foot').textContent='Verknüpfe Aufgaben mit Kontakten (CRM & Hausverwaltung) und Objekten – genau das kann Asana nicht. Umschalten zwischen Board, Liste und Kalender oben.';
}
function renderBoard(){
  document.getElementById('view').innerHTML='<div class="cols" id="cols"></div>';
  document.getElementById('cols').innerHTML=COLS.map(([k,l])=>{
    const list=TASKS.filter(t=>(t.status||'todo')===k);
    return `<div class="col" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="drop(event,'${k}',this)">
      <div class="col-h"><span>${l}</span><span class="cnt">${list.length}</span></div>
      ${list.map(card).join('')}</div>`;
  }).join('');
}
function renderList(){
  const rows=TASKS.slice().sort((a,b)=>{const av=a.faellig||'9999',bv=b.faellig||'9999';return av<bv?-1:av>bv?1:(a.pos||0)-(b.pos||0);});
  document.getElementById('view').innerHTML=`<div style="overflow:auto"><table class="ltab"><thead><tr>
    <th>Aufgabe</th><th>Status</th><th>Fällig</th><th>Projekt</th><th>Kontakt</th><th>Objekt</th><th></th></tr></thead><tbody>
    ${rows.map(t=>{const over=t.faellig&&t.faellig<today&&t.status!=='erledigt';return `<tr class="${over?'over':''}">
      <td>${esc(t.titel)}${t.asana_url?` <a href="${esc(t.asana_url)}" target="_blank">↗</a>`:''}</td>
      <td><select onchange="moveTask('${t.id}',this.value)">${COLS.map(([k,l])=>`<option value="${k}"${(t.status||'todo')===k?' selected':''}>${STLBL[k]}</option>`).join('')}</select></td>
      <td>${t.faellig?dfmt(t.faellig)+(over?' · überfällig':''):'—'}</td>
      <td>${esc(t.projekt||'—')}</td>
      <td><select onchange="linkKont('${t.id}',this.value)">${kontOptions(t.kontakt_label)}</select></td>
      <td><select onchange="linkObj('${t.id}',this.value)">${objOptions(t.object_label)}</select></td>
      <td><button class="del" onclick="delTask('${t.id}')">🗑</button></td></tr>`;}).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:24px">Keine Aufgaben.</td></tr>'}
  </tbody></table></div>`;
}
let CALMODE='woche';
function mondayOf(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x;}
function renderCalendar(){
  if(!CALM)CALM=new Date(today);
  const byDay={};TASKS.forEach(t=>{if(t.faellig){(byDay[t.faellig]=byDay[t.faellig]||[]).push(t);}});
  const dows=['Mo','Di','Mi','Do','Fr','Sa','So'];
  let start,count,label,curM=CALM.getMonth();
  if(CALMODE==='woche'){start=mondayOf(CALM);count=7;const end=new Date(start);end.setDate(start.getDate()+6);
    label='Woche '+start.toLocaleDateString('de-DE',{day:'2-digit',month:'short'})+' – '+end.toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'});}
  else{const first=new Date(CALM.getFullYear(),CALM.getMonth(),1);start=mondayOf(first);count=42;label=first.toLocaleDateString('de-DE',{month:'long',year:'numeric'});curM=first.getMonth();}
  let cells='';
  for(let i=0;i<count;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=d.toISOString().slice(0,10);
    const out=CALMODE==='monat'&&d.getMonth()!==curM, isToday=iso===today;
    const list=byDay[iso]||[];
    cells+=`<div class="cell ${out?'out':''} ${isToday?'today':''}"><div class="dn">${d.getDate()}.</div>${
      list.map(t=>{const over=iso<today&&t.status!=='erledigt';const cls=t.status==='erledigt'?'done':(over?'over':'');return `<div class="ct ${cls}" title="${esc(t.titel)}">${esc(CALMODE==='woche'?t.titel:(t.titel.length>26?t.titel.slice(0,24)+'…':t.titel))}</div>`;}).join('')
    }</div>`;
  }
  document.getElementById('view').innerHTML=`<div class="calhead">
    <button class="btn" onclick="calNav(-1)">‹</button><b>${label}</b><button class="btn" onclick="calNav(1)">›</button><button class="btn" onclick="calToday()">Heute</button>
    <span class="seg" style="margin-left:auto"><button class="${CALMODE==='monat'?'on':''}" onclick="calMode('monat')">Monat</button><button class="${CALMODE==='woche'?'on':''}" onclick="calMode('woche')">Woche</button></span>
  </div>
    <div class="cal">${dows.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>`;
}
function calMode(m){CALMODE=m;renderCalendar();}
function calNav(dir){if(CALMODE==='woche'){CALM.setDate(CALM.getDate()+dir*7);CALM=new Date(CALM);}else{CALM=new Date(CALM.getFullYear(),CALM.getMonth()+dir,1);}renderCalendar();}
function calToday(){CALM=new Date(today);renderCalendar();}
async function moveTask(id,status){const t=TASKS.find(x=>x.id===id);if(!t)return;t.status=status;await sb.from('os_tasks').update({status,updated_at:new Date().toISOString()}).eq('id',id);render();toast('Status aktualisiert ✓');}
let DRAG=null;
function drag(e,id){DRAG=id;e.dataTransfer.effectAllowed='move';}
async function drop(e,status,el){e.preventDefault();el.classList.remove('dragover');if(!DRAG)return;
  const t=TASKS.find(x=>x.id===DRAG);if(t&&t.status!==status){t.status=status;render();await sb.from('os_tasks').update({status,updated_at:new Date().toISOString()}).eq('id',DRAG);toast('Verschoben ✓');}
  DRAG=null;}
async function addTask(){const el=document.getElementById('newT');const titel=(el.value||'').trim();if(!titel)return;
  const pos=(TASKS.reduce((m,t)=>Math.max(m,t.pos||0),0))+1;
  const {data,error}=await sb.from('os_tasks').insert({titel,status:'todo',verantwortlich:'Eric Eisenhardt',quelle:'os',pos}).select().maybeSingle();
  if(error){toast('Fehler: '+error.message);return;}
  if(data)TASKS.push(data);el.value='';render();}
async function delTask(id){if(!confirm('Aufgabe entfernen?'))return;await sb.from('os_tasks').delete().eq('id',id);TASKS=TASKS.filter(t=>t.id!==id);render();}
async function linkKont(id,val){const t=TASKS.find(x=>x.id===id);if(!t)return;const [kid,label]=val?val.split('|'):[null,null];
  t.kontakt_id=kid;t.kontakt_label=label;await sb.from('os_tasks').update({kontakt_id:kid,kontakt_label:label,updated_at:new Date().toISOString()}).eq('id',id);render();}
async function linkObj(id,val){const t=TASKS.find(x=>x.id===id);if(!t)return;const [oid,label]=val?val.split('|'):[null,null];
  t.object_id=oid;t.object_label=label;await sb.from('os_tasks').update({object_id:oid,object_label:label,updated_at:new Date().toISOString()}).eq('id',id);render();}
load();
</script></body></html>
