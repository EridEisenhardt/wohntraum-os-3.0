<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Objekt · Übersicht</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f7f9;--surf:#ffffff;--surf2:#f1f3f6;--line:#e4e7ec;--text:#1c2230;--muted:#6b7280;--accent:#6d4ef0;--accent2:#8266ff;--gold:#b07d1a;--green:#0f9d6b;--red:#d64550;--amber:#c7851d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.55;min-height:100vh}
a{color:var(--accent2);text-decoration:none}
.hero{position:relative;height:220px;background:var(--surf2) center/cover no-repeat;display:flex;align-items:flex-end}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#0d0e1aee 0%,#0d0e1a33 60%,#0d0e1a66 100%)}
.hero .in{position:relative;z-index:2;padding:22px 30px;width:100%}
.back{position:absolute;top:16px;left:22px;z-index:3;font-size:12.5px;color:#fff;background:#0007;padding:6px 12px;border-radius:8px;cursor:pointer}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.bg{font-size:11px;font-weight:700;padding:3px 10px;border-radius:7px;background:#0008;color:#fff;border:1px solid #ffffff22}
.bg.acc{background:var(--accent)} .bg.leer{background:var(--amber)} .bg.belegt{background:var(--green)}
h1{font-size:28px;font-weight:800;line-height:1.1;color:#fff}
.hero .adr{font-size:14px;color:#d6d9ea;margin-top:3px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 30px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:20px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.kpi .l{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-size:20px;font-weight:800;margin-top:4px}
.kpi.red .v{color:var(--red)} .kpi.green .v{color:var(--green)}
.sec{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2);font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.vhd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fld{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.fld .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.fld .v{font-size:16px;font-weight:700;margin-top:4px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}
.ucard{background:var(--surf2);border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer;transition:.12s;display:flex;flex-direction:column}
.ucard:hover{border-color:var(--accent);box-shadow:0 4px 16px #6d4ef022;transform:translateY(-2px)}
.uimg{height:120px;background:#dfe3ea center/cover no-repeat;position:relative}
.ustat{position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff}
.ubody{padding:12px 14px}
.utop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ulbl{font-weight:800;font-size:15px}
.ukz{font-size:11px;color:var(--muted);font-weight:700}
.umeta{font-size:12.5px;color:var(--muted);margin-top:5px}
.urent{font-weight:700;margin-top:7px;font-size:13.5px}
.ustart{font-size:11.5px;color:var(--muted);margin-top:3px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.person{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.person .nm{font-weight:700;font-size:15px}.person .rl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.person .ct{font-size:12.5px;color:var(--muted);margin-top:6px}
.frist{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:12px 15px}
.frist .fl{font-weight:600;font-size:13.5px;min-width:200px}
.frist input[type=date],.estat{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;background:var(--surf);color:var(--text)}
.pill{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff}
.empty{color:var(--muted);font-size:13px;padding:18px;text-align:center;background:var(--surf2);border:1px dashed var(--line);border-radius:11px}
.noteadd{display:flex;gap:10px;margin-bottom:14px}
.noteadd textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;resize:vertical}
.noteadd button,.ghost{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:8px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.ghost{background:var(--surf2);color:var(--text);border:1px solid var(--line)}
.notes{display:flex;flex-direction:column;gap:10px}
.note{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:11px 14px}
.note .nt{font-size:13.5px;line-height:1.5}
.note .nmeta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:10px}
.note .del{background:none;border:0;color:var(--red);cursor:pointer;font-size:11px;padding:0}
#map{height:300px;border:1px solid var(--line);border-radius:12px}
.row2tx{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.row2tx{grid-template-columns:1fr}}
.ghost.sm{background:var(--surf);color:var(--text);border:1px solid var(--line);padding:5px 11px;font-size:12px;margin:0 6px 6px 0}
.milebar{display:flex;align-items:center;gap:4px}
.milebar .mb{width:16px;height:5px;border-radius:3px;background:var(--line)}.milebar .mb.on{background:var(--accent)}
.milecount{font-size:11.5px;color:var(--muted);font-weight:700;margin-left:8px}
.txc{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.txh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.txicon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--surf)}
.txicon.ankauf{background:#0f9d6b22}.txicon.verkauf{background:#8266ff22}
.txttl{font-weight:800;font-size:16px;margin-right:auto}
.pbtns{margin-bottom:10px}
.mile{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--line)}
.mile:last-child{border-bottom:none}
.mile .dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto;border:2px dashed var(--line)}
.mile.done .dot{background:var(--green);border-color:var(--green);border-style:solid}
.mile .dt{margin-left:auto;color:var(--muted);font-size:11px}.mile.done .dt{color:var(--green)}
.stellbox{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-top:12px}
.sbtl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.sbnum{font-size:11.5px;color:var(--muted);font-weight:700}
.stellrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--accent2)}
.stellrow .dt{margin-left:auto;color:var(--muted);font-size:11.5px}
</style></head><body>
<div class="hero" id="hero"><div class="back" onclick="history.length>1?history.back():location.href='/hausverwaltung/objekte'">← Objekte</div>
  <div class="in"><div class="badges" id="badges"></div><h1 id="title">Objekt lädt…</h1><div class="adr" id="adr"></div></div></div>
<div class="wrap">
  <div class="kpis" id="kpis"></div>

  <div class="sec"><div class="vhd"><h2 style="margin:0">🏘 Einheiten / Wohnungen</h2><span style="font-size:12px;color:var(--muted)" id="ucount"></span></div>
    <div class="units" id="units"></div></div>

  <div class="sec"><h2>🏠 Stammdaten Objekt</h2><div class="grid" id="stamm"></div></div>

  <div class="sec"><h2>📅 Anstehende Termine &amp; Fristen</h2><div id="fristen"></div></div>

  <div class="sec"><h2>🤝 Beteiligte</h2><div class="cards3" id="bet"></div></div>

  <div class="sec"><div class="vhd"><h2 style="margin:0">📅 Termine &amp; Transaktion</h2><div class="milebar" id="milebar"></div></div>
    <div class="row2tx" id="transakt"></div></div>

  <div class="sec"><h2>📝 Notizen</h2>
    <div class="noteadd"><textarea id="noteInput" rows="2" placeholder="Notiz zum Objekt hinzufügen…"></textarea><button onclick="addNote()">+ Hinzufügen</button></div>
    <div class="notes" id="notes"></div></div>

  <div class="sec"><h2>📍 Lage</h2><div id="lagebox"></div></div>
</div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const eur=n=>(n==null||isNaN(n))?'—':new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const dfmt=d=>d?new Date(d).toLocaleDateString('de-DE'):'—';
const KAT={APARTMENT:'Wohnung',RESIDENTIAL_UNIT:'Wohnung',COMMERCIAL:'Gewerbe',COMMERCIAL_UNIT:'Gewerbe',GARAGE:'Garage',PARKING:'Stellplatz',PARKING_SPACE:'Stellplatz',OUTDOOR_PARKING:'Stellplatz',OFFICE:'Büro',STORAGE:'Lager'};
const id=new URLSearchParams(location.search).get('id');
let OB={},UNITS=[],CURMAP={},NOTES=[],BET=[],FIRMEN=[],KONTAKTE=[],TX={},mapDone=false;
async function load(){
  if(!id){document.getElementById('title').textContent='Kein Objekt angegeben';return;}
  const {data:ob}=await sb.from('nahaus_objekte').select('*').eq('id',id).maybeSingle();
  if(!ob){document.getElementById('title').textContent='Objekt nicht gefunden';return;}
  OB=ob;
  const [{data:un},{data:nz},{data:bt},{data:fi},{data:ko}]=await Promise.all([
    sb.from('nahaus_einheiten').select('*').eq('property_id',id),
    sb.from('nahaus_objekt_notizen').select('*').eq('object_id',id).order('created_at',{ascending:false}),
    sb.from('nahaus_objekt_beteiligte').select('*').eq('object_id',id),
    sb.from('hv_firmen').select('id,name,branche,telefon,website'),
    sb.from('hv_kontakte').select('id,firma_id,vorname,name,position,telefon,email')
  ]);
  const {data:tx}=await sb.from('nahaus_objekt_transaktion').select('*').eq('object_id',id);
  TX={};(tx||[]).forEach(r=>{TX[r.typ]=r;});
  UNITS=(un||[]).sort((a,b)=>String(a.w_id_text||a.label||'').localeCompare(String(b.w_id_text||b.label||''),'de'));
  NOTES=nz||[];BET=bt||[];
  FIRMEN=(fi||[]).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'de'));
  KONTAKTE=(ko||[]).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'de'));
  const uids=UNITS.map(u=>u.id);
  if(uids.length){const {data:mv}=await sb.from('nahaus_mietverhaeltnisse').select('unit_id,is_current,is_rented,mieter_namen,kaltmiete,warmmiete,start_date').in('unit_id',uids).eq('is_current',true);
    (mv||[]).forEach(m=>{CURMAP[m.unit_id]=m;});}
  renderHero();renderKpis();renderUnits();renderStamm();renderFristen();renderBet();renderTransakt();renderNotes();renderLage();
}
function renderHero(){
  if(OB.bild_url)document.getElementById('hero').style.backgroundImage=`url('${OB.bild_url}')`;
  const tot=OB.einheiten_gesamt||UNITS.length,rent=OB.einheiten_vermietet!=null?OB.einheiten_vermietet:UNITS.filter(u=>CURMAP[u.id]&&CURMAP[u.id].is_rented).length;
  const p=tot?Math.round(rent/tot*100):0;
  document.getElementById('badges').innerHTML=
    `<span class="bg acc">${esc(OB.h_id_text||'')}</span>`+
    `<span class="bg">${tot} Einheiten</span>`+
    `<span class="bg ${p>=100?'belegt':'leer'}">${p}% belegt</span>`+
    (OB.energie?`<span class="bg">Energie ${esc(OB.energie)}</span>`:'');
  document.getElementById('title').textContent=OB.name||OB.display_address||'Objekt';
  document.getElementById('adr').textContent=[OB.display_address,[OB.plz,OB.ort].filter(Boolean).join(' ')].filter(Boolean).join(' · ');
}
function renderKpis(){
  const tot=OB.einheiten_gesamt||UNITS.length;
  const rent=UNITS.filter(u=>CURMAP[u.id]&&CURMAP[u.id].is_rented).length;
  const frei=Math.max(0,tot-rent);
  const soll=UNITS.reduce((s,u)=>{const c=CURMAP[u.id];return s+(c&&c.is_rented?Number(c.kaltmiete||0):0);},0);
  document.getElementById('kpis').innerHTML=[
    ['Einheiten',tot,''],['vermietet',rent,'green'],['frei',frei,frei?'red':''],
    ['Soll-Kaltmiete / Mon.',eur(soll),''],['Offene Posten',eur(OB.offene_posten),OB.offene_posten?'red':'']
  ].map(k=>`<div class="kpi ${k[2]}"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('');
}
function renderUnits(){
  document.getElementById('ucount').textContent=UNITS.length+' Einheiten';
  const el=document.getElementById('units');
  if(!UNITS.length){el.innerHTML='<div class="empty">Keine Einheiten zu diesem Objekt hinterlegt.</div>';return;}
  el.innerHTML=UNITS.map(u=>{
    const c=CURMAP[u.id];const rented=c&&c.is_rented;
    const img=u.bild_url||OB.bild_url;
    return `<div class="ucard" onclick="location.href='/hausverwaltung/einheit?id=${encodeURIComponent(u.id)}'">
      <div class="uimg" ${img?`style="background-image:url('${esc(img)}')"`:''}><span class="ustat" style="background:${rented?'var(--green)':'var(--amber)'}">${rented?'Vermietet':'Frei'}</span></div>
      <div class="ubody"><div class="utop"><span class="ulbl">${esc(u.label||u.w_id_text||'Einheit')}</span><span class="ukz">${esc(u.w_id_text||'')}</span></div>
        <div class="umeta">${esc(KAT[u.kategorie_typ]||u.kategorie_typ||'Einheit')}${u.flaeche?' · '+u.flaeche+' m²':''}${u.zimmer?' · '+u.zimmer+' Zi.':''}</div>
        <div class="urent">${rented?esc(c.mieter_namen||'Vermietet')+' · '+eur(c.kaltmiete):'<span style="color:var(--amber)">leerstehend</span>'}</div>
        ${rented&&c.start_date?`<div class="ustart">📅 Mietbeginn ${dfmt(c.start_date)}</div>`:''}
      </div></div>`;
  }).join('');
}
function fld(l,v){return `<div class="fld"><div class="l">${l}</div><div class="v">${v==null||v===''?'—':v}</div></div>`;}
function renderStamm(){
  const tot=OB.einheiten_gesamt||UNITS.length;
  document.getElementById('stamm').innerHTML=[
    fld('Anschrift',esc(OB.display_address||'—')),
    fld('PLZ / Ort',esc([OB.plz,OB.ort].filter(Boolean).join(' ')||'—')),
    fld('Baujahr',OB.baujahr),
    `<div class="fld"><div class="l">Energieklasse</div><div class="v"><select class="estat" onchange="saveEnergie(this.value)">${['','A','B','C','D','E','F','G','H'].map(x=>`<option value="${x}"${x===((OB.energie||'').toUpperCase())?' selected':''}>${x||'—'}</option>`).join('')}</select></div></div>`,
    fld('Einheiten gesamt',tot),
    fld('Eigentümer',esc(OB.eigentuemer||'—'))
  ].join('');
}
async function saveEnergie(v){await sb.from('nahaus_objekte').update({energie:v||null}).eq('id',id);OB.energie=v||null;renderHero();}
function renderFristen(){
  const g=OB.energieausweis_gueltig_bis||'';let warn='';
  if(g){const days=Math.round((new Date(g)-new Date())/86400000);
    warn=days<0?`<span class="pill" style="background:var(--red)">abgelaufen</span>`:(days<180?`<span class="pill" style="background:var(--amber)">in ${days} Tagen</span>`:`<span class="pill" style="background:var(--green)">gültig</span>`);}
  const fileRow=OB.energieausweis_url
    ? `<a class="pill" style="background:var(--green)" href="${esc(OB.energieausweis_url)}" target="_blank">📄 Energieausweis öffnen</a> <button class="del" style="background:none;border:0;color:var(--red);cursor:pointer;font-size:12px" onclick="delEnergieFile()">entfernen</button>`
    : `<span style="color:var(--muted);font-size:12px">keine Datei hinterlegt</span>`;
  document.getElementById('fristen').innerHTML=`<div class="frist"><div class="fl">Energieausweis gültig bis</div>
    <input type="date" value="${esc(g)}" onchange="saveFrist(this.value)">
    <div>${warn||'<span style="color:var(--muted);font-size:12px">kein Datum hinterlegt</span>'}</div></div>
    <div class="frist" style="margin-top:10px"><div class="fl">Energieausweis (Datei)</div>
      <input type="file" id="eaFile" accept="application/pdf,image/*" onchange="uploadEnergie(this)">
      <div id="eaStatus">${fileRow}</div></div>`;
}
async function uploadEnergie(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const st=document.getElementById('eaStatus');st.textContent='Lädt hoch…';
  const ext=(f.name.split('.').pop()||'pdf').toLowerCase();
  const path=id+'/energieausweis_'+Date.now()+'.'+ext;
  const up=await sb.storage.from('objekt-dokumente').upload(path,f,{upsert:true});
  if(up.error){st.textContent='Fehler: '+up.error.message;return;}
  const {data:pu}=sb.storage.from('objekt-dokumente').getPublicUrl(path);
  const url=pu.publicUrl;
  await sb.from('nahaus_objekte').update({energieausweis_url:url}).eq('id',id);
  OB.energieausweis_url=url;renderFristen();
}
async function delEnergieFile(){if(!confirm('Energieausweis-Datei entfernen?'))return;
  await sb.from('nahaus_objekte').update({energieausweis_url:null}).eq('id',id);OB.energieausweis_url=null;renderFristen();}
async function saveFrist(v){await sb.from('nahaus_objekte').update({energieausweis_gueltig_bis:v||null}).eq('id',id);OB.energieausweis_gueltig_bis=v||null;renderFristen();}
function betOptions(sel){
  const fo=FIRMEN.map(f=>`<option value="f:${f.id}"${sel==='f:'+f.id?' selected':''}>🏢 ${esc(f.name||'(ohne Name)')}${f.branche?' · '+esc(f.branche):''}</option>`).join('');
  const ko=KONTAKTE.map(k=>{const nm=[k.vorname,k.name].filter(Boolean).join(' ')||'(ohne Name)';return `<option value="k:${k.id}"${sel==='k:'+k.id?' selected':''}>👤 ${esc(nm)}${k.position?' · '+esc(k.position):''}</option>`;}).join('');
  return `<option value="">— Kontakt wählen…</option><optgroup label="Firmen">${fo}</optgroup><optgroup label="Kontakte">${ko}</optgroup>`;
}
function renderBet(){
  const byRole=r=>BET.filter(b=>b.rolle===r);
  function card(role,lbl,fallbackNm,fallbackCt){
    const rows=byRole(role);
    const sel=rows.length?(rows[0].firma_id?('f:'+rows[0].firma_id):(rows[0].kontakt_id?('k:'+rows[0].kontakt_id):'')):'';
    let body;
    if(rows.length)body=rows.map(b=>`<div><div class="nm">${esc(b.name||'—')}</div>${b.sub?`<div style="font-size:11.5px;color:var(--muted)">${esc(b.sub)}</div>`:''}${[b.tel,b.email].filter(Boolean).map(x=>`<div class="ct">${esc(x)}</div>`).join('')} <button class="del" style="background:none;border:0;color:var(--red);cursor:pointer;font-size:11px;padding:0;margin-top:4px" onclick="clearBet('${role}')">entfernen</button></div>`).join('');
    else if(fallbackNm)body=`<div class="nm">${esc(fallbackNm)}</div>${fallbackCt?`<div class="ct">${esc(fallbackCt)}</div>`:''}`;
    else body=`<div class="ct" style="font-style:italic">— nicht zugeordnet</div>`;
    return `<div class="person"><div class="rl">${lbl}</div>${body}
      <select class="estat" style="width:100%;margin-top:9px;font-size:12px" onchange="setBet('${role}',this.value)">${betOptions(sel)}</select></div>`;
  }
  document.getElementById('bet').innerHTML=
    card('vermieter','Eigentümer / Vermieter',OB.eigentuemer,'')+
    card('hausverwaltung','Hausverwaltung',OB.hausverwaltung,[OB.hausverwaltung_tel,OB.hausverwaltung_email].filter(Boolean).join(' · '))+
    card('hausverwalter','Hausverwalter','','')+
    card('objekthausmeister','Objekthausmeister','','');
}
async function setBet(role,val){
  if(!val){return clearBet(role);}
  let rec={object_id:id,rolle:role};
  if(val.startsWith('f:')){const f=FIRMEN.find(x=>x.id===val.slice(2));if(!f)return;rec.firma_id=f.id;rec.kontakt_id=null;rec.name=f.name;rec.sub=f.branche||null;rec.tel=f.telefon||null;rec.email=null;}
  else{const k=KONTAKTE.find(x=>x.id===val.slice(2));if(!k)return;rec.kontakt_id=k.id;rec.firma_id=k.firma_id||null;rec.name=[k.vorname,k.name].filter(Boolean).join(' ');rec.sub=k.position||null;rec.tel=k.telefon||null;rec.email=k.email||null;}
  await sb.from('nahaus_objekt_beteiligte').delete().eq('object_id',id).eq('rolle',role);
  const {data}=await sb.from('nahaus_objekt_beteiligte').insert(rec).select().maybeSingle();
  BET=BET.filter(b=>b.rolle!==role);if(data)BET.push(data);renderBet();
}
async function clearBet(role){await sb.from('nahaus_objekt_beteiligte').delete().eq('object_id',id).eq('rolle',role);BET=BET.filter(b=>b.rolle!==role);renderBet();}
const MILES=[['m_kaufvertrag','Kaufvertrag'],['m_zahlung','Zahlung Kaufpreis'],['m_uebergabe','Übergabe Nutzen/Lasten'],['m_grundbuch','Eintragung Grundbuch']];
function txCard(typ,lbl,icon,parties){
  const t=TX[typ]||{};
  const rows=MILES.map(m=>`<div class="mile ${t[m[0]]?'done':''}" onclick="toggleMile('${typ}','${m[0]}')"><span class="dot"></span>${m[1]}<span class="dt">${t[m[0]]?'erledigt':'offen'}</span></div>`).join('');
  const pbtns=parties.map(p=>{const val=t[p[1]];return `<button class="ghost sm" onclick="setParty('${typ}','${p[1]}')">${val?'✓ '+esc(val):'+ '+p[0]}</button>`;}).join('');
  const anyDone=MILES.some(m=>t[m[0]]);
  return `<div class="txc"><div class="txh"><div class="txicon ${typ}">${icon}</div><div class="txttl">${lbl}</div><span class="pill" style="background:${anyDone?'var(--accent)':'#9aa0ad'}">${anyDone?'in Arbeit':'offen'}</span></div>
    <div class="pbtns">${pbtns}</div>${rows}</div>`;
}
function renderTransakt(){
  const done=['ankauf','verkauf'].reduce((s,ty)=>s+MILES.filter(m=>(TX[ty]||{})[m[0]]).length,0);
  document.getElementById('milebar').innerHTML='▬'.repeat(8).split('').map((_,i)=>`<span class="mb ${i<done?'on':''}"></span>`).join('')+`<span class="milecount">${done}/8 Meilensteine</span>`;
  const stell=UNITS.filter(s=>/PARK/.test(s.kategorie_typ||''));
  const stellBlock=stell.length?`<div class="stellbox"><div class="vhd"><span class="sbtl">Stellplätze im Verkauf</span><span class="sbnum">${stell.length} von ${stell.length}</span></div>
    ${stell.map(s=>`<div class="stellrow"><span class="sdot"></span><b>${esc(s.w_id_text||s.label||'')}</b> ${esc(KAT[s.kategorie_typ]||'Stellplatz')}<span class="dt">geht mit</span></div>`).join('')}</div>`:'';
  document.getElementById('transakt').innerHTML=
    txCard('ankauf','Ankauf','🏠',[['Verkäufer wählen','partner'],['Notar wählen','notar']])+
    `<div>${txCard('verkauf','Verkauf','💎',[['Käufer wählen','partner'],['Verkaufsmakler wählen','makler'],['Notar wählen','notar']])}${stellBlock}</div>`;
}
async function toggleMile(typ,col){
  const cur=TX[typ]||{object_id:id,typ};const nv=!cur[col];
  const {data}=await sb.from('nahaus_objekt_transaktion').upsert({object_id:id,typ,[col]:nv},{onConflict:'object_id,typ'}).select().maybeSingle();
  TX[typ]=data||Object.assign(cur,{[col]:nv});renderTransakt();}
async function setParty(typ,col){const cur=TX[typ]||{};const val=prompt('Name:',cur[col]||'');if(val===null)return;
  const {data}=await sb.from('nahaus_objekt_transaktion').upsert({object_id:id,typ,[col]:val.trim()||null},{onConflict:'object_id,typ'}).select().maybeSingle();
  TX[typ]=data||Object.assign(cur,{[col]:val});renderTransakt();}
function renderNotes(){
  const el=document.getElementById('notes');
  el.innerHTML=NOTES.length?NOTES.map(n=>`<div class="note"><div class="nt">${esc(n.text).replace(/\n/g,'<br>')}</div><div class="nmeta">${dfmt(n.created_at)} <button class="del" onclick="delNote('${n.id}')">löschen</button></div></div>`).join(''):'<div class="empty">Noch keine Notizen.</div>';
}
async function addNote(){const t=(document.getElementById('noteInput').value||'').trim();if(!t)return;
  const {data}=await sb.from('nahaus_objekt_notizen').insert({object_id:id,text:t}).select().maybeSingle();
  if(data){NOTES.unshift(data);document.getElementById('noteInput').value='';renderNotes();}}
async function delNote(nid){await sb.from('nahaus_objekt_notizen').delete().eq('id',nid);NOTES=NOTES.filter(n=>n.id!==nid);renderNotes();}
function renderLage(){
  const box=document.getElementById('lagebox');
  if(!(OB.lat&&OB.lng)){box.innerHTML='<div class="empty">Keine Geokoordinaten hinterlegt.</div>';return;}
  box.innerHTML='<div id="map"></div>';
  setTimeout(()=>{if(mapDone)return;const map=L.map('map').setView([OB.lat,OB.lng],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);L.marker([OB.lat,OB.lng]).addTo(map).bindPopup(esc(OB.name||'')).openPopup();mapDone=true;},60);
}
load();
</script></body></html>
