<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anschreiben – Wohntraum OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>window.OS_APP='oc';</script>
<script src="/os-docstore.js?v=20261012b"></script>
<style>
:root{
  --bg:#f3f5f8;--card:#ffffff;--ink:#18202c;--muted:#5f6b7a;--line:#e0e5eb;--soft:#eef1f5;
  --accent:#2f5d8a;--accent-ink:#ffffff;--accent-soft:#e3ecf5;
  --pos:#1d7a4c;--pos-bg:#e5f4ec;--neg:#b42318;--neg-bg:#fcebe9;--warn:#946200;--warn-bg:#fff4d6;--chip:#edf1f6;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b;--card:#1a1f28;--ink:#e5e9ef;--muted:#97a1af;--line:#2b323e;--soft:#222935;
    --accent:#72a6d8;--accent-ink:#0d1117;--accent-soft:#1f2c3b;
    --pos:#5cc98e;--pos-bg:#15301f;--neg:#f07b70;--neg-bg:#3a1c19;--warn:#e7b949;--warn-bg:#342e18;--chip:#252c38;color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui)}
main{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.ch{font-weight:600;font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:2fr 1fr 2fr;gap:10px}
@media (max-width:600px){.row,.row3{grid-template-columns:1fr}}
label.fl{display:block;font-size:12px;color:var(--muted);margin:8px 0 0}
label.fl input,label.fl textarea{display:block;width:100%;margin-top:3px}
input,textarea,button{font:inherit;color:var(--ink)}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
input:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{resize:vertical;line-height:1.5}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.small{font-size:12px;padding:4px 9px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 12px;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.note{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--muted);margin-top:10px;background:var(--soft)}
.note.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.note.ok{background:var(--pos-bg);color:var(--pos);border-color:transparent}
.note b{color:inherit}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.adr{white-space:pre-line;background:var(--soft);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:6px}
.kibox{border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin-top:12px;background:var(--accent-soft)}
.kibox .txt{white-space:pre-wrap;background:var(--card);border-radius:8px;padding:9px 11px;font-size:13px;margin-top:6px;max-height:340px;overflow:auto}
.kibox ul{margin:6px 0 0 18px;padding:0;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;border-bottom:1px solid var(--line);padding:5px 6px}
td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top}
a{color:var(--accent)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:20;max-width:90vw}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
</style>
</head>
<body>
<main id="app"><div class="empty">Lade …</div></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date().toISOString().slice(0,10);
const dmy=x=>String(x||'').slice(0,10).split('-').reverse().join('.');
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim();
const odSafe=s=>String(s||'').replace(/[\\/:*?"<>|#%]/g,'_').replace(/\s+/g,' ').trim();
const encS=f=>f.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss').replace(/&/g,'und').replace(/[^A-Za-z0-9 ._\/-]/g,'_');
let tT=null, RENDERING=false; function toast(m){ let e=document.querySelector('.toast'); if(!e){ e=document.createElement('div'); e.className='toast'; document.body.appendChild(e); } e.textContent=m; clearTimeout(tT); tT=setTimeout(()=>e.remove(),4200); }

/* ---------- Stammdaten ---------- */
const ADR={V11:'Vorstädter Straße 11|55276 Oppenheim',A14:'Abtweilerstraße 14|55568 Lauschied',E4:'Eiermarkt 4|55545 Bad Kreuznach',H3:'Hammer Straße 3|67575 Eich',H44:'Hochstraße 44|55545 Bad Kreuznach',K6:'Kreuzstraße 6|55546 Fürfeld',K7:'In den Kirchgärten 7|55278 Dexheim',K28:'Krämerstraße 28|55276 Oppenheim',Kw30:'Kellerweg 30|67583 Guntersblum',M8:'Mannheimer Straße 8|55545 Bad Kreuznach',R6:'Am Römer 6|67598 Gundersheim',S16:'St.-Georgen-Straße 16|55232 Alzey',S58:'Schlossgasse 58|55232 Alzey',U6:'Uhlandstraße 6|55543 Bad Kreuznach',Rh24:'Rheinstraße 24|55283 Nierstein'};
const NUTZER={'ramona@andersmacher.info':'Ramona','juergen@andersmacher.info':'Jürgen','eric@andersmacher.info':'Eric'};
const GES_DEF={
  WT:{name:'Wohn(T)raum Rheinhessen GmbH',strasse:'Dalheimer Straße 70',ort:'55278 Dexheim',datumOrt:'Dexheim',geprueft:true},
  EE:{name:'Eric Eisenhardt',strasse:'Kellerweg 30',ort:'67583 Guntersblum',datumOrt:'Guntersblum',geprueft:true},
  KiBo:{name:'Wohn(T)raum KiBo GmbH',strasse:'Dalheimer Straße 70',ort:'55278 Dexheim',datumOrt:'Dexheim',geprueft:false},
  WW:{name:'Wohntraum Wonnegau GmbH',strasse:'Dalheimer Straße 70',ort:'55278 Dexheim',datumOrt:'Dexheim',geprueft:false},
  Andersmacher:{name:'Anders MACHER GmbH',strasse:'Dalheimer Straße 70',ort:'55278 Dexheim',datumOrt:'Dexheim',geprueft:false},
  FlyWithAly:{name:'Fly with Aly',strasse:'Dalheimer Straße 70',ort:'55278 Dexheim',datumOrt:'Dexheim',geprueft:false}
};
const UNTER=['Eric Eisenhardt','Ramona Romanelli','Jürgen Reuter'];
const VERSAND=['Standardbrief','Einschreiben Einwurf','Einschreiben mit Rückschein','Einschreiben (Übergabe)','Per Boten','Persönliche Übergabe','Per E-Mail'];
const VERMERK={'Standardbrief':'','Einschreiben Einwurf':'Einschreiben Einwurf','Einschreiben mit Rückschein':'Einschreiben mit Rückschein','Einschreiben (Übergabe)':'Einschreiben','Per Boten':'Per Boten','Persönliche Übergabe':'Persönliche Übergabe','Per E-Mail':'Per E-Mail'};
const DL_BASIS='Prozesslandkarte 3.0/30.000 Banken & Dienstleister/Dienstleister';

let db=null, sb=null, MK={}, EDIT={}, OBJ=[], FIRMEN=[], KONT=[], ABSD={}, LISTE=[], ICH='', ICHMAIL='', ICHID='', ICHVOLL='', geladen=false, fehler='';
let S=leer();
function leer(alt){ alt=alt||{}; return {ges:alt.ges||'WT',versand:'Standardbrief',empf:null,modus:'suche',such:'',neuTyp:'firma',nf:{name:'',vorname:'',firma:'',strasse:'',plz:'',ort:'',email:''},adresse:'',anrede:'',betreff:'',text:'',unter:alt.unter||ICHVOLL||'',ki:null,busy:'',absEdit:false}; }

/* Gesellschaft / Absender */
const absender=k=>Object.assign({},GES_DEF[k]||{},ABSD[k]||{});
const gesLabel=k=>k+' – '+(absender(k).name||k);
const gesKeys=()=>[...new Set(Object.keys(GES_DEF).concat(Object.keys(ABSD)))];

/* Mieter */
const ed=mk=>Object.assign({},mk,EDIT[mk.pid]||{});
function uName(s){ s=String(s||'').trim(); let m=s.match(/^we\s*(\d+)(?:\s*[.\s]\s*(\d+)(?!\d))?(.*)$/i);
  if(m){ const rest=m[3].replace(/zi\s*(\d+)/gi,'Zi$1').replace(/\s+/g,' ').trim(); return 'WE'+m[1]+(m[2]?'.'+m[2]:'')+(rest?' '+rest:''); }
  m=s.match(/^(garage|lager|stellplatz)\s*(\d+)$/i); if(m) return m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+m[2]; return s; }
function aktenName(mk){ const e=ed(mk), K=mk.kontakte||[]; const n=(K[0]&&K[0].name)||String(e.mieter||'').split(',')[0]||''; const ln=(mk.namen||[])[0]||''; let nn;
  if(ln&&n.endsWith(ln)&&n.length>ln.length) nn=ln.toUpperCase()+' '+n.slice(0,n.length-ln.length).trim(); else { const w=n.trim().split(/\s+/); nn=w.length>1?w[w.length-1].toUpperCase()+' '+w.slice(0,-1).join(' '):n.toUpperCase(); }
  return mk.obj+'_'+uName(mk.einheit).replace(/\s+/g,'')+'_'+nn; }
function anredeMieter(mk){ const e=ed(mk), an=String(e.anrede||'').trim(), name=e.mieter||'';
  if(!an) return 'Guten Tag '+name+',';
  if(/^(sehr|liebe|hallo|guten)/i.test(an)) return an.replace(/,?$/,',');
  return an.split(/\s*(?:,|\bund\b)\s*/).filter(Boolean).map((t,i)=>(i?'s':'S')+'ehr geehrte'+(/^herr/i.test(t)?'r ':' ')+t).join(', ')+','; }
function adrMieter(mk){ const e=ed(mk), a=(ADR[mk.obj]||'').split('|'); const o=OBJ.find(q=>q.kz===mk.obj)||{};
  let str=a[0]||'', ort=a[1]||''; if(!str&&o.adresse){ const p=String(o.adresse).split(','); str=p[0]||''; ort=(p[1]||'').trim(); }
  return [e.mieter||'',str+(mk.einheit&&!/efh/i.test(mk.einheit)?', '+uName(mk.einheit):''),ort].filter(Boolean).join('\n'); }
const gesMieter=mk=>{ const o=OBJ.find(q=>q.kz===mk.obj)||{}; return o.ges||mk.ges||'WT'; };

/* Firmen und Kontakte */
const firmaVon=id=>FIRMEN.find(f=>f.id===id)||null;
const kName=k=>[k.vorname,k.name].filter(Boolean).join(' ');
function adrFirma(f){ return [f.name,f.strasse||'',[f.plz,f.ort].filter(Boolean).join(' ')||(f.adresse&&!f.strasse?f.adresse:'')].filter(s=>String(s).trim()).join('\n'); }
function adrKontakt(k){ const f=firmaVon(k.firma_id); const str=k.strasse||(f&&f.strasse)||'', ort=[k.plz,k.ort].filter(Boolean).join(' ')||(f?[f.plz,f.ort].filter(Boolean).join(' '):'');
  return [f?f.name:'',kName(k),str,ort].filter(s=>String(s).trim()).join('\n'); }

/* Empfängerliste für die Suche */
let LAB={};
function empfListe(){ LAB={}; const out=[]; const add=(l,v)=>{ let x=l, i=2; while(LAB[x]) x=l+' ('+(i++)+')'; LAB[x]=v; out.push(x); };
  for(const mk of Object.values(MK).sort((a,b)=>(a.obj+a.einheit).localeCompare(b.obj+b.einheit,'de'))){ const e=ed(mk); if(!e.mieter) continue; const weg=mk.bis&&mk.bis<today;
    add('Mieter: '+e.mieter+' – '+mk.obj+' '+uName(mk.einheit)+(weg?' (ausgezogen)':''),{typ:'mieter',id:mk.pid}); }
  for(const f of FIRMEN.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'de'))) add('Firma: '+f.name+(f.ort?' – '+f.ort:''),{typ:'firma',id:f.id});
  for(const k of KONT.slice().sort((a,b)=>kName(a).localeCompare(kName(b),'de'))){ const f=firmaVon(k.firma_id); add('Kontakt: '+kName(k)+(f?' – '+f.name:''),{typ:'kontakt',id:k.id}); }
  return out; }
function empfObj(e){ if(!e) return null; if(e.typ==='mieter') return MK[e.id]||null; if(e.typ==='firma') return firmaVon(e.id); if(e.typ==='kontakt') return KONT.find(k=>k.id===e.id)||null; return null; }
function empfName(e){ const o=empfObj(e); if(!o) return ''; if(e.typ==='mieter') return ed(o).mieter||''; if(e.typ==='firma') return o.name||''; return kName(o); }
function empfWaehlen(v){ S.empf=v; const o=empfObj(v); if(!o) return;
  if(v.typ==='mieter'){ S.adresse=adrMieter(o); S.anrede=anredeMieter(o); S.ges=gesMieter(o); }
  else if(v.typ==='firma'){ S.adresse=adrFirma(o); S.anrede='Sehr geehrte Damen und Herren,'; }
  else { S.adresse=adrKontakt(o); S.anrede='Guten Tag '+kName(o)+','; } }

/* ---------- API ---------- */
async function token(){ try{ const {data}=await sb.auth.getSession(); return (data&&data.session&&data.session.access_token)||''; }catch(e){ return ''; } }
async function api(pfad,body,label){ const tok=await token(); let r; try{ r=await fetch(pfad,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(body)}); }catch(e){ throw new Error(label+' nicht erreichbar.'); }
  let j=null; try{ j=await r.json(); }catch(e){} if(!j) throw new Error(r.status===404?label+' ist noch nicht online (Deploy abwarten).':label+' nicht erreichbar ('+r.status+').'); if(j.error) throw new Error(j.error); return j; }
const odApi=b=>api('/api/onedrive',b,'OneDrive');
const kiApi=b=>api('/api/ki',b,'Die KI');

/* ---------- Laden ---------- */
async function loadIch(){ try{ const {data:{user}}=await sb.auth.getUser(); if(!user) return; let n=(user.user_metadata&&(user.user_metadata.full_name||user.user_metadata.name))||'';
  try{ const {data}=await sb.from('profiles').select('full_name,email').eq('id',user.id).maybeSingle(); if(data&&data.full_name) n=data.full_name; }catch(e){}
  ICHID=user.id; ICHMAIL=String(user.email||'').toLowerCase(); ICHVOLL=n||''; ICH=NUTZER[ICHMAIL]||n||user.email||''; if(!S.unter) S.unter=ICHVOLL; }catch(e){} }
async function loadKontakte(){ try{ const [f,k]=await Promise.all([sb.from('hv_firmen').select('id,name,strasse,plz,ort,adresse,kategorien').order('name'),sb.from('hv_kontakte').select('id,firma_id,vorname,name,email,strasse,plz,ort').order('name')]);
  if(f.error) throw f.error; if(k.error) throw k.error; FIRMEN=f.data||[]; KONT=k.data||[]; }catch(e){ fehler='Firmen und Kontakte nicht lesbar: '+(e.message||e); } render(); }
(async()=>{
  try{ db=await claude.use('db'); }catch(e){ db=null; }
  sb=window.osSupabase; if(!db||!sb){ $('app').innerHTML='<div class="card">Bitte zuerst im OS anmelden.</div>'; return; }
  await loadIch(); loadKontakte();
  db.collection('mietkonten').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{m[d.id]=d.data();}); MK=m; geladen=true; render(); },()=>{ geladen=true; render(); });
  db.doc('stamm/mietkonten-edit').onSnapshot(s=>{ EDIT=(s.exists?s.data().e:null)||{}; render(); },()=>{});
  db.doc('stamm/objekte').onSnapshot(s=>{ OBJ=(s.exists?s.data().objekte:null)||[]; render(); },()=>{});
  db.doc('stamm/briefabsender').onSnapshot(s=>{ ABSD=(s.exists?s.data().g:null)||{}; render(); },()=>{});
  db.collection('anschreiben').onSnapshot(q=>{ LISTE=q.docs.map(d=>d.data()).sort((a,b)=>String(b.d).localeCompare(String(a.d))); render(); },()=>{});
})();

/* ---------- Oberfläche ---------- */
function dl(id,werte){ return '<datalist id="'+id+'">'+werte.map(v=>'<option value="'+esc(v)+'"></option>').join('')+'</datalist>'; }
function render(){ const app=$('app'); if(!app) return;
  const akt=document.activeElement, fid=akt&&akt.id, sel=akt&&akt.selectionStart!=null?[akt.selectionStart,akt.selectionEnd]:null;
  const A=absender(S.ges), labels=empfListe();
  let h='<h1>Anschreiben</h1><div class="sub">Brief aufsetzen, von der KI prüfen lassen, als PDF erstellen und beim Empfänger ablegen.</div>';
  if(fehler) h+='<div class="note warn">'+esc(fehler)+'</div>';
  h+='<div class="grid"><div>';
  /* Absender und Versand */
  h+='<div class="card"><div class="ch">Absender und Versand</div><div class="row">'
    +'<label class="fl">Gesellschaft<input id="f-ges" data-pick="1" list="l-ges" value="'+esc(gesLabel(S.ges))+'" placeholder="Gesellschaft eintippen …">'+dl('l-ges',gesKeys().map(gesLabel))+'</label>'
    +'<label class="fl">Versandart<input id="f-versand" data-pick="1" list="l-versand" value="'+esc(S.versand)+'" placeholder="Versandart eintippen …">'+dl('l-versand',VERSAND)+'</label></div>'
    +'<div class="sub" style="margin-top:6px">Absender: '+esc([A.name,A.strasse,A.ort].filter(Boolean).join(', '))+' <button class="ghost small" data-absedit="1">'+(S.absEdit?'schließen':'bearbeiten')+'</button></div>';
  if(!A.geprueft&&!S.absEdit) h+='<div class="note warn">Die Adresse dieser Gesellschaft ist noch nicht geprüft. Bitte einmal unter „bearbeiten“ kontrollieren und speichern.</div>';
  if(S.absEdit) h+='<div class="row"><label class="fl">Name im Briefkopf<input id="a-name" value="'+esc(A.name||'')+'"></label><label class="fl">Ort für das Datum<input id="a-dort" value="'+esc(A.datumOrt||'')+'"></label></div>'
    +'<div class="row"><label class="fl">Straße und Hausnummer<input id="a-str" value="'+esc(A.strasse||'')+'"></label><label class="fl">PLZ und Ort<input id="a-ort" value="'+esc(A.ort||'')+'"></label></div>'
    +'<div class="row"><label class="fl">Telefon (optional, Fußzeile)<input id="a-tel" value="'+esc(A.tel||'')+'"></label><label class="fl">E-Mail (optional, Fußzeile)<input id="a-mail" value="'+esc(A.mail||'')+'"></label></div>'
    +'<div class="acts"><button class="primary small" data-abssave="1">Absender speichern</button></div>';
  h+='</div>';
  /* Empfänger */
  h+='<div class="card"><div class="ch">Empfänger<span class="seg"><button class="'+(S.modus==='suche'?'on':'')+'" data-modus="suche">Aus der Datenbank</button><button class="'+(S.modus==='neu'?'on':'')+'" data-modus="neu">Neu eingeben</button></span></div>';
  if(S.modus==='suche'){
    h+='<label class="fl">Mieter, Firma oder Kontakt suchen<input id="f-such" data-pick="1" list="l-empf" value="'+esc(S.such)+'" placeholder="Namen, Firma oder Objekt eintippen …" autocomplete="off">'+dl('l-empf',labels)+'</label>';
    if(!geladen) h+='<div class="sub">Lade Mieter …</div>';
    if(S.empf) h+='<div class="sub" style="margin-top:6px"><span class="pill">'+({mieter:'Mieter',firma:'Firma',kontakt:'Kontakt'}[S.empf.typ])+'</span> Ablage: '+esc(ablageText())+'</div>';
  } else { const n=S.nf;
    h+='<div class="acts" style="margin-top:0"><span class="seg"><button class="'+(S.neuTyp==='firma'?'on':'')+'" data-neutyp="firma">Firma / Behörde</button><button class="'+(S.neuTyp==='person'?'on':'')+'" data-neutyp="person">Person</button></span></div>'
      +(S.neuTyp==='firma'?'<label class="fl">Name der Firma oder Behörde<input id="n-name" value="'+esc(n.name)+'"></label>'
        :'<div class="row"><label class="fl">Vorname<input id="n-vorname" value="'+esc(n.vorname)+'"></label><label class="fl">Nachname<input id="n-name" value="'+esc(n.name)+'"></label></div>'
         +'<label class="fl">Gehört zur Firma (optional)<input id="n-firma" data-pick="1" list="l-firmen" value="'+esc(n.firma)+'" placeholder="Firma eintippen …">'+dl('l-firmen',FIRMEN.map(f=>f.name))+'</label>')
      +'<div class="row3"><label class="fl">Straße und Hausnummer<input id="n-strasse" value="'+esc(n.strasse)+'"></label><label class="fl">PLZ<input id="n-plz" value="'+esc(n.plz)+'"></label><label class="fl">Ort<input id="n-ort" value="'+esc(n.ort)+'"></label></div>'
      +'<label class="fl">E-Mail (optional)<input id="n-email" value="'+esc(n.email)+'"></label>'
      +'<div class="sub" style="margin-top:6px">'+esc(neuHinweis())+'</div>';
  }
  h+='<label class="fl">Anschrift im Brief (kann angepasst werden)<textarea id="f-adresse" rows="4">'+esc(S.adresse)+'</textarea></label></div>';
  /* Brief */

      const von=(mk.von||'').slice(0,10); if(von&&n.includes(von)) s+=1; return Object.assign({},o,{s}); }).sort((a,b)=>b.s-a.s);

  if(d.kino){ S.ki=null; render(); return; }
