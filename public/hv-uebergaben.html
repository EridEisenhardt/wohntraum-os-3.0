  if(t.id==='w-q'){W.q=t.value;render();const q=document.getElementById('w-q');q.focus();q.setSelectionRange(q.value.length,q.value.length);return;}

  if(ANS==='edit'&&t.dataset.f&&!gesperrt()){setze(t.dataset.f,t.type==='checkbox'?t.checked:t.value);
    if(t.dataset.f==='teilnehmer.mieter'&&!D.mieter.name)D.mieter.name=t.value;speichernBald();}});

  const zeile={daten:D,unterschriften:U,datum:PR.datum,mietbeginn:PR.mietbeginn,mietende:PR.mietende,mieter_name:D.mieter.name||D.teilnehmer.mieter||PR.mieter_name,updated_at:new Date().toISOString()};

/* ---------- Fotos ---------- */
function verkleinern(datei,max){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(datei);img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,f=Math.min(1,max/Math.max(w,h));w=Math.round(w*f);h=Math.round(h*f);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Bild konnte nicht gelesen werden.')),'image/jpeg',.82);};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Bild konnte nicht gelesen werden.'));};img.src=u;});}
async function fotosHoch(inp){const L=[...(inp.files||[])],art=inp.dataset.foto,i=+inp.dataset.i;inp.value='';if(!L.length)return;
  toast(L.length===1?'Foto wird hochgeladen …':L.length+' Fotos werden hochgeladen …',60000);let n=0;
  for(const f of L){try{const b=await verkleinern(f,1600),pfad=PR.id+'/fotos/'+Date.now()+'-'+rid()+'.jpg';
      const {error}=await sb.storage.from(BUCKET).upload(pfad,b,{contentType:'image/jpeg'});if(error)throw error;
      URLC[pfad]=URL.createObjectURL(b);if(art==='raum'){D.raeume[i].fotos=D.raeume[i].fotos||[];D.raeume[i].fotos.push(pfad);}else D.zaehler[i].foto=pfad;n++;}
    catch(e){toast('Foto konnte nicht hochgeladen werden: '+(e.message||e));}}
  if(n){toast(n===1?'Foto gespeichert.':n+' Fotos gespeichert.');speichernBald(0);renderErhalten();}}
async function fotoUrl(p){if(URLC[p])return URLC[p];const {data}=await sb.storage.from(BUCKET).createSignedUrl(p,3600);URLC[p]=data&&data.signedUrl||'';return URLC[p];}
function fotosZeigen(){document.querySelectorAll('img[data-pfad]').forEach(async im=>{const u=await fotoUrl(im.dataset.pfad);if(u)im.src=u;});}

  if(U[k]&&U[k].img){const im=new Image();im.onload=()=>g.drawImage(im,0,0,r.width,r.height);im.src=U[k].img;}
  if(gesperrt())return;let zieht=false,last=null,geaendert=false;
  const pos=ev=>{const b=c.getBoundingClientRect();return [ev.clientX-b.left,ev.clientY-b.top];};
  c.addEventListener('pointerdown',ev=>{zieht=true;geaendert=true;last=pos(ev);c.setPointerCapture(ev.pointerId);g.beginPath();g.arc(last[0],last[1],1,0,Math.PI*2);g.fillStyle='#14213d';g.fill();});

    return (await api('/api/onedrive',{aktion:'hochladen',pfad:ordner,name:nm,daten:b64,typ:'application/pdf'})).item||{};}
  const s=await api('/api/onedrive',{aktion:'sitzung',pfad:ordner,name:nm});const r=await fetch(s.uploadUrl,{method:'PUT',headers:{'Content-Range':'bytes 0-'+(blob.size-1)+'/'+blob.size},body:blob});
  if(!r.ok)throw new Error('Hochladen fehlgeschlagen ('+r.status+').');const j=await r.json();return {id:j.id,name:j.name,web:j.webUrl};}

  wiederoeffnen:async()=>{if(!confirm('Protokoll wieder bearbeiten? Beim erneuten Abschließen wird ein neues PDF erstellt.'))return;
    const {error}=await sb.from('uebergabeprotokolle').update({status:'Entwurf'}).eq('id',PR.id);if(error){toast(error.message);return;}PR.status='Entwurf';const i=P.findIndex(p=>p.id===PR.id);if(i>=0)P[i].status='Entwurf';renderErhalten();},
  odoeffnen:async()=>{const w=window.open('','_blank');try{const r=await api('/api/onedrive',{aktion:'link',id:PR.pdf_od.id});const u=r.web||r.download;if(w)w.location.href=u;else window.open(u,'_blank');}catch(e){if(w)w.close();toast(e.message||String(e));}},
  entwurfweg:async()=>{if(!confirm('Diesen Entwurf wirklich löschen?'))return;const {error}=await sb.from('uebergabeprotokolle').delete().eq('id',PR.id);if(error){toast(error.message);return;}
    P=P.filter(p=>p.id!==PR.id);try{localStorage.removeItem('ueb_'+PR.id);}catch(e){}PR=null;ANS='liste';render();toast('Entwurf gelöscht.');},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b,e);}});
laden();
</script></body></html>
