<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesellschaften</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f5f8;--card:#ffffff;--ink:#18202c;--muted:#5f6b7a;--line:#e0e5eb;--soft:#eef1f5;--accent:#2f5d8a;--accent-ink:#ffffff;--accent-soft:#e3ecf5;
  --pos:#1d7a4c;--pos-bg:#e5f4ec;--neg:#b42318;--neg-bg:#fcebe9;--warn:#946200;--warn-bg:#fff4d6;--chip:#edf1f6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:1240px;margin:0 auto;padding:16px 20px 60px}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12px}
.kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{font-size:12px;padding:3px 8px}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.warn{color:var(--neg)}
button:disabled{opacity:.55;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi .l{font-size:12px;font-weight:700;color:var(--muted)}.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.inp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;padding:6px 12px}.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.ch{font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
details.sec>summary.ch{cursor:pointer;list-style:none;margin-bottom:0;justify-content:flex-start}details.sec>summary.ch::-webkit-details-marker{display:none}
details.sec>summary.ch::before{content:'▸';margin-right:8px;color:var(--muted)}details.sec[open]>summary.ch::before{content:'▾'}details.sec[open]>summary.ch{margin-bottom:8px}
details.sec>summary.ch .sub{margin-left:auto}
.kvgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:36px}.kvcol{min-width:0}
.kvr{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}.kvr:last-child{border-bottom:0}
.kvr span{color:var(--muted);white-space:nowrap}.kvr b{text-align:right;font-weight:600;overflow-wrap:anywhere}
.fl{display:grid;gap:2px;font-size:12px;color:var(--muted);margin-bottom:8px}
.fl input,.fl select,.fl textarea{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13.5px;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}.g3{display:grid;grid-template-columns:repeat(3,1fr);column-gap:14px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap;background:var(--chip);color:var(--muted)}
.p-ok{background:var(--pos-bg);color:var(--pos)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-neg{background:var(--neg-bg);color:var(--neg)}.p-blau{background:var(--accent-soft);color:var(--accent)}
.tab{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
.tab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tab td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tab td.n,.tab th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tab tr.kl td{cursor:pointer}.tab tr.kl:hover td{background:var(--accent-soft)}
.tab tr.summe td{font-weight:700;background:var(--soft)}
.tbox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.empty{color:var(--muted);font-size:13px;padding:20px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:12px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
.ord{border-top:1px solid var(--line);padding:6px 0}
.ord .oh{display:flex;gap:8px;align-items:center}
.ord .dt{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0 3px 18px}
.ord .dt a{color:var(--accent);cursor:pointer;text-decoration:none;overflow-wrap:anywhere}.ord .dt a:hover{text-decoration:underline}
label.up{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--card);cursor:pointer;font-size:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.voll{position:fixed;inset:0;background:rgba(10,14,20,.85);display:flex;align-items:center;justify-content:center;z-index:100;cursor:zoom-out}.voll img{max-width:94vw;max-height:92vh;border-radius:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:120}.toast.on{opacity:1}
@media(max-width:800px){.wrap{padding:12px}.kvgrid,.g2,.g3{grid-template-columns:1fr}.hide-m{display:none}}
</style></head><body>
<div class="wrap" id="app"><div class="empty">Gesellschaften werden geladen …</div></div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const p2=n=>String(n).padStart(2,'0');
const dmy=x=>{const s=String(x||'').slice(0,10);return /^\d{4}-\d\d-\d\d$/.test(s)?s.split('-').reverse().join('.'):'';};
const ibanF=i=>String(i||'').replace(/\s+/g,'').replace(/(.{4})/g,'$1 ').trim();
const ROOT='Prozesslandkarte 3.0';
let G=[],KO=[],OBJ=[],FZ=[],AKT=null,EDIT=false,KE=null,OD={},SEC={},FILTER='';
try{SEC=JSON.parse(localStorage.getItem('ges_sec')||'{}')||{};}catch(e){}
function toast(t,ms){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),ms||3800);}
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input[list]')){t.dataset.alt=t.value;t.value='';}});
document.addEventListener('focusout',e=>{const t=e.target;if(t.matches&&t.matches('input[list]')&&!t.value&&t.dataset.alt){t.value=t.dataset.alt;}});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.matches&&d.matches('details.sec[data-sec]')){SEC[d.dataset.sec]=d.open;try{localStorage.setItem('ges_sec',JSON.stringify(SEC));}catch(x){}if(d.open&&d.dataset.sec==='Dokumente'&&AKT)dokLaden(AKT);}},true);
async function token(){const {data}=await sb.auth.getSession();return data&&data.session?data.session.access_token:'';}
async function odApi(body){let r;try{r=await fetch('/api/onedrive',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await token()},body:JSON.stringify(body)});}catch(e){throw new Error('OneDrive nicht erreichbar.');}
  let j=null;try{j=await r.json();}catch(e){}if(!j)throw new Error('OneDrive nicht erreichbar ('+r.status+').');if(j.error)throw new Error(j.error);return j;}
function cliqTeilen(titel,pfad){try{(window.top||window).postMessage({cliqTeilen:{titel:String(titel||''),link:location.origin+pfad}},location.origin);}catch(e){}}
function oeffneOS(p){try{(window.top||window).postMessage({osOeffne:p},location.origin);}catch(e){location.href=p;}}

async function laden(){const [g,k,o,f]=await Promise.all([sb.from('ges_gesellschaften').select('*').order('name'),sb.from('ges_konten').select('*').order('art'),
    sb.from('obj_objekte').select('id,kz,name,strasse,plz,ort,gesellschaft,status,eigentuemer').order('kz'),sb.from('fz_fahrzeuge').select('id,kennzeichen,modell,gesellschaft,status,fahrer').order('kennzeichen')]);
  if(g.error){document.getElementById('app').innerHTML='<div class="empty">Gesellschaften konnten nicht geladen werden. Bitte im OS angemeldet sein.</div>';return;}
  G=g.data||[];KO=k.data||[];OBJ=o.data||[];FZ=f.data||[];
  const q=new URLSearchParams(location.search).get('kz');if(q){const x=G.find(y=>y.kuerzel===q);if(x)AKT=x.id;}
  render();}
const gVon=id=>G.find(x=>x.id===id)||{};
const gleich=(a,b)=>String(a||'').toLowerCase()===String(b||'').toLowerCase();
const objVon=g=>OBJ.filter(o=>gleich(o.gesellschaft,g.kuerzel));
const fzVon=g=>FZ.filter(o=>gleich(o.gesellschaft,g.kuerzel));
const koVon=g=>KO.filter(o=>gleich(o.gesellschaft,g.kuerzel));
const adr=g=>[g.strasse,[g.plz,g.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ');
function statusPill(s){return s==='aktiv'?'<span class="pill p-ok">aktiv</span>':s==='in Gründung'?'<span class="pill p-blau">in Gründung</span>':'<span class="pill p-warn">'+esc(s||'')+'</span>';}
function render(){const app=document.getElementById('app');if(AKT){app.innerHTML=detail(gVon(AKT));return;}
  const q=FILTER.toLowerCase(),L=G.filter(g=>!q||[g.kuerzel,g.name,g.ort,g.hr_nummer].join(' ').toLowerCase().includes(q));
  app.innerHTML=`<div class="kopf"><div><h1>Gesellschaften</h1><div class="sub">Firmendaten, Bankkonten, zugeordnete Objekte und Fahrzeuge sowie die Unterlagen aus OneDrive (20.000 Verwaltung).</div></div>
    <div class="acts" style="margin-top:0"><button class="primary" data-a="neu">Gesellschaft anlegen</button></div></div>
    <div class="bar"><input class="inp" id="suche" placeholder="Suche: Kürzel, Name, Ort, HRB …" value="${esc(FILTER)}" style="flex:1;min-width:220px"></div>
    <div class="tbox" style="overflow-x:auto"><table class="tab"><thead><tr><th>Kürzel</th><th>Name</th><th>Status</th><th class="hide-m">Sitz</th><th class="hide-m">Handelsregister</th><th class="n">Objekte</th><th class="n">Fahrzeuge</th><th class="n">Konten</th></tr></thead><tbody>
    ${L.map(g=>`<tr class="kl" data-g="${g.id}"><td><b>${esc(g.kuerzel)}</b></td><td>${esc(g.name)}<div class="sub">${esc(g.art||'')}</div></td><td>${statusPill(g.status)}</td><td class="hide-m">${esc(adr(g))}</td><td class="hide-m">${esc([g.hr_nummer,g.hr_gericht].filter(Boolean).join(', '))}</td>
      <td class="n">${objVon(g).filter(o=>o.status!=='Verkauft').length}</td><td class="n">${fzVon(g).filter(f=>f.status==='aktiv').length}</td><td class="n">${koVon(g).filter(k=>k.aktiv).length}</td></tr>`).join('')}</tbody></table></div>`;}
const FELDER=[['kuerzel','Kürzel'],['name','Name'],['art','Rechtsform'],['status','Status','dl-status'],['strasse','Straße'],['plz','PLZ'],['ort','Ort'],['gruendung','Gründung','date'],
  ['geschaeftsfuehrer','Geschäftsführer'],['hr_gericht','Registergericht'],['hr_nummer','Handelsregister'],['steuernummer','Steuernummer'],['ust_id','Umsatzsteuer-ID'],['finanzamt','Finanzamt'],['buchhaltung','Buchhaltung'],['steuerberater','Steuerberater'],['zweck','Unternehmenszweck'],['onedrive_ordner','OneDrive-Ordner']];
const kv=(l,v)=>`<div class="kvr"><span>${l}</span><b>${v==null||v===''?'<span class="sub">–</span>':v}</b></div>`;
const spalten=L=>{const n=Math.ceil(L.length/2);return '<div class="kvgrid"><div class="kvcol">'+L.slice(0,n).join('')+'</div><div class="kvcol">'+L.slice(n).join('')+'</div></div>';};
function detail(g){if(!g.id)return '<div class="empty">Gesellschaft nicht gefunden.</div>';
  let h=`<div class="kopf"><div><h1>${esc(g.name)}</h1><div class="sub">${esc(g.kuerzel)} · ${esc(g.status||'')}${g.quelle?' · übernommen aus '+esc(g.quelle)+', bitte prüfen':''}</div></div>
    <div class="acts" style="margin-top:0"><button data-a="zurueck">Zurück zur Übersicht</button><button data-a="teilen">An Kollegen senden</button>${EDIT?'':'<button data-a="bearb">Bearbeiten</button>'}</div></div>`;
  if(EDIT)h+=`<div class="card"><div class="ch">Firmendaten bearbeiten</div><datalist id="dl-status"><option value="aktiv"><option value="in Gründung"><option value="in Auflösung"><option value="aufgelöst"></datalist>
      ${spalten(FELDER.map(([k,l,t])=>`<label class="fl">${l}<input data-e="${k}" ${t==='date'?'type="date"':t?'list="'+t+'"':''} value="${esc(g[k]==null?'':g[k])}"></label>`))}
      <label class="sub" style="display:flex;gap:6px;align-items:center;margin:4px 0 8px"><input type="checkbox" data-e="rechnungen"${g.rechnungen?' checked':''}> darf Rechnungen schreiben</label>
      <label class="fl">Notizen<textarea data-e="notizen" rows="3">${esc(g.notizen||'')}</textarea></label>
      <div class="acts"><button class="primary" data-a="speichern">Speichern</button><button data-a="abbrechen">Abbrechen</button></div></div>`;
  else h+=`<div class="card"><div class="ch">Firmendaten</div>${spalten([kv('Kürzel','<b>'+esc(g.kuerzel)+'</b>'),kv('Name',esc(g.name)),kv('Rechtsform',esc(g.art)),kv('Status',statusPill(g.status)),kv('Anschrift',esc(adr(g))),kv('Gründung',dmy(g.gruendung)),kv('Geschäftsführer',esc(g.geschaeftsfuehrer)),
      kv('Handelsregister',esc([g.hr_nummer,g.hr_gericht].filter(Boolean).join(', '))),kv('Steuernummer',esc(g.steuernummer)),kv('Umsatzsteuer-ID',esc(g.ust_id)),kv('Finanzamt',esc(g.finanzamt)),kv('Buchhaltung',esc(g.buchhaltung)),kv('Steuerberater',esc(g.steuerberater)),kv('Rechnungen schreiben',g.rechnungen?'ja':g.rechnungen===false?'nein':''),kv('Unternehmenszweck',esc(g.zweck))])}
      ${g.notizen?'<div class="sub" style="margin-top:8px;white-space:pre-wrap;color:var(--ink)">'+esc(g.notizen)+'</div>':''}</div>`;
  const ob=objVon(g),fz=fzVon(g),ko=koVon(g);
  const B=[['Bankkonten',ko.filter(k=>k.aktiv).length+' aktiv',konten(g,ko)],['Dokumente','OneDrive: '+(g.onedrive_ordner||'kein Ordner hinterlegt'),dokumente(g)],
    ['Fahrzeuge',fz.filter(f=>f.status==='aktiv').length+' aktiv',fz.length?'<div class="tbox"><table class="tab"><thead><tr><th>Kennzeichen</th><th>Modell</th><th>Fahrer</th><th>Status</th></tr></thead><tbody>'+fz.map(f=>`<tr class="kl" data-os="/verwalto/fuhrpark?id=${f.id}"><td><b>${esc(f.kennzeichen||'')}</b></td><td>${esc(f.modell||'')}</td><td>${esc(f.fahrer||'')}</td><td>${esc(f.status)}</td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">Keine Fahrzeuge zugeordnet.</div>'],
    ['Objekte',ob.filter(o=>o.status!=='Verkauft').length+' im Bestand',ob.length?'<div class="tbox"><table class="tab"><thead><tr><th>Kürzel</th><th>Adresse</th><th>Status</th></tr></thead><tbody>'+ob.map(o=>`<tr class="kl" data-os="/verwalto/objekt?id=${o.id}"><td><b>${esc(o.kz)}</b></td><td>${esc([o.strasse,[o.plz,o.ort].filter(Boolean).join(' ')].filter(Boolean).join(', '))}</td><td>${esc(o.status||'')}</td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">Keine Objekte zugeordnet.</div>']];
  for(const [n,s,inh] of B.sort((a,b)=>a[0].localeCompare(b[0],'de')))h+=`<details class="card sec" data-sec="${n}"${SEC[n]?' open':''}><summary class="ch">${n}<span class="sub">${esc(s)}</span></summary>${inh}</details>`;
  if(SEC.Dokumente&&!OD[g.id])setTimeout(()=>dokLaden(g.id),0);
  return h;}
const KARTEN=['Geschäftskonto','Mietkonto','Kautionskonto','Darlehen','Kreditkarte','Tagesgeld','Sonstiges'];
function konten(g,L){let h=`<div class="acts" style="margin-top:0;margin-bottom:6px"><button class="small primary" data-a="kneu">Konto hinzufügen</button><span class="sub">Zugangsdaten für das Online-Banking gehören nicht hierher.</span></div>`;
  if(KE)h+=`<div class="card" style="background:var(--soft)"><div class="g3"><label class="fl">Art<input id="k-art" list="dl-kart" value="${esc(KE.art||'Geschäftskonto')}"><datalist id="dl-kart">${KARTEN.map(a=>`<option value="${a}">`).join('')}</datalist></label>
    <label class="fl">Bezeichnung<input id="k-bez" value="${esc(KE.bezeichnung||'')}"></label><label class="fl">Bank<input id="k-bank" value="${esc(KE.bank||'')}"></label>
    <label class="fl">IBAN<input id="k-iban" value="${esc(ibanF(KE.iban))}"></label><label class="fl">BIC<input id="k-bic" value="${esc(KE.bic||'')}"></label><label class="fl">Kontoinhaber<input id="k-inh" value="${esc(KE.inhaber||g.name)}"></label>
    <label class="fl">Objekt (bei Mietkonten)<input id="k-obj" list="dl-obj" value="${esc(KE.objekt_kz||'')}"><datalist id="dl-obj">${OBJ.map(o=>`<option value="${esc(o.kz)}">`).join('')}</datalist></label><label class="fl" style="grid-column:span 2">Verwendung / Notiz<input id="k-verw" value="${esc(KE.verwendung||'')}"></label></div>
    <label class="sub" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="k-aktiv"${KE.aktiv===false?'':' checked'}> Konto wird genutzt</label>
    <div class="acts"><button class="primary small" data-a="ksave">Speichern</button><button class="small" data-a="kab">Abbrechen</button></div></div>`;
  if(!L.length)return h+'<div class="empty">Noch keine Konten hinterlegt.</div>';
  const sort=[...L].sort((a,b)=>(b.aktiv-a.aktiv)||String(a.art).localeCompare(String(b.art),'de')||String(a.objekt_kz||'').localeCompare(String(b.objekt_kz||''),'de'));
  return h+'<div class="tbox" style="overflow-x:auto"><table class="tab"><thead><tr><th>Art</th><th>Bank</th><th>IBAN</th><th class="hide-m">Inhaber / Verwendung</th><th></th></tr></thead><tbody>'
    +sort.map(k=>`<tr style="${k.aktiv?'':'opacity:.55'}"><td><b>${esc(k.art)}</b>${k.objekt_kz?' · '+esc(k.objekt_kz):''}<div class="sub">${esc(k.bezeichnung||'')}${k.aktiv?'':' · nicht mehr genutzt'}</div></td><td>${esc(k.bank||'')}${k.bic?'<div class="sub">'+esc(k.bic)+'</div>':''}</td>
      <td style="white-space:nowrap;font-variant-numeric:tabular-nums">${esc(ibanF(k.iban))} <button class="small ghost" data-a="kopie" data-v="${esc(k.iban||'')}">Kopieren</button></td><td class="hide-m">${esc(k.inhaber||'')}<div class="sub">${esc(k.verwendung||'')}</div></td>
      <td style="white-space:nowrap;text-align:right"><button class="small ghost" data-a="kedit" data-id="${k.id}">Bearbeiten</button></td></tr>`).join('')+'</tbody></table></div>';}
const odPfad=g=>{const p=String(g.onedrive_ordner||'').replace(/^\/+/,'');return p?(p.startsWith(ROOT)?p:ROOT+'/'+p):'';};
function dokumente(g){if(!odPfad(g))return '<div class="sub">Kein OneDrive-Ordner hinterlegt. Unter „Bearbeiten“ eintragen, z. B. 20.000 Verwaltung/Wohntraum.</div>';
  const A=OD[g.id];if(!A||A==='lade')return '<div class="sub">Lädt Dokumente aus OneDrive …</div>';if(A.fehler)return '<div class="note">'+esc(A.fehler)+'</div>';
  const O=Object.keys(A.ordner||{}).sort((a,b)=>a.localeCompare(b,'de'));let h='';
  if((A.dateien||[]).length)h+='<div class="ord"><div class="oh"><b>(direkt im Ordner)</b></div>'+A.dateien.map(d=>`<div class="dt"><a data-od="${esc(d.id)}">${esc(d.name)}</a></div>`).join('')+'</div>';
  for(const o of O){const L=A.ordner[o]||[];h+=`<div class="ord"><div class="oh"><b>${esc(o)}</b><span class="sub">${L.length} Datei${L.length===1?'':'en'}</span><label class="up" style="margin-left:auto">Hochladen<input type="file" multiple hidden data-odup="${esc(o)}"></label></div>`+L.map(d=>`<div class="dt"><a data-od="${esc(d.id)}">${esc(d.name)}</a></div>`).join('')+'</div>';}
  return h||'<div class="sub">Der Ordner ist leer.</div>';}
async function dokLaden(id,neu){const g=gVon(id);if(!odPfad(g)||(OD[id]&&!neu))return;OD[id]='lade';render();try{OD[id]=await odApi({aktion:'akte',pfad:odPfad(g)});}catch(e){OD[id]={fehler:e.message||String(e)};}render();}
async function odOeffnen(id){const w=window.open('','_blank');try{const r=await odApi({aktion:'link',id});const u=r.web||r.download;if(w)w.location.href=u;else window.open(u,'_blank');}catch(e){if(w)w.close();toast(e.message||String(e));}}
async function odHoch(g,ordner,L){const pfad=odPfad(g)+'/'+ordner;let n=0;
  for(const d of L){try{if(d.size>3*1024*1024){const s=await odApi({aktion:'sitzung',pfad,name:d.name});const r=await fetch(s.uploadUrl,{method:'PUT',headers:{'Content-Range':'bytes 0-'+(d.size-1)+'/'+d.size},body:d});if(!r.ok)throw new Error('Fehler '+r.status);}
      else{const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(d);});await odApi({aktion:'hochladen',pfad,name:d.name.replace(/[\\/:*?"<>|#%]/g,'_'),daten:b64,typ:d.type||'application/octet-stream'});}n++;}
    catch(e){toast(d.name+': '+(e.message||e),6000);}}
  if(n)toast(n+' Datei'+(n===1?'':'en')+' hochgeladen.');dokLaden(g.id,true);}
const A={
  zurueck:()=>{AKT=null;EDIT=false;KE=null;render();},bearb:()=>{EDIT=true;render();},abbrechen:()=>{EDIT=false;render();},
  teilen:()=>{const g=gVon(AKT);cliqTeilen('Gesellschaft '+g.name+' ('+g.kuerzel+')','/verwalto/gesellschaften?kz='+encodeURIComponent(g.kuerzel));},
  speichern:async()=>{const g=gVon(AKT),z={};document.querySelectorAll('[data-e]').forEach(el=>{const k=el.dataset.e;z[k]=el.type==='checkbox'?el.checked:(el.value.trim()||null);});
    if(!z.kuerzel||!z.name){toast('Kürzel und Name sind Pflicht.');return;}z.updated_at=new Date().toISOString();z.quelle=null;
    const alt=g.kuerzel;const {error}=await sb.from('ges_gesellschaften').update(z).eq('id',g.id);if(error){toast(error.message);return;}
    if(alt!==z.kuerzel)await sb.from('ges_konten').update({gesellschaft:z.kuerzel}).eq('gesellschaft',alt);
    Object.assign(g,z);KO.forEach(k=>{if(k.gesellschaft===alt)k.gesellschaft=z.kuerzel;});EDIT=false;render();toast('Gespeichert.');},
  neu:async()=>{const kz=prompt('Kürzel der neuen Gesellschaft (z. B. WW):');if(!kz)return;const name=prompt('Name der Gesellschaft:');if(!name)return;
    const {data,error}=await sb.from('ges_gesellschaften').insert({kuerzel:kz.trim(),name:name.trim(),status:'in Gründung'}).select().single();if(error){toast(error.message);return;}G.push(data);AKT=data.id;EDIT=true;render();},
  kneu:()=>{KE={};render();},kab:()=>{KE=null;render();},
  kedit:d=>{KE=Object.assign({},KO.find(k=>k.id===d.id));render();},
  ksave:async()=>{const g=gVon(AKT),v=i=>(document.getElementById(i).value||'').trim();
    const z={gesellschaft:g.kuerzel,art:v('k-art')||'Geschäftskonto',bezeichnung:v('k-bez')||null,bank:v('k-bank')||null,iban:v('k-iban').replace(/\s+/g,'').toUpperCase()||null,bic:v('k-bic')||null,inhaber:v('k-inh')||null,objekt_kz:v('k-obj')||null,verwendung:v('k-verw')||null,aktiv:document.getElementById('k-aktiv').checked,updated_at:new Date().toISOString()};
    if(z.iban&&!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(z.iban)){toast('Die IBAN sieht nicht gültig aus.');return;}
    if(KE.id){const {error}=await sb.from('ges_konten').update(z).eq('id',KE.id);if(error){toast(error.message);return;}Object.assign(KO.find(k=>k.id===KE.id),z);}
    else{const {data,error}=await sb.from('ges_konten').insert(z).select().single();if(error){toast(error.message);return;}KO.push(data);}
    KE=null;render();toast('Gespeichert.');},
  kopie:d=>{try{navigator.clipboard.writeText(d.v);toast('IBAN kopiert.');}catch(e){}},
};
document.addEventListener('click',e=>{const od=e.target.closest('[data-od]');if(od){e.preventDefault();odOeffnen(od.dataset.od);return;}
  const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b.dataset);return;}
  const os=e.target.closest('[data-os]');if(os){oeffneOS(os.dataset.os);return;}
  const g=e.target.closest('[data-g]');if(g){AKT=g.dataset.g;EDIT=false;render();window.scrollTo(0,0);}});
document.addEventListener('input',e=>{if(e.target.id==='suche'){FILTER=e.target.value;render();const s=document.getElementById('suche');s.focus();s.setSelectionRange(s.value.length,s.value.length);}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.odup){const L=[...t.files];t.value='';if(L.length)odHoch(gVon(AKT),t.dataset.odup,L);}});
laden();
