<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selbstauskünfte</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f3f5f8;--card:#ffffff;--ink:#18202c;--muted:#5f6b7a;--line:#e0e5eb;--soft:#eef1f5;--accent:#2f5d8a;--accent-ink:#ffffff;--accent-soft:#e3ecf5;--pos:#1d7a4c;--pos-bg:#e5f4ec;--warn:#946200;--warn-bg:#fff4d6;--neg:#b42318;--neg-bg:#fcebe9;--chip:#edf1f6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--ink)}
.wrap{padding:16px 20px 40px;max-width:1300px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12px}
.kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:34px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{font-size:12.5px;padding:3px 9px;min-height:28px}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.warn{color:var(--neg)}
button:disabled{opacity:.55;cursor:default}
.inp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
/* Board: Schritte untereinander */
.spalte{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.spalte.ziel{outline:2px dashed var(--accent);outline-offset:-3px}
.sk{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;margin-bottom:8px}
.sk .nr{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.anz{font-size:11px;font-weight:700;color:var(--muted);background:var(--card);border-radius:999px;padding:1px 8px}
.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.karte{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer}
.karte:hover{border-color:var(--accent)}
.karte .n{font-weight:700}.karte .z{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600;background:var(--chip);color:var(--muted);margin:4px 4px 0 0}
.p-ok{background:var(--pos-bg);color:var(--pos)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-blau{background:var(--accent-soft);color:var(--accent)}
.leer{color:var(--muted);padding:8px 4px;font-size:12.5px}
/* Zeilen und Arbeitsbereich in der Kachel */
.zeilen{display:grid;gap:6px}
.zeile{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.zeile:hover{border-color:var(--accent)}
.zeile.on{border-color:var(--accent);border-bottom-left-radius:0;border-bottom-right-radius:0;background:var(--accent-soft)}
.zeile .n{font-weight:700}.zeile .z{font-size:12px;color:var(--muted)}.zeile .pill{margin:0}
.zeile .rechts{margin-left:auto;font-size:12px;color:var(--accent);font-weight:600}
.ws{border:1px solid var(--accent);border-top:0;border-radius:0 0 12px 12px;background:var(--bg);padding:12px;margin-top:-6px}
.ws .card{margin-bottom:10px}
.weiter{display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 12px}
details.mehr{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
details.mehr>summary{cursor:pointer;padding:10px 16px;font-weight:700;list-style:none}
details.mehr>summary::-webkit-details-marker{display:none}
details.mehr>summary::after{content:'aufklappen';float:right;font-size:12px;font-weight:600;color:var(--muted)}
details.mehr[open]>summary::after{content:'zuklappen'}
details.mehr>.innen{padding:0 12px 4px}
details.mehr>.innen>.card{border:0;padding:4px 4px 10px;margin:0}
.vtwahl{display:flex;flex-wrap:wrap;gap:6px 18px}.vtwahl label{display:flex;gap:6px;align-items:center;font-size:13.5px}
/* Detail */
.ov{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;justify-content:flex-end;z-index:40}
.panel{background:var(--bg);width:min(900px,100%);height:100%;overflow:auto;padding:16px 20px 40px;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.ch{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);column-gap:14px}.g4{display:grid;grid-template-columns:repeat(4,1fr);column-gap:14px}
.fl{display:grid;gap:3px;font-size:12px;color:var(--muted);margin-bottom:8px}
.fl input,.fl select,.fl textarea,.feld{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:14px;color:var(--ink)}
textarea{resize:vertical;min-height:70px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.seg button{border:0;border-radius:0;padding:6px 10px;font-size:12.5px}.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.summe{font-size:20px;font-weight:800}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
.ok{background:var(--pos-bg);color:var(--pos);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
.rot{background:var(--neg-bg);color:var(--neg);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
.verlauf div{font-size:12.5px;border-top:1px solid var(--line);padding:5px 0}
.ktab{width:100%;border-collapse:collapse;font-size:13px}
.ktab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
.ktab td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.ktab td.r,.ktab th.r{text-align:right;white-space:nowrap}
.ktab input{width:100%;max-width:120px;text-align:right;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:13.5px}
.ktab tr.grp td{background:var(--soft);font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.ktab tr.sum td{font-weight:800;border-top:2px solid var(--ink)}
.kz{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.kz div{background:var(--soft);border-radius:8px;padding:8px 10px}.kz b{display:block;font-size:16px}.kz span{font-size:11.5px;color:var(--muted)}
.msa .z{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:13px}.msa .z span:first-child{color:var(--muted)}
.msa h4{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;margin:10px 0 2px}
.qr{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.qr #qrbox{background:#fff;padding:8px;border:1px solid var(--line);border-radius:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}.toast.on{opacity:1}
@media(max-width:760px){.g2,.g3,.g4,.kz{grid-template-columns:1fr 1fr}}

.qrb{background:#fff;padding:8px;border:1px solid var(--line);border-radius:8px}
.zeile .z{flex:1;min-width:180px}
a{color:var(--accent)}
</style></head><body>
<div class="wrap" id="app"><div class="leer">Lädt …</div></div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const p2=n=>String(n).padStart(2,'0');
const dmy=x=>{const s=String(x||'').slice(0,10);return /^\d{4}-\d\d-\d\d$/.test(s)?s.split('-').reverse().join('.'):String(x||'');};
const zeit=d=>{if(!d)return '';const x=new Date(d);return p2(x.getDate())+'.'+p2(x.getMonth()+1)+'.'+x.getFullYear()+', '+p2(x.getHours())+':'+p2(x.getMinutes())+' Uhr';};
const tag=d=>{if(!d)return '';const x=new Date(d);return x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate());};
const NUTZER={'ramona@andersmacher.info':'Ramona Romanelli','juergen@andersmacher.info':'Jürgen Reuter','eric@andersmacher.info':'Eric Eisenhardt'};
const ERIC='eric@andersmacher.info';
const MSA_F=[['1. Objekt, Einzugstermin und Zweck',[['objekt','Objekt'],['besichtigung','Besichtigung'],['einzug','Einzugstermin'],['zweck','Zweck']]],
 ['2. Kontaktdaten',[['anrede','Anrede'],['vorname','Vorname'],['nachname','Nachname'],['familienstand','Familienstand'],['geburtsdatum','Geburtsdatum'],['email','E-Mail'],['telefon','Telefon'],['adresse','Aktuelle Adresse']]],
 ['3. Arbeitsverhältnis',[['arbeit','Arbeitsverhältnis'],['arbeitgeber','Arbeitgeber / seit'],['einkommen','Nettoeinkommen Haushalt (€)'],['info','Wichtige Informationen']]],
 ['4. Weitere Daten',[['personen','Personen'],['mitbewohner','Weitere Personen'],['gewerblich','Gewerbliche Nutzung'],['haustiere','Haustiere'],['haustiere_welche','Welche Haustiere'],['erfahren','Wie von der Wohnung erfahren'],['ansprechpartner','Ansprechpartner'],['teilweise','Mietkosten derzeit teilweise übernommen'],['vollstaendig','Mietkosten derzeit vollständig übernommen'],['amt','Miete zahlt Jobcenter / Sozialamt'],['behoerde','Zuständige Behörde']]],
 ['5. Bonität',[['eidesstattlich','Eidesstattliche Versicherung oder Haftbefehl in den letzten 3 Jahren']]],
 ['6. Einverständnis',[['datenschutz','Einverständnis Datenschutz'],['wahrheit','Angaben wahrheitsgemäß']]]];
const SIGNATUR='Mit freundlichen Grüßen\n\nWohn(T)raum Rheinhessen GmbH\nbewusst sozial engagiert\nE-Mail: hausverwaltung@andersmacher.info\nTelefon: 06133-9382937\nDalheimer Str. 70, 55278 Dexheim\nHRB 45997, Amtsgericht Mainz\nGeschäftsführer: Eric Eisenhardt';
const SICHT=[['eingegangen','Eingegangen'],['verschickt','Verschickt'],['uebernommen','Übernommen'],['abgelehnt','Abgelehnt'],['allgemein','Allgemeine Links']];
const FELDER='id,token,art,bezeichnung,aktiv,quelle_token,karte_id,status,vorbelegt,daten,unterschrift,eingegangen_at,created_at,erstellt_von,asana_gid,asana_link,entscheidung,entschieden_von,entschieden_at,interessent_id';

let R=[],O=[],E=[],ICH='',ICHMAIL='',SICHTW='eingegangen',SEL=null,FORM=null,AFORM=null,BUSY='',SUCHE='',NEU=null,ERF=null;
const PARAM=new URLSearchParams(location.search).get('t');
const $=id=>document.getElementById(id);
function toast(t,ms){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),ms||3500);}
async function token(){const {data}=await sb.auth.getSession();return data&&data.session?data.session.access_token:'';}
async function api(pfad,body){let r;try{r=await fetch(pfad,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await token()},body:JSON.stringify(body)});}catch(e){throw new Error('Dienst nicht erreichbar.');}
  const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||('Fehler '+r.status));return j;}
const istEric=()=>ICHMAIL===ERIC;
const darfFreigeben=()=>ICHMAIL===ERIC||ICHMAIL==='ramona@andersmacher.info';
const link=t=>location.origin+'/mieterselbstauskunft.html?t='+encodeURIComponent(t);
const neuToken=()=>((crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36))+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2))).replace(/-/g,'');
const objVon=id=>O.find(o=>o.id===id);
const wLabel=e=>{const o=objVon(e.objekt_id);return o?o.kz+' '+e.bezeichnung+' · '+(o.strasse||o.name||''):e.bezeichnung;};
const wohnungen=()=>E.filter(e=>e.aktiv!==false&&objVon(e.objekt_id)).map(e=>({e,label:wLabel(e)})).sort((a,b)=>a.label.localeCompare(b.label,'de',{numeric:true}));
function wohnungVon(text){const w=wohnungen().find(x=>x.label===String(text||'').trim());if(!w)return null;const o=objVon(w.e.objekt_id);
  return {objekt_id:o.id,einheit_id:w.e.id,label:w.label,adresse:[o.strasse,[o.plz,o.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ')+' – '+w.e.bezeichnung};}
const nameVon=s=>{const d=s.daten||{},v=s.vorbelegt||{};return [d.vorname||v.vorname,d.nachname||v.nachname].filter(Boolean).join(' ')||'(ohne Namen)';};
const quelleVon=s=>{if(s.daten&&s.daten.manuell)return 'Manuell erfasst von '+(s.daten.manuell.von||'')+(s.created_at&&s.status==='eingegangen'&&Date.parse(s.eingegangen_at)-Date.parse(s.created_at)>60000?' (Link war verschickt)':'');if(s.quelle_token){const q=R.find(x=>x.token===s.quelle_token);return 'Allgemeiner Link'+(q&&q.bezeichnung?' „'+q.bezeichnung+'“':'');}return 'Persönlicher Link'+(s.erstellt_von?' von '+s.erstellt_von:'');};
const wohnTxt=s=>{const v=s.vorbelegt||{};return (v.wohnung&&v.wohnung.label)||(s.daten&&s.daten.objekt)||v.objekt||'';};

/* ---------- Daten ---------- */
async function laden(){
  const [m,o,e,u]=await Promise.all([sb.from('mieterselbstauskunft').select(FELDER).is('karte_id',null).order('created_at',{ascending:false}),
    sb.from('obj_objekte').select('id,kz,name,strasse,plz,ort,status').order('sort'),sb.from('obj_einheiten').select('id,objekt_id,bezeichnung,aktiv,sort').order('sort'),sb.auth.getUser()]);
  if(m.error){$('app').innerHTML='<div class="leer">Bitte im Wohntraum OS anmelden.</div>';return;}
  R=m.data||[];O=(o.data||[]).filter(x=>x.status!=='Verkauft');E=e.data||[];
  const us=u&&u.data&&u.data.user;if(us){ICHMAIL=String(us.email||'').toLowerCase();ICH=NUTZER[ICHMAIL]||us.email||'';}
  if(PARAM&&!laden.p){laden.p=1;const s=R.find(x=>x.token===PARAM);if(s){SEL=s.id;SICHTW=gruppe(s)||SICHTW;}}
  render();}
function gruppe(s){if(s.art==='allgemein')return 'allgemein';if(s.entscheidung==='uebernommen')return 'uebernommen';if(s.entscheidung==='abgelehnt')return 'abgelehnt';return s.status==='eingegangen'?'eingegangen':'verschickt';}

/* ---------- Darstellung ---------- */
function render(){const L=R.filter(s=>gruppe(s)===SICHTW),q=SUCHE.trim().toLowerCase();
  const anz=k=>R.filter(s=>gruppe(s)===k).length;
  let h=`<div class="kopf"><div><h1>Selbstauskünfte</h1><div class="sub">Zuerst geht der Link zur Mieterselbstauskunft raus. Ist die Auskunft eingegangen, entscheiden Eric oder Ramona: übernehmen in das Board Mietinteressenten oder ablehnen. Kam eine Selbstauskunft auf Papier oder per Mail, mit „Selbstauskunft hochladen / erfassen“ ablegen. Erst wenn Eric den Interessenten an das Team übergibt, erscheint er mit allen Daten in der Neuvermietung.</div></div>
    <div class="acts"><input class="inp" type="search" id="suche" placeholder="Name oder Wohnung suchen …" value="${esc(SUCHE)}" style="width:220px"><button class="primary" data-a="form">Link verschicken</button><button data-a="erf">Selbstauskunft hochladen / erfassen</button></div></div>`;
  if(ERF)h+=erfassen();
  if(FORM)h+=formular();
  if(NEU)h+=neuKarte();
  h+=`<div class="acts" style="margin-bottom:10px"><div class="seg">${SICHT.map(([k,t])=>`<button data-sicht="${k}" class="${SICHTW===k?'on':''}">${esc(t)} (${anz(k)})</button>`).join('')}</div></div>`;
  if(SICHTW==='allgemein')h+=allgemein(L);
  else{const F=L.filter(s=>!q||(nameVon(s)+' '+wohnTxt(s)+' '+((s.daten&&s.daten.email)||(s.vorbelegt&&s.vorbelegt.email)||'')).toLowerCase().includes(q));
    h+=F.length?'<div class="zeilen">'+F.map(zeile).join('')+'</div>':'<div class="leer">'+(q?'Nichts gefunden.':SICHTW==='eingegangen'?'Keine neuen Selbstauskünfte.':SICHTW==='verschickt'?'Keine offenen Links.':'Keine Einträge.')+'</div>';}
  $('app').innerHTML=h;
  if(NEU){const b=$('qrneu');if(b&&window.QRCode)new QRCode(b,{text:link(NEU.token),width:140,height:140,correctLevel:QRCode.CorrectLevel.M});}
  document.querySelectorAll('[data-qr]').forEach(b=>{if(window.QRCode&&!b.firstChild)new QRCode(b,{text:link(b.dataset.qr),width:120,height:120,correctLevel:QRCode.CorrectLevel.M});});}
function zeile(s){const d=s.daten||{},auf=SEL===s.id,g=gruppe(s);let st='';
  if(g==='eingegangen')st=`<span class="pill p-blau">eingegangen am ${esc(zeit(s.eingegangen_at))}</span>`+(d.amt==='JA'?'<span class="pill">Jobcenter / Sozialamt</span>':'')+(d.eidesstattlich==='JA'?'<span class="pill p-warn">Eidesstattliche Versicherung: JA</span>':'');
  else if(g==='verschickt')st=`<span class="pill">verschickt am ${esc(zeit(s.created_at))}, wartet</span>`;
  else st=`<span class="pill ${g==='uebernommen'?'p-ok':'p-warn'}">${g==='uebernommen'?'übernommen':'abgelehnt'} von ${esc(s.entschieden_von||'')} am ${esc(zeit(s.entschieden_at))}</span>`;
  return `<div class="zeile${auf?' on':''}" data-s="${esc(s.id)}"><span class="n">${esc(nameVon(s))}</span><span class="z">${esc(wohnTxt(s)||'ohne Wohnung')} · ${esc(quelleVon(s))}</span>${st}<span class="rechts">${auf?'Zuklappen':'Öffnen'}</span></div>${auf?'<div class="ws">'+detail(s)+'</div>':''}`;}
function detail(s){const d=s.daten||{},g=gruppe(s);let h='';
  if(g==='verschickt'){h+=`<div class="card"><div class="ch">Link zur Selbstauskunft<span class="pill">wartet auf den Interessenten</span></div><div class="qr"><div class="qrb" data-qr="${esc(s.token)}"></div><div style="flex:1;min-width:240px">
      <input class="feld" id="l-${esc(s.id)}" value="${esc(link(s.token))}" readonly style="margin:0 0 8px">
      <div class="acts"><button data-a="kopie" data-id="${esc(s.id)}">Link kopieren</button>${(s.vorbelegt||{}).email?`<button data-a="mail" data-id="${esc(s.id)}"${BUSY?' disabled':''}>${BUSY==='mail'+s.id?'Wird gesendet …':'Erneut per Mail an '+esc(s.vorbelegt.email)+' senden'}</button>`:''}<button data-a="qr" data-id="${esc(s.id)}">QR-Code herunterladen</button><button data-a="erf" data-id="${esc(s.id)}">Auf Papier / per Mail erhalten – erfassen</button><button class="warn" data-a="zurueck" data-id="${esc(s.id)}">Link zurückziehen</button></div>
      <div class="sub" style="margin-top:6px">Erstellt am ${esc(zeit(s.created_at))}${s.erstellt_von?' von '+esc(s.erstellt_von):''}${(s.vorbelegt||{}).gesendet?' · per Mail gesendet am '+esc(zeit(s.vorbelegt.gesendet)):''}</div></div></div></div>`;return h;}
  h+='<div class="card"><div class="ch">Mieterselbstauskunft<span class="pill p-ok">eingegangen am '+esc(zeit(s.eingegangen_at))+'</span></div>';

async function erfSpeichern(){erfLesen();const d=Object.assign({},ERF.d),files=[...(($('e-datei')||{}).files||[])];
  if(!d.vorname&&!d.nachname){toast('Bitte mindestens den Namen eintragen.');return;}

  for(const f of files){if(f.size>25*1024*1024){toast(f.name+' ist größer als 25 MB.',6000);continue;}
    const sauber=String(f.name).normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\- ]+/g,'_').replace(/\s+/g,'_').slice(-120);
    const pfad='selbstauskunft/'+tok.slice(0,24)+'/'+Date.now()+'_'+sauber;
    const {error}=await sb.storage.from('vertraege').upload(pfad,f,{contentType:f.type||'application/octet-stream'});

  const jetzt=new Date().toISOString();let res;
  if(alt)res=await sb.from('mieterselbstauskunft').update({status:'eingegangen',daten:d,vorbelegt:vor,eingegangen_at:alt.eingegangen_at||jetzt}).eq('id',alt.id).select(FELDER).single();
  else res=await sb.from('mieterselbstauskunft').insert({token:tok,art:'person',status:'eingegangen',daten:d,vorbelegt:vor,eingegangen_at:jetzt,erstellt_von:ICH}).select(FELDER).single();

  if(alt)Object.assign(alt,res.data);else R.unshift(res.data);ERF=null;SICHTW='eingegangen';SEL=res.data.id;render();toast('Selbstauskunft gespeichert.');}

function pdf(s){const d=s.daten||{},{jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});const L=18,B=174;let y=20;
  const neu=()=>{doc.addPage();y=20;};doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('Mieterselbstauskunft',L,y);y+=10;
  for(const [t,F] of MSA_F){if(y>260)neu();doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(t,L,y);y+=6;doc.setFontSize(10);
    for(const [f,l] of F){const v=d[f];if(v==null||v==='')continue;const val=doc.splitTextToSize(String(/^\d{4}-\d\d-\d\d$/.test(v)?dmy(v):v),B/2);if(y+val.length*4.6>280)neu();
      doc.setFont('helvetica','normal');doc.setTextColor(95,107,122);doc.text(doc.splitTextToSize(l,B/2-4),L,y);doc.setTextColor(0);doc.text(val,L+B/2,y);y+=Math.max(5,val.length*4.6)+1.5;}y+=3;}
  if(s.unterschrift){if(y>240)neu();doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Unterschrift',L,y);y+=3;try{doc.addImage(s.unterschrift,'PNG',L,y,70,22);}catch(e){}y+=26;}
  doc.setFontSize(8.5);doc.setTextColor(120);doc.text('Übermittelt über das Wohntraum OS am '+zeit(s.eingegangen_at),L,288);
  const w=(s.vorbelegt||{}).wohnung;doc.save((w?w.label.split(' · ')[0].replace(/\s+/g,'_'):'Selbstauskunft')+'_'+String(d.nachname||'').toUpperCase()+' '+(d.vorname||'')+'_'+tag(s.eingegangen_at)+'_Mieterselbstauskunft.pdf');}

document.addEventListener('click',async e=>{const t=e.target;
  const sv=t.closest('[data-sicht]');if(sv){SICHTW=sv.dataset.sicht;SEL=null;render();return;}
  const z=t.closest('.zeile[data-s]');if(z&&!t.closest('a,button,input')){SEL=SEL===z.dataset.s?null:z.dataset.s;render();return;}
  const dl=t.closest('[data-datei]');if(dl){e.preventDefault();dateiOeffnen(dl.dataset.datei);return;}
  const b=t.closest('[data-a]');if(!b)return;const a=b.dataset.a,s=R.find(x=>x.id===b.dataset.id);
  if(a==='erf'){erfStart(s||null);render();window.scrollTo(0,0);return;}
  if(a==='erfzu'){ERF=null;render();return;}
  if(a==='erfsave'){erfSpeichern();return;}
  if(a==='form'){ERF=null;FORM=FORM||{vorname:'',nachname:'',email:'',telefon:'',wohnung:'',einzug:''};NEU=null;render();setTimeout(()=>{const f=$('f-vorname');if(f)f.focus();},30);return;}
  if(a==='formzu'){FORM=null;render();return;}
  if(a==='neuzu'){NEU=null;render();return;}
  if(a==='senden'){linkAnlegen(true);return;}
  if(a==='nurlink'){linkAnlegen(false);return;}
  if(a==='kopie'){const i=$('l-'+b.dataset.id);try{await navigator.clipboard.writeText(i.value);}catch(x){i.select();document.execCommand('copy');}toast('Link kopiert.');return;}
  if(a==='qr'){qrLaden(b.dataset.id);return;}
  if(a==='mail'&&s){BUSY='mail'+s.id;render();await mailSenden(s);BUSY='';render();return;}
  if(a==='zurueck'&&s){zurueckziehen(s);return;}
  if(a==='pdf'&&s){pdf(s);return;}
  if(a==='uebernehmen'&&s){uebernehmen(s);return;}
  if(a==='ablehnen'&&s){ablehnen(s);return;}
  if(a==='wieder'&&s){wieder(s);return;}
  if(a==='mi'){const p='/vermietung/mietinteressenten'+(b.dataset.id?'?open='+encodeURIComponent(b.dataset.id):'');try{if(window.top!==window){window.top.postMessage({osOeffne:p},'*');return;}}catch(x){}location.href=p;return;}
  if(a==='aneu'){allgemeinNeu();return;}
  if(a==='aktiv'&&s){aktivUm(s);return;}});
document.addEventListener('input',e=>{if(e.target.id==='suche'){SUCHE=e.target.value;const p=e.target.selectionStart;render();const n=$('suche');n.focus();try{n.setSelectionRange(p,p);}catch(x){}}
  else if(FORM&&String(e.target.id).startsWith('f-'))formLesen();
  else if(ERF&&e.target.dataset&&e.target.dataset.erf!==undefined)ERF.d[e.target.dataset.erf]=e.target.value;
  else if(ERF&&e.target.id==='e-wohnung')ERF.wohnung=e.target.value;
  else if(e.target.id==='a-bez'||e.target.id==='a-wohnung')AFORM={bez:$('a-bez').value,wohnung:$('a-wohnung').value};});
/* Wohnungsfeld: beim Anklicken leeren, damit die ganze Liste erscheint */
document.addEventListener('focusin',e=>{const t=e.target;if(t.id==='f-wohnung'||t.id==='a-wohnung'||t.id==='e-wohnung'){t.dataset.alt=t.value;t.value='';}});
document.addEventListener('focusout',e=>{const t=e.target;if((t.id==='f-wohnung'||t.id==='a-wohnung'||t.id==='e-wohnung')&&!t.value&&t.dataset.alt){t.value=t.dataset.alt;}if(t.id==='e-wohnung'&&ERF)ERF.wohnung=t.value;if(t.id==='f-wohnung')formLesen();});
laden();
setInterval(()=>{if(!BUSY&&!FORM&&!ERF&&document.visibilityState==='visible'&&!document.activeElement.matches('input,textarea'))laden();},60000);
