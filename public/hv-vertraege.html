<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verträge – Wohntraum OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.OS_APP='oc';</script>
<script src="/os-docstore.js?v=20261012b"></script>
<style>
:root{
  --bg:#f3f5f8;--card:#ffffff;--ink:#18202c;--muted:#5f6b7a;--line:#e0e5eb;--soft:#eef1f5;
  --accent:#2f5d8a;--accent-ink:#ffffff;--accent-soft:#e3ecf5;
  --pos:#1d7a4c;--pos-bg:#e5f4ec;--neg:#b42318;--neg-bg:#fcebe9;--warn:#946200;--warn-bg:#fff4d6;--chip:#edf1f6;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b;--card:#1a1f28;--ink:#e5e9ef;--muted:#97a1af;--line:#2b323e;--soft:#222935;
    --accent:#72a6d8;--accent-ink:#0d1117;--accent-soft:#1f2c3b;
    --pos:#5cc98e;--pos-bg:#15301f;--neg:#f07b70;--neg-bg:#3a1c19;--warn:#e7b949;--warn-bg:#342e18;--chip:#252c38;color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui)}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:3px 6px}
button.small{font-size:12px;padding:3px 8px}
button.neg{color:var(--neg)}
select,input[type=text],input[type=search],input[type=date],input[type=number],textarea{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;resize:vertical}
.wrap{max-width:1500px;margin:0 auto;padding:18px 20px 40px}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:12px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.tbar input[type=search]{flex:1;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:5px 10px;font-size:13px;background:var(--card)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button span{opacity:.7;font-size:11px;margin-left:3px}
.note{background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:var(--soft);position:sticky;top:0}
tr.grp td{background:var(--soft);font-weight:700;font-size:13px;cursor:pointer}
tr.grp td .sub{font-weight:400}
tr.row{cursor:pointer}tr.row:hover td{background:var(--accent-soft)}
tr.row.sel td{background:var(--accent-soft)}
td.n{text-align:right;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--pos-bg);color:var(--pos)}.pill.mid{background:var(--warn-bg);color:var(--warn)}.pill.aus{background:var(--chip);color:var(--muted)}.pill.neg{background:var(--neg-bg);color:var(--neg)}
.drw-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:60}
.drw{position:fixed;top:4vh;bottom:4vh;left:50%;transform:translateX(-50%);border-radius:14px;width:min(820px,96vw);background:var(--bg);z-index:61;overflow:auto;box-shadow:-8px 0 24px rgba(0,0,0,.15);padding:16px}
.drw h2{font-size:17px;margin:0 0 2px}
.dz{display:block;border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;background:var(--card)}.dz:hover,.dz.over{border-color:var(--accent,#2f5d8a);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;margin-bottom:8px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.frm label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.frm label.w2{grid-column:1/-1}
.frm input,.frm select,.frm textarea{font-size:14px;color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.zl{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.zl:last-child{border-bottom:none}
.empty{padding:30px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90}
.toast.on{opacity:1}
.loading{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:900px){ .hide-s{display:none} .frm{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Lade Verträge …</div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
/* ---------- Verträge: Versorger, Versicherungen, Verwaltung & Sonstiges ----------
   gespeichert in oc / stamm/vertraege {liste:[...]}; Vorschläge aus den Kontoumsätzen haben quelle:'vorschlag', bis sie geprüft sind. */
const ARTEN=[['Versorger','Versorger'],['Versicherung','Versicherungen'],['Verwaltung','Verwaltung & Sonstiges']];
const SPARTEN={Versorger:['Strom','Gas','Wärme','Frischwasser','Abwasser','Müll','Internet/Telefon','Grundbesitzabgaben','Sonstiges'],
  Versicherung:['Gebäude','Haftpflicht','Gebäude + Haftpflicht','Rechtsschutz','Mietausfall','KFZ','Kranken','Versicherung','Sonstiges'],
  Verwaltung:['Software / Abo','Miete / Leasing','Darlehen','Bausparen','Steuerberatung','Dienstleistung','Hausgeld WEG','Mitgliedschaft','Rundfunkbeitrag','Kreditkarte','Tankkarte','Sonstiges']};
const RH=['monatlich','vierteljährlich','halbjährlich','jährlich','einmalig','nach Verbrauch'];
const GES=['EE','WT','KiBo'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}); const eur=v=>v==null||v===''?'':fmt.format(v);
const dmy=d=>d?String(d).slice(0,10).split('-').reverse().join('.'):'';
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim();
const ziff=s=>String(s||'').replace(/\D/g,'');
const heute=()=>new Date().toISOString().slice(0,10);
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2600); }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

let db=null, canWrite=true, L=[], objekte=[], konten=[], TX=null, loaded={v:0,o:0,k:0};
let F={art:'',st:'',ges:'',q:''}; try{ F=Object.assign(F,JSON.parse(store('vt_f')||'{}')); }catch(e){}
let ZU={}; try{ ZU=JSON.parse(store('vt_zu')||'{}')||{}; }catch(e){}
let SEL=null, DRAFT=null;
const saveF=()=>store('vt_f',JSON.stringify(F));

const status=v=>v.quelle==='vorschlag'?'pruefen':(v.ende&&v.ende<heute()?'beendet':'aktiv');
const STN={pruefen:['Zu prüfen','mid'],aktiv:['Aktiv','ok'],beendet:['Beendet','aus']};
const kontoName=k=>{ const x=konten.find(y=>(y.key||y.iban)===k); return x?x.name:''; };
const objName=kz=>{ const o=objekte.find(x=>x.kz===kz); return o?o.kz+' – '+String(o.name||'').split(',')[0]:(kz||''); };
const ortLabel=v=>v.obj?(v.obj+(v.einheit?' · '+einheitName(v.obj,v.einheit):'')):(v.ges?v.ges+' (Gesellschaft)':'');
function einheitName(obj,id){ const o=objekte.find(x=>x.kz===obj); const e=o&&(o.einheiten||[]).find(x=>x.id===id); return e?e.label+(e.mieter?' · '+e.mieter.split(',')[0]:''):id; }

function gefiltert(){ const q=norm(F.q);
  return L.filter(v=>(!F.art||v.art===F.art)&&(!F.st||status(v)===F.st)&&(!F.ges||v.ges===F.ges)
    &&(!q||norm([v.anbieter,v.sparte,v.vnr,v.knr,v.zaehler,v.malo,v.mref,v.obj,v.notiz,v.zweck].join(' ')).includes(q))); }
function render(){
  if(!loaded.v||!loaded.o||!loaded.k){ return; }
  const all=gefiltert(), cnt=s=>L.filter(v=>(!F.art||v.art===F.art)&&(!F.ges||v.ges===F.ges)&&(!s||status(v)===s)).length;
  let h='<div class="head"><div><h1>Verträge</h1><div class="sub">Versorger, Versicherungen, Verwaltung & Sonstiges – mit Vertrags- und Kundennummern, damit Zahlungen und Belege leichter zugeordnet werden.</div></div>'
    +(canWrite?'<button class="primary" data-neu="1">Neuer Vertrag</button>':'')+'</div>';
  const pr=L.filter(v=>v.quelle==='vorschlag').length;
  if(pr) h+='<div class="note"><b>'+pr+' Vorschläge zu prüfen.</b> Diese Verträge hat das OS aus den Kontoumsätzen erkannt (Empfänger, Verwendungszweck, Mandatsreferenz). Bitte öffnen, ergänzen (Start, Ende, Einheit) und mit „Geprüft“ speichern. Falsche Vorschläge einfach löschen.</div>';
  h+='<div class="tbar"><div class="seg">'+[['','Alle'],...ARTEN].map(([k,l])=>'<button data-art="'+k+'" class="'+(F.art===k?'on':'')+'">'+l+'</button>').join('')+'</div>'
    +'<div class="seg">'+[['','Alle',cnt('')],['pruefen','Zu prüfen',cnt('pruefen')],['aktiv','Aktiv',cnt('aktiv')],['beendet','Beendet',cnt('beendet')]].map(([k,l,n])=>'<button data-st="'+k+'" class="'+(F.st===k?'on':'')+'">'+l+'<span>'+n+'</span></button>').join('')+'</div>'
    +'<select id="f-ges"><option value="">alle Gesellschaften</option>'+GES.map(g=>'<option'+(F.ges===g?' selected':'')+'>'+g+'</option>').join('')+'</select>'
    +'<input type="search" id="f-q" placeholder="Suchen: Anbieter, Vertrags- oder Kundennummer, Objekt" value="'+esc(F.q)+'" autocomplete="off"></div>';
  if(!all.length){ $('app').innerHTML=h+'<div class="empty">Keine Verträge für diesen Filter.</div>'+drawer(); return; }
  /* gruppiert nach Objekt (Gesellschaft, wenn kein Objekt) */
  const grp=new Map(); for(const v of all){ const g=v.obj||('~'+(v.ges||'')); if(!grp.has(g)) grp.set(g,[]); grp.get(g).push(v); }
  const keys=[...grp.keys()].sort((a,b)=>{ const oa=a.startsWith('~'), ob=b.startsWith('~'); if(oa!==ob) return oa?1:-1; return a.localeCompare(b,'de',{numeric:true}); });
  h+='<table><thead><tr><th>Anbieter</th><th>Sparte</th><th class="hide-s">Einheit</th><th>Vertrags- / Kundennr.</th><th class="hide-s">Laufzeit</th><th class="hide-s">Kündigung</th><th class="n">Betrag</th><th class="hide-s">Bankkonto</th><th>Status</th></tr></thead><tbody>';
  for(const g of keys){ const list=grp.get(g).sort((a,b)=>(a.art+a.sparte+a.anbieter).localeCompare(b.art+b.sparte+b.anbieter,'de')); const zu=!!ZU[g];
    const titel=g.startsWith('~')?(g.slice(1)?'Gesellschaft '+g.slice(1)+' (ohne Objekt)':'Ohne Zuordnung'):objName(g);
    h+='<tr class="grp" data-zu="'+esc(g)+'"><td colspan="9">'+(zu?'›':'⌄')+' '+esc(titel)+' <span class="sub">'+list.length+' Vertr'+(list.length===1?'ag':'äge')+'</span></td></tr>';
    if(zu) continue;
    for(const v of list){ const st=STN[status(v)];
      h+='<tr class="row'+(SEL===v.id?' sel':'')+'" data-id="'+esc(v.id)+'"><td><b>'+esc(v.anbieter||'–')+'</b></td><td>'+esc(v.sparte||'')+'</td><td class="hide-s">'+esc(v.einheit?einheitName(v.obj,v.einheit):'')+'</td>'
        +'<td>'+esc(v.vnr||'')+(v.knr?(v.vnr?'<br>':'')+'<span class="sub">Kd. </span>'+esc(v.knr):'')+(!v.vnr&&!v.knr&&v.mref?'<span class="sub">Mandat </span>'+esc(v.mref):'')+'</td>'
        +'<td class="hide-s">'+(v.start||v.ende?esc(dmy(v.start)||'…')+' – '+esc(dmy(v.ende)||'offen'):'<span class="sub">–</span>')+'</td><td class="hide-s">'+esc(v.kuendigung||'')+'</td>'
        +'<td class="n">'+eur(v.betrag)+(v.rhythmus?'<div class="sub">'+esc(v.rhythmus)+'</div>':'')+'</td><td class="hide-s">'+esc(kontoName(v.konto))+'</td><td><span class="pill '+st[1]+'">'+st[0]+'</span></td></tr>'; } }
  h+='</tbody></table>';
  const f=document.activeElement, fid=f&&f.id, pos=f&&f.selectionStart;
  $('app').innerHTML=h+drawer();
  if(fid){ const el=$(fid); if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(e){} } }
}
/* ---------- Bearbeiten ---------- */
function drawer(){ if(!DRAFT) return ''; const v=DRAFT, ro=!canWrite, d=ro?' disabled':'';
  const sp=SPARTEN[v.art]||SPARTEN.Verwaltung, o=objekte.find(x=>x.kz===v.obj);
  let h='<div class="drw-bg" data-zu-drw="1"></div><section class="drw"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><h2>'+esc(v.anbieter||'Neuer Vertrag')+'</h2><div class="sub">'+esc([v.sparte,ortLabel(v)].filter(Boolean).join(' · '))+'</div></div><button class="ghost" data-zu-drw="1">Schließen</button></div>';
  if(v.quelle==='vorschlag') h+='<div class="note" style="margin-top:10px">'+(v.herkunft==='Dokumente'?'Vorschlag aus den Vertragsunterlagen in OneDrive':'Vorschlag aus '+(v.belege||0)+' Zahlung'+(v.belege===1?'':'en')+(v.zahlungVon?' ('+dmy(v.zahlungVon)+' bis '+dmy(v.zahlungBis)+')':''))+'. Bitte prüfen und ergänzen.'+((v.dokumente||[]).length&&v.herkunft!=='Dokumente'?'<div class="sub" style="margin-top:4px">Ergänzt aus '+v.dokumente.length+' Dokument'+(v.dokumente.length===1?'':'en')+' in OneDrive.</div>':'')+(v.weitere?'<div class="sub" style="margin-top:4px">Weitere Nummern in den Zahlungen: '+esc(v.weitere)+'</div>':'')+'</div>';
  if(!ro) h+=pdfKarte(v);
  h+='<div class="card"><div class="lab">Vertrag</div><div class="frm">'
    +'<label>Art<select data-f="art"'+d+'>'+ARTEN.map(([k,l])=>'<option value="'+k+'"'+(v.art===k?' selected':'')+'>'+l+'</option>').join('')+'</select></label>'
    +'<label>Sparte<select data-f="sparte"'+d+'>'+(sp.includes(v.sparte)?'':'<option selected>'+esc(v.sparte||'')+'</option>')+sp.map(s=>'<option'+(v.sparte===s?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select></label>'
    +'<label class="w2">Anbieter<input type="text" data-f="anbieter" value="'+esc(v.anbieter)+'"'+d+'></label>'
    +'<label>Vertragsnummer<input type="text" data-f="vnr" value="'+esc(v.vnr)+'"'+d+'></label>'
    +'<label>Kundennummer<input type="text" data-f="knr" value="'+esc(v.knr)+'"'+d+'></label>'
    +(v.art==='Versorger'?'<label>Zähler- / Messstellennr.<input type="text" data-f="zaehler" value="'+esc(v.zaehler)+'"'+d+'></label><label>Marktlokation (MaLo)<input type="text" data-f="malo" value="'+esc(v.malo)+'"'+d+'></label>':'')
    +'<label>Mandatsreferenz<input type="text" data-f="mref" value="'+esc(v.mref)+'"'+d+'></label>'
    +'</div></div>';
  h+='<div class="card"><div class="lab">Zuordnung</div><div class="frm">'
    +'<label>Gesellschaft<select data-f="ges"'+d+'><option value="">–</option>'+GES.map(g=>'<option'+(v.ges===g?' selected':'')+'>'+g+'</option>').join('')+'</select></label>'
    +'<label>Objekt<select data-f="obj"'+d+'><option value="">– kein Objekt (Gesellschaft) –</option>'+objekte.filter(x=>!v.ges||x.ges===v.ges||x.kz===v.obj).map(x=>'<option value="'+esc(x.kz)+'"'+(x.kz===v.obj?' selected':'')+'>'+esc(x.kz+' – '+String(x.name||'').split(',')[0])+'</option>').join('')+'</select></label>'
    +'<label class="w2">Einheit<select data-f="einheit"'+(o?d:' disabled')+'><option value="">'+(o?'ganzes Objekt / Allgemein':'erst Objekt wählen')+'</option>'+(o?(o.einheiten||[]).slice().sort((a,b)=>String(a.label).localeCompare(String(b.label),'de',{numeric:true})).map(e=>'<option value="'+esc(e.id)+'"'+(e.id===v.einheit?' selected':'')+'>'+esc(e.label+(e.mieter?' · '+e.mieter.split(',')[0]:''))+'</option>').join(''):'')+'</select></label>'
    +'</div></div>';
  h+='<div class="card"><div class="lab">Laufzeit und Zahlung</div><div class="frm">'
    +'<label>Start<input type="date" data-f="start" value="'+esc(v.start)+'"'+d+'></label>'
    +'<label>Ende<input type="date" data-f="ende" value="'+esc(v.ende)+'"'+d+'></label>'
    +'<label>Kündigungsfrist<input type="text" data-f="kuendigung" placeholder="z. B. 3 Monate zum Jahresende" value="'+esc(v.kuendigung)+'"'+d+'></label>'
    +'<label class="w2">Laufzeit / Verlängerung<input type="text" data-f="laufzeit" placeholder="z. B. 1 Jahr, verlängert sich jeweils um 1 Jahr" value="'+esc(v.laufzeit)+'"'+d+'></label>'
    +'<label>Rhythmus<select data-f="rhythmus"'+d+'><option value="">–</option>'+RH.map(r=>'<option'+(v.rhythmus===r?' selected':'')+'>'+r+'</option>').join('')+'</select></label>'
    +'<label>Betrag (Abschlag / Beitrag)<input type="text" inputmode="decimal" data-f="betrag" value="'+(v.betrag==null||v.betrag===''?'':String(v.betrag).replace('.',','))+'"'+d+'></label>'
    +'<label>Bankkonto<select data-f="konto"'+d+'><option value="">–</option>'+konten.filter(k=>!/__aus/.test(k.obj||'')||(k.key||k.iban)===v.konto).map(k=>'<option value="'+esc(k.key||k.iban)+'"'+((k.key||k.iban)===v.konto?' selected':'')+'>'+esc(k.name)+'</option>').join('')+'</select></label>'
    +'<label class="w2">IBAN des Anbieters<input type="text" data-f="iban" value="'+esc(v.iban)+'"'+d+'></label>'
    +'<label class="w2">Notiz<textarea data-f="notiz" rows="2"'+d+'>'+esc(v.notiz)+'</textarea></label>'
    +'</div>';
  if(!ro) h+='<div class="acts"><button class="primary" data-save="1">'+(v.quelle==='vorschlag'?'Geprüft – speichern':'Speichern')+'</button><button data-zu-drw="1">Abbrechen</button>'+(L.some(x=>x.id===v.id)?'<button class="ghost neg" data-del="1" style="margin-left:auto">'+(v.quelle==='vorschlag'?'Vorschlag löschen':'Vertrag löschen')+'</button>':'')+'</div>';
  h+='</div>';
  /* Unterlagen aus OneDrive */
  const DK=(v.dokumente||[]).slice().sort((a,b)=>String(b.d||'')<String(a.d||'')?-1:1);
  if(DK.length) h+='<div class="card"><div class="lab">Unterlagen ('+DK.length+')</div>'+DK.map(x=>'<div class="zl"><span>'+esc(String(x.n||'').replace(/\.pdf$/i,''))+'<div class="sub">'+esc([x.t,dmy(x.d)].filter(Boolean).join(' · '))+'</div></span><button class="ghost" data-dok="'+esc(x.id||('p:'+x.pfad))+'">Öffnen</button></div>').join('')+'</div>';
  /* Zahlungen zu diesem Vertrag */
  const Z=zahlungen(v);
  h+='<div class="card"><div class="lab">Zahlungen '+(TX?'('+Z.length+')':'')+'</div>'+(TX==null?'<div class="sub">Lade Kontoumsätze …</div>':Z.length?Z.slice(0,24).map(t=>'<div class="zl"><span>'+esc(dmy(t.d))+' · '+esc(kontoName(t.k))+'<div class="sub">'+esc(String(t.z||'').slice(0,90))+'</div></span><b style="white-space:nowrap">'+eur(t.b)+'</b></div>').join('')+(Z.length>24?'<div class="sub">… und '+(Z.length-24)+' weitere</div>':''):'<div class="sub">Keine Zahlung gefunden. Mit Vertrags- oder Kundennummer, Mandatsreferenz oder IBAN findet das OS die Zahlungen.</div>')+'</div>';
  return h+'</section>'; }
/* Zahlung gehört zum Vertrag, wenn eine Nummer im Verwendungszweck steht, sonst gleiche IBAN auf demselben Konto */
const vtTok=z=>String(z||'').toUpperCase().split(/[\s\/,;:]+/).map(x=>x.replace(/[^A-Z0-9]/g,'')).filter(x=>x.length>=5);
function vtPasst(v,t){ const z=String(t.z||'').toUpperCase(), T=vtTok(z);
  for(const n of [v.vnr,v.knr,v.zaehler]){ const s=String(n||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(s.length<5) continue; const d=ziff(s); if(T.some(x=>x===s||(d.length>=6&&ziff(x)===d&&x.replace(/\d/g,'').length<=3))) return true; }
  if(v.mref&&z.includes(String(v.mref).toUpperCase())) return true;
  if(v.iban&&t.i&&t.i===v.iban&&(!v.konto||t.k===v.konto)&&!v.vnr&&!v.knr) return true;
  return false; }
function zahlungen(v){ if(!TX) return []; return TX.filter(t=>t.b<0&&vtPasst(v,t)).sort((a,b)=>a.d<b.d?1:-1); }
async function ladeTX(){ if(TX) return; const sb=window.osSupabase, out=[]; let from=0;
  try{ for(;;){ const {data,error}=await sb.from('os_docs').select('data').eq('app','oc').like('pfad','buchungen/%').range(from,from+199); if(error) throw error;
      for(const r of data||[]) for(const t of ((r.data&&r.data.tx)||[])) out.push({k:r.data.konto,d:t.d,b:t.b,n:t.n,z:t.z,i:t.i});
      if(!data||data.length<200) break; from+=200; } TX=out; }
  catch(e){ TX=[]; toast('Kontoumsätze nicht lesbar: '+(e.message||e)); }
  render(); }
async function dokOeffnen(id){ const w=window.open('','_blank'); try{
    if(String(id).startsWith('sb:')){ const {data,error}=await window.osSupabase.storage.from('vertraege').createSignedUrl(String(id).slice(3),3600); if(error) throw error; if(w) w.location.href=data.signedUrl; else window.open(data.signedUrl,'_blank'); return; } const sb=window.osSupabase; let tok=''; try{ const {data}=await sb.auth.getSession(); tok=(data&&data.session&&data.session.access_token)||''; }catch(e){}
    if(String(id).startsWith('p:')){ let p=String(id).slice(2); if(!p.startsWith('Prozesslandkarte 3.0')) p='Prozesslandkarte 3.0/'+p; const i=p.lastIndexOf('/'); const r0=await fetch('/api/onedrive',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify({aktion:'ordner',pfad:p.slice(0,i)})}); const j0=await r0.json().catch(()=>null); const f=j0&&(j0.eintraege||[]).find(x=>x.name===p.slice(i+1)); if(!f) throw new Error('Datei nicht gefunden.'); id=f.id; }
    const r=await fetch('/api/onedrive',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify({aktion:'link',id})}); const j=await r.json().catch(()=>null);
    if(!j||j.error) throw new Error((j&&j.error)||'OneDrive nicht erreichbar.'); const u=j.web||j.download; if(w) w.location.href=u; else window.open(u,'_blank'); }
  catch(e){ if(w) w.close(); toast(e.message||String(e)); } }
/* Direkt öffnen aus der Objektseite: ?id=... oder ?neu=1&obj=KZ */
let __dl=false; function deepLink(){ if(__dl||!loaded.o) return; const q=new URLSearchParams(location.search); const vid=q.get('id'); __dl=true;
  if(vid){ const v=L.find(x=>x.id===vid); if(v){ SEL=v.id; DRAFT=JSON.parse(JSON.stringify(v)); render(); ladeTX(); } return; }
  if(q.get('neu')){ const kz=q.get('obj')||''; const o=objekte.find(x=>x.kz===kz); SEL=null; DRAFT={id:neuId(),art:'Versorger',sparte:'',anbieter:'',vnr:'',knr:'',zaehler:'',mref:'',ges:o?o.ges:'',obj:kz,einheit:'',start:'',ende:'',kuendigung:'',betrag:null,rhythmus:'monatlich',konto:'',iban:'',notiz:'',quelle:'manuell'}; render(); } }
/* ---------- Vertrag als PDF: Daten auslesen (KI) und PDF beim Speichern ablegen ---------- */
var PDFV=null;
function pdfKarte(v){ const P=PDFV&&PDFV.id===v.id?PDFV:null;
  let t=P&&P.lade?'Lese „'+esc(P.name)+'“ … das dauert einige Sekunden.':P&&P.name?'„'+esc(P.name)+'“ eingelesen – bitte die Angaben prüfen und Fehlendes ergänzen. Beim Speichern wird das PDF abgelegt.':'Vertrag als PDF hierher ziehen oder klicken – das OS liest die Vertragsdaten aus und füllt die Felder vor.';
  return '<div class="card"><div class="lab">Vertrag als PDF</div><label class="dz" id="vt-dz" for="vt-pdf">'+t+'</label><input type="file" id="vt-pdf" accept="application/pdf,.pdf" hidden>'
    +(P&&P.fehler?'<div class="sub" style="color:var(--neg,#b42318);margin-top:6px">'+esc(P.fehler)+'</div>':'')+(P&&P.gefuellt&&P.gefuellt.length?'<div class="sub" style="margin-top:6px">Übernommen: '+esc(P.gefuellt.join(', '))+'</div>':'')+'</div>'; }
async function osTok(){ try{ const {data}=await window.osSupabase.auth.getSession(); return (data&&data.session&&data.session.access_token)||''; }catch(e){ return ''; } }
const b64=f=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=rej; r.readAsDataURL(f); });
const FELDNAMEN={art:'Art',sparte:'Sparte',anbieter:'Anbieter',vnr:'Vertragsnummer',knr:'Kundennummer',zaehler:'Zählernummer',malo:'Marktlokation',mref:'Mandatsreferenz',ges:'Gesellschaft',obj:'Objekt',start:'Start',ende:'Ende',kuendigung:'Kündigungsfrist',laufzeit:'Laufzeit',rhythmus:'Rhythmus',betrag:'Betrag',iban:'IBAN',notiz:'Notiz'};
async function pdfLesen(file){ if(!DRAFT||!file) return; if(!/\.pdf$/i.test(file.name)&&file.type!=='application/pdf'){ toast('Bitte ein PDF wählen.'); return; }
  if(file.size>3.2e6){ toast('Das PDF ist zu groß (höchstens etwa 3 MB).'); return; }
  const id=DRAFT.id; PDFV={id,name:file.name,lade:true,datei:file}; render();
  try{ const daten=await b64(file); PDFV.b64=daten;
    const prompt='Lies den angehängten Vertrag (oder Vertragsbestätigung, Police, Abschlagsplan) und gib ausschließlich ein JSON-Objekt mit diesen Feldern zurück. Unbekannte Felder leer lassen ("" bzw. null), nichts erfinden.\n'
      +'"art": eines von '+JSON.stringify(ARTEN.map(x=>x[0]))+' (Versorger = Strom, Gas, Wasser, Müll, Internet usw.; Versicherung; Verwaltung = alles andere)\n'
      +'"sparte": passend zur Art, eines von '+JSON.stringify(SPARTEN)+'\n'
      +'"anbieter": Name des Anbieters/Versicherers (kurz, ohne Rechtsform-Zusätze wie GmbH nur wenn nötig)\n'
      +'"vnr": Vertrags- oder Versicherungsscheinnummer\n"knr": Kundennummer\n"zaehler": Zähler- oder Messstellennummer\n"malo": Marktlokations-ID\n"mref": SEPA-Mandatsreferenz\n'
      +'"obj": Kürzel des Objekts, wenn die Verbrauchs-/Versicherungsadresse zu einem dieser Objekte passt, sonst "": '+objekte.map(o=>o.kz+' = '+String(o.name||'').split(',').slice(0,2).join(',')).join('; ')+'\n'
      +'"ges": Gesellschaft des Vertragspartners/Kunden: "WT" = Wohn(T)raum Rheinhessen GmbH, "EE" = Eric Eisenhardt (privat), "KiBo" = Wohntraum KiBo GmbH, sonst ""\n'
      +'"start": Vertragsbeginn als JJJJ-MM-TT\n"ende": Vertragsende als JJJJ-MM-TT, falls befristet\n"kuendigung": Kündigungsfrist in Worten, z. B. "3 Monate zum Jahresende"\n"laufzeit": Laufzeit und Verlängerung in Worten\n'
      +'"rhythmus": eines von '+JSON.stringify(RH)+'\n"betrag": Abschlag oder Beitrag pro Zahlung als Zahl (z. B. 85.5)\n"iban": IBAN des Anbieters (Zahlungsempfänger), nicht die eigene\n"notiz": höchstens 2 kurze Sätze mit wichtigen Besonderheiten (z. B. Tarif, Preisgarantie, Leistungsumfang)';
    const r=await fetch('/api/ki',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await osTok()},body:JSON.stringify({aufgabe:'beleg_json',text:prompt,pdf:{daten}})});
    const j=await r.json().catch(()=>({})); if(!r.ok||j.error) throw new Error(j.error||('Fehler '+r.status));
    if(!DRAFT||DRAFT.id!==id) return; const o=j.json||{}, gef=[];
    const setz=(k,val,immer)=>{ if(val==null||String(val).trim()==='') return; if(immer||DRAFT[k]==null||String(DRAFT[k]).trim()===''){ DRAFT[k]=val; gef.push(FELDNAMEN[k]||k); } };
    if(ARTEN.some(x=>x[0]===o.art)) setz('art',o.art,true);
    if(o.sparte) setz('sparte',String(o.sparte),true);
    for(const k of ['anbieter','vnr','knr','zaehler','malo','mref','kuendigung','laufzeit','iban','notiz']) setz(k,o[k]?String(o[k]).trim():'');
    if(o.iban) DRAFT.iban=String(DRAFT.iban||'').replace(/\s+/g,'').toUpperCase();
    if(objekte.some(x=>x.kz===o.obj)){ setz('obj',o.obj); const ob=objekte.find(x=>x.kz===DRAFT.obj); if(ob&&ob.ges&&!DRAFT.ges) DRAFT.ges=ob.ges; }
    if(GES.includes(o.ges)) setz('ges',o.ges);
    for(const k of ['start','ende']) if(/^\d{4}-\d{2}-\d{2}$/.test(String(o[k]||''))) setz(k,o[k]);
    if(RH.includes(o.rhythmus)) setz('rhythmus',o.rhythmus,true);
    const bt=typeof o.betrag==='number'?o.betrag:parseNum(o.betrag); if(bt!=null&&bt!==0) setz('betrag',Math.abs(bt));
    PDFV=Object.assign(PDFV,{lade:false,gefuellt:gef}); render(); toast(gef.length?gef.length+' Angaben aus dem PDF übernommen.':'Im PDF wurden keine neuen Angaben gefunden.'); }
  catch(e){ PDFV=Object.assign(PDFV||{},{lade:false,fehler:'Auslesen nicht möglich: '+(e.message||e)+' – das PDF wird trotzdem beim Speichern abgelegt.'}); render(); } }
/* Ablage: im Objektordner unter 03 Verträge (Themenordner), ohne Objekt in der OS-Ablage */
const THEMA={Strom:'Strom',Gas:'Gas','Wärme':'Heizung',Frischwasser:'Frischwasser',Abwasser:'Schmutzwasser','Müll':'Müll','Internet/Telefon':'Internet',Grundbesitzabgaben:'Grundsteuer'};
const pdfSafe=s=>String(s||'').replace(/[\\/:*?"<>|#%]/g,'_').replace(/\s+/g,' ').trim();
async function pdfAblegen(v){ const P=PDFV&&PDFV.id===v.id?PDFV:null; if(!P||!P.datei) return null;
  const datum=v.start||heute(), name=pdfSafe((v.obj||v.ges||'WT')+'_'+(v.anbieter||'Vertrag')+'_'+datum+'_Vertrag '+(v.sparte||v.art||''))+'.pdf';
  const daten=P.b64||await b64(P.datei), tok=await osTok(), api=async body=>{ const r=await fetch('/api/onedrive',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(body)}); const j=await r.json().catch(()=>null); if(!j||j.error) throw new Error((j&&j.error)||'OneDrive nicht erreichbar.'); return j; };
  if(v.obj){ try{ const ob=(await api({aktion:'objektbasis',kz:[v.obj]})).objekte||{}, x=ob[v.obj];
      if(x){ const top=(x.top||[]).find(n=>/^03\s*Vertr/i.test(n))||'03 Verträge', th=v.art==='Versicherung'?'Versicherung':THEMA[v.sparte]||'';
        const it=(await api({aktion:'hochladen',pfad:x.basis+'/'+top+(th?'/'+th:''),name,daten,typ:'application/pdf'})).item;
        return {id:it.id,n:it.name||name,t:'Vertrag',d:datum}; } }catch(e){ toast('OneDrive: '+(e.message||e)+' – PDF wird in der OS-Ablage gespeichert.'); } }
  const pfad='vertraege-pdf/'+v.id+'/'+Date.now()+'_'+name.replace(/[^A-Za-z0-9._-]+/g,'_');
  const {error}=await window.osSupabase.storage.from('vertraege').upload(pfad,P.datei,{contentType:'application/pdf',upsert:true}); if(error) throw new Error('Ablage nicht möglich: '+error.message);
  return {id:'sb:'+pfad,n:name,t:'Vertrag',d:datum}; }
document.addEventListener('change',e=>{ if(e.target.id==='vt-pdf'){ const f=e.target.files[0]; e.target.value=''; if(f) pdfLesen(f); } });
document.addEventListener('dragover',e=>{ const z=e.target.closest&&e.target.closest('#vt-dz'); if(z){ e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave',e=>{ const z=e.target.closest&&e.target.closest('#vt-dz'); if(z) z.classList.remove('over'); });
document.addEventListener('drop',e=>{ const z=e.target.closest&&e.target.closest('#vt-dz'); if(!z) return; e.preventDefault(); z.classList.remove('over'); const f=e.dataTransfer.files[0]; if(f) pdfLesen(f); });
const neuId=()=>'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function speichern(liste){ L=liste; render(); return db.doc('stamm/vertraege').set({liste,geaendert:heute()}).catch(e=>toast('Speichern fehlgeschlagen: '+(e.message||e))); }
function parseNum(s){ s=String(s||'').trim().replace(/\s|€/g,''); if(!s) return null; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=Number(s); return isFinite(n)?n:null; }
document.addEventListener('click',e=>{ const t=e.target.closest('button,tr,.drw-bg'); if(!t) return; const d=t.dataset;
  if(d.art!==undefined){ F.art=d.art; saveF(); render(); return; }

    const i=L.findIndex(x=>x.id===v.id); const neu=L.slice(); if(i>=0) neu[i]=v; else neu.push(v);
    DRAFT=null; SEL=v.id; speichern(neu); toast('Vertrag gespeichert.'); return; }
  if(d.del){ if(t.dataset.sure!=='1'){ t.dataset.sure='1'; t.textContent='wirklich löschen?'; return; } const id=DRAFT.id; DRAFT=null; SEL=null; speichern(L.filter(x=>x.id!==id)); toast('Gelöscht.'); return; } });
document.addEventListener('change',e=>{ const t=e.target;
  if(t.id==='f-ges'){ F.ges=t.value; saveF(); render(); return; }

(async()=>{
  try{ const user=await claude.use('user'); if(user&&typeof user.can==='function'){ const c=await user.can('data.write'); if(c===false) canWrite=false; } }catch(e){}
