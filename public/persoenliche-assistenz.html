<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persönliche Assistenz</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f7f9;--surf:#fff;--surf2:#f1f3f6;--line:#e6e8ec;--text:#1c2024;--muted:#6b7280;--dim:#4b5563;--accent:#185fa5;--green:#1f7a4d;--red:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
.hdr{background:var(--surf);border-bottom:1px solid var(--line);padding:14px 22px;position:sticky;top:0;z-index:20}
.hdr-title{font-size:17px;font-weight:700}.hdr-sub{font-size:11.5px;color:var(--muted)}
.wrap{max-width:1000px;margin:16px auto;padding:0 16px 60px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.prac{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--surf2);border-radius:10px;padding:12px 14px;margin:10px 0}
.prac .l{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700}
.prac .v{font-size:14px;font-weight:600}
.btn{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surf2);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:10px;text-transform:uppercase;color:var(--muted);background:var(--surf2)}
td input,td select{width:100%;font:inherit;font-size:13px;padding:5px 7px;border:1px solid transparent;border-radius:6px;background:transparent}
td input:hover,td select:hover{border-color:var(--line)}td input:focus,td select:focus{outline:none;border-color:var(--accent);background:var(--surf)}
.st-geplant{color:#185fa5}.st-wahrgenommen{color:#1f7a4d}.st-abgesagt{color:#c0392b;text-decoration:line-through}
.abtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}.abtn:hover{color:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2024;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:50}.toast.show{opacity:1}
</style></head><body>
<div class="hdr"><div class="hdr-title">🧑‍⚕️ Persönliche Assistenz</div><div class="hdr-sub">Geschäftsführer · persönliche Termine &amp; Organisation</div></div>
<div class="wrap">
  <div class="card">
    <h2>🦴 Osteopath</h2>
    <div class="prac">
      <div><div class="l">Behandler</div><div class="v">Ralf Braun</div></div>
      <div><div class="l">Ort</div><div class="v">Undenheim</div></div>
      <div style="margin-left:auto"><a class="btn btn-accent" href="https://praxisarchiv24.de" target="_blank" rel="noopener">📅 Akuttermin buchen ↗</a></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px">
      <span style="font-size:12px;color:var(--muted)">Termine erfassen und nachhalten</span>
      <button class="btn btn-accent" onclick="addRow()">+ Termin</button>
    </div>
    <div class="scroll"><table id="tbl"><thead><tr>
      <th style="width:140px">Datum</th><th style="width:100px">Uhrzeit</th><th>Anlass</th><th style="width:150px">Status</th><th>Notiz</th><th style="width:36px"></th>
    </tr></thead><tbody></tbody></table></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://jqzxctfqvcwbctpjksvg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxenhjdGZxdmN3YmN0cGprc3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzA0MzIsImV4cCI6MjA5NzcwNjQzMn0.RKIbZxJdusKWWPjBJqlxZ8e1m8So02UslOg55YRsn3o');
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
const STATI=['geplant','wahrgenommen','abgesagt'];
let ROWS=[];
async function save(id,field,val){const v=(val&&val.trim())?val.trim():null;const res=await sb.from('pa_osteopath').update({[field]:v}).eq('id',id);if(res.error){toast('Fehler: '+res.error.message);return;}const r=ROWS.find(x=>x.id===id);if(r)r[field]=v;if(field==='status')render();else toast('Gespeichert ✓');}
async function addRow(){const r=await sb.from('pa_osteopath').insert({status:'geplant',datum:new Date().toISOString().slice(0,10),pos:ROWS.length}).select();if(r.error)return toast(r.error.message);ROWS.unshift(r.data[0]);render();toast('Termin angelegt');}
async function del(id){if(!confirm('Termin löschen?'))return;const res=await sb.from('pa_osteopath').delete().eq('id',id);if(res.error)return toast(res.error.message);ROWS=ROWS.filter(x=>x.id!==id);render();}
function render(){
  const list=[...ROWS].sort((a,b)=>String(b.datum||'').localeCompare(String(a.datum||'')));
  $('tbl').querySelector('tbody').innerHTML=list.map(r=>`<tr>
    <td><input type="date" value="${esc(r.datum)}" onchange="save('${r.id}','datum',this.value)"></td>
    <td><input value="${esc(r.uhrzeit)}" placeholder="z. B. 10:30" onchange="save('${r.id}','uhrzeit',this.value)"></td>
    <td><input value="${esc(r.anlass)}" placeholder="Anlass / Beschwerde" onchange="save('${r.id}','anlass',this.value)"></td>
    <td><select class="st-${(r.status||'geplant').replace(/\\s/g,'')}" onchange="save('${r.id}','status',this.value)">${STATI.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></td>
    <td><input value="${esc(r.notiz)}" placeholder="Notiz" onchange="save('${r.id}','notiz',this.value)"></td>
    <td><button class="abtn" onclick="del('${r.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:18px">Noch keine Termine. Mit „+ Termin" anlegen.</td></tr>';
}
async function load(){const res=await sb.from('pa_osteopath').select('*').order('datum',{ascending:false});ROWS=res.error?[]:(res.data||[]);render();}
load();
</script>
</body></html>
